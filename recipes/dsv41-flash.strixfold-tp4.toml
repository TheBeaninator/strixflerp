"attn.indexer-score/kv-fp4-e2m1/bf16"      = "kernel.strixfold.indexer_score"
"hc.mix-prefill/dsv41-mhc-f32/bf16"        = "kernel.strixfold.mhc_mix"
"moe.gate-logits/f16/bf16-f32"             = "kernel.strixfold.moe_gate"
"pos.rope-heads/-/bf16.hip"                = "kernel.strixfold.rope_heads"
"attn.sparse-sink/kv-fp4-e2m1/bf16"        = "kernel.strixfold.sparse_attn"
"draft.markov/f16/bf16"                    = "kernel.strixfold.triton_kit"
"hc.mix-decode/dsv41-mhc-f32/bf16"         = "kernel.strixfold.triton_kit"
"kvcache.store/fp4-e2m1/bf16"              = "kernel.strixfold.triton_kit"
"moe.router/-/bf16-f32"                    = "kernel.strixfold.triton_kit"
"norm.rmsnorm/-/bf16.triton-bits"          = "kernel.strixfold.triton_kit"
"pos.rope-heads/-/bf16.triton-bits"        = "kernel.strixfold.triton_kit"
"collective.interface/-/-"                 = "runtime.strixfold.coll"
"collective.allgather-nccl/-/f32"          = "runtime.strixfold.coll_nccl"
"collective.allgather-rdma/-/f32"          = "runtime.strixfold.coll_rdma"
"collective.allgather-tcp/-/f32"           = "runtime.strixfold.coll_tcp"
"text.chat-template-strixfold/jinja/-"     = "runtime.strixfold.core"
"text.tokenizer-strixfold/-/-"             = "runtime.strixfold.core"
"speculation.draft/dspark/bf16"            = "runtime.strixfold.dspark_draft"
"executor.host/hip/-"                      = "runtime.strixfold.engine_host"
"device.facade/hip/-"                      = "runtime.strixfold.gpu_facade"
"grammar.matcher-strixfold/-/-"            = "runtime.strixfold.grammar"
"verify.kit-manifest/hsaco/-"              = "runtime.strixfold.kit"
"executor.lane-backend/-/-"                = "runtime.strixfold.lanes"
"cache.prompt-strixfold/-/-"               = "runtime.strixfold.prompt_cache"
"sample.next-token/-/f64"                  = "runtime.strixfold.sampling"
"tool.checkpoint-cli/-/-"                  = "tool.strixfold.checkpoint_cli"

# The build graph itself and the TP4 overlays. Rank 1..3's process (tf-dsv41-lanes), the layer gate (tf-dsv41-layer)
# and the kit tool (tf-hip-kit) are installed by the same step next to the server; the kit goes to
# zig-out/native-hip/share/tensorfold/hip/gfx1151/dsv41.
[include]
modules = ["tool.strixfold.zig_build",
            "executor.strixfold_tp4.dsv41",
            "executor.strixfold_tp4.dsv41_vision",
            "format.strixfold_tp4.exl3",
            "kernel.strixfold_tp4.aux_markov",
            "kernel.strixfold_tp4.dense_bf16",
            "kernel.strixfold_tp4.dsv41_abi",
            "kernel.strixfold_tp4.exl3",
            "kernel.strixfold_tp4.exl3_mlp",
            "kernel.strixfold_tp4.reap",
            "kernel.strixfold_tp4.route_rec",
            "kernel.strixfold_tp4.sparse_attn",
            "kernel.strixfold_tp4.triton_kit",
            "kernel.strixfold_tp4.vision",
            "runtime.strixfold_tp4.coll",
            "runtime.strixfold_tp4.coll_nccl",
            "runtime.strixfold_tp4.coll_rdma",
            "runtime.strixfold_tp4.coll_tcp",
            "runtime.strixfold_tp4.core",
            "runtime.strixfold_tp4.dspark_draft",
            "runtime.strixfold_tp4.engine_host",
            "runtime.strixfold_tp4.gpu_facade",
            "runtime.strixfold_tp4.kit",
            "runtime.strixfold_tp4.lanes",
            "runtime.strixfold_tp4.prompt_cache",
            "runtime.strixfold_tp4.sampling",
            "serve.strixfold_tp4.http",
            "tool.strixfold_tp4.dsv41_hip",
            "tool.strixfold_tp4.zig_build"]

[binaries]
"strixflerp-dsv41-flash.strixfold-tp4" = { main = "serve.strixfold.http", entry = "zig/src/server/main.zig" }

[deploy]
topology = "tp4"

# tools/flerp-stage.py <this recipe> <dir>: the deploy directory as restore-tfp.sh stage makes it (git archive of
# tools/dsv41-hip + the native-hip install + the Pillow of TF_PIL_PATH, SHA256SUMS, DEPLOY.json), from this build.
[deploy.stage]
commit    = "72c0f083fca18f80fcf73b2358cf8235c3dd5363"
reference = "/data/pod/plans/strixfold/deploy-stage/72c0f083fca1"
collation = "en_US.UTF-8"     # control-node's LANG when restore-tfp.sh sorted the reference's SHA256SUMS

[deploy.stage.copy]
"native-hip"      = "tree:zig-out/native-hip"
"tools/dsv41-hip" = "tree:tools/dsv41-hip"
"pylib"           = "input:pylib"

# Pillow 12.3.0 for the server's picture child (TF_PIL_PATH, pod card 9757a35411): a third-party wheel, not catalogue
# source; recorded by hash and copied from where 9757a35411 installed it (equal to every stage's pylib since 03d67fc1).
[deploy.stage.inputs.pylib]
where      = "/data/pod/plans/9757a35411/pylib"
sha256sums = "docs/harvest/data/strixfold_tp4/pylib-SHA256SUMS"

[gate]
runner    = "gate/dsv41_tp4.py"
criterion = "token-identity"      # ids and prompt-logits sha256 of a four-node run equal to the deployed 72c0f083fca1's
