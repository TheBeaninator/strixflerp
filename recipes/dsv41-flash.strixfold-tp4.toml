"format.device-view/exl3/-"                = "format.strixfold.exl3"
"format.reader-strixfold/safetensors/-"    = "format.strixfold.safetensors"
"executor.model/deepseek-v4.1-flash/exl3"  = "executor.strixfold.dsv41"
"attn.indexer-topk/-/i64-keys"             = "kernel.strixfold.aux"
"collective.device-proxy/-/-"              = "kernel.strixfold.coll_proxy"
"linear.dense/bf16/bf16-f32.row-invariant" = "kernel.strixfold.dense_bf16"
"linear.decode/exl3/f16-f32.row-invariant" = "kernel.strixfold.exl3"
"linear.prefill/exl3/f16-f32"              = "kernel.strixfold.exl3"
"moe.experts-decode/exl3/bf16"             = "kernel.strixfold.exl3"
"moe.experts-prefill/exl3/bf16.jobs"       = "kernel.strixfold.exl3_pf_experts"
