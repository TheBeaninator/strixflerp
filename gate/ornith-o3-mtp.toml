# ORNITH-O3 step one: how often the checkpoint's own MTP head drafts the right next token, before anyone builds
# speculative decoding (survey: agent 2026-11-13, "Which strixflerp catalogue techniques could speed up
# Ornith-1.5 397B", sections 0.1, 2A, 3.1, 4 O3). Committed BEFORE any GPU run of this experiment; not edited to turn a
# failure into a pass (an amendment, if any, is added below in its own commit with its date and reason).
# Tools: catalog/flerp/executor/qwen35moe .../flerp/qwen35moe/mtp_head.{hpp,cpp} (the MTP forward),
# catalog/flerp/tool/qwen35moe_generate .../mtp_probe.{hpp,cpp} (the probe: --mtp-probe DEPTH, off by default),
# gate/ornith_o3_mtp.py (prompts, runs, the numpy reference, llama.cpp comparison, judge), gate/ornith_o3_mtp_run.sh
# (GPU jobs through tools/gpu-queue.sh, control-node's GPU only; no worker, no hold, no multi-node window).

[reference]
# What the forward matches, read before any code was written.
llama_cpp = """llama.cpp src/models/qwen35moe.cpp graph_mtp (LLM_GRAPH_TYPE_DECODER_MTP, "draft head for Qwen3.5/3.6
MoE"; the copy on control-node /data/projects/llama-rdma-src, lines 550-741) and common/speculative.cpp
common_speculative_impl_draft_mtp (lines 1328-1760), the code behind /opt/llama's --spec-type draft-mtp:
  h       = the target's last block output after output_norm ("h_nextn", qwen35moe.cpp:229-233: post-norm feeds both the
            LM head and the MTP seed)
  x       = concat(enorm(embed(tok)), hnorm(h))              (enorm first, then hnorm; ggml_concat dim 0)
  y       = eh_proj . x                                       ([2H] -> [H])
  y      += attn_output(sigmoid(gate) * attention(rope(q_norm(q)), rope(k_norm(k)), v))   on attn_norm(y); the block's
            own KV cache, every position of the conversation
  y      += moe(attn_post_norm(y))      routed softmax top-k with renormalised weights + sigmoid(gate_shexp) * shared
  h_out   = shared_head_norm(y)          (output_norm when absent); logits = output . h_out (nextn.shared_head_head
            and nextn.embed_tokens when the file has them; neither file here has them)
  pairing: (h_p, x_{p+1}) at MTP position p+1; position 0 carries (zero h, x_0) (speculative.cpp process(): the batch's
            embeddings shifted right by one, pending_h zero at the start)
  chain:   draft i+1 = MTP(draft i, h_out of draft i) at position pos0 + i + 1; its KV rows are overwritten when the
            real rows arrive (attention reads positions <= the current one only)."""
gufo = "catalog/gufo/runtime/mtp mtp_reference.cpp / hip/mtp/executor.cpp: the same order (enorm then hnorm, eh_proj, block, shared_head_norm, head) with a dense FFN and blk.64; the HIP launches are reused, the FFN is executor.flerp.qwen35moe's LaunchMoeFfn"

[proxy]
model    = "/data/models/qwen36-35b-a3b/Qwen3.6-35B-A3B-Q4_K_M.gguf"   # NVMe; blk.40 = full attention + MoE + nextn.{eh_proj,enorm,hnorm,shared_head_norm} (gate/results/qwen36-35b-a3b.census/summary.md)
why      = "the same architecture (qwen35moe) with an MTP block on NVMe, on one GPU; Ornith's own numbers need the 4-node window ([ornith] below)"
context  = 2048
max_tokens = 256
depth    = 3
# chat-rendered, thinking off (assistant turn opened with an empty <think></think>), so the drafted text is the answer
code  = ["Write a Python function that parses an ISO-8601 duration such as P3DT4H5M into a number of seconds, with a few unit tests.",
