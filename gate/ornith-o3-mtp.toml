plan = """gate/ornith_p5.py stage --with-mtp, then gate/ornith_p5.py run --steps w4 --mtp-probe 3 (world 4, cuts
0/15/30/45/60, graph on): rank 3 (C, blocks 45-60 + head) also loads blk.60 (3.98 GiB) and a copy of token_embd
(0.53 GiB) from its /cache/flerp-p5 staged file, takes the same ids files as rank 0, and logs one `mtp_probe` event a
prompt; ids are produced exactly as without the flag."""
