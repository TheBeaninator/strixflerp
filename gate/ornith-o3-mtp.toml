[criteria]
# 1. Off by default, ids unchanged. For every one of the 8 prompts, the ids of the probe run (--mtp-probe 3) equal,
#    token for token, the ids of the same binary without the flag (the engine's own QwenGpuExecutor::Generate).
# 2. Unit check against a reference. gate/ornith_o3_mtp.py ref recomputes in numpy (float64, weights dequantized
#    by gguf-py from the same file) the MTP forward of [reference] llama_cpp for every step the probe dumped on prompt
#    0 (the whole prompt's rows, then the first 8 frontiers with their depth-2 and depth-3 chain steps), from the
#    probe's own inputs (token, the target's pre-norm row or the previous step's h_out, position), with its own KV
#    rows written and overwritten by position as the probe's are. Pass when
#      a. every step's h_out has cosine >= 0.999 with the reference's;
#      b. on every logits step where the reference's top-1 leads its top-2 by >= 0.5, the probe's argmax equals the
#         reference's; and the probe's argmax equals the reference's on >= 90% of all logits steps.
# 3. Against llama.cpp. /opt/llama/llama-server --spec-type draft-mtp --spec-draft-n-max 1 --spec-draft-p-min 0,
#    greedy, the same 8 prompts as token ids, 256 tokens: its draft_n_accepted / draft_n over all prompts, against the
#    probe's d1 acceptance simulated on the same schedule (a round at frontier f drafts one token; the next round
#    starts at f + 2 on a hit, f + 1 on a miss). Pass when they differ by at most 0.05 (absolute). The two engines'
#    greedy texts may diverge (different kernels), so this checks the semantics, not the numbers to the token.
# Recorded, not criteria: per depth k = 1..3 and per class (code, prose, all): marginal acceptance P(d_k = x_{f+k}),
# chain acceptance P(d_1..d_k all right) and conditional a_k = chain_k / chain_{k-1}; expected tokens per round at
# k = 1, 2, 3 (1 + chain_1 + .. + chain_k); MTP ms per draft step (the 35B's, not Ornith's); llama.cpp's
# n_max 3 acceptance (draft_n_accepted / draft_n) beside the probe's simulated on that schedule.
# Decision rule of the survey (O3 gate), applied to Ornith's numbers only: continue with O3 when a1 >= 0.6 on code.
# The 35B numbers are a proxy and decide nothing.

[ornith]
