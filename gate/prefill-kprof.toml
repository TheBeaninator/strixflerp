# PREFILL-KPROF (card 9506f4f116, parent PREFILL-ORNITH 8ef0a645e7): where the 35B proxy's arm-G prefill time goes, per
# kernel class, for one 4,096-row chunk at depth 0; then the port of the top-ranked catalog idea (its criteria are an
# amendment committed before the port's first GPU run). Committed before any hardware run. Shape: docs/EXPERIMENTS.md.

[hypothesis]
# Predictions on the card (comment of 2026-11-14T09:38Z), from FLOPs per kernel x the K microbench rates.
prediction = "experts (routed + shared) ~44 % of the chunk (640 ms, ~14.5 TFLOPS), dense projections ~31 % (445 ms, ~23.7), GDN core ~8 % (110 ms), attention ~4 % (62 ms, ~22), norms + other ~13 % (190 ms); the bottom-up sum (~1.45 s) under-explains the measured ~2.0 s"
confirmed_at = "experts are the largest class at 35-55 % of the chunk's GPU time"
refuted_below = "any non-expert class takes more GPU time than the experts"

[criteria.profile]
# The profile is valid (its numbers are used for the ranking) only if all of these hold; nothing here is a speed bar.
rc = "both processes exit 0"
reps = "3 measured reps after one warm-up rep, each exactly one EmbeddingLookup launch (one 4,096-row chunk)"
spread = "every class with >= 5 % share: (max - min) / median of its 3 reps <= 0.10"
overhead = "median first_token_s under rocprofv3 <= 1.15 x the unprofiled median (else shares are reported, absolute ms flagged)"

[resources]
nodes   = "control-node GPU via tools/gpu-queue.sh (waits for a free GPU, never kills or forces over another holder); no idle holds (coordinator's decision as PM, 2026-11-14: K is not a PLACE node yet)"
hold    = "none: queued GPU job, ~10 min expected, TTL 15 min"
weights = "21.7 GB Qwen3.6-35B-A3B-Q4_K_M.gguf already on control-node NVMe /data/models/qwen36-35b-a3b (pod-weights; the G champion's copy), staged before the hold"
loads   = "2 because the profiled process and the unprofiled control must be separate processes (rocprofv3 wraps the whole process); every rep is measured inside its process"
reps    = "3 because the G champion's run-to-run spread is under 5 %, so 3 bounds the per-class share well under the 10 % ranking resolution"
shares  = "the pod's own pod-gpu jobs and other gpu-queue lanes wait their turn; no worker, FreeFitty slot or K touched"
cleanup = "the job's processes exit and release the GPU; no placements; control-node doctor green afterwards"

[monitor]
milestones = "started within 60 min of queueing; done 15 min after start; watched every <= 15 min"
stop_rule  = "stop at the first fault; nothing to release beyond the process"

