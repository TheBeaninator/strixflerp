[port.hypothesis]
prediction = "routed experts 527 -> ~420 ms at 4,096 rows (1.25x: tile fill at BM 128 is 0.64, live 16-row tiles 0.68 of all, and the routed kernel's 15.7 TFLOPS against the full-tile dense 23.6 is that fill); the chunk ~5 % faster"
confirmed_at = "routed experts <= 0.85 x p2 (<= 448 ms)"
refuted_below = "routed experts > 0.95 x p2 (> 500 ms)"
[port.criteria]
P1 = "identity: in one load (gate/prefill_kprof.py port), for each of the 8 fidelity prompts and the 16,384-id prompt, every recorded step's logits sha256 and the generated ids of every L rep equal G's (rep 1); any mismatch fails"
P2 = "speed (same process, median of 3 interleaved reps): L tok/s >= 1.00 x G at 2,048 tokens and >= 1.03 x G at 16,384"
P3 = "kernel: profile run p3 (arms L, same method as p2): experts_routed median <= 0.90 x p2's 526.7 ms"
P4 = "ISA (tools/isa-scan.py, rocm-7.2.4 and therock 10.x): 0 scratch in every GroupedKernel<.., true> instantiation, and none needs more VGPRs than its LIVE = false twin by enough to lose a wave per SIMD"
champion = "only if P1-P4 all pass: flerp champion propose for the prefill area; never promoted by hand"
[port.resources]
nodes = "control-node GPU via tools/gpu-queue.sh; two jobs (port, p3 profile); no idle holds"
hold = "none: queued GPU jobs, ~6 min expected, TTL 10 min each"
weights = "the same 21.7 GB NVMe copy, staged before the hold"
loads = "1 per process (port, p3), every arm and rep inside it"
reps = "3 interleaved because P2's smallest bar is 3 % and the per-rep spread was under 5 %"

