# ORNITH-O3 step two: speculative decoding with the checkpoint's own MTP head in the pipeline-parallel qwen35moe
# executor (survey: agent 2026-11-13, "Which strixflerp catalogue techniques could speed up Ornith-1.5 397B",
# sections 2A, 3.1 option B, 4 O3; step one gate/ornith-o3-mtp.toml PASS, Ornith acceptance in
# gate/results/ornith-p5-confirm/summary.md). Owner approved building it on 2026-11-13.
# Committed BEFORE any GPU run of this experiment; never edited to turn a failure into a pass (an amendment, if any, is
# its own commit with its date and reason). Runner gate/ornith_o3_spec.py; GPU jobs gate/ornith_o3_spec_run.sh through
# tools/gpu-queue.sh on control-node's GPU only. No worker, no hold, no lease, no multi-node window.

[design]
# Option B of survey 3.1: k drafts verified as k + 1 single-row decode frames sent back to back down the pipe, so the
# idle stages of a single stream are used and every row runs the existing one-row decode graph (bit-exact by
# construction: the target computes every kept position exactly as a drafts-off decode step does).
#   - the last stage loads the file's MTP block (flerp/qwen35moe/mtp_head.hpp) and, through draft_round.hpp, drafts
#     at every frontier: (h_{f-1}, x_f) at MTP position f with logits = d_1, then chain steps; the MTP KV of every kept
#     position is the pair (target row, kept token), written as the frame that verifies it runs ("refill"), as the
#     O3 probe wrote it at every position;
#   - rank 0 sends the pending token and the k drafts as k + 1 kDecode frames (relay flag kSpecRound, frame j of
#     k + 1 in the flags, the input id in `token`); the last stage runs the target on frame j only while the chain is
#     unbroken (draft j equals the target's argmax of frame j - 1; skipped frames are rejected anyway), and answers
#     once a round with the ids it keeps (d_1..d_n, then the target's own token after them) and the next drafts;
#   - verify is greedy: keep the longest prefix where draft j equals the target's argmax of frame j - 1 (GPU argmax,
#     lowest id on a tie, exactly the token a drafts-off decode step returns);
#   - every stage keeps a ring of k + 1 recurrent (GDN conv + delta) states, slot = (position - first decode
#     position) mod (k + 1): frame at position p reads slot p and writes slot p + 1 (the kernels' diverging-IO path,
#     no copy); a keep of n is the next round starting at position p0 + n + 1, which reads the slot frame n wrote; the
#     KV cache is truncated by position (attention reads positions <= its own; rejected rows are overwritten). One
#     captured decode graph per (read slot, write slot) pair. Drafts off: no ring, the origin's in-place state and its
#     single graph, unchanged;
#   - draft depth: --run-specs K = fixed k drafts a round; vK = at most K, cut by the value-aware rule of Crucible
#     draft_value.h (a draft is computed / kept while Q_{d+1} * T(d) > E(d) * (T(d+1) - T(d)), T(d) = base_ms +
#     d * row_ms + d * mtp_ms for option B, p from the MTP top-1/top-2 margin bucket calibrated by the request's own
#     acceptance); the default k is 2;
#   - ABI: executor.flerp.qwen35moe_abi reports caps.max_draft > 0 with FLERP_CAP_DRAFT_HELD | FLERP_CAP_KEEP_PREFIX
#     when its last stage has the draft head.

[proxy]
model      = "/data/models/qwen36-35b-a3b/Qwen3.6-35B-A3B-Q4_K_M.gguf"   # control-node NVMe; MTP block blk.40
why        = "the same architecture, stage driver and executor family with an MTP block, on one GPU; Ornith needs the 4-node window ([ornith])"
world      = 4
cuts       = "even"            # the stage plan's [0, 10, 20, 31, 40]
transport  = "tcp 127.0.0.1, four rank processes on control-node's one GPU (as ORNITH-O1O2)"
context    = 4096
max_tokens = 256
reply      = "token"
graph      = "on"
# prompts: P5's four (gate/results/qwen36-35b-a3b.flerp-moe/prompt-ids.json: bridge 21, code 20, rivers 18, records
# 1,808 ids) and O3's eight (gate/results/ornith-o3-mtp/prompts.json: code0-3, prose0-3), 12 in all, 256 tokens each
prompt_sets = ["gate/results/qwen36-35b-a3b.flerp-moe/prompt-ids.json", "gate/results/ornith-o3-mtp/prompts.json"]
# value-aware costs given to the last rank (ms): Ornith's, so the vK runs exercise the rule as Ornith would use it
draft_costs = "75.2,19.68,4.83"   # base = P5 confirm decode wall; row = stage 3 (the slowest) decode step; MTP draft step
# Two launches; rank 0 --run-specs graph:reply:subchunks:drafts. Drafts off (0) and k = 2 alternate A B A B in each
# launch, in opposite order across launches; k = 1, k = 3 and v3 once a launch.
launches = [
  "on:token:1:0,on:token:1:2,on:token:1:0,on:token:1:2,on:token:1:1,on:token:1:3,on:token:1:v3",
  "on:token:1:2,on:token:1:0,on:token:1:2,on:token:1:0,on:token:1:3,on:token:1:1,on:token:1:v3",
]

[criteria]
# --- identity (the point) ---
# 1. Every rank of every launch exits 0; rank 0 reports one `staged` result per (run spec, prompt): 7 x 12 a launch.
# 2. Drafts on equal drafts off, byte for byte: for every launch and prompt, the ids of the k = 1, k = 2 (both runs),
#    k = 3 and v3 runs equal the ids of that launch's first drafts-off run, every id, same length (256 unless a stop
#    id comes first, as in the drafts-off loop). The two drafts-off runs of a launch are equal, and the drafts-off ids
#    are equal across the two launches.
# 3. Anchors (drafts off has not moved): the drafts-off ids of P5's four prompts equal P1's first 128 ids
#    (gate/results/qwen36-35b-a3b.flerp-moe-placed/equal.json) on their first 128, and the drafts-off ids of O3's eight
#    prompts equal O3's ids (gate/results/ornith-o3-mtp/on.jsonl `generated`).
# --- wiring (the drafts are the head's) ---
# 4. Round accounting, every drafts-on run: the rounds' emitted ids concatenate to the run's ids (before the cut at
#    256 / a stop id); in every round 0 <= accepted n <= proposed k', the first n emitted ids are the round's drafts,
#    and k' <= K (K = the run's fixed k, or v3's cap). Fixed-k runs propose exactly min(K, tokens still wanted) a round.
# 5. Acceptance matches the O3 probe on the same ids: on O3's eight prompts, accepted / proposed of each fixed-k run
#    (k = 1, 2, 3) is within 0.03 of gate/ornith_o3_mtp.py schedule() at n_max = k applied to the probe's own drafts
#    and ids (gate/results/ornith-o3-mtp/on.jsonl; n_max 1: 0.870, n_max 3: 0.659, n_max 2 computed by the judge).
# --- recorded, not criteria ---
# - tok/s: rank 0's decode wall (rounds included) / ids, drafts off against k = 2, A B A B in each launch, and k = 1,
#   k = 3, v3; the four ranks time-share ONE GPU, so the back-to-back frames cannot overlap here as they do on four
#   nodes: a k-draft round costs about k + 1 decode passes of GPU time and this run is expected to be SLOWER with
#   drafts on. It measures the parts: rounds, frames, frames the last stage skipped, rank 0's and the last stage's
#   ms a round outside the target, MTP draft-step and refill-step ms, acceptance per class (code / prose / P5) at
#   each k, v3's chosen depths.
# - the decode graphs captured (one per ring slot pair) and the ring's device bytes per stage.

[projection]
# Labelled projected, never measured, computed by the judge from the numbers above and these Ornith inputs:
ornith_stage_ms = [16.50, 15.35, 15.68, 19.68]   # P5 confirm run 11132252, stage_timing decode_ms_per_step medians, ranks 0-3
ornith_wall_ms  = 75.2                            # P5 confirm decode wall a token (pinned/pageable, full/token medians 75.1-76.8)
ornith_mtp_ms   = 4.83                            # Ornith MTP draft step (with logits), confirm run
ornith_chain    = { code = [0.918, 0.770, 0.597], prose = [0.794, 0.527, 0.312] }   # Ornith chain acceptance k = 1..3
# Model: off-GPU time R = wall - sum(stage) split evenly over the 4 hops (h = R / 4). A round of k' drafts with n kept
# (P(n >= i) = chain_i) is an event simulation: frame j leaves stage s at max(arrival, stage s free) + stage_ms[s];
# the last stage runs frames 0..n only (the rest are skipped) plus a refill step after each kept frame (refill ms =
# ornith_mtp_ms x the 35B's refill / draft-step ratio measured here), then the frontier and k_next - 1 chain steps
# (ornith_mtp_ms each); the reply arrives h later; plus rank 0's and the last stage's per-round host overhead measured
# here on the 35B. tok/s = E[n + 1] / E[round ms] per class, at k = 1, 2, 3; beside the survey's T_B(k) and owner's
# estimate (code ~21, prose ~18 tok/s, best at k = 2).

[ornith]
# The 4-node run: PREPARED, NOT RUN. It needs owner's go and agent's agreement (a window on F, D, A, C).
plan = "gate/results/ornith-o3-spec/ornith-window-plan.md (the exact invocation, staging through PLACE only, duration)"
criteria = """1. every rank exits 0; one `staged` result per (launch, run spec, prompt); 2. on P5's four prompts and O3's
eight, 256 tokens, context 4096: the ids at k = 1, 2, 3 equal the same launch's drafts-off ids byte for byte, and
drafts-off bridge / code / rivers equal P5 run 11121855's ids on their length; 3. round accounting as [criteria] 4.
Recorded: tok/s drafts off against k = 2 A B A B (and k = 1, 3, v3) on Ornith itself, acceptance per class and k,
stage times, MTP draft and refill ms, frames skipped; set beside [projection]."""
