# ORNITH-SUBCHUNK (pod card 6abf28258c, parent PREFILL-ORNITH 8ef0a645e7). Committed BEFORE any GPU run of this card;
# never loosened after it (an amendment, if any, is added below with its date and reason).
#
# What changed (fixes 1-3 of /data/pod/reports/2026-11/ornith-confirm2.md "Fixes, ranked"):
#   - stage_relay SubchunkParts: a prompt call goes down the ring as clamp(rows / 1,024, 1, 16) sub-chunks (auto), or S
#     with a floor of 1,024 rows a part (--subchunk-min-rows / subchunk_min_rows);
#   - rank 0 leaves up to N prompt replies unread across calls (--in-flight / in_flight, default 8), so the ring does not
#     drain between chunk calls (generator) or between the front end's prompt forwards (ABI / serve);
#   - both in the generator's stage driver (Pipeline::Call) and the ABI (qwen35moe_abi Pipeline::Forward).
# Chunk bound FLERP_MAX_PROMPT_BATCH=16384 (G bit-identical at 16K-row chunks, main 44a8c12).
#
# Tool: python3 gate/ornith_subchunk.py gen|serve|judge on control-node (tools/gpu-queue.sh behind gate/loadwait.sh), the
# 35B (Qwen3.6-35B-A3B Q4_K_M, /data/models, pod-weights staged), world 4 over TCP on 127.0.0.1 (four processes, one GPU),
# prefill arm G (FLERP_MOE_GROUPED=1 FLERP_DENSE_GROUPED=1 FLERP_ATTN_GQA=1).

[gen]
prompts = "bridge (21), cut1000 (1,000), p2k (2,048), p3000 (3,000), p16k (16,384: one 16K call), p20k (20,480: a 16K call then 4K, the in-flight window crosses calls), p32k (32,768: two 16K calls)"
specs   = "ref on:full:1:0:0 (one part a call, drain every call: the old flow); auto on:full:auto:0:8; s16 on:full:16:0:8 (the confirm2 count under the floor); tight on:full:auto:0:2 (window under the part count); tok on:token:1:0:0; d3 on:token:auto:3:8 (3 drafts, the in-flight window with ids-carrying chunks)"
context = 33024
tokens  = 32

[serve]
arms    = "ref (executor subchunks=1, in_flight=0), auto (defaults: subchunks auto, subchunk_min_rows 1024, in_flight 8), auto_d3 (auto + drafts 3, front --drafts 3, rank 3 draft_head)"
chats   = "one ~20K-token chat (the repo's docs text, 72,000 characters, as ornith_confirm2's serve step) and the three short serve_drafts3 prompts, 96 tokens each, temperature 0"
context = 32768

[criteria]
U1 = "policy unit test: tests/test_stage_relay.py passes (SubchunkParts: auto clamp, S under the floor, no part under 1,024 rows)"
G1 = "every rank of the generator launch exits 0, no relay_failed event"
G2 = "for every prompt, the ids and every logits sha256 of auto, s16 and tight equal ref's"
G3 = "for every prompt, the ids of tok and d3 equal ref's ids"
G4 = "the flow is what was asked: on p20k and p32k auto's max_in_flight > 1 and <= 8 and its parts per call are [16, 4] / [16, 16]; tight's max_in_flight <= 2; ref's parts are 1 a call and max_in_flight 1; on bridge and cut1000 every spec has 1 part"
S1 = "every serve arm loads, answers every chat with HTTP 200 and ids, and every process exits 0 at the end"
S2 = "auto's and auto_d3's ids and text equal ref's on every chat"
not_judged = "speed: four ranks on one GPU cannot overlap stages, so the pipelining gain is not measurable here; the Ornith window judges it. Times are recorded."
verdict = "PASS if U1, G1-G4, S1, S2 all hold"
