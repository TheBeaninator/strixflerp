# Interface gate: top-20 logits candidates. Swap 2 of docs/INTERFACES.md.
# Pass criteria fixed on 2026-11-10 before the first run. Do not edit them to turn a failure into a pass.
interface = "logits.topk/-/-"
api       = "strix::kernels::logits_topk(logits, rows, ld, n_valid, out, nan, workspace, bytes, stream, mask, mask_words)"
driver    = "gate/interface/drivers/logits_topk"
toolchain = "therock-10.1"

[criteria]
# An exact selection has one correct answer: every provider must give the CPU reference's bytes (LogitCand[20] per
# row, then the NaN words) on every parity case, except the cases marked below:
#   require = "structure"  the NaN flags must be exact; the candidates of a NaN row are reported (the sampler
#                          refuses a flagged row, and the adapter documents that gufo lists a NaN as -inf);
#   require = "report"     +inf logits: gufo maps them to -inf by design; recorded, never a pass criterion.
parity                          = "bit-identical"
adapter_must_launch_foreign     = true
# The allow-mask case and the short-row case are meant to fall back to strixite's kernel: one launch each.
adapter_origin_launches_allowed = 2

[[provider]]
name     = "strixite"
module   = "kernel.strixite.logits_topk"
launches = "2 per call"
[provider.bind]
"logits.topk/-/-" = "kernel.strixite.logits_topk"

[[provider]]
name     = "gufo"
module   = "kernel.flerp.logits_topk_gufo"
wraps    = "kernel.gufo.qwen_sampling"
adapter  = true
launches = "5 per row + 1"
[provider.bind]
"logits.topk/-/-"                  = "kernel.flerp.logits_topk_gufo"
"format.device-view/gguf-kquant/-" = "format.gufo.gguf_kquant"

[[case]]
name = "gauss-1row"
kind = "parity"
dump = "raw"
rows = 1
