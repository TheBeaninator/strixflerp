# Interface gate: decode GEMV on packed GGUF blocks, Q8_0 and Q4_K. Swap 3 of docs/INTERFACES.md.
# Module gate only: no recipe of this repository consumes a GGUF GEMV yet.
# Pass criteria fixed on 2026-11-10 before the first run. Do not edit them to turn a failure into a pass.
interface = "linear.decode/gguf-kquant/f32"
api       = "gufo::hip::LaunchQ8KBlockGEMV(A, type, x, y, M, K, stream)"
driver    = "gate/interface/drivers/gguf_gemv"
toolchain = "therock-10.1"

[criteria]
# Same weight bytes, different summation order and association, so the providers' bits need not agree. The
# criterion is the any-order bound against the exact (double) sum over the real-valued weights:
#   Q8_0  |y - exact| <= (K - 1 + 2) * 2^-24 * sum |d q x|          (two roundings inside a term: d * q * x)
#   Q4_K  |y - exact| <= (2K - 1 + 4) * 2^-24 * sum (|d sc q x| + |dmin m x|)
# (gate/interface/reference/gguf_gemv.hpp). Above 1.0 of the bound fails. Order emulations are recorded.
parity                          = "order-bound"
max_err_over_bound              = 1.0
adapter_must_launch_foreign     = true
adapter_origin_launches_allowed = 0

[[provider]]
name   = "gufo"
module = "kernel.gufo.qwen_linear_decode"
[provider.bind]
"linear.decode/gguf-kquant/f32"    = "kernel.gufo.qwen_linear_decode"
"format.device-view/gguf-kquant/-" = "format.gufo.gguf_kquant"

[[provider]]
name    = "hipfire"
module  = "kernel.flerp.gguf_gemv_hipfire"
wraps   = "kernel.hipfire.gemv_ggml"
adapter = true
[provider.bind]
"linear.decode/gguf-kquant/f32"            = "kernel.flerp.gguf_gemv_hipfire"
"format.device-view/gguf-kquant/-"         = "format.gufo.gguf_kquant"
"format.device-view-hipfire/gguf-kquant/-" = "format.hipfire.loader"

