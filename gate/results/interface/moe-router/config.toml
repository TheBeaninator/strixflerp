# Interface gate: MoE router top-k for Qwen3.8-Flash-Next (512 experts; the checkpoint routes k = 10, the gate
# also runs k = 8, the only k hipfire's kernel is compiled for). Swap 5 of docs/INTERFACES.md.
# Pass criteria fixed on 2026-11-10 before the first run. Do not edit them to turn a failure into a pass.
interface = "moe.router/-/bf16"
api       = "strix::kernels::moe_router(logits, ld = E + 1, M, E, k, nullptr, 0, 0, ids, coef, Act::F32, err, stream)"
driver    = "gate/interface/drivers/moe_router"
toolchain = "therock-10.1"

[criteria]
# Two parts, both required on every parity case that is not marked "report":
#   structure   the selected ids, slot for slot, equal the reference's (largest logit first, an equal logit to the
#               lower expert index); a token with a non-finite logit has ids -1, NaN weights, and the error word
#               names it;
#   weights     each weight within coef_tol_ulps = 32 fp32 rounding steps (relative 1.9e-6) of the exact value:
#               room for an fp32 exp, a sum of k terms and the divisions of any of the three formulations, and
#               far below anything that is not rounding.
# "near-ties" (logits one ulp apart) is reported only: a router that selects on probabilities may see such a
# pair as equal, which the adapters document.
parity                          = "order-bound"
max_err_over_bound              = 1.0
adapter_must_launch_foreign     = true
adapter_origin_launches_allowed = 0

[[provider]]
name     = "strixite"
module   = "kernel.strixite.moe_router"
launches = "1 per call"
[provider.bind]
"moe.router/-/bf16" = "kernel.strixite.moe_router"

[[provider]]
name     = "gufo"
module   = "kernel.flerp.moe_router_gufo"
wraps    = "kernel.gufo.qfn_kernels"
adapter  = true
launches = "2 per call"
[provider.bind]
"moe.router/-/bf16"                = "kernel.flerp.moe_router_gufo"
"format.device-view/gguf-kquant/-" = "format.gufo.gguf_kquant"

[[provider]]
name     = "hipfire"
module   = "kernel.flerp.moe_router_hipfire"
wraps    = "kernel.hipfire.moe"
adapter  = true
launches = "M + 1 per call"
cases    = "^k8-"            # its kernel is compiled for k = 8: the k = 10 cases do not apply to it
[provider.bind]
"moe.router/-/bf16"                 = "kernel.flerp.moe_router_hipfire"
"format.device-view/hipfire-hfq/-"  = "format.hipfire.loader"
"format.device-view/hipfire-mq/-"   = "format.hipfire.loader"
"format.device-view/hipfire-mfp4/-" = "format.hipfire.loader"
"rotate.fwht/-/f32"                 = "kernel.hipfire.norm_rope"

[[case]]
name = "k10-decode-1"
kind = "parity"
dump = "raw"
M = 1
k = 10
pattern = "gauss"
seed = 310
coef_tol_ulps = 32

