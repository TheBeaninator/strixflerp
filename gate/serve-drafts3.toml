# SERVE-DRAFTS3 (card 3f6d20b703): the serve front end and the qwen35moe executor ABI carry k up to 3 drafts a verify,
# and the value-aware v3, as the generator does. Committed BEFORE any GPU run; never edited to turn a failure into a pass.
#
# Mechanism (read first): main.cpp gave flerp_seq_new drafts = (st.drafts > 0), i.e. 1, so abi.cpp opened the seq with
# min(1, executor drafts) and the last stage drafted 1 a round; --drafts 3 then asked flerp_draft_hold(3) of a stage that
# held 1 ("3 drafts asked, the last stage holds 1"). Fix: drafts = st.drafts. v3: executor key draft_value=on (rank 0)
# sends kSpecValue with the session's RESET, so the last stage's value-aware rule (draft_round.hpp) holds <= 3; the ABI's
# hold / verify take what it holds and the decode loop reads the verify's row count (executor.h FLERP_CAP_DRAFT_HELD).
#
# Run: gate/serve_drafts3.py (arms of gate/ornith_config_check.py's launcher: 35B, world 4 over loopback TCP, the serve
# front end rank 0 + flerp-qwen35moe-stage ranks 1-3 on control-node's one GPU, one load an arm, greedy chats of
# ornith_config_check.py's 3 prompts, 96 tokens), through tools/gpu-queue.sh; build: recipe qwen36-35b-a3b.flerp-serve-stage
# in the export /data/projects/strixflerp-ocr. FLERP_MOE_GROUPED unset in every arm.
[arms]
nodrafts = "front --delivery tokens; executor drafts unset"
d1       = "front --delivery tokens --drafts 1; executor drafts=1; rank 3 draft_head=on"
d3       = "front --delivery tokens --drafts 3; executor drafts=3; rank 3 draft_head=on"
v3       = "front --delivery tokens --drafts 3; executor drafts=3 draft_value=on; rank 3 draft_head=on draft_costs=75.2,19.68,4.83"

[criteria]
S1 = "every arm: every process exits 0 and every chat returns ids (no flerp_draft_hold / verify error)"
S2 = "d1, d3 and v3: the ids and text of every chat equal nodrafts' (speculation is lossless), 3/3 prompts"
S3 = "d3: the trace shows verifies with 3 drafts held (some verify's drafts == 3); v3: some verify held fewer than 3 or all 3 (recorded)"
record = "seconds a chat per arm; usage; accepted / drafted from the trace where the front end reports it"

[resources]
nodes   = "control-node's GPU via tools/gpu-queue.sh (control-gpu lease, TTL 75 min); no worker, no window"
hold    = "none: one queued job, ~40 min (4 arms x ~8 min load + chats)"
weights = "the 35B GGUF on control-node NVMe /data/models, already there; no staging"
loads   = "1 per arm (4), because the executor keys are fixed at flerp_open"
reps    = "3 prompts x 96 tokens a arm: identity is exact, one pass answers it"
shares  = "control-node's GPU alone during the job"
cleanup = "the job ends its processes and releases control-gpu on exit"
