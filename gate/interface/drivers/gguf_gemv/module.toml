# Not a catalogue module: the driver program of an interface gate, assembled by gate/interface.py with the
# interface bound to each provider in turn.
id        = "tool.flerp.gate_gguf_gemv"
kind      = "tool"
summary   = "Interface gate driver: linear.decode/gguf-kquant/f32 (Q8_0, Q4_K) through gufo's LaunchQ8KBlockGEMV"

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["driver.cpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/driver.cpp"]
includes  = ["../../common", "../../reference"]
uses      = ["hip-runtime"]
defines   = ["ENGINE_ENABLE_HIP=1"]

[[provides]]
interface = "gate.driver/-/-.gguf-gemv"
api       = "main"
numeric   = "n/a"
regime    = "gate"

[[requires]]
interface = "linear.decode/gguf-kquant/f32"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
