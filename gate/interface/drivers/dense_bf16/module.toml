# Not a catalogue module: the driver program of an interface gate, assembled by gate/interface.py with the
# interface bound to each provider in turn.
id        = "tool.flerp.gate_dense_bf16"
kind      = "tool"
summary   = "Interface gate driver: linear.dense/bf16/bf16 (BF16 in, FP32 out) through strixite's linear_bf16w"

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["driver.cpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/driver.cpp"]
includes  = ["../../common", "../../reference"]
uses      = ["hip-runtime"]

[[provides]]
interface = "gate.driver/-/-.dense-bf16"
api       = "main"
numeric   = "n/a"
regime    = "gate"

[[requires]]
interface = "linear.dense/bf16/bf16"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
