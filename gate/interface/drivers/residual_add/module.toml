# Not a catalogue module: the driver program of an interface gate, assembled by gate/interface.py with the
# interface bound to each provider in turn.
id        = "tool.flerp.gate_residual_add"
kind      = "tool"
summary   = "Interface gate driver: residual.add/-/f32 through strixite's residual_add"

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["driver.cpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/driver.cpp"]
includes  = ["../../common", "../../reference"]
uses      = ["hip-runtime"]

[[provides]]
interface = "gate.driver/-/-.residual-add"
api       = "main"
numeric   = "n/a"
regime    = "gate"

[[requires]]
interface = "residual.add/-/f32"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
