# Interface gate: residual add, fp32, in place. Swap 1 of docs/INTERFACES.md.
# Pass criteria fixed on 2026-11-10 before the first run. Do not edit them to turn a failure into a pass.
interface = "residual.add/-/f32"
api       = "strix::kernels::residual_add(x, y, n, Act::F32, stream)"
driver    = "gate/interface/drivers/residual_add"
toolchain = "therock-10.1"

[criteria]
# One IEEE fp32 add per element has one correct answer: every provider must give the CPU reference's bits on
# every parity case (two NaNs with different payloads count as equal; a NaN against a number does not).
parity                          = "bit-identical"
adapter_must_launch_foreign     = true
adapter_origin_launches_allowed = 0      # no fp32 case may fall back to strixite's kernel

[[provider]]
name   = "strixite"
module = "kernel.strixite.residual"
[provider.bind]
"residual.add/-/f32" = "kernel.strixite.residual"

[[provider]]
name    = "gufo"
module  = "kernel.flerp.residual_add_gufo"
wraps   = "kernel.gufo.qwen_norm_rope"
adapter = true
[provider.bind]
"residual.add/-/f32"               = "kernel.flerp.residual_add_gufo"
"format.device-view/gguf-kquant/-" = "format.gufo.gguf_kquant"

[[provider]]
name    = "hipfire"
module  = "kernel.flerp.residual_add_hipfire"
wraps   = "kernel.hipfire.tensor_ops"
adapter = true
[provider.bind]
"residual.add/-/f32"               = "kernel.flerp.residual_add_hipfire"
"format.device-view/hipfire-mq/-"  = "format.hipfire.loader"
"rotate.fwht/-/f32"                = "kernel.hipfire.norm_rope"

# --- parity: sizes around the launch geometry (block 256), one decode row, and a prefill-sized block -----------
[[case]]
name = "one"
kind = "parity"
n = 1
seed = 11
mix = "special"
[[case]]
name = "block-minus-1"
kind = "parity"
n = 255
seed = 12
mix = "special"
[[case]]
name = "block"
kind = "parity"
n = 256
seed = 13
mix = "special"
[[case]]
name = "block-plus-1"
kind = "parity"
n = 257
seed = 14
mix = "special"
[[case]]
name = "decode-row-4x2560"
kind = "parity"
n = 10240
seed = 15
mix = "plain"
[[case]]
name = "decode-row-special"
kind = "parity"
n = 10240
seed = 16
mix = "special"
[[case]]
name = "odd-1000003"
kind = "parity"
n = 1000003
seed = 17
mix = "special"
[[case]]
name = "alias-y-is-x"
kind = "parity"
n = 10240
seed = 18
mix = "special"
alias = 1
[[case]]
name = "prefill-2048x4x2560"
kind = "parity"
n = 20971520
seed = 19
mix = "special"

# --- bench: one token's residual streams, and a 2,048-token prefill chunk --------------------------------------
[[case]]
name = "bench-decode-4x2560"
kind = "bench"
shape = "n=10240 (1 token x 4 streams x 2560)"
n = 10240
iters = 2000
repeats = 9
[[case]]
name = "bench-prefill-2048x4x2560"
kind = "bench"
shape = "n=20971520 (2048 tokens x 4 streams x 2560)"
n = 20971520
iters = 40
repeats = 9
