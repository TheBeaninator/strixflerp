# Interface gate: the strixw decode GEMV (linear.decode/strixw-q4|q5|q6|q8), strixite's kernels and the flerp panel
# adapters, against the CPU reference gate/interface/reference/strixw_decode.hpp. Card a9ac7b1c0f (FLERP-H-STRIXW-DEC).
# The production Flash-Next decode path: kernel.strixite.linear_q4 / q8 / q56 serve FreeFitty, and the p16 champion
# configs bind kernel.flerp.linear_q4p / q8p. gate/strixw-panel-kernels.toml already compares the panel kernels with
# strixite's on real tensors (byte-equal); this gate adds what neither has had: the CPU reference for both.
# Pass criteria fixed on 2026-11-24 before the first run. Do not edit them to turn a failure into a pass.
interface = "linear.decode/strixw-q4/bf16"
api       = "strix::kernels::linear_q4 / linear_q5 / linear_q6 / linear_q8(x, view, y, M, act, out_act, stream)"
driver    = "gate/interface/drivers/strixw_decode"
toolchain = "therock-10.1"

[criteria]
# The kernels compute s * sum(x q) + m * sum(x) per 16-byte chunk, split-K partial sums meeting in LDS: a different
# order and association from the exact sum, so the providers' bits need not equal the reference's. The criterion is
# the any-order bound against the exact (double) sum over the real-valued weights w = q * s + m:
#   F32 out   |y - exact| <= (2K - 1 + 4) * 2^-24 * sum (|x q s| + |x m|)
#   BF16 out  the same plus one BF16 rounding: + 2^-9 * (|exact| + that bound)
# (gate/interface/reference/strixw_decode.hpp, the driver). Above 1.0 of the bound fails. The panel adapters claim
# strixite's bits (their module.toml numeric lines): the cross-provider comparison of interface.py shows whether
# strixite-q4 / flerp-q4p and strixite-q8 / flerp-q8p dumps are byte-equal; that claim is reported, the bound decides.
parity                          = "order-bound"
max_err_over_bound              = 1.0
adapter_must_launch_foreign     = true
adapter_origin_launches_allowed = 0      # a panel case must never fall back to strixite's row-major kernel

# Five providers, one per kernel module. The three strixite providers bind the same modules (one assembly each:
# the gate builds per provider) and differ in the cases they take; the flerp providers take panel tensors
# (case_args layout = "panel") through strixite's call sites, as the p16 recipe does.
[[provider]]
name      = "strixite-q4"
module    = "kernel.strixite.linear_q4"
cases     = "^q4-"
case_args = { layout = "row" }
[provider.bind]
"linear.decode/strixw-q4/bf16"      = "kernel.strixite.linear_q4"
"linear.decode/strixw-q8/bf16"      = "kernel.strixite.linear_q8"
"linear.decode/strixw-q5/bf16"      = "kernel.strixite.linear_q56"
"linear.decode/strixw-q6/bf16"      = "kernel.strixite.linear_q56"
"format.device-view/strixw-q4/-"    = "format.strixite.q4_device"
"format.device-view/strixw-q5/-"    = "format.strixite.q5_device"
"format.device-view/strixw-q6/-"    = "format.strixite.q6_device"
"format.device-view/strixw-q8/-"    = "format.strixite.q8_device"
"format.host/strixw-q4p16/-"        = "format.flerp.q4panel"
"format.device-view/strixw-q4p16/-" = "format.flerp.panel_device"

[[provider]]
name      = "strixite-q8"
module    = "kernel.strixite.linear_q8"
cases     = "^q8-"
case_args = { layout = "row" }
[provider.bind]
"linear.decode/strixw-q4/bf16"      = "kernel.strixite.linear_q4"
"linear.decode/strixw-q8/bf16"      = "kernel.strixite.linear_q8"
"linear.decode/strixw-q5/bf16"      = "kernel.strixite.linear_q56"
"linear.decode/strixw-q6/bf16"      = "kernel.strixite.linear_q56"
"format.device-view/strixw-q4/-"    = "format.strixite.q4_device"
"format.device-view/strixw-q5/-"    = "format.strixite.q5_device"
"format.device-view/strixw-q6/-"    = "format.strixite.q6_device"
"format.device-view/strixw-q8/-"    = "format.strixite.q8_device"
"format.host/strixw-q4p16/-"        = "format.flerp.q4panel"
"format.device-view/strixw-q4p16/-" = "format.flerp.panel_device"

[[provider]]
name      = "strixite-q56"
module    = "kernel.strixite.linear_q56"
cases     = "^q[56]-"
case_args = { layout = "row" }
[provider.bind]
