cases     = "^q8-"
case_args = { layout = "panel" }
[provider.bind]
"linear.decode/strixw-q4/bf16"      = "kernel.flerp.linear_q4p"
"linear.decode/strixw-q8/bf16"      = "kernel.flerp.linear_q8p"
"linear.decode/strixw-q5/bf16"      = "kernel.strixite.linear_q56"
"linear.decode/strixw-q6/bf16"      = "kernel.strixite.linear_q56"
"format.device-view/strixw-q4/-"    = "format.strixite.q4_device"
"format.device-view/strixw-q5/-"    = "format.strixite.q5_device"
"format.device-view/strixw-q6/-"    = "format.strixite.q6_device"
"format.device-view/strixw-q8/-"    = "format.strixite.q8_device"
"format.host/strixw-q4p16/-"        = "format.flerp.q4panel"
"format.device-view/strixw-q4p16/-" = "format.flerp.panel_device"

# --- cases: per format, decode row counts 1..16 (M == 1 has its own instantiation; 8 rows a pass above), group sizes
# 32 / 64 / 128, BF16 and F32 activations, BF16 -> F32 output (the router form), the smallest panel (N 16, K 128),
# a row count that is not a power of two (N 272) and a wide-range activation; benches at a decode projection.
[[case]]
name = "q4-m1-n16-k128-g32"
kind = "parity"
bits = 4
M = 1
N = 16
K = 128
G = 32
act = "bf16"
out = "bf16"
seed = 600
pattern = "gauss"

