id        = "tool.vllm_strix.container_ops"
kind      = "tool"
summary   = "image and host plumbing: the two-stage Dockerfile (OdinLink userspace build stage, then vLLM rebuilt at 73859fec on the kyuz0 TheRock gfx1151 base with libodl_ar2 compiled by hipcc and the patches applied), build.sh, the one-time host deployment and container-heal.sh, which reconciles a podman container whose DB says Up while crun is dead"
why       = "the Dockerfile is the authoritative order in which every patch in this catalogue is applied and every native is compiled (the -O3 --offload-arch=gfx1151 -fPIC line the compile gate reuses)"
notes     = "Interface tag: none. Read, not run. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/Dockerfile", "container/build.sh", "host/container-heal.sh", "host/deploy.sh"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "shell"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.image-build/-/-"
api       = "Dockerfile, shell"
numeric   = "n/a"
regime    = "podman, both boxes"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "shell: scripts and units, read and not run (host plumbing for the two-box rig)"
