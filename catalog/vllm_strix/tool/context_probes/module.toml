id        = "tool.vllm_strix.context_probes"
kind      = "tool"
summary   = "long-context retrieval probes: three watchwords at 25 / 50 / 75 % of a filler prompt (GLM and DS4), the pool ids that hold them, a context sweep with a MemAvailable watcher on both boxes, and a length / position battery"
why       = "mid-context needles exposed the four stacked indexer bugs that tail needles missed (PATCHES 27); the probes are the acceptance test for any sparse-attention change"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "scripts/ds4ctx.py",
  "scripts/ds4ctxwatch.sh",
  "scripts/ds4len.py",
  "scripts/midneedle.py",
  "scripts/needlepos.py",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.context-probe/-/-"
api       = "python, shell"
numeric   = "pass / fail per needle"
regime    = "6.8K-512K"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
