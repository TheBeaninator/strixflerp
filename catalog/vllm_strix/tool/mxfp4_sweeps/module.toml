id        = "tool.vllm_strix.mxfp4_sweeps"
kind      = "tool"
summary   = "MXFP4 direct-MoE tuning kit: a routing dump of real DS4 decode (moe_dump_ids.py), replay of that routing with per-phase timing (moe_replay.py), and sweeps of the v3 / v4 / v5 kernels by phase and tile at DS4 TP=2 decode shapes with correctness against v1"
why       = "v5 was tuned on recorded routing rather than uniform random ids, which changed the winner (PATCHES 41); a routing-replay sweep is the method to reuse for any MoE kernel tuned for a real model"
notes     = "Interface tag: tool.kernel-bench. The routing dump the origin keeps (scripts/data/ds4_dspark_routing.pt) is binary data and is not harvested. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "scripts/moe_dump_ids.py",
  "scripts/moe_phases.py",
  "scripts/moe_replay.py",
  "scripts/moe_v4sweep.py",
  "scripts/moe_v5phase.py",
  "scripts/moe_v5sweep.py",
  "scripts/moe_versions.py",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.kernel-bench-routing-replay/mxfp4/-"
api       = "python scripts (VSH_MX_DUMP_IDS=prefix records ids)"
numeric   = "timing and max-abs-diff vs v1"
regime    = "decode, E=256"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
