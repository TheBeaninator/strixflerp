id        = "tool.vllm_strix.gpu_sclk"
kind      = "tool"
summary   = "caps or restores the iGPU maximum SCLK through pp_od_clk_voltage (non-persistent), set from glm53_gpu_sclk_max"
why       = "on Strix Halo the CPU and iGPU share one budget, and during decode the CPU was clamped to 2.0 GHz; capping the GPU clock at 2100 MHz freed the CPU and raised tok/s (PATCHES 28.1)"
notes     = "Interface tag: none. Read, not run. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["host/vsh-gpu-sclk.sh"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "shell"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.gpu-clock-cap/-/-"
api       = "vsh-gpu-sclk.sh <MHz|auto>"
numeric   = "n/a"
regime    = "one box"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "shell: scripts and units, read and not run (host plumbing for the two-box rig)"
