id        = "tool.vllm_strix.toolcall_drop_log"
kind      = "tool"
summary   = "pure instrumentation for the tool-call parser: writes the full accumulated generation to VSH_TOOLCALL_DROP_DIR when the parser discards text inside an unterminated reasoning span"
why       = "the fail-open fix was found from these dumps; it is the probe to run whenever a parser and a model disagree"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-toolcall-drop-log.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.parser-drop-log/-/-"
api       = "patch script; env VSH_TOOLCALL_DROP_DIR"
numeric   = "n/a"
regime    = "serve"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
