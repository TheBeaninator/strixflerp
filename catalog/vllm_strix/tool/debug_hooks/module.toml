id        = "tool.vllm_strix.debug_hooks"
kind      = "tool"
summary   = "debug-only patches kept by the origin: dumps of GLM indexer gather / plan / kpool / map / score / top-k (whole-file sparse_indexer and ops replacements), block-table expansion experiments, live indexer-selection diagnostics, a HIP API cost probe, the cgfusion diagnostic and an early int4 MoE GEMV with its test"
why       = "these hooks localised the long-context bugs one stage at a time (PATCHES 27); they show where to tap a sparse indexer to see what it selected"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "container/patches/debug/cgfusion-diag.py",
  "container/patches/debug/dbg-glm-gather-ops.py",
  "container/patches/debug/dbg-glm-idxplan-indexer.py",
  "container/patches/debug/dbg-glm-kpool-sparse_indexer.py",
  "container/patches/debug/dbg-glm-map-sparse_indexer.py",
  "container/patches/debug/dbg-glm-scores-sparse_indexer.py",
  "container/patches/debug/dbg-glm-scores2-sparse_indexer.py",
  "container/patches/debug/dbg-glm-topk-sparse_indexer.py",
  "container/patches/debug/hip_api_cost.py",
  "container/patches/debug/test_moe_gemv.py",
  "container/patches/debug/vsh-idx-bt-expand-indexer.py",
  "container/patches/debug/vsh-idx-bt-expand-v2-indexer.py",
  "container/patches/debug/vsh-kpl-diag.py",
  "container/patches/debug/vsh-kpl-hook.py",
  "container/patches/debug/vsh_moe_int4_gemv.py",
]
authors   = [
  "vLLM project contributors (upstream code; this repo ports or patches it)",
  "davidcanar (vllm-strix-halo)",
]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.debug-hooks/-/-"
api       = "python patch scripts and replacement files (inert by default)"
numeric   = "n/a"
regime    = "debug"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
