id        = "tool.vllm_strix.ds4_probes"
kind      = "tool"
summary   = "DeepSeek-V4 bring-up probes: the Phase-0 battery, decode speed and coherence (greedy and server-default sampling), image-input probes on synthetic images, a counting request and the rendered prompt with thinking on and off"
why       = "the DS4 port was declared correct and fast on these probes (PATCHES 35-43); the same battery is a ready acceptance set for a strixflerp DS4 path"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "scripts/ds4-gen.py",
  "scripts/ds4_render_prompt.py",
  "scripts/ds4image.py",
  "scripts/ds4probe.py",
  "scripts/ds4speed.py",
  "scripts/ds4speed_sampled.py",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.model-probe-ds4/-/-"
api       = "python against the endpoint"
numeric   = "pass / fail, tok/s"
regime    = "DS4 serve"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
