id        = "tool.vllm_strix.toolcall_probes"
kind      = "tool"
summary   = "tool-calling probes: verbatim replay of a captured opencode request, the rate of early stops without a tool call over N replays, the dependence on the number of tools offered, a transparent logging proxy and the rendered chat template"
why       = "the 8/8 tool-calling result and the fail-open fix came from replaying real client traffic rather than synthetic prompts (PATCHES 26, 27.1)"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "scripts/proxy.py",
  "scripts/render_prompt.py",
  "scripts/replay.py",
  "scripts/replay_n.py",
  "scripts/tool_count.py",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.toolcall-replay/-/-"
api       = "python"
numeric   = "pass / fail"
regime    = "serve"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
