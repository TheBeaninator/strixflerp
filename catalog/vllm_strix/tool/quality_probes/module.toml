id        = "tool.vllm_strix.quality_probes"
kind      = "tool"
summary   = "quality A/B across builds: mean per-token NLL of fixed texts via prompt_logprobs (with the three texts), greedy reproducibility over N identical requests with distinct cache salts, output drift, the reasoning-effort template check and the degenerate-loop probe"
why       = "every kernel swap here was accepted on NLL and greedy equality, not only on speed; greedy is reproducible only below ~2K prompt tokens on this stack (README), which these probes measure"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

