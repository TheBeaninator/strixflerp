id        = "tool.vllm_strix.w8_sweep"
kind      = "tool"
summary   = "tile sweep for the W8A16 GEMV (ROWS rows a wave, VEC x 16 contiguous bytes a lane a step) behind sweep(variant, ...), its ctypes driver, and bf16_bw.py, a torch bandwidth probe for BF16 GEMV at the same shapes"
why       = "the W8A16 GEMV parameters were chosen by this sweep against measured BF16 bandwidth (PATCHES 23, 28.6); the pair says how close to the memory roof a skinny int8 GEMV gets on gfx1151"
notes     = "Interface tag: tool.kernel-bench. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["scripts/bf16_bw.py", "scripts/w8sweep.hip", "scripts/w8sweep.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/scripts/w8sweep.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "tool.kernel-bench/w8a16-g128/-"
api       = "extern \"C\" sweep(variant, stream, W, S, X, Y, N, K, M, sx, sy)"
numeric   = "timing only"
regime    = "M <= 8"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/tool.vllm_strix.w8_sweep.json"
