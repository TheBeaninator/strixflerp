id        = "serve.vllm_strix.toolcall_failopen"
kind      = "serve"
summary   = "tool-call fail-open for the glm47 parser: when a tool call is emitted inside a reasoning span that never closes, the turn returns the text and the call instead of finish_reason=stop with empty content"
why       = "about three turns in five ended with empty content and up to twelve thousand generated tokens in no field (HANDOVER-tool-calls.md); a serve layer must never swallow output it cannot parse"
notes     = "Interface tag: serve.http (response shaping). Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-toolcall-failopen.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "serve.toolcall-parse-fail-open/-/-"
api       = "patch script over the glm47 tool parser"
numeric   = "n/a"
regime    = "OpenAI chat API"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
