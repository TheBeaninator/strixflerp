id        = "serve.vllm_strix.warmup"
kind      = "serve"
summary   = "post-boot warm-up: a transient unit started once the API answers fires dummy requests that trigger and cache the JIT compiles, so the first real request does not pay them"
why       = "for ~2.5 minutes after a boot the warm-up prefill holds the engine (README); without it the first user request ate the Triton compile latency"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["host/vsh-warmup.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "serve.warmup/-/-"
api       = "python, run by vsh-cluster-restart.sh"
numeric   = "n/a"
regime    = "after boot"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
