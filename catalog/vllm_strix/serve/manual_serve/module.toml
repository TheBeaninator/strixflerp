id        = "serve.vllm_strix.manual_serve"
kind      = "serve"
summary   = "the serve and lifecycle scripts: the GLM and DS4 vllm serve launchers run inside the container (every vLLM flag and VSH_* switch in one place), and the restart / teardown / bisect-reserve flows (teardown, Ray on both boxes, serve, verify; box2 driven over ssh)"
why       = "the flags these launchers pass are the measured configuration of the rig (graph mode, spec method, chunk size, retention interval, KV pin); the teardown order (serve unit, stranded procs, Ray) is what keeps GTT from being stranded"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "host/vsh-cluster-down.sh",
  "host/vsh-cluster-restart.sh",
  "host/vsh-ds4-manual-serve.sh",
  "host/vsh-ds4-reserve.sh",
  "host/vsh-ds4-restart.sh",
  "host/vsh-manual-serve.sh",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "shell"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "serve.vllm-launch/-/-"
api       = "shell"
numeric   = "n/a"
regime    = "two Strix Halo (gfx1151, Radeon 8060S) boxes, TP=2 over one Thunderbolt / USB4 cable"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "shell: scripts and units, read and not run (host plumbing for the two-box rig)"
