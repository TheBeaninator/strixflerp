id        = "serve.vllm_strix.cluster_env"
kind      = "serve"
summary   = "the transport profiles: the canonical NCCL / memory / Ray environment both boxes source, and the odl profile (RCCL over the odl_tb5 net plugin, NCCL_MAX_NCHANNELS=4, DS4_ODL_AR2=1, odl_mq, control bootstrap on thunderbolt0) or the tcp fallback (RCCL sockets on thunderbolt0, DS4_ODL_AR2=0)"
why       = "a transport is mostly environment; keeping the two profiles side by side made the fallback one config key (PATCHES 15.3)"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["host/vsh-cluster-env.odl.sh", "host/vsh-cluster-env.sh", "host/vsh-cluster-env.tcp.sh"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "shell"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "serve.transport-profile/-/-"
api       = "sourced shell"
numeric   = "n/a"
regime    = "two Strix Halo (gfx1151, Radeon 8060S) boxes, TP=2 over one Thunderbolt / USB4 cable"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "shell: scripts and units, read and not run (host plumbing for the two-box rig)"
