id        = "runtime.vllm_strix.w8a16_requant"
kind      = "runtime"
summary   = "load-time int8 (W8A16, symmetric, group 128) for BF16 linears: after loading, UnquantizedLinearMethod quantises eligible layers (bf16, 2-D, K in a fixed set 1024..8192, N >= 32, not kv_b_proj / wk_weights_proj / embeddings / lm_head / vision) and frees the BF16 copy, and apply() runs the HIP W8A16 GEMV for M <= 8; vsh_w8a16.py is also the ctypes wrapper for every libvsh_w8a16.so entry point"
why       = "the AWQ checkpoint leaves attention, KDA / MLA projections, shared experts and dense MLPs in BF16, ~49 ms a step of skinny GEMV; int8 at load halves the bytes without a new checkpoint (PATCHES 23, 28.6). Requantise-at-load is a cheap way for strixflerp to serve BF16 leftovers of a quantised checkpoint"
notes     = "Interface tag: none (no catalogue module requantises at load). Copy in container/pinned-vllm/vllm/model_executor/layers/vsh_w8a16.py (not harvested). Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

