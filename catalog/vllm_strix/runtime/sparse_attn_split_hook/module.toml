id        = "runtime.vllm_strix.sparse_attn_split_hook"
kind      = "runtime"
summary   = "install hook that routes GLM sparse MLA decode with small query counts (MTP verify rows, draft steps) from the ragged prefill kernel to the split-KV kernel"
why       = "the split kernel only pays when the query count is small; the hook carries that crossover so prefill keeps the original kernel (PATCHES 28.4)"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

