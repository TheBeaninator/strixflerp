id        = "runtime.vllm_strix.moe_tile_configs"
kind      = "runtime"
summary   = "tuned fused-MoE tile tables for the Radeon 8060S at E=288, N=1024 (int4_w4a16 and the default dtype) under the file names the runtime actually asks for"
why       = "the first tuned table never loaded because its name did not match what vLLM looks up, and a stale one cost ~6 % (PATCHES 6, 23); tile tables are data a strixflerp MoE recipe would carry the same way"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "host/moe-configs/E=288,N=1024,device_name=AMD_Radeon_8060S,dtype=int4_w4a16.json",
  "host/moe-configs/E=288,N=1024,device_name=AMD_Radeon_8060S.json",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "moe.tile-config/awq-int4/-"
api       = "E=288,N=1024,device_name=AMD_Radeon_8060S[,dtype=int4_w4a16].json"
numeric   = "n/a"
regime    = "GLM-5.3-Flash TP=2 prefill"

[gate]
