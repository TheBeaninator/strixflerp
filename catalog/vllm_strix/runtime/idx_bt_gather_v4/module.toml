id        = "runtime.vllm_strix.idx_bt_gather_v4"
kind      = "runtime"
summary   = "gather-site block-table expansion for the GLM indexer (a replacement ops file): the page-level block table is expanded to pool level where the gather reads it; superseded by the section-27 fixes and inert in the current image"
why       = "kept as the record of the first attempt at the aliasing bug, which treated the symptom at the gather instead of the block size (PATCHES 27); useful to recognise the failure mode"
notes     = "Interface tag: none. Superseded upstream of this rig; harvested for the record. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

