id        = "runtime.vllm_strix.mhc_no_tilelang"
kind      = "runtime"
summary   = "keeps vllm/model_executor/layers/mhc.py off the TileLang mHC path on gfx1151 (the import is gated to gfx942)"
why       = "TileLang has no gfx1151 target, so importing it broke DS4 and GLM layers that use manifold hyper-connections; a two-line gate kept until upstream's TileLang migration is checked (PATCHES 15.1)"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-mhc-no-tilelang-gfx1151.patch"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "patch"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "runtime.platform-gate-mhc-tilelang/-/-"
api       = "patch to mhc.py"
numeric   = "n/a"
regime    = "gfx1151"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "patch: applies to vLLM 73859fec or OdinLink-Five 4534f58, neither of which is on the island; --side-gates parses each with git apply --numstat (gate/results/compile/vllm_strix.side-gates.json)"
