id        = "runtime.vllm_strix.ds4_idx_hadamard"
kind      = "runtime"
summary   = "Hadamard rotation for the DS4 indexer's fp4 quantisation: K in fused_compress_quant_cache.py and Q in fused_indexer_q.py are rotated before fp32x2 to fp4x2 packing (the -031 pair targets the 0.31 tree, the plain K patch the June tree)"
why       = "rotation spreads outliers before 4-bit quantisation; the gfx950 path does it in hardware-specific code, and gfx1151 needed it in the Triton kernels to keep indexer selection"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "container/patches/vsh-ds4-idx-hadamard-K-031.patch",
  "container/patches/vsh-ds4-idx-hadamard-K.patch",
  "container/patches/vsh-ds4-idx-hadamard-Q-031.patch",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "patch"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.indexer-quant-hadamard/fp4/-"
api       = "patches to models/deepseek_v4/common/ops/{fused_compress_quant_cache,fused_indexer_q}.py (Triton)"
numeric   = "Hadamard then e2m1 pack"
regime    = "DS4 indexer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "patch: applies to vLLM 73859fec or OdinLink-Five 4534f58, neither of which is on the island; --side-gates parses each with git apply --numstat (gate/results/compile/vllm_strix.side-gates.json)"
