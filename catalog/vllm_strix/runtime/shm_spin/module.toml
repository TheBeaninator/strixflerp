id        = "runtime.vllm_strix.shm_spin"
kind      = "runtime"
summary   = "makes the SHM MessageQueue reader's busy-spin window tunable: SpinCondition.wait() yields in a loop for busy_loop_s after every read before falling back to the zmq poll, and the hook exposes that window (default stock)"
why       = "the EngineCore <-> worker control plane spins a full core between steps by default; on a box whose CPU and iGPU share one power budget that spin can cost GPU clock (PATCHES 19, 28.1)"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-shm-spin.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "runtime.mq-spin-window/-/-"
api       = "patch script over shm_broadcast.py; env"
numeric   = "n/a"
regime    = "control plane"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
