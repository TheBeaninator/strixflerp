id        = "runtime.vllm_strix.cg_eager_collectives"
kind      = "runtime"
summary   = "CUDA graphs with TP collectives kept out: with VLLM_USE_BREAKABLE_CUDAGRAPH=1 and PIECEWISE mode, every GroupCoordinator collective breaks the capture and runs eagerly; with the two-rank RCCL repros (graphed all-reduce, graphed + eager on two communicators) that found the hang"
why       = "FULL graphs captured the RCCL-over-OdinLink all-reduces and the first replay hung with both ranks spinning in ncclDevKernel (PATCHES 29); breaking at collectives made graphs work and moved decode to 95-99 ms a step (PATCHES 33)"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-cg-eager-collectives.py", "scripts/nccl_graph.py", "scripts/nccl_graph2.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "runtime.graph-capture-break-collectives/-/-"
api       = "patch script over vllm/distributed/parallel_state.py; env VSH_CG_EAGER_COLLECTIVES"
numeric   = "n/a"
regime    = "decode, graph sizes 1/2/4/8"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
