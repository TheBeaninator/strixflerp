id        = "runtime.vllm_strix.odl_state"
kind      = "runtime"
summary   = "odl-state, the readiness helper: opens /dev/odl_tb5_0 and _1 through libodl_tb5, prints each device's peer state and link speed; odinlink.service gates boot on it reaching READY"
why       = "serving must not start before the cross-host handshake is READY; a 20-line probe on the public API is the gate the systemd unit and the cluster scripts use"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["odinlink/odl_state.c"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.link-state/-/-"
api       = "odl-state (main)"
numeric   = "n/a"
regime    = "two devices"

[[requires]]
module    = "runtime.odinlink5.lib"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
evidence  = "gate/results/compile/runtime.vllm_strix.odl_state.json"
reason    = "c: compiled by --side-gates with gcc against runtime.odinlink5.lib on control-node CPU (gate/results/compile/<module>.json)"
