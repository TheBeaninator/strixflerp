id        = "runtime.vllm_strix.ds4_native_port"
kind      = "runtime"
summary   = "the DeepSeek-V4-Flash native port to vLLM 0.31 on gfx1151 as reference files: dspark.py and mtp.py from upstream #57568 (DSpark and MTP drafters), compressor.py, sparse_mla.py, sparse_swa.py and rocm_aiter_mla_sparse.py with the rig's fixes, the state the vsh-ds4-* patches apply to"
why       = "DS4 serves correctly on this port since PATCHES 37 and at 24-27 tok/s with DSpark k=5 (PATCHES 41-43), faster than the June delegate stack; the files are the base strixflerp would read for a DS4 TP2 path"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "container/patches/ds4-native-fixed-refs/57568-dspark.py",
  "container/patches/ds4-native-fixed-refs/57568-mtp.py",
  "container/patches/ds4-native-fixed-refs/compressor.py",
  "container/patches/ds4-native-fixed-refs/rocm_aiter_mla_sparse.py",
  "container/patches/ds4-native-fixed-refs/sparse_mla.py",
  "container/patches/ds4-native-fixed-refs/sparse_swa.py",
]
authors   = [
  "vLLM project contributors (upstream code; this repo ports or patches it)",
  "davidcanar (vllm-strix-halo)",
]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "runtime.model-port-ds4-vllm031/-/-"
api       = "replacement vLLM files (whole)"
numeric   = "n/a"
regime    = "DeepSeek-V4-Flash(-Vision-Exp), TP=2, eager"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
