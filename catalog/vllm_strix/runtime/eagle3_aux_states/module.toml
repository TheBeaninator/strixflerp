id        = "runtime.vllm_strix.eagle3_aux_states"
kind      = "runtime"
summary   = "auxiliary hidden states for EAGLE3-style drafters from the GLM-5-Next model: the patch makes glm5next/common/model.py collect the hidden states of chosen layers and return them beside the output"
why       = "EAGLE3 and DFlash drafters read intermediate target layers, which the GLM model did not expose; this is the model-side tap every multi-layer drafter needs"
notes     = "Interface tag: speculation.draft. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

