id        = "runtime.vllm_strix.pr57979_kda_stride"
kind      = "runtime"
summary   = "port of upstream vLLM PR #57979, the KDA (Kimi delta attention) stride fix, as whole files of the flash-linear-attention derived Triton kernels used by GLM-5.3's linear-attention layers (fused_recurrent.py, kernels.py)"
why       = "the stride bug corrupted KDA state on non-contiguous inputs; GLM-5.3-Flash is a hybrid of KDA and sparse MLA, so the linear-attention kernels are half the model"
notes     = "Interface tag: none (the catalogue has mixer.gdn, a different recurrence). Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

