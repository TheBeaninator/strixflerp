id        = "runtime.vllm_strix.idx_force_tail"
kind      = "runtime"
summary   = "force-tail for the GLM sparse indexer: the 128 most recent pools are boosted before top-k, so they are always selected without overwriting chosen columns; vsh-idx-force-tail-sparse_indexer.py is the earlier column-overwrite version (sparse_indexer.py replaced whole), kept by the origin and superseded"
why       = "the first version wrote recent pools over the last 128 columns of an unsorted top-k output and discarded ~1/4 of the indexer's picks at random (PATCHES 27); boosting before selection is the correct way to guarantee a local window in top-k sparse attention"
notes     = "Interface tag: attn.indexer-topk. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "container/patches/vsh-idx-force-tail-boost.py",
  "container/patches/vsh-idx-force-tail-sparse_indexer.py",
]
authors   = [
  "vLLM project contributors (upstream code; this repo ports or patches it)",
  "davidcanar (vllm-strix-halo)",
]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.indexer-topk/-/f32.force-tail"
api       = "patch script over glm5next/amd/sparse_indexer.py"
numeric   = "recent pools get +inf-like boost before top-k"
regime    = "decode and prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
