id        = "runtime.vllm_strix.apc_align"
kind      = "runtime"
summary   = "prefix-cache alignment for GLM-5.3 with EAGLE / DFlash: the EAGLE last-block drop is resolved to pure-drafter KV groups instead of every group, so prefix hits stop losing a 2304-token page a lookup, behind VSH_GLM53_APC_ALIGN"
why       = "kv_cache_utils returned early for GLM-5-Next before annotating EAGLE groups, so every group was flagged and every hit dropped a page (PATCHES 18); with the fix a 13.9K repeat went from ~50 s to 0.95 s TTFT"
notes     = "Interface tag: cache.prompt (the catalogue's cache.prompt-* providers). Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-glm53-apc-align.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "cache.prompt-align-spec/-/-"
api       = "patch script over vllm/v1/core/kv_cache_utils.py and kv_cache_coordinator.py"
numeric   = "n/a"
regime    = "prefix caching with a drafter"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
