id        = "runtime.vllm_strix.ds4_decode_inv_rope"
kind      = "runtime"
summary   = "fixes DeepSeek-V4 decode on gfx1151: rocm_sparse_attn_decode reported every row as inverse-RoPE'd when given positions while its gfx1151 path never applied the rotation, so the hook makes the standalone rocm_inverse_rope_rows_ pass run"
why       = "this was the DS4 decode corruption: outputs were rotated attention values (PATCHES 37); the kind of silent mismatch between a fused epilogue and its fallback that strixflerp parity tests exist to catch"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-ds4-decode-inv-rope.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "pos.inverse-rope-rows/-/bf16"
api       = "patch script over models/deepseek_v4/amd/rocm.py"
numeric   = "exact"
regime    = "decode"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
