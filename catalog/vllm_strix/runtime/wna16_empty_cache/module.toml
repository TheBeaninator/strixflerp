id        = "runtime.vllm_strix.wna16_empty_cache"
kind      = "runtime"
summary   = "a per-layer torch.cuda.empty_cache() in the WNA16 MoE weight conversion, so each layer's transpose staging is released before the next layer loads"
why       = "on gfx1151 UMA reserved-but-free allocator segments bill against system RAM; 42 layers of dead reservation OOM-killed the worker at load at every config, and the fix let it init at 82.4 GiB (PATCHES 15.4). Any loader on a UMA box needs this discipline"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-wna16-layerwise-empty-cache.patch"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
