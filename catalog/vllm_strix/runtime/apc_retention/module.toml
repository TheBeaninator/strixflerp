id        = "runtime.vllm_strix.apc_retention"
kind      = "runtime"
summary   = "adds --prefix-cache-retention-interval 2304 (2176 with speculation off) to the GLM serve script behind VSH_GLM53_APC_RETENTION, so KDA / Mamba state checkpoints are kept on the attention page grid"
why       = "the default retains only semantic checkpoints, the sparsest setting for hybrid models, and the hybrid min() then tied every attention hit to a Mamba checkpoint, so the first repeat missed (PATCHES 20, 34); a hybrid prefix cache needs state checkpoints on the attention grid"
notes     = "Interface tag: cache.prompt. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

