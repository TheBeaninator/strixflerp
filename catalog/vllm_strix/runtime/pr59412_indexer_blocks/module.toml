id        = "runtime.vllm_strix.pr59412_indexer_blocks"
kind      = "runtime"
summary   = "port of upstream vLLM PR #59412 (fixes #58858): on ROCm the DSA indexer backend advertised kernel block sizes [1, MultipleOf(16)], so the hybrid KV manager's block became the kernel block for the MLA / indexer group; the port makes kernel blocks page-aligned to the kpool pages (64 pools = 256 tokens)"
why       = "with mismatched blocks every pool past ~4K tokens aliased onto one page, the second of the four long-context bugs (PATCHES 27); the lesson for strixflerp is that the KV block of a pooled indexer must equal its page"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

