id        = "runtime.vllm_strix.ds4_mmf32"
kind      = "runtime"
summary   = "DS4 compressor and indexer-compressor scores (torch.mm(hidden, fused_wkv_wgate.weight.T, out_dtype=float32), bf16 weights) routed to vsh_w8a16.mm_f32, the w16 GEMV for small batches, with a gate-hook diagnostic"
why       = "hipBLASLt ran these at ~55 GB/s for 6-row decode batches (PATCHES 40); one more case of a bf16-weight fp32-out GEMV"
notes     = "Interface tag: linear.decode. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
