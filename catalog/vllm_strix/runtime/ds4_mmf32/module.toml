branch    = "main"
paths     = ["container/patches/vsh-ds4-mmf32.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "linear.dense/bf16/f32.ds4-compressor"
