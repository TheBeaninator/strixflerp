id        = "runtime.vllm_strix.fp8_gemv_hook"
kind      = "runtime"
summary   = "HIP FP8 block-scaled GEMV for DeepSeek-V4's decode-sized linears: TritonFp8BlockScaledMMKernel (fp8 activation quant + Triton block GEMM) is replaced by vsh_fp8_gemv on bf16 activations for small M; tests against an exact dequantised reference, the stock W8A8 path and a pre-quantised route"
why       = "gfx1151 has no fp8 dot in Triton, and the block GEMM reached 3-11 GB/s at decode sizes, ~87 % of the DS4 decode step (PATCHES 35, 36)"
notes     = "Interface tag: linear.decode. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-fp8-gemv.py", "scripts/test_fp8_gemv.py", "scripts/test_fp8_preq.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "linear.decode/fp8-block128/bf16.hook"
api       = "hook on TritonFp8BlockScaledMMKernel.apply"
numeric   = "fp32 accumulate on dequantised fp8"
regime    = "decode M <= 8"

[[requires]]
module    = "runtime.vllm_strix.w8a16_requant"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
