id        = "runtime.vllm_strix.ds4_idx_logits_hook"
kind      = "runtime"
summary   = "install hook that routes DS4 prefill indexer logits from aiter's Triton _fp8_mqa_logits_kernel to vsh_idx_logits"
why       = "the indexer is the quadratic part of DS4 prefill; this hook is the seam that switched it to the WMMA kernel (PATCHES 42)"
notes     = "Interface tag: attn.indexer-score. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-ds4-idx-logits.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.indexer-score-dispatch/fp8-ds4/-"
api       = "patch script over v1/attention/ops/rocm_aiter_mla_sparse.py"
numeric   = "n/a"
regime    = "prefill"

[[requires]]
module    = "kernel.vllm_strix.idx_logits"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
