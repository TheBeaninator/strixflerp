id        = "runtime.vllm_strix.fp8_fnuz_mqa"
kind      = "runtime"
summary   = "fp8 fnuz handling for the paged MQA logits on gfx1151: the vLLM side picks the fnuz-aware aiter fp8_mqa_logits, and the overlay pa_mqa_logits.py replaces the base image's old-layout aiter file"
why       = "the base image's aiter assumed gfx94x fp8; on gfx1151 the indexer logits read the cache with the wrong fp8 flavour (PATCHES 15.1, 27)"
notes     = "Interface tag: attn.indexer-score. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "container/patches/vsh-fp8-fnuz-mqa.patch",
  "container/rootfs/opt/venv/lib/python3.12/site-packages/aiter/ops/triton/attention/pa_mqa_logits.py",
]
authors   = ["AMD aiter contributors (overlay file)", "davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.indexer-score/fp8-fnuz/f32.paged-mqa"
api       = "patch to rocm_aiter_mla_sparse.py + aiter overlay (Triton)"
numeric   = "fnuz-aware"
regime    = "decode indexer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
