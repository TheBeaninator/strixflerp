id        = "runtime.vllm_strix.kpool_paged_logits_hook"
kind      = "runtime"
summary   = "install hook that points GLM-5.3's decode indexer at the paged kpool logits reader, behind VSH_KPOOL_PAGED_LOGITS"
why       = "without it decode scored pools at random past ~2K tokens on gfx1151; with the other three section-27 fixes it made retrieval pass to 255K (PATCHES 27, 27.1)"
notes     = "Interface tag: attn.indexer-score. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-kpool-paged-logits.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.indexer-score-dispatch/fp8-kpool-shuffle/-"
api       = "patch script over vllm/models/glm5next/amd/sparse_indexer.py"
numeric   = "n/a"
regime    = "decode"

[[requires]]
module    = "kernel.vllm_strix.kpool_paged_logits"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
