id        = "runtime.vllm_strix.fused_router"
kind      = "runtime"
summary   = "one HIP kernel for GLM routing: GroupedTopKRouter on ROCm is replaced by vsh_sigmoid_bias_topk (sigmoid, correction bias, deterministic top-8 by biased value then index, renormalise the unbiased weights); tests for equality with the stock router and for NaN inputs"
why       = "the torch.compile'd grouped_topk cost ~200 us of CPU plus ~50 us of Dynamo guards a MoE layer, 42 layers a step (PATCHES 31, 33): routing was host-bound, not GPU-bound"
notes     = "Interface tag: moe.router. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = [
  "container/patches/vsh-fused-router.py",
  "scripts/test_fused_router.py",
  "scripts/test_fused_router_nan.py",
]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "moe.router/-/f32.sigmoid-bias-topk-fused"
api       = "hook on GroupedTopKRouter; env VSH_FUSED_ROUTER"
numeric   = "deterministic order; same experts and weights as the stock router"
regime    = "decode and prefill, top-8 of 288"

[[requires]]
module    = "runtime.vllm_strix.w8a16_requant"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
