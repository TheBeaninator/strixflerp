id        = "runtime.vllm_strix.aiter_gemm_configs"
kind      = "runtime"
summary   = "gfx1151 tile tables for aiter's Triton GEMMs (A8W8, A8W8 blockscale, preshuffled blockscale, batched A8W8 with per-token-group prequant) by N and K, copied into the image's aiter config directory"
why       = "aiter ships these tables for CDNA only and falls back to untuned tiles elsewhere; they are the gfx1151 shapes of DS4 and GLM linears the origin measured"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

