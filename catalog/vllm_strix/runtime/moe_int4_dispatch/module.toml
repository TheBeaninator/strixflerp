id        = "runtime.vllm_strix.moe_int4_dispatch"
kind      = "runtime"
summary   = "ctypes wrapper for libvsh_moe_int4.so (vsh_moe_int4.py: gemv, direct_moe, topk_sum, swiglu, MXFP4 entry points with shape checks) and the install hook that routes decode-sized int4 fused-MoE calls (<= 64 token-expert pairs) from the Triton gptq_awq kernel to the HIP GEMV behind VSH_MOE_INT4_HIP; moe_mt.py times the tile options"
why       = "the kernel is only useful once vLLM calls it: this is the seam that swaps one MoE implementation for another inside the fused-MoE layer by batch size, the same seam a strixflerp adapter would occupy"
notes     = "Interface tag: none. Byte-identical copy in container/pinned-vllm/vllm/model_executor/layers/fused_moe/vsh_moe_int4.py (not harvested). Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/vsh-moe-int4-hip.py", "container/patches/vsh_moe_int4.py", "scripts/moe_mt.py"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "moe.experts-decode-dispatch/awq-int4/-"
api       = "vsh_moe_int4.gemv / direct_moe (python); env VSH_MOE_INT4_HIP"
numeric   = "n/a (dispatch)"
regime    = "decode only; prefill stays on Triton"

[[requires]]
module    = "kernel.vllm_strix.moe_int4_gemv"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
