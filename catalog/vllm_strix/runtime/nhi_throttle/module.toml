id        = "runtime.vllm_strix.nhi_throttle"
kind      = "runtime"
summary   = "nhi_throttle, a tiny kernel module that rewrites the USB4 / Thunderbolt NHI MSI-X interrupt throttling registers (REG_INT_THROTTLING_RATE 0x38c00 + 4 x vector, 256 ns units) on every active NHI at load (insmod nhi_throttle.ko ns=8000)"
why       = "mainline hardcodes ~128 us of interrupt moderation on every NHI vector, which was the ~65 us one-way latency floor measured on usb4_rdma; it is the knob below every USB4 transport's latency"
notes     = "Interface tag: none. GPL-2.0 per its SPDX line; not built (no kernel tree for the pod kernel in the gate). Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["odinlink/nhi-throttle-mod/Makefile", "odinlink/nhi-throttle-mod/nhi_throttle.c"]
authors   = ["davidcanar (vllm-strix-halo)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "transport.nhi-irq-throttle/-/-"
api       = "kernel module parameter ns"
numeric   = "n/a"
regime    = "AMD / Intel USB4 NHI"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "linux kernel module: not built (needs the target kernel's headers; the control-node kernel is not the rig's)"
