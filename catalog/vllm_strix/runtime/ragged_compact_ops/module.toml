id        = "runtime.vllm_strix.ragged_compact_ops"
kind      = "runtime"
summary   = "upstream's ragged-index rewrite of the sparse-attention window ops, carried as a whole replacement file ahead of the pin: compacted ragged indices for windowed sparse attention"
why       = "the rig needed the upstream rewrite before its pin had it; carrying a forward port as a whole file is how the origin tracks upstream fixes between pin bumps"
notes     = "Interface tag: none. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

[provenance]
origin    = "vllm_strix"
repo      = "https://github.com/davidcanar/vllm-strix-halo"
commit    = "fe5ac1016737c1f68e04772e3ae9e7567bc40f22"
branch    = "main"
paths     = ["container/patches/upstream-window-ragged-compact-ops.py"]
authors   = [
  "vLLM project contributors (upstream code; this repo ports or patches it)",
  "davidcanar (vllm-strix-halo)",
]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.sparse-window-ops-ragged-compact/-/-"
api       = "replacement ops file (whole)"
numeric   = "n/a"
regime    = "GLM-5.3 sparse attention"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; python3 docs/harvest/harvest_vllm_strix.py --side-gates byte-compiles every .py on control-node (gate/results/compile/vllm_strix.side-gates.json)"
