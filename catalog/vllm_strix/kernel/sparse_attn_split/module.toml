id        = "kernel.vllm_strix.sparse_attn_split"
kind      = "kernel"
summary   = "Triton split-KV (flash-decoding) variant of vLLM's _sparse_attn_prefill_ragged_kernel for GLM-5.3 sparse MLA decode: the ~2048 selected latent keys (512-dim) of each query are split across programs and combined by log-sum-exp, with a unit test against the original kernel"
why       = "GLM decode ran its sparse MLA through the prefill ragged kernel with one program per (query, 16-head block): 8 workgroups at M=4 and 2 at M=1 on a 40-CU GPU (PATCHES 28.4). Split-KV over the selected keys is the decode shape for any top-k sparse attention"
notes     = "Interface tag: none (the catalogue's sparse attention is attn.sparse-sink, a different selection). Hook: runtime.vllm_strix.sparse_attn_split_hook. Nothing was run: no GPU, no worker, no weights; the pod has no Thunderbolt pair (card d2a7b91dec)."

