id        = "tool.fastasfuck.audit_kernels"
kind      = "tool"
summary   = "fastasfuck's script that disassembles a built binary's gfx1151 code objects and audits their kernels (registers, spills, LDS)"
why       = "register spills on gfx1151 cost decode speed; this script lists them per kernel"
notes     = "Files vs strixite: tools/audit_kernels.py new in fastasfuck. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["tools/audit_kernels.py"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "tool.audit-kernels/-/-"
api       = "tools/audit_kernels.py"
numeric   = "n/a"
regime    = "offline tool"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "a Python script run with python3 (torch, numpy or scipy where it imports them); nothing to compile"
