id        = "tool.fastasfuck.sim_qwen_fp64_mtp"
kind      = "tool"
summary   = "fastasfuck's FP64-Hessian trunk plus MTP-head GPTQ simulator on the quantized trunk's outputs (new in 1.1.0)"
why       = "it checks that calibrating the trunk does not cost MTP draft acceptance, and whether the draft head should be calibrated too"
notes     = "Files vs strixite: tools/sim_qwen_fp64_mtp.py new in fastasfuck. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["tools/sim_qwen_fp64_mtp.py"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "tool.sim-qwen-fp64-mtp/-/-"
api       = "tools/sim_qwen_fp64_mtp.py"
numeric   = "n/a"
regime    = "offline tool"

[[requires]]
module    = "tool.fastasfuck.sim_qwen_awq_gptq"

[[requires]]
module    = "tool.fastasfuck.sim_qwen_calib"

[[requires]]
module    = "tool.fastasfuck.sim_qwen_gptq_r3"

[[requires]]
module    = "tool.fastasfuck.sim_qwen_quant"

[[requires]]
module    = "tool.fastasfuck.sim_qwen_wave2"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "a Python script run with python3 (torch, numpy or scipy where it imports them); nothing to compile"
