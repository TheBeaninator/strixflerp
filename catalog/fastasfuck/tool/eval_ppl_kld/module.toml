id        = "tool.fastasfuck.eval_ppl_kld"
kind      = "tool"
summary   = "fastasfuck's perplexity and KL-divergence evaluator comparing two weight layouts token by token with raw logit dumps"
why       = "quantization choices in fastasfuck are judged by held-out KLD; this is the on-engine measurement"
notes     = "Files vs strixite: tools/eval_ppl_kld.cpp new in fastasfuck. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["tools/eval_ppl_kld.cpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/eval_ppl_kld.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "tool.eval-ppl-kld/-/-"
api       = "tools/eval_ppl_kld.cpp"
numeric   = "n/a"
regime    = "host program"

[[requires]]
module    = "executor.fastasfuck.qwen4exp"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (executable eval_ppl_kld) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
