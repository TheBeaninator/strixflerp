id        = "runtime.fastasfuck.resume_loss"
kind      = "runtime"
summary   = "fastasfuck's one-line report of where a prompt left its nearest saved state, raised to a warning when the loss costs seconds of prefill"
why       = "it tells an operator why a turn prefilled from scratch, which the prompt cache alone does not show"
notes     = "Files vs strixite: serve/resume_loss.cpp byte-identical to runtime.strixite.resume_loss at d19945e; serve/resume_loss.hpp byte-identical to runtime.strixite.resume_loss at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/resume_loss.cpp", "serve/resume_loss.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/resume_loss.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "serve.resume-loss/-/-"
api       = "strix::resume_loss_text, strix::describe_prompt_position"
numeric   = "the same source as runtime.strixite.resume_loss, so its behaviour: n/a"
regime    = "as runtime.strixite.resume_loss: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.serve_log"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
