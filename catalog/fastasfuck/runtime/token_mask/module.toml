id        = "runtime.fastasfuck.token_mask"
kind      = "runtime"
summary   = "fastasfuck's allowed-token mask builder walking the byte-sorted vocabulary with shared-prefix reuse and per-state caching"
why       = "masking all 248k tokens per step would be too slow without the prefix walk this file does"
notes     = "Files vs strixite: serve/token_mask.cpp byte-identical to runtime.strixite.token_mask at d19945e; serve/token_mask.hpp byte-identical to runtime.strixite.token_mask at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/token_mask.cpp", "serve/token_mask.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/token_mask.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.token-mask/-/-"
api       = "strix::TokenMasker"
numeric   = "the same source as runtime.strixite.token_mask, so its behaviour: n/a"
regime    = "as runtime.strixite.token_mask: host; masks are what logits_topk consumes"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.grammar"

[[requires]]
module    = "runtime.fastasfuck.tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
