id        = "runtime.fastasfuck.response_store"
kind      = "runtime"
summary   = "fastasfuck's bounded in-memory store of past Responses API turns (tokens, instructions, tools, config hash) by response id, pruned by entry count and bytes"
why       = "previous_response_id in the Responses API resumes from these stored turns; strixite has no Responses API"
notes     = "Files vs strixite: serve/response_store.cpp new in fastasfuck; serve/response_store.hpp new in fastasfuck. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/response_store.cpp", "serve/response_store.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/response_store.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "serve.response-store/-/-"
api       = "strix::ResponseStore, strix::StoredResponse (serve/response_store.hpp)"
numeric   = "n/a"
regime    = "host"

[[requires]]
module    = "runtime.fastasfuck.json"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
