id        = "runtime.fastasfuck.args"
kind      = "runtime"
summary   = "fastasfuck's header-only checked integer and double parsing for its command-line tools, failing through STRIX_CHECK with the argument's name and range"
why       = "every converter, bench and test program of fastasfuck parses its flags through this header, so a tool module cannot be read without it"
notes     = "Files vs strixite: common/args.hpp byte-identical to runtime.strixite.args at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["common/args.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "host.args/-/-"
api       = "strix::parse_int, strix::parse_double"
numeric   = "the same source as runtime.strixite.args, so its behaviour: n/a"
regime    = "as runtime.strixite.args: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host C++ header; the compile gate builds hip-c++ modules only"
