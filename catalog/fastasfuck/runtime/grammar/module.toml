id        = "runtime.fastasfuck.grammar"
kind      = "runtime"
summary   = "fastasfuck's byte-level context-free grammar matcher: a nondeterministic pushdown automaton tracking every live parse with a depth bound"
why       = "structured output and tool calls are enforced through this matcher token by token"
notes     = "Files vs strixite: serve/grammar.cpp byte-identical to runtime.strixite.grammar at d19945e; serve/grammar.hpp byte-identical to runtime.strixite.grammar at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/grammar.cpp", "serve/grammar.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/grammar.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.matcher/-/-"
api       = "strix::grammar::{Grammar, GrammarAutomaton, GrammarMatcher}"
numeric   = "the same source as runtime.strixite.grammar, so its behaviour: n/a"
regime    = "as runtime.strixite.grammar: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
