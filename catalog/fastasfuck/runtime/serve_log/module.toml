id        = "runtime.fastasfuck.serve_log"
kind      = "runtime"
summary   = "fastasfuck's request log layout helpers: fixed-column label rows, rate-first speed rows and hand comma-grouped numbers"
why       = "the per-request speed lines the author's benches scrape are printed by these helpers"
notes     = "Files vs strixite: serve/log.hpp byte-identical to runtime.strixite.serve_log at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/log.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "host.log-rows/-/-"
api       = "strix::slog_row, strix::fmt_n, strix::fmt_rate"
numeric   = "the same source as runtime.strixite.serve_log, so its behaviour: n/a"
regime    = "as runtime.strixite.serve_log: header only"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.log"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host C++ header; the compile gate builds hip-c++ modules only"
