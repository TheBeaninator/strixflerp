id        = "runtime.fastasfuck.vocab_filter"
kind      = "runtime"
summary   = "fastasfuck's vocabulary filter: classifies tokens into script sections (Latin, Cyrillic, CJK, code, ...) and masks the ones a preset such as en, en+ru or no-cjk leaves out"
why       = "a fastasfuck-only feature with no strixite counterpart: it narrows sampling to the scripts an operator expects"
notes     = "Files vs strixite: serve/vocab_filter.cpp new in fastasfuck; serve/vocab_filter.hpp new in fastasfuck. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/vocab_filter.cpp", "serve/vocab_filter.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/vocab_filter.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "text.vocab-filter/-/-"
api       = "strix::vocab_filter::parse_filter and the section masks (serve/vocab_filter.hpp)"
numeric   = "masked tokens never sampled; unmasked logits unchanged"
regime    = "host"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
