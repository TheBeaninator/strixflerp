id        = "runtime.fastasfuck.ple_hash"
kind      = "runtime"
summary   = "fastasfuck's host computation of the PLE n-gram row ids: order-2 and order-3 token hashes reduced modulo each head's prime vocabulary"
why       = "the row ids decide which PLE rows a token reads, so the hash has to match the checkpoint's training-time rule bit for bit"
notes     = "Files vs strixite: runtime/ple_hash.cpp byte-identical to runtime.strixite.ple_hash at d19945e; runtime/ple_hash.hpp byte-identical to runtime.strixite.ple_hash at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["runtime/ple_hash.cpp", "runtime/ple_hash.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/ple_hash.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "ple.ngram-ids/-/-"
api       = "strix::ple_ngram_ids, strix::PleHistory, strix::PleHashParams"
numeric   = "the same source as runtime.strixite.ple_hash, so its behaviour: integer hashing, validated against the HF reference ids"
regime    = "as runtime.strixite.ple_hash: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_runtime) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
