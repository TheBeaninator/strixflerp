id        = "runtime.fastasfuck.vision_preprocess"
kind      = "runtime"
summary   = "fastasfuck's host image path: sniffed decode (stb, libwebp), smart_resize with an antialiased bicubic filter, normalization and patch merge"
why       = "pixel values must match the HF processor for the vision tower's output to match; this is the host half of image prompts"
notes     = "Files vs strixite: serve/vision_preprocess.cpp byte-identical to runtime.strixite.vision_preprocess at d19945e; serve/vision_preprocess.hpp byte-identical to runtime.strixite.vision_preprocess at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/vision_preprocess.cpp", "serve/vision_preprocess.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/vision_preprocess.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "vision.preprocess/-/-"
api       = "strix::vision::{decode_image, preprocess_image, resize_bicubic_aa_u8}"
numeric   = "the same source as runtime.strixite.vision_preprocess, so its behaviour: antialiased bicubic resize on u8 as the reference processor"
regime    = "as runtime.strixite.vision_preprocess: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
