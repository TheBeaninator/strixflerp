id        = "runtime.fastasfuck.log"
kind      = "runtime"
summary   = "fastasfuck's header-only printf-style one-line logger with syslog levels, a per-slot tag and a journal priority prefix"
why       = "the engine and server log through it; the module lets a recipe swap logging without touching the engine files"
notes     = "Files vs strixite: common/log.hpp byte-identical to runtime.strixite.log at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["common/log.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "host.log/-/-"
api       = "strix::slog, strix::set_log_level"
numeric   = "the same source as runtime.strixite.log, so its behaviour: n/a"
regime    = "as runtime.strixite.log: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host C++ header; the compile gate builds hip-c++ modules only"
