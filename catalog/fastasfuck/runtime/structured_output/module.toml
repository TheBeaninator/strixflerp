id        = "runtime.fastasfuck.structured_output"
kind      = "runtime"
summary   = "fastasfuck's per-generation response_format cursor: free reasoning, then only grammar tokens, one allowed-token mask per logits row"
why       = "it joins the grammar matcher to the sampler so constrained output still allows thinking first"
notes     = "Files vs strixite: serve/structured_output.cpp 36 changed lines against runtime.strixite.structured_output at d19945e; serve/structured_output.hpp 12 changed lines against runtime.strixite.structured_output at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/structured_output.cpp", "serve/structured_output.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/structured_output.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.structured-output/-/-"
api       = "strix::StructuredOutput"
numeric   = "derived from runtime.strixite.structured_output (serve/structured_output.cpp 36 changed lines against runtime.strixite.structured_output at d19945e; serve/structured_output.hpp 12 changed lines against runtime.strixite.structured_output at d19945e); not compared here"
regime    = "as runtime.strixite.structured_output: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.grammar"

[[requires]]
module    = "runtime.fastasfuck.sampler"

[[requires]]
module    = "runtime.fastasfuck.token_mask"

[[requires]]
module    = "runtime.fastasfuck.tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
