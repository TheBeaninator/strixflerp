id        = "runtime.fastasfuck.json_schema"
kind      = "runtime"
summary   = "fastasfuck's compiler from a JSON Schema subset to a byte grammar that only admits texts it can promise are valid"
why       = "response_format json_schema requests become grammars through it"
notes     = "Files vs strixite: serve/json_schema.cpp byte-identical to runtime.strixite.json_schema at d19945e; serve/json_schema.hpp byte-identical to runtime.strixite.json_schema at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["serve/json_schema.cpp", "serve/json_schema.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/json_schema.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.json-schema/-/-"
api       = "strix::json_schema::compile, compile_any_object"
numeric   = "the same source as runtime.strixite.json_schema, so its behaviour: n/a"
regime    = "as runtime.strixite.json_schema: host"

[[requires]]
module    = "kernel.fastasfuck.common"

[[requires]]
module    = "runtime.fastasfuck.grammar"

[[requires]]
module    = "runtime.fastasfuck.json"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_serve) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
