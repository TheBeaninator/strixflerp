id        = "kernel.fastasfuck.hc"
kind      = "kernel"
summary   = "fastasfuck's per-token hyper-connection down / up / inject mixes over 4 residual streams on Q4 / Q8 weights"
why       = "owner asked for fastasfuck as an origin (2026-11-24): an engine that serves Qwen3.8-Flash-Next on one Strix Halo from a fork of strixite's kernels; this module holds its hc kernel file so a timing card can set it against kernel.strixite.hc, the strixite code it was forked from"
notes     = "Interface tags by file: kernels/hc.hip hc.mix/strixw-q4, hc.mix/strixw-q8 (124 changed lines against kernel.strixite.hc kernels/hc.hip at d19945e) (catalog/fastasfuck/KERNELS.md has the table). Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["kernels/hc.hip", "kernels/hc.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/hc.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "hc.mix/strixw-q4/bf16"
api       = "strix::kernels::hc_inject, hc_mix_down, hc_mix_up (kernels/hc.hpp)"
numeric   = "derived from kernel.strixite.hc (124 changed lines against kernel.strixite.hc kernels/hc.hip at d19945e); the arithmetic was not compared here"
regime    = "as kernel.strixite.hc: decode: two launches per mix; H == 4, d % 32 == 0, r % 32 == 0, r <= 1024"

[[provides]]
interface = "hc.mix/strixw-q4/f32"
api       = "strix::kernels::hc_inject, hc_mix_down, hc_mix_up (kernels/hc.hpp)"
numeric   = "derived from kernel.strixite.hc (124 changed lines against kernel.strixite.hc kernels/hc.hip at d19945e); the arithmetic was not compared here"
regime    = "as kernel.strixite.hc: decode: two launches per mix; H == 4, d % 32 == 0, r % 32 == 0, r <= 1024"

[[provides]]
interface = "hc.mix/strixw-q8/bf16"
api       = "strix::kernels::hc_inject, hc_mix_down, hc_mix_up (kernels/hc.hpp)"
numeric   = "derived from kernel.strixite.hc (124 changed lines against kernel.strixite.hc kernels/hc.hip at d19945e); the arithmetic was not compared here"
regime    = "as kernel.strixite.hc: decode: two launches per mix; H == 4, d % 32 == 0, r % 32 == 0, r <= 1024"

[[provides]]
interface = "hc.mix/strixw-q8/f32"
api       = "strix::kernels::hc_inject, hc_mix_down, hc_mix_up (kernels/hc.hpp)"
numeric   = "derived from kernel.strixite.hc (124 changed lines against kernel.strixite.hc kernels/hc.hip at d19945e); the arithmetic was not compared here"
regime    = "as kernel.strixite.hc: decode: two launches per mix; H == 4, d % 32 == 0, r % 32 == 0, r <= 1024"

[[requires]]
module    = "format.fastasfuck.qn_device"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.fastasfuck.hc.json"
