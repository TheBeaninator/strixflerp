id        = "format.fastasfuck.q4_from_q8"
kind      = "format"
summary   = "fastasfuck's Q8 to Q4 requantizer: exact Q8 dequantize then Q4 quantize, threaded over row chunks with byte-identical output"
why       = "it lets a Q4 layout be derived from an existing Q8 conversion without re-reading the BF16 checkpoint"
notes     = "Files vs strixite: formats/q4_from_q8.cpp 65 changed lines against format.strixite.q4_from_q8 at d19945e; formats/q4_from_q8.hpp 6 changed lines against format.strixite.q4_from_q8 at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["formats/q4_from_q8.cpp", "formats/q4_from_q8.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q4_from_q8.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "format.requant/strixw-q4/-"
api       = "strix::quantize_q4_from_q8"
numeric   = "derived from format.strixite.q4_from_q8 (formats/q4_from_q8.cpp 65 changed lines against format.strixite.q4_from_q8 at d19945e; formats/q4_from_q8.hpp 6 changed lines against format.strixite.q4_from_q8 at d19945e); not compared here"
regime    = "as format.strixite.q4_from_q8: host, once at load"

[[requires]]
module    = "format.fastasfuck.qn_device"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_formats) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
