id        = "format.fastasfuck.safetensors"
kind      = "format"
summary   = "fastasfuck's read-only safetensors reader: header JSON to name, dtype, shape and offset per tensor over an mmap of the file"
why       = "the converter reads the HF checkpoint and, since 1.1.0, the prebuilt GPTQ shards through this reader"
notes     = "Files vs strixite: formats/safetensors.cpp byte-identical to format.strixite.safetensors at d19945e; formats/safetensors.hpp byte-identical to format.strixite.safetensors at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["formats/safetensors.cpp", "formats/safetensors.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/safetensors.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "format.reader/safetensors/-"
api       = "strix::SafetensorsFile"
numeric   = "the same source as format.strixite.safetensors, so its behaviour: bytes as stored"
regime    = "as format.strixite.safetensors: host; header and metadata inspection, converter input"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_formats) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
