id        = "format.fastasfuck.q5"
kind      = "format"
summary   = "fastasfuck's Q5 host quantizer: the Q4 low-nibble plane plus a 1-bit high plane per row with Q4's BF16 scale and min"
why       = "Q5 is one of the four weight widths a .faf layout string may name; this is the host side the Q5 decode and prefill kernels read"
notes     = "Files vs strixite: formats/q5.cpp byte-identical to format.strixite.q5 at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["formats/q5.cpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q5.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "format.host/strixw-q5/-"
api       = "strix::Q5Weight, quantize_q5, dequantize_q5, append_rows_q5"
numeric   = "the same source as format.strixite.q5, so its behaviour: s = bf16((max - min) / 31), q = clamp(round_half_even((w - m) / s), 0, 31), all fp32"
regime    = "as format.strixite.q5: 5.25 bits per weight at G = 128; K % 128 == 0"

[[requires]]
module    = "format.fastasfuck.qn_device"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_formats) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
