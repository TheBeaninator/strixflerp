id        = "format.fastasfuck.q8"
kind      = "format"
summary   = "fastasfuck's Q8 host quantizer: one unsigned byte per weight with asymmetric BF16 scale and min per group and a chunk-major copy for the HC up-mix"
why       = "the hyper-connection and LM-head weights ship at q8g64, so the MTP draft acceptance the author tunes for rests on this format"
notes     = "Files vs strixite: formats/q8.cpp byte-identical to format.strixite.q8 at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["formats/q8.cpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q8.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "format.host/strixw-q8/-"
api       = "strix::Q8Weight, quantize_q8, dequantize_q8, append_rows_q8, to_chunk_major"
numeric   = "the same source as format.strixite.q8, so its behaviour: s = bf16((max - min) / 255), q = clamp(round_half_even((w - m) / s), 0, 255), all fp32"
regime    = "as format.strixite.q8: 8.5 bits per weight at G = 64"

[[requires]]
module    = "format.fastasfuck.qn_device"

[[requires]]
module    = "kernel.fastasfuck.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ built by the origin's CMake (strix_formats) with the ROCm clang as plain C++, no -x hip; the compile gate builds hip-c++ modules only"
