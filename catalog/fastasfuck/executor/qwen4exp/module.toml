id        = "executor.fastasfuck.qwen4exp"
kind      = "executor"
summary   = "fastasfuck's Qwen3.8-Flash-Next engine: loads weights.faf and the n-gram table, runs 4 hyper-connected streams through 36 GDN and 12 QSA attention layers with PLE and a top-10-of-512 MoE, chunked prefill, MTP drafts and batched verify"
why       = "the forward that ties every kernel family together; set against executor.strixite.qwen4exp it shows what the fork changed in scheduling and precision"
notes     = "Files vs strixite: runtime/qwen4exp.cpp 2088 changed lines against executor.strixite.qwen4exp at d19945e; runtime/qwen4exp.hpp 268 changed lines against executor.strixite.qwen4exp at d19945e. Nothing was run or timed on the pod; the origin's own figures (README.md) are unverified here."

[provenance]
origin    = "fastasfuck"
repo      = "https://github.com/Cheblan/fastasfuck"
commit    = "73bd1703cbe04f1556b17a3c36bd05fd7ee0372e"
branch    = "1.1.0"
paths     = ["runtime/qwen4exp.cpp", "runtime/qwen4exp.hpp"]
authors   = ["Cheblan"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/qwen4exp.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "executor.forward/qwen4exp/bf16"
api       = "strix::Qwen4ExpModel, strix::Qwen4ExpSession"
numeric   = "derived from executor.strixite.qwen4exp (runtime/qwen4exp.cpp 2088 changed lines against executor.strixite.qwen4exp at d19945e; runtime/qwen4exp.hpp 268 changed lines against executor.strixite.qwen4exp at d19945e); not compared here"
regime    = "as executor.strixite.qwen4exp: weights.strixw resident on the device; decode, chunked prefill, MTP verify, batched runs"

