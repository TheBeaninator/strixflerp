id        = "kernel.enginelab.q8_rows"
kind      = "kernel"
summary   = "Q8 rows: the Q8 rows GEMV, IU4 rows, lane VOPD and VOPD bodies, sites, the Q8 projection manifest and organization, the Q8_0 rule"
why       = "Q8_0 decode rows with VOPD dual issue; where it would go: beside the catalogue's linear.decode/q8_0/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.decode/q8_0/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/q8_0_rule.hpp",
  "include/strix/q8_projection_manifest.hpp",
  "include/strix/q8_projection_organization.hpp",
  "src/hip_q8_rows_gemv.hpp",
  "src/hip_q8_rows_iu4.hpp",
  "src/hip_q8_rows_lane_vopd.inc",
  "src/hip_q8_rows_sites.hpp",
  "src/hip_q8_rows_vopd.inc",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

