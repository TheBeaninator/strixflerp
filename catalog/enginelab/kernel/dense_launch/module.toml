id        = "kernel.enginelab.dense_launch"
kind      = "kernel"
summary   = "dense launch pieces: A8 G64 dense, FP16 tiled and WMMA dense, dense rows tile and wave, the experimental dense trellis (HIP) and its pack, dense model config"
why       = "the engine-side dense projections over the shared core; where it would go: beside the catalogue's linear.dense/-/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.dense/-/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 1 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/dense_model_config.hpp",
  "include/strix/dense_rows_tile.hpp",
  "include/strix/dense_rows_wave.hpp",
  "include/strix/hip_dense_trellis.hpp",
  "include/strix/hip_dense_trellis_pack.hpp",
  "src/hip_dense_a8g64.hpp",
  "src/hip_dense_f16_tiled.hpp",
  "src/hip_dense_f16_wmma.hpp",
  "src/hip_dense_trellis.hip",
  "src/hip_dense_trellis_pack.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_dense_trellis.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.dense/-/f16-f32.enginelab-launch"
api       = "hip_dense_trellis.hip, hip_dense_f16_wmma.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "kernel.enginelab.core_common"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.qpf2k_schedule"

[[requires]]
module    = "serve.enginelab.serve_http"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.dense_launch.json"
