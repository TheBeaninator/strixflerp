id        = "kernel.enginelab.inkling2_attention"
kind      = "kernel"
summary   = "Inkling 2 Mini attention (HIP, operands, prepare): 5 origin files under src/inkling2"
why       = "its attention; where it would go: beside the catalogue's attn.softmax-gqa/-/bf16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: attn.softmax-gqa/-/bf16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/inkling2/inkling2_mini_attention_hip.hpp",
  "src/inkling2/inkling2_mini_attention_operands.hpp",
  "src/inkling2/inkling2_mini_attention_prepare.hpp",
  "src/inkling2/inkling2_mini_attention_prepare_device.hpp",
  "src/inkling2/inkling2_mini_attention_prepare_hip.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src", "src/src/inkling2"]
arch      = "gfx1151"

[[provides]]
interface = "attn.softmax-gqa/-/bf16-f32.enginelab-inkling2"
api       = "src/inkling2/inkling2_mini_attention*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.inkling2_engine"

[[requires]]
module    = "kernel.enginelab.attn_core_flash"

[[requires]]
module    = "kernel.enginelab.attn_core_prepared"

[[requires]]
module    = "kernel.enginelab.core_common"

[[requires]]
module    = "kernel.enginelab.core_f16_dense"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
