id        = "kernel.enginelab.qwen_rotary"
kind      = "kernel"
summary   = "Qwen rotary: the rotary table (HIP) and diagnostic, the YaRN table and the rotary descriptor"
why       = "long-context rotary scaling; where it would go: beside the catalogue's pos.rope/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: pos.rope/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 2 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/hip_qwen_rotary_diagnostic.hpp",
  "include/strix/hip_qwen_rotary_table.hpp",
  "include/strix/qwen_yarn_table.hpp",
  "include/strix/rotary_descriptor.hpp",
  "src/hip_qwen_rotary_table.hip",
  "src/qwen_yarn_table.cpp",
  "src/rotary_descriptor.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_qwen_rotary_table.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "pos.rope/-/f32.enginelab-qwen"
api       = "hip_qwen_rotary_table.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.model_registry"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.qwen_rotary.json"
