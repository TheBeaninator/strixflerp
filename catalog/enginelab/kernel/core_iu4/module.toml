id        = "kernel.enginelab.core_iu4"
kind      = "kernel"
summary   = "stored INT4 (IU4) support: the IU4 pack builder and plans, IU4 x A4 dense projections with their layout and rotation, IU4 row plans and x-pairs, on-the-fly IU4, the INT4 shadow and the small-row W4A16 decoder with streaming stages and shared dequantisation (adopted from strix-trellis, extended here)"
why       = "FAST_I4 is the lab's lossy 4-bit identity for GLM / MiniMax / DS41 dense weights; the W4A16 streaming decoder is the decode GEMV shape for those packs; where it would go: beside the catalogue's linear.decode/iu4/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.decode/iu4/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/core/dense_iu4_rows.hpp",
  "src/core/dense_linear_iu4.hpp",
  "src/core/f16_dense_iu4.hpp",
  "src/core/i4_shadow.hpp",
  "src/core/iu4.hpp",
  "src/core/iu4_onfly.hpp",
  "src/core/iu4_plan.hpp",
  "src/core/iu4_rows_plan.hpp",
  "src/core/iu4_x_pairs.hpp",
  "src/core/iu4a4_dense.hpp",
  "src/core/iu4a4_projection_layout.hpp",
  "src/core/iu4a4_projections.hpp",
  "src/core/iu4a4_rot.hpp",
  "src/core/w4a16.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src", "src/src/core"]
arch      = "gfx1151"

[[provides]]
interface = "linear.decode/iu4/f16-f32.enginelab"
api       = "strix::core iu4*.hpp, w4a16.hpp"
numeric   = "INT4 weights with group scales; A4 or FP16 activations; FAST identity (changes bits, gated)"
regime    = "decode 1-8 rows; prefill tiles through core_tiled_wmma"

[[requires]]
module    = "kernel.enginelab.attn_contracts"

[[requires]]
module    = "kernel.enginelab.core_f16_dense"

[[requires]]
module    = "kernel.enginelab.core_tiled_wmma"

[[requires]]
module    = "kernel.enginelab.integer_projection"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
