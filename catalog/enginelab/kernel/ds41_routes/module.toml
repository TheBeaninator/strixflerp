id        = "kernel.enginelab.ds41_routes"
kind      = "kernel"
summary   = "DS41 MoE routing: the fast routes (HIP, with its body) and the MoE layer: 5 origin files under include/strix, src/ds41_moe.cpp, src/hip_ds41_routes_fast.hip, src/hip_ds41_routes_fast_body.hpp"
why       = "the DS41 router and routed-expert layer; where it would go: beside the catalogue's moe.router/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: moe.router/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 1 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/ds41_moe.hpp",
  "include/strix/hip_ds41_routes_fast.hpp",
  "src/ds41_moe.cpp",
  "src/hip_ds41_routes_fast.hip",
  "src/hip_ds41_routes_fast_body.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_ds41_routes_fast.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.router/-/f32.enginelab-ds41"
api       = "hip_ds41_routes_fast.hip, hip_ds41_rn_*.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.ds41_engine"

[[requires]]
module    = "kernel.enginelab.ds41_rows"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.moe_policy"

[[requires]]
module    = "runtime.enginelab.numeric"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.ds41_routes.json"
