id        = "kernel.enginelab.ds41_attention"
kind      = "kernel"
summary   = "DS41 attention: the HIP attention with F16 WMMA, flash and QK pieces, the attention host and state"
why       = "the DS41 compressed / selected attention on gfx1151; where it would go: a new strixflerp interface attn.ds41/-/bf16-f32.enginelab, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, attn.ds41/-/bf16-f32.enginelab. 1 HIP unit(s) compiled standalone by the gate; 3 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/deepseek41_attention_host.hpp",
  "include/strix/deepseek41_attention_state.hpp",
  "include/strix/ds41_attention.hpp",
  "include/strix/hip_ds41_attention.hpp",
  "src/deepseek41_attention_host.cpp",
  "src/deepseek41_attention_state.cpp",
  "src/ds41_attention.cpp",
  "src/hip_ds41_attention.hip",
  "src/hip_ds41_attention_f16wmma.inl",
  "src/hip_ds41_attention_flash.inl",
  "src/hip_ds41_attention_qk.inc",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_ds41_attention.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.ds41/-/bf16-f32.enginelab"
api       = "hip_ds41_attention.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.ds41_engine"

[[requires]]
module    = "executor.enginelab.ds41_prefill"

[[requires]]
module    = "kernel.enginelab.attn_core_flash"

[[requires]]
module    = "kernel.enginelab.attn_core_select"

[[requires]]
module    = "kernel.enginelab.attn_core_sparse_mla"

[[requires]]
module    = "kernel.enginelab.ds41_trellis"

[[requires]]
module    = "kernel.enginelab.ops_a8"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.ds41_attention.json"
