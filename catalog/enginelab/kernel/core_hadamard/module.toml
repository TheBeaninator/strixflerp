id        = "kernel.enginelab.core_hadamard"
kind      = "kernel"
summary   = "the Hadamard transform helper of the shared core: 1 origin files under src/core"
why       = "rotations ahead of low-bit operands (IU4 x A4); where it would go: beside the catalogue's rotate.fwht/-/f16 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: rotate.fwht/-/f16 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = ["src/core/hadamard.hpp"]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src", "src/src/core"]
arch      = "gfx1151"

[[provides]]
interface = "rotate.fwht/-/f16.enginelab"
api       = "strix::core hadamard.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
