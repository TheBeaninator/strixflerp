id        = "kernel.enginelab.hy4_hip"
kind      = "kernel"
summary   = "Hy4 HIP forward, plan and rows: 5 origin files under src/hy4"
why       = "Hy4-flash on gfx1151 (16.8 tok/s one node, 1,270 prefill on the pair); where it would go: beside the catalogue's executor.forward/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.forward/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

