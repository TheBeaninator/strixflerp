id        = "kernel.enginelab.core_common"
kind      = "kernel"
summary   = "the remaining shared-core headers: backend selection (backend.hpp, backend_hip.hpp), byte budget and range, GLU pair, glu / pointwise / round-store, ordered reduce, numeric partition, NVFP4 BF16 table, null perturbation, block-draft reference, GPU port and SHA-256, weight archive and certificate, weight decode, file source, load queue and slice loader, host lane and free memory, layer set, load cohort, looped layers, window state buffers, HIP host ready, range weight loader and weight uploader"
why       = "the plumbing the shared kernels and loaders compile against; every other core module includes some of it; where it would go: beside the catalogue's kernel-abi.enginelab-core/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: kernel-abi.enginelab-core/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 4 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

