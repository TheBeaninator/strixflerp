id        = "kernel.enginelab.moe_core_prefill"
kind      = "kernel"
summary   = "grouped MoE prefill kernel bodies: the HIP MoE prefill cores (p1, core2, g3, da16, GSQ FP16 / WMMA, F16x project and down bodies, k-quant down, LDS epilogue), the DS41 grouped prefill and its variants, the one-split prefill, Qwen grouped tiles and k-quant decode, dense A8 small, k-quant block reads and the EXL3 trellis copy"
why       = "MoE prefill is where WMMA pays most; this is the shared grouped-GEMM family that Qwen, DS41, GLM and MiniMax prefill bind; where it would go: beside the catalogue's moe.experts-prefill/gguf-kquant+gsq+exl3/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: moe.experts-prefill/gguf-kquant+gsq+exl3/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

