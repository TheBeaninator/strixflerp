id        = "kernel.enginelab.core_gemv_rows"
kind      = "kernel"
summary   = "the decode GEMV rows family: the GEMV policy and its direct, look-ahead and staged row main loops, row layouts and transforms, resident Q8 rows and row plans, step rows / inputs plans, Q8_0 transpose, low-bit and microscaled FP16 staging, the linear plan table and references, direct row fetch and layer read-ahead"
why       = "one kernel family for 1-8 row decode projections across weight formats, with the staging that hides UMA reads; the shape strixflerp's linear.decode providers fill; where it would go: beside the catalogue's linear.decode/q8_0+lowbit+microscaled/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.decode/q8_0+lowbit+microscaled/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

