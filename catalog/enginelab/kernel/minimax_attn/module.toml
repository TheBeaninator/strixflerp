id        = "kernel.enginelab.minimax_attn"
kind      = "kernel"
summary   = "MiniMax attention: index projection, MSA fused, flash policy, in-block layout, norm-rope and select dump; the MSA (HIP) entry"
why       = "MiniMax's sparse attention (docs/minimax-msa.md); where it would go: a new strixflerp interface attn.msa/-/bf16-f32.enginelab-minimax, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, attn.msa/-/bf16-f32.enginelab-minimax. 5 HIP unit(s) compiled standalone by the gate; 1 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

