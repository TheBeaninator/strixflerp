id        = "kernel.enginelab.moe_launch"
kind      = "kernel"
summary   = "MoE decode launchers: experts launcher, route launcher, route BF16 and prune, direct-B, the overlap dispatcher, slot merge and the batched activation diagnostic"
why       = "the Qwen MoE decode launches and their overlap; where it would go: beside the catalogue's moe.experts-decode/-/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: moe.experts-decode/-/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 3 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/hip_moe_experts_launcher.hpp",
  "include/strix/hip_moe_overlap_dispatcher.hpp",
  "include/strix/hip_moe_route_launcher.hpp",
  "include/strix/moe_batched_activation_diagnostic.hpp",
  "include/strix/moe_route_bf16.hpp",
  "include/strix/moe_route_prune.hpp",
  "include/strix/moe_slot_merge.hpp",
  "src/hip_moe_direct_b.inc",
  "src/hip_moe_experts_launcher.hip",
  "src/hip_moe_overlap_dispatcher.hip",
  "src/hip_moe_route_bf16.inc",
  "src/hip_moe_route_launcher.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = [
  "src/src/hip_moe_experts_launcher.hip",
  "src/src/hip_moe_overlap_dispatcher.hip",
  "src/src/hip_moe_route_launcher.hip",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/-/f16-f32.enginelab-launch"
api       = "hip_moe_experts_launcher.hip, hip_moe_overlap_dispatcher.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.qwen_engine"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.hip_weight"

[[requires]]
module    = "kernel.enginelab.core_gemv_rows"

[[requires]]
module    = "kernel.enginelab.integer_projection"

[[requires]]
module    = "kernel.enginelab.moe_core_route"

[[requires]]
module    = "kernel.enginelab.moe_prefill_launch"

[[requires]]
module    = "kernel.enginelab.moe_q4k_a8"

[[requires]]
module    = "kernel.enginelab.mtp_draft_head"

[[requires]]
module    = "kernel.enginelab.rows_select"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.known_prompt"

[[requires]]
module    = "runtime.enginelab.launch"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.moe_policy"

[[requires]]
module    = "runtime.enginelab.moe_schedule"

[[requires]]
module    = "runtime.enginelab.mtp_forward"

[[requires]]
module    = "runtime.enginelab.prepared_views"

[[requires]]
module    = "runtime.enginelab.serial_session"

[[requires]]
module    = "serve.enginelab.serving_cohort"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.moe_launch.json"
