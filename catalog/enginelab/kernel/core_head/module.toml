id        = "kernel.enginelab.core_head"
kind      = "kernel"
summary   = "LM head and output kernels of the shared core: head argmax plans and emit, the screened head (a cheap screen then the exact rows that can win), the Markov head device / reference / round, BF16 embedding rows and the device token-sampling body"
why       = "the greedy head is a large decode cost; the screened head keeps the exact argmax while reading fewer vocabulary rows; where it would go: beside the catalogue's logits.head/bf16/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: logits.head/bf16/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/core/head_argmax_plan.hpp",
  "src/core/head_emit.hpp",
  "src/core/hip_bf16_embedding_rows.hpp",
  "src/core/hip_screened_head.hpp",
  "src/core/markov_head_device.hpp",
  "src/core/markov_head_reference.hpp",
  "src/core/markov_head_round.hpp",
  "src/core/screened_head.hpp",
  "src/core/screened_head_plan.hpp",
  "src/core/token_sampling_device_body.inl",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "logits.head/bf16/f32.enginelab"
api       = "strix::core head_*.hpp, screened_head*.hpp"
numeric   = "exact argmax over FP32 logits"
regime    = "decode"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.weight_core"

[[requires]]
module    = "format.enginelab.weight_formats"

[[requires]]
module    = "kernel.enginelab.attn_contracts"

[[requires]]
module    = "kernel.enginelab.core_common"

[[requires]]
module    = "kernel.enginelab.core_f16_dense"

[[requires]]
module    = "kernel.enginelab.core_gemv_rows"

[[requires]]
module    = "kernel.enginelab.logits_head"

[[requires]]
module    = "kernel.enginelab.token_sampling"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.launch"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.logprobs"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
