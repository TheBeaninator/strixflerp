[[requires]]
module    = "kernel.enginelab.ops_glu"

[[requires]]
module    = "runtime.enginelab.glm_rtxpf"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.pair_link"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
