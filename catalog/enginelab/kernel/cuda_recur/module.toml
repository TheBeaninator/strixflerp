id        = "kernel.enginelab.cuda_recur"
kind      = "kernel"
summary   = "CUDA recurrence: chunk, decode, lanes, math, norm, parity and plan: 9 origin files under src/cuda"
why       = "GDN on the RTX route; where it would go: beside the catalogue's mixer.gdn/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: mixer.gdn/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/cuda/core/recur_chunk.cu",
  "src/cuda/core/recur_cuda.cu",
  "src/cuda/core/recur_cuda.cuh",
  "src/cuda/core/recur_decode.cu",
  "src/cuda/core/recur_lanes.cuh",
  "src/cuda/core/recur_math.cuh",
  "src/cuda/core/recur_norm.cuh",
  "src/cuda/core/recur_parity.cu",
  "src/cuda/core/recur_plan.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "mixer.gdn/-/f32.enginelab-cuda"
api       = "src/cuda/core/recur_*.cu"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.attn_core_prepared"

[[requires]]
module    = "kernel.enginelab.core_short_conv"

[[requires]]
module    = "kernel.enginelab.cuda_core_common"

[[requires]]
module    = "kernel.enginelab.ops_recur"

[[requires]]
module    = "runtime.enginelab.cuda_exec"

[[requires]]
module    = "runtime.enginelab.numeric"

[[requires]]
module    = "runtime.enginelab.recurrent_state"

[[requires]]
module    = "runtime.enginelab.state_txn"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source for the optional RTX PRO route: no CUDA toolkit on the island and no NVIDIA device on the pod, so it is not compiled"
