[[requires]]
module    = "kernel.enginelab.core_hadamard"

[[requires]]
module    = "kernel.enginelab.core_hc"

[[requires]]
module    = "kernel.enginelab.core_integer"

[[requires]]
module    = "kernel.enginelab.core_iu4"

[[requires]]
module    = "kernel.enginelab.core_trellis"

[[requires]]
