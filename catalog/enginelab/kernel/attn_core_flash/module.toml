id        = "kernel.enginelab.attn_core_flash"
kind      = "kernel"
summary   = "the shared dense flash attention: dense decode and its flash form with key split and budget, dense and banded flash prefill, the flash core, tile, prefill policy and tile stage, WMMA fragments and types, online softmax, masks, relative bias, position split and the two-term cost model"
why       = "one attention family for every engine's dense GQA layers, decode and prefill, WMMA on gfx1151; where it would go: beside the catalogue's attn.softmax-gqa/-/bf16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: attn.softmax-gqa/-/bf16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

