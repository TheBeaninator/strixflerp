id        = "kernel.enginelab.hc_prefill"
kind      = "kernel"
summary   = "hyper-connection prefill (qpf2k): the HC prefill with inverse reuse (and layout), out16 and output3 bodies"
why       = "the prompt-path HC mix; where it would go: beside the catalogue's hc.mix-prefill/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: hc.mix-prefill/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/hip_qpf2k_hc.inc",
  "src/hip_qpf2k_hc_inverse_reuse.inc",
  "src/hip_qpf2k_hc_out16.inc",
  "src/hip_qpf2k_hc_output3_body.inc",
  "src/qpf2k_hc_inverse_reuse_layout.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "hc.mix-prefill/-/f32.enginelab"
api       = "hip_qpf2k_hc*.inc"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.levers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
