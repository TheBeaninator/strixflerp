id        = "kernel.enginelab.cuda_dense"
kind      = "kernel"
summary   = "CUDA dense: dense, IMMA dense and tiles, MMA tiles, native MMA and reuse: 5 origin files under src/cuda"
why       = "dense projections on tensor cores; where it would go: beside the catalogue's linear.dense/-/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.dense/-/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/cuda/core/imma_dense.cuh",
  "src/cuda/core/imma_tile.cuh",
  "src/cuda/core/mma_tile.cuh",
  "src/cuda/core/native_mma.hpp",
  "src/cuda/core/native_reuse.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = ["src/src", "src/src/cuda/core"]
arch      = "gfx1151"

[[provides]]
interface = "linear.dense/-/f16-f32.enginelab-cuda"
api       = "src/cuda/core/dense/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.cuda_core_common"

[[requires]]
module    = "kernel.enginelab.moe_core_grouped"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source for the optional RTX PRO route: no CUDA toolkit on the island and no NVIDIA device on the pod, so it is not compiled"
