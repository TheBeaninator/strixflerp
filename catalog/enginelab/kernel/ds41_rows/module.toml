id        = "kernel.enginelab.ds41_rows"
kind      = "kernel"
summary   = "DS41 dense rows: F16 rows, fast F8 rows, native FP8, the integer operand, formats, packed weights, the IQ2_XXS grid (from ggml, MIT), the dense adapter, FP16 dense, geometry and plan, and the RN wide rows (STRIX_DS41_RN_WIDE: a per site x format x rows table choosing between the engine kernel and multi-row forms for Q8_0 / U6 rows 2-8, all variants bitwise equal)"
why       = "the non-expert projections of DS41 in its native FP8 / GGUF forms; where it would go: beside the catalogue's linear.decode/fp8+gguf/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.decode/fp8+gguf/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 6 HIP unit(s) compiled standalone by the gate; 3 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

