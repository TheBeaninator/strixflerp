id        = "kernel.enginelab.indexed_attention"
kind      = "kernel"
summary   = "the indexed attention launcher (HIP; it includes the QSA kernel bodies), state and workspace"
why       = "the decode-side entry of QSA attention; where it would go: beside the catalogue's attn.qsa-indexer/-/bf16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: attn.qsa-indexer/-/bf16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 2 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/hip_indexed_attention_launcher.hpp",
  "include/strix/indexed_attention_state.hpp",
  "include/strix/indexed_attention_workspace.hpp",
  "src/hip_indexed_attention_launcher.hip",
  "src/indexed_attention_state.cpp",
  "src/indexed_attention_workspace.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_indexed_attention_launcher.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.qsa-indexer/-/bf16-f32.enginelab-decode"
api       = "hip_indexed_attention_launcher.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.weight_core"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "kernel.enginelab.attn_core_select"

[[requires]]
module    = "kernel.enginelab.attn_core_sparse_mla"

[[requires]]
module    = "kernel.enginelab.dense_launch"

[[requires]]
module    = "kernel.enginelab.moe_q4k_a8"

[[requires]]
module    = "kernel.enginelab.mtp_draft_head"

[[requires]]
module    = "kernel.enginelab.q8_rows"

[[requires]]
module    = "kernel.enginelab.qsa_prefill"

[[requires]]
module    = "kernel.enginelab.qwen_rotary"

[[requires]]
module    = "kernel.enginelab.rows_select"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.graph"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.known_prompt"

[[requires]]
module    = "runtime.enginelab.launch"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.moe_schedule"

[[requires]]
module    = "runtime.enginelab.mtp_forward"

[[requires]]
module    = "runtime.enginelab.prefill_plan"

[[requires]]
module    = "runtime.enginelab.prepared_views"

[[requires]]
module    = "runtime.enginelab.qpf2k_schedule"

[[requires]]
module    = "runtime.enginelab.qsa_plan"

[[requires]]
module    = "runtime.enginelab.session_snapshot"

[[requires]]
module    = "runtime.enginelab.test_hooks"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.indexed_attention.json"
