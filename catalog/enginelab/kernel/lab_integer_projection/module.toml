id        = "kernel.enginelab.lab_integer_projection"
kind      = "kernel"
summary   = "the integer projection lab kernel with offline compile scripts (lab/integer_projection)"
why       = "the INT projection kernel before it moved to src; where it would go: a new strixflerp interface kernel-research.enginelab-lab-integer-projection/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, kernel-research.enginelab-lab-integer-projection/-/-. 1 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "lab/integer_projection/CMakeLists.txt",
  "lab/integer_projection/README.md",
  "lab/integer_projection/compile_offline.sh",
  "lab/integer_projection/compile_runtime_offline.sh",
  "lab/integer_projection/integer_projection.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
