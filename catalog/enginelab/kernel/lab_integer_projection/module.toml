[build]
lang      = "hip-c++"
sources   = ["src/lab/integer_projection/integer_projection.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-research.enginelab-lab-integer-projection/-/-"
api       = "lab/integer_projection"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.integer_projection"

[gate]
parity    = "none"
bench     = "none"
