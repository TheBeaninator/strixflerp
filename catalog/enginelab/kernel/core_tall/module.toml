id        = "kernel.enginelab.core_tall"
kind      = "kernel"
summary   = "tall (many-row) linear plans: the tall chunk policy, tall family selection and the tall K plan"
why       = "the prefill-side split of the same projections when M grows past the rows family; where it would go: beside the catalogue's linear.prefill/-/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.prefill/-/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = ["src/core/tall_chunk_policy.hpp", "src/core/tall_family.hpp", "src/core/tall_k_plan.hpp"]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "linear.prefill/-/f16-f32.enginelab-tall"
api       = "strix::core tall_*.hpp"
numeric   = "as the rows family"
regime    = "prefill chunks"

[[requires]]
module    = "kernel.enginelab.core_bf16"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
