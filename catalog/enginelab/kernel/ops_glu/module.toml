id        = "kernel.enginelab.ops_glu"
kind      = "kernel"
summary   = "GLU ops: GLU (device), Q8 rows GLU pair and SwiGLU rows: 4 origin files under src/ops"
why       = "the gated FFN activation; where it would go: beside the catalogue's act.swiglu/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: act.swiglu/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/ops/glu/glu.hpp",
  "src/ops/glu/glu_device.hpp",
  "src/ops/glu/q8_rows_glu_pair.hpp",
  "src/ops/glu/swiglu_rows.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/src", "src/src/ops", "src/src/ops/glu"]
arch      = "gfx1151"

[[provides]]
interface = "act.swiglu/-/f32.enginelab"
api       = "src/ops/glu/*.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.weight_formats"

[[requires]]
module    = "kernel.enginelab.core_common"

[[requires]]
module    = "kernel.enginelab.ops_a8"

[[requires]]
module    = "kernel.enginelab.q8_rows"

[[requires]]
module    = "runtime.enginelab.moe_policy"

[[requires]]
module    = "runtime.enginelab.numeric"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
