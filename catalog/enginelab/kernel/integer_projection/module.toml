id        = "kernel.enginelab.integer_projection"
kind      = "kernel"
summary   = "integer and packed projections: the integer projection (HIP), its execution and runtime, packed projection, projection reduction, on-the-fly INT4 (generic and Qwen), low precision, GSQ A8 groups, decode projection groups and the weight sweep"
why       = "integer-dot projections for the GSQ and on-the-fly INT4 FAST levers; where it would go: beside the catalogue's linear.decode/gsq+iu4/a8-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: linear.decode/gsq+iu4/a8-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 HIP unit(s) compiled standalone by the gate; 7 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

