id        = "kernel.enginelab.moe_q4k_a8"
kind      = "kernel"
summary   = "Q4_K x A8 MoE: the Q4K-A8 contract, known rows, probe and runtime, the A8 down contract, q51 grouped down (contract, probe), known rows and slot-parallel contract"
why       = "an integer A8 expert path over Q4_K experts; where it would go: beside the catalogue's moe.experts-decode/q4_k/a8-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: moe.experts-decode/q4_k/a8-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 HIP unit(s) compiled standalone by the gate; 5 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

