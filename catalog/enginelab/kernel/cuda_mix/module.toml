id        = "kernel.enginelab.cuda_mix"
kind      = "kernel"
summary   = "CUDA hyper-connection mix: body, latency plan, transition: 5 origin files under src/cuda"
why       = "HC on the RTX route; where it would go: beside the catalogue's hc.mix/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: hc.mix/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/cuda/core/mix_body.inc",
  "src/cuda/core/mix_cuda.cuh",
  "src/cuda/core/mix_cuda_latency.cuh",
  "src/cuda/core/mix_cuda_latency_plan.hpp",
  "src/cuda/core/mix_cuda_transition.cuh",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "hc.mix/-/f32.enginelab-cuda"
api       = "src/cuda/core/mix_*.cu"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.core_hc"

[[requires]]
module    = "kernel.enginelab.cuda_core_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source for the optional RTX PRO route: no CUDA toolkit on the island and no NVIDIA device on the pod, so it is not compiled"
