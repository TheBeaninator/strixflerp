id        = "kernel.enginelab.moe_core_grouped"
kind      = "kernel"
summary   = "the grouped expert GEMM family: grouped core, dispatch, policy and rows, grouped F16 / A8-F16 / integer decode / IU4 x A4 (contract, plan) / W4A4 / microscaled forms, grouped tall plan, device grouped plan, expert-major plan, class tree and pair gather"
why       = "one MoE grouped GEMM family per AGENTS.md: every engine's routed experts in decode and verify windows run through it; where it would go: beside the catalogue's moe.experts-decode/iu4+w4a4+f16/f16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: moe.experts-decode/iu4+w4a4+f16/f16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

