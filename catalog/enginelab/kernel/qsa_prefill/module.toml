id        = "kernel.enginelab.qsa_prefill"
kind      = "kernel"
summary   = "QSA (Qwen3.8-Flash-Next sparse attention) prefill kernels: the fast prefill profile (union of TR rows' selections in 4-token blocks, WMMA S^T = K x Q^T and O^T += V^T x P^T with FP32 accumulation, power-of-two Q scaling) with its KV-pair, pipe, shadow and share forms, prefill batch, budget, flash, index and stages, index band and WMMA score, pooled and stage scores, scatter, score scratch, cohort part 2 and committed pool"
why       = "WMMA sparse prefill at 8-32K for the 12 QSA layers of Qwen3.8-Flash-Next; where it would go: beside the catalogue's attn.qsa-indexer/-/bf16-f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: attn.qsa-indexer/-/bf16-f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
