id        = "kernel.enginelab.ds41_engram"
kind      = "kernel"
summary   = "engram lookup: the hasher, read-ahead, row prep, row reader and spec (src/engram, include/strix/engram) with its HIP inject and row kernels, and DS41's engram and diagnostics"
why       = "a hashed n-gram embedding table read ahead of the layer that injects it; StrixFold's engram is the pod's counterpart; where it would go: a new strixflerp interface embed.engram/-/bf16.enginelab, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, embed.engram/-/bf16.enginelab. 5 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

