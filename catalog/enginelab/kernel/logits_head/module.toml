id        = "kernel.enginelab.logits_head"
kind      = "kernel"
summary   = "the LM head launcher (HIP), head argmax and argmax core, decode head rows, the integer head and logit rows"
why       = "greedy decode output; where it would go: beside the catalogue's logits.argmax/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: logits.argmax/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/decode_head_rows.hpp",
  "include/strix/decode_integer_head.hpp",
  "include/strix/head_argmax.hpp",
  "include/strix/hip_argmax_core.hpp",
  "include/strix/hip_lm_head_launcher.hpp",
  "include/strix/logit_rows.hpp",
  "src/hip_lm_head_launcher.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_lm_head_launcher.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "logits.argmax/-/f32.enginelab"
api       = "hip_lm_head_launcher.hip"
numeric   = "exact argmax"
regime    = "decode"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.hip_weight"

[[requires]]
module    = "kernel.enginelab.dense_launch"

[[requires]]
module    = "kernel.enginelab.gdn_decode"

[[requires]]
module    = "kernel.enginelab.integer_projection"

[[requires]]
module    = "kernel.enginelab.q8_rows"

[[requires]]
module    = "kernel.enginelab.rows_select"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.known_prompt"

[[requires]]
module    = "runtime.enginelab.launch"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.mtp_forward"

[[requires]]
module    = "runtime.enginelab.qpf2k_schedule"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.logits_head.json"
