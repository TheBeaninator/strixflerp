id        = "kernel.enginelab.rows_select"
kind      = "kernel"
summary   = "row-kernel selection: rows fit and launch registry, R1 row tiles, wave fit, wave32 DPP and the Qwen DPP reduce, FMA rows policy, split-K policy and A8 row pitch"
why       = "picks the rows kernel and split per shape; where it would go: beside the catalogue's kernel-select.rows/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: kernel-select.rows/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
