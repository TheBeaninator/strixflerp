id        = "kernel.enginelab.lab_packed_projection"
kind      = "kernel"
summary   = "the packed projection lab: IQ4_XS and Q8 projections (lab/packed_projection): 4 origin files under lab/packed_projection"
why       = "packed GEMV prototypes; where it would go: a new strixflerp interface kernel-research.enginelab-lab-packed-projection/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, kernel-research.enginelab-lab-packed-projection/-/-. 2 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "lab/packed_projection/CMakeLists.txt",
  "lab/packed_projection/README.md",
  "lab/packed_projection/iq4_xs_projection.hip",
  "lab/packed_projection/q8_projection.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/lab/packed_projection/iq4_xs_projection.hip", "src/lab/packed_projection/q8_projection.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-research.enginelab-lab-packed-projection/-/-"
api       = "lab/packed_projection"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.integer_projection"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.enginelab.lab_packed_projection.json"
