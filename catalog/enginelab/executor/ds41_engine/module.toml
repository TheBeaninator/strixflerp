id        = "executor.enginelab.ds41_engine"
kind      = "executor"
summary   = "the DeepSeek V4.1 engine: model, family, plan, describe and model description, host / device / batch forward and batch schedule, layer, pair defaults and pair profile table, exact flags and fast profile, the file reader, weight overlay and read options, prepared load and the MSVC builtins shim"
why       = "the binding of DS41 to the shared cores: what is model-specific and nothing else (AGENTS.md); where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 3 HIP unit(s) compiled standalone by the gate; 11 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

