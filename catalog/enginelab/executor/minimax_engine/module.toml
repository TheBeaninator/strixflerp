id        = "executor.enginelab.minimax_engine"
kind      = "executor"
summary   = "the MiniMax M3.1 engine: deployment, linear drafter, engine, common, defaults, fast INT4, kernels, pack, profile table, prefill timeline, route identity; model assets, description and graph; include/strix/minimax; the layer cut"
why       = "MiniMax M3.1 Flash on two nodes (24.2 tok/s 1K, 621.6 prefill at 8K); where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 HIP unit(s) compiled standalone by the gate; 6 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights). Requires kernel.strix_trellis.c_api: the origin builds these against the external strix-trellis library (CMakeLists.txt STRIX_DS41_TRELLIS_INCLUDE_DIR, include <strix_trellis.h>), which is catalog/strix_trellis here."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
