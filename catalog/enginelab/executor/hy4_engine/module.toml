id        = "executor.enginelab.hy4_engine"
kind      = "executor"
summary   = "the Hy4 engine root and serving (session service, include/strix/hy4): 7 origin files under include/strix, src/hy4"
why       = "Hy4-flash binding; where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/hy4/engram_spec.hpp",
  "include/strix/hy4/placement.hpp",
  "include/strix/hy4/presets.hpp",
  "include/strix/hy4/tp_layout.hpp",
  "src/hy4/hy4_engram_spec.cpp",
  "src/hy4/serve/session_service.cpp",
  "src/hy4/serve/session_service.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/hy4/hy4_engram_spec.cpp", "src/src/hy4/serve/session_service.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "executor.model-enginelab-hy4/-/-"
api       = "src/hy4/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.weight_core"

[[requires]]
module    = "kernel.enginelab.attn_contracts"

[[requires]]
module    = "kernel.enginelab.ds41_engram"

[[requires]]
module    = "kernel.enginelab.hc_hyper"

[[requires]]
module    = "kernel.enginelab.moe_q4k_a8"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.moe_policy"

[[requires]]
module    = "runtime.enginelab.pair_pipeline"

[[requires]]
module    = "serve.enginelab.serve_chat"

[[requires]]
module    = "serve.enginelab.serve_http"

[[requires]]
module    = "serve.enginelab.serve_session"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
