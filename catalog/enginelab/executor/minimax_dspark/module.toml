id        = "executor.enginelab.minimax_dspark"
kind      = "executor"
summary   = "MiniMax DSpark: HIP DSpark, Markov candidates, auto mode, DSpark files and host, n-gram drafter, reference and tests"
why       = "DSpark auto on MiniMax: 23.3 -> 32.4 code tok/s (README); where it would go: beside the catalogue's draft.dspark/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: draft.dspark/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 4 HIP unit(s) compiled standalone by the gate; 4 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

