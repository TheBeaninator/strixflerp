id        = "executor.enginelab.ds41_dspark"
kind      = "executor"
summary   = "DSpark speculative drafting for DeepSeek V4.1: the DSpark driver, context, files and vocabulary, the DSpark target and batch DSpark forward, the speculative tail and the pipelined DSpark"
why       = "the drafting that lifts DS41 pair decode from 26.8 to 41.7-60.0 tok/s with exact outputs (README, f42edd05e); where it would go: beside the catalogue's draft.dspark/-/f32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: draft.dspark/-/f32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 3 HIP unit(s) compiled standalone by the gate; 5 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/deepseek41_batch_dspark.hpp",
  "include/strix/deepseek41_dspark_target.hpp",
  "include/strix/ds41_dspark.hpp",
  "include/strix/ds41_dspark_context.hpp",
  "include/strix/ds41_dspark_driver.hpp",
  "include/strix/ds41_dspark_files.hpp",
  "include/strix/ds41_dspark_vocab.hpp",
  "include/strix/ds41_pipeline_dspark.hpp",
  "include/strix/ds41_spec_tail.hpp",
  "include/strix/hip_ds41_dspark.hpp",
  "src/ds41_dspark.cpp",
  "src/ds41_dspark_driver.cpp",
  "src/ds41_dspark_files.cpp",
  "src/ds41_dspark_vocab.cpp",
  "src/ds41_pipeline_dspark.cpp",
  "src/hip_deepseek41_batch_dspark.hip",
  "src/hip_ds41_dspark.hip",
  "src/hip_ds41_spec_tail.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = [
  "src/src/hip_deepseek41_batch_dspark.hip",
  "src/src/hip_ds41_dspark.hip",
  "src/src/hip_ds41_spec_tail.hip",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "draft.dspark/-/f32.enginelab-ds41"
api       = "src/ds41_dspark*.cpp, hip_ds41_dspark.hip"
numeric   = "EXACT profile: bitwise the engine's declared reference (fixed fmaf order, -ffp-contract=off, denormals kept); FAST levers change bits only behind the quality gate (AGENTS.md)"
regime    = "pair decode"

[[requires]]
module    = "executor.enginelab.ds41_engine"

[[requires]]
module    = "executor.enginelab.ds41_pipeline"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "kernel.enginelab.core_hc"

[[requires]]
module    = "kernel.enginelab.ds41_routes"

[[requires]]
module    = "kernel.enginelab.ds41_rows"

[[requires]]
module    = "kernel.enginelab.dspark_markov"

[[requires]]
module    = "kernel.enginelab.logits_head"

[[requires]]
module    = "kernel.enginelab.moe_core_route"

[[requires]]
module    = "kernel.enginelab.ops_norm"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.prompt_lookup"

[[requires]]
module    = "runtime.enginelab.spec_core"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/executor.enginelab.ds41_dspark.json"
