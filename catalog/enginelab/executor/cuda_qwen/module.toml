id        = "executor.enginelab.cuda_qwen"
kind      = "executor"
summary   = "Qwen on CUDA (src/cuda/models/qwen, include/strix/cuda/qwen_*, src/qwen35/cuda): 40 origin files under include/strix, src/cuda"
why       = "the RTX Qwen route (85-96 tok/s serial, 600+ with MTP + wide on JSON); where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

