[[requires]]
module    = "kernel.enginelab.attn_core_flash"

[[requires]]
module    = "kernel.enginelab.attn_core_prepared"

[[requires]]
module    = "kernel.enginelab.core_bf16"

[[requires]]
module    = "kernel.enginelab.core_common"

[[requires]]
module    = "kernel.enginelab.core_f16_dense"

[[requires]]
