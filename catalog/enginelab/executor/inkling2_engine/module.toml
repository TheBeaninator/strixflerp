[[requires]]
module    = "kernel.enginelab.core_hc"

[[requires]]
module    = "kernel.enginelab.core_head"

[[requires]]
module    = "kernel.enginelab.inkling2_attention"

[[requires]]
module    = "kernel.enginelab.inkling2_moe"

[[requires]]
module    = "kernel.enginelab.moe_core_grouped"

[[requires]]
module    = "kernel.enginelab.ops_norm"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
