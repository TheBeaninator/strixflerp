id        = "executor.enginelab.cuda_minimax"
kind      = "executor"
summary   = "MiniMax on CUDA: 17 origin files under src/cuda"
why       = "the RTX MiniMax route; where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/cuda/models/minimax/.gitignore",
  "src/cuda/models/minimax/bench/core_bench.cu",
  "src/cuda/models/minimax/bench/count_core_sass.py",
  "src/cuda/models/minimax/build_bench.bat",
  "src/cuda/models/minimax/build_prefill.bat",
  "src/cuda/models/minimax/build_tests.bat",
  "src/cuda/models/minimax/fp32_identity.cu",
  "src/cuda/models/minimax/mm_fp32_identity_tests.cu",
  "src/cuda/models/minimax/mm_rtx_kernels.cu",
  "src/cuda/models/minimax/mm_rtx_kernels.cuh",
  "src/cuda/models/minimax/mm_rtx_layercut.inc",
  "src/cuda/models/minimax/mm_rtx_pack.cpp",
  "src/cuda/models/minimax/mm_rtx_pack.hpp",
  "src/cuda/models/minimax/mm_rtx_prefill_main.cu",
  "src/cuda/models/minimax/mm_rtx_weights.cpp",
  "src/cuda/models/minimax/mm_rtx_weights.hpp",
  "src/cuda/models/minimax/ptxas.bat",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "executor.model-enginelab-minimax-cuda/-/-"
api       = "src/cuda/models/minimax/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.minimax_engine"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.minimax_rtxpf"

[[requires]]
module    = "runtime.enginelab.pair_state"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source for the optional RTX PRO route: no CUDA toolkit on the island and no NVIDIA device on the pod, so it is not compiled"
