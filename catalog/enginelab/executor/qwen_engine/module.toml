id        = "executor.enginelab.qwen_engine"
kind      = "executor"
summary   = "the Qwen engines: Qwen3.8-Flash-Next and Qwen3.8-27B model descriptions, MoE prepared and BF16 router, all-on, profile table, target state digest, weight packs, the Qwen 3.5 config, family, HIP engine and spec costs, pair plan and prefill controls / windows (include/strix/qwen35), the 27B model and the HTTP session owner and service"
why       = "the binding of Qwen3.8 to the shared cores; the fastest one-node path of the lab (51 tok/s MTP at 32K, 153-155 edit tok/s served); where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 9 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

