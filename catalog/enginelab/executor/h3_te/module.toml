id        = "executor.enginelab.h3_te"
kind      = "executor"
summary   = "H3 text encoder (src/h3/te): 10 origin files under src/h3"
why       = "the text encoder of the image model; where it would go: a new strixflerp interface media.text-encoder/-/f32.enginelab-h3, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, media.text-encoder/-/f32.enginelab-h3. 1 HIP unit(s) compiled standalone by the gate; 3 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/h3/te/te_gpu.hip",
  "src/h3/te/te_gpu.hpp",
  "src/h3/te/te_pack_reader.cpp",
  "src/h3/te/te_pack_reader.hpp",
  "src/h3/te/te_sha256.hpp",
  "src/h3/te/te_tokenizer.cpp",
  "src/h3/te/te_tokenizer.hpp",
  "src/h3/te/te_unicode_tables.inc",
  "src/h3/te/te_vision_host.cpp",
  "src/h3/te/te_vision_host.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/h3/te/te_gpu.hip"]
includes  = ["src/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "media.text-encoder/-/f32.enginelab-h3"
api       = "src/h3/te/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.vision"

[[requires]]
module    = "kernel.enginelab.core_common"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "serve.enginelab.serve_http"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/executor.enginelab.h3_te.json"
