sources   = [
  "src/src/glm/engine/engine.hip",
  "src/src/glm/engine/glm_fast_attn.hip",
  "src/src/glm/engine/glm_fast_moe.hip",
  "src/src/glm/engine/glm_r1b.hip",
]
