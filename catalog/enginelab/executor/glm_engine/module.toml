id        = "executor.enginelab.glm_engine"
kind      = "executor"
summary   = "the GLM-5.3 engine: engine, embed splice, fast attention, fast INT4 defaults and pack, fast MoE, JSON, library, memory, pack and the R1b generated identity (bitwise equal to the host emulation by construction); host, HC and math headers; the pair profile table"
why       = "GLM-5.3 Flash on two nodes: 25.7 tok/s plain, 40.4-66.5 with MTP + wide (README); where it would go: beside the catalogue's executor.model/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.model/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 4 HIP unit(s) compiled standalone by the gate; 3 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights). Requires kernel.strix_trellis.c_api: the origin builds these against the external strix-trellis library (CMakeLists.txt STRIX_DS41_TRELLIS_INCLUDE_DIR, include <strix_trellis.h>), which is catalog/strix_trellis here."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/glm/engine.hpp",
  "include/strix/glm_pair_profile_table.hpp",
  "src/glm/common/glm_hc.hpp",
  "src/glm/common/glm_math.hpp",
