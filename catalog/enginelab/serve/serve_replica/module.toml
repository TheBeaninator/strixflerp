id        = "serve.enginelab.serve_replica"
kind      = "serve"
summary   = "replica routing: the replica router and proxy: 4 origin files under include/strix, src/serve"
why       = "Qwen on two nodes as two replicas behind one router (strix_router); where it would go: a new strixflerp interface serve.replica-router/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, serve.replica-router/-/-. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/serve/replica_proxy.hpp",
  "include/strix/serve/replica_router.hpp",
  "src/serve/replica_proxy.cpp",
  "src/serve/replica_router.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/serve/replica_proxy.cpp", "src/src/serve/replica_router.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "serve.replica-router/-/-"
api       = "strix::serve replica_router.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "serve.enginelab.serve_http"

[[requires]]
module    = "serve.enginelab.serve_session"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
