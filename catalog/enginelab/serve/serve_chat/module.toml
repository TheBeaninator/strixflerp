id        = "serve.enginelab.serve_chat"
kind      = "serve"
summary   = "chat templates: the template engine and kit, and the DeepSeek, GLM, Hy4 and Inkling 2 chat formats"
why       = "rendering a conversation to tokens per model; where it would go: beside the catalogue's text.chat-template/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: text.chat-template/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 6 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/serve/chat_template.hpp",
  "include/strix/serve/chat_template_kit.hpp",
  "include/strix/serve/deepseek_chat.hpp",
  "include/strix/serve/glm_chat.hpp",
  "include/strix/serve/hy4_chat.hpp",
  "include/strix/serve/inkling2_chat.hpp",
  "src/serve/chat_template.cpp",
  "src/serve/chat_template_kit.cpp",
  "src/serve/deepseek_chat.cpp",
  "src/serve/glm_chat.cpp",
  "src/serve/hy4_chat.cpp",
  "src/serve/inkling2_chat.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/serve/chat_template.cpp",
  "src/src/serve/chat_template_kit.cpp",
  "src/src/serve/deepseek_chat.cpp",
  "src/src/serve/glm_chat.cpp",
  "src/src/serve/hy4_chat.cpp",
  "src/src/serve/inkling2_chat.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "text.chat-template-enginelab/-/-"
api       = "strix::serve chat_template.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.inkling2_engine"

[[requires]]
module    = "serve.enginelab.serve_http"

[[requires]]
module    = "serve.enginelab.serve_tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
