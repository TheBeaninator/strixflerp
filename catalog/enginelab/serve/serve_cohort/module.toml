id        = "serve.enginelab.serve_cohort"
kind      = "serve"
summary   = "serving scheduler pieces: cohort decode, passes and session, fixed-KV cohort, replicated cohort, batch / job / pair sampling, slot capacity, row budget, the step planner, short-first ordering, decode form and cycle receipts"
why       = "the scheduler that turns requests into decode cycles; where it would go: a new strixflerp interface serve.scheduler/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, serve.scheduler/-/-. 5 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/serve/batch_sampling.hpp",
  "include/strix/serve/cohort_decode.hpp",
  "include/strix/serve/cohort_passes.hpp",
  "include/strix/serve/cohort_session.hpp",
  "include/strix/serve/cycle_receipt.hpp",
  "include/strix/serve/decode_form.hpp",
  "include/strix/serve/fixed_kv_cohort.hpp",
  "include/strix/serve/job_sampling.hpp",
  "include/strix/serve/pair_sampling.hpp",
  "include/strix/serve/replicated_cohort.hpp",
  "include/strix/serve/row_budget.hpp",
  "include/strix/serve/short_first.hpp",
  "include/strix/serve/slot_capacity.hpp",
  "include/strix/serve/step_planner.hpp",
  "src/serve/cohort_decode.cpp",
  "src/serve/cohort_session.cpp",
  "src/serve/replicated_cohort.cpp",
  "src/serve/row_budget.cpp",
  "src/serve/step_planner.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/serve/cohort_decode.cpp",
  "src/src/serve/cohort_session.cpp",
  "src/src/serve/replicated_cohort.cpp",
  "src/src/serve/row_budget.cpp",
  "src/src/serve/step_planner.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "serve.scheduler/-/-"
api       = "strix::serve step_planner.hpp, cohort_decode.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.token_sampling"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.mtp_drafters"

[[requires]]
module    = "runtime.enginelab.mtp_window"

[[requires]]
module    = "runtime.enginelab.pair_state"

[[requires]]
module    = "serve.enginelab.serve_prefix"

[[requires]]
module    = "serve.enginelab.serve_session"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
