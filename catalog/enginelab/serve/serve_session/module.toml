id        = "serve.enginelab.serve_session"
kind      = "serve"
summary   = "serve sessions and runners: engine, run, serve config, deployment, session runtime and reservation, serve session, serial session owner and generation CLI, resident plan and session, native handoff, startup phases and warm-up, aux lane and units, file key"
why       = "the engine-neutral serving runner every model plugs into; where it would go: beside the catalogue's serve.engine/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: serve.engine/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 10 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

