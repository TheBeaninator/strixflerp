id        = "serve.enginelab.minimax_serve"
kind      = "serve"
summary   = "MiniMax serving: API, chat, control, DSpark policy, lead, observe, scheduling, session, tokenizer, paired state, serve runner and runtime, session engine and service, fixtures"
why       = "strix-serve for the MiniMax pair; where it would go: beside the catalogue's serve.engine/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: serve.engine/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 8 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/minimax/serve/fixtures/minimax_tokenizer_fixtures.json",
  "src/minimax/serve/minimax_api.cpp",
  "src/minimax/serve/minimax_api.hpp",
  "src/minimax/serve/minimax_chat.cpp",
  "src/minimax/serve/minimax_chat.hpp",
  "src/minimax/serve/minimax_control.hpp",
  "src/minimax/serve/minimax_dspark_policy.hpp",
  "src/minimax/serve/minimax_lead.hpp",
  "src/minimax/serve/minimax_observe.cpp",
  "src/minimax/serve/minimax_observe.hpp",
  "src/minimax/serve/minimax_sched.hpp",
  "src/minimax/serve/minimax_session.hpp",
  "src/minimax/serve/minimax_tokenizer.cpp",
  "src/minimax/serve/minimax_tokenizer.hpp",
  "src/minimax/serve/paired_state.hpp",
  "src/minimax/serve/serve_runner.cpp",
  "src/minimax/serve/serve_runner.hpp",
  "src/minimax/serve/serve_runtime.cpp",
  "src/minimax/serve/serve_runtime.hpp",
  "src/minimax/serve/session_engine.cpp",
  "src/minimax/serve/session_engine.hpp",
  "src/minimax/serve/session_service.cpp",
  "src/minimax/serve/session_service.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/minimax/serve/minimax_api.cpp",
  "src/src/minimax/serve/minimax_chat.cpp",
  "src/src/minimax/serve/minimax_observe.cpp",
  "src/src/minimax/serve/minimax_tokenizer.cpp",
  "src/src/minimax/serve/serve_runner.cpp",
  "src/src/minimax/serve/serve_runtime.cpp",
  "src/src/minimax/serve/session_engine.cpp",
  "src/src/minimax/serve/session_service.cpp",
]
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "serve.engine-enginelab-minimax/-/-"
api       = "src/minimax/serve/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.minimax_dspark"

[[requires]]
module    = "executor.enginelab.minimax_engine"

[[requires]]
module    = "runtime.enginelab.deploy"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.minimax_session"

[[requires]]
module    = "runtime.enginelab.minimax_xfer"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.moe_schedule"

[[requires]]
module    = "runtime.enginelab.pair_state"

[[requires]]
module    = "runtime.enginelab.prompt_lookup"

[[requires]]
module    = "runtime.enginelab.session_engine"

[[requires]]
module    = "runtime.enginelab.xport_channel"

[[requires]]
module    = "serve.enginelab.serve_cohort"

[[requires]]
module    = "serve.enginelab.serve_http"

[[requires]]
module    = "serve.enginelab.serve_session"

[[requires]]
module    = "serve.enginelab.serve_tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
