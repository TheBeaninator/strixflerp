id        = "serve.enginelab.serving_cohort"
kind      = "serve"
summary   = "serving cohorts and the scheduler: the serving cohort (HIP), greedy backend, prefix cache, shared cohort, greedy serving scheduler, cohort small / step plans, batch nested prefill and batch service handoff"
why       = "batches concurrent requests into cohorts that decode together (README: Qwen HTTP four slots); where it would go: a new strixflerp interface serve.scheduler-cohort/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, serve.scheduler-cohort/-/-. 3 HIP unit(s) compiled standalone by the gate; 2 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/batch_nested_prefill.hpp",
  "include/strix/batch_service_handoff.hpp",
  "include/strix/cohort_small_plan.hpp",
  "include/strix/cohort_step_plan.hpp",
  "include/strix/greedy_serving_scheduler.hpp",
  "include/strix/hip_serving_cohort.hpp",
  "include/strix/hip_serving_greedy_backend.hpp",
  "include/strix/hip_serving_prefix_cache.hpp",
  "include/strix/hip_shared_serving_cohort.hpp",
  "include/strix/serving_cohort.hpp",
  "src/greedy_serving_scheduler.cpp",
  "src/hip_serving_cohort.hip",
  "src/hip_serving_greedy_backend.hip",
  "src/hip_serving_prefix_cache.hip",
  "src/serving_cohort.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = [
  "src/src/hip_serving_cohort.hip",
  "src/src/hip_serving_greedy_backend.hip",
  "src/src/hip_serving_prefix_cache.hip",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "serve.scheduler-cohort/-/-"
api       = "src/greedy_serving_scheduler.cpp, hip_serving_cohort.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.ple"

[[requires]]
module    = "kernel.enginelab.qwen_rotary"

[[requires]]
module    = "kernel.enginelab.shared_expert"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.known_prompt"

[[requires]]
module    = "runtime.enginelab.launch"

[[requires]]
module    = "runtime.enginelab.memory"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.moe_schedule"

[[requires]]
module    = "runtime.enginelab.prepared_views"

[[requires]]
module    = "runtime.enginelab.serial_session"

[[requires]]
module    = "runtime.enginelab.session_kv"

[[requires]]
module    = "runtime.enginelab.session_snapshot"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/serve.enginelab.serving_cohort.json"
