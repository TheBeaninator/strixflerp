id        = "format.enginelab.weight_readers"
kind      = "format"
summary   = "weight readers: GGUF, pack and safetensors: 3 origin files under src/weight"
why       = "one reader per container; where it would go: beside the catalogue's format.reader/gguf+safetensors/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: format.reader/gguf+safetensors/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 3 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = ["src/weight/readers/gguf.cpp", "src/weight/readers/pack.cpp", "src/weight/readers/safetensors.cpp"]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/weight/readers/gguf.cpp",
  "src/src/weight/readers/pack.cpp",
  "src/src/weight/readers/safetensors.cpp",
]
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "format.reader-enginelab-readers/gguf+safetensors/-"
api       = "src/weight/readers/*.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "format.enginelab.weight_core"

[[requires]]
module    = "serve.enginelab.serve_http"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
