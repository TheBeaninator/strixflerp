id        = "format.enginelab.qwen_grids"
kind      = "format"
summary   = "the i-quant codebook grids for Qwen (IQ2_S, IQ3_S, IQ3_XXS; from ggml, MIT): 3 origin files under include/strix"
why       = "grid tables the i-quant readers need; where it would go: a new strixflerp interface format.iq-grid/iq2_s+iq3_s+iq3_xxs/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, format.iq-grid/iq2_s+iq3_s+iq3_xxs/-. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/qwen_iq2_s_grid.inc",
  "include/strix/qwen_iq3_s_grid.inc",
  "include/strix/qwen_iq3_xxs_grid.inc",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"

[[provides]]
interface = "format.iq-grid/iq2_s+iq3_s+iq3_xxs/-"
api       = "include/strix/qwen_iq*_grid.inc"
numeric   = "see the file headers"
regime    = "see the file headers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
