id        = "format.enginelab.weight_core"
kind      = "format"
summary   = "the shared weight layer (src/weight, include/strix/weight): admission, block draft, cache, calibration moments and provenance, confined files, contracts, decision table, decoder, family, host low-bit (GPTQ) and Q8, image identity, levers, load, low-bit pack, model binding, native runtime, operand cache plan, reference, registry, resident slices, resolve, row pitch, runtime, source, tensor access / launch plan / map, typed slices and types"
why       = "one loader for every model and backend; models bring only their naming maps; where it would go: beside the catalogue's format.loader/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: format.loader/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 21 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

