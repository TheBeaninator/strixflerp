sources   = [
  "src/src/exec/arena.cpp",
  "src/src/exec/catalog.cpp",
  "src/src/exec/compiler.cpp",
  "src/src/exec/descriptor.cpp",
  "src/src/exec/draft_runner.cpp",
  "src/src/exec/executor_cpu.cpp",
  "src/src/exec/generic_engine.cpp",
  "src/src/exec/profiler_cpu.cpp",
  "src/src/exec/scheduled_stage_graph.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
