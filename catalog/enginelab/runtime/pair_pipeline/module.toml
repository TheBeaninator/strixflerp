id        = "runtime.enginelab.pair_pipeline"
kind      = "runtime"
summary   = "two-node pipelines (include/strix/pair): layer pipeline, layer cut, stage map, chains and chain topology, prefill groups, window overlap and window ring, split plan, planner, placement inputs, balance, regime, relayout and column split"
why       = "the pipeline-parallel shape of the DS41 and MiniMax pairs: where to cut the layers and how to overlap windows with the exchange; where it would go: a new strixflerp interface runtime.pair-pipeline/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, runtime.pair-pipeline/-/-. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

