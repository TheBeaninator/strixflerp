id        = "runtime.enginelab.mtp_forward"
kind      = "runtime"
summary   = "the MTP forward: contract, golden file, payload, replay, runtime and semantics; the qualified forward runtime, payload geometry, output contract, logits dump and step digest, native validation and shared execution witness"
why       = "proves a draft forward computes what its contract says before its proposals are trusted; where it would go: a new strixflerp interface draft.mtp-forward/-/f32.enginelab, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, draft.mtp-forward/-/f32.enginelab. 1 HIP unit(s) compiled standalone by the gate; 7 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

