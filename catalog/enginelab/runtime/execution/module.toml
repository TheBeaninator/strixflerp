id        = "runtime.enginelab.execution"
kind      = "runtime"
summary   = "compiled execution: arena, binding, buffers, IO, memory, plan, resources, runtime, telemetry, tensor access and tensor binding, and the compiled execution"
why       = "a model forward compiled once into a plan of bound buffers and launches, replayed per step; where it would go: a new strixflerp interface executor.compiled-plan/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, executor.compiled-plan/-/-. 12 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

