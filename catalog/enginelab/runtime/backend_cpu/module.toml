id        = "runtime.enginelab.backend_cpu"
kind      = "runtime"
summary   = "the CPU backend (src/cpu: arch, core, weight): 24 origin files under src/cpu"
why       = "a CPU route and reference for the same contracts; where it would go: beside the catalogue's executor.lane-backend/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.lane-backend/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 12 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
