id        = "runtime.enginelab.h3_levers"
kind      = "runtime"
summary   = "H3 levers (sparse attention study and others) (src/h3/levers): 13 origin files under src/h3"
why       = "its FAST levers; where it would go: beside the catalogue's tune.table/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: tune.table/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/h3/levers/fbc/fbc.hpp",
  "src/h3/levers/fbc/fbc_ref.hpp",
  "src/h3/levers/lora/bypass.hpp",
  "src/h3/levers/lora/bypass_ref.hpp",
  "src/h3/levers/lora/lora_file.hpp",
  "src/h3/levers/lora/merge_ref.hpp",
  "src/h3/levers/lora/turbo.hpp",
  "src/h3/levers/lora/turbo_host.hpp",
  "src/h3/levers/sparse/attn_sparse.hip",
  "src/h3/levers/sparse/attn_sparse.hpp",
  "src/h3/levers/sparse/router.hpp",
  "src/h3/levers/sparse/router_ref.hpp",
  "src/h3/levers/sparse/sparse_attention.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/h3/levers/sparse/attn_sparse.hip"]
includes  = ["src/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "tune.table-enginelab-h3/-/-"
api       = "src/h3/levers/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.h3_attn"

[[requires]]
module    = "kernel.enginelab.h3_gemm"

[[requires]]
module    = "runtime.enginelab.host_common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/runtime.enginelab.h3_levers.json"
