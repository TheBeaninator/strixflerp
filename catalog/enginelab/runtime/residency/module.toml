id        = "runtime.enginelab.residency"
kind      = "runtime"
summary   = "residency (src/residency, include/strix/residency): copy source, direct read, expert residency, replacement and the residency CLI"
why       = "which experts and layers stay resident and how the rest are read in; where it would go: beside the catalogue's runtime.weight-prefetch/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: runtime.weight-prefetch/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/residency/copy_source.hpp",
  "include/strix/residency/direct_read.hpp",
  "include/strix/residency/expert_residency.hpp",
  "include/strix/residency/replacement.hpp",
  "include/strix/residency/residency_cli.hpp",
  "src/residency/direct_read.cpp",
  "src/residency/expert_residency.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/residency/direct_read.cpp", "src/src/residency/expert_residency.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "runtime.weight-prefetch-enginelab/-/-"
api       = "strix::residency expert_residency.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.levers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
