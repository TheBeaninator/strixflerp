id        = "runtime.enginelab.test_hooks"
kind      = "runtime"
summary   = "the three tests/ headers that harvested sources include: the Qwen rotary watchdog and fixtures (included by hip_indexed_attention_launcher.hip) and the MTP model qualification (included by apps/hip_decode_token_main.cpp)"
why       = "without them two compile units cannot build as harvested; the rest of tests/ stays unharvested; where it would go: beside the catalogue's verify.kernel-selftest/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: verify.kernel-selftest/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "tests/hip_mtp_model_qualification.hpp",
  "tests/hip_qwen_rotary_fixtures.inc",
  "tests/hip_qwen_rotary_watchdog.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/tests"]
arch      = "gfx1151"

[[provides]]
interface = "verify.kernel-selftest-enginelab/-/-"
api       = "tests/hip_qwen_rotary_watchdog.hpp, tests/hip_mtp_model_qualification.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "tool.enginelab.apps_mtp"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
