id        = "runtime.enginelab.speculation_sampling"
kind      = "runtime"
summary   = "sampled speculation: sampling, sampling cycle and executor, the keyed RNG and the compiled sampled-speculation backend"
why       = "speculative decoding under temperature sampling with a reproducible keyed RNG, so a sampled stream is replayable; where it would go: beside the catalogue's speculation.accept/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: speculation.accept/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 5 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/compiled_sampled_speculation_backend.hpp",
  "include/strix/speculation_rng.hpp",
  "include/strix/speculation_sampling.hpp",
  "include/strix/speculation_sampling_cycle.hpp",
  "include/strix/speculation_sampling_executor.hpp",
  "src/compiled_sampled_speculation_backend.cpp",
  "src/speculation_rng.cpp",
  "src/speculation_sampling.cpp",
  "src/speculation_sampling_cycle.cpp",
  "src/speculation_sampling_executor.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/compiled_sampled_speculation_backend.cpp",
  "src/src/speculation_rng.cpp",
  "src/src/speculation_sampling.cpp",
  "src/src/speculation_sampling_cycle.cpp",
  "src/src/speculation_sampling_executor.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "speculation.accept-enginelab-sampled/-/-"
api       = "src/speculation_sampling*.cpp, speculation_rng.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.token_sampling"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.memory"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.serial_session"

[[requires]]
module    = "runtime.enginelab.session_snapshot"

[[requires]]
module    = "runtime.enginelab.speculation_control"

[[requires]]
module    = "runtime.enginelab.speculative_verify"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
