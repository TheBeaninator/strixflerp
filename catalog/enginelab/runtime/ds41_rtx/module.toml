id        = "runtime.enginelab.ds41_rtx"
kind      = "runtime"
summary   = "the optional RTX PRO route for DS41: RTX budget, drafter select, profile and schedule, and RTX state import"
why       = "a discrete GPU joins a Strix Halo node for drafting or prefill (docs/discrete-gpu.md); where it would go: a new strixflerp interface runtime.hetero-route/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, runtime.hetero-route/-/-. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/ds41_rtx_budget.hpp",
  "include/strix/ds41_rtx_drafter_select.hpp",
  "include/strix/ds41_rtx_schedule.hpp",
  "include/strix/rtx_state_import.hpp",
  "src/ds41_rtx_profile.cpp",
  "src/rtx_state_import.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/ds41_rtx_profile.cpp", "src/src/rtx_state_import.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "runtime.hetero-route/-/-"
api       = "src/ds41_rtx_*.cpp, rtx_state_import.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "kernel.enginelab.qwen_rotary"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.prefix_state"

[[requires]]
module    = "runtime.enginelab.recurrent_state"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
