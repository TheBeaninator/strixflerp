id        = "runtime.enginelab.deploy"
kind      = "runtime"
summary   = "deployment planning (src/deploy, include/strix/deploy): binding, device, footprint, link, memory plan, MiniMax layer cut, plan, route and spec"
why       = "budgets measured device memory for the requested KV context, workspace and weight formats before loading (docs/deployment.md); where it would go: beside the catalogue's serve.memory-plan/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: serve.memory-plan/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 6 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/deploy/binding.hpp",
  "include/strix/deploy/device.hpp",
  "include/strix/deploy/footprint.hpp",
  "include/strix/deploy/link.hpp",
  "include/strix/deploy/memory_plan.hpp",
  "include/strix/deploy/minimax_layercut.hpp",
  "include/strix/deploy/plan.hpp",
  "include/strix/deploy/route.hpp",
  "include/strix/deploy/spec.hpp",
  "src/deploy/device.cpp",
  "src/deploy/link.cpp",
  "src/deploy/memory_plan.cpp",
  "src/deploy/plan.cpp",
  "src/deploy/route.cpp",
  "src/deploy/spec.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/deploy/device.cpp",
  "src/src/deploy/link.cpp",
  "src/src/deploy/memory_plan.cpp",
  "src/src/deploy/plan.cpp",
  "src/src/deploy/route.cpp",
  "src/src/deploy/spec.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "serve.memory-plan-enginelab/-/-"
api       = "strix::deploy plan.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.minimax_engine"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.pair_pipeline"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
