id        = "runtime.enginelab.known_prompt"
kind      = "runtime"
summary   = "known-prompt prefill: cancellation, limits, prefix prefill and runtime, prefix window (HIP), prompt backend and chunks, window cohort, output policy and rows binding"
why       = "prefill of a prompt already known in full, in chunks that can be cancelled; where it would go: a new strixflerp interface prefill.known-prompt/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, prefill.known-prompt/-/-. 1 HIP unit(s) compiled standalone by the gate; 4 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/hip_known_prefix_window.hpp",
  "include/strix/hip_known_prompt_backend.hpp",
  "include/strix/known_prefill_cancelled.hpp",
  "include/strix/known_prefill_limits.hpp",
  "include/strix/known_prefix_prefill.hpp",
  "include/strix/known_prompt_chunks.hpp",
  "include/strix/known_window_cohort.hpp",
  "include/strix/known_window_output_policy.hpp",
  "include/strix/known_window_rows_binding.hpp",
  "src/hip_known_prefix_window.hip",
  "src/hip_known_prompt_backend.cpp",
  "src/known_prefix_prefill.cpp",
  "src/known_prefix_prefill_runtime.cpp",
  "src/known_prompt_chunks.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
