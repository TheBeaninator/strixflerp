[build]
lang      = "c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"

[[provides]]
interface = "transport.pair-link/-/-"
api       = "include/strix/pair/link*.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.session_embed"

[gate]
