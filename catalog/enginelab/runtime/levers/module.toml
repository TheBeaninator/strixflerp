id        = "runtime.enginelab.levers"
kind      = "runtime"
summary   = "levers and profiles: the lever registry and cache, turbo, fast and engine profiles, environment arms and flags, the cost-table cache and partition search; src/profile (catalog levers, model presets, multi-device) and include/strix/profile(s) (per-model profile tables)"
why       = "the EXACT / FAST / TURBO tiers as data: a lever is a registry row with identity, receipts, regime and per-tier default (AGENTS.md); where it would go: beside the catalogue's tune.table/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: tune.table/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 5 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

