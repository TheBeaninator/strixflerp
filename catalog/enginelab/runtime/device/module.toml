id        = "runtime.enginelab.device"
kind      = "runtime"
summary   = "devices (src/device, include/strix/device): budget, cost identity (CUDA, HIP), declarations, eager code load, gates (HIP, none), CUDA / HIP / Intel enumerators, link class, low-bit rows, process budget and topology, profiles, runtime host memory, sets and topology, nvidia-smi and xpu-smi readers; device allocation errors, profile and the platform probe"
why       = "no device, node count or link is compiled in: everything comes from these declarations or a calibration at load (AGENTS.md); where it would go: beside the catalogue's device.info/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: device.info/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 12 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

