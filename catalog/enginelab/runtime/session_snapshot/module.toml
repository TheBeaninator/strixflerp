id        = "runtime.enginelab.session_snapshot"
kind      = "runtime"
summary   = "session state: executor handoff, restore, snapshot (memory, transfer, HIP transfer), state cache, layout and memory"
why       = "save, move and restore a decode session (KV, recurrent state, positions); where it would go: beside the catalogue's cache.snapshot-copy/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: cache.snapshot-copy/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 9 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

