id        = "runtime.enginelab.spec_core"
kind      = "runtime"
summary   = "speculation core (include/strix/spec, src/spec): drafting and draft declarations, the draft-verify runner, engine target, greedy continuation and prefix, MTP chain and defer, pair round"
why       = "the engine-neutral contract every drafter and verifier binds to, including the pair-round form for two ranks; where it would go: beside the catalogue's speculation.accept/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: speculation.accept/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/spec/draft_decl.hpp",
  "include/strix/spec/drafting.hpp",
  "include/strix/spec/engine_target.hpp",
  "include/strix/spec/greedy_continuation.hpp",
  "include/strix/spec/greedy_prefix.hpp",
  "include/strix/spec/mtp_chain.hpp",
  "include/strix/spec/mtp_defer.hpp",
  "include/strix/spec/pair_round.hpp",
  "src/spec/draft_verify_runner.cpp",
  "src/spec/drafting.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/spec/draft_verify_runner.cpp", "src/src/spec/drafting.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "speculation.accept-enginelab-core/-/-"
api       = "strix::spec drafting.hpp, engine_target.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.pair_state"

[[requires]]
module    = "runtime.enginelab.prompt_lookup"

[[requires]]
module    = "runtime.enginelab.serial_session"

[[requires]]
module    = "runtime.enginelab.session_engine"

[[requires]]
module    = "runtime.enginelab.spec_block_draft"

[[requires]]
module    = "runtime.enginelab.spec_wide_window"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
