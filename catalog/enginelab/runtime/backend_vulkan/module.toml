id        = "runtime.enginelab.backend_vulkan"
kind      = "runtime"
summary   = "the Vulkan backend core (src/vulkan/core): 4 origin files under src/vulkan"
why       = "a Vulkan route; where it would go: beside the catalogue's executor.lane-backend/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.lane-backend/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/vulkan/core/backend.cpp",
  "src/vulkan/core/backend.hpp",
  "src/vulkan/core/backend_vulkan.cpp",
  "src/vulkan/core/rms_norm.comp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/vulkan/core/backend.cpp", "src/src/vulkan/core/backend_vulkan.cpp"]
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "executor.lane-backend-enginelab-vulkan/-/-"
api       = "src/vulkan/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.core_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
