id        = "runtime.enginelab.speculative_verify"
kind      = "runtime"
summary   = "speculative verification: verify binding, plan and runtime, the compiled verify and the compiled speculation backend"
why       = "binds a verify window to a compiled execution plan; where it would go: beside the catalogue's speculation.window-verify/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: speculation.window-verify/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 5 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/compiled_speculation_backend.hpp",
  "include/strix/compiled_speculative_verify.hpp",
  "include/strix/speculative_verify_binding.hpp",
  "include/strix/speculative_verify_plan.hpp",
  "include/strix/speculative_verify_runtime.hpp",
  "src/compiled_speculation_backend.cpp",
  "src/compiled_speculative_verify.cpp",
  "src/speculative_verify_binding.cpp",
  "src/speculative_verify_plan.cpp",
  "src/speculative_verify_runtime.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/compiled_speculation_backend.cpp",
  "src/src/compiled_speculative_verify.cpp",
  "src/src/speculative_verify_binding.cpp",
  "src/src/speculative_verify_plan.cpp",
  "src/src/speculative_verify_runtime.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "speculation.window-verify-enginelab/-/-"
api       = "src/speculative_verify_*.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

