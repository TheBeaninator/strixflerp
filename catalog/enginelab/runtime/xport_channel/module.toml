id        = "runtime.enginelab.xport_channel"
kind      = "runtime"
summary   = "the shared exchange channel (src/xport): backend and transport backend, borrowed transport, channel (device, HIP, impl.hip, communicator), exchange format (host and HIP), framed exchange, split frame, HIP pipe staging and staging, the HIP channel runtime, small progress, stats, wire and the DS41 adapter"
why       = "one channel that every engine's pair traffic goes through (AGENTS.md: two-node pipelines, transports, exchange overlap are shared code); where it would go: a new strixflerp interface transport.channel/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, transport.channel/-/-. 0 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

