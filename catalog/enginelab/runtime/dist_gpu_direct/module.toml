id        = "runtime.enginelab.dist_gpu_direct"
kind      = "runtime"
summary   = "GPU-direct exchange: setup and copies between the two iGPUs' memory through the USB4 DMA-BUF stream extension (dist_gpu_direct*.cpp / .hip)"
why       = "moves activations iGPU to iGPU with no host staging; the routing per message class picks it for the sizes where it wins; where it would go: a new strixflerp interface transport.usb4-gpu-direct/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, transport.usb4-gpu-direct/-/-. 1 HIP unit(s) compiled standalone by the gate; 2 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/dist/gpu_direct.hpp",
  "include/strix/dist/gpu_direct_copy.hpp",
  "src/dist_gpu_direct.cpp",
  "src/dist_gpu_direct_copy.hip",
  "src/dist_gpu_direct_setup.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/dist_gpu_direct_copy.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "transport.usb4-gpu-direct/-/-"
api       = "strix::dist gpu_direct.hpp, gpu_direct_copy.hpp"
numeric   = "bytes, verified"
regime    = "two hosts on USB4 with the strix_gpu_stream UAPI (catalog/enginelab_usb4)"

[[requires]]
module    = "runtime.enginelab.direct_gpu_stream"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/runtime.enginelab.dist_gpu_direct.json"
