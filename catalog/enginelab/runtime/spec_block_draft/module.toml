id        = "runtime.enginelab.spec_block_draft"
kind      = "runtime"
summary   = "block drafting (include/strix/spec, src/spec): block candidates, block drafter and policy, block-parallel verification and the block-draft reference"
why       = "parallel block proposals verified in one pass; where it would go: beside the catalogue's speculation.draft/-/i32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: speculation.draft/-/i32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 3 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/spec/block_candidate.hpp",
  "include/strix/spec/block_draft_policy.hpp",
  "include/strix/spec/block_draft_reference.hpp",
  "include/strix/spec/block_drafter.hpp",
  "include/strix/spec/block_parallel.hpp",
  "src/spec/block_candidate.cpp",
  "src/spec/block_drafter.cpp",
  "src/spec/block_parallel.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/spec/block_candidate.cpp", "src/src/spec/block_drafter.cpp", "src/src/spec/block_parallel.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "speculation.draft/-/i32.enginelab-block"
api       = "strix::spec block_drafter.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.weight_core"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.spec_core"

[[requires]]
module    = "runtime.enginelab.spec_wide_window"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
