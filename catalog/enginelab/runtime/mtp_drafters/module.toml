id        = "runtime.enginelab.mtp_drafters"
kind      = "runtime"
summary   = "MTP drafting control: draft activation, binding, contract, cycle input, profiles, qualification, readiness, split, state contract and memory, tensor audit and vocabulary; the context, frame and n-gram drafters, the compiled draft plan and the qualified draft backend"
why       = "which drafter proposes what each cycle (MTP head, copy spans from the context, n-grams), qualified before it may run; where it would go: beside the catalogue's speculation.draft/-/i32 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: speculation.draft/-/i32 (a class the catalogue already has); the module provides it with an enginelab variant tag. 15 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

