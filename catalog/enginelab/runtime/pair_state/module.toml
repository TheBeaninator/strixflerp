id        = "runtime.enginelab.pair_state"
kind      = "runtime"
summary   = "pair state and lockstep (include/strix/pair): lockstep control bookkeeping (rank, round and last completed round agreed before acting), state declarations, owners and relay, TP inputs and TP layout"
why       = "the guard rails of a two-rank decode: a dropped, duplicated or stale control message is caught before either side acts; where it would go: a new strixflerp interface runtime.pair-lockstep/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, runtime.pair-lockstep/-/-. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/pair/lockstep.hpp",
  "include/strix/pair/state_decls.hpp",
  "include/strix/pair/state_owners.hpp",
  "include/strix/pair/state_relay.hpp",
  "include/strix/pair/tp_inputs.hpp",
  "include/strix/pair/tp_layout.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"

[[provides]]
interface = "runtime.pair-lockstep/-/-"
api       = "include/strix/pair/lockstep.hpp, tp_layout.hpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "kernel.enginelab.ds41_attention"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.pair_pipeline"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
