id        = "runtime.enginelab.h3_dist"
kind      = "runtime"
summary   = "H3 distributed (two-node) pieces (src/h3/dist): 12 origin files under src/h3"
why       = "H3 on a pair; where it would go: a new strixflerp interface runtime.distributed-enginelab-h3/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, runtime.distributed-enginelab-h3/-/-. 1 HIP unit(s) compiled standalone by the gate; 2 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/h3/dist/accel.hpp",
  "src/h3/dist/admission.hpp",
  "src/h3/dist/device_dist.hip",
  "src/h3/dist/device_dist.hpp",
  "src/h3/dist/host_attn.hpp",
  "src/h3/dist/host_dist.cpp",
  "src/h3/dist/host_dist.hpp",
  "src/h3/dist/image_parallel.hpp",
  "src/h3/dist/kv_exchange.cpp",
  "src/h3/dist/kv_exchange.hpp",
  "src/h3/dist/pair_link.hpp",
  "src/h3/dist/schedule.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/h3/dist/device_dist.hip"]
includes  = ["src/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "runtime.distributed-enginelab-h3/-/-"
api       = "src/h3/dist/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.h3_block"

[[requires]]
module    = "kernel.enginelab.h3_attn"

[[requires]]
module    = "kernel.enginelab.h3_gemm"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.h3_common"

[[requires]]
module    = "runtime.enginelab.h3_levers"

[[requires]]
module    = "runtime.enginelab.host_common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/runtime.enginelab.h3_dist.json"
