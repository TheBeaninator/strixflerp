id        = "runtime.enginelab.distributed_runtime"
kind      = "runtime"
summary   = "the distributed runtime: data plane, native backend, placement, runtime, session and stage resources / state"
why       = "binds a model's stage graph to two nodes: what lives where and how stages hand off; where it would go: a new strixflerp interface runtime.distributed/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, runtime.distributed/-/-. 7 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/distributed_data_plane.hpp",
  "include/strix/distributed_native_backend.hpp",
  "include/strix/distributed_placement.hpp",
  "include/strix/distributed_runtime.hpp",
  "include/strix/distributed_session.hpp",
  "include/strix/distributed_stage_resources.hpp",
  "include/strix/distributed_stage_state.hpp",
  "src/distributed_data_plane.cpp",
  "src/distributed_native_backend.cpp",
  "src/distributed_placement.cpp",
  "src/distributed_runtime.cpp",
  "src/distributed_session.cpp",
  "src/distributed_stage_resources.cpp",
  "src/distributed_stage_state.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/src/distributed_data_plane.cpp",
  "src/src/distributed_native_backend.cpp",
  "src/src/distributed_placement.cpp",
  "src/src/distributed_runtime.cpp",
  "src/src/distributed_session.cpp",
  "src/src/distributed_stage_resources.cpp",
  "src/src/distributed_stage_state.cpp",
]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "runtime.distributed/-/-"
api       = "src/distributed_runtime.cpp, distributed_session.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.direct_transport"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.distributed_control"

[[requires]]
module    = "runtime.enginelab.dual_link"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.memory"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.session_snapshot"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
