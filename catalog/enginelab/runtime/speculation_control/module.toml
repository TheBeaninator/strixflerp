id        = "runtime.enginelab.speculation_control"
kind      = "runtime"
summary   = "the speculation controller: speculation, controller, cycle, executor, measurement and multi-draft, and the draft proposal state"
why       = "picks drafter and window per cycle from measured costs; where it would go: a new strixflerp interface speculation.controller/-/-, which no catalogue module provides yet"
