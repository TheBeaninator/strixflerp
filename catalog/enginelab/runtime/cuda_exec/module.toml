id        = "runtime.enginelab.cuda_exec"
kind      = "runtime"
summary   = "the CUDA exec layer: catalog decode, step rows and WR1 / WR2, bound transfers, decode epilogue, lowering and transition, program recipe, the CUDA executor and profiler; include/strix/cuda (common)"
why       = "compiled CUDA programs for the RTX route; where it would go: beside the catalogue's executor.device-graph/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: executor.device-graph/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

