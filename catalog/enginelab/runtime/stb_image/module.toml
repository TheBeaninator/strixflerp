id        = "runtime.enginelab.stb_image"
kind      = "runtime"
summary   = "stb_image.h (Sean Barrett; MIT or public domain), vendored: 1 origin files under third_party/stb"
why       = "image decoding for the vision paths; where it would go: beside the catalogue's media.image-decode/-/u8 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: media.image-decode/-/u8 (a class the catalogue already has); the module provides it with an enginelab variant tag. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = ["third_party/stb/stb_image.h"]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "MIT OR Unlicense"

[build]
lang      = "c++"
sources   = []
includes  = ["src/third_party"]
arch      = "gfx1151"

[[provides]]
interface = "media.image-decode/-/u8.enginelab"
api       = "third_party/stb/stb_image.h"
numeric   = "bytes to RGB"
regime    = "any image input"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "host headers only; compiled inside the modules that include them"
