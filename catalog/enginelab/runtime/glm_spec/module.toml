id        = "runtime.enginelab.glm_spec"
kind      = "runtime"
summary   = "GLM speculation: device, host, merge and run: 8 origin files under src/glm"
why       = "MTP + wide on the GLM pair; where it would go: beside the catalogue's speculation.window-verify-lossless/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: speculation.window-verify-lossless/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 1 HIP unit(s) compiled standalone by the gate; 3 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/glm/spec/glm_spec_dev.hip",
  "src/glm/spec/glm_spec_dev.hpp",
  "src/glm/spec/glm_spec_host.cpp",
  "src/glm/spec/glm_spec_host.hpp",
  "src/glm/spec/glm_spec_merge.cpp",
  "src/glm/spec/glm_spec_merge.hpp",
  "src/glm/spec/glm_spec_run.cpp",
  "src/glm/spec/glm_spec_run.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/glm/spec/glm_spec_dev.hip"]
includes  = ["src/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "speculation.window-verify-lossless-enginelab-glm/-/-"
api       = "src/glm/spec/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.glm_engine"

[[requires]]
module    = "kernel.enginelab.attn_contracts"

[[requires]]
module    = "kernel.enginelab.glm_kernels"

[[requires]]
module    = "runtime.enginelab.spec_core"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/runtime.enginelab.glm_spec.json"
