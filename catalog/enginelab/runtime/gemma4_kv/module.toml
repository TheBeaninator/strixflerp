id        = "runtime.enginelab.gemma4_kv"
kind      = "runtime"
summary   = "Gemma 4 KV cache (sliding and global layers) (src/gemma4/kv): 5 origin files under src/gemma4"
why       = "its KV layout; where it would go: beside the catalogue's kvcache.store/-/bf16 providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: kvcache.store/-/bf16 (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 HIP unit(s) compiled standalone by the gate. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/gemma4/kv/fp16_mirror.hip",
  "src/gemma4/kv/fp16_mirror.hpp",
  "src/gemma4/kv/layout.hpp",
  "src/gemma4/kv/storage.hpp",
  "src/gemma4/kv/transactions.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/gemma4/kv/fp16_mirror.hip", "src/src/gemma4/kv/transactions.hip"]
includes  = ["src/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kvcache.store/-/bf16.enginelab-gemma4"
api       = "src/gemma4/kv/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.gemma4_engine"

[[requires]]
module    = "kernel.enginelab.attn_core_prepared"

[[requires]]
module    = "kernel.enginelab.gemma4_kernels"

[[requires]]
module    = "runtime.enginelab.gemma4_contracts"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.model_registry"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/runtime.enginelab.gemma4_kv.json"
