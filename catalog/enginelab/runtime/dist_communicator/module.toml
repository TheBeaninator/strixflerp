id        = "runtime.enginelab.dist_communicator"
kind      = "runtime"
summary   = "the two-rank communicator and message transport (include/strix/dist): whole messages in order between two ranks, backends in-process pair, TCP and the host path of USB4 streams striped over a cable's streams; persistent progress threads, exchange with an on-wire callback, abort and close semantics; exchange direction and transport, transport caps and spec, mesh, link cost, pipeline timeline and latency trace"
why       = "the message layer the pipelines and lockstep control run on; the catalogue's transports are RoCE verbs and TCP, this adds a USB4 host-stream backend behind the same exchange contract; where it would go: a new strixflerp interface transport.message/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, transport.message/-/-. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/dist/communicator.hpp",
  "include/strix/dist/communicator_hip.hpp",
  "include/strix/dist/exchange_direction.hpp",
  "include/strix/dist/exchange_transport.hpp",
  "include/strix/dist/link_cost.hpp",
  "include/strix/dist/mesh.hpp",
  "include/strix/dist/open_transport.hpp",
  "include/strix/dist/pipeline_timeline.hpp",
  "include/strix/dist/transport.hpp",
  "include/strix/dist/transport_caps.hpp",
  "include/strix/dist/transport_spec.hpp",
  "include/strix/transport.hpp",
  "src/dist_communicator.cpp",
  "src/dist_latency_trace.hpp",
  "src/transport.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/dist_communicator.cpp", "src/src/transport.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "transport.message/-/-"
api       = "strix::dist Transport / Communicator (include/strix/dist/transport.hpp, communicator.hpp)"
numeric   = "bytes; payload + trailer, in order"
regime    = "two ranks; TCP for bring-up, USB4 streams in production"

[[requires]]
module    = "runtime.enginelab.dist_gpu_direct"

[[requires]]
module    = "runtime.enginelab.dist_host_staged"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.memory"

[[requires]]
module    = "runtime.enginelab.xport_channel"

[[requires]]
module    = "runtime.enginelab.xport_crc"

[[requires]]
module    = "serve.enginelab.serve_http"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
