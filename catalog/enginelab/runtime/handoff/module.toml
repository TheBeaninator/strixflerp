id        = "runtime.enginelab.handoff"
kind      = "runtime"
summary   = "handoff and output: handoff lanes and policy, final generation state export, generation output (HIP, dispatch, diagnostic), model input, decode execution options and numerical profile, KV storage and exact-context memory"
why       = "prefill-to-decode handoff and the output stream; where it would go: a new strixflerp interface executor.handoff/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, executor.handoff/-/-. 1 HIP unit(s) compiled standalone by the gate; 3 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/ctx_exact_memory.hpp",
  "include/strix/decode_execution_options.hpp",
  "include/strix/decode_numerical_profile.hpp",
  "include/strix/final_generation_state_export.hpp",
  "include/strix/generation_output.hpp",
  "include/strix/generation_output_dispatch.hpp",
  "include/strix/handoff.hpp",
  "include/strix/handoff_lanes.hpp",
  "include/strix/handoff_policy.hpp",
  "include/strix/hip_generation_output.hpp",
  "include/strix/hip_generation_output_diagnostic.hpp",
  "include/strix/kv_storage.hpp",
  "include/strix/model_input.hpp",
  "src/final_generation_state_export.cpp",
  "src/generation_output.cpp",
  "src/handoff.cpp",
  "src/hip_generation_output.hip",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/src/hip_generation_output.hip"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.handoff/-/-"
api       = "src/handoff.cpp, hip_generation_output.hip"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "kernel.enginelab.logits_head"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.execution"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.mtp_forward"

[[requires]]
module    = "runtime.enginelab.qpf2k_schedule"

[[requires]]
module    = "runtime.enginelab.receipts"

[[requires]]
module    = "runtime.enginelab.serial_session"

[[requires]]
module    = "runtime.enginelab.session_snapshot"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/runtime.enginelab.handoff.json"
