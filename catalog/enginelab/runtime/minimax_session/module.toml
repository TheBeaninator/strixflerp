id        = "runtime.enginelab.minimax_session"
kind      = "runtime"
summary   = "MiniMax session runtime and cache: 3 origin files under src/minimax"
why       = "MiniMax decode sessions; where it would go: beside the catalogue's cache.snapshot-copy/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: cache.snapshot-copy/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "src/minimax/session/runtime.cpp",
  "src/minimax/session/runtime.hpp",
  "src/minimax/session/session_cache.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/minimax/session/runtime.cpp", "src/src/minimax/session/session_cache.cpp"]
includes  = ["src/src"]
arch      = "gfx1151"

[[provides]]
interface = "cache.snapshot-copy-enginelab-minimax/-/-"
api       = "src/minimax/session/*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.minimax_engine"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.session_kv"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
