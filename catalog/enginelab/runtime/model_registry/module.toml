id        = "runtime.enginelab.model_registry"
kind      = "runtime"
summary   = "model registry and residency: content hash, contract, copy-residency layout, description, family registry, manifest, mapping accounting, registry, residency (HIP, diagnostic), runtime binding and tensor index"
why       = "one registry the CLI, server and planner read; where it would go: a new strixflerp interface format.model-registry/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, format.model-registry/-/-. 10 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/hip_model_residency.hpp",
  "include/strix/hip_model_residency_diagnostic.hpp",
  "include/strix/model_content_hash.hpp",
  "include/strix/model_contract.hpp",
