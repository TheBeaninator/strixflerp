id        = "runtime.enginelab.host_common"
kind      = "runtime"
summary   = "host common: qpersist and its diagnostic (switches for verify-window fused GDN / QSA tails, bit-identical to the separate launches, and the exact MTP draft-attention kernels), prompt terminal diagnostics, serve / CLI parity; include/strix/core (A8 G32, chunked dot, dense activation, dense reference, dense site policy, rows), include/strix/hip (arch, legacy intrinsics and launch) with the arch caps header they include, oracles, check, preflight, setup quiescence, startup markers, runtime telemetry, the build-info template, the MSVC math builtins and the CUDA spelling headers of the root"
why       = "small shared headers most modules include; where it would go: a new strixflerp interface kernel-abi.enginelab-common/-/-, which no catalogue module provides yet"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, kernel-abi.enginelab-common/-/-. 3 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

