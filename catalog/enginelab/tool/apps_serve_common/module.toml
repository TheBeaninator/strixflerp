id        = "tool.enginelab.apps_serve_common"
kind      = "tool"
summary   = "shared application headers: TP2 resident (launch environment snapshot of every lever, 8-field TP2 agreement and per-slot barrier), HTTP session completion and slot capacity, known-prefill reservation, PLE reclaim mapping and resident fallback, prefix-state cache identity, QSA input receipt, RTX state-import routes, runtime owner inventory and shared prefetch receipts, state cache stats, bitcalc measurement, deferred MoE receipt and the offline tuning build context template"
why       = "the glue the resident TP2 servers share; where it would go: kept as a reference program or lab (serve.resident-tp2/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, serve.resident-tp2/-/-. 0 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

