id        = "tool.enginelab.apps_qwen_cuda"
kind      = "tool"
summary   = "the CUDA Qwen programs: Qwen 3.5 cohort, decode and spec, logits, prefill service, prefix cache, serve and policy"
why       = "the RTX Qwen binaries; where it would go: kept as a reference program or lab (tool.enginelab-qwen-cuda/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-qwen-cuda/-/-. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/cuda_qwen35_cohort_main.cu",
  "apps/cuda_qwen35_decode_main.cu",
  "apps/cuda_qwen35_spec_main.cu",
  "apps/cuda_qwen_logits_main.cu",
  "apps/cuda_qwen_prefill_service_main.cu",
  "apps/cuda_qwen_prefix_cache.hpp",
  "apps/cuda_qwen_serve_main.cu",
  "apps/cuda_qwen_serve_policy.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = ["src/apps"]
arch      = "gfx1151"

[[provides]]
interface = "tool.enginelab-qwen-cuda/-/-"
api       = "apps/cuda_qwen*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.cuda_qwen"

[[requires]]
module    = "executor.enginelab.qwen_engine"

[[requires]]
module    = "kernel.enginelab.core_f16_dense"

[[requires]]
module    = "kernel.enginelab.cuda_core_common"

[[requires]]
module    = "kernel.enginelab.token_sampling"

[[requires]]
module    = "runtime.enginelab.cuda_exec"

[[requires]]
module    = "runtime.enginelab.deploy"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.handoff"

[[requires]]
module    = "runtime.enginelab.host_common"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.mtp_drafters"

[[requires]]
module    = "runtime.enginelab.mtp_window"

[[requires]]
module    = "runtime.enginelab.residency"

[[requires]]
module    = "runtime.enginelab.spec_wide_window"

[[requires]]
module    = "serve.enginelab.serve_cohort"

[[requires]]
module    = "serve.enginelab.serve_constraint"

[[requires]]
module    = "serve.enginelab.serve_http"

[[requires]]
module    = "serve.enginelab.serve_prefix"

[[requires]]
module    = "serve.enginelab.serve_session"

[[requires]]
module    = "serve.enginelab.serve_tokenizer"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source for the optional RTX PRO route: no CUDA toolkit on the island and no NVIDIA device on the pod, so it is not compiled"
