id        = "tool.enginelab.apps_mtp"
kind      = "tool"
summary   = "MTP application pieces: the MTP cohort bridge and tiled cohort, the decode bridge, wide copy verify (a long confident copy span verified in ONE rows-row forward of the tiled prefill tail owner instead of 8-row windows, state snapshotted first), the prefill-to-MTP handoff, MTP asset verification, manifest audit, prompt phase and window memory reservation"
why       = "where MTP wide drafting is wired into the decode CLI and server; where it would go: kept as a reference program or lab (speculation.window-verify-wide-apps/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, speculation.window-verify-wide-apps/-/-. 1 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/hip_mtp_cohort_bridge.hpp",
  "apps/hip_mtp_cohort_tiled.hpp",
  "apps/hip_mtp_decode_bridge.hpp",
  "apps/hip_mtp_wide_copy.hpp",
  "apps/hip_qwen_prefill_mtp_handoff.inc",
  "apps/mtp_asset_verification.hpp",
  "apps/mtp_manifest_audit_main.cpp",
  "apps/mtp_prompt_phase.hpp",
  "apps/mtp_window_memory_reservation.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
