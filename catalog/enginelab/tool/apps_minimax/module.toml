id        = "tool.enginelab.apps_minimax"
kind      = "tool"
summary   = "the MiniMax programs: layer cut, rank and serve: 3 origin files under apps/minimax_layercut.inc, apps/minimax_rank_main.cpp, apps/minimax_serve_main.cpp"
why       = "the MiniMax pair binaries; where it would go: kept as a reference program or lab (tool.enginelab-minimax/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-minimax/-/-. 2 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = ["apps/minimax_layercut.inc", "apps/minimax_rank_main.cpp", "apps/minimax_serve_main.cpp"]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/apps/minimax_rank_main.cpp", "src/apps/minimax_serve_main.cpp"]
includes  = ["src/apps"]
arch      = "gfx1151"

[[provides]]
interface = "tool.enginelab-minimax/-/-"
api       = "apps/minimax_rank_main.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.minimax_dspark"

[[requires]]
module    = "executor.enginelab.minimax_engine"

[[requires]]
module    = "format.enginelab.weight_files"

[[requires]]
module    = "kernel.enginelab.minimax_attn"

[[requires]]
module    = "kernel.enginelab.minimax_moe"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.dist_communicator"

[[requires]]
module    = "runtime.enginelab.dist_gpu_direct"

[[requires]]
module    = "runtime.enginelab.minimax_pfx"

[[requires]]
module    = "runtime.enginelab.minimax_session"

[[requires]]
module    = "runtime.enginelab.minimax_xfer"

[[requires]]
module    = "runtime.enginelab.moe_schedule"

[[requires]]
module    = "runtime.enginelab.pair_state"

[[requires]]
module    = "runtime.enginelab.prefill_plan"

[[requires]]
module    = "runtime.enginelab.xport_channel"

[[requires]]
module    = "serve.enginelab.minimax_serve"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
