[build]
lang      = "c++"
sources   = ["src/lab/transport/tbstream_baseline.cpp", "src/lab/transport/tcp_baseline.cpp"]
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "tool.enginelab-lab-transport/-/-"
api       = "lab/transport"
numeric   = "see the file headers"
regime    = "see the file headers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
