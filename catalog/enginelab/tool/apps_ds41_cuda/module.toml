id        = "tool.enginelab.apps_ds41_cuda"
kind      = "tool"
summary   = "the CUDA DeepSeek V4.1 programs: decode, hot decode and replay, multi front, parts host check, pipeline front, prefill (service), replica (budget, serve), session cache and draft"
why       = "the RTX DS41 binaries; where it would go: kept as a reference program or lab (tool.enginelab-ds41-cuda/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-ds41-cuda/-/-. CUDA (RTX PRO 6000 route). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/cuda_ds41_decode_main.cu",
  "apps/cuda_ds41_hot_decode.cu",
  "apps/cuda_ds41_hot_replay.cu",
  "apps/cuda_ds41_multi_front_main.cu",
  "apps/cuda_ds41_parts_host_check.cpp",
  "apps/cuda_ds41_pipeline_front_main.cu",
  "apps/cuda_ds41_prefill_main.cu",
  "apps/cuda_ds41_prefill_service_main.cu",
  "apps/cuda_ds41_replica.cu",
  "apps/cuda_ds41_replica_budget.hpp",
  "apps/cuda_ds41_replica_serve.hpp",
  "apps/cuda_ds41_session_cache.hpp",
  "apps/cuda_ds41_session_draft.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = ["src/apps"]
arch      = "gfx1151"

[[provides]]
interface = "tool.enginelab-ds41-cuda/-/-"
api       = "apps/cuda_ds41_*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.cuda_ds41"

[[requires]]
module    = "executor.enginelab.ds41_dspark"

[[requires]]
module    = "executor.enginelab.ds41_engine"

[[requires]]
module    = "executor.enginelab.ds41_pipeline"

[[requires]]
module    = "format.enginelab.gguf"

[[requires]]
module    = "kernel.enginelab.ds41_attention"

[[requires]]
module    = "kernel.enginelab.token_sampling"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.ds41_expert_tier"

[[requires]]
module    = "runtime.enginelab.ds41_rtx"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.session_kv"

[[requires]]
module    = "serve.enginelab.serve_http"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source for the optional RTX PRO route: no CUDA toolkit on the island and no NVIDIA device on the pod, so it is not compiled"
