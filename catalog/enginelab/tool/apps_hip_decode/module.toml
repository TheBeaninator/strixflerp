id        = "tool.enginelab.apps_hip_decode"
kind      = "tool"
summary   = "the HIP decode program: decode token entry and main, decode experiment, options and receipt JSON, deferred MoE status, HTTP serve, model residency main, prefix state cache, runtime allocator main and session store"
why       = "strix run's HIP decode path; where it would go: beside the catalogue's tool.generate-ids/-/- providers as the enginelab variant (same op, the engine lab's own operand layouts, so an adapter comes first)"
notes     = "Interface tag: tool.generate-ids/-/- (a class the catalogue already has); the module provides it with an enginelab variant tag. 4 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/hip_decode_experiment.hpp",
  "apps/hip_decode_options.hpp",
  "apps/hip_decode_receipt_json.hpp",
  "apps/hip_decode_token_entry.cpp",
  "apps/hip_decode_token_main.cpp",
  "apps/hip_deferred_moe_status.hpp",
  "apps/hip_http_serve.hpp",
  "apps/hip_model_residency_main.cpp",
  "apps/hip_prefix_state_cache.hpp",
  "apps/hip_runtime_allocator_main.cpp",
  "apps/hip_session_store.hpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/apps/hip_decode_token_entry.cpp",
  "src/apps/hip_decode_token_main.cpp",
  "src/apps/hip_model_residency_main.cpp",
  "src/apps/hip_runtime_allocator_main.cpp",
]
includes  = ["src/apps", "src/apps"]
arch      = "gfx1151"

[[provides]]
interface = "tool.generate-ids-enginelab/-/-"
api       = "apps/hip_decode_token_main.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

