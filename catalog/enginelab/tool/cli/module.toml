id        = "tool.enginelab.cli"
kind      = "tool"
summary   = "the strix CLI library: cli, detail, doctor, inspection and process: 6 origin files under include/strix, src/cli"
why       = "strix run / doctor / inspect; where it would go: kept as a reference program or lab (tool.cli-enginelab/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.cli-enginelab/-/-. 4 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "include/strix/cli/cli.hpp",
  "src/cli/cli.cpp",
  "src/cli/detail.hpp",
  "src/cli/doctor.cpp",
  "src/cli/inspection.cpp",
  "src/cli/process.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = ["src/src/cli/cli.cpp", "src/src/cli/doctor.cpp", "src/src/cli/inspection.cpp", "src/src/cli/process.cpp"]
includes  = ["src/src", "src/include"]
arch      = "gfx1151"

[[provides]]
interface = "tool.cli-enginelab/-/-"
api       = "src/cli/cli.cpp"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "runtime.enginelab.backend_cpu"

[[requires]]
module    = "runtime.enginelab.deploy"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.levers"

[[requires]]
module    = "runtime.enginelab.memory"

[[requires]]
module    = "runtime.enginelab.model_registry"

[[requires]]
module    = "runtime.enginelab.support_matrix"

[[requires]]
module    = "serve.enginelab.serve_http"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
