id        = "tool.enginelab.apps_hy4"
kind      = "tool"
summary   = "the Hy4 programs: DFly, rank, reference and rows: 4 origin files under apps/hy4_dfly_main.cpp, apps/hy4_rank_main.cpp, apps/hy4_ref_main.cpp, apps/hy4_rows_main.cpp"
why       = "Hy4 binaries; where it would go: kept as a reference program or lab (tool.enginelab-hy4/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-hy4/-/-. 4 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
