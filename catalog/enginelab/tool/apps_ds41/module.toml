id        = "tool.enginelab.apps_ds41"
kind      = "tool"
summary   = "the DeepSeek V4.1 programs: batch, deploy, DSpark (rank, replay), expert server, inspect, lockstep, long context, pipeline front and replay, prefill (continue, quality, resident, pair), prefix, quality arms, rank, requant eval, serve, trimmed, engram pages, hetero stage, prepare load, read bench, state send and XS probes"
why       = "the DS41 pair binaries (deepseek41_rank_main is one rank of the two-node path); where it would go: kept as a reference program or lab (tool.enginelab-ds41/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-ds41/-/-. 4 HIP unit(s) compiled standalone by the gate; 22 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

