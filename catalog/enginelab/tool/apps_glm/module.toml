id        = "tool.enginelab.apps_glm"
kind      = "tool"
summary   = "the GLM programs: auto rows, deploy (owners, provider), model facts, prefill main, rank (defaults, receipt, startup, transport), route levers, serve and vision"
why       = "the GLM pair binaries; where it would go: kept as a reference program or lab (tool.enginelab-glm/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-glm/-/-. 4 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/glm_auto_rows.hpp",
  "apps/glm_deploy.inc",
  "apps/glm_deploy_owners.hpp",
  "apps/glm_deploy_provider.hpp",
  "apps/glm_model_facts.hpp",
  "apps/glm_pf_main.cpp",
  "apps/glm_rank_defaults.hpp",
  "apps/glm_rank_main.cpp",
  "apps/glm_rank_receipt.hpp",
