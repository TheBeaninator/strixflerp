id        = "tool.enginelab.apps_gemma4"
kind      = "tool"
summary   = "the Gemma 4 programs: decode, gate, prefill A/B, serve and tokenize: 5 origin files under apps/gemma4_decode_main.cpp, apps/gemma4_gate_main.cpp, apps/gemma4_prefill_ab.hpp, apps/gemma4_serve_main.cpp"
why       = "Gemma 4 binaries; where it would go: kept as a reference program or lab (tool.enginelab-gemma4/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-gemma4/-/-. 4 host unit(s). Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/gemma4_decode_main.cpp",
  "apps/gemma4_gate_main.cpp",
  "apps/gemma4_prefill_ab.hpp",
  "apps/gemma4_serve_main.cpp",
  "apps/gemma4_tokenize_main.cpp",
]
authors   = ["hyukudan", "strix-halo-engine-lab contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "c++"
sources   = [
  "src/apps/gemma4_decode_main.cpp",
  "src/apps/gemma4_gate_main.cpp",
  "src/apps/gemma4_serve_main.cpp",
  "src/apps/gemma4_tokenize_main.cpp",
]
includes  = ["src/apps"]
arch      = "gfx1151"

[[provides]]
interface = "tool.enginelab-gemma4/-/-"
api       = "apps/gemma4_*"
numeric   = "see the file headers"
regime    = "see the file headers"

[[requires]]
module    = "executor.enginelab.gemma4_engine"

[[requires]]
module    = "kernel.enginelab.gemma4_kernels"

[[requires]]
module    = "runtime.enginelab.device"

[[requires]]
module    = "runtime.enginelab.gemma4_ref"

[[requires]]
module    = "runtime.enginelab.pair_link"

[[requires]]
module    = "serve.enginelab.gemma4_serve"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C++ (or C) compiled by the origin's CMake with its host toolchain; the compile gate builds hip-c++ modules only"
