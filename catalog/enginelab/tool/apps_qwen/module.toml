id        = "tool.enginelab.apps_qwen"
kind      = "tool"
summary   = "the Qwen programs and headers: Qwen 3.5 decode, pair and spec mains, cache admission and family contract, chain plan, deploy and provider, effective config, HTTP memory, description hook, MoE direct-B and BF16 route, MTP bundle and owner plan, pair transport, prefill external memory / options / plan, prompt organization, rotary capabilities, serial prompt certificate, service health, tiled prompt plan and the YaRN admission / memory / owner inventory"
why       = "the Qwen one-node and replica binaries; where it would go: kept as a reference program or lab (tool.enginelab-qwen/-/-), not linked into an engine"
notes     = "Interface tag: none (no catalogue interface matches); [[provides]] names the shape it would carry, tool.enginelab-qwen/-/-. 3 HIP unit(s) compiled standalone by the gate; 1 host .cpp file(s) are compiled by the origin's CMake host toolchain and are not gate units. Nothing of this module was run or timed on the pod (card bc74e1a17d: no GPU, no workers, no weights)."

[provenance]
origin    = "enginelab"
repo      = "https://github.com/hyukudan/strix-halo-engine-lab"
commit    = "0598cf6dc030260c633482a4ef4b38fdd9d5502b"
branch    = "main"
paths     = [
  "apps/hip_qwen35_decode_main.hip",
  "apps/hip_qwen35_pair_main.hip",
  "apps/hip_qwen35_spec_main.hip",
  "apps/qwen_cache_admission.hpp",
