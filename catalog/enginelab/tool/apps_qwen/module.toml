  "src/apps/hip_qwen35_pair_main.hip",
  "src/apps/hip_qwen35_spec_main.hip",
]
includes  = ["src/apps", "src/apps"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "tool.enginelab-qwen/-/-"
