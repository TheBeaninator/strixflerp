id        = "runtime.kyojin.ext_bindings"
kind      = "runtime"
summary   = "The extension's pybind11 module (every op bound, CUDA and ROCm branches) and build_config.py (which sources build on ROCm)"
why       = "the call surface of every kernel above. Where the shape would go: an executor.provider-api/exl3-ext/- provider beside runtime.gufo.ext_api, through the host code behind the flerp ABI"
notes     = "Interface tag: executor.provider-api/exl3-ext/-. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (build_config.py), 1 changed (bindings.cpp). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/bindings.cpp", "exllamav3/exllamav3_ext/build_config.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/exllamav3/exllamav3_ext/bindings.cpp"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.provider-api-kyojin/exl3-ext/-"
api       = "bindings.cpp, build_config.py"
numeric   = "n/a"
regime    = "host"

