id        = "runtime.kyojin.qwd3_pf"
kind      = "runtime"
summary   = "Weight prefetch into the infinity cache (MALL, 32 MB, ~700 GB/s on re-reads vs 236 GB/s DRAM) during the latency-bound kernels of a decode token: read-only side-stream reads of weights a later streaming kernel will read, results bit-identical by construction (EXL3_QWD3_PF, default off)"
why       = "decode on Strix Halo is memory bound; warming the MALL during latency-bound kernels hides DRAM time. Where the shape would go: a runtime.weight-prefetch/-/- provider beside kernel.radiance.halo_model_ops, through a port of the python / Triton logic"
notes     = "Interface tag: runtime.weight-prefetch/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (qwd3_pf.py), 0 changed. No timing was taken on the pod."

