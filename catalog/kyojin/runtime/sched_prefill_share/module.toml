id        = "runtime.kyojin.sched_prefill_share"
kind      = "runtime"
summary   = "Concurrent prefill of one shared prefix: jobs starting together on one prompt prefix wait for the page owner instead of prefilling it twice"
why       = "agent fan-out with a common prompt. Where the shape would go: a cache.prompt/-/- provider beside runtime.crucible.conversation_cache, runtime.gufo.cache, runtime.hipfire.runtime and 4 more, through a port of the python / Triton logic"
notes     = "Interface tag: cache.prompt/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (prefill_share.py), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
