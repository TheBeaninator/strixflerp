id        = "runtime.kyojin.bc_attention"
kind      = "runtime"
summary   = "Graph-captured decode attention block (first run eager, second captured, later patch-and-replay): q / k / v projections, fused q / k norm and rope, cache write and attention in one replay"
why       = "decode launch overhead. Where the shape would go: an executor.device-graph/exl3/- provider beside kernel.gufo.ds4_backend, through the host code behind the flerp ABI"
notes     = "Interface tag: executor.device-graph/exl3/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 3 changed (attention.cpp, attention.h, attention_bc.h). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/libtorch/attention.cpp",
  "exllamav3/exllamav3_ext/libtorch/attention.h",
  "exllamav3/exllamav3_ext/libtorch/attention_bc.h",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/exllamav3/exllamav3_ext/libtorch/attention.cpp"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.device-graph-kyojin-bc-gqa/exl3/-"
api       = "attention.cpp, attention.h, attention_bc.h"
numeric   = "n/a"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.dsa_topk"

[[requires]]
module    = "kernel.kyojin.exl3_gemm"

[[requires]]
module    = "kernel.kyojin.exl3_gemv_int8"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[[requires]]
module    = "kernel.kyojin.hgemm"

[[requires]]
module    = "runtime.kyojin.bc_mlp"

[[requires]]
module    = "runtime.kyojin.graph"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: attention.cpp"
