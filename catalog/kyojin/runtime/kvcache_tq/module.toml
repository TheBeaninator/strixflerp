id        = "runtime.kyojin.kvcache_tq"
kind      = "runtime"
summary   = "TurboQuant KV cache layer: per head vector y = R x (Hadamard x random signs), n = ||y||, codes = nearest Lloyd-Max centroid of y / n; codebooks for (D, bits) from the Lloyd iteration on (1 - t^2)^((D-3)/2)"
why       = "a 2..4-bit KV cache with a principled codebook. Where the shape would go: a kvcache.rotate/tq3/f32 provider beside kernel.lucebox.kvquant, through a port of the python / Triton logic"
notes     = "Interface tag: kvcache.rotate/tq3/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (tq.py, tq_codebooks.py), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/cache/tq.py", "exllamav3/cache/tq_codebooks.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "kvcache.rotate/tq3/f32.kyojin-turboquant"
api       = "tq.py, tq_codebooks.py"
numeric   = "Lloyd-Max codes, one fp16 norm"
regime    = "gfx1151 serving path"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled"
