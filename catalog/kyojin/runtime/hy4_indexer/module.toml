id        = "runtime.kyojin.hy4_indexer"
kind      = "runtime"
summary   = "k-pool sparse attention pieces: device-resident pooled-key indexer with no host sync, one-kernel pool update, long-context decode kernels (exact top-n group selection)"
why       = "Hy4 long-context decode. Where the shape would go: an attn.indexer-topk/-/i32 provider beside kernel.ciru_iu4.attn, through a port of the python / Triton logic"
notes     = "Interface tag: attn.indexer-topk/-/i32. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (indexer_fused.py, lc_sparse.py, pool_fused.py), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/loader/indexer_fused.py", "exllamav3/loader/lc_sparse.py", "exllamav3/loader/pool_fused.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
