id        = "runtime.kyojin.sampler"
kind      = "runtime"
summary   = "Sampler stacks and presets (custom samplers, collapsed stacks that map onto the fused device sampler)"
why       = "sampling settings to device kernels. Where the shape would go: a sample.next-token/-/f32 provider beside kernel.maya_tp.sampler, kernel.radiance.halo_sample, kernel.strata.sampling and 3 more, through a port of the python / Triton logic"
notes     = "Interface tag: sample.next-token/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 2 changed (custom.py, presets.py). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/generator/sampler/custom.py", "exllamav3/generator/sampler/presets.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "sample.next-token/-/f32.kyojin-stack"
api       = "custom.py, presets.py"
numeric   = "fp32"
regime    = "gfx1151 serving path"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled"
