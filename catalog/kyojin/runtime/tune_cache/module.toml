id        = "runtime.kyojin.tune_cache"
kind      = "runtime"
summary   = "Per-pack tuning cache of the EXL3 GEMM autotuner, the shipped dense GEMM seed and the dense warm-up"
why       = "tuned kernels from the first request. Where the shape would go: a tune.table/hip/- provider beside runtime.tensorfold.hip, through a port of the python / Triton logic"
notes     = "Interface tag: tune.table/hip/-. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (dense_gemm_tune_seed.txt, dense_warmup.py, tune_cache.py), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
