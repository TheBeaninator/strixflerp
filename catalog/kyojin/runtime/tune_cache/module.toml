branch    = "main"
paths     = [
  "exllamav3/model/dense_gemm_tune_seed.txt",
  "exllamav3/model/dense_warmup.py",
  "exllamav3/util/tune_cache.py",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
