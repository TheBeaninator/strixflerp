id        = "runtime.kyojin.graph"
kind      = "runtime"
summary   = "CUDA / HIP graph capture and node patching of the extension (record once, patch kernel arguments, replay)"
why       = "captured decode steps; launch overhead dominates the Strix Halo decode step. Where the shape would go: an executor.device-graph/exl3/- provider beside kernel.gufo.ds4_backend, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: executor.device-graph/exl3/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 2 changed (graph.cu, graph.cuh). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/graph.cu", "exllamav3/exllamav3_ext/graph.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/graph.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.device-graph-kyojin-graph/exl3/-"
api       = "graph.cu, graph.cuh"
numeric   = "n/a"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.exl3_codec"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[[requires]]
module    = "runtime.kyojin.host_mem"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: graph.cu"
