id        = "runtime.kyojin.prefix_disk"
kind      = "runtime"
summary   = "Persistent prompt cache on NVMe: content-addressed pages (blake2b of page ids and the previous hash) survive lane unloads, model swaps and reboots; disk_store.py is the namespace, atomic background writes, LRU byte cap and free-space floor"
why       = "a resumed conversation pays only its new tokens. Where the shape would go: a cache.prompt/-/- provider beside runtime.crucible.conversation_cache, runtime.gufo.cache, runtime.hipfire.runtime and 4 more, through a port of the python / Triton logic"
notes     = "Interface tag: cache.prompt/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (prefix_disk.py, disk_store.py), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/generator/prefix_disk.py", "exllamav3/util/disk_store.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "cache.prompt-kyojin-nvme/-/-"
api       = "prefix_disk.py, disk_store.py"
numeric   = "n/a"
regime    = "gfx1151 serving path"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled"
