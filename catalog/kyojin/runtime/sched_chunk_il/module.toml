id        = "runtime.kyojin.sched_chunk_il"
kind      = "runtime"
summary   = "Chunked-prefill interleave planner (default on since 1.8.8): decode rounds of running jobs are interleaved between prefill chunks of a new prompt; pure python, no torch"
why       = "decode latency while a long prompt prefills. Where the shape would go: an executor.decode-loop/-/- provider beside runtime.flerp.decode_loop, through a port of the python / Triton logic"
notes     = "Interface tag: executor.decode-loop/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (chunk_il.py), 0 changed. No timing was taken on the pod."

