id        = "runtime.kyojin.bc_dsv4_attn"
kind      = "runtime"
summary   = "Whole-attention-step graph for DeepSeek-V4 DSA decode: staged input, q_a / q_norm / q_b, wkv, fused-norm rope, compressors, indexer scoring with capture-safe top-k, split / combine"
why       = "DSV4 decode. Where the shape would go: an executor.device-graph/deepseek-v4-flash/gguf provider beside kernel.gufo.ds4_backend, through the host code behind the flerp ABI"
notes     = "Interface tag: executor.device-graph/deepseek-v4-flash/gguf. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 2 changed (dsv4_attn.cpp, dsv4_attn.h). No timing was taken on the pod."

