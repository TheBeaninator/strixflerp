branch    = "main"
paths     = [
  "exllamav3/bridge.py",
  "exllamav3/device_map.py",
  "exllamav3/modules/row_split.py",
  "exllamav3/serve_split.py",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

