id        = "runtime.kyojin.layer_split"
kind      = "runtime"
summary   = "Contiguous layer split across two devices: the serve-side split plan, an async host-staged bridge (part0 and part1 in either order; on RX 9070 over USB4 + Strix Halo there is no fast peer path, so activations stage through host memory), the device map and row split"
why       = "an eGPU or second device beside a Strix Halo. Where the shape would go: a transport.stage-relay/-/f32 provider beside runtime.ds4.distributed, runtime.ds4.glmtp_distributed, runtime.ds4.kmultinode_distributed and 1 more, through a port of the python / Triton logic"
notes     = "Interface tag: transport.stage-relay/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 4 added (bridge.py, device_map.py, row_split.py, serve_split.py), 0 changed. No timing was taken on the pod."

