id        = "runtime.kyojin.hy4_prefill"
kind      = "runtime"
summary   = "Hy4 prefill kernels in Triton (ROCm gfx11 WMMA through tl.dot): fused dequant + GEMM on stored GGUF bytes, grouped / sorted-token MoE, flash-style absorbed MLA prefill, un-absorbed MLA helpers, CK fmha behind ckmla_fwd"
why       = "Hy4-flash prefill (928-987 tok/s served, README). Where the shape would go: a moe.experts-prefill/gguf-kquant/f16-f32 provider beside kernel.flerp.moe_kgrouped, through a port of the python / Triton logic"
notes     = "Interface tag: moe.experts-prefill/gguf-kquant/f16-f32. Against the base turboderp-org/exllamav3 8c593e4e: 4 added (ck_mla.py, prefill_attn.py, prefill_kernels.py, prefill_unabs.py), 0 changed. No timing was taken on the pod."

