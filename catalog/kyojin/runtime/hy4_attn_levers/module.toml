id        = "runtime.kyojin.hy4_attn_levers"
kind      = "runtime"
summary   = "Hy4 attention decode levers, each behind a flag: fewer eager launches, grouped projections on the stored bytes, positional rope rows, fp8 latent K cache, one-kernel K-row writes, absorbed MLA matrices read from stored Q8_0"
why       = "Hy4-flash decode. Where the shape would go: an attn.qk-norm-rope-store/-/bf16 provider beside kernel.radiance.halo_attn, through a port of the python / Triton logic"
notes     = "Interface tag: attn.qk-norm-rope-store/-/bf16. Against the base turboderp-org/exllamav3 8c593e4e: 6 added (attn_eager.py, attn_grouped.py, kv_fp8.py, kv_fused.py, mla_bgemv.py, rope_rows.py), 0 changed. No timing was taken on the pod."

