id        = "runtime.kyojin.stloader"
kind      = "runtime"
summary   = "Safetensors loader: coalesced reads through pinned ring buffers per worker thread, gaps read through rather than splitting runs"
why       = "model load time from NVMe. Where the shape would go: a format.reader/safetensors/- provider beside format.strixfold.safetensors, format.strixite.safetensors, format.tensorfold.safetensors, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: format.reader/safetensors/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 3 changed (stloader.cpp, stloader.h, stloader_cu.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/stloader.cpp",
  "exllamav3/exllamav3_ext/stloader.h",
  "exllamav3/exllamav3_ext/stloader_cu.cu",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/stloader.cpp", "src/exllamav3/exllamav3_ext/stloader_cu.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.reader-kyojin-stloader/safetensors/-"
api       = "stloader.cpp, stloader.h, stloader_cu.cu; kernels: inplace_bf16_to_fp16_kernel"
numeric   = "bytes"
regime    = "load"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: stloader.cpp, stloader_cu.cu"
