id        = "runtime.kyojin.engram_io_c"
kind      = "runtime"
summary   = "GIL-free parallel row reads for the Engram table (one pread per distinct row into a flat buffer), C"
why       = "the Hy4 Engram path. Where the shape would go: a ple.ngram-rows/ngram-table/- provider beside runtime.strixite.ngram_table, through the host code behind the flerp ABI"
notes     = "Interface tag: ple.ngram-rows/ngram-table/-. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (engram_io.c), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/loader/engram_io.c"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = ["src/exllamav3/loader/engram_io.c"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "ple.ngram-rows-kyojin-pread/ngram-table/-"
api       = "engram_io.c"
numeric   = "rows copied verbatim"
regime    = "gfx1151 serving path"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host c, outside the HIP compile gate"
