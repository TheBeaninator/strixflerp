id        = "kernel.kyojin.exl3_dec"
kind      = "kernel"
summary   = "Batch-1 EXL3 decode kernels for RDNA3.5 (gfx1151, 3,431 lines): one lane owns one 16x16 trellis tile, the bit windows sit at compile-time positions (fully unrolled decode, no LDS staging, no shuffles), fp32 accumulation through v_dot2_f32_f16, the input Hadamard fused"
why       = "Kyojin's Strix Halo batch-1 decode GEMV; the shape a strixflerp linear.decode/exl3 provider for gfx1151 would take. Where the shape would go: a linear.decode/exl3/f32 provider beside kernel.tensorfold.cuda_exl3, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/exl3/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (exl3_dec.cu, exl3_dec.cuh), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/quant/exl3_dec.cu", "exllamav3/exllamav3_ext/quant/exl3_dec.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/quant/exl3_dec.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/exl3/f32.kyojin-dec-rdna35"
api       = "exl3_dec.cu, exl3_dec.cuh; kernels: gemv_kernel, moe_gu_kernel, moe_down_kernel, moe_gu_kernel_r, moe_down_kernel_r, moe_union_build_kernel, moe_combine_kernel_r, router_kernel, router_rows_kernel, rms_norm_kernel ..."
numeric   = "fp16 activations, v_dot2_f32_f16 into fp32"
regime    = "decode, batch 1"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: exl3_dec.cu"
