id        = "kernel.kyojin.gr_mix"
kind      = "kernel"
summary   = "Gated-residual mix chain of the Qwen prefill for gfx11.5 WMMA f16: dm = normed @ proj^T, t = silu(dm/H), the up projection and the sigmoid mean mix as hand-written kernels"
why       = "Qwen3.8-Flash-Next prefill. Where the shape would go: a hc.mix-prefill/f16/f32 provider beside kernel.crucible.hc, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: hc.mix-prefill/f16/f32. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (__init__.py, gr_mix.hip, gr_mix_hip.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/modules/gr_fn/__init__.py",
  "exllamav3/modules/gr_fn/gr_mix.hip",
  "exllamav3/modules/gr_fn/gr_mix_hip.py",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/gr_fn/gr_mix.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "hc.mix-prefill/f16/f32.kyojin-gr"
api       = "__init__.py, gr_mix.hip, gr_mix_hip.py; kernels: gr_g1, gr_g2, gr_g2s, gr_elem_test, gr_gate_test"
numeric   = "fp16 WMMA, fp32 math, rne16 rounding"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.gr_mix.json"
