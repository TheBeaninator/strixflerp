id        = "kernel.kyojin.norm"
kind      = "kernel"
summary   = "RMS norm and gated RMS norm of the extension (warp-shuffle reductions across lanes and warps), with Kyojin's ROCm changes"
why       = "every layer; the gated form is the GDN / KDA output norm. Where the shape would go: a norm.rmsnorm/-/f32 provider beside kernel.ds4.glmtp_rocm_norm_rope, kernel.ds4.k53perf_rocm_norm_rope, kernel.ds4.kmultinode_rocm_norm_rope and 11 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: norm.rmsnorm/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 1 changed (norm.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/norm.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/norm.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "norm.rmsnorm/-/f32.kyojin-ext"
api       = "norm.cu; kernels: rms_norm_kernel, gated_rms_norm_kernel"
numeric   = "fp16 / bf16 in, fp32 reduction"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[[requires]]
module    = "runtime.kyojin.graph"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: norm.cu"
