id        = "kernel.kyojin.mla_dec_valu"
kind      = "kernel"
summary   = "MLA decode absorb / unfold for up to 8 rows on VALU (ROCm only), bit-identical to the Triton WMMA kernels of attention_fn/mla_triton.py (v_wmma_f32_16x16x16_f16 equals a chain of 8 v_dot2_f32_f16 over ascending k)"
why       = "GLM-5.3-Flash MLA decode: the few-row absorb is cheaper on VALU than padding to a WMMA tile. Where the shape would go: an attn.sparse-sink/kv-latent/bf16 provider beside kernel.radiance.halo_glm_family, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: attn.sparse-sink/kv-latent/bf16. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (mla_dec_valu.cu, mla_dec_valu.cuh), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/mla_dec_valu.cu", "exllamav3/exllamav3_ext/mla_dec_valu.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/mla_dec_valu.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.sparse-sink/kv-latent/bf16.kyojin-valu-absorb"
api       = "mla_dec_valu.cu, mla_dec_valu.cuh; kernels: mla_absorb2_valu_kernel, mla_unfold_valu_kernel"
numeric   = "fp16 operands, fp32 accumulation in the WMMA order"
regime    = "decode, R <= 8 rows"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: mla_dec_valu.cu"
