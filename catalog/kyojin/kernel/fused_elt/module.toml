id        = "kernel.kyojin.fused_elt"
kind      = "kernel"
summary   = "ROCm-only fused elementwise ops: each replaces a torch kernel chain of ext_fallbacks.py with one launch and the same per-element arithmetic (rmsnorm(x [* act(g)]) * (w + bias), sigmoid / silu gates), no fast-math intrinsics"
why       = "on ROCm the base extension leaves these to torch chains of 5-8 launches; one launch each is a decode-step launch-count lever. Where the shape would go: a norm.rmsnorm-gated/-/bf16 provider beside kernel.fastasfuck.norm, kernel.libstrix.norm, kernel.radiance.halo_gdn and 1 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: norm.rmsnorm-gated/-/bf16. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (fused_elt.cuh, fused_elt_rocm.cu), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/fused_elt.cuh", "exllamav3/exllamav3_ext/fused_elt_rocm.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/fused_elt_rocm.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "norm.rmsnorm-gated/-/bf16.kyojin-fused-elt"
api       = "fused_elt.cuh, fused_elt_rocm.cu; kernels: fused_gated_rms_norm_kernel, mul_sigmoid_pad_kernel, pad_copy_kernel, fused_silu_mul_kernel, kda_gate_kernel, kda_fb_gate_kernel, kda_gb_norm_kernel"
numeric   = "bf16 / f32 inputs, fp32 math, bf16 round-to-nearest-even out (c10::BFloat16 semantics)"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fused_elt_rocm.cu"
