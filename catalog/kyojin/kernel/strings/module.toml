id        = "kernel.kyojin.strings"
kind      = "kernel"
summary   = "Stop-string matcher of the generator: compares a UTF-32 tail against a packed list, reporting full, partial (overlapping the end) or no match"
why       = "stop strings without a Python loop per token. Where the shape would go: a text.output-parser/-/- provider beside runtime.strixite.output_parser, through the host code behind the flerp ABI"
notes     = "Interface tag: text.output-parser/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 1 changed (strings.cpp). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/generator/strings.cpp"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/exllamav3/exllamav3_ext/generator/strings.cpp"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "text.output-parser-kyojin-stop-strings/-/-"
api       = "strings.cpp"
numeric   = "n/a"
regime    = "host"

[[requires]]
module    = "kernel.kyojin.ext_base"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: strings.cpp"
