id        = "kernel.kyojin.fq_gemv_q8"
kind      = "kernel"
summary   = "q8_1-activation decode kernels (llama.cpp mmvq design): activations quantized once per row into a cached scratch, integer dp4a dots against Q8_0 / IQ weights"
why       = "integer-rate decode for GGUF weights. Where the shape would go: a linear.decode/gguf-q8_0/f32 provider beside kernel.gufo.ds4_linear, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/gguf-q8_0/f32. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (fq_gemv_q8.cu), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/foreign_quant/fq_gemv_q8.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/foreign_quant/fq_gemv_q8.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/gguf-q8_0/f32.kyojin-q8_1"
api       = "fq_gemv_q8.cu; kernels: fq_quant_q8_1_kernel, fq_gemv_q8_iq2_kernel, fq_gemv_q8_nvfp4_kernel, fq_gemv_q8_nvfp4_mrows_kernel, fq_gemv_q8_q8_kernel, fq_gemv_q8_q8_mrows_kernel"
numeric   = "q8_1 activations, dp4a, fp32 out"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.fq_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fq_gemv_q8.cu"
