id        = "kernel.kyojin.exl3_moe_fused"
kind      = "kernel"
summary   = "Fused MoE half-layer decode for gfx11.5 (opt-in EXL3_MOE_FUSED): one persistent launch per half-layer for 1..4 rows covering hyper-connection dots, finalize / mix, router, top-k and expert grouping, gate / up (VALU trellis matvec), silu * up, down and the Hadamard; every index through a pure C++ plan shared with a CPU bounds checker"
why       = "the whole MoE half of a decode layer in one launch: the launch-bound Strix Halo decode step's biggest lever. Where the shape would go: a moe.experts-decode/exl3/f32 provider beside kernel.kestrel.exl3, kernel.maya_tp.cpu_exl3, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-decode/exl3/f32. Against the base turboderp-org/exllamav3 8c593e4e: 4 added (exl3_moe_fused.cu, exl3_moe_fused.cuh, exl3_moe_fused_api.h, exl3_moe_fused_idx.h), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/quant/exl3_moe_fused.cu",
  "exllamav3/exllamav3_ext/quant/exl3_moe_fused.cuh",
  "exllamav3/exllamav3_ext/quant/exl3_moe_fused_api.h",
  "exllamav3/exllamav3_ext/quant/exl3_moe_fused_idx.h",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/quant/exl3_moe_fused.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/exl3/f32.kyojin-fused-half"
api       = "exl3_moe_fused.cu, exl3_moe_fused.cuh, exl3_moe_fused_api.h, exl3_moe_fused_idx.h; kernels: mf_tile_test_kernel, moe_fused_kernel"
numeric   = "fp16 activations, fp32 accumulation"
regime    = "decode, 1..4 rows"

[[requires]]
module    = "kernel.kyojin.exl3_gemv"

[[requires]]
module    = "kernel.kyojin.exl3_moe_valu"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: exl3_moe_fused.cu"
