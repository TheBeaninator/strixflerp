id        = "kernel.kyojin.rope"
kind      = "kernel"
summary   = "Rotary position embedding of the extension (neox / gptj styles, partial rotary, fused q / k), with Kyojin's ROCm changes"
why       = "every attention layer. Where the shape would go: a pos.rope/-/f32 provider beside kernel.crucible.ops, kernel.fastasfuck.rope, kernel.gufo.ds4_norm_rope and 6 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: pos.rope/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 1 changed (rope.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/rope.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/rope.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "pos.rope/-/f32.kyojin-ext"
api       = "rope.cu; kernels: rope_kernel, l4_scale_q_kernel"
numeric   = "fp16 q / k, fp32 sin / cos math"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: rope.cu"
