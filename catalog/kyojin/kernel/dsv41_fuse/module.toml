id        = "kernel.kyojin.dsv41_fuse"
kind      = "kernel"
summary   = "DS4.1 decode glue fusion: swiglu, MoE tail, router scores and router top-k with K-group slots, each one launch with the same operation order as the unfused chain"
why       = "the small launches between the FFN GEMVs. Where the shape would go: an act.swiglu/-/f32 provider beside kernel.ds4.kmultinode_rocm_output, kernel.ds4.rocm_output, kernel.fastasfuck.swiglu and 3 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: act.swiglu/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (dsv41_fuse.hip, dsv41_fuse.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/modules/dsv41_fn/dsv41_fuse.hip", "exllamav3/modules/dsv41_fn/dsv41_fuse.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/dsv41_fn/dsv41_fuse.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "act.swiglu/-/f32.kyojin-dsv41-glue"
api       = "dsv41_fuse.hip, dsv41_fuse.py; kernels: ds41_swiglu_h, ds41_moe_tail, ds41_router_scores_d, ds41_router_topk2"
numeric   = "fp32"
regime    = "decode"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.dsv41_fuse.json"
