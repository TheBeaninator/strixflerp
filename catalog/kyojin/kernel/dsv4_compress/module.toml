id        = "kernel.kyojin.dsv4_compress"
kind      = "kernel"
summary   = "DeepSeek-V4 KV compressor kernels (the compressed-attention pool update) as Kyojin changed them"
why       = "DeepSeek V4 / V4.1 compressed attention; kin of the catalogue's kvcache.compress providers. Where the shape would go: a kvcache.compress/-/f32 provider beside kernel.ds4.kmultinode_rocm_compressor, kernel.ds4.rocm_compressor, kernel.gufo.ds4_attention and 1 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: kvcache.compress/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 1 changed (dsv4_compress.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/dsv4_compress.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/dsv4_compress.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kvcache.compress/-/f32.kyojin"
api       = "dsv4_compress.cu; kernels: dsv4_compress_windows_kernel, dsv4_compress_store_kernel, dsv4_ring_append_kernel"
numeric   = "fp32 state, bf16 / fp16 rows"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[[requires]]
module    = "runtime.kyojin.graph"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: dsv4_compress.cu"
