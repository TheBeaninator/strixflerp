id        = "kernel.kyojin.dsv41_ops"
kind      = "kernel"
summary   = "DeepSeek-V4.1-Flash small-op kernels for gfx1151 in one code object (1,123 lines): each replaces a chain of torch ops of the CPU-exact reference; dsv41_num.h holds the fp8 / fp4 number formats as plain C++ shared bit for bit with a CPU build"
why       = "DS4.1 on one Strix Halo; the number-format header is a reusable bit-exact contract. Where the shape would go: a kernel-abi.dsv41-hip/-/- provider beside kernel.strixfold.dsv41_abi, kernel.strixfold_tp4.dsv41_abi, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: kernel-abi.dsv41-hip/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 4 added (dsv41_hip.hip, dsv41_hip.py, dsv41_num.h, cublas_v2.h), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/modules/dsv41_fn/dsv41_hip.hip",
  "exllamav3/modules/dsv41_fn/dsv41_hip.py",
  "exllamav3/modules/dsv41_fn/dsv41_num.h",
  "exllamav3/modules/dsv41_fn/stub/cublas_v2.h",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/dsv41_fn/dsv41_hip.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "kernel-abi.dsv41-hip-kyojin/-/-"
api       = "dsv41_hip.hip, dsv41_hip.py, dsv41_num.h, cublas_v2.h; kernels: ds41_kv_prep, ds41_rmsnorm_rows, ds41_fq_rows, ds41_fq_rows_v2, ds41_idx_q_prep, ds41_idx_k_store, ds41_pool_store, ds41_compress, ds41_compress_state, ds41_hc_mix_part ..."
numeric   = "explicit-rounding fp8 / fp4 fake-quant arithmetic"
regime    = "gfx1151 serving path"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.dsv41_ops.json"
