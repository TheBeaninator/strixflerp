id        = "kernel.kyojin.fq_dequant"
kind      = "kernel"
summary   = "Foreign-quant dequant to fp16: Q8_0 / IQ2_XXS / NVFP4 (streaming 2D grids) and the k-quants Q4_K / Q5_K / Q6_K / IQ4_XS for the unfused batched-prefill path (dequant then fp16 GEMM)"
why       = "the prefill weight path for foreign formats. Where the shape would go: a format.decode/gguf-kquant/f16 provider beside kernel.lucebox.rocmfp, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: format.decode/gguf-kquant/f16. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (fq_dequant.cu, fq_dequant_kq.cu), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/foreign_quant/fq_dequant.cu",
  "exllamav3/exllamav3_ext/foreign_quant/fq_dequant_kq.cu",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/exllamav3/exllamav3_ext/foreign_quant/fq_dequant.cu",
  "src/exllamav3/exllamav3_ext/foreign_quant/fq_dequant_kq.cu",
]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.decode/gguf-kquant/f16.kyojin"
api       = "fq_dequant.cu, fq_dequant_kq.cu; kernels: fq_dq_tables_build, fq_dq_iq2_kernel_v2, fq_dq_nvfp4_kernel_v2, fq_dq_q8_kernel_v2, fq_dq_kernel, fq_dq_nvfp4_kernel, fq_dq_q4_k_kernel, fq_dq_q5_k_kernel, fq_dq_q6_k_kernel, fq_dq_iq4_xs_kernel ..."
numeric   = "exact dequant to fp16"
regime    = "prefill"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.fq_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fq_dequant.cu, fq_dequant_kq.cu"
