id        = "kernel.kyojin.fq_gemv_kq"
kind      = "kernel"
summary   = "q8_1-activation decode kernels for K-quant and IQ4_XS weights: port of the llama.cpp mmvq vmmq arms with Kyojin's v2 items and multi-row forms"
why       = "GGUF k-quant decode GEMV. Where the shape would go: a linear.decode/gguf-kquant/f32 provider beside kernel.ciru_iu4.q5, kernel.flerp.gguf_gemv_hipfire, kernel.gufo.ds4_mmq and 3 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/gguf-kquant/f32. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (fq_gemv_kq.cu), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/foreign_quant/fq_gemv_kq.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/foreign_quant/fq_gemv_kq.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/gguf-kquant/f32.kyojin-q8_1"
api       = "fq_gemv_kq.cu; kernels: fq_gemv_kq_kernel, fq_gemv_kq_rows_kernel, fq_kq_act_pack_kernel, fq_gemv_kq_mrows_kernel"
numeric   = "q8_1 activations, dp4a, fp32 out"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.fq_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fq_gemv_kq.cu"
