id        = "kernel.kyojin.fla_gdn_fused_h"
kind      = "kernel"
summary   = "GDN fused chunk kernel for gfx11.5 WMMA: recompute_w_u + chunk_gated_delta_rule_fwd_h + chunk_fwd_o of the fla Triton chain in one kernel"
why       = "GDN prefill launch count and traffic. Where the shape would go: a mixer.gdn-prefill/-/f32 provider beside kernel.ciru_iu4.gdn, kernel.crucible.gdn, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: mixer.gdn-prefill/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (gdn_fused_h.hip, gdn_fused_h_hip.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/vendor/fla/hip/gdn_fused_h.hip", "exllamav3/vendor/fla/hip/gdn_fused_h_hip.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/vendor/fla/hip/gdn_fused_h.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "mixer.gdn-prefill/-/f32.kyojin-fused-h"
api       = "gdn_fused_h.hip, gdn_fused_h_hip.py; kernels: gdn_fused_h_o"
numeric   = "bf16 WMMA, fp32 state"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.fla_gdn_fused_h.json"
