id        = "kernel.kyojin.exl3_moe_fused9"
kind      = "kernel"
summary   = "core9: the mf7 kernel plus cache touches (read-only prefetch loads whose results are dropped) for finalize, router and shared-expert rows, with always-inline copies of the outlined phases"
why       = "prefetching the next phase's weights while the current one computes. Where the shape would go: a moe.experts-decode/exl3/f32 provider beside kernel.kestrel.exl3, kernel.maya_tp.cpu_exl3, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-decode/exl3/f32. Against the base turboderp-org/exllamav3 8c593e4e: 4 added (exl3_moe_fused9.cu, exl3_moe_fused9.cuh, exl3_moe_fused9_idx.h, exl3_moe_fused9_inl.cuh), 0 changed. No timing was taken on the pod."

