id        = "kernel.kyojin.fla_gdn_hf"
kind      = "kernel"
summary   = "Gated delta chunk WMMA kernel for gfx1151 adapted from hipfire (gated_delta_chunk_wmma.gfx1151.hip), with its Apache-2.0 licence and NOTICE"
why       = "GDN chunked prefill on WMMA; kin of the hipfire GDN kernels. Where the shape would go: a mixer.gdn-prefill/-/f32 provider beside kernel.ciru_iu4.gdn, kernel.crucible.gdn, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: mixer.gdn-prefill/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 5 added (LICENSE.hipfire-APACHE, NOTICE.hipfire, __init__.py, gdn_hf.hip, gdn_hf_hip.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/vendor/fla/hip/LICENSE.hipfire-APACHE",
  "exllamav3/vendor/fla/hip/NOTICE.hipfire",
  "exllamav3/vendor/fla/hip/__init__.py",
  "exllamav3/vendor/fla/hip/gdn_hf.hip",
  "exllamav3/vendor/fla/hip/gdn_hf_hip.py",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false
upstream  = "hipfire v0.4.2.1-13-gbfb90b9 kernels/src/gated_delta_chunk_wmma.gfx1151.hip (Apache-2.0)"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/vendor/fla/hip/gdn_hf.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "mixer.gdn-prefill/-/f32.kyojin-hipfire"
api       = "LICENSE.hipfire-APACHE, NOTICE.hipfire, __init__.py, gdn_hf.hip, gdn_hf_hip.py; kernels: gated_delta_chunk_gate_wmma"
numeric   = "bf16 WMMA, fp32 state"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.fla_gdn_hf.json"
