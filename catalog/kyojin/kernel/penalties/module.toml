id        = "kernel.kyojin.penalties"
kind      = "kernel"
summary   = "Repetition penalties on the device: frequency / presence / repetition penalty over a token window and DRY (llama.cpp llama_sampler_dry_apply semantics, single-token breakers) in one launch per step"
why       = "keeps penalty sampling inside the captured step. Where the shape would go: a logits.bias/-/- provider beside kernel.fastasfuck.logits_bias, kernel.strixite.logits_bias, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: logits.bias/-/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 2 changed (dry.cu, rep_pen.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/generator/dry.cu", "exllamav3/exllamav3_ext/generator/rep_pen.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/generator/dry.cu", "src/exllamav3/exllamav3_ext/generator/rep_pen.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "logits.bias-kyojin-penalties/-/-"
api       = "dry.cu, rep_pen.cu; kernels: dry_penalty_kernel, apply_rep_pens_kernel, apply_pres_freq_pens_kernel"
numeric   = "fp32 logits"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: dry.cu, rep_pen.cu"
