id        = "kernel.kyojin.gm_router"
kind      = "kernel"
summary   = "Decode-only standard MoE router for up to eight rows (gfx12 tuned): the gate held as a persistent contiguous (experts, hidden) transpose so each GEMV is coalesced"
why       = "router GEMV coalescing at decode. Where the shape would go: a moe.router/-/f32 provider beside kernel.ciru_inkling.glue_decode, kernel.crucible.ops, kernel.ds4.k53flash_rocm_router and 16 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.router/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (gm_router.cu, gm_router.cuh, gm_router.hip), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/gm_ext/gm_router.cu", "exllamav3/gm_ext/gm_router.cuh", "exllamav3/gm_ext/gm_router.hip"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/gm_ext/gm_router.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.router/-/f32.kyojin-gm"
api       = "gm_router.cu, gm_router.cuh, gm_router.hip; kernels: routing_gemv_gfx12_bsz1_kernel, routing_std_topk_gfx12_bsz1_kernel, gm_rt_logits_kernel, gm_rt_topk_kernel"
numeric   = "fp32"
regime    = "decode"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: gm_router.hip"
