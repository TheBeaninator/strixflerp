id        = "kernel.kyojin.fla_triton_gdn"
kind      = "kernel"
summary   = "Vendored flash-linear-attention Triton chain for GDN as Kyojin changed and extended it (gdn_fused, gdn_kkt_shared, gdn_pf added)"
why       = "GDN prefill on any GPU with Triton. Where the shape would go: a mixer.gdn-prefill/-/f32 provider beside kernel.ciru_iu4.gdn, kernel.crucible.gdn, through a port of the python / Triton logic"
notes     = "Interface tag: mixer.gdn-prefill/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (gdn_fused.py, gdn_kkt_shared.py, gdn_pf.py), 9 changed (chunk_delta_h.py, chunk_h.py, chunk_o.py, chunk_scaled_dot_kkt.py, cumsum.py, gdn_chunk_fwd.py) .... No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/vendor/fla/chunk_delta_h.py",
  "exllamav3/vendor/fla/chunk_h.py",
  "exllamav3/vendor/fla/chunk_o.py",
  "exllamav3/vendor/fla/chunk_scaled_dot_kkt.py",
  "exllamav3/vendor/fla/cumsum.py",
  "exllamav3/vendor/fla/gdn_chunk_fwd.py",
  "exllamav3/vendor/fla/gdn_fused.py",
  "exllamav3/vendor/fla/gdn_kkt_shared.py",
  "exllamav3/vendor/fla/gdn_pf.py",
  "exllamav3/vendor/fla/gdn_wy_fast.py",
  "exllamav3/vendor/fla/l2norm.py",
  "exllamav3/vendor/fla/solve_tril.py",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false
upstream  = "flash-linear-attention (MIT, Songlin Yang, Yu Zhang, Zhiyuan Li; exllamav3/vendor/fla/LICENSE)"

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "mixer.gdn-prefill/-/f32.kyojin-fla"
api       = "chunk_delta_h.py, chunk_h.py, chunk_o.py, chunk_scaled_dot_kkt.py, cumsum.py, gdn_chunk_fwd.py, gdn_fused.py, gdn_kkt_shared.py ..."
numeric   = "bf16 / fp32"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled; the Triton kernels in it are JIT-compiled at run time"
