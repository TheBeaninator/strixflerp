id        = "kernel.kyojin.gm_dense_q8"
kind      = "kernel"
summary   = "Dense Q8_0 x q8_1 decode GEMV, few rows, column-tiled (HY4_DENSE_V2): one block walks consecutive columns with the thread-to-chunk map of fq_gemv_q8"
why       = "Hy4 dense trunk decode. Where the shape would go: a linear.decode/gguf-q8_0/f32 provider beside kernel.gufo.ds4_linear, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/gguf-q8_0/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (gm_dense_q8.cu, gm_dense_q8.cuh), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/gm_ext/gm_dense_q8.cu", "exllamav3/gm_ext/gm_dense_q8.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/gm_ext/gm_dense_q8.cu"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/gguf-q8_0/f32.kyojin-gm-cols"
api       = "gm_dense_q8.cu, gm_dense_q8.cuh; kernels: gdq_kernel"
numeric   = "q8_1 activations, dp4a"
regime    = "decode"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
