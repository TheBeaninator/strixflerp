id        = "kernel.kyojin.dsv41_idx"
kind      = "kernel"
summary   = "DS4.1 indexer scoring (WMMA f16 to f32): score[r, t] = sum_h w[r, h] * relu(q[r, h] . k[t]) over 32 heads x 128, a dense pool scan and a candidate-slot scan"
why       = "DSA indexer cost at long context. Where the shape would go: an attn.indexer-score/-/f32 provider beside kernel.ds4.k53perf_rocm_halo_indexer, kernel.lucebox.indexer, kernel.maya_tp.glmd_volta and 2 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: attn.indexer-score/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (dsv41_idx.hip, dsv41_idx.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/modules/dsv41_fn/dsv41_idx.hip", "exllamav3/modules/dsv41_fn/dsv41_idx.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/dsv41_fn/dsv41_idx.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "attn.indexer-score/-/f32.kyojin-dsv41"
api       = "dsv41_idx.hip, dsv41_idx.py; kernels: ds41_idx_score_dense, ds41_idx_score_cand"
numeric   = "fp16 q / k, fp32 accumulation"
regime    = "gfx1151 serving path"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.dsv41_idx.json"
