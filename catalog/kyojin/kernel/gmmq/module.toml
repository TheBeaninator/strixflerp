id        = "kernel.kyojin.gmmq"
kind      = "kernel"
summary   = "Routed (MoE) HIP MMQ for GGUF Q4_K / Q5_K / Q5_1 / Q8_0: out[t * n_used + s] = dequant(W[ids[t, s]]) @ x[t] with q8_1 activations, adapted from Gufo 07e1191's mmq (itself llama.cpp 5c0e946 mmq / mmid / quantize), one mul_mat_q_case per translation unit, with a torch binding"
why       = "GGUF MoE prefill (Hy4-flash, generic GGUF MoE); compare the gufo mmq it came from. Where the shape would go: a moe.experts-prefill/gguf-kquant/q8_1-f32 provider beside kernel.maya_tp.prefill_moe_mmq, kernel.strata.prefill_moe_ggml, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-prefill/gguf-kquant/q8_1-f32. Against the base turboderp-org/exllamav3 8c593e4e: 25 added (common.hpp, ggml-common.h, ggml-hip.h, ggml-impl.h, ggml.h, gmmq.h) ..., 0 changed. No timing was taken on the pod."

