id        = "kernel.kyojin.fla_kda_fused_h"
kind      = "kernel"
summary   = "KDA fused chunk recurrence (output fused) for gfx11.5 / gfx12 WMMA, matching the Triton chunk_kda_fwd_kernel_h_fused bitwise"
why       = "Kimi-Linear prefill. Where the shape would go: a mixer.kda/-/f32 provider beside kernel.ds4.glmtp_rocm_glm, kernel.ds4.k53flash_rocm_glm, kernel.ds4.k53perf_rocm_glm and 4 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: mixer.kda/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (kda_fused_h.hip, kda_fused_h_hip.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/vendor/fla/hip/kda_fused_h.hip", "exllamav3/vendor/fla/hip/kda_fused_h_hip.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/vendor/fla/hip/kda_fused_h.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "mixer.kda/-/f32.kyojin-fused-h"
api       = "kda_fused_h.hip, kda_fused_h_hip.py; kernels: kda_fused_h_o"
numeric   = "bf16 products, fp32 state"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.fla_kda_fused_h.json"
