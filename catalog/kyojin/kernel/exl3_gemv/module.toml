id        = "kernel.kyojin.exl3_gemv"
kind      = "kernel"
summary   = "Small-m EXL3 GEMV, QTIP-style on the unmodified EXL3 format: warps split k and never synchronise in the main loop, B streams straight to registers; launched from exl3_gemm when the heuristic applies"
why       = "decode-bound projections at batch 1..few. Where the shape would go: a linear.decode/exl3/f16-f32 provider beside kernel.crucible.exl3_gemv, kernel.strix_trellis.exl3_dense_r1, kernel.strix_trellis.exl3_gemv and 4 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/exl3/f16-f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 3 changed (exl3_gemv.cu, exl3_gemv.cuh, exl3_gemv_kernel.cuh). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/quant/exl3_gemv.cu",
  "exllamav3/exllamav3_ext/quant/exl3_gemv.cuh",
  "exllamav3/exllamav3_ext/quant/exl3_gemv_kernel.cuh",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/quant/exl3_gemv.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/exl3/f16-f32.kyojin-qtip"
api       = "exl3_gemv.cu, exl3_gemv.cuh, exl3_gemv_kernel.cuh; kernels: moe_had_rows_kernel, moe_silu_mul_kernel, moe_grouped_gemv_k3_kernel, moe_dedup_gemv_kernel, moe_dedup_metadata_kernel, moe_weighted_reduce_kernel, moe_prefill_metadata_kernel, moe_prefill_had_rows_kernel, moe_prefill_grouped_gemv_k3_kernel, moe_prefill_weighted_reduce_kernel ..."
numeric   = "fp16 activations, fp32 accumulation"
regime    = "decode, small m"

[[requires]]
module    = "kernel.kyojin.exl3_codec"

[[requires]]
module    = "kernel.kyojin.exl3_gemv_int8"

[[requires]]
module    = "kernel.kyojin.exl3_gemv_rdna"

[[requires]]
module    = "kernel.kyojin.exl3_kernel_map"

[[requires]]
module    = "kernel.kyojin.exl3_moe_valu"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: exl3_gemv.cu"
