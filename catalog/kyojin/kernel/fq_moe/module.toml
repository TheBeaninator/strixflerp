id        = "kernel.kyojin.fq_moe"
kind      = "kernel"
summary   = "Grouped decode MoE for foreign-quant experts (gateless relu2, IQ2_XXS): the selected experts' up and down GEMVs in two launches plus a weighted fold, replacing a per-expert loop of 18 launches"
why       = "MoE decode launch count on GGUF weights. Where the shape would go: a moe.experts-decode/gguf-iquant/f32 provider beside kernel.lucebox.moe, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-decode/gguf-iquant/f32. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (fq_moe.cu), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/foreign_quant/fq_moe.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/foreign_quant/fq_moe.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/gguf-iquant/f32.kyojin-grouped"
api       = "fq_moe.cu; kernels: fq_moe_up_kernel, fq_moe_down_kernel, fq_moe_combine_kernel"
numeric   = "fp32 accumulation"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.fq_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fq_moe.cu"
