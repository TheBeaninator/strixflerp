id        = "kernel.kyojin.exl3_gemv_int8"
kind      = "kernel"
summary   = "Fused int8-activation GEMV for mul1 (cb 2) tensors: one cooperative launch covering the input Hadamard, activation quantization, dp4a GEMV and output Hadamard; plain int8 or an error-feedback residual mode (~15-16 bit effective activations); per-K instances in comp_units"
why       = "decode GEMV at int8 rate; opt-in on ROCm until measured. Where the shape would go: a linear.decode/exl3/f32 provider beside kernel.tensorfold.cuda_exl3, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/exl3/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 10 changed (exl3_gemv_int8_inst_sq_k1.cu, exl3_gemv_int8_inst_sq_k2.cu, exl3_gemv_int8_inst_sq_k3.cu, exl3_gemv_int8_inst_sq_k4.cu, exl3_gemv_int8_inst_sq_k5.cu, exl3_gemv_int8_inst_sq_k6.cu) .... No timing was taken on the pod."

