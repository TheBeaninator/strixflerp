id        = "kernel.kyojin.ds41_pf"
kind      = "kernel"
summary   = "DS4.1 prefill kernels: sparse attention (MQA, 64 heads x 512, one shared latent kv, per-row key lists, per-head sink) on WMMA f16, routed-expert gather-sum, rope rows"
why       = "DS4.1 prefill. Where the shape would go: an attn.sparse-sink/kv-latent/bf16 provider beside kernel.radiance.halo_glm_family, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: attn.sparse-sink/kv-latent/bf16. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (ds41_pf.hip, ds41_pf.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/modules/dsv41_fn/ds41_pf.hip", "exllamav3/modules/dsv41_fn/ds41_pf.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/dsv41_fn/ds41_pf.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "attn.sparse-sink/kv-latent/bf16.kyojin-ds41-pf"
api       = "ds41_pf.hip, ds41_pf.py; kernels: ds41_sparse_attn_pf, ds41_gather_sum, ds41_rope_rows"
numeric   = "fp16 WMMA, fp32 softmax"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.ds41_pf.json"
