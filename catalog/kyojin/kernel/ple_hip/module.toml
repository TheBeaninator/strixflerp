id        = "kernel.kyojin.ple_hip"
kind      = "kernel"
summary   = "Hand HIP kernels for the two torch fallbacks left in the Qwen prefill: PLELayer.forward_streams_reference after the key / value projections, and deinterleave_qg; bitwise identical to the torch chains"
why       = "prefill launch count. Where the shape would go: a ple.inject/-/f32 provider beside kernel.crucible.ops, kernel.fastasfuck.ple, kernel.maya_tp.ple and 2 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: ple.inject/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (__init__.py, ple_hip.hip, ple_hip.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/modules/ple_fn/__init__.py",
  "exllamav3/modules/ple_fn/ple_hip.hip",
  "exllamav3/modules/ple_fn/ple_hip.py",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/ple_fn/ple_hip.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "ple.inject/-/f32.kyojin-hip"
api       = "__init__.py, ple_hip.hip, ple_hip.py; kernels: ple_rs, ple_gate, ple_norm_conv, ple_copy_state, ple_conv_out, deinterleave_qg"
numeric   = "fp32"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.ple_hip.json"
