id        = "kernel.kyojin.exl3_moe_coop"
kind      = "kernel"
summary   = "Fused decode-shaped MoE (bsz 1..MAX_BSZN): two ordinary launches per layer run every (token, expert) slot through gate / up, activation and down, replacing the per-projection mgemm graphs"
why       = "launch count of the MoE decode step. Where the shape would go: a moe.experts-decode/exl3/f16-f32 provider beside kernel.crucible.moe_decode, kernel.strix_trellis.exl3_tp_moe, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-decode/exl3/f16-f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 4 changed (exl3_moe_coop_instances.cuh, exl3_moe_coop.cu, exl3_moe_coop.cuh, exl3_moe_coop_kernel.cuh). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/quant/comp_units/exl3_moe_coop_instances.cuh",
  "exllamav3/exllamav3_ext/quant/exl3_moe_coop.cu",
  "exllamav3/exllamav3_ext/quant/exl3_moe_coop.cuh",
  "exllamav3/exllamav3_ext/quant/exl3_moe_coop_kernel.cuh",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/quant/exl3_moe_coop.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/exl3/f16-f32.kyojin-coop"
api       = "exl3_moe_coop_instances.cuh, exl3_moe_coop.cu, exl3_moe_coop.cuh, exl3_moe_coop_kernel.cuh; kernels: exl3_moe_coop_rot_kernel, exl3_moe_coop_b_kernel"
numeric   = "fp16 activations, fp32 accumulation"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.exl3_codec"

[[requires]]
module    = "kernel.kyojin.exl3_gemv"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: exl3_moe_coop.cu"
