id        = "kernel.kyojin.qsa_prefill_wmma"
kind      = "kernel"
summary   = "QSA sparse prefill, 4-row union variant (8 waves a block): 16-key tiles gathered once from the union of the rows' selections (LDS bitonic union, per-row visibility masks), K / V prefetch in registers, V transposed in LDS; structure after Gufo's WmmaCausalAttentionKernel, no Gufo source copied"
why       = "shares tile loads across rows whose selections overlap. Where the shape would go: an attn.softmax-gqa/kv-f16/f32 provider beside kernel.ciru_iu4.attn, kernel.ds4.k53perf_rocm_halo_static_query, kernel.gufo.qfn_kernels and 5 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: attn.softmax-gqa/kv-f16/f32. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (qsa_prefill_wmma.hip), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/modules/attention_fn/qsa_prefill_wmma.hip"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false
upstream  = "structure follows Gufo WmmaCausalAttentionKernel (MIT); written for Kyojin's index-list selection (THIRD_PARTY_NOTICES.md)"

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/attention_fn/qsa_prefill_wmma.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "attn.softmax-gqa/kv-f16/f32.kyojin-qsa-union4"
api       = "qsa_prefill_wmma.hip"
numeric   = "fp16 WMMA, fp32 softmax"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.qsa_prefill_wmma.json"
