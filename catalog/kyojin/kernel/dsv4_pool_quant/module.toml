id        = "kernel.kyojin.dsv4_pool_quant"
kind      = "kernel"
summary   = "DeepSeek-V4 compressed pool quantization (pool rows to fp8 with scales)"
why       = "the DSV4 pool cache footprint. Where the shape would go: a kvcache.store/fp8-e4m3/f32 provider beside kernel.gufo.ds4_attention, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: kvcache.store/fp8-e4m3/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 1 changed (dsv4_pool_quant.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/dsv4_pool_quant.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/dsv4_pool_quant.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kvcache.store/fp8-e4m3/f32.kyojin-pool"
api       = "dsv4_pool_quant.cu; kernels: dsv4_pool_quant_scatter_kernel"
numeric   = "fp8 e4m3 rows with fp32 scales"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[[requires]]
module    = "kernel.kyojin.kvcache_quant"

[[requires]]
module    = "runtime.kyojin.graph"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: dsv4_pool_quant.cu"
