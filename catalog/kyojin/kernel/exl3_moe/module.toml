id        = "kernel.kyojin.exl3_moe"
kind      = "kernel"
summary   = "EXL3 MoE expert kernels: input Hadamard, gate / up GEMMs, activation, down GEMM and output Hadamard per (K, codebook, N tile, M tile) instance, with M_TILE 32 / 64 instances for experts with many tokens and the [count_lo, count_hi] split"
why       = "routed experts of the EXL3 packs (GLM-5.3-Flash-EXL3-Yamz, Qwen3.8-Flash-Next-EXL3-Yamz). Where the shape would go: a moe.experts-decode/exl3/f16-f32 provider beside kernel.crucible.moe_decode, kernel.strix_trellis.exl3_tp_moe, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-decode/exl3/f16-f32. Against the base turboderp-org/exllamav3 8c593e4e: 10 added (exl3_moe_inst_k0_n128_cb0.cu, exl3_moe_inst_k0_n256_cb0.cu, exl3_moe_inst_k1_cb0.cu, exl3_moe_inst_k2_cb0.cu, exl3_moe_inst_k3_cb0.cu, exl3_moe_inst_k4_cb0.cu) ..., 43 changed (exl3_moe_inst_k0_n128_cb1.cu, exl3_moe_inst_k0_n128_cb2.cu, exl3_moe_inst_k0_n128_cb2_m32.cu, exl3_moe_inst_k0_n128_cb2_m64.cu, exl3_moe_inst_k0_n256_cb1.cu, exl3_moe_inst_k0_n256_cb2.cu) .... No timing was taken on the pod."

