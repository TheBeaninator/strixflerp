id        = "kernel.kyojin.fq_mmvq"
kind      = "kernel"
summary   = "IQ-format decode GEMV, llama.cpp mmvq style (CUDA and HIP, wave32): q8_1 activations, the ggml vec_dot_iq*_q8_1 dots (ggml_mmvq/: IQ, K, K46, legacy and MXFP4 vec-dots ported from llama.cpp), 1..8 activation columns a launch, plus a grouped decode MoE for IQ experts"
why       = "IQ-quantized GGUF weights at decode. Where the shape would go: a linear.decode/gguf-iq+kquant/q8_1-f32 provider beside kernel.strata.gguf_gemv, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: linear.decode/gguf-iq+kquant/q8_1-f32. Against the base turboderp-org/exllamav3 8c593e4e: 7 added (fq_mmvq.cu, ggml_iq_tables.cuh, ggml_vecdotq_iq.cuh, ggml_vecdotq_k.cuh, ggml_vecdotq_k46.cuh, ggml_vecdotq_legacy.cuh) ..., 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/foreign_quant/fq_mmvq.cu",
  "exllamav3/exllamav3_ext/foreign_quant/ggml_mmvq/ggml_iq_tables.cuh",
  "exllamav3/exllamav3_ext/foreign_quant/ggml_mmvq/ggml_vecdotq_iq.cuh",
  "exllamav3/exllamav3_ext/foreign_quant/ggml_mmvq/ggml_vecdotq_k.cuh",
  "exllamav3/exllamav3_ext/foreign_quant/ggml_mmvq/ggml_vecdotq_k46.cuh",
  "exllamav3/exllamav3_ext/foreign_quant/ggml_mmvq/ggml_vecdotq_legacy.cuh",
  "exllamav3/exllamav3_ext/foreign_quant/ggml_mmvq/ggml_vecdotq_mxfp4.cuh",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false
upstream  = "ggml_mmvq/*.cuh and parts of fq_mmvq.cu from llama.cpp 7182ef7 / 61dbf49 (MIT, THIRD_PARTY_NOTICES.md)"

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/foreign_quant/fq_mmvq.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/gguf-iq+kquant/q8_1-f32.kyojin-mmvq"
api       = "fq_mmvq.cu, ggml_iq_tables.cuh, ggml_vecdotq_iq.cuh, ggml_vecdotq_k.cuh, ggml_vecdotq_k46.cuh, ggml_vecdotq_legacy.cuh, ggml_vecdotq_mxfp4.cuh; kernels: fq_mmvq_kernel, fq_mmvq_moe_upgate_kernel, fq_mmvq_moe_down_kernel, fq_mmvq_moe_combine_kernel, fq_mxfp4_moe_kernel, fq_deq_iq_kernel, fq_moe_fold_kernel"
numeric   = "q8_1 activations, dp4a, fp32 out"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.fq_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fq_mmvq.cu"
