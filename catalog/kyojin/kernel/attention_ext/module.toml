id        = "kernel.kyojin.attention_ext"
kind      = "kernel"
summary   = "The extension's attention helpers (attention.cu) as Kyojin changed them: the small attention kernels and cache plumbing the libtorch attention blocks launch"
why       = "the eager side of the graph-captured attention blocks (runtime.kyojin.bc_attention). Where the shape would go: no catalogue interface matches; it stays a reference for an adapter from its launcher to the flerp module ABI, kept beside the module it serves"
notes     = "Interface tag: none. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 1 changed (attention.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/attention.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/attention.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.kyojin-attention-ext/-/-"
api       = "attention.cu; kernels: kv_cache_update_kernel_paged, attn_chunked_paged_kernel_512x256, attn_chunked_kernel_512x256, attn_reduce_kernel_512x256, attn_chunked_paged_kernel, attn_chunked_kernel, attn_reduce_kernel"
numeric   = "fp16 / bf16 operands, fp32 accumulation (file comments)"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.exl3_codec"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: attention.cu"
