id        = "kernel.kyojin.qsa_prefill"
kind      = "kernel"
summary   = "Qwen QSA sparse prefill attention for gfx11.5 WMMA f16, one wave per (row, kv head): replaces the Triton split + combine pair for fp16 paged caches with bit-identical per-row arithmetic (32-key tiles over the selected keys); qsa_proof/ holds the bounds-proof stamp the loader checks"
why       = "Qwen3.8-Flash-Next long-prompt prefill. Where the shape would go: an attn.softmax-gqa/kv-f16/f32 provider beside kernel.ciru_iu4.attn, kernel.ds4.k53perf_rocm_halo_static_query, kernel.gufo.qfn_kernels and 5 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: attn.softmax-gqa/kv-f16/f32. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (qsa_prefill.hip, qsa_prefill_hip.py, 57046c22bbd4f6e1.ok), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/modules/attention_fn/qsa_prefill.hip",
  "exllamav3/modules/attention_fn/qsa_prefill_hip.py",
  "exllamav3/modules/attention_fn/qsa_proof/57046c22bbd4f6e1.ok",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/modules/attention_fn/qsa_prefill.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "attn.softmax-gqa/kv-f16/f32.kyojin-qsa-prefill"
api       = "qsa_prefill.hip, qsa_prefill_hip.py, 57046c22bbd4f6e1.ok"
numeric   = "fp16 WMMA, fp32 softmax"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.qsa_prefill.json"
