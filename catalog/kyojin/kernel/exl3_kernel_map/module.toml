id        = "kernel.kyojin.exl3_kernel_map"
kind      = "kernel"
summary   = "Kernel selection table of the EXL3 GEMM: (K bits, codebook, shape class) to kernel instance and launch geometry"
why       = "which EXL3 kernel serves a shape. Where the shape would go: a dispatch.kernel-table/exl3/- provider beside runtime.hipfire.dispatch, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: dispatch.kernel-table/exl3/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 2 changed (exl3_kernel_map.cu, exl3_kernel_map.cuh). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/quant/exl3_kernel_map.cu", "exllamav3/exllamav3_ext/quant/exl3_kernel_map.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
