id        = "kernel.kyojin.fla_kda_hf"
kind      = "kernel"
summary   = "KDA chunk kernel derived from hipfire's gated delta chunk WMMA kernel"
why       = "KDA chunked prefill. Where the shape would go: a mixer.kda/-/f32 provider beside kernel.ds4.glmtp_rocm_glm, kernel.ds4.k53flash_rocm_glm, kernel.ds4.k53perf_rocm_glm and 4 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: mixer.kda/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (kda_hf.hip, kda_hf_hip.py), 0 changed. No timing was taken on the pod. The origin builds it at first use with hipcc --genco --offload-arch=gfx1151 -O3 (-ffp-contract=off) into a code object; the gate compiles it device-only the same way."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/vendor/fla/hip/kda_hf.hip", "exllamav3/vendor/fla/hip/kda_hf_hip.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false
upstream  = "derived from hipfire v0.4.2.1-13-gbfb90b9 gated_delta_chunk_wmma.gfx1151.hip (Apache-2.0)"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/vendor/fla/hip/kda_hf.hip"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["-x", "hip", "-std=c++17", "-O3", "-ffp-contract=off", "--offload-device-only", "-c"]

[[provides]]
interface = "mixer.kda/-/f32.kyojin-hipfire"
api       = "kda_hf.hip, kda_hf_hip.py; kernels: kda_chunk16_wmma"
numeric   = "bf16 WMMA, fp32 state"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.kyojin.fla_kda_hf.json"
