id        = "kernel.kyojin.fq_moe_kq"
kind      = "kernel"
summary   = "Grouped decode MoE with q8_1 activations for K-quant / IQ4_XS experts (gate + up, down, fold / combine launches; v2 items)"
why       = "Hy4-flash Q3_K and generic GGUF MoE decode. Where the shape would go: a moe.experts-decode/gguf-kquant/f32 provider beside kernel.flerp.moe_kquant, kernel.flerp.moe_sg, kernel.gufo.qfn_mmq and 1 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: moe.experts-decode/gguf-kquant/f32. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (fq_moe_kq.cu), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/foreign_quant/fq_moe_kq.cu"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/foreign_quant/fq_moe_kq.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/gguf-kquant/f32.kyojin-q8_1"
api       = "fq_moe_kq.cu; kernels: fq_moe_sort_kernel, fq_moe_kq_upgate_kernel, fq_moe_kq_upgate_v2_kernel, fq_moe_kq_down_v2_kernel, fq_moe_kq_down_kernel, fq_moe_kq_combine_kernel"
numeric   = "q8_1 activations, dp4a"
regime    = "decode"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.fq_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: fq_moe_kq.cu"
