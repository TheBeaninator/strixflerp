id        = "kernel.kyojin.ple"
kind      = "kernel"
summary   = "PLE stream gate of Qwen3.8-Flash-Next: out = sigmoid(signed_sqrt(gate * gate_scale)) * value, the shared value row broadcast over the hyper-connection streams"
why       = "the per-layer-embedding injection of the Flash-Next trunk. Where the shape would go: a ple.inject/-/f32 provider beside kernel.crucible.ops, kernel.fastasfuck.ple, kernel.maya_tp.ple and 2 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: ple.inject/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 2 changed (ple.cu, ple.cuh). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/ple.cu", "exllamav3/exllamav3_ext/ple.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/ple.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "ple.inject/-/f32.kyojin"
api       = "ple.cu, ple.cuh; kernels: ple_gate_kernel"
numeric   = "fp32 gate math, fp16 / bf16 rows"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[[requires]]
module    = "runtime.kyojin.graph"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: ple.cu"
