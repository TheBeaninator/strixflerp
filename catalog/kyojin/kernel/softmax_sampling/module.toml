id        = "kernel.kyojin.softmax_sampling"
kind      = "kernel"
summary   = "On-device sampling: argmax / top-k / top-p / min-p basics, a fused terminal sampling step that computes temperature / min-P / Gumbel pipelines in one pass over the logits without materialising a softmax, and the Gumbel noise kernel"
why       = "sampling stays on the device so a captured decode graph needs no host round trip per token. Where the shape would go: a sample.next-token/-/f32 provider beside kernel.maya_tp.sampler, kernel.radiance.halo_sample, kernel.strata.sampling and 3 more, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: sample.next-token/-/f32. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 4 changed (gumbel.cu, sampling_basic.cu, sampling_extra.cu, sampling_fused.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/generator/gumbel.cu",
  "exllamav3/exllamav3_ext/generator/sampling_basic.cu",
  "exllamav3/exllamav3_ext/generator/sampling_extra.cu",
  "exllamav3/exllamav3_ext/generator/sampling_fused.cu",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/exllamav3/exllamav3_ext/generator/gumbel.cu",
  "src/exllamav3/exllamav3_ext/generator/sampling_basic.cu",
  "src/exllamav3/exllamav3_ext/generator/sampling_extra.cu",
  "src/exllamav3/exllamav3_ext/generator/sampling_fused.cu",
]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "sample.next-token/-/f32.kyojin"
api       = "gumbel.cu, sampling_basic.cu, sampling_extra.cu, sampling_fused.cu; kernels: gumbel_noise_kernel_f16, gumbel_noise_kernel_f32, gumbel_noise_kernel_log, argmax_sample_kernel, gumbel_sample_kernel, adaptivep_gumbel_noise_kernel_f32, fs_partial_max_kernel, fs_histogram_kernel, fs_histogram_refine_kernel, fs_select_kernel ..."
numeric   = "fp32 logits"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: gumbel.cu, sampling_basic.cu, sampling_extra.cu, sampling_fused.cu"
