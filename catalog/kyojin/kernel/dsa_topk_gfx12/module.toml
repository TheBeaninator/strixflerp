id        = "kernel.kyojin.dsa_topk_gfx12"
kind      = "kernel"
summary   = "QSA selection rewritten for RDNA (the ROCm path of ext.dsa_topk): fp16 (R, T) rows read from memory once, k <= 512 into int32, bitwise identical to dsa_topk; one 1024-thread block a row, four sweeps (coarse and fine histogram, count, write)"
why       = "the ROCm default of the selection kernel. Where the shape would go: an attn.indexer-topk/-/i32 provider beside kernel.ciru_iu4.attn, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: attn.indexer-topk/-/i32. Against the base turboderp-org/exllamav3 8c593e4e: 2 added (dsa_topk_gfx12.cu, dsa_topk_gfx12.cuh), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/exllamav3_ext/dsa_topk_gfx12.cu", "exllamav3/exllamav3_ext/dsa_topk_gfx12.cuh"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/dsa_topk_gfx12.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.indexer-topk/-/i32.kyojin-gfx12"
api       = "dsa_topk_gfx12.cu, dsa_topk_gfx12.cuh; kernels: dsa_topk_gfx12_kernel, dsa_topk_gfx12_v2_kernel"
numeric   = "fp16 scores, int32 indices"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: dsa_topk_gfx12.cu"
