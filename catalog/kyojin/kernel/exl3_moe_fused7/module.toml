api       = "exl3_moe_fused7.cu, exl3_moe_fused7.cuh, exl3_moe_fused7_idx.h, exl3_moe_fused7_mv.cuh; kernels: moe_fused7_kernel"
numeric   = "fp16 activations, fp32 accumulation"
