id        = "kernel.kyojin.gdn_fn_gr_pf"
kind      = "kernel"
summary   = "Fused prefill pieces of GatedResidual._mix (grouped rms_norm, gate application) in Triton, replacing ~13 fp32 torch kernels on ROCm"
why       = "Qwen prefill. Where the shape would go: a hc.mix-prefill/f16/f32 provider beside kernel.crucible.hc, through a port of the python / Triton logic"
notes     = "Interface tag: hc.mix-prefill/f16/f32. Against the base turboderp-org/exllamav3 8c593e4e: 1 added (gr_pf.py), 0 changed. No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = ["exllamav3/modules/gated_delta_net_fn/gr_pf.py"]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "hc.mix-prefill/f16/f32.kyojin-gr-pf"
api       = "gr_pf.py"
numeric   = "fp32"
regime    = "prefill"

[gate]
parity    = "none"
bench     = "none"
