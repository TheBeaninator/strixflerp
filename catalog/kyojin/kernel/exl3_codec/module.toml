id        = "kernel.kyojin.exl3_codec"
kind      = "kernel"
summary   = "EXL3 trellis decode primitives as Kyojin changed them: bit-window extraction (exl3_dq.cuh), the 3INST / mcg / mul1 codebooks, the per-device context (SM count, locks, the MoE expert scheduler tickets) and quant utilities"
why       = "every EXL3 kernel below decodes weights through these; the codebooks define the EXL3 numerics. Where the shape would go: a format.device-view/exl3/- provider beside format.crucible.exl3, format.strixfold.exl3, format.strixfold_tp4.exl3, through an adapter from its launcher to the flerp module ABI"
notes     = "Interface tag: format.device-view/exl3/-. Against the base turboderp-org/exllamav3 8c593e4e: 0 added, 6 changed (bits_k.cuh, codebook.cuh, exl3_devctx.cu, exl3_devctx.cuh, exl3_dq.cuh, util.cu). No timing was taken on the pod."

[provenance]
origin    = "kyojin"
repo      = "https://github.com/Yamz-Labs/kyojin"
commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "exllamav3/exllamav3_ext/quant/bits_k.cuh",
  "exllamav3/exllamav3_ext/quant/codebook.cuh",
  "exllamav3/exllamav3_ext/quant/exl3_devctx.cu",
  "exllamav3/exllamav3_ext/quant/exl3_devctx.cuh",
  "exllamav3/exllamav3_ext/quant/exl3_dq.cuh",
  "exllamav3/exllamav3_ext/quant/util.cu",
]
authors   = ["Yamz Labs (Kyojin contributors)", "turboderp (ExLlamaV3, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/exllamav3/exllamav3_ext/quant/exl3_devctx.cu", "src/exllamav3/exllamav3_ext/quant/util.cu"]
includes  = ["src/exllamav3/exllamav3_ext"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.device-view-kyojin/exl3/-"
api       = "bits_k.cuh, codebook.cuh, exl3_devctx.cu, exl3_devctx.cuh, exl3_dq.cuh, util.cu; kernels: count_inf_nan_kernel"
numeric   = "trellis codes decoded to fp16 through the codebook hash"
regime    = "gfx1151 serving path"

[[requires]]
module    = "kernel.kyojin.ext_base"

[[requires]]
module    = "kernel.kyojin.ext_portability"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "needs the PyTorch C++ extension headers (torch / ATen / c10 / pybind11) of a ROCm torch build, not on the gate host: exl3_devctx.cu, util.cu"
