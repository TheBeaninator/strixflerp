id        = "format.kyojin.gguf_loader"
kind      = "format"
summary   = "GGUF loading for the EXL3 engine: the tensor collection (raw quantized payloads with the SafetensorsCollection call shape), the block registry that composes a generic loader from per-family blocks, GGUF-to-HF config, tokenizer from tokenizer.ggml.* (pre-tokenizer table generated from llama.cpp)"
why       = "runs GGUF files unconverted. Where the shape would go: a format.loader/gguf/- provider beside format.gufo.gguf_kquant, through a port of the python / Triton logic"
notes     = "Interface tag: format.loader/gguf/-. Against the base turboderp-org/exllamav3 8c593e4e: 14 added (__init__.py, attn.py, engram.py, hyperconnections.py, indexer.py, mla_attn.py) ..., 0 changed. No timing was taken on the pod."

