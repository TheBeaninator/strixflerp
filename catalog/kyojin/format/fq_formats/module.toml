summary   = "Python reference decoders of the foreign formats (k-quants, IQ2_XXS, NVFP4, Q8_0, legacy, gap formats), GGUF tables and the IQ grid generator that writes fq_tables.cuh"
why       = "the bit-exact references the fq_* kernels are checked against. Where the shape would go: a format.device-view/gguf-kquant/- provider beside format.flerp.gguf_placed, format.gufo.gguf_kquant, format.hipfire.loader, through a port of the python / Triton logic"
notes     = "Interface tag: format.device-view/gguf-kquant/-. Against the base turboderp-org/exllamav3 8c593e4e: 12 added (__init__.py, gap_formats.py, gguf_fast.py, gguf_tables.py, iq2_xxs.py, iq_grids_gen.py) ..., 0 changed. No timing was taken on the pod."

