id        = "serve.kyojin.serve_common"
kind      = "serve"
summary   = "Pieces the servers share: split flags, answer-phase loop guard, vLLM-style compatibility (token-id prompts, cache_salt, /tokenize), incremental prompt encode cache, /health during load, admin knob endpoint, slot check"
why       = "common server behaviour. Where the shape would go: a serve.api/openai/- provider beside serve.strixite.openai, through a port of the python / Triton logic"
notes     = "Interface tag: serve.api/openai/-. Against the base turboderp-org/exllamav3 8c593e4e: 7 added (admin_knobs.py, kyojin_serve_split.py, l21_prompt_encode_cache.py, loopguard.py, serve_compat.py, slot_check.py) ..., 0 changed. No timing was taken on the pod."

