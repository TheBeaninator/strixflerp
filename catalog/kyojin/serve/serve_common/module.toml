commit    = "116a883ff213a842619bf633089b7e0083aa86ff"
branch    = "main"
paths     = [
  "tools/admin_knobs.py",
  "tools/kyojin_serve_split.py",
  "tools/l21_prompt_encode_cache.py",
  "tools/loopguard.py",
  "tools/serve_compat.py",
  "tools/slot_check.py",
  "tools/startup_health.py",
]
