id        = "executor.kyojin.hy4_forward"
kind      = "executor"
summary   = "Hy4-flash whole-model forward (slow but correct, torch only), its CPU fp32 attention reference and the opt-in decensor edit hook (HY4_ABLIT_SPEC)"
why       = "the reference every Hy4 lever is checked against. Where the shape would go: an executor.model/hy4-flash/gguf provider beside executor.crucible.flashnext, executor.flerp.dsv41_zip2, executor.flerp.qwen35moe and 25 more, through a port of the python / Triton logic"
notes     = "Interface tag: executor.model/hy4-flash/gguf. Against the base turboderp-org/exllamav3 8c593e4e: 3 added (ablit_hy4.py, hy4_forward.py, mla_hy4.py), 0 changed. No timing was taken on the pod."

