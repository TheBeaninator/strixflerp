[build]
lang      = "rust"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "cache.prompt-hipfire/-/-"
api       = "hipfire_runtime::{session_cache, prefix_index, checkpoint_pool, verified_cache}"
numeric   = "snapshot restore is cold-exact; live continuation is session-exact (arch-qwen4 map.md)"
regime    = "RAM tiers"

[[provides]]
interface = "kvcache.tiering/hipfire-kv/-"
api       = "hipfire_runtime::{kv_backend, kv_mode, kv_adaptive}"
numeric   = "KV format chosen per mode; adaptive ladder transcodes older rows to fewer bits"
regime    = "per session"

[[provides]]
interface = "speculation.draft/dflash/f32.hipfire"
api       = "hipfire_runtime::{dflash, dflash2_spec, dflash_online, ddtree}"
numeric   = "draft-only numerics"
regime    = "draft blocks"

[[provides]]
interface = "speculation.draft/dspark/f32.hipfire"
api       = "hipfire_runtime::{dspark_core, dspark_block_controller}"
numeric   = "draft-only numerics"
regime    = "draft blocks"

[[provides]]
interface = "speculation.window-verify-hipfire/-/-"
api       = "hipfire_runtime::{spec, spec_sampling, spec_economics, spec_retire}"
numeric   = "lossless sampled accept; a measured AR floor decides whether speculation runs"
regime    = "per request"

[[provides]]
interface = "sample.next-token/-/f32.hipfire"
api       = "hipfire_runtime::{sampler, batch_sampler}"
numeric   = "fp32"
regime    = "host"

[[provides]]
interface = "collective.mesh-hipfire/-/-"
api       = "hipfire_runtime::{device_mesh, mesh_split, ep, ep_tile_exchange, tp_shard, multi_gpu}"
numeric   = "expert-parallel and TP shards over a device mesh"
regime    = "multi-GPU / multi-node"

[[provides]]
interface = "serve.daemon/hipfire/-"
api       = "hipfire_runtime::serve"
numeric   = "n/a"
regime    = "host"

[[requires]]
interface = "device.facade-hipfire/hip/-"

[[requires]]
interface = "dispatch.kernel-table/hipfire/-"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "rust crate: built only inside a recipe (phase 3 and later); cargo needs the whole workspace and vendored dependencies"
