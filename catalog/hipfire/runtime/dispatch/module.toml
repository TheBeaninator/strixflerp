[build]
lang      = "rust"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "dispatch.kernel-table/hipfire/-"
api       = "hipfire_dispatch::families::{gemv, gemm, attention, fused_qkv, moe, rotation, kv_tier}, tables::*"
numeric   = "runtime dispatch by (format, arch, shape); this is the layer strixflerp replaces with static assembly"
regime    = "per launch"

[[requires]]
interface = "verify.kernel-abi/hipfire-v1/-"

[[requires]]
interface = "device.facade-hipfire/hip/-"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "rust crate: built only inside a recipe (phase 3 and later); cargo needs the whole workspace and vendored dependencies"
