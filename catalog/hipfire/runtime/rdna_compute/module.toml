[build]
lang      = "rust"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "device.facade-hipfire/hip/-"
api       = "rdna_compute::{Gpu, KernelCompiler, ArchCaps, kernels, kernel_registry}"
numeric   = "n/a"
regime    = "JIT compile on first use, then cached code objects"

[[provides]]
interface = "verify.kernel-pack/hsaco/-"
api       = "rdna_compute::compiler (pack index, hash validation), code_object.rs"
numeric   = "content-keyed objects; packaged objects re-verified by hash before load"
regime    = "load time"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "rust crate: built only inside a recipe (phase 3 and later); cargo needs the whole workspace and vendored dependencies"
