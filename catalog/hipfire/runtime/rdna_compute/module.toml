id        = "runtime.hipfire.rdna_compute"
kind      = "runtime"
summary   = "The kernel launcher: source registry (kernels.rs maps every kernel name to its HIP source text), JIT compile with a content-keyed cache and packaged kernel packs, arch capability table, typed launch wrappers per family"
notes     = "kernels.rs is the generator input the units.json files of the kernel modules were derived from. src/cdna (gfx942) is left out, so the crate does not build as is."

