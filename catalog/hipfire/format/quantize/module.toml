interface = "format.converter/hipfire-hfq+mq+mfp4/-"
api       = "hipfire-quantize (cli.rs, pipeline.rs, quant_mq.rs, quant_hfp4.rs, quant_e8.rs, hfq.rs)"
numeric   = "calibrated quantization; the .hfq container and qt numbers (docs/quant-formats/qt-register.txt)"
regime    = "offline"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "rust crate: built only inside a recipe (phase 3 and later); cargo needs the whole workspace and vendored dependencies"
