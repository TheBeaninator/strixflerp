id        = "format.hipfire.quantize"
kind      = "format"
summary   = "The hipfire quantizer / converter: HFQ, MQ (FWHT rotation, symmetric, Lloyd MQ4V2), HFP4 / MFP4, E8 lattice and GPTQ, Q4, GGUF input, per-model pipelines (Qwen4 slabs and PLE hot packs, DeepSeek)"
notes     = "The crate is taken whole, so it also carries image-model pipelines (pipeline_flux.rs, raon.rs, vision_sidecar.rs) that are outside this pass."

