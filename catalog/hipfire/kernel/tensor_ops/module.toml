authors   = ["Kaden Schutt", "hipfire contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 OR MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 57

[[provides]]
interface = "tensor.ops/-/f32.hipfire"
api       = "add_inplace, add_peer_residual, add, arena, batched_categorical_sample, bf16_round_trip, bias_add, block_i4_128_quant (+49 more units, see units.json)"
numeric   = "fp32 pointwise; casts round to nearest even"
regime    = "any rows"

[[provides]]
interface = "residual.add/-/f32.hipfire"
api       = "add_inplace_f32 (a[i] += b[i]), add_f32 (c = a + b), broadcast_add_rows_f32"
numeric   = "one IEEE fp32 add per element"
regime    = "element-wise"

[[requires]]
module    = "kernel.hipfire.common_headers"

[[requires]]
module    = "kernel.hipfire.gemm_mq"

[gate]
parity    = "flerp:gate/interface/residual-add.toml"
bench     = "none"
status    = "parity"
compile   = "standalone"
evidence  = "gate/results/interface/residual-add/result.json"
reason    = "parity: interface gate residual-add on control-node (result.json, provider hipfire: pass; the gate overall pass=True); compile gate evidence gate/results/compile/kernel.hipfire.tensor_ops.json"
