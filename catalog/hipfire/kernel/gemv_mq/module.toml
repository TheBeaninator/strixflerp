arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 81

[[provides]]
interface = "linear.decode/hipfire-mq/f32"
api       = "fused_gate_up_mq2g256v2, fused_gate_up_mq3g256v2, fused_gate_up_mq3g256_lloyd, fused_gate_up_mq4cg256, fused_gate_up_mq4g256v2_lut (+76 more units, see units.json)"
numeric   = "fp32 activations and fp32 accumulate; weights decoded in-kernel; summation order is per kernel variant, so bits differ between variants and from other engines; the input must be rotated first (rotate.fwht), a fused rotate exists for some epilogues"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

