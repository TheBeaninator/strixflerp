id        = "kernel.hipfire.norm_rope"
kind      = "kernel"
summary   = "RMSNorm (row-split, residual-add and at-slot forms), L2 norm, LayerNorm, RoPE in its interleaved / half-split / partial / tail / YaRN / mRoPE forms, Givens and FWHT (MQ) rotations (32 sources, 52 gfx1151 compile units)"

[provenance]
origin    = "hipfire"
repo      = "https://github.com/warpfront/hipfire"
commit    = "efa8fbb"
branch    = "master"
paths     = [
  "kernels/src/fused_rmsnorm_mq_rotate.hip",
  "kernels/src/fused_rmsnorm_mq_rotate_plain.hip",
  "kernels/src/givens_rotate.hip",
  "kernels/src/givens_rotate_to.hip",
  "kernels/src/hfq4g256_dequantize_to_f16.hip",
  "kernels/src/l2_norm.hip",
  "kernels/src/layernorm.hip",
  "kernels/src/mq_rotate_x_128_v2.hip",
  "kernels/src/mq_rotate_x_i4.hip",
  "kernels/src/rmsnorm.hip",
  "kernels/src/rmsnorm_at_slot_buf.hip",
  "kernels/src/rmsnorm_residual_add.hip",
  "kernels/src/rmsnorm_rowsplit.hip",
  "kernels/src/rope.hip",
  "kernels/src/rope_2d_halfsplit.hip",
  "kernels/src/rope_2d_halfsplit_qkv_interleaved.hip",
  "kernels/src/rope_batched.hip",
  "kernels/src/rope_mrope_halfsplit.hip",
  "kernels/src/rope_mrope_halfsplit_batched.hip",
  "kernels/src/rope_partial_halfsplit.hip",
  "kernels/src/rope_partial_halfsplit_batched.hip",
  "kernels/src/rope_partial_halfsplit_headgrid.hip",
  "kernels/src/rope_partial_halved.hip",
  "kernels/src/rope_partial_halved_batched.hip",
  "kernels/src/rope_partial_interleaved.hip",
  "kernels/src/rope_partial_interleaved_batched.hip",
  "kernels/src/rope_tail_interleaved.hip",
  "kernels/src/rope_tail_interleaved_batched.hip",
  "kernels/src/rope_tail_yarn_interleaved.hip",
  "kernels/src/rope_tail_yarn_interleaved_at_slot_buf.hip",
  "kernels/src/rope_tail_yarn_interleaved_batched.hip",
  "kernels/src/rotate_x_mq_awq.hip",
]
authors   = ["Kaden Schutt", "hipfire contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 OR MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 52

[[provides]]
interface = "norm.rmsnorm/-/f32.hipfire"
api       = "rmsnorm, rmsnorm_rowsplit, rmsnorm_residual_add, fused_rmsnorm_mq_rotate"
numeric   = "fp32"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[provides]]
interface = "pos.rope/-/f32.hipfire"
api       = "rope_partial_*, rope_tail_*, rope_mrope_*, rope_batched"
numeric   = "fp32 rotation; partial (first rot dims) and tail (last dims) layouts, YaRN scaling"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[provides]]
interface = "rotate.fwht/-/f32"
api       = "mq_rotate_x_*, rotate_x_mq_awq, givens_rotate*"
numeric   = "FWHT-256 sign-rotated input for MQ weights; Givens rotations for KV"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[requires]]
module    = "kernel.hipfire.common_headers"

[[requires]]
module    = "kernel.hipfire.gemm_mq"

[[requires]]
module    = "kernel.hipfire.tensor_ops"

[gate]
parity    = "origin-test:crates/rdna-compute/tests"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.hipfire.norm_rope.json"
