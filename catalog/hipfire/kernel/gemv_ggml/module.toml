id        = "kernel.hipfire.gemv_ggml"
kind      = "kernel"
summary   = "Decode GEMV on GGUF blocks (19 sources, 23 units): Q4_K (144 bytes a 256-weight block), Q6_K, Q8_0 (f16 scale + 32 int8) with wide and staged variants, Q4F16, TQ2 and BQ1, one warp a row folding each lane's (d * q) * x with an fma and reducing lanes by shuffles, and fused QKV / gate-up forms on Q4_K and Q8_0"
why       = "It is hipfire's path for GGUF models and the catalogue's second GGUF GEMV provider: kernel.flerp.gguf_gemv_hipfire runs its gemv_q8_0 and gemv_q4k code objects under gufo's LaunchQ8KBlockGEMV, and the gguf-gemv gate passed it within the any-order bound on 14 of 14 cases, with a CPU emulation of its order reproducing its bits, at 16.8 against gufo's 13.5 us for Q8_0 2560 x 2560. docs/PHASE5-GLM52-GAPMAP.md calls this the one weight-reading interface with two hardware-gated providers"

[provenance]
origin    = "hipfire"
repo      = "https://github.com/warpfront/hipfire"
commit    = "efa8fbb"
branch    = "master"
paths     = [
  "kernels/src/fused_gate_up_q4k.hip",
  "kernels/src/fused_gate_up_q8_0.hip",
  "kernels/src/fused_qkv_q4k.hip",
  "kernels/src/fused_qkv_q8_0.hip",
  "kernels/src/fused_qkvza_q8_0.hip",
  "kernels/src/gemv_bq1g128.hip",
  "kernels/src/gemv_q4as8.hip",
  "kernels/src/gemv_q4f16_g32.hip",
  "kernels/src/gemv_q4f16_g64.hip",
  "kernels/src/gemv_q4f16_g64_wide.hip",
  "kernels/src/gemv_q4k.hip",
  "kernels/src/gemv_q4lut.hip",
  "kernels/src/gemv_q4wave.hip",
  "kernels/src/gemv_q6k.hip",
  "kernels/src/gemv_q8_0.hip",
  "kernels/src/gemv_q8_0_wide.hip",
  "kernels/src/gemv_tq2g128.hip",
  "kernels/src/qwen4_gemv_q8_0.hip",
  "kernels/src/qwen4_gemv_q8_0_wide.hip",
]
authors   = ["Kaden Schutt", "hipfire contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 OR MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 23

[[provides]]
interface = "linear.decode/gguf-kquant/f32.hipfire"
api       = "fused_gate_up_q4k, fused_gate_up_q8_0, fused_qkvza_q8_0, fused_qkv_q4k_qwen2_bias, fused_qkv_q4k (+18 more units, see units.json)"
numeric   = "fp32 activations and fp32 accumulate; weights decoded in-kernel; summation order is per kernel variant, so bits differ between variants and from other engines; Q8_0 block = f16 scale + 32 int8, Q4_K block = 144 bytes per 256 weights"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[requires]]
module    = "kernel.hipfire.common_headers"

[[requires]]
module    = "kernel.hipfire.indexer_topk"

[[requires]]
interface = "format.device-view-hipfire/gguf-kquant/-"

[gate]
parity    = "flerp:gate/interface/gguf-gemv.toml"
bench     = "none"
status    = "parity"
compile   = "standalone"
evidence  = "gate/results/interface/gguf-gemv/result.json"
reason    = "parity: interface gate gguf-gemv on control-node (result.json, provider hipfire: pass; the gate overall pass=True); compile gate evidence gate/results/compile/kernel.hipfire.gemv_ggml.json"
