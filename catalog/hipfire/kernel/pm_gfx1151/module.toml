regime    = "4 rows a tile, decode"

[[provides]]
interface = "moe.experts-decode/hipfire-mq+e8p/f32.pm"
api       = "mq_i4_moe_gemv_*_pm_gfx1151, e8p_i4_moe_gemv_pm_gfx1151, qwen4_moe_iu4_sym_*_pm_gfx1151, qwen4_moe_gate_up_stream8_pm_gfx1151, qwen4_shared_gu_pm_gfx1151"
numeric   = "integer-4 MoE GEMV per shape contract (r128_down, r256_gate_up)"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[provides]]
interface = "attn.qsa-indexer/-/bf16+f32.pm"
api       = "qsa_select_pm_gfx1151, qsa_select_bf16_pm_gfx1151, qsa_gather_pm_gfx1151"
numeric   = "exact selection, certified against the hipcc arm"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[provides]]
