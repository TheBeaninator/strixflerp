includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 81

[[provides]]
interface = "linear.prefill/hipfire-mq/f32"
api       = "gemm_gate_up_mq2g256v2_wmma, gemm_gate_up_mq3g256v2_wmma, gemm_gate_up_mq3g256_lloyd_wmma_mb4_nosync, gemm_gate_up_mq3g256_lloyd_wmma_mb4, gemm_gate_up_mq3g256_lloyd_wmma_nosync (+76 more units, see units.json)"
numeric   = "f16 WMMA with fp32 accumulate, or exact-integer (iu4 / i8) WMMA with activations quantized per 128-block and one fp scale per block pair"
regime    = "prefill batches, compute-bound (WMMA, MMQ)"

[[provides]]
interface = "act.quantize/i8-128/f32"
api       = "block_i8_128_quant, act_quant_* units"
numeric   = "per-128-block int8 activation quantizer feeding the integer GEMMs"
regime    = "prefill batches, compute-bound (WMMA, MMQ)"

