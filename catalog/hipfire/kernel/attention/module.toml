[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 87

[[provides]]
interface = "attn.softmax-gqa/kv-f16+bf16+q8_0+rotated/f32.hipfire"
api       = "attention_band_mask, attention_bf16_kv_batched, attention_bf16_kv, attention_causal_batched, attention_decode_batched_history (+82 more units, see units.json)"
numeric   = "fp32 scores and online softmax; KV rows decoded from their storage format in-kernel; split chunks merged by an online-softmax correction (order fixed by chunk index)"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound; prefill batches, compute-bound (WMMA, MMQ)"

[[requires]]
module    = "kernel.hipfire.common_headers"

[[requires]]
interface = "kvcache.store/hipfire-kv/f32"

[gate]
parity    = "origin-test:crates/rdna-compute/tests"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.hipfire.attention.json"
