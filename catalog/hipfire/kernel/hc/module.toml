id        = "kernel.hipfire.hc"
kind      = "kernel"
summary   = "hipfire's hyper-connection kernels (28 sources, 29 units): the fp32 4-stream residual mix, control compute and finalize, Sinkhorn normalization of the 4 x 4 mixing matrix, alpha apply, input map and stream init from the embedding, Qwen4's fused down projection, gfx1151 hyper-read up kernels and stream-mix aggregate / broadcast"
why       = "Both hipfire models with hyper-connections need them: DSV4 mixes hc_mult = 4 streams through a Sinkhorn-normalized gate every layer (arch_deepseek4's lib.rs) and Qwen4 fuses the mix into its down projection. It is the hipfire row of docs/INTERFACES.md's hc.mix table beside gufo's ds4_hc and qfn_kernels; compiled by the gate, unmeasured"

[provenance]
origin    = "hipfire"
repo      = "https://github.com/warpfront/hipfire"
commit    = "efa8fbb"
branch    = "master"
paths     = [
  "kernels/src/hc_apply_alpha.hip",
  "kernels/src/hc_apply_alpha_batched.hip",
  "kernels/src/hc_compute_control.hip",
  "kernels/src/hc_compute_control_batched.hip",
  "kernels/src/hc_finalize_control.hip",
  "kernels/src/hc_finalize_input_map.hip",
  "kernels/src/hc_head_compute_pre.hip",
  "kernels/src/hc_input_map.hip",
  "kernels/src/hc_input_map_batched.hip",
  "kernels/src/hc_mean_capture.hip",
  "kernels/src/hc_mix_4stream.hip",
  "kernels/src/hc_mix_4stream_batched.hip",
  "kernels/src/hc_pre_post_sigmoid_scale.hip",
  "kernels/src/hc_row_fold.hip",
  "kernels/src/hc_sinkhorn_4x4.hip",
  "kernels/src/hc_sinkhorn_4x4_batched.hip",
  "kernels/src/hc_split_finalize_batched.hip",
  "kernels/src/hc_streams_init_from_embed_batched.hip",
  "kernels/src/hyper_read_up_fused_twin.gfx1151.hip",
  "kernels/src/hyper_read_up_v2.gfx1151.hip",
  "kernels/src/hyper_read_up_wmma.gfx1151.hip",
  "kernels/src/qwen4_hc_down_fused.gfx1151.hip",
  "kernels/src/qwen4_hc_streams_init_from_embed_batched.hip",
  "kernels/src/stream_mix_aggregate.hip",
  "kernels/src/stream_mix_broadcast.hip",
  "kernels/src/stream_mix_mean.hip",
  "kernels/src/stream_mix_mix.hip",
  "kernels/src/stream_mix_route_helmert.hip",
]
authors   = ["Kaden Schutt", "hipfire contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 OR MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 29

[[provides]]
interface = "hc.mix/hipfire/f32"
api       = "hc_apply_alpha_batched, hc_apply_alpha, hc_compute_control_batched, hc_compute_control, hc_compute_control_t1024 (+24 more units, see units.json)"
numeric   = "fp32 over 4 residual streams; Sinkhorn-normalized 4x4 mixing"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound; prefill batches, compute-bound (WMMA, MMQ)"

[[requires]]
module    = "kernel.hipfire.common_headers"

[gate]
parity    = "origin-test:crates/rdna-compute/tests"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.hipfire.hc.json"
