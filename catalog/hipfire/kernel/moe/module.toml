[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 181

[[provides]]
interface = "moe.router/-/f32.hipfire"
api       = "moe_router_softmax*, moe_topk_renorm*, moe_softmax_topk*, hash_router_normalize*, deepseek4_moe_topk*"
numeric   = "fp32 softmax and top-k renormalization"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[provides]]
interface = "moe.experts-decode/hipfire-hfq+mq+mfp4/f32"
api       = "combine, ep_gather_rows_by_owner, ep_gather_rows_by_slot_owner, gemm_hfq4g128_moe_down_grouped_wmma (+177 more units, see units.json)"
numeric   = "fp32 activations and fp32 accumulate; weights decoded in-kernel; summation order is per kernel variant, so bits differ between variants and from other engines; indexed by expert id, k = 8 forms"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[provides]]
interface = "moe.experts-prefill/hipfire-hfq+mq+mfp4/f32"
api       = "gemm_*_moe_* units (grouped MMQ, WMMA)"
numeric   = "grouped by expert, WMMA or MMQ per variant"
regime    = "prefill batches, compute-bound (WMMA, MMQ)"

[[provides]]
interface = "moe.combine/-/f32.hipfire"
api       = "moe_down_combine*, qwen4_moe_scatter*, ffn_moe_combine_policy"
numeric   = "weighted sum of expert outputs in slot order"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[requires]]
module    = "kernel.hipfire.common_headers"

[[requires]]
module    = "kernel.hipfire.tensor_ops"

[[requires]]
interface = "format.device-view/hipfire-hfq/-"

[[requires]]
interface = "format.device-view/hipfire-mq/-"

[[requires]]
interface = "format.device-view/hipfire-mfp4/-"

[gate]
parity    = "origin-test:crates/rdna-compute/tests"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.hipfire.moe.json"
