id        = "kernel.hipfire.gemv_hfq"
kind      = "kernel"
summary   = "Decode GEMV on hipfire HFQ weights: flat N-bit codes with one f32 scale / zero per group (HFQ2..HFQ8, groups 64..1024), HFP4-G32 (FP4 E2M1 + UE8M0), PARO; residual, multirow, wave64 and fused QKV / gate-up forms (43 sources, 73 gfx1151 compile units)"

[provenance]
origin    = "hipfire"
repo      = "https://github.com/warpfront/hipfire"
commit    = "efa8fbb"
branch    = "master"
paths     = [
