  "kernels/src/gemv_hfq4g256_residual.hip",
  "kernels/src/gemv_hfq4g256_residual_scaled.hip",
  "kernels/src/gemv_hfq4g256_residual_wave64.hip",
  "kernels/src/gemv_hfq4g256_residual_wave64_prefetch.hip",
  "kernels/src/gemv_hfq4g256_wide.hip",
  "kernels/src/gemv_hfq4g512.hip",
