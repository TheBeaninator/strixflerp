authors   = ["Kaden Schutt", "hipfire contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 OR MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 73

[[provides]]
interface = "linear.decode/hipfire-hfq/f32"
api       = "fused_gate_up_hfq4g256, fused_gate_up_hfq4g256_wave64, fused_qkvza_hfq4g256_k2048_all_buffer_dlc_gfx1151, fused_qkvza_hfq4g256_k2048_all_buffer_gfx1151, fused_qkvza_hfq4g256_k2048_all_buffer_glc_gfx1151 (+68 more units, see units.json)"
numeric   = "fp32 activations and fp32 accumulate; weights decoded in-kernel; summation order is per kernel variant, so bits differ between variants and from other engines"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[requires]]
module    = "kernel.hipfire.common_headers"

[[requires]]
interface = "format.device-view/hipfire-hfq/-"

[gate]
parity    = "origin-test:crates/rdna-compute/tests"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.hipfire.gemv_hfq.json"
