id        = "kernel.hipfire.kv_cache"
kind      = "kernel"
summary   = "KV cache writers and transcoders: F32 / F16 / BF16, Q8_0, int8, HFQ4 / HFQ8, asymmetric K with FWHT or Givens rotation at 2 / 3 / 4 bits, Lloyd-coded V, fold and compaction, sliding-window ring (44 sources, 42 gfx1151 compile units)"
notes     = "2 of the sources have no compile unit here (assembled by Rust code in the origin, or broken in the origin): see docs/harvest/data/hipfire/not_gfx1151.json."

[provenance]
origin    = "hipfire"
repo      = "https://github.com/warpfront/hipfire"
commit    = "efa8fbb"
