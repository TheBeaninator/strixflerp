authors   = ["Kaden Schutt", "hipfire contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0 OR MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/kernels/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
units     = "units.json"
variants  = 42

[[provides]]
interface = "kvcache.store/hipfire-kv/f32"
api       = "kv_cache_write_asym_k_fwht2_batched, kv_cache_write_asym_k_fwht2, kv_cache_write_asym_k_fwht3_batched, kv_cache_write_asym_k_fwht3, kv_cache_write_asym_k_fwht4_batched (+37 more units, see units.json)"
numeric   = "quantization per format: Q8_0 = f16 scale + 32 int8 per 32 elements; fp16 by true RNE; rotated low-bit K after a FWHT / Givens rotation; transcodes down a bit ladder as context grows"
regime    = "decode, 1 row (multirow / batched variants up to 8..16 rows), memory-bound"

[[requires]]
module    = "kernel.hipfire.common_headers"

[gate]
parity    = "origin-test:crates/rdna-compute/tests"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.hipfire.kv_cache.json"
