id        = "runtime.strixfold_reap.edge_reap"
kind      = "runtime"
summary   = "Passive Edge-REAP routing statistics in the DeepSeek-V4.1 TP4/TP2 serving engine, behind REAP_STATS: every committed token's routing (count, gate mass after the top-6 renorm and the 1.5 scaling, first-64-position count) from the router's own outputs, and a fixed sample's full expert-output norms (the TP2 partner's per-slot K-partial added on the pair's rank 0 before the sum of squares, the two TP4 pairs' halves joined on rank 0), accumulated on device in f64 per (domain, modality) bucket and exported in owner's strix_moe_surgery.py report format"
why       = "owner's expert-pruning script needs Edge-REAP calibration statistics from the traffic the pruned model will serve; under tensor parallelism no rank holds an expert's whole output (the intermediate is K-split across the TP2 ranks and the sum of partial norms is not the norm), so the engine itself must join the partials, and doing that for a sample keeps the expected cost near 0.3 % of a TP4 decode round and 0.5 % of a TP2 one (DESIGN.md, computed)"
design    = "DESIGN.md"
notes     = "Overlay of the TP4 tree (strixfold_tp4 at 003f679c; overlay.json has every file's sha256 there and here and the commits). 39 files, 9 added (reap.zig, reap_dev.zig, reap.hip, reap_hook.zig, reap_routes.zig and its test, the two golden exports). Conf keys (launcher, not harvested): REAP_STATS 0, REAP_EVERY 8, REAP_PREFILL_ROWS 4, REAP_BUCKETS 16, REAP_DIR empty, REAP_SNAPSHOT_MIN 10. Request field reap_domain or header x-reap-domain; GET /stats/reap behind the /cache routes' key. Device bytes a rank: TP4 200 MB rank 0 / 176 MB others, TP2 367 / 344 MB. Kernels (TheRock 10.2, kit flags): tf_ds_reap_pack 8 VGPR, ssq 12, route 25, norm 31; 0 spills, 0 scratch, occupancy 16, LDS 0. The keep-set side is tool.flerp.edge_reap_keepset; tests/test_edge_reap_keepset.py reads the golden exports."

