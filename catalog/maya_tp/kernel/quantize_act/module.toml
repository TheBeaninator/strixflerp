id        = "kernel.maya_tp.quantize_act"
kind      = "kernel"
summary   = "activation quantization to Q8_0 and Q8_K (and back) the way ggml_mul_mat converts src1 to the weight's vec_dot_type, compiled with -ffp-contract=off so Q8_K's multiply and magic-bias rounding stay separate FP32 operations"
why       = "the activation side every GGUF expert GEMV needs; its exact rounding is what keeps the GPU and CPU expert lanes agreeing token for token"
notes     = "Interface tag: quant.activation/-/q8_0+q8_k.maya-tp. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/kernels/quantize_act.hpp", "src/kernels/cuda/quantize_act.cu"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/quantize_act.cu"]
includes  = ["src/include", "src/src/kernels/cuda"]
arch      = "gfx1151"
toolchain = "therock-10.2"
source_options = { "src/src/kernels/cuda/quantize_act.cu" = ["-ffp-contract=off"] }

[[provides]]
interface = "quant.activation/-/q8_0+q8_k.maya-tp"
api       = "strata::kernels::quantize_q8_0, quantize_q8_K, dequant_q8_0 / _K"
numeric   = "separately rounded FP32 operations (-ffp-contract=off)"
regime    = "any block-multiple row"

[[requires]]
module    = "kernel.maya_tp.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.quantize_act.json"
