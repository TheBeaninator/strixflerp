id        = "kernel.maya_tp.glm_fast"
kind      = "kernel"
summary   = "the GLM fast-path kernels (glm_fast.cu, 7,453 lines): AMD IQ2_XXS / IQ2_S / IQ3_XXS decode experts with packed sign expansion and LDS codebooks, the dense GEMV gf::mv with its block-type extensions (glmd_mv_ext, glmd_mv_dots) and the DSA top-pool chooser (dsa_topk)"
why       = "the hottest GLM-5.3-Flash decode kernels; under TP2 each rank runs every selected expert on its half of n_ff with these, so they are the per-rank expert body of the intra-expert split"
notes     = "Interface tag: moe.experts-decode/gguf-iq2+iq3/f32.maya-tp. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "include/strata/kernels/glm_fast.hpp",
  "src/kernels/cuda/dsa_topk.cuh",
  "src/kernels/cuda/glm_fast.cu",
  "src/kernels/cuda/glmd_mv_dots.cuh",
  "src/kernels/cuda/glmd_mv_ext.cuh",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/glm_fast.cu"]
includes  = ["src/include", "src/src/kernels/cuda"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/gguf-iq2+iq3/f32.maya-tp"
api       = "strata::kernels glm fast-path expert launches (include/strata/kernels/glm_fast.hpp)"
numeric   = "q8_1-style integer dots, FP32 out"
regime    = "decode; half n_ff per rank under TP2"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.exl3"

[[requires]]
module    = "kernel.maya_tp.glm_batch"

[[requires]]
module    = "runtime.maya_tp.core_headers"

[[requires]]
module    = "runtime.maya_tp.glm_fast_path"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.glm_fast.json"
