id        = "kernel.maya_tp.ds4_iq"
kind      = "kernel"
summary   = "DeepSeek-V4.1's low-bit routed experts in ggml block types on the device (ds4_iq.cu): the i-quants with IQ1 codes (ds4_iq1_codes), the 512-wide i-quant and MXFP4 kernels (ds4_iq512_kern.inc, ds4_mx_kern.inc)"
why       = "the routed-expert body of maya-ds4; under TP2 its block-aligned slices are what each rank uploads"
notes     = "Interface tag: moe.experts-decode/gguf-iq+mxfp4/f32.maya-tp-ds4. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "src/ds4/ds4_iq.cu",
  "src/ds4/ds4_iq.cuh",
  "src/ds4/ds4_iq1_codes.hpp",
  "src/ds4/ds4_iq512_kern.inc",
  "src/ds4/ds4_mx_kern.inc",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/ds4/ds4_iq.cu"]
includes  = ["src/src/ds4"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/gguf-iq+mxfp4/f32.maya-tp-ds4"
api       = "ds4 IQ launches (ds4_iq.cuh)"
numeric   = "ggml block types, FP32 out"
regime    = "decode and windows"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.ds4_kernels"

[[requires]]
module    = "kernel.maya_tp.prefill_moe_mmq"

[[requires]]
module    = "kernel.maya_tp.prefill_moe_rdna4"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.ds4_iq.json"
