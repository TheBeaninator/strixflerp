id        = "kernel.maya_tp.glmd_decode"
kind      = "kernel"
summary   = "the glm-dsa decode attention kernels: mla2's decode attention (glmd_dec), the B4.3-B4.5 fast kernels (glmd_fast), the token top-k selector (glmd_topk), the NORM RoPE (glmd_rope), the indexer's 128-point Walsh-Hadamard rotation (glmd_had), the arch spellings (glmd_arch), the captured-part position block (glmd_graph) and the library marker (glmd_stub)"
why       = "the GLM-5.3 (DSA) decode attention as Maya's glm-dsa port built it; the per-rank head-group attention under TP2"
notes     = "Interface tag: attn.sparse-dsa-mla/-/f32.maya-tp-glmd. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "include/strata/kernels/glmd_dec.hpp",
  "include/strata/kernels/glmd_fast.hpp",
  "include/strata/kernels/glmd_graph.hpp",
  "src/kernels/cuda/glmd_arch.cuh",
  "src/kernels/cuda/glmd_dec.cu",
  "src/kernels/cuda/glmd_fast.cu",
  "src/kernels/cuda/glmd_graph.cu",
  "src/kernels/cuda/glmd_had.cuh",
  "src/kernels/cuda/glmd_rope.cuh",
  "src/kernels/cuda/glmd_stub.cu",
  "src/kernels/cuda/glmd_topk.cuh",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/src/kernels/cuda/glmd_dec.cu",
  "src/src/kernels/cuda/glmd_fast.cu",
  "src/src/kernels/cuda/glmd_graph.cu",
  "src/src/kernels/cuda/glmd_stub.cu",
]
includes  = ["src/include", "src/src/kernels/cuda"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.sparse-dsa-mla/-/f32.maya-tp-glmd"
api       = "strata::kernels glmd_dec / glmd_fast launches"
numeric   = "FP32 softmax over the top-k tokens"
regime    = "decode"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.glm_fast"

[[requires]]
module    = "runtime.maya_tp.core_headers"

[[requires]]
module    = "runtime.maya_tp.glm_fast_path"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.glmd_decode.json"
