id        = "kernel.maya_tp.tp_kernels"
kind      = "kernel"
summary   = "TP2 delta: the GPU half of a queued TP2 exchange (src/net/tp_kernels.cu, include/strata/net/tp_kernels.hpp): StagePartial copies the partial into the registered send window and publishes a ready value at system scope from the last block, WaitValue spins one wave on the peer's arrival flag with a wall-clock timeout, WaitAdd fuses the wait with the broadcast add of the peer partial into the residual streams"
why       = "this is the GPU-staged queued transport the card names: the CPU never round-trips inside a decode exchange, so it is the piece strixflerp's collective.device-stage interface wants for a two-node rail"
notes     = "Interface tag: collective.device-stage/-/f32.maya-tp. Part of the TP2 delta over Project Maya (data/maya_tp/base-diff.tsv rows A). Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/net/tp_kernels.hpp", "src/net/tp_kernels.cu"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/net/tp_kernels.cu"]
includes  = ["src/include", "src/src/net"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "collective.device-stage/-/f32.maya-tp"
api       = "strata::net::StagePartial, WaitValue, WaitAdd, AddRowsBroadcast"
numeric   = "FP32 partials; system-scope release / acquire on 64-bit flags"
regime    = "two ranks, decode and prefill windows"

[[requires]]
module    = "kernel.maya_tp.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.tp_kernels.json"
