id        = "kernel.maya_tp.sampler"
kind      = "kernel"
summary   = "the sampler chain in llama.cpp's order (penalties, top-k, top-p, min-p, temperature, keyed draw) on the GPU"
why       = "under TP2 rank 0 samples and sends only token decisions over TCP, so the sampler is a rank-0-only piece; a GPU sampler beside sample.next-token providers"
notes     = "Interface tag: sample.next-token/-/f32.maya-tp. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/kernels/sampler.hpp", "src/kernels/cuda/sampler.cu"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/sampler.cu"]
includes  = ["src/include", "src/src/kernels/cuda"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "sample.next-token/-/f32.maya-tp"
api       = "strata::kernels::sampler_*"
numeric   = "FP32 logits, keyed RNG"
regime    = "one or several rows"

[[requires]]
module    = "kernel.maya_tp.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.sampler.json"
