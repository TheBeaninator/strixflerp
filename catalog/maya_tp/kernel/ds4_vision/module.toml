id        = "kernel.maya_tp.ds4_vision"
kind      = "kernel"
summary   = "DeepSeek-V4.1's vision tower on one GPU (ds4_vision.cu / .cuh, DeepSeek's inference/vision.py)"
why       = "image input for the DeepSeek engine; a vision encoder module strixflerp has none of"
notes     = "Interface tag: vision.encoder/-/f32.maya-tp-ds4. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["src/ds4/ds4_vision.cu", "src/ds4/ds4_vision.cuh"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/ds4/ds4_vision.cu"]
includes  = ["src/src/ds4"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "vision.encoder/-/f32.maya-tp-ds4"
api       = "ds4 vision tower (ds4_vision.cuh)"
numeric   = "BF16 / FP32"
regime    = "one image at a time"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.ds4_kernels"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.ds4_vision.json"
