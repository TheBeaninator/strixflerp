id        = "kernel.maya_tp.glm_kda"
kind      = "kernel"
summary   = "the glm5-next KDA (kimi-delta-attention style) pieces: gates, recurrence and readout over the KDA state layouts (glm_kda.cu)"
why       = "the linear-attention half of glm5-next's hybrid; a recurrence shape strixflerp only has as GDN"
notes     = "Interface tag: mixer.kda/-/f32.maya-tp. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/kernels/glm_kda.hpp", "src/kernels/cuda/glm_kda.cu"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/glm_kda.cu"]
includes  = ["src/include", "src/src/kernels/cuda"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "mixer.kda/-/f32.maya-tp"
api       = "strata::kernels glm_kda launches (glm_kda.hpp)"
numeric   = "FP32 state"
regime    = "decode"

[[requires]]
module    = "kernel.maya_tp.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.glm_kda.json"
