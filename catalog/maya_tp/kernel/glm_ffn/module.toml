id        = "kernel.maya_tp.glm_ffn"
kind      = "kernel"
summary   = "the glm5-next clamped SwiGLU (glm_ffn.cu)"
why       = "the activation of every GLM FFN and expert; under TP2 it runs on each rank's half of n_ff before the down share"
notes     = "Interface tag: act.swiglu-clamped/-/f32.maya-tp. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/kernels/glm_ffn.hpp", "src/kernels/cuda/glm_ffn.cu"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/glm_ffn.cu"]
includes  = ["src/include", "src/src/kernels/cuda"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "act.swiglu-clamped/-/f32.maya-tp"
api       = "strata::kernels glm_ffn launches (glm_ffn.hpp)"
numeric   = "FP32 with a clamp"
regime    = "any"

[[requires]]
module    = "kernel.maya_tp.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.glm_ffn.json"
