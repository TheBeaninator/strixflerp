id        = "kernel.maya_tp.ds4_kernels"
kind      = "kernel"
summary   = "DeepSeek-V4.1's own device kernels for a window of T tokens (ds4_kernels.cu, 5,111 lines): attention with its compressed KV, hyper-connections, router and the window forms, with the BF16 / FP8 E4M3 conversions (ds4_numerics), programmatic dependent launch (ds4_pdl) and the Q6_K value reader (ds4_q6k)"
why       = "DeepSeek-V4.1-Flash is the other TP2 model; these are the per-rank window kernels the TP2 DSpark path verifies with"
notes     = "Interface tag: attn.sparse-sink/-/f32.maya-tp-ds4. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "src/ds4/ds4_kernels.cu",
  "src/ds4/ds4_kernels.cuh",
  "src/ds4/ds4_numerics.cuh",
  "src/ds4/ds4_pdl.cuh",
  "src/ds4/ds4_q6k.cuh",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/ds4/ds4_kernels.cu"]
includes  = ["src/src/ds4"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.sparse-sink/-/f32.maya-tp-ds4"
api       = "ds4 kernel launches (ds4_kernels.cuh)"
numeric   = "BF16 / FP8 E4M3 conversions, no fast math"
regime    = "windows of 1-16 tokens"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.sampler"

[[requires]]
module    = "runtime.maya_tp.ds4_engine"

[[requires]]
module    = "runtime.maya_tp.ds4_store"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.maya_tp.ds4_kernels.json"
