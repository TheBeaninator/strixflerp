id        = "format.maya_tp.ple_reader"
kind      = "format"
summary   = "the PLE table reader (src/ngram/ple_reader.cpp, include/strata/ngram/ple_reader.hpp): the per-layer embedding table streamed from disk"
why       = "the format side of the PLE input path; pairs with kernel.maya_tp.ple"
notes     = "Interface tag: format.reader-ple/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/ngram/ple_reader.hpp", "src/ngram/ple_reader.cpp"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.reader-ple/-/-"
api       = "strata::ngram::PleReader"
numeric   = "bytes"
regime    = "decode"

[[requires]]
module    = "runtime.maya_tp.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone."
