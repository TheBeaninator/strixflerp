id        = "serve.maya_tp.templates"
kind      = "serve"
summary   = "chat formatting for the served models: GLM-5 / glm-dsa templates and product settings (glm5_chat_template.jinja, glm_dsa_template.py, glm_dsa_product.py, glm_dsa_tune.py), DeepSeek-V4.1 encoding (ds41_encoding.py) and the generic template"
why       = "getting the GLM-5.3 and DeepSeek chat formats byte-exact is a precondition for tool use; templates are cheap to transfer and expensive to get wrong"
notes     = "Interface tag: serve.chat-template-glm5/-/-. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "serve/chat_golden.json",
  "serve/chat_template.jinja",
  "serve/ds41_encoding.py",
  "serve/glm5_chat_template.jinja",
  "serve/glm_dsa_product.py",
  "serve/glm_dsa_template.py",
  "serve/glm_dsa_tune.py",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "serve.chat-template-glm5/-/-"
api       = "serve/glm_dsa_template.py, glm5_chat_template.jinja"
numeric   = "text"
regime    = "GLM-5.x, DeepSeek-V4.1"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone"
