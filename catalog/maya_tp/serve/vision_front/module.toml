id        = "serve.maya_tp.vision_front"
kind      = "serve"
summary   = "the server side of image input for DeepSeek-V4.1 and MiniMax-M3.1 (serve/ds4_vision.py, serve/mm3_vision.py)"
why       = "image preprocessing in front of the two vision towers (kernel.maya_tp.ds4_vision, mm3_vision)"
notes     = "Interface tag: serve.vision-preprocess/-/-. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["serve/ds4_vision.py", "serve/mm3_vision.py"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "serve.vision-preprocess/-/-"
api       = "serve/ds4_vision.py, mm3_vision.py"
numeric   = "image to patches"
regime    = "HTTP"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone"
