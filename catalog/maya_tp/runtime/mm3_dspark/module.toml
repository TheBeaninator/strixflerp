id        = "runtime.maya_tp.mm3_dspark"
kind      = "runtime"
summary   = "maya-mm3's DSpark draft (mm3_dspark.cu / .hpp)"
why       = "DSpark is the drafter maya-tp runs under TP2 for DeepSeek; the MiniMax copy shows the drafter separated from its engine"
notes     = "Interface tag: speculation.draft-dspark/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["src/mm3/mm3_dspark.cu", "src/mm3/mm3_dspark.hpp"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/src/mm3"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "speculation.draft-dspark/-/-"
api       = "mm3 DSpark (mm3_dspark.hpp)"
numeric   = "per-kernel numerics"
regime    = "block drafts"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.mm3_exl3"

[[requires]]
module    = "kernel.maya_tp.mm3_kernels"

[[requires]]
module    = "runtime.maya_tp.mm3_engine"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone."
