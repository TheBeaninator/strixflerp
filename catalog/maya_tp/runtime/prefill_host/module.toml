id        = "runtime.maya_tp.prefill_host"
kind      = "runtime"
summary   = "the prompt path's host orchestration (src/prefill/prefill.cpp, 2,026 lines) over the prefill kernels and MoE prompt modules"
why       = "chunking, GEMM choice and expert batching for prompts; the driver a strixflerp prefill recipe would mirror"
notes     = "Interface tag: executor.prefill-driver/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/prefill/failure.hpp", "include/strata/prefill/prefill.hpp", "src/prefill/prefill.cpp"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.prefill-driver/-/-"
api       = "strata::prefill (include/strata/prefill/prefill.hpp)"
numeric   = "per-kernel numerics"
regime    = "prompt"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.cpu_iq"

[[requires]]
module    = "kernel.maya_tp.cpu_pool"

[[requires]]
module    = "kernel.maya_tp.elementwise"

[[requires]]
module    = "kernel.maya_tp.gguf_gemv"

[[requires]]
module    = "kernel.maya_tp.kvcache"

[[requires]]
module    = "kernel.maya_tp.ple"

[[requires]]
module    = "kernel.maya_tp.prefill"

[[requires]]
module    = "kernel.maya_tp.prefill_moe_mmq"

[[requires]]
module    = "kernel.maya_tp.qsa"

[[requires]]
module    = "kernel.maya_tp.verify"

[[requires]]
module    = "runtime.maya_tp.core_headers"

[[requires]]
module    = "runtime.maya_tp.core_session"

[[requires]]
module    = "runtime.maya_tp.expert_store"

[[requires]]
module    = "runtime.maya_tp.spec_controller"

[[requires]]
module    = "runtime.maya_tp.verify_mtp"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone."
