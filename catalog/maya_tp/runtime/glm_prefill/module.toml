id        = "runtime.maya_tp.glm_prefill"
kind      = "runtime"
summary   = "the glm5-next batched prompt path (glm_prefill.cu, 5,273 lines) with its FP16 weight types (glm_prefill_types.hpp)"
why       = "GLM prompt processing in chunks; under TP2 both ranks agree on chunk sizes that fit the transport's receive window"
notes     = "Interface tag: executor.glm5-next-prefill/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["src/core/glm_prefill.cu", "src/core/glm_prefill_types.hpp"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
