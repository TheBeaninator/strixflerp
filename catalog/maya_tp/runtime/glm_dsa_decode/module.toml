id        = "runtime.maya_tp.glm_dsa_decode"
kind      = "runtime"
summary   = "the glm-dsa (GLM-5.3 DSA) decode side: the fast binder and arena (glm_dsa_fast, glm_dsa_fast_plan), the per-part decode graph cache, the decode attention mixer (glm_dsa_mixer and its no-GPU stub), the geometry reader and validation (glm_dsa_geometry, glm_geometry_check), the layer split rules (glm_dsa_split), the host halves of the guards and the seam-dump policy"
why       = "GLM-5.3 with DeepSeek sparse attention as Maya ported it; the binder / geometry split is how an engine accepts several GLM variants from one pack reader"
notes     = "Interface tag: executor.glm-dsa-decode/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

