id        = "runtime.maya_tp.glm_dsa_prompt"
kind      = "runtime"
summary   = "the glm-dsa prompt side: the prompt layer (glm_prefill_dsa), the batched prompt plan (glm_dsa_prompt_plan), the prompt's host share on a node-split layer and the expert streaming driver over PCIe links with its pure plan (glm_dsa_prefill_share, glm_dsa_prefill_stream, glm_dsa_prefill_stream_plan)"
why       = "prompt processing for DSA GLM with experts streamed while computing; the stream plan is a reusable overlap scheduler"
notes     = "Interface tag: executor.glm-dsa-prefill/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "src/core/glm_dsa_prefill_share.cpp",
  "src/core/glm_dsa_prefill_stream.cpp",
  "src/core/glm_dsa_prefill_stream.hpp",
  "src/core/glm_dsa_prefill_stream_plan.cpp",
  "src/core/glm_dsa_prompt_plan.cpp",
  "src/core/glm_prefill_dsa.cu",
  "src/core/glm_prefill_dsa.hpp",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
