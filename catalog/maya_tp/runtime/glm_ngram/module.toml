id        = "runtime.maya_tp.glm_ngram"
kind      = "runtime"
summary   = "the n-gram draft matcher and its decode_spec session (glm_ngram_draft) and head-group pricing with acceptance accounting (glm_dsa_spec)"
why       = "free drafts from the context itself; the pricing / acceptance accounting decides when speculation pays"
notes     = "Interface tag: speculation.draft-ngram/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "include/strata/core/glm_dsa_spec.hpp",
  "include/strata/core/glm_ngram_draft.hpp",
  "src/core/glm_dsa_spec.cpp",
  "src/core/glm_ngram_draft.cpp",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/include", "src/src/core"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "speculation.draft-ngram/-/-"
api       = "glm_ngram_draft.hpp, glm_dsa_spec.hpp"
numeric   = "integer matching"
regime    = "decode"

[[requires]]
module    = "runtime.maya_tp.core_headers"

[[requires]]
module    = "runtime.maya_tp.glm_dflash"

[[requires]]
module    = "runtime.maya_tp.glm_fast_path"

[[requires]]
module    = "runtime.maya_tp.glm_model"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone."
