id        = "runtime.maya_tp.ds4_tp_loader"
kind      = "runtime"
summary   = "TP2 delta: DeepSeek TP2's rank-local weight loading (ds4_tp_partition, ds4_tp_pack, ds4_tp_dense_loader, ds4_tp_rank_loader, ds4_tp_upload.cuh, ds4_tp_expert_pool.cuh): the partition of every tensor by output rows or input blocks, the pack description, the dense loader that owns one split matrix, the rank loader and the HIP upload of block-aligned GGUF expert slices into a bounded expert pool"
why       = "each rank loads only its share from the GGUF, which is what lets two 128 GB hosts hold a model neither holds alone; the loader rules carry to any strixflerp TP2 loader"
notes     = "Interface tag: format.loader-tp2-slices/-/-. Part of the TP2 delta over Project Maya (data/maya_tp/base-diff.tsv rows A). Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "src/ds4/ds4_tp_dense_loader.hpp",
  "src/ds4/ds4_tp_expert_pool.cuh",
  "src/ds4/ds4_tp_pack.hpp",
  "src/ds4/ds4_tp_partition.hpp",
  "src/ds4/ds4_tp_rank_loader.hpp",
  "src/ds4/ds4_tp_upload.cuh",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/src/ds4"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.loader-tp2-slices/-/-"
api       = "strata::ds4::tp2::RankDenseLoader, RankLoader, partition helpers, upload / expert pool"
numeric   = "byte spans, block-aligned"
regime    = "two ranks"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; compiled inside the modules that include it"
