id        = "runtime.maya_tp.glm_fast_path"
kind      = "runtime"
summary   = "the glm5-next FAST decode path (glm_fast_path.cu, 8,758 lines, with glm_fast_state.hpp, the opt-in layer graph capture glm_layer_graphs.hpp and the per-request decode knobs glm_req_knobs.cpp): per-layer captured graphs, the fast binder's weights and the decode loop that calls the TP2 all-reduce"
why       = "the hot loop of GLM-5.3-Flash decode, including where Maya-TP hooks the queued exchange; the reference for wiring a device-stage collective into a graph-captured decode"
notes     = "Interface tag: executor.glm5-next-fast-decode/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

