id        = "runtime.maya_tp.glm_dflash"
kind      = "runtime"
summary   = "the DFlash2 block drafter and its decode on the GLM trunk (glm_dflash.cu, 2,075 lines) with the adaptive draft-length policy (glm_draft_adaptive.hpp)"
why       = "a block-diffusion style drafter for GLM beside MTP; a second speculative path with its own acceptance policy"
notes     = "Interface tag: speculation.draft-dflash/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. The DFlash2 draft weights are not part of the tree. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "include/strata/core/glm_dflash.hpp",
  "include/strata/core/glm_draft_adaptive.hpp",
  "src/core/glm_dflash.cu",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/include", "src/src/core"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "speculation.draft-dflash/-/-"
api       = "GlmDflash (glm_dflash.hpp)"
numeric   = "per-kernel numerics"
regime    = "block drafts"

[[requires]]
module    = "format.maya_tp.gguf_reader"

[[requires]]
module    = "kernel.maya_tp.common"

[[requires]]
module    = "kernel.maya_tp.gguf_gemv"

[[requires]]
module    = "kernel.maya_tp.glm_fast"

[[requires]]
module    = "runtime.maya_tp.glm_fast_path"

[[requires]]
module    = "runtime.maya_tp.glm_model"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. The DFlash2 draft weights are not part of the tree."
