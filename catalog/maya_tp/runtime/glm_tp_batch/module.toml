id        = "runtime.maya_tp.glm_tp_batch"
kind      = "runtime"
summary   = "TP2 delta: GLM's TP2 application frames (include/strata/core/glm_tp_batch.hpp): versioned multi-slot batch plans and commits (up to 4 slots, 64 rows) that rank 0 sends rank 1 over the control channel, with limits, members, generations and positions"
why       = "multi-conversation serving over the pair needs both ranks to step the same slots in the same order; this is the scheduler frame that keeps them aligned"
notes     = "Interface tag: sched.tp2-batch-frames-glm/-/-. Part of the TP2 delta over Project Maya (data/maya_tp/base-diff.tsv rows A). Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = ["include/strata/core/glm_tp_batch.hpp"]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "sched.tp2-batch-frames-glm/-/-"
api       = "strata::core::glm_tp encode / decode of Plan and Commit"
numeric   = "integer frames"
regime    = "up to 4 slots, 64 rows"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; compiled inside the modules that include it"
