id        = "runtime.maya_tp.spec_controller"
kind      = "runtime"
summary   = "speculative-decoding control: the controller, the draft-length policy with its cost model and the suffix drafter (src/spec), plus the n-gram matcher kernel host code (src/kernels/ngram.cpp)"
why       = "draft-length choice is where MTP gains are won or lost (seven drafts cost 38.6% on the technical prompt); a policy module strixflerp's speculation family can take whole"
notes     = "Interface tag: speculation.policy/-/-. Not compiled alone: host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "include/strata/kernels/ngram.hpp",
  "include/strata/spec/controller.hpp",
  "include/strata/spec/draft_policy.hpp",
  "include/strata/spec/suffix_drafter.hpp",
  "src/kernels/ngram.cpp",
  "src/spec/controller.cpp",
  "src/spec/draft_policy.cpp",
  "src/spec/suffix_drafter.cpp",
]
authors   = [
  "Maya-TP contributors (uv-genai)",
  "Peasant Smith and the Project Maya contributors",
  "Niko1221 and the Strata contributors",
]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "speculation.policy/-/-"
api       = "strata::spec::Controller, DraftPolicy, SuffixDrafter (include/strata/spec/)"
numeric   = "cost model in tokens / s"
regime    = "any drafter"

[[requires]]
module    = "format.maya_tp.gguf_reader"

[[requires]]
module    = "format.maya_tp.ple_reader"

[[requires]]
module    = "kernel.maya_tp.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host engine code; the origin builds it only inside its CMake engine targets (strata_engine, maya-glm, maya-ds4, maya-mm3), so it is harvested, not compiled alone."
