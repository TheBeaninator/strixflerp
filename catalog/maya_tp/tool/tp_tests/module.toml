id        = "tool.maya_tp.tp_tests"
kind      = "tool"
summary   = "TP2 delta: the TP unit and pair tests: tests/tp_*.cpp (collective, RDMA communicator, context, control-socket state, partition, slice), tests/ds4_tp_*.cpp / .cu / .py (channel, control, batch, chunk, identity, loaders, workers, sharded DSpark / rollback / sample, pair smoke), tests/glm_tp*, the down-column band test, the server's TP2 boundary and peer-loss tests and tools/test_tp*.py / tools/test_*tp2*.py with the TP calibration script"
why       = "tests are the executable spec of the TP2 protocol and partition rules; they port with the modules they test"
notes     = "Interface tag: verify.tp2-unit-tests/-/-. Part of the TP2 delta over Project Maya (data/maya_tp/base-diff.tsv rows A). Nothing was run or timed on the pod."

