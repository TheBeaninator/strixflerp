[build]
lang      = "hip-c++"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "verify.kernel-parity-maya-tp/-/-"
api       = "the parity programs' main()"
numeric   = "per-family tolerances"
regime    = "one GPU"

