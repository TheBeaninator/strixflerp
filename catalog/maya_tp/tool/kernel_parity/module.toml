id        = "tool.maya_tp.kernel_parity"
kind      = "tool"
summary   = "the kernel parity programs and tests (src/kernels/*_parity.cpp, *_test.cpp, qsa_select_bench.cpp and the oracle vectors .inc)"
why       = "each kernel family's parity program is its oracle; they are what a strixflerp parity gate would run against these modules"
notes     = "Interface tag: verify.kernel-parity-maya-tp/-/-. Nothing was run or timed on the pod."

[provenance]
origin    = "maya_tp"
repo      = "https://github.com/uv-genai/maya-tp"
commit    = "6951bd7efb3c76b088e663645f274431b22dd913"
branch    = "main (tp-v1.1.45, merge of PR #184)"
paths     = [
  "src/kernels/bf16_gemv_parity.cpp",
  "src/kernels/cvec_parity.cpp",
  "src/kernels/dequant_bf16_test.cpp",
  "src/kernels/dequant_s2_parity.cpp",
