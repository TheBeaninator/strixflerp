id        = "runtime.enginelab_usb4.stream_rx_latency"
kind      = "runtime"
summary   = "stream RX completion and latency: NAPI-style hybrid RX completion (0010), per-stream NAPI and IRQ steering (0011), spinning outside the device mutex with IRQ restore (0015), RX counters before posting (0023), a bounded spin_us parameter (0030), opt-in CPU latency QoS (0042) and opt-in contiguous DMA buffers (0045)"
why       = "the small-message latency side: 8.35 us round trip for 64 B with interrupts on (README); the decode exchange is many small messages a token"
notes     = "Interface tag: none (no catalogue interface is a USB4 stream device; the nearest are transport.verbs and the collective.* providers over RoCE / TCP). Stable patches 0010, 0011, 0015, 0023, 0030, 0042, 0045 of patches/series; apply the whole series in order to Linux 72d3fcf8. Nothing was applied, built or run against a kernel on the pod: there is no Linux 72d3fcf8 tree on the island and no USB4 link between pod nodes; the patch gate parses every patch (git apply --numstat) and checks the series files."

