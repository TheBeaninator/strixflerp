  "patches/0011-stream-per-stream-napi-and-irq-steering.patch",
  "patches/0015-stream-spin-outside-device-mutex-and-irq-restore.patch",
  "patches/0023-stream-rx-counters-before-posting.patch",
  "patches/0030-stream-spin-us-parameter-bounded.patch",
  "patches/0042-stream-opt-in-cpu-latency-qos.patch",
  "patches/0045-stream-opt-in-contiguous-dma-buffers.patch",
]
