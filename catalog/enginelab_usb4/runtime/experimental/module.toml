id        = "runtime.enginelab_usb4.experimental"
kind      = "runtime"
summary   = "the three experimental patches on top of the stable series (patches/experimental: 0049 host bounded RX poll window, 0050 host paced RX descriptor polls, 0051 host TX memory-path experiments) and their series file"
why       = "only 0051 was measured on hardware, in one window, and the stable module was restored afterwards (README): kept as the record of what was tried on the host RX / TX path"
notes     = "Interface tag: none. Must not be treated as hardware-qualified (README). Nothing was applied, built or run against a kernel on the pod: there is no Linux 72d3fcf8 tree on the island and no USB4 link between pod nodes; the patch gate parses every patch (git apply --numstat) and checks the series files."

[provenance]
origin    = "enginelab_usb4"
repo      = "https://github.com/hyukudan/strix-halo-usb4-driver"
commit    = "d5de947cb405d30db65f810c9248d825c1bcedc6"
branch    = "main"
paths     = [
  "patches/experimental/0049-host-bounded-rx-poll-window.patch",
  "patches/experimental/0050-host-paced-rx-descriptor-polls.patch",
  "patches/experimental/0051-host-tx-memory-path-experiments.patch",
  "patches/experimental/series",
]
authors   = ["hyukudan", "the Linux kernel authors (thunderbolt driver, Intel USB4STREAM; notices kept in the files)"]
modified  = false

[licence]
spdx      = "GPL-2.0-only"

[build]
lang      = "patch"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "transport.usb4-host-completion-experimental/-/-"
api       = "module parameters of the experimental host RX poll window, paced polls and TX memory paths"
numeric   = "bytes only"
regime    = "not hardware-qualified"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "Linux kernel patch, experimental: parsed by the patch gate only"
