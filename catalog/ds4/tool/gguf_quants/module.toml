id        = "tool.ds4.gguf_quants"
kind      = "tool"
summary   = "the GGUF quantization facade in C (float conversion, q4_1, q8_0, q2_K, q4_K, iq2_xxs; derived from GGML's MIT quantizers) and the DeepSeek V4 Flash / Pro HF to GGUF quantizer (FP8 / FP4 dequant, imatrix), with their Makefile"
why       = "how ds4's GGUFs are made"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["gguf-tools/Makefile", "gguf-tools/deepseek4-quantize.c", "gguf-tools/quants.c", "gguf-tools/quants.h"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.convert-ds4-quants/gguf/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
