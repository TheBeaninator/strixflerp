id        = "runtime.ds4.linux_memory"
kind      = "runtime"
summary   = "Linux available-memory accounting with CMA pages excluded (they back movable allocations, not pinned GPU pages)"
why       = "memory budgeting on unified-memory APUs"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_linux_memory.h"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "device.ds4-linux-memory/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
