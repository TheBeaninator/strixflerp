id        = "runtime.ds4.k53perf_gpu_api"
kind      = "runtime"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the gpu_api family against antirez/ds4 b3f5018: ds4_gpu.h changed (+62 -353 lines). The family: the backend ABI: ds4_gpu.h (tensor-resident GPU executor API: opaque device tensors and every op the graph issues), ds4_gpu_copy.h (device copy spans) and ds4_gpu_mgpu.h (multi-GPU types and tensor APIs)"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: the contract every backend (Metal, CUDA, ROCm) implements; what an adapter to strixflerp kernels would target"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "f46631e483e19d13f23d3c4bced7ade0d086a3ad"
branch    = "perf/rocm-gfx1151-glm53-performance"
paths     = ["overlay/kyuz0_glm53_perf/ds4_gpu.h"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src/overlay/kyuz0_glm53_perf"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.ds4-gpu-api-ds4-k53perf/-/-"
api       = "ds4_gpu_*"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "kernel.ds4.dsv41"

[[requires]]
module    = "runtime.ds4.glmtp_gpu_tp"

[[requires]]
module    = "runtime.ds4.qwen4_vision"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
