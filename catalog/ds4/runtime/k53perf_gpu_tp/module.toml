id        = "runtime.ds4.k53perf_gpu_tp"
kind      = "runtime"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the gpu_tp family against antirez/ds4 b3f5018: ds4_gpu_tp.h changed (+19 -7 lines). The family: the TP gate interface between the graph and a backend: gate sequences both ranks must issue, the optional pinned slab shared by an integrated GPU and the transport, arrival / release ordering"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: how a backend joins the TP exchange without knowing the transport"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

