id        = "runtime.ds4.k53perf_engine"
kind      = "runtime"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the engine family against antirez/ds4 b3f5018: ds4.c changed (+3962 -5764 lines); ds4.h changed (+5 -21 lines). The family: ds4.c and ds4.h, the engine: mmap GGUF loading, the fixed DeepSeek V4 / V4.1 / Pro, GLM-5.2 / 5.3 / 5.3-Flash and Qwen3.8-Flash-Next layouts and their graph drivers, CPU reference kernels, sessions (one mutable inference timeline owning KV and logits; ds4_session_sync reuses, extends or rebuilds), MTP and DSpark speculation control, the TP and distributed hooks, tokenizer wiring"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: the whole host side of the engine in one deliberately vertical file; every backend and transport module plugs into it"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "f46631e483e19d13f23d3c4bced7ade0d086a3ad"
branch    = "perf/rocm-gfx1151-glm53-performance"
paths     = ["overlay/kyuz0_glm53_perf/ds4.c", "overlay/kyuz0_glm53_perf/ds4.h"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src/overlay/kyuz0_glm53_perf"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.model-ds4-k53perf/gguf/-"
api       = "ds4_engine_*, ds4_session_* (ds4.h)"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "runtime.ds4.distributed"

[[requires]]
module    = "runtime.ds4.engram"

[[requires]]
module    = "runtime.ds4.glmtp_gpu_api"

[[requires]]
module    = "runtime.ds4.glmtp_tp"

[[requires]]
module    = "runtime.ds4.gpu_api"

[[requires]]
module    = "runtime.ds4.image"

[[requires]]
module    = "runtime.ds4.layer_pack"

[[requires]]
module    = "runtime.ds4.linux_memory"

[[requires]]
module    = "runtime.ds4.qwen4_unicode"

[[requires]]
module    = "runtime.ds4.ssd"

[[requires]]
module    = "runtime.ds4.streaming_hotlist"

[[requires]]
module    = "serve.ds4.server"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
