branch    = "glm-tp-rocm"
paths     = ["overlay/glm_tp_rocm/ds4_deepseek41_dspark.h"]
authors   = ["davidcanar", "The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
