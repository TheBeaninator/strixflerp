id        = "runtime.ds4.glmtp_dspark"
kind      = "runtime"
summary   = "davidcanar/ds4 glm-tp-rocm 8ebf672 (antirez/ds4 PR #1024, stacked on #813, #835 and #1018): its copy of the dspark family against antirez/ds4 b3f5018: ds4_deepseek41_dspark.h changed (+1 -1 lines). The family: the internal DeepSeek V4.1 drafter graph (DSpark): a 128-token draft window, five draft rows and verify rows, Markov and confidence heads, verify / rewind state; included after the target graph in ds4.c"
why       = "GLM-5.3-Flash tensor parallel across two ROCm machines: the KDA heads split between the ranks, the routed experts split 50/50, and the TP slab in host-mapped pinned memory that GPU kernels and the CPU transport thread share on Strix Halo (rocm/ds4_rocm_tp.cuh); the branch head is \"GLM TP: keep the transport slab unified on ROCm builds\". The family in the base: ds4's speculative decoding for V4.1; spec-decode is its own module"
notes     = "Overlay glm_tp_rocm: files under overlay/glm_tp_rocm/ are the branch's bytes at 8ebf67295a4f; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/glm_tp_rocm.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/davidcanar/ds4"
