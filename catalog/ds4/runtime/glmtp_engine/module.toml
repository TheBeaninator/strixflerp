id        = "runtime.ds4.glmtp_engine"
kind      = "runtime"
summary   = "davidcanar/ds4 glm-tp-rocm 8ebf672 (antirez/ds4 PR #1024, stacked on #813, #835 and #1018): its copy of the engine family against antirez/ds4 b3f5018: ds4.c changed (+2816 -2920 lines); ds4.h changed (+104 -0 lines). The family: ds4.c and ds4.h, the engine: mmap GGUF loading, the fixed DeepSeek V4 / V4.1 / Pro, GLM-5.2 / 5.3 / 5.3-Flash and Qwen3.8-Flash-Next layouts and their graph drivers, CPU reference kernels, sessions (one mutable inference timeline owning KV and logits; ds4_session_sync reuses, extends or rebuilds), MTP and DSpark speculation control, the TP and distributed hooks, tokenizer wiring"
why       = "GLM-5.3-Flash tensor parallel across two ROCm machines: the KDA heads split between the ranks, the routed experts split 50/50, and the TP slab in host-mapped pinned memory that GPU kernels and the CPU transport thread share on Strix Halo (rocm/ds4_rocm_tp.cuh); the branch head is \"GLM TP: keep the transport slab unified on ROCm builds\". The family in the base: the whole host side of the engine in one deliberately vertical file; every backend and transport module plugs into it"
notes     = "The GLM TP graph changes in ds4.c: which heads and experts each rank owns and where the gates go. Overlay glm_tp_rocm: files under overlay/glm_tp_rocm/ are the branch's bytes at 8ebf67295a4f; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/glm_tp_rocm.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/davidcanar/ds4"
commit    = "8ebf67295a4f4663c326aa415145a35175e02b84"
branch    = "glm-tp-rocm"
paths     = ["overlay/glm_tp_rocm/ds4.c", "overlay/glm_tp_rocm/ds4.h"]
authors   = ["davidcanar", "The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src/overlay/glm_tp_rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.model-ds4-glmtp/gguf/-"
api       = "ds4_engine_*, ds4_session_* (ds4.h)"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "runtime.ds4.distributed"

[[requires]]
module    = "runtime.ds4.dspark"

[[requires]]
module    = "runtime.ds4.engram"

[[requires]]
module    = "runtime.ds4.glmtp_gpu_api"

[[requires]]
module    = "runtime.ds4.glmtp_tp"

[[requires]]
module    = "runtime.ds4.gpu_api"

[[requires]]
module    = "runtime.ds4.image"

[[requires]]
module    = "runtime.ds4.layer_pack"

[[requires]]
module    = "runtime.ds4.linux_memory"

[[requires]]
module    = "runtime.ds4.qwen4_unicode"

[[requires]]
module    = "runtime.ds4.ssd"

[[requires]]
module    = "runtime.ds4.streaming_hotlist"

[[requires]]
module    = "serve.ds4.server"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
