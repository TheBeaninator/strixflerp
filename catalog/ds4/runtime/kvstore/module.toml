id        = "runtime.ds4.kvstore"
kind      = "runtime"
summary   = "disk KV checkpoint files: the shared layout and payload helpers under the server's byte-prefix cache and the agent's sessions, with a graph-payload ABI byte"
why       = "durable KV for long sessions"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_kvstore.c", "ds4_kvstore.h"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "cache.ds4-kv-disk/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "runtime.ds4.engine"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
