id        = "runtime.ds4.kmultinode_gpu_api"
kind      = "runtime"
summary   = "kyuz0/ds4 rocm-multi-node 89c1ea9 (head commit by antirez, \"Fix ROCm MTP startup residency\"): its copy of the gpu_api family against antirez/ds4 b3f5018: ds4_gpu.h changed (+41 -2932 lines). The family: the backend ABI: ds4_gpu.h (tensor-resident GPU executor API: opaque device tensors and every op the graph issues), ds4_gpu_copy.h (device copy spans) and ds4_gpu_mgpu.h (multi-GPU types and tensor APIs)"
why       = "an early ROCm multi-node line of ds4, five months older than the base: the ROCm backend before it grew V4.1, GLM-5.3 and Qwen kernels, with the pipeline-parallel distributed runtime; kept as the record of where the ROCm multi-node work started. The family in the base: the contract every backend (Metal, CUDA, ROCm) implements; what an adapter to strixflerp kernels would target"
notes     = "Overlay kyuz0_rocm_multi_node: files under overlay/kyuz0_rocm_multi_node/ are the branch's bytes at 89c1ea982df2; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_rocm_multi_node.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "89c1ea982df20b7578f95bb10d894f5447146fc3"
branch    = "rocm-multi-node"
paths     = ["overlay/kyuz0_rocm_multi_node/ds4_gpu.h"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src/overlay/kyuz0_rocm_multi_node"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.ds4-gpu-api-ds4-kmultinode/-/-"
api       = "ds4_gpu_*"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
