id        = "serve.ds4.server"
kind      = "serve"
summary   = "ds4-server: OpenAI / Anthropic-compatible local HTTP server; per-connection threads queue jobs to resident session workers, a model coordinator batches decode-ready sessions and serializes bounded prefill quanta; tool-text escaping (ds4_tool_text.h)"
why       = "a micro-batching serve front end over one engine"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_server.c", "ds4_tool_text.h"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "serve.engine-ds4/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "runtime.ds4.distributed"

[[requires]]
module    = "runtime.ds4.engine"

[[requires]]
module    = "runtime.ds4.glmtp_tp"

[[requires]]
module    = "runtime.ds4.gpu_args"

[[requires]]
module    = "runtime.ds4.kvstore"

[[requires]]
module    = "runtime.ds4.rax"

[[requires]]
module    = "tool.ds4.help"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "host C99 / C11 built by the origin Makefile with cc; the compile gate builds hip-c++ modules only"
