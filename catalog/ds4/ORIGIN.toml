[[overlay]]
slug      = "kyuz0_glm53_perf"
prefix    = "k53perf"                    # module names <kind>.ds4.<prefix>_<family>
repo      = "https://github.com/kyuz0/ds4"
branch    = "perf/rocm-gfx1151-glm53-performance"
commit    = "f46631e483e19d13f23d3c4bced7ade0d086a3ad"
date      = "2026-09-25"
reference_checkout = "control-node:/data/ark-inbox/src/github.com__kyuz0__ds4#perf__rocm-gfx1151-glm53-performance"
base_diff = "docs/harvest/data/ds4/kyuz0_glm53_perf.tsv"   # 111 added, 114 changed, 66 base files absent, against b3f50180ec2c
what      = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\""
[[overlay]]
slug      = "kyuz0_rocm_multi_node"
