id        = "kernel.ds4.dsv4_vision"
kind      = "kernel"
summary   = "DeepSeek V4 Flash Vision-Exp operations shared by CUDA and ROCm: residual add, aligner reorder, GELU bias, QKV RoPE, BF16 rounding, SwiGLU split"
why       = "the DSV4 vision tower on the GPU"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_deepseek4_vision_gpu.cuh"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "vision.ds4v-ops/bf16/f32.ds4"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.rocm_backend"
