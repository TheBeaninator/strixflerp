id        = "kernel.ds4.mmq_quantize"
kind      = "kernel"
summary   = "llama.cpp's activation quantizers for MMQ: q8_1, MMQ q8_1 / MXFP4 / NVFP4 tiles"
why       = "the src1 conversion every MMQ product needs"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["cuda/mmq/quantize.cu", "cuda/mmq/quantize.cuh"]
authors   = ["The ds4.c authors", "DeepSeek", "The ggml authors (llama.cpp 5c0e9468, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/cuda/mmq/quantize.cu"]
includes  = ["src", "src/cuda/mmq"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "-x",
  "hip",
  "-O3",
  "-ffast-math",
  "-fno-finite-math-only",
  "-pthread",
  "-D__HIP_PLATFORM_AMD__",
  "-Wno-unused-command-line-argument",
  "-std=c++17",
  "-DGGML_USE_HIP",
  "-DDS4_HIP_MMQ_Y=64",
  "-c",
]

[[provides]]
interface = "quant.activation/-/q8_1+mxfp4+nvfp4.ds4-mmq"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "kernel.ds4.mmq_common"

[[requires]]
module    = "kernel.ds4.mmq_ggml_stubs"

[[requires]]
module    = "kernel.ds4.mmq_mmid"

[[requires]]
module    = "kernel.ds4.mmq_mmvq"

[[requires]]
module    = "kernel.ds4.mmq_moe"

[[requires]]
module    = "kernel.ds4.mmq_d2r"

[[requires]]
module    = "kernel.ds4.mmq_repack"

[[requires]]
module    = "runtime.ds4.linux_memory"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.ds4.mmq_quantize.json"
