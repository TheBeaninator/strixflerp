id        = "kernel.ds4.k53prefill_rocm_unavailable"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the rocm_unavailable family against antirez/ds4 b3f5018: ds4_rocm_unavailable.cu changed (+0 -3 lines). The family: C-linkage stubs for the CUDA-only fused and multi-device hooks that the shared graph code references but ROCm validation never selects"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: keeps the ROCm link closed without #ifdefs in ds4.c; the list of what ROCm lacks against CUDA"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "4fef372a46315bd6b34b0e58b7fc91a7e5f4f21f"
branch    = "perf/rocm-gfx1151-glm53-flash-prefill-restoration"
paths     = ["overlay/kyuz0_glm53_prefill/ds4_rocm_unavailable.cu"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
