id        = "kernel.ds4.k53prefill_mmq_ggml_stubs"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the mmq_ggml_stubs family against antirez/ds4 b3f5018: cuda/mmq/ds4_ggml_stubs.cu changed (+4 -65 lines). The family: the minimum ggml API surface (declarations and a few definitions) that the vendored MMQ code references, so it links without the ggml runtime, and ds4_rocm_memory.h, the ROCm device-memory policy (an arena for small tensors, dedicated spans for large ones) that the stubs back ggml's pool with and ds4_rocm_compat.cu allocates through; the header sits in this module because ds4_ggml_stubs.cu reaches it as ../../ds4_rocm_memory.h, and a relative include resolves only inside one module"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: how ds4 lifts llama.cpp kernels out of ggml"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

