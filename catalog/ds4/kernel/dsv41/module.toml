id        = "kernel.ds4.dsv41"
kind      = "kernel"
summary   = "DeepSeek V4.1-specific GPU operations shared by CUDA and ROCm (included after the shared kernels): BF16, candidates, carry, causal and index scores, engram, gather, indexer, pool, quantize, RoPE and the shared-expert gate / up / down / mask / owner kernels; ds4_deepseek41_gpu.h declares them"
why       = "the V4.1 graph's ops in one place for both GPU backends"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_deepseek41_cuda.cuh", "ds4_deepseek41_gpu.h"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.ds4-dsv41/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.rocm_backend"
