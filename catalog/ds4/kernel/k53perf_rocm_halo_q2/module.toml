id        = "kernel.ds4.k53perf_rocm_halo_q2"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the rocm_halo_q2 family against antirez/ds4 b3f5018: rocm/ds4_rocm_halo_q2.cuh added (6 lines); rocm/ds4_rocm_halo_q2.h added (7 lines); rocm/halo/q2/decode.hpp added (56 lines); rocm/halo/q2/direct.hpp added (156 lines); rocm/halo/q2/direct_feed.hpp added (17 lines); rocm/halo/q2/prepared.hip added (23 lines); rocm/halo/q2/prepared/common.hpp added (90 lines); rocm/halo/q2/prepared/fragment.hpp added (413 lines); rocm/halo/q2/prepared/kernel.hpp added (744 lines); rocm/halo/q2/prepared/kernel_fixed_shape.hpp added (755 lines); rocm/halo/q2/prepared/kernel_lds_scope.hpp added (634 lines); rocm/halo/q2/prepared/load.hpp added (793 lines); rocm/halo/q2/prepared/mapping.hpp added (328 lines); rocm/halo/q2/prepared/wmma.hpp added (94 lines); rocm/halo/q2/runtime.hip added (69 lines); rocm/halo/q2/wstage64.hpp added (167 lines). Kernels not in the base: __launch_bounds__, halo_q2_gather, halo_q2_prepare, halo_q2_prepared_store_kernel, q2_direct_x_n2_kernel, q2_wstage64_n2_kernel. The family: the Halo Q2 panels: direct and 64-wide staged WMMA kernels, a prepared-weight GEMM on Adel Johar's MIT GEMM template, and the runtime that gathers and prepares Q2 weights"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: a gfx1151 Q2 prefill GEMM with a native K8 correction kept"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

