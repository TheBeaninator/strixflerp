id        = "kernel.ds4.rocm_hc"
kind      = "kernel"
summary   = "the hyper-connection (HC) kernels: split Sinkhorn, weighted sums (fused with norm), and the 4-stream expand / expand-add in F32 and half; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "DSV4's 4-stream residual runs these every sublayer; the catalogue's hc.mix providers are the comparison set"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["rocm/ds4_rocm_hc.cuh"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src", "src/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "hc.mix/-/f32.ds4"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.rocm_backend"
