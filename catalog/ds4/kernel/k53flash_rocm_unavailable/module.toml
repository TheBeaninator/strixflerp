id        = "kernel.ds4.k53flash_rocm_unavailable"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash 4bdbcc2: its copy of the rocm_unavailable family against antirez/ds4 b3f5018: ds4_rocm_unavailable.cu changed (+0 -3 lines). The family: C-linkage stubs for the CUDA-only fused and multi-device hooks that the shared graph code references but ROCm validation never selects"
why       = "kyuz0's gfx1151 GLM-5.3-Flash decode branch: on-the-fly WMMA Q8_0 batch GEMMs and partial HC expand (ds4_rocm_q8.cuh), the GLM dense-compact causal attention and row-wise Q8 projections (ds4_rocm_glm.cuh) and a stand-alone selected multi-head attention kernel (rocm/ds4_rocm_glm_selected_multihead.cu); the tree is a fork from before the base's V4.1 and Qwen work, so its base-diff also shows files the base changed later. The family in the base: keeps the ROCm link closed without #ifdefs in ds4.c; the list of what ROCm lacks against CUDA"
notes     = "Overlay kyuz0_glm53_flash: files under overlay/kyuz0_glm53_flash/ are the branch's bytes at 4bdbcc206828; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_flash.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

