id        = "kernel.ds4.k53prefill_rocm_glm"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the rocm_glm family against antirez/ds4 b3f5018: rocm/ds4_rocm_glm.cuh changed (+414 -132 lines). Kernels not in the base: glm_dense_compact_causal_softmax_f16_kernel, glm_dense_compact_pack_q_f16_kernel, glm_dense_compact_unpack_f32_kernel, glm_q8_project_rows_kernel. The family: the GLM-5.x ROCm kernels, mirroring the Metal GLM graph entry points: KDA decode and the three-stage KDA prefill (prepare, recurrence, output), BF16 embedding and matvecs, Q4_K x Q8_K matmul, GLM attention (full, indexed split decode with reduce, LoRA-indexed), KV-cache build and compact-KV QKV norm, the indexer (scores, RoPE tail, pool update) and the causal / selected GEMM attention path (gather, RoPE to F16, softmax, scatter); a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: the GLM-5.3 and GLM-5.3-Flash graph on gfx1151, KDA included; the base of every GLM overlay in this origin"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "4fef372a46315bd6b34b0e58b7fc91a7e5f4f21f"
branch    = "perf/rocm-gfx1151-glm53-flash-prefill-restoration"
paths     = ["overlay/kyuz0_glm53_prefill/rocm/ds4_rocm_glm.cuh"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/kyuz0_glm53_prefill", "src/overlay/kyuz0_glm53_prefill/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "mixer.kda/-/f32.ds4-glm-k53prefill"
api       = "see summary"
numeric   = "F32 state; BF16 / Q8_0 / Q4_K weights"
regime    = "prefill and decode"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.k53prefill_rocm_backend"
