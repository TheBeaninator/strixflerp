id        = "kernel.ds4.kmultinode_rocm_backend"
kind      = "kernel"
summary   = "kyuz0/ds4 rocm-multi-node 89c1ea9 (head commit by antirez, \"Fix ROCm MTP startup residency\"): its copy of the rocm_backend family against antirez/ds4 b3f5018: ds4_rocm.cu changed (+2 -134 lines); ds4_rocm.h changed (+5 -11 lines). The family: ds4's ROCm backend translation unit: ds4_rocm.cu sets the HIP spellings (64-bit warp masks, hipBLASLt / rocBLAS names) and #includes every rocm/*.cuh module plus the shared V4.1, GLM-5.3 vision and V4 vision kernels in a fixed order into one object; ds4_rocm.h declares the ROCm-only entry points and ds4_iq2_tables_cuda.inc holds the IQ2_XXS grids"
why       = "an early ROCm multi-node line of ds4, five months older than the base: the ROCm backend before it grew V4.1, GLM-5.3 and Qwen kernels, with the pipeline-parallel distributed runtime; kept as the record of where the ROCm multi-node work started. The family in the base: the one place where the ROCm kernel modules become a backend: the ds4_gpu.h API (tensor-resident, device-owned activations and KV across a whole prefill / decode command sequence) is implemented here for gfx1151"
notes     = "Overlay kyuz0_rocm_multi_node: files under overlay/kyuz0_rocm_multi_node/ are the branch's bytes at 89c1ea982df2; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_rocm_multi_node.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "89c1ea982df20b7578f95bb10d894f5447146fc3"
branch    = "rocm-multi-node"
paths     = ["overlay/kyuz0_rocm_multi_node/ds4_rocm.cu", "overlay/kyuz0_rocm_multi_node/ds4_rocm.h"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/overlay/kyuz0_rocm_multi_node/ds4_rocm.cu"]
includes  = ["src/overlay/kyuz0_rocm_multi_node"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.ds4-rocm-backend-ds4-kmultinode/-/-"
api       = "ds4_gpu_* (ds4_gpu.h), ds4_rocm_* (ds4_rocm.h)"
numeric   = "as the origin builds it"
regime    = "Strix Halo gfx1151; eager default-stream execution (no graph capture on ROCm)"

