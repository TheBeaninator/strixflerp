id        = "kernel.ds4.cuda_backend"
kind      = "kernel"
summary   = "ds4's CUDA backend (one translation unit, about 36,000 lines): the ds4_gpu API on CUDA with multi-GPU, graph capture, DSpark and the shared model kernels"
why       = "the CUDA twin of rocm_backend; the ROCm modules were split out of its kernels and many ROCm headers still say \"included from ds4_cuda.cu\""
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_cuda.cu"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "cuda"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.ds4-cuda-backend/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source (nvcc in the origin Makefile); the compile gate builds hip-c++ modules only"
