id        = "kernel.ds4.k53perf_mmq_moe"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the mmq_moe family against antirez/ds4 b3f5018: cuda/mmq/ds4_mmq.cu changed (+113 -773 lines); cuda/mmq/ds4_mmq.h changed (+22 -0 lines); cuda/mmq/mmq.cuh changed (+270 -23 lines). Kernels not in the base: ds4_mmq_compact_mul_mat_q, ds4_mmq_compact_produce. The family: ds4's quantized-matmul C ABI over llama.cpp's mul_mat_q (mmq.cuh): dense Q8_0 / Q2_K / IQ2_XXS and MoE _id variants, the aligned-artifact MoE vec kernels (IQ2_XXS gate / up / mid with dedup, Q2_K, Q8_0 dense), the MXFP4 staged gate / up and the sum-6 down"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: llama.cpp's MMQ as a ds4 kernel library; the ROCm build uses it for the expert and dense quantized GEMMs"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "f46631e483e19d13f23d3c4bced7ade0d086a3ad"
branch    = "perf/rocm-gfx1151-glm53-performance"
paths     = [
  "overlay/kyuz0_glm53_perf/cuda/mmq/ds4_mmq.cu",
  "overlay/kyuz0_glm53_perf/cuda/mmq/ds4_mmq.h",
  "overlay/kyuz0_glm53_perf/cuda/mmq/mmq.cuh",
]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors", "The ggml authors (llama.cpp 5c0e9468, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/overlay/kyuz0_glm53_perf/cuda/mmq/ds4_mmq.cu"]
includes  = ["src/overlay/kyuz0_glm53_perf", "src/overlay/kyuz0_glm53_perf/cuda/mmq"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "-x",
  "hip",
  "-O3",
  "-ffast-math",
  "-fno-finite-math-only",
  "-pthread",
  "-D__HIP_PLATFORM_AMD__",
  "-Wno-unused-command-line-argument",
  "-std=c++20",
  "-std=c++17",
  "-DGGML_USE_HIP",
  "-DDS4_HIP_MMQ_Y=64",
  "-c",
]

[[provides]]
interface = "moe.experts-decode/iq2_xxs+q2_k+q8_0/q8_1-f32.ds4-mmq-k53perf"
api       = "see summary"
numeric   = "q8_1 activations, integer dots, F32 out"
regime    = "decode and prefill"

