id        = "kernel.ds4.k53prefill_rocm_q8"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the rocm_q8 family against antirez/ds4 b3f5018: rocm/ds4_rocm_q8.cuh changed (+449 -0 lines). Kernels not in the base: grouped_q8_0_a_f32_batch_wmma_onthefly_kernel, hc_expand_add_partial4_kernel, hc_expand_add_partial_kernel, hc_expand_partial16_kernel, hc_expand_partial_kernel, matmul_q8_0_f32_batch_wmma_onthefly_kernel, matmul_q8_0_f32_small_block_w32_kernel, matmul_q8_0_hc_partial16_w32_kernel, matmul_q8_0_hc_partial_w32_kernel, matmul_q8_0_kernel, shared_gate_up_swiglu_q8_0_pair_preq_warp8_kernel. The family: Q8_0 matmuls: dequant to F16 / F32, warp-8 and shared-x row kernels, pre-quantized activations, pairs, batch with token tiles and WMMA row tiles, grouped-output Q8 with partial sums, the HC-expand fused forms and the fused shared-expert gate / up SwiGLU; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: Q8_0 is the format of the dense projections in ds4's GGUFs, so this is most of the non-expert decode time"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "4fef372a46315bd6b34b0e58b7fc91a7e5f4f21f"
branch    = "perf/rocm-gfx1151-glm53-flash-prefill-restoration"
paths     = ["overlay/kyuz0_glm53_prefill/rocm/ds4_rocm_q8.cuh"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/kyuz0_glm53_prefill", "src/overlay/kyuz0_glm53_prefill/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/q8_0/f32.ds4-k53prefill"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.k53prefill_rocm_backend"
