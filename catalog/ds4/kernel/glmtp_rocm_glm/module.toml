id        = "kernel.ds4.glmtp_rocm_glm"
kind      = "kernel"
summary   = "davidcanar/ds4 glm-tp-rocm 8ebf672 (antirez/ds4 PR #1024, stacked on #813, #835 and #1018): its copy of the rocm_glm family against antirez/ds4 b3f5018: rocm/ds4_rocm_glm.cuh changed (+1094 -87 lines). Kernels not in the base: glm53_rocm_matvec_bf16_f32_kslice_kernel, glm53_rocm_matvec_bf16_row_multi_kernel, glm_attention_indexed_pv_kernel, glm_attention_indexed_pv_reduce_kernel, glm_attention_indexed_scores_kernel, glm_indexer_gemm_prep_kernel, glm_indexer_gemm_reduce_kernel, glm_indexer_score_one_legacy_kernel. The family: the GLM-5.x ROCm kernels, mirroring the Metal GLM graph entry points: KDA decode and the three-stage KDA prefill (prepare, recurrence, output), BF16 embedding and matvecs, Q4_K x Q8_K matmul, GLM attention (full, indexed split decode with reduce, LoRA-indexed), KV-cache build and compact-KV QKV norm, the indexer (scores, RoPE tail, pool update) and the causal / selected GEMM attention path (gather, RoPE to F16, softmax, scatter); a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "GLM-5.3-Flash tensor parallel across two ROCm machines: the KDA heads split between the ranks, the routed experts split 50/50, and the TP slab in host-mapped pinned memory that GPU kernels and the CPU transport thread share on Strix Halo (rocm/ds4_rocm_tp.cuh); the branch head is \"GLM TP: keep the transport slab unified on ROCm builds\". The family in the base: the GLM-5.3 and GLM-5.3-Flash graph on gfx1151, KDA included; the base of every GLM overlay in this origin"
notes     = "GLM kernels for the split: K-sliced and multi-row BF16 matvecs, indexed attention split into scores, PV and reduce, an indexer GEMM prep / reduce. Overlay glm_tp_rocm: files under overlay/glm_tp_rocm/ are the branch's bytes at 8ebf67295a4f; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/glm_tp_rocm.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/davidcanar/ds4"
commit    = "8ebf67295a4f4663c326aa415145a35175e02b84"
branch    = "glm-tp-rocm"
paths     = ["overlay/glm_tp_rocm/rocm/ds4_rocm_glm.cuh"]
authors   = ["davidcanar", "The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/glm_tp_rocm", "src/overlay/glm_tp_rocm/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "mixer.kda/-/f32.ds4-glm-glmtp"
api       = "see summary"
numeric   = "F32 state; BF16 / Q8_0 / Q4_K weights"
regime    = "prefill and decode"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.glmtp_rocm_backend"
