id        = "kernel.ds4.k53prefill_mmq_repack"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the mmq_repack family against antirez/ds4 b3f5018: cuda/mmq/ds4_repack.cu changed (+4 -38 lines); cuda/mmq/ds4_repack.h changed (+0 -7 lines). The family: the aligned structure-of-arrays repack library shared by the weight server and the engine's self-load: catalog walk, candidate predicates, parallel repack, FNV-1a artifact hash, IQ2_XXS / Q2_K / Q8_0 aligned builds"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: the weight layout the aligned MMQ kernels read; a shape for strixflerp's format.device-view ideas"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "4fef372a46315bd6b34b0e58b7fc91a7e5f4f21f"
branch    = "perf/rocm-gfx1151-glm53-flash-prefill-restoration"
paths     = [
  "overlay/kyuz0_glm53_prefill/cuda/mmq/ds4_repack.cu",
  "overlay/kyuz0_glm53_prefill/cuda/mmq/ds4_repack.h",
]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors", "The ggml authors (llama.cpp 5c0e9468, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/overlay/kyuz0_glm53_prefill/cuda/mmq/ds4_repack.cu"]
includes  = ["src/overlay/kyuz0_glm53_prefill", "src/overlay/kyuz0_glm53_prefill/cuda/mmq"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "-x",
  "hip",
  "-O3",
  "-ffast-math",
  "-fno-finite-math-only",
  "-pthread",
  "-D__HIP_PLATFORM_AMD__",
  "-Wno-unused-command-line-argument",
  "-std=c++17",
  "-DGGML_USE_HIP",
  "-DDS4_HIP_MMQ_Y=64",
  "-c",
]

[[provides]]
interface = "linear.row-layout-ds4-aligned-k53prefill/iq2_xxs+q2_k+q8_0/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "kernel.ds4.k53prefill_mmq_common"

[[requires]]
module    = "kernel.ds4.k53prefill_mmq_ggml_stubs"

[[requires]]
module    = "kernel.ds4.k53prefill_mmq_mmvq"

[[requires]]
module    = "kernel.ds4.k53prefill_mmq_moe"

[[requires]]
module    = "kernel.ds4.mmq_common"

[[requires]]
module    = "kernel.ds4.mmq_ggml_stubs"

[[requires]]
module    = "kernel.ds4.mmq_quantize"

[[requires]]
module    = "kernel.ds4.mmq_mmid"

[[requires]]
module    = "kernel.ds4.mmq_mmvq"

[[requires]]
module    = "kernel.ds4.mmq_moe"

[[requires]]
module    = "kernel.ds4.mmq_d2r"

[[requires]]
module    = "kernel.ds4.mmq_repack"

[[requires]]
