id        = "kernel.ds4.glmtp_rocm_moe"
kind      = "kernel"
summary   = "davidcanar/ds4 glm-tp-rocm 8ebf672 (antirez/ds4 PR #1024, stacked on #813, #835 and #1018): its copy of the rocm_moe family against antirez/ds4 b3f5018: rocm/ds4_rocm_moe.cuh changed (+290 -26 lines). Kernels not in the base: moe_gate_up_mid_decode_q4K_wave_kernel, moe_q4k_mmq_compact_kernel, moe_q4k_mmq_gather_x_kernel, moe_q4k_mmq_scatter_down_kernel. The family: the routed-MoE kernels: active-expert and tile building, gate / up / mid decode (LUT, MXFP4, Q4_K, IQ2) and down products in many tilings (expert tiles of 4 / 8 / 16 rows, quarter-warp, sum-6, hotlist WMMA for Q2_K); a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "GLM-5.3-Flash tensor parallel across two ROCm machines: the KDA heads split between the ranks, the routed experts split 50/50, and the TP slab in host-mapped pinned memory that GPU kernels and the CPU transport thread share on Strix Halo (rocm/ds4_rocm_tp.cuh); the branch head is \"GLM TP: keep the transport slab unified on ROCm builds\". The family in the base: the expert matvecs dominate decode for DSV4 and GLM; this is ds4's whole gfx1151 MoE kernel set"
notes     = "Overlay glm_tp_rocm: files under overlay/glm_tp_rocm/ are the branch's bytes at 8ebf67295a4f; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/glm_tp_rocm.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/davidcanar/ds4"
commit    = "8ebf67295a4f4663c326aa415145a35175e02b84"
branch    = "glm-tp-rocm"
paths     = ["overlay/glm_tp_rocm/rocm/ds4_rocm_moe.cuh"]
authors   = ["davidcanar", "The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/glm_tp_rocm", "src/overlay/glm_tp_rocm/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/iq2_xxs+q2_k+q4_k+mxfp4/f32.ds4-glmtp"
api       = "see summary"
numeric   = "quantized weights with F32 accumulation"
regime    = "decode and small batches"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.glmtp_rocm_backend"
