id        = "kernel.ds4.k53prefill_rocm_compat"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the rocm_compat family against antirez/ds4 b3f5018: ds4_rocm_compat.cu changed (+13 -6 lines). The family: the ROCm host shims compiled as their own object (ds4_rocm_compat.cu): device allocation through the ds4_rocm_memory.h arena (in kernel.ds4.mmq_ggml_stubs), the multi-GPU entry points of ds4_gpu_mgpu.h, and the decode-graph hooks that are CUDA-only (ROCm decodes eagerly)"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: how ds4 sizes and places device memory on a unified-memory APU, the part of a ROCm backend that is not kernels"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "4fef372a46315bd6b34b0e58b7fc91a7e5f4f21f"
branch    = "perf/rocm-gfx1151-glm53-flash-prefill-restoration"
paths     = ["overlay/kyuz0_glm53_prefill/ds4_rocm_compat.cu"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/overlay/kyuz0_glm53_prefill/ds4_rocm_compat.cu"]
includes  = ["src/overlay/kyuz0_glm53_prefill"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "device.ds4-rocm-memory-ds4-k53prefill/hip/-"
api       = "ds4_gpu_* memory and device hooks"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "kernel.ds4.k53prefill_mmq_ggml_stubs"

[[requires]]
module    = "runtime.ds4.k53prefill_gpu_api"

[[requires]]
module    = "kernel.ds4.mmq_ggml_stubs"

[[requires]]
module    = "runtime.ds4.gpu_api"

[[requires]]
module    = "runtime.ds4.gpu_tp"

[[requires]]
module    = "runtime.ds4.gpu_args"

[[requires]]
module    = "runtime.ds4.linux_memory"

[[requires]]
module    = "kernel.ds4.rocm_compat"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.ds4.k53prefill_rocm_compat.json"
