id        = "kernel.ds4.k53prefill_mmq_common"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the mmq_common family against antirez/ds4 b3f5018: cuda/mmq/VENDOR.md changed (+0 -8 lines); cuda/mmq/vendors/hip.h changed (+0 -1 lines). The family: the vendored llama.cpp ggml-cuda headers the MMQ kernels compile against (common.cuh, mma.cuh, vecdotq.cuh, unary.cuh, ggml-common.h, the HIP / MUSA / CUDA vendor maps) and the thin ggml.h / ggml-impl.h / ggml-cuda.h redirects; VENDOR.md records the upstream pin (llama.cpp 5c0e9468, 2026-05-14)"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: the base every mmq_* module needs; ROCm builds them with -DGGML_USE_HIP"
notes     = "Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "4fef372a46315bd6b34b0e58b7fc91a7e5f4f21f"
branch    = "perf/rocm-gfx1151-glm53-flash-prefill-restoration"
paths     = ["overlay/kyuz0_glm53_prefill/cuda/mmq/VENDOR.md", "overlay/kyuz0_glm53_prefill/cuda/mmq/vendors/hip.h"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors", "The ggml authors (llama.cpp 5c0e9468, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/kyuz0_glm53_prefill", "src/overlay/kyuz0_glm53_prefill/cuda/mmq"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.ds4-ggml-mmq-common-ds4-k53prefill/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.k53prefill_mmq_moe"
