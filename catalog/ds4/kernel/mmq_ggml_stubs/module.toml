id        = "kernel.ds4.mmq_ggml_stubs"
kind      = "kernel"
summary   = "the minimum ggml API surface (declarations and a few definitions) that the vendored MMQ code references, so it links without the ggml runtime, and ds4_rocm_memory.h, the ROCm device-memory policy (an arena for small tensors, dedicated spans for large ones) that the stubs back ggml's pool with and ds4_rocm_compat.cu allocates through; the header sits in this module because ds4_ggml_stubs.cu reaches it as ../../ds4_rocm_memory.h, and a relative include resolves only inside one module"
why       = "how ds4 lifts llama.cpp kernels out of ggml"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["cuda/mmq/ds4_ggml_stubs.cu", "cuda/mmq/ds4_ggml_stubs.h", "ds4_rocm_memory.h"]
authors   = ["The ds4.c authors", "DeepSeek", "The ggml authors (llama.cpp 5c0e9468, MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/cuda/mmq/ds4_ggml_stubs.cu"]
includes  = ["src", "src/cuda/mmq"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "-x",
  "hip",
  "-O3",
  "-ffast-math",
  "-fno-finite-math-only",
  "-pthread",
  "-D__HIP_PLATFORM_AMD__",
  "-Wno-unused-command-line-argument",
  "-std=c++17",
  "-DGGML_USE_HIP",
  "-DDS4_HIP_MMQ_Y=64",
  "-c",
]

[[provides]]
interface = "kernel-abi.ds4-ggml-stubs/-/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "kernel.ds4.mmq_common"

[[requires]]
module    = "kernel.ds4.mmq_quantize"

[[requires]]
module    = "kernel.ds4.mmq_mmid"

[[requires]]
module    = "kernel.ds4.mmq_mmvq"

[[requires]]
module    = "kernel.ds4.mmq_moe"

[[requires]]
module    = "kernel.ds4.mmq_d2r"

[[requires]]
module    = "kernel.ds4.mmq_repack"

[[requires]]
module    = "runtime.ds4.linux_memory"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.ds4.mmq_ggml_stubs.json"
