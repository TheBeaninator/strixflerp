id        = "kernel.ds4.glmtp_rocm_common"
kind      = "kernel"
summary   = "davidcanar/ds4 glm-tp-rocm 8ebf672 (antirez/ds4 PR #1024, stacked on #813, #835 and #1018): its copy of the rocm_common family against antirez/ds4 b3f5018: rocm/ds4_rocm_common.cuh changed (+12 -2 lines). The family: shared device helpers and the first kernels of the TU: token embedding into the HC streams (F16 and Q8_0), F16 / F32 dense matmuls with shared-x warp rows and ordered chunks, HC repeat and slot packing; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "GLM-5.3-Flash tensor parallel across two ROCm machines: the KDA heads split between the ranks, the routed experts split 50/50, and the TP slab in host-mapped pinned memory that GPU kernels and the CPU transport thread share on Strix Halo (rocm/ds4_rocm_tp.cuh); the branch head is \"GLM TP: keep the transport slab unified on ROCm builds\". The family in the base: the helpers every later rocm module uses, and the embedding step of every model"
notes     = "Overlay glm_tp_rocm: files under overlay/glm_tp_rocm/ are the branch's bytes at 8ebf67295a4f; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/glm_tp_rocm.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/davidcanar/ds4"
commit    = "8ebf67295a4f4663c326aa415145a35175e02b84"
branch    = "glm-tp-rocm"
paths     = ["overlay/glm_tp_rocm/rocm/ds4_rocm_common.cuh"]
authors   = ["davidcanar", "The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/glm_tp_rocm", "src/overlay/glm_tp_rocm/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "embed.lookup/q8_0+f16/f32.ds4-glmtp"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.glmtp_rocm_backend"
