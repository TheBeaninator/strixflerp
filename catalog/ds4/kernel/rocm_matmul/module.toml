id        = "kernel.ds4.rocm_matmul"
kind      = "kernel"
summary   = "F16 matmuls on WMMA for small and tiny M (small-M, tiny-M 24, tiny-batch wave) and their dispatch; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "the projections of short batches (verify windows, small prefills) on gfx1151 matrix cores"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["rocm/ds4_rocm_matmul.cuh"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src", "src/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.prefill/f16/f32.ds4-wmma"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.rocm_backend"
