id        = "kernel.ds4.k53flash_rocm_backend"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash 4bdbcc2: its copy of the rocm_backend family against antirez/ds4 b3f5018: ds4_rocm.cu changed (+3 -1 lines); ds4_rocm.h changed (+5 -11 lines). The family: ds4's ROCm backend translation unit: ds4_rocm.cu sets the HIP spellings (64-bit warp masks, hipBLASLt / rocBLAS names) and #includes every rocm/*.cuh module plus the shared V4.1, GLM-5.3 vision and V4 vision kernels in a fixed order into one object; ds4_rocm.h declares the ROCm-only entry points and ds4_iq2_tables_cuda.inc holds the IQ2_XXS grids"
why       = "kyuz0's gfx1151 GLM-5.3-Flash decode branch: on-the-fly WMMA Q8_0 batch GEMMs and partial HC expand (ds4_rocm_q8.cuh), the GLM dense-compact causal attention and row-wise Q8 projections (ds4_rocm_glm.cuh) and a stand-alone selected multi-head attention kernel (rocm/ds4_rocm_glm_selected_multihead.cu); the tree is a fork from before the base's V4.1 and Qwen work, so its base-diff also shows files the base changed later. The family in the base: the one place where the ROCm kernel modules become a backend: the ds4_gpu.h API (tensor-resident, device-owned activations and KV across a whole prefill / decode command sequence) is implemented here for gfx1151"
notes     = "Overlay kyuz0_glm53_flash: files under overlay/kyuz0_glm53_flash/ are the branch's bytes at 4bdbcc206828; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_flash.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

