id        = "kernel.ds4.kmultinode_rocm_moe"
kind      = "kernel"
summary   = "kyuz0/ds4 rocm-multi-node 89c1ea9 (head commit by antirez, \"Fix ROCm MTP startup residency\"): its copy of the rocm_moe family against antirez/ds4 b3f5018: rocm/ds4_rocm_moe.cuh changed (+194 -1640 lines). The family: the routed-MoE kernels: active-expert and tile building, gate / up / mid decode (LUT, MXFP4, Q4_K, IQ2) and down products in many tilings (expert tiles of 4 / 8 / 16 rows, quarter-warp, sum-6, hotlist WMMA for Q2_K); a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "an early ROCm multi-node line of ds4, five months older than the base: the ROCm backend before it grew V4.1, GLM-5.3 and Qwen kernels, with the pipeline-parallel distributed runtime; kept as the record of where the ROCm multi-node work started. The family in the base: the expert matvecs dominate decode for DSV4 and GLM; this is ds4's whole gfx1151 MoE kernel set"
notes     = "Overlay kyuz0_rocm_multi_node: files under overlay/kyuz0_rocm_multi_node/ are the branch's bytes at 89c1ea982df2; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_rocm_multi_node.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "89c1ea982df20b7578f95bb10d894f5447146fc3"
branch    = "rocm-multi-node"
paths     = ["overlay/kyuz0_rocm_multi_node/rocm/ds4_rocm_moe.cuh"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/kyuz0_rocm_multi_node", "src/overlay/kyuz0_rocm_multi_node/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "moe.experts-decode/iq2_xxs+q2_k+q4_k+mxfp4/f32.ds4-kmultinode"
api       = "see summary"
numeric   = "quantized weights with F32 accumulation"
regime    = "decode and small batches"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.kmultinode_rocm_backend"
