id        = "kernel.ds4.rocm_hipblaslt"
kind      = "kernel"
summary   = "hipBLASLt state, plan cache and version checks for the GEMMs that go to the library (HIP only); a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "how ds4 keeps hipBLASLt planning out of the hot path on ROCm"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["rocm/ds4_rocm_hipblaslt.cuh"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src", "src/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "tune.ds4-hipblaslt-plan/hip/-"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.rocm_backend"
