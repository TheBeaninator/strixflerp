id        = "kernel.ds4.k53perf_rocm_v41"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the rocm_v41 family against antirez/ds4 b3f5018: rocm/ds4_rocm_v41.cuh added (2096 lines). Kernels not in the base: __launch_bounds__, engram_lds_token_reuse, f16_ordered_token_reuse, v41_bf16_kernel, v41_candidates_kernel, v41_carry_bf16_kernel, v41_carry_mask_kernel, v41_engram_kernel, v41_engram_pack_checked_kernel, v41_f16_sharedx_token_reuse, v41_gather_kernel, v41_grouped_q8_f32_blocks4_kernel, v41_grouped_q8_f32_wmma_rowtile_kernel, v41_hc_half_to_float, v41_hc_mean_kernel, v41_hc_ordered_prefetch_kernel, v41_indexer_batch_warp8_kernel, v41_indexer_head_queries_kernel, v41_indexer_kernel, v41_indexer_reduce_heads_kernel, v41_indexer_scalar_warp8_kernel, v41_markov_final_kernel, v41_markov_part_kernel, v41_markov_transpose_f16_kernel and 8 more. The family: DeepSeek V4.1 baseline primitives for ROCm: candidates, carry, engram (with LDS token reuse), gather, grouped Q8 (blocks4, WMMA), BF16 and F16 token-reuse kernels, with explicit OCML division to keep tuned arithmetic"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: the V4.1 graph's own ops on gfx1151"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

