id        = "kernel.ds4.k53perf_rocm_halo_moe"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the rocm_halo_moe family against antirez/ds4 b3f5018: rocm/ds4_rocm_halo_moe.h added (10 lines); rocm/halo/moe/NOTICE.md added (8 lines); rocm/halo/moe/epilogue.hpp added (35 lines); rocm/halo/moe/fresh/descriptors.hip added (39 lines); rocm/halo/moe/fresh/iq2_feed.hpp added (34 lines); rocm/halo/moe/fresh/iq2_grid.hpp added (139 lines); rocm/halo/moe/fresh/twin.hip added (178 lines); rocm/halo/moe/fresh/wide.hip added (178 lines); rocm/halo/moe/public/descriptors.hip added (39 lines); rocm/halo/moe/public/iq2_feed.hpp added (34 lines); rocm/halo/moe/public/iq2_grid.hpp added (139 lines); rocm/halo/moe/public/twin.hip added (178 lines); rocm/halo/moe/public/wide.hip added (178 lines); rocm/halo/moe/runtime.hip added (90 lines). Kernels not in the base: N, __launch_bounds__, halo_s9_fresh_descriptors, halo_s9_public_descriptors. The family: the Halo IQ2_XXS MoE producers (\"S9\"): co-computed gate / up with a register epilogue in two tilings (wide, twin) and two variants (public, fresh), their descriptors, the IQ2 signed-grid feed and tables, and the runtime entry that sits on the native MMQ quantizer, stream 0"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: frozen, qualified gfx1151 expert GEMMs for prefill chunks of 2048 / 4096 rows"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

