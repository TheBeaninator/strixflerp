id        = "kernel.ds4.rocm_backend"
kind      = "kernel"
summary   = "ds4's ROCm backend translation unit: ds4_rocm.cu sets the HIP spellings (64-bit warp masks, hipBLASLt / rocBLAS names) and #includes every rocm/*.cuh module plus the shared V4.1, GLM-5.3 vision and V4 vision kernels in a fixed order into one object; ds4_rocm.h declares the ROCm-only entry points and ds4_iq2_tables_cuda.inc holds the IQ2_XXS grids"
why       = "the one place where the ROCm kernel modules become a backend: the ds4_gpu.h API (tensor-resident, device-owned activations and KV across a whole prefill / decode command sequence) is implemented here for gfx1151"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_iq2_tables_cuda.inc", "ds4_rocm.cu", "ds4_rocm.h"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/ds4_rocm.cu"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.ds4-rocm-backend/-/-"
api       = "ds4_gpu_* (ds4_gpu.h), ds4_rocm_* (ds4_rocm.h)"
numeric   = "as the origin builds it"
regime    = "Strix Halo gfx1151; eager default-stream execution (no graph capture on ROCm)"

