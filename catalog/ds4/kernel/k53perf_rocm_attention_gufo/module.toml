id        = "kernel.ds4.k53perf_rocm_attention_gufo"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-performance f46631e: its copy of the rocm_attention_gufo family against antirez/ds4 b3f5018: rocm/ds4_rocm_attention_gufo.cuh added (360 lines). Kernels not in the base: __launch_bounds__. The family: a gufo-derived DeepSeek V4 attention dataflow (from gufo-org/gufo 9da89d64, MIT): single-pass indexed attention with Q staged transposed, top_k 512"
why       = "kyuz0's later gfx1151 branch: the Halo kernels imported from MadRocK-AI/ds4 551219f (frozen WMMA GEMMs for the attention output projections and shared expert, IQ2 S9 MoE producers, Q2 and Q8 panels, direct-query attention), DeepSeek V4.1 ROCm primitives, Qwen3.8 Flash Next on gfx1151, a gufo-derived DSV4 attention, and two-machine ROCm tensor parallel over TCP or RoCE with its own slot-generation queue (docs/CLUSTERING_ROCM.md); head commit \"rocm: avoid low-confidence GLM MTP verification on gfx1151\". The family in the base: a challenger to the native DSV4 attention; the catalogue already has gufo's own attn.sparse-sink to compare"
notes     = "Overlay kyuz0_glm53_perf: files under overlay/kyuz0_glm53_perf/ are the branch's bytes at f46631e483e1; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_perf.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "f46631e483e19d13f23d3c4bced7ade0d086a3ad"
branch    = "perf/rocm-gfx1151-glm53-performance"
paths     = ["overlay/kyuz0_glm53_perf/rocm/ds4_rocm_attention_gufo.cuh"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors", "gufo-org/gufo 9da89d64 (MIT)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/kyuz0_glm53_perf", "src/overlay/kyuz0_glm53_perf/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.sparse-sink/kv-f16/f32.ds4-gufo-k53perf"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.k53perf_rocm_backend"
