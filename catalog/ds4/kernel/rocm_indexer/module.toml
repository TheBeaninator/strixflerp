id        = "kernel.ds4.rocm_indexer"
kind      = "kernel"
summary   = "the DSV4 lightning indexer: Hadamard FP4 keys, scores (direct, batched, WMMA-128), top-k (pow2, chunked, tree merge, 1024, 8192 via hipcub), top-1 rows, masks, argmax and the DSpark Markov argmax; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "sparse attention selection for DSV4 / V4.1; beside the catalogue's attn.indexer-topk providers"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["rocm/ds4_rocm_indexer.cuh"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src", "src/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "attn.indexer-topk/-/f32.ds4"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.rocm_backend"
