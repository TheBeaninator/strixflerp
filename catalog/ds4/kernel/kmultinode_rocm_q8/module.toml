id        = "kernel.ds4.kmultinode_rocm_q8"
kind      = "kernel"
summary   = "kyuz0/ds4 rocm-multi-node 89c1ea9 (head commit by antirez, \"Fix ROCm MTP startup residency\"): its copy of the rocm_q8 family against antirez/ds4 b3f5018: rocm/ds4_rocm_q8.cuh changed (+442 -144 lines). Kernels not in the base: grouped_q8_0_a_f32_batch_wmma_onthefly_kernel, hc_expand_add_partial4_kernel, hc_expand_add_partial_kernel, hc_expand_partial16_kernel, hc_expand_partial_kernel, matmul_q8_0_f32_batch_wmma_4w_kernel, matmul_q8_0_f32_batch_wmma_onthefly_kernel, matmul_q8_0_f32_small_block_w32_kernel, matmul_q8_0_hc_partial16_w32_kernel, matmul_q8_0_hc_partial_w32_kernel, matmul_q8_0_kernel, shared_gate_up_swiglu_q8_0_pair_preq_warp8_kernel. The family: Q8_0 matmuls: dequant to F16 / F32, warp-8 and shared-x row kernels, pre-quantized activations, pairs, batch with token tiles and WMMA row tiles, grouped-output Q8 with partial sums, the HC-expand fused forms and the fused shared-expert gate / up SwiGLU; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "an early ROCm multi-node line of ds4, five months older than the base: the ROCm backend before it grew V4.1, GLM-5.3 and Qwen kernels, with the pipeline-parallel distributed runtime; kept as the record of where the ROCm multi-node work started. The family in the base: Q8_0 is the format of the dense projections in ds4's GGUFs, so this is most of the non-expert decode time"
notes     = "Overlay kyuz0_rocm_multi_node: files under overlay/kyuz0_rocm_multi_node/ are the branch's bytes at 89c1ea982df2; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_rocm_multi_node.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/kyuz0/ds4"
commit    = "89c1ea982df20b7578f95bb10d894f5447146fc3"
branch    = "rocm-multi-node"
paths     = ["overlay/kyuz0_rocm_multi_node/rocm/ds4_rocm_q8.cuh"]
authors   = ["kyuz0", "The ds4.c authors", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/overlay/kyuz0_rocm_multi_node", "src/overlay/kyuz0_rocm_multi_node/rocm"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "linear.decode/q8_0/f32.ds4-kmultinode"
api       = "see summary"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.ds4.kmultinode_rocm_backend"
