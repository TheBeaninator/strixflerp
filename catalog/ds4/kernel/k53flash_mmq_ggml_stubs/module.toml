id        = "kernel.ds4.k53flash_mmq_ggml_stubs"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash 4bdbcc2: its copy of the mmq_ggml_stubs family against antirez/ds4 b3f5018: cuda/mmq/ds4_ggml_stubs.cu changed (+0 -2 lines). The family: the minimum ggml API surface (declarations and a few definitions) that the vendored MMQ code references, so it links without the ggml runtime, and ds4_rocm_memory.h, the ROCm device-memory policy (an arena for small tensors, dedicated spans for large ones) that the stubs back ggml's pool with and ds4_rocm_compat.cu allocates through; the header sits in this module because ds4_ggml_stubs.cu reaches it as ../../ds4_rocm_memory.h, and a relative include resolves only inside one module"
why       = "kyuz0's gfx1151 GLM-5.3-Flash decode branch: on-the-fly WMMA Q8_0 batch GEMMs and partial HC expand (ds4_rocm_q8.cuh), the GLM dense-compact causal attention and row-wise Q8 projections (ds4_rocm_glm.cuh) and a stand-alone selected multi-head attention kernel (rocm/ds4_rocm_glm_selected_multihead.cu); the tree is a fork from before the base's V4.1 and Qwen work, so its base-diff also shows files the base changed later. The family in the base: how ds4 lifts llama.cpp kernels out of ggml"
notes     = "Overlay kyuz0_glm53_flash: files under overlay/kyuz0_glm53_flash/ are the branch's bytes at 4bdbcc206828; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_flash.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

