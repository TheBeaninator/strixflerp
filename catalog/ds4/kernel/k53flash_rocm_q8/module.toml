id        = "kernel.ds4.k53flash_rocm_q8"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash 4bdbcc2: its copy of the rocm_q8 family against antirez/ds4 b3f5018: rocm/ds4_rocm_q8.cuh changed (+449 -0 lines). Kernels not in the base: grouped_q8_0_a_f32_batch_wmma_onthefly_kernel, hc_expand_add_partial4_kernel, hc_expand_add_partial_kernel, hc_expand_partial16_kernel, hc_expand_partial_kernel, matmul_q8_0_f32_batch_wmma_onthefly_kernel, matmul_q8_0_f32_small_block_w32_kernel, matmul_q8_0_hc_partial16_w32_kernel, matmul_q8_0_hc_partial_w32_kernel, matmul_q8_0_kernel, shared_gate_up_swiglu_q8_0_pair_preq_warp8_kernel. The family: Q8_0 matmuls: dequant to F16 / F32, warp-8 and shared-x row kernels, pre-quantized activations, pairs, batch with token tiles and WMMA row tiles, grouped-output Q8 with partial sums, the HC-expand fused forms and the fused shared-expert gate / up SwiGLU; a fragment of the single ROCm translation unit ds4_rocm.cu, where its kernels and helpers stay static"
why       = "kyuz0's gfx1151 GLM-5.3-Flash decode branch: on-the-fly WMMA Q8_0 batch GEMMs and partial HC expand (ds4_rocm_q8.cuh), the GLM dense-compact causal attention and row-wise Q8 projections (ds4_rocm_glm.cuh) and a stand-alone selected multi-head attention kernel (rocm/ds4_rocm_glm_selected_multihead.cu); the tree is a fork from before the base's V4.1 and Qwen work, so its base-diff also shows files the base changed later. The family in the base: Q8_0 is the format of the dense projections in ds4's GGUFs, so this is most of the non-expert decode time"
notes     = "Overlay kyuz0_glm53_flash: files under overlay/kyuz0_glm53_flash/ are the branch's bytes at 4bdbcc206828; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_flash.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

