id        = "kernel.ds4.k53flash_rocm_glm_selected_multihead"
kind      = "kernel"
summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash 4bdbcc2: its copy of the rocm_glm_selected_multihead family against antirez/ds4 b3f5018: rocm/ds4_rocm_glm_selected_multihead.cu added (234 lines). Kernels not in the base: glm_selected_multihead_kernel. The family: a stand-alone HIP translation unit with the GLM selected (sparse, indexer-chosen) multi-head attention kernel"
why       = "kyuz0's gfx1151 GLM-5.3-Flash decode branch: on-the-fly WMMA Q8_0 batch GEMMs and partial HC expand (ds4_rocm_q8.cuh), the GLM dense-compact causal attention and row-wise Q8 projections (ds4_rocm_glm.cuh) and a stand-alone selected multi-head attention kernel (rocm/ds4_rocm_glm_selected_multihead.cu); the tree is a fork from before the base's V4.1 and Qwen work, so its base-diff also shows files the base changed later. The family in the base: GLM-5.3-Flash decode attention over the selected cells in one kernel for all heads"
notes     = "New in this branch, built as its own object (ROCM_GLM_KERNEL_OBJS, -std=c++17). Overlay kyuz0_glm53_flash: files under overlay/kyuz0_glm53_flash/ are the branch's bytes at 4bdbcc206828; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_flash.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

