id        = "kernel.ds4.rocm_compat"
kind      = "kernel"
summary   = "the ROCm host shims compiled as their own object (ds4_rocm_compat.cu): device allocation through the ds4_rocm_memory.h arena (in kernel.ds4.mmq_ggml_stubs), the multi-GPU entry points of ds4_gpu_mgpu.h, and the decode-graph hooks that are CUDA-only (ROCm decodes eagerly)"
why       = "how ds4 sizes and places device memory on a unified-memory APU, the part of a ROCm backend that is not kernels"
notes     = "Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

[provenance]
origin    = "ds4"
repo      = "https://github.com/antirez/ds4"
commit    = "b3f50180ec2c7324892be1f50bc83555ccb8d5e7"
branch    = "main"
paths     = ["ds4_rocm_compat.cu"]
authors   = ["The ds4.c authors", "The ggml authors", "DeepSeek"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/ds4_rocm_compat.cu"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "device.ds4-rocm-memory/hip/-"
api       = "ds4_gpu_* memory and device hooks"
numeric   = "as the origin builds it"
regime    = "as the origin runs it"

[[requires]]
module    = "kernel.ds4.mmq_ggml_stubs"

[[requires]]
module    = "runtime.ds4.gpu_api"

[[requires]]
module    = "runtime.ds4.gpu_tp"

[[requires]]
module    = "runtime.ds4.gpu_args"

[[requires]]
module    = "runtime.ds4.linux_memory"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.ds4.rocm_compat.json"
