summary   = "kyuz0/ds4 perf/rocm-gfx1151-glm53-flash-prefill-restoration 4fef372: its copy of the rocm_glm_selected_multihead family against antirez/ds4 b3f5018: rocm/ds4_rocm_glm_selected_multihead.cu added (234 lines). Kernels not in the base: glm_selected_multihead_kernel. The family: a stand-alone HIP translation unit with the GLM selected (sparse, indexer-chosen) multi-head attention kernel"
why       = "the glm53-flash branch with the GLM-5.3-Flash prefill path restored and accelerated (head commit \"rocm: accelerate GLM 5.3 Flash prefill\"); same fork point as kyuz0_glm53_flash. The family in the base: GLM-5.3-Flash decode attention over the selected cells in one kernel for all heads"
notes     = "Same file as in kyuz0_glm53_flash. Overlay kyuz0_glm53_prefill: files under overlay/kyuz0_glm53_prefill/ are the branch's bytes at 4fef372a4631; unchanged files of the branch are the base modules' (docs/harvest/data/ds4/kyuz0_glm53_prefill.tsv). Verbatim; the module is one family of the ds4 harvest (docs/harvest/harvest_ds4.py, card 31224b4ca3)."

