id        = "serve.strixfold.http"
kind      = "serve"
summary   = "TensorFold 1.0's HTTP server in Zig: OpenAI chat completions and responses plus Anthropic messages translated onto the lane engine, SSE streaming, tool-call parsing, authentication, metrics, context compaction, and refusals of unsupported parameters before the stream opens"
why       = "It is the front of the pod's DeepSeek-V4.1 service (tensorfold-native serve on rank 0), and the origin of the rendering that passed the port's prompt- and stream-parity suites; strixflerp's flerp-serve-tp2 recipe puts serve.flerp.http in its place to test a catalogue front end against it, and that gate's comparison is against this server's replies (gate/results/dsv41-flash.flerp-serve-tp2)"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
