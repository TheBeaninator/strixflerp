id        = "executor.strixfold.dsv41"
kind      = "executor"
summary   = "DeepSeek-V4.1-Flash, one TP rank: prompt chunks, decode / verify rounds, the Triton and HIP kernel launch sites, behind the lane backend vtable and the native family interface"
notes     = "native.zig carries a pod patch (f44d736). cublas.zig / cublaslt.zig are dlopen shims the family imports unconditionally and stay; the *2d* files (the TP4 split, exercised on CUDA only) are included because round.zig, prompt.zig and draft.zig import them; model.zig imports vision.zig unconditionally, so the vision tower is its own module (executor.strixfold.dsv41_vision) that this one requires; fixtures/*.json are embedded by tri.zig."

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/families/dsv41/blas.zig",
  "zig/src/families/dsv41/check_main.zig",
  "zig/src/families/dsv41/config.zig",
  "zig/src/families/dsv41/cpu.zig",
  "zig/src/families/dsv41/cublas.zig",
  "zig/src/families/dsv41/cublaslt.zig",
  "zig/src/families/dsv41/dense.zig",
  "zig/src/families/dsv41/draft2d.zig",
  "zig/src/families/dsv41/dsv41.zig",
  "zig/src/families/dsv41/elf.zig",
  "zig/src/families/dsv41/exact.zig",
  "zig/src/families/dsv41/exl3_experts.zig",
  "zig/src/families/dsv41/exl3_experts2d.zig",
  "zig/src/families/dsv41/exl3_experts2d_rec.zig",
  "zig/src/families/dsv41/exl3_experts_rec.zig",
  "zig/src/families/dsv41/exl3_linear.zig",
  "zig/src/families/dsv41/exl3_prefill.zig",
  "zig/src/families/dsv41/fixtures/derived_launches.json",
  "zig/src/families/dsv41/fixtures/launches.json",
  "zig/src/families/dsv41/hip_load.zig",
  "zig/src/families/dsv41/hipblas.zig",
  "zig/src/families/dsv41/hipblas_abi_check.c",
  "zig/src/families/dsv41/lanes.zig",
  "zig/src/families/dsv41/lanes_main.zig",
  "zig/src/families/dsv41/layer_main.zig",
  "zig/src/families/dsv41/load_main.zig",
  "zig/src/families/dsv41/model.zig",
  "zig/src/families/dsv41/native.zig",
  "zig/src/families/dsv41/ops.zig",
  "zig/src/families/dsv41/prompt.zig",
  "zig/src/families/dsv41/prompt2d.zig",
  "zig/src/families/dsv41/ring2d.zig",
  "zig/src/families/dsv41/ring2d_check_main.zig",
  "zig/src/families/dsv41/round.zig",
  "zig/src/families/dsv41/round2d.zig",
  "zig/src/families/dsv41/state_file.zig",
  "zig/src/families/dsv41/text.zig",
  "zig/src/families/dsv41/tri.zig",
  "zig/src/families/dsv41/tri_attn.zig",
  "zig/src/families/dsv41/tri_aux.zig",
  "zig/src/families/dsv41/tri_basic.zig",
  "zig/src/families/dsv41/tri_hc.zig",
  "zig/src/families/dsv41/tri_index.zig",
  "zig/src/families/dsv41/tri_norm.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = ["src/zig/src/families/dsv41/lanes_main.zig", "src/zig/src/families/dsv41/layer_main.zig"]
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "executor.model/deepseek-v4.1-flash/exl3"
api       = "lanes.zig (lane Backend), native.zig (native family), tf-dsv41-lanes, tf-dsv41-layer"
numeric   = "token identity with the served Python lane is the origin gate (layer_main.zig against recordings); decode rows are row-invariant, drafts output-invariant"
regime    = "TP2 over two gfx1151 nodes; 30.8 decode tok/s, 1,226..1,432 prefill tok/s measured on F+A over RDMA"

