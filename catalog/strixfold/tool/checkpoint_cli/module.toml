id        = "tool.strixfold.checkpoint_cli"
kind      = "tool"
summary   = "The checkpoint subcommands built into the tensorfold-native server binary: models lists cached checkpoints a registered family can serve, info prints one checkpoint's family, format, context, weight size and memory floor, and pull downloads a Hugging Face revision into the shared hub cache, resumable and verified"
why       = "Role inferred from the code: the server binary imports these commands (tool.checkpoint-cli), so the module is needed to build it; no strixflerp gate runs its commands, and its info arithmetic (weights plus a kept-back margin) mirrors the memory floor the engine host enforces"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/cli/cli.zig",
  "zig/src/cli/hub.zig",
  "zig/src/cli/info.zig",
  "zig/src/cli/models.zig",
  "zig/src/cli/pull.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "tool.checkpoint-cli/-/-"
api       = "cli/cli.zig"
numeric   = "n/a"
regime    = "host"

[[requires]]
interface = "executor.host/hip/-"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
