id        = "kernel.strixfold.coll_proxy"
kind      = "kernel"
summary   = "The GPU half of a graph-capturable all-gather: a stage kernel copies this rank's block into a transmit slot of a mapped coherent host slab and publishes it with a sequence number it advances itself, and a collect kernel waits with one bounded guard load per block for the host proxy to deliver the peer's block, copies it into place and releases the slot, using system-scope release and acquire flags and an abort word"
why       = "HIP graphs are allowed only when the collective can live inside a capture (tools/dsv41-hip/ADAPTER.md D12), and a gather that needs a host call on the stream cannot; with these two kernels the host never sees the call, so a replayed graph runs fresh gathers, which cut a 29-token reply from 1.41 s to 1.245 s with identical ids (tools/dsv41-hip/RESULTS.md); coll_tcp's tcp_proxy and the pod's rdma_proxy both run on them"
notes     = "Host side: runtime.strixfold.coll_tcp (tcp_proxy.zig) or runtime.strixfold.coll_rdma (rdma_proxy.zig)."

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/kernels/hip/dsv41/coll.hip"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/dsv41/coll.hip"]
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "--offload-device-only",
  "--no-gpu-bundle-output",
  "-O3",
  "-std=c++20",
  "-fno-gpu-rdc",
  "-mno-wavefrontsize64",
  "-ffp-contract=off",
  "-fno-fast-math",
  "-fdenormal-fp-math=ieee",
  "-D__HIP_PLATFORM_AMD__",
]
variants  = 2

[[provides]]
interface = "collective.device-proxy/-/-"
api       = "tf_ds_coll_stage, tf_ds_coll_collect"
numeric   = "exact byte moves; ready / done / consumed generation words with system-scope release / acquire, bounded waits, abort word"
regime    = "one gather a launch pair; capturable in a HIP graph"

[[requires]]
module    = "kernel.strixfold.dsv41_abi"

[gate]
parity    = "origin-test:tools/dsv41-hip/tri/run_tests.sh"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strixfold.coll_proxy.json"
