id        = "kernel.strixfold.triton_kit"
kind      = "kernel"
summary   = "The Triton half of the dsv41 kernel kit: TensorFold's @triton.jit bodies copied verbatim with NVIDIA-only constructs replaced (PDL waits and L2 prefetch as no-ops, float8e4nv as integer round-to-nearest code) and the router score fixed to a stable sqrt-softplus, compiled ahead of time by a pinned AMD Triton into 158 gfx1151 code objects named by sha256 for 40 kernel functions"
why       = "Most of DeepSeek-V4.1's non-matrix operators (mHC chain, norms, router, indexer, FP4 caches, attention merges, DSpark Markov loop) were Triton in the served CUDA engine, and recompiling the same sources for AMD keeps their semantics without hand ports; building them ahead of time means no Triton at serve time and a kit verified object by object (ADAPTER.md D6, D9), and the softplus fix cured experts being picked by bias alone below lg = -16.6 (tri/README.md)"
notes     = "Object file names are their sha256 (checked on control-node for all 158). The .hsaco files are not committed; prebuilt/aot.json is the kit manifest as built."

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "tools/dsv41-hip/tri/README.md",
  "tools/dsv41-hip/tri/SHA256SUMS",
  "tools/dsv41-hip/tri/aot_build.py",
  "tools/dsv41-hip/tri/common.py",
  "tools/dsv41-hip/tri/fetch_upstream.sh",
  "tools/dsv41-hip/tri/kit_table.py",
  "tools/dsv41-hip/tri/make_port.py",
  "tools/dsv41-hip/tri/tri_kernels.py",
  "tools/dsv41-hip/tri/variants.py",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false
upstream  = "bertholomus/TensorFold @ 222a9c0b6ecaa9fd3c5dbded65a668524c9510ff: deepseek_v41/cuda/{kernels,markov}.py, cuda/exl3/prefill.py (ported by make_port.py)"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "triton-aot"
sources   = []
includes  = []
arch      = "gfx1151"
variants  = 199

[[provides]]
interface = "hc.mix-decode/dsv41-mhc-f32/bf16"
api       = "tri._hc_partial, _hc_finish, _hc_finish_s, _hc_sinkhorn, _hc_mix_part, _hc_post, _hc_post_only, _collapse, _collapse_norm"
numeric   = "Triton codegen is the reference: bits are whatever this kit computes; the served engine and the Zig port launch the same objects"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "hc.mix-prefill/dsv41-mhc-f32/bf16.triton-bits"
api       = "tri._hc_mix_pf"
numeric   = "Triton bits (kernel.strixfold.mhc_mix replaces it within hc_mix_fp32_bound)"
regime    = "prompt chunks (64..1024 rows), compute-bound on WMMA"

[[provides]]
interface = "norm.rmsnorm/-/bf16.triton-bits"
api       = "tri._rmsnorm, _rmsnorm_rot, _q_kv_norm, _kv_norm_rope"
numeric   = "Triton bits; norm fused with rotation / RoPE in the _rot and _rope variants"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "pos.rope-heads/-/bf16.triton-bits"
api       = "tri._rope_heads"
numeric   = "Triton bits (kernel.strixfold.rope_heads is bit-equal)"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "moe.router/-/bf16-f32"
api       = "tri._rowmm2, _rowmm2r, _rowmm_parts, _route, _route_parts"
numeric   = "router row GEMMs in split parts then top-k route; Triton bits"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "attn.indexer-score/kv-fp4-e2m1/bf16.triton-bits"
api       = "tri._index_score, _index_score_rows, _index_score_cand, _score_keys, _gather_tiles"
numeric   = "Triton bits"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "attn.indexer-topk/-/i64-keys.triton"
api       = "tri._topk_sel, _topk_finish"
numeric   = "exact selection on int64 keys"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "attn.sparse-sink/kv-fp4-e2m1/bf16.triton-bits"
api       = "tri._sparse_attn_part, _sparse_attn_merge, _sparse_attn_merge_rot2"
numeric   = "split partials (m, l, acc) merged in fixed order; Triton bits (kernel.strixfold.sparse_attn replaces the part kernel within its contract)"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "kvcache.store/fp4-e2m1/bf16"
api       = "tri._fp4_store, _fp4qd_p2"
numeric   = "FP4 (E2M1) codes with an E4M3 scale per 16 elements (attention keys) or E8M0 per 32 (indexer keys); E4M3 round trip written as _e4m3_rt in the port"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "draft.markov/f16/bf16"
api       = "tri._bias, _score, _finish, _pick, _tap"
numeric   = "DSpark Markov loop kernels; drafts are output-invariant (verified by the target)"
regime    = "draft rows"

[[provides]]
interface = "linear.prefill/exl3/f16-f32.triton"
api       = "tri._gemm"
numeric   = "prompt GEMM of exl3/prefill.py; Triton bits"
regime    = "prompt chunks (64..1024 rows), compute-bound on WMMA"

[[provides]]
interface = "embed.lookup/bf16/bf16.dsv41"
api       = "tri._embed_init, _engram_gate"
numeric   = "embedding rows into the 4 mHC streams; Engram gate"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

