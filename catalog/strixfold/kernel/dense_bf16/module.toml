id        = "kernel.strixfold.dense_bf16"
kind      = "kernel"
summary   = "Row-invariant BF16 dense projection for decode and verify windows: the wave that owns an output column keeps one fp32 partial per row, folds each bf16 product (exact in fp32) with one fma in a tile order fixed by K alone, sums the 32 lane partials by xor shuffles 16, 8, 4, 2, 1 and stores or adds the result with one fp32 add, plus DeepSeek's clamped SwiGLU"
why       = "Some fine-tuned DeepSeek-V4.1 packs store attn.wo_b and the shared expert's w2 of layers 10-36 as BF16 instead of EXL3 (dense.hip), and the decode paths require a row's bits not to depend on what else shares the window; the same code object also serves outside DeepSeek, as the BF16 GEMV under strixite's router logits in the qwen38-flash-next.dense-strixfold and three-engines recipes through the adapter kernel.flerp.dense_bf16_strixfold"
notes     = "Prompt chunks of these weights go through hipBLAS GemmEx, not this kernel."

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/kernels/hip/dsv41/dense.hip"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/dsv41/dense.hip"]
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "--offload-device-only",
  "--no-gpu-bundle-output",
  "-O3",
  "-std=c++20",
  "-fno-gpu-rdc",
  "-mno-wavefrontsize64",
  "-ffp-contract=off",
  "-fno-fast-math",
  "-fdenormal-fp-math=ieee",
  "-D__HIP_PLATFORM_AMD__",
]
variants  = 2

[[provides]]
interface = "linear.dense/bf16/bf16-f32.row-invariant"
api       = "tf_ds_dense_gemv"
numeric   = "w and x bf16 (products exact in fp32), one fma per element in fixed lane order, 32 lane partials summed by xor shuffles 16,8,4,2,1; y fp32 stored or accumulated with one fp32 add; a row gets the same bits whatever shares the window"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[provides]]
interface = "act.swiglu/-/bf16.dsv41"
api       = "tf_ds_dense_swiglu"
numeric   = "DeepSeek SwiGLU with its clamps (swiglu_bf16)"
regime    = "decode / verify windows, 1..128 rows, memory-bound"

[[requires]]
module    = "kernel.strixfold.dsv41_abi"

[gate]
parity    = "flerp:gate/interface/dense-bf16.toml"
bench     = "none"
status    = "parity"
compile   = "standalone"
evidence  = "gate/results/interface/dense-bf16/result.json"
reason    = "parity: interface gate dense-bf16 on control-node (result.json, provider strixfold: pass; the gate overall pass=True); compile gate evidence gate/results/compile/kernel.strixfold.dense_bf16.json"
