id        = "kernel.strixfold.dsv41_abi"
kind      = "kernel"
summary   = "The dsv41 HIP kernel ABI as one C header: a version word that the kit and the binary must share and every by-value argument struct, all fixed-width fields (uint64_t device addresses, no bool, enum, pointer or bitfield) with explicit padding and a static assert on each size and offset, compiled by hipcc and translated into Zig by translate-c"
why       = "The port replaced CUDA's mangled-name and runtime-parsed launches with Zig extern structs checked against each code object's metadata (tools/dsv41-hip/ADAPTER.md D7, D8), and one shared definition is what makes a host struct and a kernel's view of it provably identical; strixflerp's prefill bench drives the kernels with these structs (gate/prefill_dsv41_bench.py), which is why the ABI is a module of its own"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/kernels/hip/dsv41/abi.h"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.dsv41-hip/-/-"
api       = "TF_DS_HIP_ABI_VERSION, tf_ds_*_args structs"
numeric   = "fixed-width fields, natural alignment, size and offset static asserts per struct"
regime    = "n/a"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; compiled inside every other kernel.strixfold.* module"
