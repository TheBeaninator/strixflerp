id        = "kernel.strixfold.mhc_mix"
kind      = "kernel"
summary   = "Manifold hyper-connection (mHC) mixes for a prompt chunk: optionally posts the gathered partial into the 4 streams of 5,120 with _hc_post's fma contraction, then for 40 blocks of 512 columns sums 24 mix dot products and a sum of squares per row in column order, a workgroup taking 32 rows by one 512-column chunk of all four streams so each row's kilobyte is read in one piece"
why       = "It replaces the Triton _hc_mix_pf on the prompt path; the layout choice is the point, since 128-column steps of 32 rows read 256-byte pieces and ran at about 60% of streaming bandwidth (aux_hc.hip), while this one reaches 163 GB/s and posts streams bit-identical to Triton's, with the mixes inside hc_mix_fp32_bound (docs/PREFILL-DSV41.md section 3, INTERFACES)"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/kernels/hip/dsv41/aux_hc.hip"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/dsv41/aux_hc.hip"]
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "--offload-device-only",
  "--no-gpu-bundle-output",
  "-O3",
  "-std=c++20",
  "-fno-gpu-rdc",
  "-mno-wavefrontsize64",
  "-ffp-contract=off",
  "-fno-fast-math",
  "-fdenormal-fp-math=ieee",
  "-D__HIP_PLATFORM_AMD__",
]
variants  = 1

[[provides]]
interface = "hc.mix-prefill/dsv41-mhc-f32/bf16"
api       = "tf_ds_aux_hc_mix_pf_d5120"
numeric   = "fp32 fma chains in column order, post contraction as _hc_post; hc_mix_fp32_bound (not Triton bits)"
regime    = "prompt chunks (64..1024 rows), compute-bound on WMMA"

[[requires]]
module    = "kernel.strixfold.dsv41_abi"

[gate]
parity    = "origin-test:tools/dsv41-hip/tri/run_tests.sh"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strixfold.mhc_mix.json"
