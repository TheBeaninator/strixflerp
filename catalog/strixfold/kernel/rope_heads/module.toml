id        = "kernel.strixfold.rope_heads"
kind      = "kernel"
summary   = "In-place rotary embedding on the last rd dims of every attention head, one thread per four (even, odd) pairs, with re = fma(x_e, c, -(x_o s)) and im = fma(x_e, s, x_o c) (the inverse negates sin) from fp32 cos and sin tables, each rounded to bf16 nearest-even, the contractions recovered from Triton _rope_heads' compiled bits"
why       = "Role inferred from the code: a native drop-in for the Triton _rope_heads that is bit-equal to every recorded variant (t_hiprope), launched by the prompt path's attention input and its inverse on the output (docs/PREFILL-DSV41.md section 1); it gives the kit a RoPE provider with a typed ABI struct, independent of the Triton build, without changing a bit"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/kernels/hip/dsv41/aux_rope.hip"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/dsv41/aux_rope.hip"]
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "--offload-device-only",
  "--no-gpu-bundle-output",
  "-O3",
  "-std=c++20",
  "-fno-gpu-rdc",
  "-mno-wavefrontsize64",
  "-ffp-contract=off",
  "-fno-fast-math",
  "-fdenormal-fp-math=ieee",
  "-D__HIP_PLATFORM_AMD__",
]
variants  = 1

[[provides]]
interface = "pos.rope-heads/-/bf16.hip"
api       = "tf_ds_aux_rope_heads"
numeric   = "pairs (2j, 2j+1) of the last rd dims; re = fma(x_e, c, -(x_o s)), im = fma(x_e, s, x_o c); each rounded to bf16 RNE; bit-equal to every recorded _rope_heads variant (t_hiprope)"
regime    = "rows x heads, memory-bound"

[[requires]]
module    = "kernel.strixfold.dsv41_abi"

[gate]
parity    = "origin-test:tools/dsv41-hip/tri/run_tests.sh"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strixfold.rope_heads.json"
