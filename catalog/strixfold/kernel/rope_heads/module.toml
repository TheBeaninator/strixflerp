id        = "kernel.strixfold.rope_heads"
kind      = "kernel"
summary   = "RoPE on attention heads in place, bit-identical to the Triton _rope_heads"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/kernels/hip/dsv41/aux_rope.hip"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/dsv41/aux_rope.hip"]
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "--offload-device-only",
  "--no-gpu-bundle-output",
  "-O3",
  "-std=c++20",
  "-fno-gpu-rdc",
  "-mno-wavefrontsize64",
  "-ffp-contract=off",
  "-fno-fast-math",
  "-fdenormal-fp-math=ieee",
  "-D__HIP_PLATFORM_AMD__",
]
variants  = 1

[[provides]]
interface = "pos.rope-heads/-/bf16.hip"
api       = "tf_ds_aux_rope_heads"
numeric   = "pairs (2j, 2j+1) of the last rd dims; re = fma(x_e, c, -(x_o s)), im = fma(x_e, s, x_o c); each rounded to bf16 RNE; bit-equal to every recorded _rope_heads variant (t_hiprope)"
regime    = "rows x heads, memory-bound"

[[requires]]
module    = "kernel.strixfold.dsv41_abi"

[gate]
parity    = "origin-test:tools/dsv41-hip/tri/run_tests.sh"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strixfold.rope_heads.json"
