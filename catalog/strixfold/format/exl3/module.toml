id        = "format.strixfold.exl3"
kind      = "format"
summary   = "EXL3 weights for one TP rank: the split plan (32 attention heads and 1,152 expert columns a rank, vocabulary halves, Engram by hash column, the rest replicated), a per-rank cache file holding this rank's slices in the Python loader's order and dtypes behind a JSON index, and the device layouts the kernels read: linears in strips, each layer's experts in one trellis buffer with pointer, width and scale tables"
why       = "Both the served Python lane and the Zig port load the same rank cache, built from the checkpoint alone with no GPU, and every device tensor is listed under the Python engine's name, so a load can be checked byte for byte against weights.py (the bundle's full-bytes gate in tools/dsv41-hip/README.md); slicing once offline is what lets each rank map only its half of a checkpoint that does not fit one node"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/families/dsv41/checkpoint.zig",
  "zig/src/families/dsv41/plan.zig",
  "zig/src/families/dsv41/rank_cache.zig",
  "zig/src/families/dsv41/rank_cache_main.zig",
  "zig/src/families/dsv41/weights.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "format.device-view/exl3/-"
api       = "weights.zig Weights, plan.zig Split, rank_cache.zig"
numeric   = "bytes as the Python loader writes them (digests per device tensor against weights.py)"
regime    = "load time"

[[provides]]
interface = "format.loader/exl3-safetensors/-"
api       = "checkpoint.zig, rank_cache.zig (TFDSRK01)"
numeric   = "exact"
regime    = "load time"

[[requires]]
interface = "device.facade/hip/-"

[[requires]]
interface = "format.reader-strixfold/safetensors/-"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
