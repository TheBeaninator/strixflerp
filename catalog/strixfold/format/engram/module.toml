id        = "format.strixfold.engram"
kind      = "format"
summary   = "Engram, DeepSeek-V4.1's n-gram embedding memory, on the host: the row ids of each position by the reference engram.py hashing rule as numpy computes it, exact FP8 E4M3 row decode, and row reads from the original FP8 tables on local NVMe by a pread pool, through O_DIRECT 4 KiB-aligned bounce buffers, or as Linux AIO batches reaped by the decode round's own thread"
why       = "Engram's tables are too large to keep in GPU memory, and every decode round needs a few random rows from them for layers 1 and 14, so the cost is one NVMe latency per step; the AIO path exists because handing reads to a woken thread cost about 0.6 ms after an idle round (engram_aio.zig), and Engram is 10.3% of a prefill chunk and 3.1% of decode on the pod, which docs/TENSORFOLD.md R4 names as a read-pattern experiment"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/families/dsv41/engram.zig",
  "zig/src/families/dsv41/engram_aio.zig",
  "zig/src/families/dsv41/engram_check_main.zig",
  "zig/src/families/dsv41/engram_io.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "format.loader/engram-fp8/-"
api       = "engram.zig, engram_io.zig, engram_aio.zig"
numeric   = "row ids as numpy computes them; FP8 (E4M3) rows decoded exactly"
regime    = "one read per (position, table) a decode round; NVMe-bound"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
