id        = "runtime.strixfold.prompt_cache"
kind      = "runtime"
summary   = "Exact prompt reuse for any family and backend: a family's state is copied at prompt-pass chunk ends and found again by its token prefix, and Imprint keeps such states on disk under an identity directory so they outlive the server, with eviction order and a sweep of other identities"
why       = "Agentic clients resend long shared prefixes, and a two-node DeepSeek prefill runs at about 1,000-1,400 tok/s, so restoring a byte-equal state instead of recomputing saves seconds per turn; disk states are what the pod's StrixFold learned states (--learn) build on, and docs/TENSORFOLD.md lists upstream's NVMe session tier (a 319K-token conversation recalled in 1.2-1.4 s) as the fix worth carrying here"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/core/keepalive.zig",
  "zig/src/core/prompt_cache.zig",
  "zig/src/core/prompt_cache_test.zig",
  "zig/src/core/prompt_imprint.zig",
  "zig/src/core/prompt_imprint_test.zig",
  "zig/src/core/segments.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:core"

[[provides]]
interface = "cache.prompt-strixfold/-/-"
api       = "core/prompt_cache.zig Snapshots vtable, core/prompt_imprint.zig Imprint"
numeric   = "exact reuse: a restored state is byte-equal to the one saved"
regime    = "chunk-end granularity"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
