id        = "runtime.strixfold.fabric"
kind      = "runtime"
summary   = "TensorFold's host fabric library: the verbs ABI with queue pairs and memory registration, one-sided windows between ranks, RDMA and MCDMA links, producer handoff of exported pages, and mailbox, packet and wire framing, with an in-process fake for tests"
why       = "Role inferred from the code: it is the transport layer under the cluster features and the RDMA paths (transport.verbs over RC queue pairs on RoCE), which the pod's rdma_proxy needs for its write-with-immediate; docs/TENSORFOLD.md counts 25 of its paths shared with upstream, seven unchanged, so it is kept as one block rather than cut to the parts dsv41 calls"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/fabric/collective.zig",
  "zig/src/fabric/cost.zig",
  "zig/src/fabric/decoder.zig",
  "zig/src/fabric/fabric.zig",
  "zig/src/fabric/fake.zig",
  "zig/src/fabric/frames.zig",
  "zig/src/fabric/layout.zig",
  "zig/src/fabric/link_fake.zig",
  "zig/src/fabric/mailbox.zig",
  "zig/src/fabric/manifest.zig",
  "zig/src/fabric/mcdma.zig",
  "zig/src/fabric/mcdma_abi.zig",
  "zig/src/fabric/packet.zig",
  "zig/src/fabric/prefill_source.zig",
  "zig/src/fabric/producer.zig",
  "zig/src/fabric/rdma.zig",
  "zig/src/fabric/registration.zig",
  "zig/src/fabric/sendrecv.zig",
  "zig/src/fabric/sendrecv_fake.zig",
  "zig/src/fabric/verbs.zig",
  "zig/src/fabric/verbs_abi.zig",
  "zig/src/fabric/verbs_link.zig",
  "zig/src/fabric/verbs_qp.zig",
  "zig/src/fabric/wire.zig",
  "zig/src/fabric/words.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "transport.verbs/-/-"
api       = "fabric/verbs.zig, verbs_qp.zig, verbs_link.zig, registration.zig"
numeric   = "n/a"
regime    = "RC queue pairs over RoCE"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
