id        = "runtime.strixfold.grammar"
kind      = "runtime"
summary   = "Structured output on the host: response_format JSON object and schema, guided JSON, regex and choice, and a required DeepSeek DSML tool call compiled to byte programs (regex through a Thompson NFA determinized so every kept state can still match), run by a frame-stack byte machine against the tokenizer's vocabulary trie, with a per-reply constraint the draws consult"
why       = "Clients ask for JSON and forced tool calls, and an unconstrained model can drift out of them; this makes every committed token keep the reply inside its grammar, including over a verify window's drafted rows, and caps whitespace because served replies padded themselves with blank lines when a grammar refused the prose they wanted (machine.zig); structured output and required tools were the open items U44/U45 of the port's served suite (RESULTS.md)"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/core/lanes/grammar/constraint.zig",
  "zig/src/core/lanes/grammar/grammar.zig",
  "zig/src/core/lanes/grammar/grammar_test.zig",
  "zig/src/core/lanes/grammar/machine.zig",
  "zig/src/core/lanes/grammar/program.zig",
  "zig/src/core/lanes/grammar/regex.zig",
  "zig/src/core/lanes/grammar/trie.zig",
  "zig/src/core/lanes/grammar/vocab.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:core"

[[provides]]
interface = "grammar.matcher-strixfold/-/-"
api       = "core/lanes/grammar/grammar.zig"
numeric   = "n/a"
regime    = "host side, per sampled row"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
