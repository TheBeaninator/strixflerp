id        = "runtime.strixfold.core"
kind      = "runtime"
summary   = "StrixFold's backend-neutral host core library: the tokenizer, a Jinja chat template engine, checkpoint file helpers, the draft-depth rule and other shared utilities that the families and the server import, in one library with other TensorFold engine parts such as a Metal MoE route and an affine-quant matmul"
why       = "The server renders prompts and the family decodes ids with one tokenizer and template implementation, which is what let the port pass 580 named cases and 5,000 fuzzed conversations token-identical to the official encoder (RESULTS.md P2.prompt-parity); strixflerp reuses the same text layer behind its own front end as runtime.flerp.text_strixfold"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/core/affine_mm.zig",
  "zig/src/core/copy_index.zig",
  "zig/src/core/fence.zig",
  "zig/src/core/frags.zig",
  "zig/src/core/hc.zig",
  "zig/src/core/ids_json.zig",
  "zig/src/core/moe_route.zig",
  "zig/src/core/root.zig",
  "zig/src/core/row_projection.zig",
  "zig/src/core/template/access.zig",
  "zig/src/core/template/ast.zig",
  "zig/src/core/template/eval.zig",
  "zig/src/core/template/filters.zig",
  "zig/src/core/template/lexer.zig",
  "zig/src/core/template/methods.zig",
  "zig/src/core/template/parity.zig",
  "zig/src/core/template/parser.zig",
  "zig/src/core/template/pyjson.zig",
  "zig/src/core/template/scope.zig",
  "zig/src/core/template/template.zig",
  "zig/src/core/template/tests.zig",
  "zig/src/core/template/unicode.zig",
  "zig/src/core/template/unicode_data.zig",
  "zig/src/core/template/value.zig",
  "zig/src/core/tokenizer/check.zig",
  "zig/src/core/tokenizer/model.zig",
  "zig/src/core/tokenizer/regex.zig",
  "zig/src/core/tokenizer/steps.zig",
  "zig/src/core/tokenizer/tiktoken.zig",
  "zig/src/core/tokenizer/tokenizer.zig",
  "zig/src/core/tokenizer/unicode.zig",
  "zig/src/core/tokenizer/unicode_data.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:core"

[[provides]]
interface = "text.tokenizer-strixfold/-/-"
api       = "core/tokenizer/tokenizer.zig"
numeric   = "n/a"
regime    = "host"

[[provides]]
interface = "text.chat-template-strixfold/jinja/-"
api       = "core/template/template.zig"
numeric   = "n/a"
regime    = "host"

[[requires]]
interface = "format.reader-strixfold/safetensors/-"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
