id        = "runtime.strixfold.dspark_draft"
kind      = "runtime"
summary   = "The DSpark drafter on one TP rank: the streams' window rings in one pool absorb the target's taps after each prompt chunk and round, one fused pass produces N streams' drafts and confidences through three stages, a Markov loop over a split vocabulary refines them with cached bias rows for 256 frequent tokens, and a confidence head plus a cost profile pick the draft depth"
why       = "Speculation is where DeepSeek-V4.1 decode speed comes from on this hardware: the 8-category mean rose from 31.97 to 56.55 tok/s with drafts on (tools/dsv41-hip/RESULTS.md), and because the target verifies every row the output cannot change; the cost profile still holds Spark values, never an AMD measurement (scheduler_costs.zig)"
notes     = "tri_markov.zig also launches the prompt GEMM tri._gemm."

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "tools/draft_vocab.py",
  "tools/draft_vocab_extend.py",
  "zig/src/families/dsv41/draft.zig",
  "zig/src/families/dsv41/markov_tokens.zig",
  "zig/src/families/dsv41/scheduler_costs.zig",
  "zig/src/families/dsv41/tri_markov.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "speculation.draft/dspark/bf16"
api       = "draft.zig Drafter, tri_markov.zig"
numeric   = "drafts are proposals only: the target verifies every row, so the output is draft-invariant"
regime    = "N streams a pass"

[[requires]]
interface = "draft.markov/f16/bf16"

[[requires]]
interface = "collective.interface/-/-"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
