id        = "runtime.strixfold.coll"
kind      = "runtime"
summary   = "StrixFold's collective interface (Coll): a stream-ordered all-gather of fp32 partials in rank order with split begin and end, an abort that poisons the collective on the first failure, a ranks' identity handshake, and the fan of TCP links rank 0 uses to send lane commands and bootstrap the transports"
why       = "Every model reduction in TP2 is an all-gather followed by a rank-ordered add, so a collective only has to move bytes, and putting it behind one interface let the CUDA build keep NCCL while the HIP build swapped in host-staged TCP and later RDMA (ADAPTER.md D11); the handshake and bounded aborts turn the CUDA tree's silent hangs (a dead peer, mismatched settings) into attributed errors (COLLECTIVES-DESIGN.md section 1)"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/src/families/dsv41/coll.zig", "zig/src/families/dsv41/fan.zig", "zig/src/families/dsv41/link.zig"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "collective.interface/-/-"
api       = "coll.zig Coll (VTable.all_gather, the gatherBegin / gatherEnd halves, abort, close), Identity, DType, Site"
numeric   = "a collective only moves bytes; every reduction is an all-gather of fp32 partials each rank adds in rank order, so results are identical on every rank and independent of the transport"
regime    = "TP2; first failure poisons the Coll"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
