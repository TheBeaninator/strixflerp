id        = "runtime.strixfold.coll"
kind      = "runtime"
summary   = "The TP collective interface (Coll): stream-ordered all-gather of fp32 partials in rank order, split begin/end, abort, identity handshake; the ranks control link and fan"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/src/families/dsv41/coll.zig", "zig/src/families/dsv41/fan.zig", "zig/src/families/dsv41/link.zig"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "collective.interface/-/-"
api       = "coll.zig Coll (VTable.all_gather, the gatherBegin / gatherEnd halves, abort, close), Identity, DType, Site"
numeric   = "a collective only moves bytes; every reduction is an all-gather of fp32 partials each rank adds in rank order, so results are identical on every rank and independent of the transport"
regime    = "TP2; first failure poisons the Coll"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
