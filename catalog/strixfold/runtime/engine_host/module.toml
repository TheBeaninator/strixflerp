id        = "runtime.strixfold.engine_host"
kind      = "runtime"
summary   = "The HIP engine host the server links as native_engines: it registers the families ported to HIP (dsv41 alone), selects the device and the kit directory, checks that the weights fit the memory budget, sizes the prompt cache from what RAM leaves past the loaded model, and hands the engine API to the HTTP side"
why       = "A served process needs one place that turns a model directory into a running engine and refuses early when it cannot fit: the budget arithmetic is what stopped rank 0 with '98.9 GiB of weights do not fit the 97.5 GiB the HIP memory budget grants' when background jobs held memory (RESULTS.md U25); it follows native/cuda.zig step for step over the backend-neutral gpu module (ADAPTER.md section 9)"
notes     = "cuda_memory.zig is the memory budget arithmetic hip.zig imports under that name; it holds no CUDA call."

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = [
  "zig/src/native/cache_fit.zig",
  "zig/src/native/cuda_memory.zig",
  "zig/src/native/hip.zig",
  "zig/src/native/none.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.host/hip/-"
api       = "native/hip.zig (open, families), native/cache_fit.zig, native/cuda_memory.zig (budget)"
numeric   = "n/a"
regime    = "one engine a process"

[[requires]]
interface = "executor.model/deepseek-v4.1-flash/exl3"

[[requires]]
interface = "executor.lane-backend/-/-"

[[requires]]
interface = "device.facade/hip/-"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
