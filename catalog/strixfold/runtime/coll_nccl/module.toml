id        = "runtime.strixfold.coll_nccl"
kind      = "runtime"
summary   = "The Coll implementation over NCCL loaded at run time, StrixFold's CUDA transport including the four-node 2D split's point-to-point exchange, moving bytes with no header and no mismatch check"
why       = "It is the original transport of the CUDA engine (ADAPTER.md D11 made NCCL the CUDA side of Coll) and stays in the catalogue because the family's comm.zig imports it and RCCL exports the same API; it is not exercised on HIP, where coll_tcp and coll_rdma carry the pod's gathers"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/src/families/dsv41/comm.zig", "zig/src/families/dsv41/comm_main.zig"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "collective.allgather-nccl/-/f32"
api       = "comm.zig Comm.coll"
numeric   = "bytes only; no header, no mismatch check"
regime    = "TP2 / TP4 on CUDA"

[[requires]]
interface = "collective.interface/-/-"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe dsv41-flash.flerp-serve-tp2 on control-node, 2026-11-24, CPU only at nice 19: zig: builds as part of the recipe on control-node; Zig compiles what the built programs reach, not every declaration (precedent dsv41-flash.strixfold-tp2); log gate/results/dsv41-flash.flerp-serve-tp2/build.txt; not run on a GPU from that build; earlier note: zig: in the assembled tree (the family root imports comm.zig) but not reached by the HIP programs; the NCCL path is unverified on gfx1151"
evidence  = "gate/results/dsv41-flash.flerp-serve-tp2/summary.json"
