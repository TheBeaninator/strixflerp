id        = "runtime.strixfold.sampling"
kind      = "runtime"
summary   = "The keyed exact sampler: temperature 0 takes the first maximal logit; otherwise the top_k plus a margin of candidates are ordered by value then id, each scored by its logit over the temperature plus a Gumbel draw keyed by (seed, position, token id) through a splitmix64 chain, with top-p and min-p in float64 using libm exp and log and numpy's pairwise sum order"
why       = "Keying each draw by position and token means a verify row draws exactly what the serial run would at that position, so speculation is output-invariant even when sampling, and matching exact_sampling.py bit for bit makes the HIP engine reproduce the served CUDA lane: 6,000 rows token-identical to the pinned contract and 12 of 12 distributions passing chi-square (RESULTS.md)"

[provenance]
origin    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "f64b5ff"
branch    = "main"
paths     = ["zig/src/core/lanes/sampling.zig", "zig/src/families/dsv41/sampling.zig"]
authors   = ["StrixFold contributors", "TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "sample.next-token/-/f64"
api       = "core/lanes/sampling.zig Sampling, families/dsv41/sampling.zig"
numeric   = "float64, libm exp/log, numpy pairwise sum order; bit for bit with the Python exact_sampling.py"
regime    = "top_k + margin candidates a row, host side"

[gate]
parity    = "none"
bench     = "none"
compile   = "n/a"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp2/summary.json"
reason    = "zig: builds as part of the recipe dsv41-flash.strixfold-tp2 on control-node (zig 0.17.0, TheRock 10.2); Zig compiles what the built programs reach, not every declaration; not run on a GPU from that build"
