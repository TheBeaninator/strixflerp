id        = "kernel.strix_trellis.exl3_dense_r1"
kind      = "kernel"
summary   = "Dense R1 plans: the split-K projection with physical output tiling added, so more CTAs share one projection without cutting any declared K accumulation chain. A CTA covers 8 to 128 outputs of one H128 group; partitions fold from fp32 +0 in ascending order before output H128, svh, bias, alpha and beta, and the completing CTA resets the counters. One unit per input width and split count (i1152 / i1280 / i4096 / i5120 at S4, i5120 at S16 and S32), a pair kernel for q_a and kv over one input, grouped kernels for up to 8 linears of one geometry (4096 to 1024) and an owner-fold kernel where the CTA owning an output H128 folds its partials"
why       = "small attention projections sit far below the read ceiling because one launch's fixed cost dominates them; the R1 plans add output tiling without cutting an accumulation chain, which bought 1.43x on q_a at one row (README.md:475) while keeping each row equal to its own single-row call, the row invariance StrixFold needs for drafts"
notes     = "Interface tag: linear.decode/exl3. Beside kernel.strixfold.exl3 (glinear, row-invariant). Origin numbers, RC5, synthetic weights, LEGACY identity: q_a (5120, 1280) K4 at 1 row 21.09 us against 30.19 us through strix_gemv, 1.43x, bits equal (README.md:475); grouped o_a K5 at 1 row 51.27 us, 82.9 % of the read ceiling (README.md:545). Switching between S4 and LEGACY is a model identity decision in the origin's words, not a tolerance check. dense_r1_api.inc and dense_r1_group_api.inc, the host side of these plans, are fragments of api.hip in kernel.strix_trellis.c_api. No timing was taken on the pod."

