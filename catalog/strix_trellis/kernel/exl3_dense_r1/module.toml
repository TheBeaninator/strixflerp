api       = "strix_tp_dense_plan_create_r1, strix_tp_dense_r1_workspace_bytes, strix_tp_dense_pair_plan_create_r1, strix_grouped_gemv_plan_create / _submit / _destroy (STRIX_GEMV_ROW_INVARIANT_R1)"
numeric   = "two declared identities: STRIX_DENSE_R1_S4 (four K16 chains, two fp32 accumulators a lane, four-lane reduction by shuffle offsets 2 then 1) and STRIX_DENSE_R1_LEGACY (S16 for 5120 to 1280 / 1152, S32 for 5120 to 512, S4 elsewhere); row count, tile width, arrival order and prefetch depth never change the association, so every row equals its single-row call (docs/DENSE_R1.md \"Numerical identities\")"
regime    = "decode, 1..8 rows a call, memory-bound (the origin measures against a 246.7 GB/s cold read ceiling, README.md:231); the shapes of exl3_tp_dense plus the head 5120 to 64640 / 129280, K4 / K5 mul1"

