id        = "kernel.ciru_inkling.glue_decode"
kind      = "kernel"
summary   = "Inkling 2 Mini decode glue and DSpark draft kernels (hip_glue_decode.hip): short convolution, loop controller, RMSNorm forms, M <= 8 router GEMM and top-8 route, and the draft's QK norm + RoPE, W8 projections, SiLU-and-mul, softcap add and Markov gate"
notes     = "Interface tags by launch group: launch_hip_sconv_decode: none; launch_hip_loop_decode_down and 2 more: none; launch_hip_pair_rmsnorm and 3 more: norm.rmsnorm/-/bf16; launch_hip_router_gemm_m8: moe.gate-logits/bf16/bf16-f32; launch_hip_route_m8: moe.router/-/f32; launch_hip_qk_norm_rope: pos.rope-heads/-/bf16; launch_hip_dspark_w8: linear.decode/i8-g128/bf16; launch_hip_silu_and_mul: act.swiglu/-/bf16; launch_hip_add_softcap: none; launch_hip_markov_gate: draft.markov/-/bf16 (catalog/ciru_inkling/KERNELS.md has the table). Launch functions take raw device pointers, element strides and a stream (ctypes from ops/hip_runtime.py); none takes a torch tensor. No timing was taken on the pod; figures are the author's (README.md, v1.5.0)."

