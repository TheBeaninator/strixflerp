id        = "kernel.ciru_inkling.moe_prefill"
kind      = "kernel"
summary   = "Inkling 2 Mini MoE prefill (hip_moe_prefill.hip): one WMMA kernel for both expert projections over the NVFP4 source bank and Ciru's fitted INT4 / C1 banks, its 64-row block planner and the slot-order route reduction; also the ABI metadata of the library"
notes     = "Interface tags by launch group: launch_source_w13_f16_xbf16 and 19 more: moe.experts-prefill/nvfp4+int4-g32+ciru-c1/bf16; launch_pair_m64: none; launch_hip_moe_reduce: moe.combine/-/bf16; inkling_hip_abi_version and 1 more: none (catalog/ciru_inkling/KERNELS.md has the table). Launch functions take raw device pointers, element strides and a stream (ctypes from ops/hip_runtime.py); none takes a torch tensor. No timing was taken on the pod; figures are the author's (README.md, v1.5.0)."

[provenance]
origin    = "ciru_inkling"
repo      = "https://github.com/ciru-ai/Inkling-2-Mini-CIRU-Halo-Agent-gfx1151"
commit    = "b3870f35926fb322f398e6c373a93098534f8fdb"
branch    = "main"
paths     = ["overlay/vllm/models/inkling2/amd/ops/hip_moe_prefill.hip"]
authors   = ["Ciru (CIRU AI)"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/overlay/vllm/models/inkling2/amd/ops/hip_moe_prefill.hip"]
includes  = ["src/overlay/vllm/models/inkling2/amd/ops"]
arch      = "gfx1151"
toolchain = "therock-10.0"
options   = ["-fPIC", "-O3", "-DINKLING_HIP_ABI_VERSION=3", "-DINKLING_HIP_SRC_HASH_RAW=671b45b80972", "-c"]

[[provides]]
interface = "moe.experts-prefill/nvfp4+int4-g32+ciru-c1/bf16.ciru-inkling"
api       = "launch_source_w13_f16_xbf16, launch_source_w13_bf16_xbf16, launch_source_w13_f16, launch_source_w13_bf16, launch_mixed1_w13_f16_xbf16, launch_mixed1_w13_bf16_xbf16, launch_mixed1_w13_f16, launch_mixed1_w13_bf16, launch_mixed2_w13_f16_xbf16, launch_mixed2_w13_bf16_xbf16, launch_mixed2_w13_f16, launch_mixed2_w13_bf16, launch_coda_w13_f16_xbf16, launch_coda_w13_bf16_xbf16, launch_coda_w13_f16, launch_coda_w13_bf16, launch_source_w2, launch_mixed1_w2, launch_mixed2_w2, launch_coda_w2 (extern \"C\", hip_moe_prefill.hip)"
numeric   = "activations FP16 or BF16 (the _xbf16 entries read BF16 X and convert when staging); w13 output FP16 or BF16, w2 output BF16; weights from four expert banks chosen by a mode argument (BANK_MODE 0 source: the checkpoint's NVFP4, E2M1 nibbles with positive E4M3 group-16 scales and an FP32 outer scale an expert; 10 mixed1: per-expert kind 0 (NVFP4) or 1 (signed INT4 G32, BF16 scales); 20 mixed2: kind 0 or 2 (Flash C1: 4-bit codes with group tags, FP16 row multipliers and FP16 [256, 2] affine tables an expert); 2 coda: C1 only)"
regime    = "prefill; 8 routes a token (Inkling 2 Mini: 128 experts, top 8, hidden 2304); N % 128 == 0"

[[provides]]
interface = "moe.combine/-/bf16.ciru-inkling-slot-order"
api       = "launch_hip_moe_reduce (extern \"C\", hip_moe_prefill.hip)"
numeric   = "FP32 sum in slot order 0..7, rounded once to BF16 (RTNE): deterministic, bit-exact by the file header"
regime    = "prefill and decode (lowered to M >= 1 in v1.5.0); 288 threads a row for N <= 2304"

[[requires]]
module    = "kernel.ciru_inkling.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.ciru_inkling.moe_prefill.json"
