id        = "kernel.strata.sampling"
kind      = "kernel"
summary   = "the sampler chain in llama.cpp's order (penalties, top-k, top-p, min-p, temperature, pick) on the GPU, a greedy cluster path, and the coupled draft sampler that stages and samples a speculative draft over a sub-vocabulary"
why       = "sampling on the device keeps the logits off the bus; the chain order matches llama.cpp, which strixflerp's sample.next-token providers are judged against"
notes     = "Interface tags by file: sampler.cu sample.next-token/-/f32. catalog/strata/KERNELS.md has the table. No timing was taken on the pod."

[provenance]
origin    = "strata"
repo      = "https://github.com/Niko1221/Strata"
commit    = "1cbcacbcae2953f3be9edc46369f0c875bc6ab8b"
branch    = "main (release tag v0.1.40)"
paths     = [
  "include/strata/core/coupled_draft.hpp",
  "include/strata/kernels/sampler.hpp",
  "src/kernels/cuda/sampler.cu",
]
authors   = ["Niko1221", "Strata contributors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/sampler.cu"]
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "sample.next-token/-/f32.strata"
api       = "strata::kernels::sample_tokens, sample_greedy_cluster, coupled_draft_stage, coupled_draft_sample (src/kernels/cuda/sampler.cu)"
numeric   = "FP32 logits; seeded pick"
regime    = "any vocabulary; Qwen3.8 151,936"

[[requires]]
module    = "kernel.strata.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strata.sampling.json"
