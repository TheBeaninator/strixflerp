id        = "kernel.strata.elementwise"
kind      = "kernel"
summary   = "the glue kernels a layer needs between its GEMVs, in one file with one parity test: embedding gather from S-family codes, the GDN gate (softplus with ggml's large-x branch), scale, add, SiLU, FP32 to FP16 / BF16 casts and a weighted RMSNorm"
why       = "glue written once with one float convention; the embedding gather and the GDN gate run every token"
notes     = "Interface tags by file: elementwise.cu tensor.ops/-/f32. catalog/strata/KERNELS.md has the table. No timing was taken on the pod."

[provenance]
origin    = "strata"
repo      = "https://github.com/Niko1221/Strata"
commit    = "1cbcacbcae2953f3be9edc46369f0c875bc6ab8b"
branch    = "main (release tag v0.1.40)"
paths     = ["include/strata/kernels/elementwise.hpp", "src/kernels/cuda/elementwise.cu"]
authors   = ["Niko1221", "Strata contributors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/elementwise.cu"]
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"
source_options = { "src/src/kernels/cuda/elementwise.cu" = ["-ffp-contract=off"] }

[[provides]]
interface = "tensor.ops/-/f32.strata-glue"
api       = "strata::kernels::embedding_gather, gdn_gate, scale_inplace, add_inplace, f32_to_f16_bulk, f32_to_bf16_bulk, silu_inplace, rms_norm_weighted (src/kernels/cuda/elementwise.cu)"
numeric   = "FP32; compiled with -ffp-contract=off on HIP so the embedding gather keeps separately rounded operations"
regime    = "any length"

[[requires]]
module    = "kernel.strata.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strata.elementwise.json"
