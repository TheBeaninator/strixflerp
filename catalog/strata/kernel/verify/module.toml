id        = "kernel.strata.verify"
kind      = "kernel"
summary   = "kernels of the speculative verify window, where the last accepted token and T-1 drafts go through a layer at once: the GDN conv / alpha-beta / step-and-norm over T tokens with a commit that keeps only the accepted prefix, device flags to wait on, GPU timestamps and the resident-expert plan"
why       = "the verify window must reproduce plain decode bit for bit (the per-token arithmetic is copied from fused_gdn and elementwise in the same order), which is the property strixflerp's speculation gates check"
notes     = "Interface tags by file: verify_kernels.cu mixer.gdn/-/f32. catalog/strata/KERNELS.md has the table. No timing was taken on the pod."

[provenance]
origin    = "strata"
repo      = "https://github.com/Niko1221/Strata"
commit    = "1cbcacbcae2953f3be9edc46369f0c875bc6ab8b"
branch    = "main (release tag v0.1.40)"
paths     = ["include/strata/kernels/verify_kernels.hpp", "src/kernels/cuda/verify_kernels.cu"]
authors   = ["Niko1221", "Strata contributors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/kernels/cuda/verify_kernels.cu"]
includes  = ["src/include"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "mixer.gdn/-/f32.strata-verify"
api       = "strata::kernels::gdn_conv_l2_multi, gdn_conv_commit, gdn_ab_multi, gdn_step_norm_multi, wait_flag_ge, gpu_stamp, resident_plan (src/kernels/cuda/verify_kernels.cu)"
numeric   = "FP32, bitwise equal to the single-token kernels by construction"
regime    = "verify windows of T tokens"

[[requires]]
module    = "kernel.strata.common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.strata.verify.json"
