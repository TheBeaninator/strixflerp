id        = "runtime.strixfold_pr6.image_key"
kind      = "runtime"
summary   = "Image-aware prompt-cache keys: a shadow prompt in which the first eight tokens of every image span are replaced by words of the image payload's sha256 (31 bits a word, over the rows flag, span length and bytes), plus the rule that a kept state is cut only between image spans, with the PR's versions of lane_host.zig and stream.zig that apply them"
why       = "Every image becomes the same run of placeholder tokens, so a token-keyed prompt cache would restore one picture's state for a different picture; hashing the payload into the key makes a hit mean the same image, and cutting only between spans keeps a state from ending inside an image; it is active only with the image cache and the prompt cache both on, and whether it returns the same tokens as an uncached run is not yet measured (docs/VISION-DSV41.md)"
notes     = "image_key.zig is new; lane_host.zig and lanes/stream.zig are the PR's versions of files of runtime.strixfold.lanes (overlay.json)."

[provenance]
origin    = "strixfold_pr6"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "766df75"
branch    = "feat/hip-cpu-image-input (pull request #6, aercanozcan)"
paths     = [
  "zig/src/core/lane_host.zig",
  "zig/src/core/lanes/image_key.zig",
  "zig/src/core/lanes/stream.zig",
]
authors   = ["aercanozcan", "StrixFold contributors", "TensorFold contributors"]
modified  = false
upstream  = "overlay on runtime.strixfold.lanes (origin strixfold): 2 of these paths are theirs too; overlay.json"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:core"

[[provides]]
interface = "cache.prefix-key-image/-/-"
api       = "core/lanes/image_key.zig make, validCut; lane_host.zig Job.cachePrompt"
numeric   = "exact: sha256 over (rows flag, span length, payload bytes), 31 bits a word kept"
regime    = "on when Vision.cache_images (TF_DS_VISION_CACHE_MIB > 0) and the prompt cache is on"

[[requires]]
module    = "runtime.strixfold.lanes"

[[requires]]
interface = "cache.prompt-strixfold/-/-"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "never compiled or run here: no recipe assembles it. It needs the overlay rule of docs/SPEC-PROPOSALS.md section 12 before `flerp assemble` can place its files over the strixfold modules"
