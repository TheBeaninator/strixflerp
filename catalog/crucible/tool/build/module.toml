id        = "tool.crucible.build"
kind      = "tool"
summary   = "Crucible's own build: the Makefile with ENGINE_FLAGS, a hipcc wrapper that fails when the compiler exits 0 without writing its output, devsplit (one device front-end pass, kernels cut into parts with llvm-extract and compiled in parallel with the original back-end options, cached per part), an ISA diff of two engine binaries, the release stamp and the state-epoch stamp"
why       = "The one-translation-unit engine compiles its 640-odd kernels in a single clang process on one core (about 20 minutes as build/engine/crucible.mono), and devsplit gives the same ISA in parallel parts; the checked wrapper exists because hipcc reported success after an out-of-memory kill on Nov 5; the qwen38-flash-next.crucible recipe builds through this Makefile (its build root) with the plain mono target and no stamps"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "Makefile",
  "VERSION",
  "tools/devsplit.py",
  "tools/devsplit_facts.tsv",
  "tools/devsplit_groups.tsv",
  "tools/devsplit_ir.py",
  "tools/generate_persistent_ops.py",
  "tools/hipcc_checked.sh",
  "tools/isa_diff.py",
  "tools/release_engine.py",
  "tools/state_epoch.py",
  "tools/state_epoch_pins.tsv",
  "tools/state_epoch_sources.txt",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "build.graph/make/-"
api       = "make build/engine/crucible[.mono] (Makefile)"
numeric   = "n/a"
regime    = "n/a"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "build scripts"
