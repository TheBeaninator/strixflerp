id        = "tool.crucible.engine_cli"
kind      = "tool"
summary   = "The engine binary's command line: gen for one greedy or sampled capture, gen --jobs to run many captures after one load and warm-up with every piece of per-request state checked back to fresh between jobs, the greedy multi-stream batch mode, the prefill bench (pfbench), a debug schedule dump and the version print"
why       = "Crucible's GPU gates and measurement tools drive the engine through these modes, and the strixflerp Crucible recipe gate captures its token ids with gen --n 128 (gate/results/qwen38-flash-next.crucible, crucible-fatzero); the CLI parses every option before the model allocates device memory and adds no forward path of its own, so what it measures is the serving code (docs/ARCHITECTURE.md 'cli')"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/cli/batch_cli.h",
  "engine/cli/batch_options.h",
  "engine/cli/gen_cli.h",
  "engine/cli/gen_debug_schedule.h",
  "engine/cli/gen_job_state.h",
  "engine/cli/gen_jobs.h",
  "engine/cli/prefill_bench.h",
  "engine/cli/version.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/cli"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "tool.generate-ids/crucible/-"
api       = "crucible gen CKPT ... (cli/gen_cli.h), prefill bench (cli/prefill_bench.h)"
numeric   = "n/a"
regime    = "n/a"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.device_memory"

[[requires]]
module    = "runtime.crucible.sampling"

[[requires]]
module    = "runtime.crucible.speculation"

[[requires]]
module    = "serve.crucible.engine_serve"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (8 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
