id        = "tool.crucible.engine_cli"
kind      = "tool"
summary   = "The engine binary command line: gen (one capture, --jobs), batch CLI, prefill bench, debug schedule, version"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/cli/batch_cli.h",
  "engine/cli/batch_options.h",
  "engine/cli/gen_cli.h",
  "engine/cli/gen_debug_schedule.h",
  "engine/cli/gen_job_state.h",
  "engine/cli/gen_jobs.h",
  "engine/cli/prefill_bench.h",
  "engine/cli/version.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/cli"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "tool.generate-ids/crucible/-"
api       = "crucible gen CKPT ... (cli/gen_cli.h), prefill bench (cli/prefill_bench.h)"
numeric   = "n/a"
regime    = "n/a"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.device_memory"

[[requires]]
module    = "runtime.crucible.sampling"

[[requires]]
module    = "runtime.crucible.speculation"

[[requires]]
module    = "serve.crucible.engine_serve"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
