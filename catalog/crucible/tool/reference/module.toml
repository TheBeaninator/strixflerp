id        = "tool.crucible.reference"
kind      = "tool"
summary   = "CPU references for Crucible's numerics: a NumPy EXL3 codec and matvec that reproduce the codebook and decoder states bit for bit, an fp64 layer oracle, prefill and vision references with fixture makers, a quality check for the codec, and the YaRN RoPE table generator whose output kernel.crucible.ops embeds"
why       = "Crucible's gate 1 falls back to the fp64 oracle and its tables where bitwise equality with a baseline cannot apply (docs/ARCHITECTURE.md 'Gates'), so these scripts are the ground truth its kernels and tolerances are argued from; strixflerp keeps them as the definition of what the EXL3 decode and the Flash-Next forward must compute"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "ref/README.md",
  "ref/bf16/__init__.py",
  "ref/bf16/tokens.py",
  "ref/check_quality_codec.py",
  "ref/checkpoint_ranges.py",
  "ref/exl3_ref.py",
  "ref/make_fixtures.py",
  "ref/make_prefill_fixture.py",
  "ref/oracle.py",
  "ref/prefill_ref.py",
  "ref/vision_compare.py",
  "ref/vision_ref.py",
  "tools/yarn/__init__.py",
  "tools/yarn/qwen38-rope-config.json",
  "tools/yarn/reference.py",
  "tools/yarn/rope_header.py",
  "tools/yarn/yarn2-reference.json",
  "tools/yarn/yarn4-reference.json",
]
authors   = ["jaedync"]
modified  = false
upstream  = "EXL3 format after ExLlamaV3 d3739fd393337b1ff4d6c2a342b12f0c87a9592f (MIT, Turboderp; catalog/crucible/NOTICE)"

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "python"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "verify.numerics-contract-crucible/exl3/-"
api       = "ref/exl3_ref.py, ref/oracle.py, tools/yarn/rope_header.py"
numeric   = "fp32/fp64 CPU"
regime    = "offline"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "python: not compiled"
