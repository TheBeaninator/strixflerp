[[requires]]
module    = "runtime.crucible.ablation"

[[requires]]
module    = "runtime.crucible.batch"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.sampling"

[[requires]]
module    = "runtime.crucible.speculation"

[[requires]]
module    = "runtime.crucible.state_disk"

[gate]
