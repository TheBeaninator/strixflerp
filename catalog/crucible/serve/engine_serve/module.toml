id        = "serve.crucible.engine_serve"
kind      = "serve"
summary   = "The engine side of Crucible serving: the JSON-line protocol on stdin/stdout in a serial (Serve) and a batched (BatchedServe, the default) stack, batch sessions with a conversation LRU, glue to the disk tier, slot bases and handover spill, logprobs, MTP history, draft tallies, cache status and a ledger of cache misses"
why       = "It is the seam between the Python HTTP server and the C++ engine process: every request check runs before a state reset or device work and stdout carries protocol messages only (docs/ARCHITECTURE.md 'serve'), and BatchedServe is where up to N sessions share one engine with shortest-remaining-prefill-first scheduling and packed verification while one stream still equals the serial output"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/serve/batch_conversation_cache.h",
  "engine/serve/batch_mtp_history.h",
  "engine/serve/batch_session.h",
  "engine/serve/batch_state_disk.h",
  "engine/serve/batched_serve.h",
  "engine/serve/batched_serve_protocol.h",
  "engine/serve/batched_serve_settings.h",
  "engine/serve/cache_status.h",
  "engine/serve/draft_tally.h",
  "engine/serve/handover_spill.h",
  "engine/serve/logprobs.h",
  "engine/serve/miss_ledger.h",
  "engine/serve/serve.h",
  "engine/serve/serve_line.h",
  "engine/serve/serve_protocol.h",
  "engine/serve/serve_settings.h",
  "engine/serve/slot_base.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/serve"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "serve.engine-crucible/-/-"
api       = "serve.h, batched_serve.h, batch_session.h (JSON lines on stdin/stdout)"
numeric   = "n/a"
regime    = "serving"

[[requires]]
