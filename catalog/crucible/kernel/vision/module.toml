id        = "kernel.crucible.vision"
kind      = "kernel"
summary   = "Device kernels for Qwen3.8-Flash-Next's vision tower (the HF Qwen4ExpVisionModel): patchify and patch embedding, position embedding, 2D RoPE, attention, LayerNorm, GELU and bias epilogues in fp32, with the tower's EXL3 linears sent through the prefill GEMM rather than a kernel of their own"
why       = "Role inferred from the code and the server: Crucible's HTTP frontend accepts image parts (server/vision.py), and this module turns one image a request into the rows the language model reads, reusing kernel.crucible.exl3_gemm for the heavy matrices so the tower adds only the operators text never needs; no comparison or measurement of it is recorded in strixflerp"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = ["engine/layers/kernels/vision.h"]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers/kernels"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "vision.tower-ops/exl3/f32.crucible"
api       = "PatchifyKernel, PatchEmbedKernel, AttentionKernel, LayerNormKernel, GeluKernel (layers/kernels/vision.h)"
numeric   = "fp32"
regime    = "one image per request"

[[requires]]
module    = "kernel.crucible.device_common"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
