id        = "kernel.crucible.moe_prefill"
kind      = "kernel"
summary   = "Prompt-chunk MoE: a stable expert-major counting sort of the routed rows with no atomics (count, prefix, scatter), grouped expert GEMM items of 192 rows by 128 columns on WMMA in which one trellis decode per k step serves 12 row tiles, a pair kernel that runs gate and up in one 8-wave block with SwiGLU in the epilogue, bank-conflict-aware LDS planes, and a slot-stable combine"
why       = "Routed experts are the largest share of a prefill chunk (32.7% of strixite's in its profile), and decoding a weight tile is the fixed cost; serving 12 row tiles per decode and keeping gate/up out of memory is the 'decode-once, fused pair' recipe docs/CRUCIBLE.md 4.2 ranks second for the fleet (transfer C2 for strixite, and the item-size idea for StrixFold's prompt experts); the crucible-fatzero gate records that the pair kernel spills 772 B a lane under TheRock 10.1"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/layers/kernels/prefill_moe.h",
  "engine/layers/prefill_moe.h",
  "engine/layers/prefill_moe_kset.h",
  "engine/layers/prefill_moe_pair.h",
  "engine/layers/prefill_moe_tile.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers", "src/engine/layers/kernels"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "moe.experts-prefill/exl3/f16-f32.crucible"
api       = "PrefillMoe*Kernel (layers/prefill_moe.h, prefill_moe_tile.h), MoeCount/Prefix/ScatterKernel (layers/kernels/prefill_moe.h)"
numeric   = "per router slot exact; expert-major order stable, no atomics on output order"
regime    = "prompt chunks (up to 2048 rows a chunk), compute-bound on WMMA"

[[provides]]
interface = "moe.dispatch-crucible-stable/-/-"
api       = "MoeCountKernel, MoePrefixExpertsKernel, MoeScatterKernel"
numeric   = "exact (integer counting sort by expert)"
regime    = "prompt chunks (up to 2048 rows a chunk), compute-bound on WMMA"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "kernel.crucible.device_common"

[[requires]]
module    = "kernel.crucible.exl3_gemm"

[[requires]]
module    = "kernel.crucible.moe_decode"

[[requires]]
module    = "kernel.crucible.ops"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (6 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
