id        = "kernel.crucible.qsa"
kind      = "kernel"
summary   = "Sparse attention (QSA): exact fp32 indexer scores, tile-local top-512, split-K sparse attention for long decode, prefill union flash over four query rows sharing KV, opt-in input capture"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/layers/kernels/prefill_qsa.h",
  "engine/layers/kernels/prefill_qsa_score.h",
  "engine/layers/kernels/prefill_qsa_score_sgpr.h",
  "engine/layers/kernels/prefill_qsa_select.h",
  "engine/layers/kernels/prefill_qsa_union.h",
  "engine/layers/kernels/qsa_union_lds.h",
  "engine/layers/qsa_capture.h",
  "engine/layers/qsa_capture_policy.h",
  "engine/layers/qsa_long.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers", "src/engine/layers/kernels"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "attn.qsa-indexer/-/f32.crucible"
api       = "QsaScore*Kernel, QsaTop*Kernel (qsa_long.h), prefill_qsa_select.h"
numeric   = "exact fp32 indexer, exact top-512"
regime    = "decode and prefill"

[[provides]]
interface = "attn.sparse-sink/kv-f16/f32.crucible"
api       = "QsaGqaSplitKernel, QsaMergeKernel, QsaAttnTailKernel (qsa_long.h), QsaUnionFlashKernel (prefill_qsa_union.h)"
numeric   = "fp32 softmax, split-K merge"
regime    = "decode and prefill"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "kernel.crucible.device_common"

[[requires]]
module    = "kernel.crucible.ops"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
