id        = "kernel.crucible.qsa"
kind      = "kernel"
summary   = "Qwen sparse attention (QSA): an exact fp32 indexer score over the compressed keys, a fused tile-local top-512 selection, split-K sparse attention with a sink for long decode, a prefill 'union flash' in which four query rows share one key list and one KV load, and opt-in capture of the kernel inputs"
why       = "QSA is what keeps the model's attention cost flat to half a million tokens (Crucible decodes 52.6 tok/s with drafts at 490K, docs/CRUCIBLE.md section 3); the four-row union shares each KV load and gained 2.6% at 32K and 3.9% at 130K (CHANGELOG 357-364), so docs/CRUCIBLE-VS-STRIXITE.md prefers it to strixite's attention, while strixite's filter top-k at depth is named as the comparison to run back the other way (transfer S2)"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/layers/kernels/prefill_qsa.h",
  "engine/layers/kernels/prefill_qsa_score.h",
  "engine/layers/kernels/prefill_qsa_score_sgpr.h",
  "engine/layers/kernels/prefill_qsa_select.h",
  "engine/layers/kernels/prefill_qsa_union.h",
  "engine/layers/kernels/qsa_union_lds.h",
  "engine/layers/qsa_capture.h",
  "engine/layers/qsa_capture_policy.h",
  "engine/layers/qsa_long.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers", "src/engine/layers/kernels"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "attn.qsa-indexer/-/f32.crucible"
api       = "QsaScore*Kernel, QsaTop*Kernel (qsa_long.h), prefill_qsa_select.h"
numeric   = "exact fp32 indexer, exact top-512"
regime    = "decode and prefill"

[[provides]]
interface = "attn.sparse-sink/kv-f16/f32.crucible"
api       = "QsaGqaSplitKernel, QsaMergeKernel, QsaAttnTailKernel (qsa_long.h), QsaUnionFlashKernel (prefill_qsa_union.h)"
numeric   = "fp32 softmax, split-K merge"
regime    = "decode and prefill"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "kernel.crucible.device_common"

[[requires]]
module    = "kernel.crucible.ops"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (11 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
