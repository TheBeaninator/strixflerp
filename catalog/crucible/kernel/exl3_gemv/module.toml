id        = "kernel.crucible.exl3_gemv"
kind      = "kernel"
summary   = "EXL3 decode matvec for 1..8 activation rows: the input is scaled and Hadamard-rotated, each lane owns 8 trellis states in one contiguous window (three dword loads and two funnel shifts a tile), decodes the mul1 codebook exactly and accumulates with v_dot2_f32_f16 in one fixed chain per row and column, then the output transform runs; dense groups use front-ordered tiles and ring schedules that prefetch the next weights"
why       = "Decode reads about 5.36 GB of weights a token at 4.05 bpw, so this kernel sets serial speed (Crucible and strixite both sit at 70-77% of measured bandwidth); what sets it apart is batch invariance: a row's bits never depend on how many rows share the pass, which makes MTP verification and packed batches exact, the property strixite's split-K linear_q4 lacks (measurement M5) and the basis of transfer C4 (docs/CRUCIBLE-VS-STRIXITE.md sections 2, 4 and 5)"
notes     = "Own HIP code; the activation path and the codebook constants follow ExLlamaV3 (exl3.h:3, lane_window.h:24), so the module carries the MIT notice as well (NOTICE)."

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/exl3/balanced_items.h",
  "engine/exl3/decode_split.h",
  "engine/exl3/dense_rows.h",
  "engine/exl3/exl3.h",
  "engine/exl3/exl3_ring.h",
  "engine/exl3/front_order.h",
  "engine/exl3/kernels/exl3_gemv.h",
  "engine/exl3/kernels/lane_window.h",
  "engine/exl3/lookahead.h",
  "engine/exl3/plans.h",
  "engine/exl3/ring_rows.h",
  "engine/exl3/row_policy.h",
]
authors   = ["jaedync"]
modified  = false
upstream  = "EXL3 format after ExLlamaV3 d3739fd393337b1ff4d6c2a342b12f0c87a9592f (MIT, Turboderp; catalog/crucible/NOTICE)"

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/exl3", "src/engine/exl3/kernels"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "linear.decode/exl3/f16-f32.crucible"
api       = "LinInKernel, LinGemvKernel, LinOutKernel, LinRingFlowKernel (exl3/exl3.h, exl3_ring.h); plans in exl3/plans.h"
numeric   = "y = H_O(W_hat^T H_I(x*suh))*svh; codebook decoded exactly per lane, fp32 accumulate in a fixed split order; each row of R keeps the R=1 contraction order"
regime    = "decode and MTP verify, 1..8 rows (R), memory-bound"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "kernel.crucible.device_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
