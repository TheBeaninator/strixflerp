id        = "kernel.crucible.exl3_gemm"
kind      = "kernel"
summary   = "EXL3 prefill GEMM on gfx11 WMMA: weights are stored column-block-major in 16x16 trellis tiles that already match the WMMA fragment, each wave decodes a tile into LDS once and feeds it to v_wmma_f32_16x16x16_f16 for every row tile, two column tiles share one LDS publication, and a half-precision variant and packed input transforms are shared with decode"
why       = "Cold prefill on gfx1151 is compute-bound, and Crucible runs it at 53-56% of a measured 48.2 TFLOPS WMMA ceiling; because EXL3 tiles are fragment-shaped it skips the 128 scattered row pieces per K step that strixw's row-major linear_wmma must stage, and the half-precision kernel added 4.4-4.8% a call at equal bytes (docs/CRUCIBLE.md section 2), which is why the dense-prefill row of docs/CRUCIBLE-VS-STRIXITE.md section 2 calls Crucible's the stronger recipe"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/exl3/kernels/exl3_gemm.h",
  "engine/exl3/kernels/exl3_gemm_pair.h",
  "engine/exl3/kernels/exl3_moe_window.h",
  "engine/exl3/prefill_half.h",
  "engine/exl3/prefill_items.h",
  "engine/exl3/prefill_linear.h",
]
authors   = ["jaedync"]
modified  = false
upstream  = "EXL3 format after ExLlamaV3 d3739fd393337b1ff4d6c2a342b12f0c87a9592f (MIT, Turboderp; catalog/crucible/NOTICE)"

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/exl3", "src/engine/exl3/kernels"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "linear.prefill/exl3/f16-f32.crucible"
api       = "Exl3GemmKernel (exl3/kernels/exl3_gemm.h), PrefillGemmOut*Kernel, PrefillLinIn*Kernel (exl3/prefill_linear.h)"
numeric   = "tile decoded to fp16 in LDS, WMMA fp32 accumulate, input transform and epilogue shared with decode"
regime    = "prompt chunks (up to 2048 rows a chunk), compute-bound on WMMA"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "kernel.crucible.exl3_gemv"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
