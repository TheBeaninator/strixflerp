id        = "kernel.crucible.moe_decode"
kind      = "kernel"
summary   = "Decode routed experts in one launch as a stream grid: persistent 8-wave blocks claim units of column blocks over the whole K span from a global counter with no block barrier, load EXL3 weights as b128/b64 with no LDS transpose, run gate/up, mid and down of every expert job with the shared job first among gate/up units and its down units last, and run row-sparse experts for verify forwards"
why       = "Launching each expert's small GEMV separately leaves the GPU idle between them; the stream grid streams at 88-95% of the byte floor in its bench and keeps each routed slot in its one-row order with a combine that is stable by router slot, so it is exact by construction (engine/layers/moe_sg.h); docs/CRUCIBLE-VS-STRIXITE.md section 2 rates it over strixite's router plus per-expert Q4 GEMVs, and kernel.flerp.moe_sg re-expresses it for GGUF K-quants (ORNITH-CRUCIBLE item 1)"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/layers/expert_count.h",
  "engine/layers/moe_b128.h",
  "engine/layers/moe_b128_switch.h",
  "engine/layers/moe_chunk_map.h",
  "engine/layers/moe_rows.h",
  "engine/layers/moe_sg.h",
  "engine/layers/moe_shared_first.h",
  "engine/layers/moe_stage.h",
  "engine/layers/moe_window_policy.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "moe.experts-decode/exl3/f16-f32.crucible"
api       = "MoeStageKernel, MoeSgKernel, MoeFusedKernel, MoeRows*Kernel"
numeric   = "exact: each routed slot keeps its R=1 order; stable combine by router slot"
regime    = "decode and MTP verify, 1..8 rows (R), memory-bound"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "kernel.crucible.ops"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
