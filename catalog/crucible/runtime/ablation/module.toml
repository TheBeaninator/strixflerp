id        = "runtime.crucible.ablation"
kind      = "runtime"
summary   = "Opt-in run-time abliteration (CRUCIBLE_ABLATE): a Heretic-format sidecar in ExLlamaV3 layout is loaded, and for 36 sublayers (attention output of layers 30-39, MoE output of 17-42) each output y becomes y - b * dot(y, a) on the device before the hyper-connection write-back, selectable per request"
why       = "It lets the owner run the model with its refusal behaviour removed without a second weight pack: the published sidecar is applied at run time to either the 3.05 or the 4.05 bpw pack, and it is off by default and registered as a profile switch because it changes the model on purpose (docs/ABLITERATED.md and engine/switches.h in the origin)"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = ["engine/layers/ablation.h", "engine/layers/ablation_device.h", "engine/runtime/ablate_request.h"]
authors   = ["jaedync"]
modified  = false
upstream  = "sidecar format of the Heretic ExLlamaV3 runtime (ablation.h:6)"

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "steer.add-rows/-/f32.crucible"
api       = "ablation.h, ablation_device.h"
numeric   = "fp32"
regime    = "all"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "kernel.crucible.device_common"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.state_disk"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
