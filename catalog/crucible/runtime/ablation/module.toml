id        = "runtime.crucible.ablation"
kind      = "runtime"
summary   = "Opt-in runtime abliteration (CRUCIBLE_ABLATE): sidecar loading (Heretic ExLlamaV3 format), per-request mode, device half"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = ["engine/layers/ablation.h", "engine/layers/ablation_device.h", "engine/runtime/ablate_request.h"]
authors   = ["jaedync"]
modified  = false
upstream  = "sidecar format of the Heretic ExLlamaV3 runtime (ablation.h:6)"

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "steer.add-rows/-/f32.crucible"
api       = "ablation.h, ablation_device.h"
numeric   = "fp32"
regime    = "all"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "kernel.crucible.device_common"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.state_disk"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
