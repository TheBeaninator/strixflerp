id        = "runtime.crucible.device_memory"
kind      = "runtime"
summary   = "Memory policy for the unified-memory APU: environment defaults that turn off SVM and user-pointer paging, pinned host buffers and an allocator of locked pages for snapshots, a bounded wait for page migration to settle, and a warm-up that touches pages before serving"
why       = "On Strix Halo the GPU shares system memory, and migrating an SVM range stops every KFD queue, decode queues included (runtime_memory_policy.h), so Crucible pins what the GPU must see and stages pageable uploads instead of moving pages; pinned fixed buffers also keep pageable-transfer registration out of the decode loop (pinned_buffer.h), and the charter forbids hipSetDeviceFlags because changing the scheduling mode at run time loses CLR completion handlers"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/gfx1151/migration_wait.h",
  "engine/gfx1151/pinned_allocator.h",
  "engine/gfx1151/pinned_buffer.h",
  "engine/gfx1151/runtime_memory_policy.h",
  "engine/gfx1151/warmup.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/gfx1151"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "device.memory-crucible/hip/-"
api       = "PinnedBuffer, PinnedAllocator, runtime_memory_policy.h"
numeric   = "n/a"
regime    = "n/a"

[[requires]]
module    = "kernel.crucible.device_common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
