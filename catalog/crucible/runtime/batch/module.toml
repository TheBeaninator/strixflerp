id        = "runtime.crucible.batch"
kind      = "runtime"
summary   = "Contracts of batched serving: admission at start-up that charges one memory reserve for the OS, the engine plans and the frontend and prints only settings its own check would accept, CPU boundary checks before any stream advances its retained prefix, host row inputs kept alive until their queued copies finish, packed-verify span validation, and the rule for how many rows one packed pass holds"
why       = "Crucible serves up to 8 sessions in one engine and verifies their drafts together in packed passes of up to 16 rows, which a 2026-10-09 sweep measured at +4 to +26% with 4-8 sessions but -2 to -3% with 2-3 (packed_rows_option.h); these checks keep a bad request or an oversubscribed setting from corrupting another stream's state, so batching never changes any request's output (docs/ARCHITECTURE.md 'Serving')"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/runtime/batch_admission.h",
  "engine/runtime/batch_contract.h",
  "engine/runtime/batch_inputs.h",
  "engine/runtime/batch_spec_contract.h",
  "engine/runtime/packed_rows_option.h",
  "engine/runtime/pass_rows.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "serve.memory-plan-crucible/-/-"
api       = "batch_admission.h"
numeric   = "n/a"
regime    = "serving"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
