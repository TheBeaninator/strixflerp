id        = "runtime.crucible.speculation"
kind      = "runtime"
summary   = "MTP speculative decoding: draft-head policy, a 4- or 2-bit copy of the head rows that scores every token coarsely and then recomputes the 8 best 128-token blocks exactly from the EXL3 tiles, a dense fp16 head option, a draft length set from the MTP top-2 margin and the value of another token, a 65,536-token draft vocabulary, overlap of the next MTP pass with the server step, and the spans packed verification checks"
why       = "Decode is memory-bound, so one weight read that verifies a chain of drafts gives several tokens (4.69 accepted a pass on code; Crucible measured 80.6 tok/s on code with drafts against 31.9 without, docs/CRUCIBLE-VS-STRIXITE.md section 0), and only verification commits tokens, so the output stays exact; the coarse-then-exact head scoring is transfer C6 for strixite and was re-expressed for GGUF heads as kernel.flerp.draft_coarse (ORNITH-CRUCIBLE item 2)"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/runtime/draft_accept.h",
  "engine/runtime/draft_adapt.h",
  "engine/runtime/draft_dense.h",
  "engine/runtime/draft_head_policy.h",
  "engine/runtime/draft_ops.h",
  "engine/runtime/draft_overlap.h",
  "engine/runtime/draft_policy.h",
  "engine/runtime/draft_quant.h",
  "engine/runtime/draft_quant_host.h",
  "engine/runtime/draft_stop.h",
  "engine/runtime/draft_value.h",
  "engine/runtime/draft_vocab.h",
  "engine/runtime/draft_warmup.h",
  "engine/runtime/mtp_bulk.h",
  "engine/runtime/spec_span.h",
  "engine/runtime/spec_steps.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "speculation.draft/mtp/f32.crucible"
api       = "draft_ops.h, draft_quant.h (DraftQGemvKernel), draft_dense.h, draft_policy.h, draft_value.h"
numeric   = "drafts only; verification commits the target tokens (lossless)"
regime    = "decode and MTP verify, 1..8 rows (R), memory-bound"

[[provides]]
interface = "speculation.window-verify-lossless-crucible/-/-"
api       = "draft_accept.h, spec_span.h"
numeric   = "exact"
regime    = "decode and MTP verify, 1..8 rows (R), memory-bound"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "kernel.crucible.device_common"

[[requires]]
module    = "kernel.crucible.exl3_gemv"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (23 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
