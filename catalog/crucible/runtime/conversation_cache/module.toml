id        = "runtime.crucible.conversation_cache"
kind      = "runtime"
summary   = "The conversation and prefix cache: immutable entries that own their KV bytes (an edit cannot mutate an older branch), resume from the longest saved prefix, snapshots kept in pinned host chunks and written lazily, in-slot checkpoints, exact storage addresses, and a 32-byte tenant key compared on every match"
why       = "Agent sessions resend the same long prompt with a little new text, and a cold 32K prompt costs about 18 s, so keeping earlier turns cut time to first token for a repeated prompt to 0.023 s (docs/how-it-got-fast.md idea 4 in the origin); the rule that a hit gives the bits of a miss is a Crucible gate, and docs/CRUCIBLE-VS-STRIXITE.md judges it even with strixite's base-plus-delta prompt cache, two good designs for one problem"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/layers/cache_storage.h",
  "engine/runtime/conversation_admission.h",
  "engine/runtime/conversation_cache.h",
  "engine/runtime/conversation_resume.h",
  "engine/runtime/conversation_snapshot.h",
  "engine/runtime/lazy_snapshot.h",
  "engine/runtime/retained_prefix.h",
  "engine/runtime/slot_checkpoint_io.h",
  "engine/runtime/slot_checkpoints.h",
  "engine/runtime/snapshot_bytes.h",
  "engine/runtime/tenant.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/layers", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "cache.prompt-crucible/-/-"
api       = "ConversationCache (conversation_cache.h), snapshot_bytes.h, slot_checkpoints.h"
numeric   = "exact (bit-identical resume)"
regime    = "serving"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "runtime.crucible.device_memory"

[[requires]]
module    = "runtime.crucible.speculation"

[[requires]]
module    = "runtime.crucible.state_disk"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (19 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
