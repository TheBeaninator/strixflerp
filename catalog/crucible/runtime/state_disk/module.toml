id        = "runtime.crucible.state_disk"
kind      = "runtime"
summary   = "The NVMe tier for conversation states: every 4,096 rows of a snapshot go to one block file named by the SHA-256 of its bytes (equal blocks are shared), state files carry checksums and an index, reads run on a reader thread before a request opens, and each state is filed under a state epoch that hashes the state-format sources, the state-changing switches and the gfx1151 machine code"
why       = "Without it a restart or a cache eviction throws away conversation states; the epoch replaced a hash of the whole binary, which made every daily rebuild empty the SSD cache, so only a change that can alter state bytes now starts a new folder (state_epoch.h), and production binaries carry their own SHA-256 because they do not link OpenSSL (sha256.h); docs/CRUCIBLE-VS-STRIXITE.md compares its SHA blocks with strixite's one-delta states (transfer S3)"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/runtime/sha256.h",
  "engine/runtime/state_blocks.h",
  "engine/runtime/state_disk.h",
  "engine/runtime/state_epoch.h",
  "engine/runtime/state_format.h",
  "engine/runtime/state_switches.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "kvcache.tiering/crucible-state/-"
api       = "state_disk.h, state_format.h"
numeric   = "exact"
regime    = "serving"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
