id        = "runtime.crucible.sampling"
kind      = "runtime"
summary   = "Sampling and generation: own RNG (no std distribution), generation options, decode policy defaults, resident request acceptance"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/runtime/decode_policy.h",
  "engine/runtime/gen_options.h",
  "engine/runtime/generation.h",
  "engine/runtime/sampling.h",
  "engine/runtime/sampling_generation.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "sample.next-token/-/f32.crucible"
api       = "sampling.h, sampling_generation.h"
numeric   = "host sampler, portable RNG"
regime    = "per token"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.speculation"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:executor.crucible.flashnext"
reason    = "header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
