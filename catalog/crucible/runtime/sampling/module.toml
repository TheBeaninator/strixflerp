id        = "runtime.crucible.sampling"
kind      = "runtime"
summary   = "Host sampling and generation: Crucible's own portable RNG with no std distribution, a keyed sampling stream so a seeded request draws the same ids at any speculation depth or in a packed pass, generation options shared by the CLI and both serve stacks, user-facing decode defaults (speculation depth 7, the 64k draft head) kept apart from benchmark policies, and acceptance of a resident request's draft only after the serial target verifies it"
why       = "Speculation and batching must not change what a seeded request returns, which a sampler drawing from one shared stream would break; the keyed law is why docs/CRUCIBLE-VS-STRIXITE.md section 2 rates Crucible ahead of strixite's GPU top-20 sampler on reproducibility, and avoiding std distributions keeps the draws identical across standard libraries"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/runtime/decode_policy.h",
  "engine/runtime/gen_options.h",
  "engine/runtime/generation.h",
  "engine/runtime/sampling.h",
  "engine/runtime/sampling_generation.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "sample.next-token/-/f32.crucible"
api       = "sampling.h, sampling_generation.h"
numeric   = "host sampler, portable RNG"
regime    = "per token"

[[requires]]
module    = "executor.crucible.flashnext"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "runtime.crucible.conversation_cache"

[[requires]]
module    = "runtime.crucible.speculation"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (11 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
