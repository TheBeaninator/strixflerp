id        = "executor.crucible.flashnext"
kind      = "executor"
summary   = "Crucible's Qwen3.8-Flash-Next engine as one HIP translation unit (engine/engine.hip includes every header, 642 kernels): the Engine class loads the EXL3 pack, drives one trunk layer loop (RunTrunk) that the prefill, decode, batched and packed-verify forwards all call, and plans a prompt in 4,096-row chunks merged into 16,384-row bulk GEMM launches while the GDN and QSA cores run in 2,048-row parts over a stage arena"
why       = "It is the executor the qwen38-flash-next.crucible recipe builds (executor.model/qwen3.8-flash-next/exl3) and the reason Crucible was harvested: on control-node, on the same token ids as strixite v0.7.0-pod, it prefilled 1.2-1.9x faster (1,667 against 1,399 tok/s at a cold 32K) and decoded level without drafts and 5-16% ahead with them (docs/CRUCIBLE-VS-STRIXITE.md section 0, gate/results/qwen38-flash-next.crucible); docs/CRUCIBLE.md puts about half of the prefill gap on this schedule of fewer, larger launches, which became transfer C1 for strixite and 4.1F for StrixFold"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/engine.hip",
  "engine/model/flashnext/active_config.h",
  "engine/model/flashnext/draft_chain_switch.h",
  "engine/model/flashnext/fixed_state.h",
  "engine/model/flashnext/model.h",
  "engine/model/flashnext/mtp_sidecar.h",
  "engine/model/flashnext/multimodal.h",
  "engine/model/flashnext/prefill_launch.h",
  "engine/model/flashnext/vision.h",
  "engine/runtime/batch_forward.h",
  "engine/runtime/batch_spec_forward.h",
  "engine/runtime/bounds.h",
  "engine/runtime/device_zero.h",
  "engine/runtime/dump_io.h",
  "engine/runtime/layer_loop.h",
  "engine/runtime/prefill_engine.inc",
  "engine/runtime/prefill_front_check.h",
  "engine/runtime/prefill_interleave.h",
  "engine/runtime/prefill_plan_budget.h",
  "engine/runtime/prefill_prune.h",
  "engine/runtime/prefill_rows.h",
  "engine/runtime/prompt.h",
  "engine/runtime/rope_mode.h",
  "engine/runtime/rope_policy.h",
  "engine/runtime/sequence_state.h",
  "engine/runtime/stage_arena.h",
  "engine/runtime/stage_plan.h",
  "engine/switches.h",
]
authors   = ["jaedync"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/engine/engine.hip"]
includes  = ["src/engine", "src/engine/model/flashnext", "src/engine/runtime"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "executor.model/qwen3.8-flash-next/exl3"
api       = "crucible::Engine (engine/engine.hip), Loader (model/flashnext/model.h); driven by the JSON-line protocol of serve.crucible.engine_serve"
numeric   = "per docs/FLASHNEXT_FORWARD.md; CRUCIBLE_EXACT selects the exact numerics mode"
regime    = "one GPU, 1..4 sessions"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "format.crucible.flashnext_weights"

[[requires]]
module    = "format.crucible.ngram16"

[[requires]]
