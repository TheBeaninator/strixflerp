[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (49 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: the whole engine is one translation unit; it builds in the recipe qwen38-flash-next.crucible (origin Makefile), not in the per-module compile gate"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
