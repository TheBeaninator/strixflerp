id        = "format.crucible.flashnext_weights"
kind      = "format"
summary   = "The Qwen3.8-Flash-Next description as compile-time constants (geometry.h: the layer schedule, hidden 2560 and every other named size, no runtime descriptor or virtual dispatch) plus the pure load decisions read from pack headers: each matrix's width, a dense group's front order, the n-gram row width, CPU-only validation of every tensor before allocation, and BF16-to-F16 conversion of tensors the kernels read as F16"
why       = "Crucible serves one model family and keeps dynamic shapes off the hot path on purpose: a named constant costs nothing over the literal it replaces, and a sibling model edits this file and rebuilds (geometry.h, docs/ARCHITECTURE.md 'model/flashnext'); keeping the load plan on the host lets tests/load_plan_test.cpp check it against real pack headers and makes a malformed checkpoint fail before the GPU is touched"

[provenance]
origin    = "crucible"
repo      = "https://github.com/jaedync/crucible-strix-halo"
commit    = "d6af02cd739d554c43a62ef8d0e98b6f59f2dfd7"
branch    = "main"
paths     = [
  "engine/model/flashnext/bf16_half.h",
  "engine/model/flashnext/geometry.h",
  "engine/model/flashnext/load_plan.h",
  "engine/model/flashnext/weight_validation.h",
]
authors   = ["jaedync"]
modified  = false
upstream  = "EXL3 format after ExLlamaV3 d3739fd393337b1ff4d6c2a342b12f0c87a9592f (MIT, Turboderp; catalog/crucible/NOTICE)"

[licence]
spdx      = "Apache-2.0 AND MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/engine", "src/engine/model/flashnext"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "format.layout/exl3-flashnext/-"
api       = "geometry.h, load_plan.h, weight_validation.h"
numeric   = "exact"
regime    = "load time"

[[requires]]
module    = "format.crucible.exl3"

[[requires]]
module    = "kernel.crucible.exl3_gemv"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "via:executor.crucible.flashnext"
reason    = "builds in recipe qwen38-flash-next.crucible on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (13 files named in gate/results/qwen38-flash-next.crucible/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.crucible/build.txt; not run on a GPU from that build; earlier note: header fragment of the one translation unit engine/engine.hip; compiles only inside executor.crucible.flashnext"
evidence  = "gate/results/qwen38-flash-next.crucible/built-modules.json"
