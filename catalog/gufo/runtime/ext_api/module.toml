authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "executor.provider-api/gufo-ext/-"
api       = "gufo::ext (adapter.hpp, registry.hpp, continuation.hpp, draft_backend.hpp, speculative_verifier.hpp)"
numeric   = "n/a"
regime    = "one provider per model family"

[[requires]]
module    = "format.gufo.gguf_kquant"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.cache"

[[requires]]
module    = "runtime.gufo.hip_host"

[[requires]]
module    = "runtime.gufo.image"

[[requires]]
module    = "runtime.gufo.platform"

[[requires]]
module    = "runtime.gufo.sampling"

[[requires]]
module    = "runtime.gufo.speculative"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "c++ host code: built only inside a recipe (phase 3 and later)"
