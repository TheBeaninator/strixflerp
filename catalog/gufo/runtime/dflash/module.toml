id        = "runtime.gufo.dflash"
kind      = "runtime"
summary   = "Host side of gufo's DFlash speculator for Qwen: the draft model's weights and policy, a draft executor that predicts a block of positions in one non-causal forward conditioned on target features, batching across requests, and the backend that hands proposals to the lossless verifier"
why       = "A block drafter lets the target verify several tokens for one pass over its weights, which is what makes DFlash-2 the 27B's fastest mode in gufo (ROCM.md: 25.9 against 12.0 tok/s decode at depth 0; hipfire's GLOSSARY credits the method to Chen et al. 2026). In strixflerp it is harvested host code bound in the gufo recipes as part of the Qwen executor's closure; no flerp recipe drafts with it"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/models/qwen/dflash_policy.hpp",
  "src/models/qwen/dflash_weights.cpp",
  "src/models/qwen/dflash_weights.hpp",
  "src/models/qwen/hip/dflash.hpp",
  "src/models/qwen/hip/dflash/backend.cpp",
  "src/models/qwen/hip/dflash/batch.cpp",
  "src/models/qwen/hip/dflash/executor.cpp",
  "src/models/qwen/hip/dflash/model.cpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "speculation.draft/dflash/f32"
api       = "gufo::models::qwen::hip::dflash"
numeric   = "draft-only numerics"
regime    = "draft block"

[[requires]]
interface = "draft.dflash/gguf-q8_0/f32"

[[requires]]
interface = "speculation.window-verify-lossless/-/-"

[[requires]]
module    = "executor.gufo.qwen"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "runtime.gufo.ext_api"

[[requires]]
module    = "runtime.gufo.mtp"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen36-35b-a3b.flerp-serve-stage on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (21 files named in gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json, from ninja -t deps); log gate/results/qwen36-35b-a3b.flerp-serve-stage/build.txt; not run on a GPU from that build; earlier note: c++ host code: built only inside a recipe (phase 3 and later)"
evidence  = "gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json"
