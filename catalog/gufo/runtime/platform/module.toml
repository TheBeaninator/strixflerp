id        = "runtime.gufo.platform"
kind      = "runtime"
summary   = "Platform leaves (POSIX side): mapped files, page pinning, prefault, publish, sockets, environment, shutdown signal; crypto, logging, diagnostics"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/core/crypto/sha256.cpp",
  "src/core/crypto/sha256.hpp",
  "src/core/diagnostics/allocation_benchmark.cpp",
  "src/core/diagnostics/allocation_benchmark.h",
  "src/core/diagnostics/artifact_validator.cpp",
  "src/core/diagnostics/artifact_validator.h",
  "src/core/diagnostics/bandwidth.cpp",
  "src/core/diagnostics/bandwidth.h",
  "src/core/diagnostics/bandwidth_run.hpp",
  "src/core/diagnostics/compatibility.cpp",
  "src/core/diagnostics/compatibility.h",
  "src/core/diagnostics/fingerprint.cpp",
  "src/core/diagnostics/fingerprint.h",
  "src/core/diagnostics/gpu_queues.cpp",
  "src/core/diagnostics/gpu_queues.h",
  "src/core/diagnostics/linux_sysfs.cpp",
  "src/core/diagnostics/linux_sysfs.h",
  "src/core/diagnostics/report.cpp",
  "src/core/diagnostics/report.h",
  "src/core/diagnostics/system_inventory.cpp",
  "src/core/diagnostics/system_inventory.h",
  "src/core/logging/logging.cpp",
  "src/core/logging/trace.cpp",
  "src/core/logging/trace.hpp",
  "src/core/platform/CMakeLists.txt",
  "src/core/platform/env.cpp",
  "src/core/platform/env.hpp",
  "src/core/platform/fs.hpp",
  "src/core/platform/fs_posix.cpp",
  "src/core/platform/library.cpp",
  "src/core/platform/library.hpp",
  "src/core/platform/mapped_file.cpp",
  "src/core/platform/net.cpp",
  "src/core/platform/net.hpp",
  "src/core/platform/os_info.cpp",
  "src/core/platform/page_pin.hpp",
  "src/core/platform/page_pin_linux.cpp",
  "src/core/platform/pages.hpp",
  "src/core/platform/pages_posix.cpp",
  "src/core/platform/prefault.hpp",
  "src/core/platform/publish.cpp",
  "src/core/platform/publish.hpp",
  "src/core/platform/shutdown_signal.cpp",
  "src/core/platform/shutdown_signal.hpp",
  "src/core/platform/socket.hpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "host.platform/posix/-"
api       = "gufo::platform"
numeric   = "n/a"
regime    = "host"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.sampling"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "c++ host code: built only inside a recipe (phase 3 and later)"
