id        = "runtime.gufo.speculative"
kind      = "runtime"
summary   = "gufo's model-independent speculation framework: the draft-backend interface, prompt-lookup drafts copied from earlier context, and the lossless verifier that accepts a window of up to 16 draft tokens by exact rejection and residual sampling so accepted tokens follow the target distribution, plus the Qwen verifier"
why       = "Speculation is acceptable only if it never changes what would have been sampled, so DFlash and MTP both submit drafts through this one verifier, which calls the device accept kernel of kernel.gufo.qwen_sampling; docs/INTERFACES.md records it as the catalogue's lossless window verify. Bound in the gufo recipes; strixite and hipfire bring their own verifiers"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/core/speculative/draft_backend.hpp",
  "src/core/speculative/prompt_lookup.hpp",
  "src/core/speculative/speculative_verifier.cpp",
  "src/core/speculative/speculative_verifier.hpp",
  "src/models/qwen/hip/qwen_speculative_verifier.cpp",
  "src/models/qwen/hip/qwen_speculative_verifier.hpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "speculation.window-verify-lossless/-/-"
api       = "gufo::core::speculative::SpeculativeVerifier, DraftBackend, PromptLookup"
numeric   = "lossless: accepted tokens follow the target distribution (exact rejection / residual sampling)"
regime    = "draft width 1..16"

[[requires]]
interface = "speculation.accept/-/f32.gufo"

[[requires]]
module    = "executor.gufo.qwen"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.ext_api"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen36-35b-a3b.flerp-serve-stage on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (20 files named in gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json, from ninja -t deps); log gate/results/qwen36-35b-a3b.flerp-serve-stage/build.txt; not run on a GPU from that build; earlier note: c++ host code: built only inside a recipe (phase 3 and later)"
evidence  = "gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json"
