id        = "runtime.gufo.image"
kind      = "runtime"
summary   = "Host image helpers named by gufo's Qwen vision headers: image and pixel types, PNG, JPEG and WebP decoding through libpng, libjpeg and libwebp, fetching an image by URL through libcurl, and resizing"
why       = "It is in the catalogue for a header dependency, not for images: executor.gufo.qwen names these types through the vision headers, so the header must be present, while a text-only recipe compiles none of image.cpp (qwen35-decider-2b.gufo writes a no_image.cpp stand-in) and so keeps four image and network libraries out of the build"
notes     = "Harvested for phase 5: executor.gufo.qwen names these types through the vision headers. A text-only recipe carries the header and does not compile image.cpp."

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = ["src/core/image.cpp", "src/core/image.hpp"]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "media.image-decode-gufo/-/-"
api       = "gufo::core image.hpp"
numeric   = "n/a"
regime    = "host; needs libpng, libjpeg, libwebp and libcurl"

[[requires]]
module    = "runtime.gufo.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "c++ host code: built only inside a recipe (phase 3 and later)"
