id        = "runtime.gufo.hip_host"
kind      = "runtime"
summary   = "gufo's HIP host services: host and managed allocations, heap placement on unified memory, weight upload from mapped files, snapshot transfer between device and host, the hipBLASLt plan database and a bandwidth probe"
why       = "On gfx1151's unified memory, where weights are placed and how they are mapped decides both capacity and bandwidth, so gufo keeps allocation and upload in one place (role inferred from the code). format.flerp.gguf_placed builds per-rank placed loading on its allocators (docs/PHASE5-FOURNODE-DESIGN.md), and the gufo recipes bind device.memory/hip to it"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/core/hip/bandwidth.cpp",
  "src/core/hip/detail/hip_graph_decode_executor.hpp",
  "src/core/hip/hipblaslt_plan_database.cpp",
  "src/core/hip/host_allocations.cpp",
  "src/core/hip/host_allocations.hpp",
  "src/core/hip/weight_upload.cpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "device.memory/hip/-"
api       = "gufo::hip host_allocations, managed_alloc, weight_upload, snapshot_transfer"
numeric   = "n/a"
regime    = "unified memory on gfx1151"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen36-35b-a3b.flerp-serve-stage on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (52 files named in gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json, from ninja -t deps); log gate/results/qwen36-35b-a3b.flerp-serve-stage/build.txt; not run on a GPU from that build; earlier note: c++ host code: built only inside a recipe (phase 3 and later)"
evidence  = "gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json"
