id        = "runtime.gufo.sampling"
kind      = "runtime"
summary   = "gufo's host sampling and constrained decoding: sampler state with penalties kept as unique-token records, a JSON-schema constraint compiled through lexeme and regex compilers into a token matcher, and reasoning and session modes"
why       = "Structured output (a response format with a JSON schema) has to be enforced token by token against the tokenizer, which needs a compiled matcher beside the sampler; the server binds sample.next-token and the grammar to it. Its matching headers sit in kernel.gufo.core_headers because device kernels include the sampling state; strixflerp binds it only within the gufo recipes"
notes     = "The matching .hpp files that kernel translation units include are in kernel.gufo.core_headers."

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/core/cancellable_gate.hpp",
  "src/core/json_constraint.cpp",
  "src/core/json_schema_lexeme.cpp",
  "src/core/json_schema_regex.cpp",
  "src/core/json_schema_regex.hpp",
  "src/core/mapped_prefetch.hpp",
  "src/core/reasoning.hpp",
  "src/core/sampling.cpp",
  "src/core/session_mode.hpp",
  "src/core/text_sampling_defaults.hpp",
  "src/core/utf8.hpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "sample.next-token/-/f32.gufo"
api       = "gufo::sampling::SamplerState"
numeric   = "fp32 logits; penalties as unique-token records"
regime    = "host"

[[provides]]
interface = "grammar.matcher-gufo/-/-"
api       = "gufo::core::JsonConstraint"
numeric   = "n/a"
regime    = "host"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen36-35b-a3b.flerp-serve-stage on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (35 files named in gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json, from ninja -t deps); log gate/results/qwen36-35b-a3b.flerp-serve-stage/build.txt; not run on a GPU from that build; earlier note: c++ host code: built only inside a recipe (phase 3 and later)"
evidence  = "gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json"
