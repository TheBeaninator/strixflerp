id        = "executor.gufo.qwen_vision"
kind      = "executor"
summary   = "gufo's Qwen image input: a ViT tower run on HIP in fp32 over the mmproj GGUF, the device-side image input, a prompt layout that splices image spans into the token stream together with the RoPE positions the text executor reads, and a cache of encoded images"
why       = "Images are a supported input of gufo's Qwen servers, but strixflerp took this module for a build reason: the text executor's header hip/executor.hpp includes vision/device_input.hpp and the origin links the vision library into its 27B target, so executor.gufo.qwen does not compile without it (phase 5 harvest). docs/VISION-DSV41.md weighed it for DSV4.1 vision and found another model's layout"
notes     = "Harvested for phase 5: src/models/qwen/hip/executor.hpp includes vision/device_input.hpp and the origin links gufo_qwen_vision into gufo_qwen27b, so the text executor does not build without it."

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/families/qwen/vision/CMakeLists.txt",
  "src/families/qwen/vision/device_input.hip",
  "src/families/qwen/vision/device_input.hpp",
  "src/families/qwen/vision/encoder.hip",
  "src/families/qwen/vision/encoder.hpp",
  "src/families/qwen/vision/image_cache.cpp",
  "src/families/qwen/vision/image_cache.hpp",
  "src/families/qwen/vision/library.json",
  "src/families/qwen/vision/prompt.cpp",
  "src/families/qwen/vision/prompt.hpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "executor.vision/qwen3.5/gguf"
api       = "gufo::models::qwen::vision (encoder.hpp, device_input.hpp, prompt.hpp, image_cache.hpp)"
numeric   = "fp32 on the mmproj GGUF"
regime    = "solo"

[[requires]]
interface = "format.loader/gguf/-"

[[requires]]
interface = "device.memory/hip/-"

[[requires]]
module    = "executor.gufo.qwen"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "runtime.gufo.image"

[[requires]]
module    = "runtime.gufo.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "c++ host code: built only inside a recipe (phase 3 and later)"
