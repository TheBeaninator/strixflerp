id        = "format.gufo.gguf_kquant"
kind      = "format"
summary   = "gufo's GGUF container reader (mmap; tensors stay in their ggml encoding on the device) and the ggml block layouts it hands kernels: Q8_0 at 32 weights a block, K-quants Q2_K..Q8_K at 256 with packed sub-block scales, the IQ2 grid tables, plus CPU dequantizers and a host quantized GEMM that act as the numerical oracle"
why       = "Every gufo kernel reads raw GGUF blocks and decodes them in-kernel, so this reader and its declared layouts are the one format contract the origin shares; recipes bind format.loader/gguf and format.device-view/gguf-kquant to it (qwen35-decider-2b.gufo, both qwen36-35b-a3b recipes, the gufo swap variants of qwen38-flash-next), format.flerp.gguf_placed builds per-rank placed loading on it, and docs/PHASE5-GLM52-GAPMAP.md notes that a GGUF model needs no transcode through it"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/core/gguf_identity.cpp",
  "src/core/gguf_identity.hpp",
  "src/core/gguf_reader.cpp",
  "src/core/quant/ggml_dequant.cpp",
  "src/core/quant/ggml_gemm.cpp",
  "src/core/quant/ggml_gemm.hpp",
  "src/core/quant/ggml_iq_grids.inc",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false
upstream  = "block layouts and IQ grids after llama.cpp / ggml (MIT, The ggml authors)"

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "format.loader/gguf/-"
api       = "gufo::core::GgufReader, GgmlType"
numeric   = "exact (mmap of the GGUF file; weights stay in their GGUF encoding on the device)"
regime    = "load time"

[[provides]]
interface = "format.device-view/gguf-kquant/-"
api       = "block_q8_0 (QK 32), block_q4_K / q5_K / q6_K / q8_K (QK 256), IQ2_XXS/XS/S grids: src/core/quant/ggml_dequant.hpp"
numeric   = "raw GGUF blocks (layouts declared in src/core/quant/ggml_dequant.hpp, which lives in kernel.gufo.core_headers because kernels include it); ggml_dequant.cpp is the CPU oracle the kernels are compared with"
regime    = "n/a"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen36-35b-a3b.flerp-serve-stage on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (8 files named in gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json, from ninja -t deps); log gate/results/qwen36-35b-a3b.flerp-serve-stage/build.txt; not run on a GPU from that build; earlier note: c++ host code: built only inside a recipe (phase 3 and later)"
evidence  = "gate/results/qwen36-35b-a3b.flerp-serve-stage/built-modules.json"
