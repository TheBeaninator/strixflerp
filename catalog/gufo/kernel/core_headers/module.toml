id        = "kernel.gufo.core_headers"
kind      = "kernel"
summary   = "Header-only layer of gufo's core and public extension API that kernel translation units include: HIP error and launch utilities, the GEMV dispatcher and dispatch telemetry, hipBLASLt plan-database and heap-placement declarations, model config, sampling state and JSON-constraint types, with no code of its own"
why       = "SPEC.md makes headers that several modules include into a module of their own so the include check can see every dependency; all of gufo's kernels and host code include these, so every kernel.gufo.* module and the flerp modules written against gufo (qwen35moe, gguf_placed, moe_sg, moe_kquant, draft_coarse) require it, and it compiles only inside them"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "include/gufo/ext/experimental/managed_alloc.hpp",
  "include/gufo/ext/experimental/snapshot_transfer.hpp",
  "include/gufo/ext/experimental/weight_upload.hpp",
  "include/gufo/ext/host.hpp",
  "include/gufo/ext/platform/mapped_file.hpp",
  "include/gufo/ext/platform/os_info.hpp",
  "include/gufo/ext/sampling.hpp",
  "src/core/gguf_reader.hpp",
  "src/core/hip/detail/dispatch_telemetry.hpp",
  "src/core/hip/detail/gemv_dispatcher.hpp",
  "src/core/hip/detail/hipblaslt_plan_database.hpp",
  "src/core/hip/heap_placement.hpp",
  "src/core/hip/hip_utils.hpp",
  "src/core/hip/libstdcxx_noinline.hpp",
  "src/core/hip/managed_alloc.hpp",
  "src/core/hip/snapshot_copy.hpp",
  "src/core/hip/snapshot_transfer.hpp",
  "src/core/hip/weight_upload.hpp",
  "src/core/json.hpp",
  "src/core/json_constraint.hpp",
  "src/core/json_schema_lexeme.hpp",
  "src/core/logging/logging.hpp",
  "src/core/model_config.hpp",
  "src/core/platform/mapped_file.hpp",
  "src/core/platform/os_info.hpp",
  "src/core/quant/ggml_dequant.hpp",
  "src/core/sampling.hpp",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src", "src/include"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "kernel-abi.gufo-core/-/-"
api       = "src/core/hip/hip_utils.hpp, src/core/hip/detail/*.hpp, include/gufo/ext/*.hpp"
numeric   = "n/a"
regime    = "n/a"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; compiled inside every kernel.gufo.* module"
