  "src/models/qwen38_flash_next/kernels/rocm/mmq/qfn_mmq_prelude.h",
  "src/models/qwen38_flash_next/kernels/rocm/mmq/quantize.hip.cpp",
  "src/models/qwen38_flash_next/kernels/rocm/mmq/quantize.hpp",
