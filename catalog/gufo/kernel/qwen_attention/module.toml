id        = "kernel.gufo.qwen_attention"
kind      = "kernel"
summary   = "Gated grouped-query softmax attention for gufo's Qwen family over a canonical FP16 KV cache: fp32 scores and softmax with a sigmoid output gate, decode split along K into halves merged by log-sum-exp, verification rows grouped by KV partition, batched causal tiles, and masked prefill on WMMA checked against a CPU double-precision reference"
why       = "Attention is the part of decode that grows with context, and gufo's 27B experiment log shows what the variants buy: grouping verification queries by KV partition made eight-token attention 2.95x faster at 32K and raised d32K decode 15.7-20.2%, and paired KV loads cut attention time 12.6%. It runs in the passed qwen35-decider-2b.gufo recipe and the qwen36-35b-a3b recipes, and kernel.flerp.attn_wmma_gqa re-instantiates its WMMA causal kernel for other GQA head counts"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/families/qwen/kernels/attention_batched.hip",
  "src/families/qwen/kernels/attention_decode.hip",
  "src/families/qwen/kernels/attention_decode_graph.hip",
  "src/families/qwen/kernels/attention_decode_verify_wave64.hip",
  "src/families/qwen/kernels/attention_tile.hip",
  "src/families/qwen/kernels/attention_wmma.hip",
  "src/families/qwen/kernels/prefill_unpack.hip",
  "src/families/qwen/kernels/unpack.hip",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/src/families/qwen/kernels/attention_decode.hip",
  "src/src/families/qwen/kernels/attention_decode_graph.hip",
  "src/src/families/qwen/kernels/attention_decode_verify_wave64.hip",
  "src/src/families/qwen/kernels/attention_batched.hip",
  "src/src/families/qwen/kernels/attention_tile.hip",
  "src/src/families/qwen/kernels/attention_wmma.hip",
  "src/src/families/qwen/kernels/unpack.hip",
  "src/src/families/qwen/kernels/prefill_unpack.hip",
]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"
options   = ["-x", "hip", "-std=gnu++20", "-O2", "-UNDEBUG", "-DENGINE_ENABLE_HIP=1", "-c"]
source_options = { "src/src/families/qwen/kernels/attention_decode_verify_wave64.hip" = ["-mwavefrontsize64"] }
variants  = 8

[[provides]]
interface = "attn.softmax-gqa/kv-f16/f32.gufo"
api       = "gufo::hip::LaunchAttention, LaunchCausalDecodeAttention, LaunchBatchedAttention, LaunchBatchedAttentionGemm, LaunchBatchedAttentionTile, LaunchQwenWmmaAttention, LaunchUnpackQG"
numeric   = "K/V canonical FP16 (FP32 in the validation fallback), fp32 scores and softmax, sigmoid gate; split halves exchange partial log-sum-exp; WMMA path validated against a CPU double-precision reference"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound; prefill batches (64..1024 tokens), compute-bound"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
interface = "format.device-view/gguf-kquant/-"

[gate]
parity    = "origin-test:tests/kernels"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.gufo.qwen_attention.json"
