id        = "kernel.gufo.ds4_hc"
kind      = "kernel"
summary   = "DeepSeek V4 Flash hyper-connection fragment (hierarchical composition in DS4's naming): fp32 kernels that split the 4 x 4096 residual row into streams, weight and sum them into a block input and expand the block output back, a fused pre-block chain (norm, mix projection on F16 weights, split, weighted sum) for the supported shape with the separate chain as fallback, and the output and pointwise kernels"
why       = "DSV4 replaces the single residual with four mixed streams, so every block starts and ends with this mixing; the fused pre-block form does it in one launch where the shape allows (role inferred from the code: fewer launches per token at decode). It is a fragment of kernel.gufo.ds4_backend and, in docs/INTERFACES.md's hc.mix table, one of three hyper-connection implementations with qfn_kernels' Flash-Next mix and kernel.hipfire.hc"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/models/deepseek_v4_flash/kernels/rocm/detail/ds4_rocm_hc.hip.hpp",
  "src/models/deepseek_v4_flash/kernels/rocm/detail/ds4_rocm_hc_output_launch.hip.hpp",
  "src/models/deepseek_v4_flash/kernels/rocm/detail/ds4_rocm_output.hip.hpp",
]
authors   = ["antirez (DS4)", "gufo contributors"]
modified  = false
upstream  = "DS4 84cc882352757baf628a1776badf7cc54d584e28 (MIT, see src/.../LICENSE.ds4 and UPSTREAM.md); converted to native ROCm/HIP by gufo"

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = []
includes  = [
  "src",
  "src/src/models/deepseek_v4_flash/kernels/rocm",
  "src/src/models/deepseek_v4_flash/kernels/rocm/detail",
]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "hc.mix/gguf-f16/f32.ds4"
api       = "ds4_gpu_hc_* launchers (resident_api.h)"
numeric   = "fp32 row of 4 x 4096; fused pre-block (norm, mix projection, split, weighted sum) for the supported shape, else the separate chain"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound; prefill batches (64..1024 tokens), compute-bound"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "via:kernel.gufo.ds4_backend"
reason    = "header fragment of one translation unit; compiles only inside kernel.gufo.ds4_backend"
