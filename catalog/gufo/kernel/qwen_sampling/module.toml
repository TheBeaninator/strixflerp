id        = "kernel.gufo.qwen_sampling"
kind      = "kernel"
summary   = "Device-side token selection for gufo's Qwen family: a bounded top-k that keeps tile winners from 1,024-token tiles ordered by float bits then original id (lowest id wins ties, signed zeros equal, non-finite last), penalties, argmax, and lossless speculative acceptance that takes a draft token with the target/draft ratio or else samples the residual distribution"
why       = "Choosing tokens on the device keeps the 248K-wide logit row off the host (role inferred from the code), and gufo's log shows the bounded tile winners cut candidate selection from 125 to 85 us. strixflerp uses LaunchGPUSortLogits behind kernel.flerp.logits_topk_gufo: bit-identical in the logits-topk interface gate and token-identical in the topk-gufo and three-engines recipes, though at 472 us against strixite's 80 us a decode row it buys no speed"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = ["src/families/qwen/kernels/sample.hip"]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/families/qwen/kernels/sample.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"
options   = ["-x", "hip", "-std=gnu++20", "-O2", "-UNDEBUG", "-DENGINE_ENABLE_HIP=1", "-c"]
variants  = 1

[[provides]]
interface = "logits.topk/-/f32.gufo"
api       = "gufo::hip::LaunchGPUSortLogits, LaunchGPUSampling, LaunchGPUArgmax, LaunchBatchedGPUArgmax (ops/token.hpp)"
numeric   = "ordered float bits + original id: radix order with lowest-id ties and signed-zero equivalence; non-finite values sort last"
regime    = "1 row x vocab"

[[provides]]
interface = "speculation.accept/-/f32.gufo"
api       = "gufo::hip::LaunchGPUSpeculativeSampling"
numeric   = "accepts the draft token with the lossless speculative ratio, else samples the residual target-minus-draft distribution"
regime    = "verification rows"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
interface = "format.device-view/gguf-kquant/-"

[gate]
parity    = "flerp:gate/interface/logits-topk.toml"
bench     = "none"
status    = "parity"
compile   = "standalone"
evidence  = "gate/results/interface/logits-topk/result.json"
reason    = "parity: interface gate logits-topk on control-node (result.json, provider gufo: pass; the gate overall pass=True); compile gate evidence gate/results/compile/kernel.gufo.qwen_sampling.json"
