id        = "kernel.gufo.qwen_norm_rope"
kind      = "kernel"
summary   = "Row-wise kernels of the Qwen family: fp32 RMSNorm over a row and per head (x / sqrt(mean(x^2) + eps) * weight), RoPE, a fused per-head Q/K norm plus RoPE plus write into every selected KV representation in one launch, out-of-place residual add, and GGUF embedding lookup, each in single-token and batched forms"
why       = "These are the small memory-bound steps between projections; fusing the Q/K norm, rotation and cache write saves launches and a pass over memory per layer (role inferred from the code). Its LaunchResidualAdd is a provider of the residual-add interface gate: through kernel.flerp.residual_add_gufo it gave the CPU reference's bits on 9 of 9 cases at 2.19 us a decode token, but no recipe takes the swap because strixite's executor fuses its residual adds"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = [
  "src/families/qwen/kernels/embed.hip",
  "src/families/qwen/kernels/norm.hip",
  "src/families/qwen/kernels/prefill_embed.hip",
  "src/families/qwen/kernels/prefill_norm.hip",
  "src/families/qwen/kernels/prefill_residual.hip",
  "src/families/qwen/kernels/prefill_rope.hip",
  "src/families/qwen/kernels/residual.hip",
  "src/families/qwen/kernels/rope.hip",
]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/src/families/qwen/kernels/norm.hip",
  "src/src/families/qwen/kernels/prefill_norm.hip",
  "src/src/families/qwen/kernels/rope.hip",
  "src/src/families/qwen/kernels/prefill_rope.hip",
  "src/src/families/qwen/kernels/residual.hip",
  "src/src/families/qwen/kernels/prefill_residual.hip",
  "src/src/families/qwen/kernels/embed.hip",
  "src/src/families/qwen/kernels/prefill_embed.hip",
]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"
options   = ["-x", "hip", "-std=gnu++20", "-O2", "-UNDEBUG", "-DENGINE_ENABLE_HIP=1", "-c"]
variants  = 8

[[provides]]
interface = "norm.rmsnorm/-/f32.gufo"
api       = "gufo::hip::LaunchRMSNorm, LaunchPerHeadRMSNorm, LaunchBatchedRMSNorm"
numeric   = "out = x / sqrt(mean(x^2) + eps) * weight in fp32; optional BF16 output in the batched form"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound"

[[provides]]
interface = "pos.rope/-/f32.gufo"
api       = "gufo::hip::LaunchRoPE, LaunchBatchedRoPE"
numeric   = "fp32 rotation"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound"

[[provides]]
interface = "attn.qk-norm-rope-store/kv-f16/f32"
api       = "gufo::hip::LaunchFusedQKNormRoPEKvWrite, LaunchBatchedFusedQKNormRoPEKvWrite"
numeric   = "per-head RMSNorm, RoPE and the K/V write into every selected cache representation in one launch"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound"

[[provides]]
interface = "residual.add/-/f32.out-of-place"
api       = "gufo::hip::LaunchResidualAdd, LaunchBatchedResidualAdd"
numeric   = "fp32 add"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound"

[[provides]]
interface = "embed.lookup/gguf-kquant/f32"
api       = "gufo::hip::LaunchEmbeddingLookup, LaunchBatchedEmbeddingLookup"
numeric   = "row dequantized to fp32"
regime    = "decode and MTP/DFlash verification, 1..16 rows, memory-bound"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
interface = "format.device-view/gguf-kquant/-"

[gate]
parity    = "flerp:gate/interface/residual-add.toml"
bench     = "none"
status    = "parity"
compile   = "standalone"
evidence  = "gate/results/interface/residual-add/result.json"
reason    = "parity: interface gate residual-add on control-node (result.json, provider gufo: pass; the gate overall pass=True); compile gate evidence gate/results/compile/kernel.gufo.qwen_norm_rope.json"
