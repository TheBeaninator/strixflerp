id        = "kernel.gufo.qwen_dflash"
kind      = "kernel"
summary   = "Kernels of gufo's DFlash-2 block drafter: a draft-private Q8_0 copy of the BF16 LM head quantized at load, non-causal attention inside the draft block, grouped dynamic convolution, the selector step and SiLU-mul, all draft-only numerics that steer verification and cannot change an emitted token"
why       = "DFlash-2 is the 27B's speculative mode in gufo (ROCM.md's canonical table: 25.9 against 12.0 tok/s decode at depth 0), and a drafter only pays if each block is cheap, hence a Q8_0 head for drafting while the verifier keeps the BF16 head. It backs runtime.gufo.dflash and builds in the gufo recipes; nothing outside gufo uses it"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = ["src/families/qwen/kernels/dflash_kernels.hip"]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/families/qwen/kernels/dflash_kernels.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"
options   = ["-x", "hip", "-std=gnu++20", "-O2", "-UNDEBUG", "-DENGINE_ENABLE_HIP=1", "-c"]
variants  = 1

[[provides]]
interface = "draft.dflash/gguf-q8_0/f32"
api       = "gufo::hip::LaunchDFlashQuantizeBf16ToQ8_0, LaunchDFlashNonCausalAttention*, LaunchDFlashGroupedDynamicConv, LaunchDFlashSelectorStep / Batch, LaunchDFlashSiLUMul (dflash_kernels.hpp)"
numeric   = "draft-only numerics: cannot change an emitted token"
regime    = "draft block, weight-bandwidth bound"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
interface = "format.device-view/gguf-kquant/-"

[gate]
parity    = "origin-test:tests/kernels"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.gufo.qwen_dflash.json"
