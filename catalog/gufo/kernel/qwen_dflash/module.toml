id        = "kernel.gufo.qwen_dflash"
kind      = "kernel"
summary   = "DFlash-2 draft kernels: a draft-private Q8_0 copy of the LM head and the draft graph operators (drafts only steer verification, the verifier still runs the BF16 head)"

[provenance]
origin    = "gufo"
repo      = "https://github.com/neuhaus/gufo"
commit    = "f070a17"
branch    = "rdma"
paths     = ["src/families/qwen/kernels/dflash_kernels.hip"]
authors   = ["gufo contributors", "neuhaus"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/src/families/qwen/kernels/dflash_kernels.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"
options   = ["-x", "hip", "-std=gnu++20", "-O2", "-UNDEBUG", "-DENGINE_ENABLE_HIP=1", "-c"]
variants  = 1

[[provides]]
interface = "draft.dflash/gguf-q8_0/f32"
api       = "gufo::hip::LaunchDFlashQuantizeBf16ToQ8_0, LaunchDFlashNonCausalAttention*, LaunchDFlashGroupedDynamicConv, LaunchDFlashSelectorStep / Batch, LaunchDFlashSiLUMul (dflash_kernels.hpp)"
numeric   = "draft-only numerics: cannot change an emitted token"
regime    = "draft block, weight-bandwidth bound"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
interface = "format.device-view/gguf-kquant/-"

[gate]
parity    = "origin-test:tests/kernels"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.gufo.qwen_dflash.json"
