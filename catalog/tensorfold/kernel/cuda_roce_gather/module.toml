id        = "kernel.tensorfold.cuda_roce_gather"
kind      = "kernel"
summary   = "One-shot small all-gather over RoCE after b12x: one kernel stages the shard in pinned memory and rings a doorbell, a proxy thread RDMA-writes it to every peer per HCA followed by a sequence flag on the same QP, one thread a (peer, HCA) spins on that flag, and a device epoch makes it graph-replayable; plus the rank-order fp32 sum of a reduce-scatter."
why       = "TP decode exchanges are a few KiB and latency-bound; upstream claims 10.4 us against NCCL's 12.3 us at 4 KiB on GB10 with ConnectX-7, and 22.0 against 39.4 us at world 4 behind a switch. docs/TENSORFOLD.md R6 compares it with StrixFold's coll_rdma, which already has this shape, and finds the pod's 12.6 ms gather_a is waiting on the other rank rather than on the wire; read only."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = ["zig/kernels/cuda/rank_sum.cu", "zig/kernels/cuda/roce_gather.cu"]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "collective.allgather-roce/-/f32.tensorfold-cuda"
api       = "roce_gather.cu, rank_sum.cu"
numeric   = "bytes; sum in rank order"
regime    = "TP decode"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source: harvested to read its recipe; not built for gfx1151"
