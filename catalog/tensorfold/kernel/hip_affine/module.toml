id        = "kernel.tensorfold.hip_affine"
kind      = "kernel"
summary   = "A standalone HIP code object holding affine_row4_f32, an exact MLX 4-bit row projection with BF16 activations and output, FP32 sums of 16 inputs a lane in four-product chains and a 32-lane reduction, compiled with -ffp-contract=off so every row reduces the same way for any M, plus two bounded test-load kernels that write only their own scratch."
why       = "It was upstream's first HIP kernel (#463: an opt-in HIP runtime with one exact MLX affine 4-bit projection and no model), and zig/build/hip.zig still compiles it alone for hip-affine-test, which compares its BF16 output with golden hex files bit for bit while the load kernels run on independent streams. Served models use hip_tiles; here it is the smallest compile check of upstream's HIP recipe."
notes     = "The provides interface's -tune tag and the old summary said it serves the affine tuner; hip.zig builds it for hip-affine-test, and the tuner (runtime hip/affine_tune.zig) times the hip_tiles prompt tiles."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = ["zig/kernels/hip/affine.hip"]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/affine.hip"]
includes  = ["src/zig/kernels/hip/"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = [
  "--genco",
  "-D__HIP_PLATFORM_AMD__=1",
  "-DUSE_ROCM=1",
  "-DHIPBLAS_V2",
  "-fPIC",
  "-DCUDA_HAS_FP16=1",
  "-DHIP_ENABLE_WARP_SYNC_BUILTINS=1",
  "-std=c++20",
  "-fno-gpu-rdc",
  "-mno-wavefrontsize64",
  "-ffp-contract=off",
  "-DTF_WAVE=32",
  "-DTF_DOT2_F16=1",
  "-DTF_DOT2_BF16=1",
  "-DTF_SDOT4=1",
  "-DTF_SDOT8=1",
  "-DTF_MATRIX=1",
  "-DTF_DOT2_SIGNED_ZERO=1",
]

[[provides]]
interface = "linear.decode/mlx-affine/f32.tensorfold-tune"
api       = "affine.hip"
numeric   = "fp32"
regime    = "decode rounds (1..N lanes), memory-bound"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "standalone"
