id        = "kernel.tensorfold.hip_quant"
kind      = "kernel"
summary   = "Header-only weight decoders the HIP tiles are instantiated with: MLX affine (BITS-wide codes packed little-endian in 32-bit words, a scale and bias a group of K, codes exact in BF16 and FP16), raw BF16 weights folded with scale 1, activation encoders, and the named MLX and BF16 entry points of each tile (dot2, K-parallel, gfx11 WMMA, skewed, few-row routed, gfx12 WMMA)."
why       = "Upstream splits the decoder from the tile so several weight formats share one set of GEMV and GEMM schedules: the tile owns the walk and fold order, the decoder how a code becomes a value. It is the device view of format.quant's MLX and BF16 tensors; role for the pod inferred from that split: the seam where another format would enter if the tiles were reused."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/hip/quant/act.hpp",
  "zig/kernels/hip/quant/bf16_decoder.hpp",
  "zig/kernels/hip/quant/dense_tiles.hpp",
  "zig/kernels/hip/quant/mlx.hpp",
  "zig/kernels/hip/quant/mlx_decoder.hpp",
  "zig/kernels/hip/quant/mlx_pieces.hpp",
  "zig/kernels/hip/quant/mlx_tiles.hpp",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/zig/kernels/hip/"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.device-view/mlx-affine/-"
api       = "quant/mlx.hpp, mlx_decoder.hpp, mlx_pieces.hpp, mlx_tiles.hpp"
numeric   = "exact dequant (q*scale+bias) in fp32"
regime    = "n/a"

[[provides]]
interface = "format.device-view-tensorfold/bf16/-"
api       = "quant/bf16_decoder.hpp, dense_tiles.hpp"
numeric   = "exact"
regime    = "n/a"

[[requires]]
module    = "kernel.tensorfold.hip_common"

[[requires]]
module    = "kernel.tensorfold.hip_tiles"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; included by the group sources of the other kernel.tensorfold.hip_* modules"
