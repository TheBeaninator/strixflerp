  "zig/kernels/cuda/flashnext_attn_lanes.cuh",
  "zig/kernels/cuda/flashnext_batch.cu",
  "zig/kernels/cuda/flashnext_fact.cu",
  "zig/kernels/cuda/flashnext_fexp.cu",
  "zig/kernels/cuda/flashnext_gdn.cu",
  "zig/kernels/cuda/flashnext_gdn_fused.cuh",
  "zig/kernels/cuda/flashnext_gdn_lanes.cuh",
  "zig/kernels/cuda/flashnext_gdn_tpr.cuh",
  "zig/kernels/cuda/flashnext_hc.cu",
  "zig/kernels/cuda/flashnext_hc_dense.cuh",
  "zig/kernels/cuda/flashnext_hcf.cu",
  "zig/kernels/cuda/flashnext_mtp.cu",
  "zig/kernels/cuda/flashnext_pages.cuh",
  "zig/kernels/cuda/flashnext_qsa_tile.cuh",
  "zig/kernels/cuda/flashnext_train.cu",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
