id        = "kernel.tensorfold.cuda_flashnext"
kind      = "kernel"
summary   = "Flash Next CUDA kernels: Gated DeltaNet as a fused kernel a value head (four producer warps staging, eight chain warps stepping and norming) plus lane and threads-a-row forms with the same bits, the QSA indexer's pooling and scores, sparse attention lanes, hyper-connection and n-gram glue, #952's factored-arithmetic prompt GEMM and g32 experts, MTP draft scoring and Living Weights input gradients."
why       = "It is upstream's GB10 implementation of the model the pod serves through strixite and Crucible, so its GDN and QSA work mappings can be compared kernel by kernel with theirs; the HIP family uses hip_flashnext and hip_recurrence instead. As with all cuda_* modules it is reading material, not a build input."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/cuda/flashnext_attn.cu",
  "zig/kernels/cuda/flashnext_attn_lanes.cuh",
  "zig/kernels/cuda/flashnext_batch.cu",
  "zig/kernels/cuda/flashnext_fact.cu",
  "zig/kernels/cuda/flashnext_fexp.cu",
  "zig/kernels/cuda/flashnext_gdn.cu",
  "zig/kernels/cuda/flashnext_gdn_fused.cuh",
  "zig/kernels/cuda/flashnext_gdn_lanes.cuh",
  "zig/kernels/cuda/flashnext_gdn_tpr.cuh",
  "zig/kernels/cuda/flashnext_hc.cu",
  "zig/kernels/cuda/flashnext_hc_dense.cuh",
  "zig/kernels/cuda/flashnext_hcf.cu",
  "zig/kernels/cuda/flashnext_mtp.cu",
  "zig/kernels/cuda/flashnext_pages.cuh",
  "zig/kernels/cuda/flashnext_qsa_tile.cuh",
  "zig/kernels/cuda/flashnext_train.cu",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "mixer.gdn/-/f32.tensorfold-cuda"
api       = "flashnext_gdn.cu, flashnext_gdn_fused.cuh, flashnext_gdn_lanes.cuh, flashnext_gdn_tpr.cuh"
numeric   = "fp32 state"
regime    = "decode and prefill"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source: harvested to read its recipe; not built for gfx1151"
