id        = "kernel.tensorfold.cuda_nemotron"
kind      = "kernel"
summary   = "Nemotron 3.5 hybrid CUDA kernels: Mamba mixer, latent MoE, routing, attention, keyed sampling ops"

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/cuda/nemotron_attention.cu",
  "zig/kernels/cuda/nemotron_keyed.cu",
  "zig/kernels/cuda/nemotron_latent.cu",
  "zig/kernels/cuda/nemotron_mamba.cu",
  "zig/kernels/cuda/nemotron_ops.cu",
  "zig/kernels/cuda/nemotron_route.cu",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "mixer.mamba2/-/f32.tensorfold-cuda"
api       = "nemotron_mamba.cu"
numeric   = "fp32 state"
regime    = "decode and prefill"

[[provides]]
interface = "moe.experts-decode/nvfp4/f32.tensorfold-nemotron"
api       = "nemotron_latent.cu, nemotron_route.cu"
numeric   = "fp32"
regime    = "decode rounds (1..N lanes), memory-bound"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source: harvested to read its recipe; not built for gfx1151"
