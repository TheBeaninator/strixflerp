id        = "kernel.tensorfold.cuda_nemotron"
kind      = "kernel"
summary   = "Nemotron-H CUDA kernels: the Mamba-2 conv and scan with a state that lags a window and replays its kept rows first in the same loop body, 512-key attention chunks merged in absolute order, fp32 router logits in K slices, latent MoE glue summing routed pairs by share then by pick, and fp64 top-K shares for ranking MTP candidates."
why       = "Upstream's CUDA path for the hybrid model the pod could serve through nemotron/hip; its comments show how a recurrent model's row bits are kept independent of where the window falls, the same requirement hip_recurrence meets on HIP."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/cuda/nemotron_attention.cu",
  "zig/kernels/cuda/nemotron_keyed.cu",
  "zig/kernels/cuda/nemotron_latent.cu",
  "zig/kernels/cuda/nemotron_mamba.cu",
  "zig/kernels/cuda/nemotron_ops.cu",
  "zig/kernels/cuda/nemotron_route.cu",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "mixer.mamba2/-/f32.tensorfold-cuda"
api       = "nemotron_mamba.cu"
numeric   = "fp32 state"
regime    = "decode and prefill"

[[provides]]
interface = "moe.experts-decode/nvfp4/f32.tensorfold-nemotron"
api       = "nemotron_latent.cu, nemotron_route.cu"
numeric   = "fp32"
regime    = "decode rounds (1..N lanes), memory-bound"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source: harvested to read its recipe; not built for gfx1151"
