id        = "kernel.tensorfold.cuda_dsv41"
kind      = "kernel"
summary   = "Upstream's DeepSeek-V4.1 CUDA kernels, mostly copies from the Python 0.6.6 engine: compressed sparse attention with a split-K cluster kernel, the hyper-connection mix (mHC) with prefetch and a parallel tail, a narrow router GEMV, SWA KV glue bit-exact with the AOT Triton ops, word-copy KV exchange splits, the Engram gate, torch-exact prefill glue and L2 prefetch and pacing."
why       = "These are the layers StrixFold runs on HIP (sparse_attn, mhc_mix, moe_gate), written instead for GB10, so they show other work mappings for the pod's DeepSeek profile; docs/TENSORFOLD.md section 5 names mhc_pf.cu, l2pf.cu and l2pace.cu as reading for StrixFold's mhc_mix. Never compiled here."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/cuda/deepseek_v41/attn_cuda.cu",
  "zig/kernels/cuda/deepseek_v41/attn_split.cuh",
  "zig/kernels/cuda/deepseek_v41/engram_gate.cu",
  "zig/kernels/cuda/deepseek_v41/glue.cu",
  "zig/kernels/cuda/deepseek_v41/kv_glue.cu",
  "zig/kernels/cuda/deepseek_v41/kvsplit.cu",
  "zig/kernels/cuda/deepseek_v41/l2pace.cu",
  "zig/kernels/cuda/deepseek_v41/l2pf.cu",
  "zig/kernels/cuda/deepseek_v41/mhc_cuda.cu",
  "zig/kernels/cuda/deepseek_v41/mhc_pf.cu",
  "zig/kernels/cuda/deepseek_v41/mhc_tail.cuh",
  "zig/kernels/cuda/deepseek_v41/pointwise.cu",
  "zig/kernels/cuda/deepseek_v41/prefill_glue.cu",
  "zig/kernels/cuda/deepseek_v41/router_gemv.cu",
  "zig/kernels/cuda/deepseek_v41/router_glue.cu",
  "zig/kernels/cuda/deepseek_v41/router_narrow.cuh",
  "zig/kernels/cuda/deepseek_v41/sampling.cu",
  "zig/kernels/cuda/deepseek_v41/topk_b.cu",
  "zig/kernels/cuda/deepseek_v41/topk_cuda.cu",
  "zig/kernels/cuda/deepseek_v41/topk_keys.cu",
]
authors   = ["TensorFold contributors"]
modified  = false
upstream  = "DeepSeek-V4.1 CUDA sources (THIRD_PARTY_NOTICES.md \"DeepSeek-V4.1 CUDA sources\")"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "cuda"
sources   = []
includes  = []
arch      = "gfx1151"

[[provides]]
interface = "attn.sparse-sink/kv-fp8/f32.tensorfold-cuda"
api       = "deepseek_v41/attn_cuda.cu, attn_split.cuh, kvsplit.cu"
numeric   = "fp32 softmax"
regime    = "decode and prefill"

[[provides]]
interface = "hc.mix/bf16/f32.tensorfold-cuda"
api       = "deepseek_v41/mhc_cuda.cu, mhc_pf.cu, mhc_tail.cuh"
numeric   = "fp32"
regime    = "decode and prefill"

[[provides]]
interface = "moe.router/-/f32.tensorfold-cuda"
api       = "deepseek_v41/router_gemv.cu, router_glue.cu, router_narrow.cuh"
numeric   = "fp32"
regime    = "all"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "CUDA source: harvested to read its recipe; not built for gfx1151"
