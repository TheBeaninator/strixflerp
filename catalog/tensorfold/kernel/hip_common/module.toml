id        = "kernel.tensorfold.hip_common"
kind      = "kernel"
summary   = "Header-only HIP basics for RDNA2 through RDNA4: arch switches from the build's TF_* caps (wave32, FP16 and BF16 dot2, sdot4/8, gfx11 versus gfx12 WMMA; RDNA1 refused), the 128-bit load vector, Dot plug-ins whose x pair comes from a quad lane by DPP, gfx11 WMMA fragments, and the columns-controls contract header."
why       = "Upstream's tiles are templates over a Dot unit, so one GEMV or GEMM body compiles to dot2 on RDNA2 and to WMMA on RDNA3 and 4 by swapping these headers, and kernels test capabilities, never a gfx name. Every other hip_* module includes it, which is why it stands alone (SPEC section 5's rule for shared headers)."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/hip/columns_controls.hpp",
  "zig/kernels/hip/common/arch.hpp",
  "zig/kernels/hip/common/dot2.hpp",
  "zig/kernels/hip/common/vec.hpp",
  "zig/kernels/hip/common/wmma.hpp",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/zig/kernels/hip/"]
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "kernel-abi.tensorfold-hip/-/-"
api       = "common/arch.hpp, vec.hpp, dot2.hpp, wmma.hpp"
numeric   = "n/a"
regime    = "n/a"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; included by the group sources of the other kernel.tensorfold.hip_* modules"
