id        = "kernel.tensorfold.cuda_experts"
kind      = "kernel"
summary   = "CUDA MoE expert kernels: MLX affine experts at 4 bits and at 3 bits rebuilt from bit planes, NVFP4 experts (including the block-scaled FP4 mma on sm_121a and GLM's block-32 form) and FP8 experts in decode and prompt forms, an expert-rows kernel whose row bits ignore the window, softmax or sigmoid top-k routing glue and a tile-2 BF16 lane GEMV."
why       = "These are how upstream's CUDA families run routed experts with a row's result independent of the round it lands in, the property exact verify windows need. Kept as recipes to read: the bit-plane 3-bit rebuild and the window-invariant expert rows are shapes a HIP expert kernel could take over; nothing here compiles them."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/cuda/ck_experts.cu",
  "zig/kernels/cuda/ck_lane.cu",
  "zig/kernels/cuda/experts.cu",
  "zig/kernels/cuda/experts.cuh",
  "zig/kernels/cuda/experts3.cu",
  "zig/kernels/cuda/experts3.cuh",
  "zig/kernels/cuda/experts3_prefill.cu",
  "zig/kernels/cuda/experts_pack.cu",
  "zig/kernels/cuda/experts_prefill.cu",
  "zig/kernels/cuda/experts_rows.cu",
  "zig/kernels/cuda/fp8_experts.cu",
  "zig/kernels/cuda/lane_gemv.cu",
  "zig/kernels/cuda/moe.cu",
  "zig/kernels/cuda/moe_glue.cu",
  "zig/kernels/cuda/nvfp4_experts.cu",
  "zig/kernels/cuda/nvfp4_experts32.cu",
  "zig/kernels/cuda/nvfp4_experts_tile.cu",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
