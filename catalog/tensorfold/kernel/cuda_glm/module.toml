id        = "kernel.tensorfold.cuda_glm"
kind      = "kernel"
summary   = "GLM-5.3-Flash CUDA kernels: the KDA mixer (fixed-shape delta-rule steps on 4x4 blocks of an fp32 state), the DSA indexer's pool scores and per-row top-K pools by a sampled floor and radix select, MLA latent absorb and expand, hand-written glue reproducing the Python family's Triton PTX math, row-stable tensor-core linears and the DFlash2 drafter."
why       = "Upstream has no HIP KDA or DSA indexer, so these files are the only code a GLM-5.3-Flash HIP port would start from (docs/TENSORFOLD.md section 4: port glm_kda.cu and the indexer onto StrixFold's TP2 collectives). Nothing in the pod's plans asks for that port today; kept to read, never built."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/kernels/cuda/glm_dflash.cu",
  "zig/kernels/cuda/glm_glue.cu",
  "zig/kernels/cuda/glm_glue_attn.cuh",
  "zig/kernels/cuda/glm_glue_bmm.cuh",
  "zig/kernels/cuda/glm_glue_hc.cuh",
  "zig/kernels/cuda/glm_glue_index.cuh",
  "zig/kernels/cuda/glm_glue_latent.cuh",
  "zig/kernels/cuda/glm_glue_moe.cuh",
  "zig/kernels/cuda/glm_glue_norm.cuh",
  "zig/kernels/cuda/glm_glue_router.cuh",
  "zig/kernels/cuda/glm_glue_rows.cuh",
  "zig/kernels/cuda/glm_index.cu",
  "zig/kernels/cuda/glm_index_pools.cuh",
  "zig/kernels/cuda/glm_index_scores.cuh",
  "zig/kernels/cuda/glm_kda.cu",
  "zig/kernels/cuda/glm_mm.cu",
  "zig/kernels/cuda/glm_ops.cu",
  "zig/kernels/cuda/glm_quant.cu",
  "zig/kernels/cuda/glm_router_mma.cuh",
  "zig/kernels/cuda/glm_swiglu.cuh",
  "zig/kernels/cuda/glm_triton.cuh",
  "zig/kernels/cuda/glm_vision.cu",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
