id        = "runtime.tensorfold.prompt_cache"
kind      = "runtime"
summary   = "Exact prompt reuse: states keyed by tokens and canonical decoded intervals through their position, kept at prompt-pass chunk ends; Imprint writes them to disk behind an index so a learned harness state outlives the server; staggered segments on their own queues equal serial chunks; and a 400 ms keep-alive stops macOS unwiring an idle model."
why       = "An agent harness resends the same long prefix every turn, and restoring a bit-exact state skips that prefill without changing a single output token. StrixFold's Imprint states come from the older runtime.strixfold.prompt_cache (1,877 lines behind on six files); upstream's indexed Imprint lookup (#2351, 0.02-0.04 us finds at 100,000 states) is the kind of fix worth diffing for."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/core/keepalive.zig",
  "zig/src/core/prompt_cache.zig",
  "zig/src/core/prompt_cache_test.zig",
  "zig/src/core/prompt_imprint.zig",
  "zig/src/core/prompt_imprint_test.zig",
  "zig/src/core/segments.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "cache.prompt-tensorfold/-/-"
api       = "core/prompt_cache.zig, prompt_imprint.zig"
numeric   = "exact reuse"
regime    = "chunk-end granularity"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
