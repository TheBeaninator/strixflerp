id        = "runtime.tensorfold.engine_host"
kind      = "runtime"
summary   = "The native server's HIP engine host: a registry of families (qwen3_5 dense and MoE, flashnext, nemotron, glm_ocr, qwen3, dots.mocr, Nemotron Parse, LightOnOCR) read from each family's namespace with its refusals and offer, which opens the GPU, policy, TP group, round loop and lane host, with memory admission arithmetic and kept prompt states given half the room under the cap (16 GiB floor)."
why       = "It is the one place that decides which checkpoints a HIP server can open and refuses the rest before any weight loads; docs/TENSORFOLD.md reads upstream's HIP model list from its hip.zig. StrixFold forked an early engine_host (four of these paths, now 1,604 lines apart) and its recipes still run that fork."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/native/cache_fit.zig",
  "zig/src/native/cuda_memory.zig",
  "zig/src/native/draft_sources_hip_test.zig",
  "zig/src/native/hip.zig",
  "zig/src/native/hip_families.zig",
  "zig/src/native/none.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "executor.host-tensorfold/hip/-"
api       = "native/hip.zig registry, native/hip_families.zig"
numeric   = "n/a"
regime    = "one engine a process"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
