id        = "runtime.tensorfold.hip_comm"
kind      = "runtime"
summary   = "The HIP tensor-parallel group: RCCL opened by dlopen through hand-declared exports for collectives on the engine's own streams, a TCP link where rank 0 listens, checks every rank's hello and then commands, an identity digest of executable, config.json, weight index and shards, and a loopback group of threads over 127.0.0.1 for host tests."
why       = "Upstream's #655 split Qwen3.5 over 2, 4 or 8 GPUs and made every rank match rank 0's world size, GPU, RCCL version, executable and checkpoint before RCCL starts, else all ranks refuse naming the difference; this module is that join. It corresponds to StrixFold's coll_tcp and coll_nccl and is kept for comparison."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/hip/comm/group.zig",
  "zig/src/hip/comm/identity.zig",
  "zig/src/hip/comm/link.zig",
  "zig/src/hip/comm/link_test.zig",
  "zig/src/hip/comm/loopback.zig",
  "zig/src/hip/comm/rccl.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "collective.interface-tensorfold-hip/-/-"
api       = "hip/comm/group.zig, rccl.zig, link.zig, loopback.zig, identity.zig"
numeric   = "bytes"
regime    = "TP on one host or over links"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
