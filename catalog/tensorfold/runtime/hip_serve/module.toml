id        = "runtime.tensorfold.hip_serve"
kind      = "runtime"
summary   = "What every HIP family's lane backend shares beside its kernels: device draws (argmax for greedy rows, a keyed draw over top_k + MARGIN candidates otherwise), 64-position KV pages whose ids and holders live on the host, prompt-cache prefix copies and snapshot slots, cancellation at tower checkpoints, load-time costs for the draft depth rule, and the TP step protocol in which rank 0 decides and followers apply."
why       = "Lifting these out of the families means a new HIP family writes only its forward and its offer, while prompt caching, draft pricing and TP behave the same in all of them. It is the glue between runtime.tensorfold.lanes and a family."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/hip_serve/backend.zig",
  "zig/src/hip_serve/cancel.zig",
  "zig/src/hip_serve/costs.zig",
  "zig/src/hip_serve/draw.zig",
  "zig/src/hip_serve/offer.zig",
  "zig/src/hip_serve/options.zig",
  "zig/src/hip_serve/pages.zig",
  "zig/src/hip_serve/prefix.zig",
  "zig/src/hip_serve/protocol.zig",
  "zig/src/hip_serve/sample.zig",
  "zig/src/hip_serve/serve.zig",
  "zig/src/hip_serve/snapshots.zig",
  "zig/src/hip_serve/vision.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "serve.engine-tensorfold-hip/-/-"
api       = "hip_serve/serve.zig, backend.zig"
numeric   = "n/a"
regime    = "serving"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
