id        = "tool.tensorfold.zig_build"
kind      = "tool"
summary   = "Build graph of upstream's HIP half: root build.zig and build.zig.zon, zig/build/hip.zig compiling 16 kernel groups with hipcc --genco for -Dhip-arch and embedding each code object, the per-arch caps switches, the kernel-contract binary with its controls' code object, LightOnOCR's module, and the pinned Zig 0.17.0."
why       = "ORIGIN.toml's [compile] recipe (flags, strict IEEE sources, one code object a group) was read from this file, so it is the authority on how the hip_* modules must be compiled to match upstream. What the StrixFold recipes build with is tool.strixfold.zig_build, a 701-line-different ancestor of three of these files."
notes     = "zig/build is ignored by this repository's .gitignore (build/); the files are tracked with git add -f, as StrixFold's are."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  ".zig-version",
  "build.zig",
  "build.zig.zon",
  "zig/build/hip.zig",
  "zig/build/hip_contract.zig",
  "zig/build/lighton_hip.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "build.graph-tensorfold/zig/-"
api       = "zig build (hip half: zig/build/hip.zig)"
numeric   = "n/a"
regime    = "build time"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
