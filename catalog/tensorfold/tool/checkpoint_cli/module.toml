id        = "tool.tensorfold.checkpoint_cli"
kind      = "tool"
summary   = "The tensorfold checkpoint subcommands: models lists the Hugging Face cache checkpoints a registered Zig family can serve, info prints one checkpoint's family, format, context, weight size and memory floor, and pull downloads a repo into the cache the Python 0.6.6 engine uses, resumable and verified."
why       = "It tells an operator before a server starts whether a checkpoint is servable and how much memory it needs. Its StrixFold twin (tool.strixfold.checkpoint_cli) lags it by 992 changed lines over the same five files."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/cli/cli.zig",
  "zig/src/cli/hub.zig",
  "zig/src/cli/info.zig",
  "zig/src/cli/models.zig",
  "zig/src/cli/pull.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "tool.checkpoint-cli-tensorfold/-/-"
api       = "cli/cli.zig"
numeric   = "n/a"
regime    = "host"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
