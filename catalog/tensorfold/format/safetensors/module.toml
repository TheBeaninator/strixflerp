id        = "format.tensorfold.safetensors"
kind      = "format"
summary   = "Upstream's checkpoint readers: safetensors JSON headers (names, dtypes, shapes, byte ranges) with read-only maps, a model folder's shards as one namespace that refuses leftover tensors, positional O_DIRECT reads of 4 KiB-aligned spans into aligned buffers, and NumPy .npy files of versions 1 to 3."
why       = "Every upstream backend indexes its weights through these four files. format.strixfold.safetensors, which the StrixFold recipes run, holds the same paths ten releases earlier (796 changed lines, none identical), so this copy is the one to diff when a reader fix is worth pulling."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/core/checkpoint.zig",
  "zig/src/core/direct_io.zig",
  "zig/src/core/npy.zig",
  "zig/src/core/safetensors.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.reader-tensorfold/safetensors/-"
api       = "core/safetensors.zig, checkpoint.zig"
numeric   = "exact"
regime    = "load time"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
