id        = "format.tensorfold.quant"
kind      = "format"
summary   = "Host weight formats behind one conforms interface: MLX affine (i32 words of 2- to 8-bit codes, a scale and bias a group of K, checked geometry, exact widening to more bits or smaller groups), BF16/FP16/FP32 kept as stored, block FP8 and NVFP4 with fp64 references, canonical per-projection override keys and byte-exact tensor-parallel row, column and expert cuts."
why       = "Every upstream HIP family reads its MLX affine or BF16 checkpoint through this module, and nothing above it names a format; the hip_quant decoders read the device views uploaded from it. For the pod it is the loader of the MLX packs upstream qualified on gfx1151, a format neither strixite nor StrixFold reads."

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/core/quant/bf16.zig",
  "zig/src/core/quant/convert.zig",
  "zig/src/core/quant/dense.zig",
  "zig/src/core/quant/exact_test.zig",
  "zig/src/core/quant/experts.zig",
  "zig/src/core/quant/fp8.zig",
  "zig/src/core/quant/keys.zig",
  "zig/src/core/quant/mlx.zig",
  "zig/src/core/quant/mlx_affine.zig",
  "zig/src/core/quant/mlx_affine_test.zig",
  "zig/src/core/quant/mlx_checkpoint_test.zig",
  "zig/src/core/quant/mlx_geometry.zig",
  "zig/src/core/quant/mlx_geometry_test.zig",
  "zig/src/core/quant/nvfp4.zig",
  "zig/src/core/quant/quant.zig",
  "zig/src/core/quant/slice.zig",
  "zig/src/core/quant/types.zig",
  "zig/src/core/quant/widen.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.loader/mlx-affine/-"
api       = "core/quant/mlx_affine.zig, convert.zig, experts.zig"
numeric   = "exact"
regime    = "load time"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
