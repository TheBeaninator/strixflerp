id        = "format.tensorfold.quant"
kind      = "format"
summary   = "Checkpoint quant formats on the host: MLX affine, BF16, FP8, dense and expert packing, conversion, cache keys"

[provenance]
origin    = "tensorfold"
repo      = "https://github.com/ashhart/TensorFold"
commit    = "000b534a284524bbe9a4cc1f3e8996baf80af754"
branch    = "main"
paths     = [
  "zig/src/core/quant/bf16.zig",
  "zig/src/core/quant/convert.zig",
  "zig/src/core/quant/dense.zig",
  "zig/src/core/quant/exact_test.zig",
  "zig/src/core/quant/experts.zig",
  "zig/src/core/quant/fp8.zig",
  "zig/src/core/quant/keys.zig",
  "zig/src/core/quant/mlx.zig",
  "zig/src/core/quant/mlx_affine.zig",
  "zig/src/core/quant/mlx_affine_test.zig",
  "zig/src/core/quant/mlx_checkpoint_test.zig",
  "zig/src/core/quant/mlx_geometry.zig",
  "zig/src/core/quant/mlx_geometry_test.zig",
  "zig/src/core/quant/nvfp4.zig",
  "zig/src/core/quant/quant.zig",
  "zig/src/core/quant/slice.zig",
  "zig/src/core/quant/types.zig",
  "zig/src/core/quant/widen.zig",
]
authors   = ["TensorFold contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"

[[provides]]
interface = "format.loader/mlx-affine/-"
api       = "core/quant/mlx_affine.zig, convert.zig, experts.zig"
numeric   = "exact"
regime    = "load time"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "zig: harvested as data; not assembled (no tensorfold recipe yet)"
