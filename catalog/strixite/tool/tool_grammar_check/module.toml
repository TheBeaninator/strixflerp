id      = "tool.strixite.tool_grammar_check"
kind    = "tool"
summary = "Host-only test of the tool-call grammar through the matcher: well-formed calls and free text are accepted, the malformed shapes a steered agent produced are refused, tool_choice required and named behave, every accepted call parses, and with tokenizer.json the StructuredOutput masks let only the tag tokens open and close a call"
why     = "Comes with the tool-call grammar commits (1f541c7..d19945e) that the fleet's strix_server.v070tg was built from; the grammar stops an agent's broken calls at decode time, so a mask that admitted a bad shape or blocked a legal one would break agents fleet-wide. Only the plain strixite recipe builds it (unit-tool_grammar_check.txt: PASS, 0 failures)"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/tool_grammar_check.cpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/tool_grammar_check.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.tool-grammar-check/-/-"
api       = "main (tool_grammar_check)"
numeric   = "n/a"
regime    = "host only test; tool_grammar_check <tokenizer.json>"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.grammar"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.output_parser"

[[requires]]
module = "runtime.strixite.structured_output"

[[requires]]
module = "runtime.strixite.token_mask"

[[requires]]
module = "runtime.strixite.tokenizer"

[[requires]]
module = "runtime.strixite.tool_grammar"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
