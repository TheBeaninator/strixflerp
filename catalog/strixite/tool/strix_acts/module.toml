id      = "tool.strixite.strix_acts"
kind    = "tool"
summary = "Runs each prompt of each named set alone from an empty session (or from an imported cache entry plus a short suffix) and averages chosen token rows at per-layer probe points (residual out, attn_in, mlp_in, mixer, moe) through Qwen4ExpProbe, writing float32 [layers][cols] means per set and point"
why     = "Steering directions are differences of mean activations between prompt sets (STEER-1), so the pod needed the engine itself, with its served precision and KV format, to produce those means; taking them from the same probe hook the golden suites read keeps them consistent with what steer_library later adds. The vector arithmetic stays in Python outside the tool"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/strix_acts.cpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/strix_acts.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.strix-acts/-/-"
api       = "main (strix_acts)"
numeric   = "n/a"
regime    = "needs the GPU"

[[requires]]
module = "executor.strixite.qwen4exp"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "runtime.strixite.bf16"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.tokenizer"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
