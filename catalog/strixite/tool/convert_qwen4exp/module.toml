id      = "tool.strixite.convert_qwen4exp"
kind    = "tool"
summary = "Offline converter from the Qwen3.8-Flash-Next HF safetensors to weights.strixw: each weight class is quantized to the format --layout names (the served layout: 4-bit experts, 8-bit shared parts) and laid out the way the kernels read it, with --plan to print every output tensor, --layers for partial files, --mtp-from to swap the draft head, and --vision/--tower-only for an exact-BF16 vision.strixw"
why     = "strixite ships the converter so anyone holding the 360 GB original can rebuild the exact files it serves in about fifteen minutes, check the published weights against Qwen's release, or try other bit layouts (docs/tools.md, 'Why the converters are included at all'); at load the server then only maps the file. Built in every strixite Qwen3.8 recipe beside the server"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/convert_qwen4exp.cpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/convert_qwen4exp.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.convert-qwen4exp/-/-"
api       = "main (convert_qwen4exp)"
numeric   = "n/a"
regime    = "host only"

[[requires]]
interface = "format.convert/strixw/-"

[[requires]]
module = "runtime.strixite.args"

[[requires]]
module = "runtime.strixite.json"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
