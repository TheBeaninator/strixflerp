id      = "tool.strixite.omf_seg"
kind    = "tool"
summary = "Batch driver for session-state experiments: one model load, then a JSON jobs file of reset, forward, export, import and probe steps on a Qwen4ExpSession, where probe measures teacher-forced NLL and greedy output and restores the state, and states are the prompt cache's own file bytes, transformed outside the tool in Python"
why     = "Written for the pod's OMF research (OMF-R3, card 3fa039212b) on compressing or editing K/V and recurrent state: quantizing, pruning, dropping or RoPE-rebasing segments needs many export/transform/import/measure rounds, and paying a model load per round would make the sweeps impractical. Built in the strixite Qwen3.8 recipes; not part of serving"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/omf_seg.cpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/omf_seg.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.omf-seg/-/-"
api       = "main (omf_seg)"
numeric   = "n/a"
regime    = "needs the GPU"

[[requires]]
module = "executor.strixite.qwen4exp"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
interface = "linear.decode/strixw-q8/bf16"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.tokenizer"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
