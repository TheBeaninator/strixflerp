id      = "tool.strixite.strix_vision"
kind    = "tool"
summary = "Runs one image through the engine's own vision path (decode, smart_resize, normalize, patchify, the GPU vision tower, the merger) and writes the [N, 2560] BF16 embeddings an image prefill splices in; --golden compares every stage with HF dumps, passing a stage at <= 1.5x the HF BF16-vs-FP32 gap, and --bench times encoding across image sizes"
why     = "Vision was added in strixite v0.3.0 and a mismatch could sit in preprocessing, position-embedding interpolation or the tower's precision; the per-stage gate against HF (never against the engine) names which stage drifted, and pixel_values is checked apart so preprocessing errors are not blamed on rounding. Built in the strixite Qwen3.8 recipes"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/strix_vision.cpp", "tools/vision_batch_test.sh", "tools/vision_check.py"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/strix_vision.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.strix-vision/-/-"
api       = "main (strix_vision)"
numeric   = "n/a"
regime    = "needs the GPU and vision.strixw"

[[requires]]
module = "executor.strixite.vision_tower"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
interface = "norm.rmsnorm-zc/-/bf16"

[[requires]]
interface = "norm.rmsnorm-gated/-/bf16"

[[requires]]
interface = "vision.tower-ops/bf16/bf16"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.device_buffer"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.vision_preprocess"

[[requires]]
module = "runtime.strixite.vision_request"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
