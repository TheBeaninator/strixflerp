id      = "tool.strixite.transcode_ngram_table"
kind    = "tool"
summary = "Streams a BF16 ngram.table and re-encodes it as int8 rows with a BF16 scale per row (q8) or as E4M3 with one table scale of absmax/448 (fp8) on every core, then verifies sampled rows bit for bit through the runtime reader and prints median, p99 and max relative row error"
why     = "The full table is 95 GiB; the rows are small enough that 8 bits with a per-row scale lands within about 0.7% of the originals and halves the file to 48 GiB, which is the ngram.table strixite serves (docs/tools.md); fp8 is kept but unused because one scale for the whole table is less accurate"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/transcode_ngram_table.cpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/transcode_ngram_table.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.transcode-ngram-table/-/-"
api       = "main (transcode_ngram_table)"
numeric   = "n/a"
regime    = "host only"

[[requires]]
interface = "format.container/ngram-table/-"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.ngram_table"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
