id      = "tool.strixite.inspect_strixw"
kind    = "tool"
summary = "Prints a strixw file's header (format version, model, per-class layout, converter and date) and one line per tensor; --verify re-reads the file across --threads N and recomputes every component's hash"
why     = "A 115 GiB weights file is easy to truncate or corrupt in transit, and its layout is otherwise opaque, so the origin gives users a way to see what quant they hold and check it is intact (docs/tools.md); docs/weights.md's numbers are read from it. Built in each strixite Qwen3.8 recipe"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/inspect_strixw.cpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/inspect_strixw.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.inspect-strixw/-/-"
api       = "main (inspect_strixw)"
numeric   = "n/a"
regime    = "host only"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
module = "runtime.strixite.args"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
