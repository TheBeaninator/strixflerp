id      = "tool.strixite.convert_ngram_table"
kind    = "tool"
summary = "Offline converter that copies the checkpoint's 128 ngram_embedding.shard_N BF16 tensors (rows of 160) into one ngram.table file in table order, exact BF16 with compression off, records the hashing constants and checkpoint fingerprint in the header, and re-reads a sample of rows to compare with the source"
why     = "Qwen3.8-Flash-Next carries a 51-billion-value n-gram embedding table read a few rows per token; strixite keeps it on SSD as its own file and reads only the rows it needs instead of holding 95 GiB in memory (docs/tools.md), and this tool produces that file from the original checkpoint as the first of two steps before transcode_ngram_table"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/convert_ngram_table.cpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/convert_ngram_table.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.convert-ngram-table/-/-"
api       = "main (convert_ngram_table)"
numeric   = "n/a"
regime    = "host only"

[[requires]]
interface = "format.convert/strixw/-"

[[requires]]
interface = "format.container/ngram-table/-"

[[requires]]
interface = "format.reader/safetensors/-"

[[requires]]
module = "runtime.strixite.args"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
