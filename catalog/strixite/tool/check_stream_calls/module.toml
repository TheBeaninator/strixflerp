id      = "tool.strixite.check_stream_calls"
kind    = "tool"
summary = "Host-only differential test of streamed tool calls: the same generated text is fed to OutputParser as the tokenizer splits it, byte by byte and in random pieces, with and without stream_calls, and the event sequences must match the buffered parser except that a malformed or cut-off call keeps unparseable arguments; 46 fixed cases plus 20000 random and 20000 damaged ones per run"
why     = "Streaming a tool call as the model writes it means the server cannot take a call back once sent (docs/server.md, Streamed tool calls), so the streaming parser has to agree with the buffered one on every well-formed input and fail safe on bad ones; random damage finds the edge cases hand-written tests miss. Recorded with 0 failures in gate/results/qwen38-flash-next.strixite/unit-check_stream_calls.txt"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/check_stream_calls.cpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/check_stream_calls.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.check-stream-calls/-/-"
api       = "main (check_stream_calls)"
numeric   = "n/a"
regime    = "host only test; check_stream_calls <tokenizer.json> [random cases] [seed]"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.output_parser"

[[requires]]
module = "runtime.strixite.tokenizer"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
