id      = "tool.strixite.cache_xfer_check"
kind    = "tool"
summary = "Host-only test of the prompt cache's export/import API on synthetic token prefixes and state bytes: exact file-byte export and identical import, base-then-delta pairs, refusal of foreign fingerprints, damaged bytes and missing bases, and idempotent re-import; prints one ok/FAIL line per check and exits with the failure count"
why     = "The pod's cache-transfer patch (CTXMOVE-XFER, card a4a320429d) lets a router move a conversation's cached state to another node instead of re-prefilling it, and a bad import would silently corrupt a conversation; this proves the transport contract without a GPU or weights. Built in every strixite Qwen3.8 recipe and run as a unit gate (gate/results/qwen38-flash-next.strixite/unit-cache_xfer_check.txt)"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/cache_xfer_check.cpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/cache_xfer_check.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.cache-xfer-check/-/-"
api       = "main (cache_xfer_check)"
numeric   = "n/a"
regime    = "host only test; cache_xfer_check <scratch_dir>"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
module = "runtime.strixite.host_buffer"

[[requires]]
module = "runtime.strixite.prompt_cache"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
