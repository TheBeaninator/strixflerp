id      = "tool.strixite.sv9_cache_check"
kind    = "tool"
summary = "Host-only test that the prompt cache keys on image content: each image_pad run becomes pseudo-id runs from a 64-bit hash of the image bytes, so two equal-size different images miss, identical bytes hit, the pre-image text still hits, image order matters, and all of it holds after a disk round trip"
why     = "In v0.3.0 the cache keyed images by their pad tokens, so a different picture of the same size produced the same key stream and could resume the first picture's cached state (card 01b207e967, SV-9); this pins the fix without a GPU or weights and is a unit gate (unit-sv9_cache_check.txt: SV9-CACHE-CHECK PASS)"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/sv9_cache_check.cpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/sv9_cache_check.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.sv9-cache-check/-/-"
api       = "main (sv9_cache_check)"
numeric   = "n/a"
regime    = "host only test; sv9_cache_check <tokenizer.json> <preprocessor_config.json> <config.json> <scratch_dir>"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.prompt_cache"

[[requires]]
module = "runtime.strixite.stb"

[[requires]]
module = "runtime.strixite.tokenizer"

[[requires]]
module = "runtime.strixite.vision_request"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
