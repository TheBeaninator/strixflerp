id      = "tool.strixite.check_logprobs"
kind    = "tool"
summary = "Host-only test of per-token logprobs: the log-softmax row math, the engine's capture sites driven by a scripted fake backend (greedy text, the thinking budget's fed stop, MTP-accepted and MTP-rejected tokens), which logits rows a request reads, request parsing with and without --logprobs, and the choice.logprobs body shape, needing only tokenizer.json"
why     = "Logprobs (card 31cf21e3d1, ENG-LOGPROB) were a pod patch whose numbers must come from the very FP32 row the sampler used, with null for tokens the server fed itself; MTP drafting and the thinking budget make those capture points easy to get wrong, so this pins them without a model. A unit gate in the strixite Qwen3.8 recipes (unit-check_logprobs.txt: ok)"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/check_logprobs.cpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/check_logprobs.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "tool.check-logprobs/-/-"
api       = "main (check_logprobs)"
numeric   = "n/a"
regime    = "host only test; check_logprobs <tokenizer.json>"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.engine"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.logprobs"

[[requires]]
module = "serve.strixite.openai"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
