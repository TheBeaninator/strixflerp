id      = "serve.strixite.openai"
kind    = "serve"
summary = "OpenAI request parsing and response bodies (chat completions, completions, chunks, errors)"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/openai.cpp", "serve/openai.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/openai.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.api/openai/-"
api       = "strix::parse_chat_request, strix::parse_completion_request, strix::completion_body"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.chat_template"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.engine"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.vision_request"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
