id      = "serve.strixite.openai"
kind    = "serve"
summary = "Validates an OpenAI chat-completions or completions body field by field into the request the engine runs (messages, tools and tool_choice, response_format, logit_bias, logprobs, sampling) and writes the response, SSE chunk and error bodies back out, answering any unsupported field with a 400 that names it"
why     = "Clients such as agents and openai-python only speak the OpenAI contract, so the server needs one place that decides exactly which parts of it strixite honours; refusing an unsupported field by name instead of silently ignoring it is the origin's stated policy (docs/server.md: keywords are refused, never accepted and left unenforced). Used by serve.strixite.http and so by strix_server in each strixite Qwen3.8 recipe"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/openai.cpp", "serve/openai.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/openai.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.api/openai/-"
api       = "strix::parse_chat_request, strix::parse_completion_request, strix::completion_body"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.chat_template"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.engine"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.vision_request"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
