id      = "serve.strixite.steer_library"
kind    = "serve"
summary = "Loads a directory of steering vectors (<name>.f32 float32 values plus <name>.json naming the layer they are added after) onto the GPU once, and resolves a request's steer field, a list of {vector, scale} with |scale| <= 1000, into a SteerSet of per-layer vectors and an FNV hash of the set used as a negative cache salt"
why     = "Added by the pod's STEER-2 patch so a request can push the model along a direction measured with strix_acts without a restart or a second model: the vectors live with the model and are named per request, a vector may be one row for all residual streams or one per stream, and the salt keeps a steered conversation's prompt-cache entries apart from unsteered ones. The only serve.steer-library provider; strix_server hands it to the HTTP layer, and the add itself is kernel.strixite.steer"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/steer_library.cpp", "serve/steer_library.hpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/steer_library.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.steer-library/-/-"
api       = "strix::SteerLibrary"
numeric   = "vectors uploaded as stored"
regime    = "needs the device"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.device_buffer"

[[requires]]
module = "runtime.strixite.steer"

[[requires]]
module = "serve.strixite.http"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
