id      = "serve.strixite.strix_server"
kind    = "serve"
summary = "The strix_server main program: reads the option table and config file, runs the startup memory plan that allocates every GPU buffer up front and refuses (with an exit code systemd will not restart) when the model will not fit, loads weights.strixw, the n-gram table, the tokenizer and optionally the vision tower, then wires the Qwen4Exp session, Engine, prompt cache, steering library and HTTP server and serves until SIGINT or SIGTERM"
why     = "It is the binary the fleet actually serves Qwen3.8-Flash-Next with (engines.conf strixite_v070pod, ORIGIN.toml), so every Qwen3.8 recipe that builds a strixite-shaped server (strixite, -abi, -pf, -p16, router-gufo, topk-gufo, dense-strixfold, three-engines) names it as the main of its server binary; the up-front memory check exists because of strixite issue #6, failing in seconds instead of after loading 69.5 GiB of weights"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["tools/strix_server.cpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/tools/strix_server.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.program/qwen4exp/-"
api       = "main (strix_server)"
numeric   = "n/a"
regime    = "one process, one GPU"

[[requires]]
module = "executor.strixite.qwen4exp"

[[requires]]
module = "executor.strixite.qwen4exp_backend"

[[requires]]
interface = "vision.tower-ops/bf16/bf16"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.device_buffer"

[[requires]]
module = "runtime.strixite.engine"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.memory_plan"

[[requires]]
module = "runtime.strixite.prompt_cache"

[[requires]]
module = "runtime.strixite.serve_log"

[[requires]]
module = "runtime.strixite.tokenizer"

[[requires]]
module = "runtime.strixite.vision_request"

[[requires]]
module = "serve.strixite.http"

[[requires]]
module = "serve.strixite.steer_library"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
