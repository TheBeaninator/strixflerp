id      = "serve.strixite.cpp_httplib"
kind    = "serve"
summary = "cpp-httplib 0.56.0, a single-header C++ HTTP/1.1 server and client (blocking sockets, a thread pool, chunked responses for SSE), vendored byte for byte as third_party/httplib.h with its MIT licence"
why     = "Vendoring one MIT header lets the server build from its own tree with no web framework to install: it gives the request routing, thread pool and chunked streaming that serve.strixite.http puts the OpenAI routes on; it is the only provider of serve.http-lib, and the flerp front end (serve.flerp.http) reuses it rather than bringing a second server library"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = [
    "third_party/cpp-httplib/httplib.h",
    "third_party/cpp-httplib/LICENSE",
    "third_party/cpp-httplib/README.md",
]
authors  = ["Yuji Hirose"]
modified = false

[licence]
spdx = "MIT"

[build]
lang      = "c++"
sources   = []
includes  = ["src/third_party/cpp-httplib"]
toolchain = "therock-10.1"
system    = true

[[provides]]
interface = "serve.http-lib/-/-"
api       = "httplib::Server"
numeric   = "n/a"
regime    = "header only"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
