id      = "runtime.strixite.tokenizer"
kind    = "runtime"
summary = "Hand-written byte-level BPE for Qwen3.8-Flash-Next (248,044 tokens, 247,587 merges, 33 added tokens), loaded from tokenizer.json and checked against it: added tokens split out leftmost-longest, NFC, a hand-coded pre-tokenizer regex, then pairwise merges by rank"
why     = "The C++ server needs the reference tokenizer's exact ids, because prompts, prompt-cache keys and grammar masks are all expressed in them. It also takes the byte spans that users, tools and schemas wrote, so a file containing <|im_end|> stays text instead of becoming a control token. The most widely required strixite runtime piece: engine, output parser, token mask, structured output, logprobs, the HTTP layer, many tools, and runtime.flerp.text_strixite behind include/flerp/text.h."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/tokenizer.cpp", "serve/tokenizer.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/tokenizer.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "text.tokenizer/-/-"
api       = "strix::Tokenizer"
numeric   = "splits and normalizes as the model's reference tokenizer"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.unicode"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (23 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
