id      = "runtime.strixite.args"
kind    = "runtime"
summary = "Header-only checked integer and double parsing for command-line tools: strtoll/strtod over the whole string, then a range check, with a STRIX_CHECK error naming the argument and its accepted range"
why     = "The converters and inspectors take sizes, layer numbers and limits on the command line, and atoi() turns a typo into a silent zero that a conversion run would then act on; these two functions make every bad argument stop the tool with its name and range. Used by tool.strixite.convert_qwen4exp, convert_ngram_table, inspect_strixw, serve.strixite.http and flerp's convert_qwen4exp_p16"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["common/args.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.args/-/-"
api       = "strix::parse_int, strix::parse_double"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (4 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
