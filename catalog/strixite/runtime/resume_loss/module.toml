id      = "runtime.strixite.resume_loss"
kind    = "runtime"
summary = "Describes what a resume point loses when an edited message forces a re-prefill"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/resume_loss.cpp", "serve/resume_loss.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/resume_loss.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.resume-loss/-/-"
api       = "strix::resume_loss_text, strix::describe_prompt_position"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.serve_log"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
