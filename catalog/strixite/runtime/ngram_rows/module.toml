id      = "runtime.strixite.ngram_rows"
kind    = "runtime"
summary = "An NgramRowSource that gathers PLE n-gram rows (16 BF16 rows of 160 per token) straight from the HF checkpoint's 128 ngram_embedding.shard_N tensors with pread, deduplicated and 32 at a time, with no cache"
why     = "It was the PLE row source before the converted n-gram table file existed and is kept because its rows are the checkpoint's own values, so tests can compare the converted table against it; it needs the HF checkpoint beside the converted weights and does one page read per row, which is why runtime.strixite.ngram_table replaced it for serving. executor.strixite.qwen4exp can still open it"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/ngram_rows.cpp", "runtime/ngram_rows.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/ngram_rows.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "ple.ngram-rows/safetensors/-"
api       = "strix::NgramRowsFromShards"
numeric   = "the checkpoint's own bf16 rows"
regime    = "one 4 KiB page read per row, no caching"

[[requires]]
interface = "format.reader/safetensors/-"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.ngram_table"

[[requires]]
module = "runtime.strixite.ple_hash"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (10 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
