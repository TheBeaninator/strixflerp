id      = "runtime.strixite.check"
kind    = "runtime"
summary = "Header-only, dependency-free STRIX_CHECK / STRIX_FAIL macros that throw strix::Error carrying function, file:line, the failed condition and a caller-built expected-vs-found message, plus the GpuFatalError and KvBudgetExhausted error classes"
why     = "strixite's rule is that every function validates its parameters (only hot loops are exempt) and that a failure says exactly what was expected and found, so one shared check header is the base of nearly the whole origin: it is the most-required module in the strixite catalogue, used by host code, tools, tests and many flerp modules alike. The two subclasses let the server tell a dead GPU context (exit for the supervisor to restart) and a spent K/V generation budget (refuse before touching the slot) apart from ordinary errors"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["common/check.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.check/-/-"
api       = "STRIX_CHECK, strix::Error, strix::GpuFatalError"
numeric   = "n/a"
regime    = "host"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
