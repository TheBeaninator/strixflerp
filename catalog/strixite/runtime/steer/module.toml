id      = "runtime.strixite.steer"
kind    = "runtime"
summary = "Plain structs for one conversation's activation steering: per-layer device vectors of H*d floats with a scale, added to every token row at the end of the chosen layers, plus a signature and a negative salt id that becomes token 0 of the cache key"
why     = "Steering (the pod's STEER-2 patch on v0.7.0) changes the state a conversation caches, so a steered state must never resume an unsteered or differently steered prompt; a salt that is never a real token at position 0 makes every prefix match (prompt cache, live slot, /cache/export) diverge immediately. The type is shared by executor.strixite.qwen4exp, which adds the vectors, the engine, and serve.strixite.steer_library, which loads them; FreeFitty is the client sending steer requests (docs/FLERP-SWAP-PLAN.md)."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/steer.hpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "steer.set/-/-"
api       = "strix::SteerSet, strix::SteerLayer"
numeric   = "n/a"
regime    = "header only; the request's cache key carries the steer salt as its first token"

