id      = "runtime.strixite.trace"
kind    = "runtime"
summary = "ROCTX push/pop macros (STRIX_TRACE_RANGE for a scope, STRIX_TRACE_STAGE and STRIX_TRACE_SET for a range that moves along a scope) that compile to nothing, arguments unevaluated, unless the build defines STRIX_ROCTX"
why     = "Profiling a decode step needs each kernel labelled by what the host was doing when it queued it; rocprofv3 --marker-trace links every dispatch to the range around its launch, and tools/trace_gaps.py labels kernels that way. Shipping builds pay nothing because the macros vanish. Only executor.strixite.qwen4exp uses it, around its forward and layer stages (preset strix-roctx)."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["common/trace.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.trace/-/-"
api       = "STRIX_TRACE_RANGE, STRIX_TRACE_STAGE"
numeric   = "n/a"
regime    = "host, profiling builds"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
