id      = "runtime.strixite.tool_grammar"
kind    = "runtime"
summary = "Compiles a request's tools and tool_choice into a byte grammar where free text never holds a call tag and a call is the <tool_call> token, <function=NAME> with a declared name, <parameter=P> blocks with declared property names and the </tool_call> token, the two tags written as 0xFF sentinels"
why     = "Under activation steering at scale 8 the model spelled <tool_call> with ordinary tokens, which the parser reads as text, so calls were lost; restricting call syntax to the request's real tool and parameter names, with only the real added tokens able to open or close a call, prevents that and also enforces tool_choice required or a named tool. It is what the 7-commit tool-grammar branch this cut was taken from adds (ORIGIN.toml); used by grammar_cache, the engine and tool_grammar_check."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/tool_grammar.cpp", "serve/tool_grammar.hpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/tool_grammar.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.tool-call/-/-"
api       = "strix::tool_grammar::compile"
numeric   = "n/a"
regime    = "host; call tags are the tag tokens, never their text spelling"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.grammar"

[[requires]]
module = "runtime.strixite.json"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
