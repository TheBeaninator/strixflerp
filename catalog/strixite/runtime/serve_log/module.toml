id      = "runtime.strixite.serve_log"
kind    = "runtime"
summary = "Printf-style helpers that lay a request's log out as one block of fixed-column label rows, speed rows leading with a right-aligned rate, and numbers comma-grouped by hand instead of through the locale"
why     = "The engine thread runs one request at a time, so each request can be one readable block in journalctl (prefill rate, generate rate, MTP acceptance, totals) that tools/reqlog.sh pulls out by request number; hand-made thousands separators keep the journal grep-able on any machine, since setlocale would hijack printf. The prompt cache, output parser, resume_loss, engine, HTTP layer and strix_server all write through it."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/log.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.log-rows/-/-"
api       = "strix::slog_row, strix::fmt_n, strix::fmt_rate"
numeric   = "n/a"
regime    = "header only"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.log"

[gate]
parity = "none"
bench  = "none"
