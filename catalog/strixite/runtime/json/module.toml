id      = "runtime.strixite.json"
kind    = "runtime"
summary = "A hand-rolled strict RFC 8259 JSON value, parser and two printers: objects keep key order with Python's duplicate-key rule, integers keep their literal digits, dump() is compact with repr-style floats and dump_python() reproduces json.dumps(ensure_ascii=False) exactly; errors name the path"
why     = "The server's JSON is small and fixed, so the origin wrote its own rather than vendoring a library, and the chat template's tojson filter has to reproduce Python's printing byte for byte (order of tools as sent, integers unchanged, float repr) for prompts to match the reference tokens. It is the JSON layer of the whole strixite serving stack (http, openai, chat_template, tokenizer, schema compiler, tool grammar, capture) and of flerp's http, text and reply shims"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/json.cpp", "serve/json.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/json.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.json/-/-"
api       = "strix::json::Value"
numeric   = "n/a"
regime    = "host, self-contained"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (25 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
