id      = "runtime.strixite.stb"
kind    = "runtime"
summary = "Sean Barrett's single-header codecs, stb_image 2.30 (PNG, JPEG, GIF, BMP, TGA decode) and stb_image_write 1.16, copied unmodified from upstream, with one stb_impl.cpp that compiles the decoder implementation once and the encoder only under STRIX_STB_IMPL_TEST_ONLY"
why     = "The vision path has to turn the image bytes of a chat request into pixels on the host; vision_preprocess decodes every format except WebP through stb_image, and the writer exists only so tests can encode real images and decode them back (third_party/stb/README.md). The catalogue builds it with the test define set; tool.strixite.sv9_cache_check also requires it."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = [
    "third_party/stb/stb_image.h",
    "third_party/stb/stb_image_write.h",
    "third_party/stb/README.md",
    "third_party/stb_impl/stb_impl.cpp",
]
authors  = ["Sean Barrett and contributors", "shawnshekari"]
modified = false

[licence]
spdx = "MIT OR Unlicense"

[build]
lang      = "c++"
sources   = ["src/third_party/stb_impl/stb_impl.cpp"]
includes  = ["src/third_party/stb"]
toolchain = "therock-10.1"
system    = true
defines   = ["STRIX_STB_IMPL_TEST_ONLY"]
options   = ["-Wno-missing-field-initializers"]

[[provides]]
interface = "vision.image-decode/stb/-"
api       = "stbi_load_from_memory, stbi_write_png"
numeric   = "n/a"
regime    = "PNG, JPEG, GIF, BMP, TGA; stb_image_write is compiled in for the tests' encode side"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
