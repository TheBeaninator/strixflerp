id      = "runtime.strixite.unicode"
kind    = "runtime"
summary = "UTF-8 encode and decode with lossy repair, the pre-tokenizer's letter, mark, number and White_Space classes, Python's str.isspace and strip, and NFC composition, all from tables generated off Python's unicodedata (unicode_tables.inc)"
why     = "The tokenizer and chat template have to classify and normalize text exactly as the reference Python tokenizer and Jinja do, so the classes and NFC deliberately come from the different Unicode versions those use. Model output can arrive as byte tokens in a non-UTF-8 order, so repair swaps bad bytes for U+FFFD rather than failing the request. Required by tokenizer, chat_template and output_parser."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/unicode.cpp", "serve/unicode.hpp", "serve/unicode_tables.inc"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only AND Unicode-3.0"

[build]
lang      = "c++"
sources   = ["src/serve/unicode.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "text.unicode/-/-"
api       = "strix::unicode::{decode_utf8, encode_utf8, char_class, nfc}"
numeric   = "Unicode 16.0.0 categories, 15.0.0 normalization data"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (6 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
