id      = "runtime.strixite.prompt_cache"
kind    = "runtime"
summary = "Saved session states keyed by the token ids they cover: a host-RAM tier that shrinks with MemAvailable, written lazily under a write budget to one checksummed file per entry (4 KiB header, token ids, state bytes), with System, Turn and Checkpoint kinds, parked K/V pages and export/import"
why     = "A coding agent resends the same long conversation every turn, a little longer each time; resuming from a saved prefix instead of prefilling it takes about a second from RAM or a few seconds from disk, at roughly 17 KiB of state per token (upstream docs/memory.md). The write budget, idle-priority writer and RAM-only entries for one-shot prompts exist because such prompts once filled 251 of 279 disk entries and most of ~230 GB/day of SSD writes. The engine, the HTTP layer and strix_server use it; /cache/export and /cache/import move entries between nodes (tool.strixite.cache_xfer_check)."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/prompt_cache.cpp", "serve/prompt_cache.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/prompt_cache.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "cache.prompt/-/-"
api       = "strix::PromptCache, strix::PromptCacheStats"
numeric   = "restored state is the saved bytes; keys carry the weights, K/V dtype, MTP and YaRN fingerprint"
regime    = "host only (no HIP on its compile line); disk tier gated by a free-space margin"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.host_buffer"

[[requires]]
module = "runtime.strixite.memory_governor"

[[requires]]
module = "runtime.strixite.paged_state"

[[requires]]
module = "runtime.strixite.serve_log"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
