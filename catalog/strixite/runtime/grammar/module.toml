id      = "runtime.strixite.grammar"
kind    = "runtime"
summary = "Byte-level grammar, automaton and matcher for structured output"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/grammar.cpp", "serve/grammar.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/grammar.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.matcher/-/-"
api       = "strix::grammar::{Grammar, GrammarAutomaton, GrammarMatcher}"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
