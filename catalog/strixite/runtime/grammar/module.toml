id      = "runtime.strixite.grammar"
kind    = "runtime"
summary = "Byte-level context-free grammars (rules of alternatives of byte-range or rule-reference elements) matched by a nondeterministic pushdown automaton that tracks every live parse, with tail-call frames for right recursion, a 256-frame depth bound, a left-recursion refusal, and a shared automaton that caches per-state token masks"
why     = "Structured output needs to know, at every step, which next tokens keep the answer valid; working on bytes rather than characters lets one grammar judge any token, even one that ends inside a UTF-8 character, and caching masks per automaton state means a repeated state costs nothing. It is the core that json_schema and tool_grammar compile into and that token_mask, structured_output, grammar_cache and the engine consult; flerp's reply_strixite reuses it for response_format in the flerp-serve recipes"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/grammar.cpp", "serve/grammar.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/grammar.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.matcher/-/-"
api       = "strix::grammar::{Grammar, GrammarAutomaton, GrammarMatcher}"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
