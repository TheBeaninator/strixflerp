id      = "runtime.strixite.think_nudge"
kind    = "runtime"
summary = "ThinkWatch: hashes each reasoning token's trailing 8-gram (FNV-1a) and, once past 3k thinking tokens a 1k window is at least 25% self-repeats, asks the engine to feed one first-person sentence at the next paragraph break, at most twice a turn and never a </think>"
why     = "Qwen3.8-Flash-Next's thinking sometimes goes in circles; with the nudge about half of the stuck turns wrapped up 5-40x sooner, and on turns forked where it fires a quarter stopped within 2000 tokens against none without (think_nudge.hpp, upstream docs/server.md). A length backstop and an earlier 10% trigger were measured and dropped. The engine uses it and runtime.flerp.reply_strixite re-exposes it to the flerp-serve recipes; think-nudge = off allows like-for-like comparisons with engines that lack it."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/think_nudge.cpp", "serve/think_nudge.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/think_nudge.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.think-nudge/-/-"
api       = "strix::ThinkWatch"
numeric   = "n/a"
regime    = "host; 8-token repeats over a 1024-token window"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
