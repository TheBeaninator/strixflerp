id      = "runtime.strixite.think_nudge"
kind    = "runtime"
summary = "Detector for circling thinking and the nudge text written into the think block"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/think_nudge.cpp", "serve/think_nudge.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/think_nudge.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.think-nudge/-/-"
api       = "strix::ThinkWatch"
numeric   = "n/a"
regime    = "host; 8-token repeats over a 1024-token window"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
