id      = "runtime.strixite.memory_plan"
kind    = "runtime"
summary = "A startup RAM check run once after all GPU buffers exist: requires MemAvailable to cover the larger of the cache margin and a 4 GiB floor plus one full-capacity saved state (less one slot's paged K/V held back), and either fails with the settings that would fit or, with low-memory = adapt, turns caches down step by step (spares, RAM tier, n-gram row cache, save size limit), one warning per step"
why     = "strixite issue #6: a 27B sidecar left MemAvailable at 0.4 GiB and the GPU's allocations from the same RAM became driver faults and a segfault instead of a clean error; since nothing on the GPU grows after startup, one check then, against what can still grow on the host (the prompt cache), turns that into a refusal or a measured, reversible downgrade. Called by serve.strixite.strix_server at startup (docs/memory.md describes the user-facing side)"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/memory_plan.cpp", "serve/memory_plan.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/memory_plan.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.memory-plan/-/-"
api       = "strix::plan_memory, strix::MemoryPlan"
numeric   = "n/a"
regime    = "host, once at startup"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
