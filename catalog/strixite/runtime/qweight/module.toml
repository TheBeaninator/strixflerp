id      = "runtime.strixite.qweight"
kind    = "runtime"
summary = "Header-only view of one dense or expert weight that records the Q4, Q5, Q6 or Q8 row-major format the strixw file declares, whose linear_qw* functions switch on the bit width to reach the matching decode GEMV, WMMA prefill or grouped-expert kernel"
why     = "A strixw layout can give each tensor its own precision, so the executor needs one call per projection that works whatever bits were chosen; QWeightView is that switch point, read from the file at load and never guessed, and DESIGN.md names it as the place a prefill-only tile-major layout would plug in. Required by executor.strixite.qwen4exp, format.strixite.strixw_loader and flerp's strixw_loader_p."
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/qweight.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "linear.dispatch/strixw/-"
api       = "strix::QWeightView, strix::QChunkMajorView, strix::kernels::linear_qw"
numeric   = "that of the kernel it dispatches to"
regime    = "header only; format read from the strixw file, never guessed"

[[requires]]
interface = "format.device-view/strixw-q4/-"

[[requires]]
interface = "format.device-view/strixw-q5/-"

[[requires]]
