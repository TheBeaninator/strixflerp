id      = "runtime.strixite.host_buffer"
kind    = "runtime"
summary = "A growable host byte buffer on anonymous mmap: faults all pages in up front, keeps the mapping when a resize fits, grows with mremap populating only the added pages, and unmaps on release, using 4 KiB pages"
why     = "Exporting a GiB-sized session state after every response stalled on std::vector, whose resize zero-fills and faults 4 KiB pages lazily: about 0.7 s per export at 160-200k context. The origin measured 5 GiB at 782 ms with a vector, 287 ms fresh with huge pages and 66 ms on a reused buffer, and chose 4 KiB pages because huge pages compact under memory pressure (517 ms fresh). It backs the prompt cache's host states and is used by flerp's strixite_abi for host-byte states and by tool.strixite.cache_xfer_check"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/host_buffer.cpp", "serve/host_buffer.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/host_buffer.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.buffer/-/-"
api       = "strix::HostBuffer"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
