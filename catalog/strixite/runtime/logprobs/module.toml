id      = "runtime.strixite.logprobs"
kind    = "runtime"
summary = "Per-token logprobs for OpenAI-shaped responses: a log-sum-exp and top-k pass over each full FP32 logits row the sampler saw (after the structured-output mask and think guard, before temperature), with engine-fed tokens recorded in order but without a logprob"
why     = "Clients that score or calibrate answers ask for \"logprobs\" and \"top_logprobs\" (up to 20), and the numbers must mean what the HF reference means, so they are taken from the very row the sampler used; a logprob needs the row's normalisation constant, so these requests read back the full row instead of candidates, which is why the feature sits behind --logprobs (card 31cf21e3d1, ENG-LOGPROB). Required by runtime.strixite.engine and checked by tool.strixite.check_logprobs"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/logprobs.cpp", "serve/logprobs.hpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/logprobs.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "sample.logprobs/-/-"
api       = "strix::LogprobRecorder, strix::row_logprobs"
numeric   = "log-softmax in double over the valid ids"
regime    = "host; needs full rows, not candidates"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.sampler"

[[requires]]
module = "runtime.strixite.tokenizer"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (14 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
