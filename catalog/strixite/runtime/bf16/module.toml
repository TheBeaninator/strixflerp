id      = "runtime.strixite.bf16"
kind    = "runtime"
summary = "Header-only host BF16 conversion by bit manipulation: widening is a 16-bit shift through memcpy, narrowing rounds to nearest even and keeps NaN and infinity, exactly as the device functions of the same name in kernels/rope_math.hpp"
why     = "Host code has to read and write the BF16 values the kernels store (the loader's widenings, the vision pixel upload, host reference computations), and a host rounding that differs from the device one in a single bit breaks bit-exact comparisons; keeping a host twin with identical semantics makes host and GPU results interchangeable. Required by executor.strixite.qwen4exp, executor.strixite.vision_tower and tool.strixite.strix_acts"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["common/bf16.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "host.bf16/-/-"
api       = "strix::f32_to_bf16_bits, strix::bf16_bits_to_f32"
numeric   = "round to nearest even, non-finite values preserved"
regime    = "host"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
