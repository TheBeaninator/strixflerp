id      = "runtime.strixite.grammar_cache"
kind    = "runtime"
summary = "Cache of compiled grammars keyed by schema"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/grammar_cache.cpp", "serve/grammar_cache.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/grammar_cache.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.cache/-/-"
api       = "strix::GrammarCache"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.grammar"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.json_schema"

[[requires]]
module = "runtime.strixite.tool_grammar"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
