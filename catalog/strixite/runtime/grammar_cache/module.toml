id      = "runtime.strixite.grammar_cache"
kind    = "runtime"
summary = "A mutex-guarded LRU of up to 16 compiled grammar automata keyed by the schema's compact JSON (or by tools plus tool_choice), each entry keeping the token masks it has filled in, shared by shared_ptr across concurrent requests"
why     = "Agents send the same response schema every session (Hermes' title schema, for example), and compiling it and rebuilding its token masks per request would be repeated work on the request path; keeping automata across requests makes a repeated schema free, and the 16-entry bound caps the worst case near 1 GiB of masks. serve.strixite.http asks it for the json_object, json_schema and tool-call grammars"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/grammar_cache.cpp", "serve/grammar_cache.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/grammar_cache.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.cache/-/-"
api       = "strix::GrammarCache"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.grammar"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.json_schema"

[[requires]]
module = "runtime.strixite.tool_grammar"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
