id      = "runtime.strixite.vision_preprocess"
kind    = "runtime"
summary = "Host image path from bytes to pixel_values: magic-sniffed decode (stb for PNG, JPEG, GIF, BMP, TGA; libwebp for WebP) to 8-bit RGB, the processor's smart_resize to multiples of 32 with an antialiased bicubic filter, per-channel mean/std normalization and merge-block-major packing"
why     = "The vision tower expects exactly the Hugging Face processor's pixels, and its attention kernel caps an image at 8192 patches, so the resize ceiling is clamped to that cap and an oversized image such as a 4K screenshot is served downscaled rather than refused (upstream docs/images.md). Every bad input raises an exception naming the field, per the origin's no-fallback rule. Used by vision_request and tool.strixite.strix_vision; it holds no HIP and no JSON."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/vision_preprocess.cpp", "serve/vision_preprocess.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/vision_preprocess.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "vision.preprocess/-/-"
api       = "strix::vision::{decode_image, preprocess_image, resize_bicubic_aa_u8}"
numeric   = "antialiased bicubic resize on u8 as the reference processor"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.libwebp"

[[requires]]
module = "runtime.strixite.stb"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (11 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
