id      = "runtime.strixite.device_buffer"
kind    = "runtime"
summary = "Header-only RAII wrappers for device and pinned-host allocations: move-only, every buffer named, uploads and downloads size-checked, and a process-wide GpuMemoryTally that sums live bytes by name category (\"K cache 12\" counts as \"K cache\")"
why     = "On gfx1151 device and pinned memory both come out of system RAM (GTT), so a server sharing the machine has to be able to say where its memory went and which buffer failed to allocate; naming every allocation and tallying by category gives the startup memory line and readable errors, and ownership semantics rule out leaks and double frees. It is the allocation layer under the strixite device views (q4/q5/q6/q8_device), the strixw loader, the qwen4exp and qwen3_5 executors, the vision tower, paged_buffer and strix_server"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/device_buffer.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "device.buffer/-/-"
api       = "strix::DeviceBuffer, strix::PinnedHostBuffer, strix::GpuMemoryTally"
numeric   = "n/a"
regime    = "header only; hipMalloc comes out of GTT on gfx1151"

[[requires]]
module = "kernel.strixite.hip_common"

[gate]
parity = "none"
bench  = "none"
