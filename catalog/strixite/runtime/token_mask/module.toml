id      = "runtime.strixite.token_mask"
kind    = "runtime"
summary = "Computes the 1-bit-per-token allowed mask for a grammar state by walking the vocabulary sorted by bytes, reusing automaton states across shared prefixes and skipping every token behind a refused prefix, with masks cached per automaton state"
why     = "Testing 248k tokens one at a time against the grammar for every row would redo the work their common prefixes share; the sorted walk keeps per-step masks cheap enough for structured output, and the bitmask is applied in logits_topk's first level before the GPU top-k. Special tokens and the LM head's padding rows are never allowed. Used by structured_output, the engine, tool_grammar_check and runtime.flerp.reply_strixite."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/token_mask.cpp", "serve/token_mask.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/token_mask.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "grammar.token-mask/-/-"
api       = "strix::TokenMasker"
numeric   = "n/a"
regime    = "host; masks are what logits_topk consumes"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.grammar"

[[requires]]
module = "runtime.strixite.tokenizer"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
