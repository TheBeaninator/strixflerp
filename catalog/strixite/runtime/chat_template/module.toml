id      = "runtime.strixite.chat_template"
kind    = "runtime"
summary = "Qwen3.8-Flash-Next's chat_template.jinja hand-rendered in C++ with no Jinja engine, byte-identical to transformers' apply_chat_template (Python strip and json.dumps semantics), covering OpenAI-shaped messages, tools, thinking switches, reasoning effort and optional vision triplets, and reporting which byte spans came from the request"
why     = "The prompt cache and session resume match on exact token ids, so the server's rendering must equal the reference template byte for byte, and a C++ server should not carry a Jinja interpreter; the plain-span output lets the tokenizer treat special-token text inside user or tool content as text (an opencode tool result holding <|im_end|> had ended a turn). Used by serve.strixite.http and openai, and by flerp's text_strixite shim that puts it behind include/flerp/text.h for the flerp-serve recipes"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/chat_template.cpp", "serve/chat_template.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/chat_template.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "text.chat-template/-/-"
api       = "strix::render_chat, strix::ChatTemplateOptions"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.json"

[[requires]]
module = "runtime.strixite.unicode"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (5 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
