id      = "runtime.strixite.capture"
kind    = "runtime"
summary = "Opt-in per-request capture files (strix_server --capture-dir): a JSON header line, then the prompt and generated token ids as little-endian int32, then one 3-byte {drafted, accepted, emitted} record per decode step, written as .partial and renamed, with a strict reader"
why     = "Drafting policies (prompt-lookup drafts where the MTP head holds back, per-turn-type acceptance margins) were to be judged by simulating them offline on real logged requests before any of them is built; the capture keeps exactly what that simulation needs, token ids and what MTP did at each step, and nothing is written without the flag because the files hold users' prompts. Required by runtime.strixite.engine, which records a request when it finishes"
notes   = "Step value drafted = 255 (kThinkingStopStep) marks a step where the engine fed text (the thinking stop or a nudge) instead of sampling."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/capture.cpp", "serve/capture.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/capture.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "serve.capture/-/-"
api       = "strix::write_capture, strix::read_capture, strix::CaptureRecord"
numeric   = "n/a"
regime    = "host"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.json"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
