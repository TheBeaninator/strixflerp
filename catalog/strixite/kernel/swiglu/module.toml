id      = "kernel.strixite.swiglu"
kind    = "kernel"
summary = "SwiGLU h = silu(gate) * up over rows laid out [gate (I) | up (I)] by the merge plan, FP32 math with BF16 rounding where the reference rounds, bf16(bf16(silu(g)) * u)"
why     = "The merge plan fuses each MLP's gate and up projections into one matmul, so the activation has to split that row; this kernel does it for the Qwen3.5 baseline's dense MLP and for qwen4_exp expert outputs on paths that do not use the fused gather+SwiGLU of linear_q4 or moe_grouped. Matching the reference's rounding points keeps BF16 runs within one step of transformers. Provides act.swiglu in the strixite recipes."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/swiglu.hip", "kernels/swiglu.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/swiglu.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "act.swiglu/-/bf16"
api       = "strix::kernels::swiglu"
numeric   = "fp32 math; bf16 rounds where the reference does: h = bf16(bf16(silu(gate)) * up)"
regime    = "rows of [gate (I) | up (I)]: dense MLP and the expert gather's output"

[[provides]]
interface = "act.swiglu/-/f32"
api       = "strix::kernels::swiglu"
numeric   = "fp32 math; bf16 rounds where the reference does: h = bf16(bf16(silu(gate)) * up)"
regime    = "rows of [gate (I) | up (I)]: dense MLP and the expert gather's output"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (4 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
