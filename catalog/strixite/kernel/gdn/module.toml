id      = "kernel.strixite.gdn"
kind    = "kernel"
summary = "Gated DeltaNet mixer in two kernels: a front end that runs the width-4 causal depthwise conv plus silu over the merged in_proj rows and derives beta = sigmoid(b) and g = -exp(A_log) softplus(a + dt_bias), then the delta rule S = exp(g) S + k (beta (v - S^T k))^T, out = S^T q on an FP32 [Hv, 128, 128] state, token by token or in 32-token chunks (scalar or WMMA)"
why     = "36 of the model's 48 layers are linear attention, and their fixed-size state is what keeps decode cost independent of context length (how-it-got-fast.md section 4). The kernel reads and writes the state once per call whatever T is, so an MTP verify of k+1 tokens costs one state round trip, and separate in/out state buffers make rejecting drafts free. The chunked WMMA path (HalfU, ~45% less kernel time than exact products) serves prefill. Provides mixer.gdn in the strixite recipes and the Qwen3.5 baseline."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/gdn.hip", "kernels/gdn.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/gdn.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "mixer.gdn/-/bf16"
api       = "strix::kernels::gdn_front, strix::kernels::delta_rule"
numeric   = "conv, silu and gates in fp32 on activation-dtype inputs; qkv_out rounded once; beta and g always fp32"
regime    = "conv width 4 with a 3-row carried state; decode (T = 1) and chunked prompts give the same result"

[[provides]]
interface = "mixer.gdn/-/f32"
api       = "strix::kernels::gdn_front, strix::kernels::delta_rule"
numeric   = "conv, silu and gates in fp32 on activation-dtype inputs; qkv_out rounded once; beta and g always fp32"
regime    = "conv width 4 with a 3-row carried state; decode (T = 1) and chunked prompts give the same result"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[[requires]]
module = "kernel.strixite.wmma"

