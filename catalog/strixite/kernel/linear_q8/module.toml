id      = "kernel.strixite.linear_q8"
kind    = "kernel"
summary = "Q8 decode GEMV with linear_q4's structure at one code per byte: 16 codes per 16-byte load inside one group, split-K over 1-8 waves, an M == 1 instantiation, and BF16 activations dotted through v_dot2_f32_bf16 with the x-sum as a second dot2"
why     = "The dense projections (attention, GDN out, shared expert, PLE kv, LM head) are 8-bit because every token reads all of them and 4 bits hurt accuracy most there; they were the largest slice of a decode step, 10.64 of 32.9 ms (how-it-got-fast.md sections 1-2). The dot2 form exists because the scalar version at M = 5 was instruction-bound (35-37% of wave cycles waiting to issue, DESIGN.md). Provides linear.decode/strixw-q8 in the strixite recipes; the panel layout's kernel.flerp.linear_q8p takes its place in strixite-p16."
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/linear_q8.hip", "kernels/linear_q8.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/linear_q8.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "linear.decode/strixw-q8/bf16"
api       = "strix::kernels::linear_q8"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 16 codes per 16-byte load, 1-8 waves per output row; M == 1 has its own instantiation"

[[provides]]
interface = "linear.decode/strixw-q8/f32"
api       = "strix::kernels::linear_q8"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 16 codes per 16-byte load, 1-8 waves per output row; M == 1 has its own instantiation"

[[requires]]
interface = "format.device-view/strixw-q8/-"

[[requires]]
module = "kernel.strixite.device_info"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
