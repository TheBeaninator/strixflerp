id      = "kernel.strixite.attention"
kind    = "kernel"
summary = "Causal softmax attention for the 12 full-attention layers: q/k get a zero-centred RMSNorm plus partial RoPE in fused jobs that also write the K/V cache, then FP32 online softmax over the cache with GQA (query head h reads KV head h / (Hq/Hk)), times the sigmoid output gate, rounded once; variants gather only QSA-selected blocks, read the 8-bit cache, or run 16-row WMMA tiles for prefill"
why     = "The Qwen3.8 trunk interleaves Gated DeltaNet with full-attention layers whose queries carry an output gate, so no stock attention kernel fits; this one does the whole layer body (norm, rope, cache write, gated attention) in few launches and keeps all score math in FP32, more precise than transformers' BF16 eager run. Paired with the QSA indexer it is why decode stays flat with depth: each query looks at its selected ~2k keys, not the whole context (how-it-got-fast.md section 4, 2% slower from 64k to 224k). It provides attn.softmax-gqa in qwen38-flash-next.strixite and every recipe derived from it."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/attention.hip", "kernels/attention.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/attention.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "attn.softmax-gqa/-/bf16"
api       = "strix::kernels::qk_norm_rope, qk_norm_rope_jobs, attention, attention_gathered, attention_wmma, attention_gathered_wmma"
numeric   = "inputs in the activation dtype, scores, online softmax and P*V in fp32, one rounding at the output; the _wmma variants run the score and P*V products on the matrix units (lower precision, behind a switch)"
regime    = "decode-oriented; K/V cache [capacity, Hk, D] in the activation dtype or the kv8 8-bit format"

[[provides]]
interface = "attn.softmax-gqa/-/f32"
api       = "strix::kernels::qk_norm_rope, qk_norm_rope_jobs, attention, attention_gathered, attention_wmma, attention_gathered_wmma"
numeric   = "inputs in the activation dtype, scores, online softmax and P*V in fp32, one rounding at the output; the _wmma variants run the score and P*V products on the matrix units (lower precision, behind a switch)"
regime    = "decode-oriented; K/V cache [capacity, Hk, D] in the activation dtype or the kv8 8-bit format"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.kv8"

[[requires]]
module = "kernel.strixite.norm"

[[requires]]
module = "kernel.strixite.rope"

[[requires]]
module = "kernel.strixite.rope_math"

[[requires]]
module = "kernel.strixite.wmma"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
