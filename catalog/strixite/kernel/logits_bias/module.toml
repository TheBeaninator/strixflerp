id      = "kernel.strixite.logits_bias"
kind    = "kernel"
summary = "One thread per (token id, value) entry adds a request's OpenAI logit_bias to that id's logit in every row of the request's run, in place on the device FP32 logits, before the top-k pick"
why     = "Sampling reads only the GPU's top-20 candidates, so a bias applied on the host would come too late: a +100 on a token outside a row's top 20 could never be chosen. Adding it before logits_topk makes the candidate path agree with the full-row path's apply_masks. A pod patch carried in v0.7.0-pod (ORIGIN.toml); provides logits.bias in the strixite recipes."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/logits_bias.hip", "kernels/logits_bias.hpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/logits_bias.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "logits.bias/-/-"
api       = "strix::kernels::logits_bias"
numeric   = "one fp32 add per entry"
regime    = "one thread per entry; entries must not collide"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (10 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
