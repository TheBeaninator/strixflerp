id      = "kernel.strixite.kv8"
kind    = "kernel"
summary = "Optional 8-bit K/V cache for the full-attention layers: K quantized asymmetrically per channel over each completed 32-row group, V per 32-channel block of a row, each (scale, zero) packed as two fp16 in one word, the newest incomplete group kept exact in a double-buffered tail, and kv8_math giving every reader the same dequantize arithmetic"
why     = "Selected by the executor's kv-format q8 option, it stores the attention cache at ~56% of BF16 (1 byte plus 4 bytes per 32 values), so more context or more concurrent generations fit in the memory plan. Per-channel K ranges suit keys after norm and RoPE, which carry per-channel offsets (Phase 0 in the header: 42% lower K error than symmetric blocks of 32), and the group rule makes a query see the same values whether the prompt came in one call, in chunks or token by token. The staged-dequant and F16 readers exist because unpacking inside the WMMA prefill loop made attention 2.7x slower than over BF16. Required by module id by kernel.strixite.attention."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/kv8.hip", "kernels/kv8.hpp", "kernels/kv8_math.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/kv8.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "kvcache.quant8/-/bf16"
api       = "strix::kernels::kv8_commit, kv8_dequant, kv8_bytes, kv8_used_ranges and kv8_math::*"
numeric   = "K: asymmetric 8 bits per channel over groups of 32 rows; V: 8 bits per block of 32 channels; scale and zero stored as fp16; value = fma(code, scale, zero) in fp32, rounded to the activation dtype where read; the newest incomplete group stays exact in a tail"
regime    = "about 56% of bf16 storage; what a query sees depends only on its own position"

[[provides]]
interface = "kvcache.quant8/-/f32"
api       = "strix::kernels::kv8_commit, kv8_dequant, kv8_bytes, kv8_used_ranges and kv8_math::*"
numeric   = "K: asymmetric 8 bits per channel over groups of 32 rows; V: 8 bits per block of 32 channels; scale and zero stored as fp16; value = fma(code, scale, zero) in fp32, rounded to the activation dtype where read; the newest incomplete group stays exact in a tail"
regime    = "about 56% of bf16 storage; what a query sees depends only on its own position"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[[requires]]
module = "kernel.strixite.rope_math"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
