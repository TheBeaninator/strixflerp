id      = "kernel.strixite.ple"
kind    = "kernel"
summary = "PLE injection in two launches: ple_gate computes a signed-sqrt sigmoid gate per (token, stream) from the n-gram key, the value and the streams with the three norms folded into sums, and ple_conv runs a dilated (K 4, dilation 3) causal depthwise conv over the gated value history and adds the result into the streams, carrying conv state between calls"
why     = "One qwen4_exp layer injects rows of a 51B-parameter n-gram embedding table (16 rows per token, kept on SSD, how-it-got-fast.md section 5); after the host gathers them and the merged Q8 [W_key; W_val] projection runs, these kernels do the arithmetic on the GPU. They are a negligible 22 ms of a 5,523 ms prefill chunk; the real cost is the SSD gather in runtime.strixite.ngram_table (DESIGN.md). Provides ple.inject in the strixite recipes."
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/ple.hip", "kernels/ple.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/ple.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "ple.inject/-/bf16"
api       = "strix::kernels::ple_gate, strix::kernels::ple_conv"
numeric   = "fp32 math; vn and the conv state stored in the activation dtype, sigma fp32, X rounded once per element"
regime    = "two launches; K = 4 taps, dilation 3, 9 carried state rows"

[[provides]]
interface = "ple.inject/-/f32"
api       = "strix::kernels::ple_gate, strix::kernels::ple_conv"
numeric   = "fp32 math; vn and the conv state stored in the activation dtype, sigma fp32, X rounded once per element"
regime    = "two launches; K = 4 taps, dilation 3, 9 carried state rows"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
