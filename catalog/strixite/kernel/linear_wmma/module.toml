regime    = "prefill: tiles of 64 x-rows by 128 weight rows, K % 64 == 0"

[[provides]]
interface = "linear.prefill/strixw-q5/f32"
api       = "strix::kernels::linear_q5_wmma"
numeric   = "x rounded to bf16, weights exact (raw codes on the matrix units, group scale and min applied in fp32), fp32 accumulate, y rounded once"
regime    = "prefill: tiles of 64 x-rows by 128 weight rows, K % 64 == 0"

[[provides]]
