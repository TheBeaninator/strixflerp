id      = "kernel.strixite.residual"
kind    = "kernel"
summary = "Element-wise in-place x += y with an FP32 add and one rounding to the activation dtype, bit-identical to transformers' add in either dtype"
why     = "The Qwen3.5 baseline forward and the vision tower add sublayer outputs to a plain residual; qwen4_exp itself uses hyper-connections instead and never calls it. It is also one of the cross-engine interface gates: the residual-add interface gate found strixite, gufo and hipfire all bit-exact at ~2 us per decode token and ~208 GB/s on a 2,048-token chunk. Provides residual.add in the strixite recipes."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/residual.hip", "kernels/residual.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/residual.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "residual.add/-/bf16"
api       = "strix::kernels::residual_add"
numeric   = "fp32 add, one rounding to the activation dtype"
regime    = "element-wise"

[[provides]]
interface = "residual.add/-/f32"
api       = "strix::kernels::residual_add"
numeric   = "fp32 add, one rounding to the activation dtype"
regime    = "element-wise"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity    = "flerp:gate/interface/residual-add.toml"
bench  = "none"
status    = "parity"
evidence  = "gate/results/interface/residual-add/result.json"
reason    = "parity: interface gate residual-add on control-node (result.json, provider strixite: pass; the gate overall pass=True); builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (5 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
