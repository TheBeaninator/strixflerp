id      = "kernel.strixite.rope_math"
kind    = "kernel"
summary = "Header of device inline functions: cos and sin of fp32(pos * inv_freq) times the YaRN scale, optionally rounded to BF16, the pair rotation with separately rounded products and sum, and the BF16 conversion helpers"
why     = "Four kernels rotate positions: rope itself, attention's fused q/k norm + RoPE, qsa's block keys and kv8's readers. Keeping the arithmetic in one header guarantees they all rotate identically, so a key roped in the attention job and one roped standalone are the same bits. Required by module id; provides pos.rope-math."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/rope_math.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "pos.rope-math/-/-"
api       = "strix::kernels::rope_math::{cos_sin, rotate, f32_to_bf16_bits, bf16_bits_to_f32}"
numeric   = "transformers' arithmetic: each product and the sum rounded separately, no FMA"
regime    = "device inline"

[[requires]]
module = "kernel.strixite.hip_common"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (4 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
