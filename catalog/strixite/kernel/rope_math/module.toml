id      = "kernel.strixite.rope_math"
kind    = "kernel"
summary = "Device-side RoPE and BF16 conversion arithmetic shared by rope, attention, qsa and kv8"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/rope_math.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "pos.rope-math/-/-"
api       = "strix::kernels::rope_math::{cos_sin, rotate, f32_to_bf16_bits, bf16_bits_to_f32}"
numeric   = "transformers' arithmetic: each product and the sum rounded separately, no FMA"
regime    = "device inline"

[[requires]]
module = "kernel.strixite.hip_common"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
