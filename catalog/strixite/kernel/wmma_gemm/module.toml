id      = "kernel.strixite.wmma_gemm"
kind    = "kernel"
summary = "Device building blocks shared by the tiled WMMA GEMMs: per 64-wide K step a weight and an activation tile staged into LDS and software-pipelined (next step's global loads in flight during this step's WMMA), with Q4/Q8 weights entering either as raw codes and per-group scale/min applied to the FP32 accumulator, or dequantized to F16 by a 1024-offset bit trick and one FMA"
why     = "Dequantizing and rounding each weight while staging bounded these kernels; keeping codes raw (exact in BF16) and folding scale and min into the accumulator costs ~2 ops per code and leaves x as the only rounded input (header). Weights staged as scaled codes moved prefill from 652 to ~1,000 tokens/s (how-it-got-fast.md section 7). Header-only, required by module id by linear_wmma, moe_grouped and hc_wmma; provides gemm.wmma-blocks."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/wmma_gemm.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "gemm.wmma-blocks/-/bf16"
api       = "strix::kernels::{wmma_step, wmma_step_scaled, wmma_step_f16, wmma_stage_codes}"
numeric   = "x rounded to bf16 (or f16), Q4/Q8 weights enter exactly as scaled codes, fp32 accumulate"
regime    = "included by .hip files only; K step kWmmaKC, lower-precision path"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.wmma"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
