id      = "kernel.strixite.logits_topk"
kind    = "kernel"
summary = "Top-20 candidates of each logits row on the GPU by rank counting (a threshold from the threads' bests, then each survivor's place = how many beat it), 8,192 inputs per workgroup in two levels for the 248k vocabulary, ordered value-descending with the lower id first on ties, NaNs flagged per row and an optional allow-mask applied in the first level"
why     = "After each MTP verify the GPU sat ~0.3 ms idle while the host copied and scanned ~1 MB per row; returning ~160 bytes a row instead saved 0.2% per token (header, how-it-got-fast.md section 6), and the tie order makes sampling from candidates bit-identical to sampling from the row. The structured-output mask rides in the same pass. The logits-topk interface gate measured it at 80 us per decode row against gufo's sort at 472 us, both bit-exact; topk-gufo and three-engines swap gufo in to prove the adapter path."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/logits_topk.hip", "kernels/logits_topk.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/logits_topk.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "logits.topk/-/-"
api       = "strix::kernels::logits_topk"
numeric   = "exact selection on fp32 logits: value descending, lower id first on a tie, so sampling from the candidates is bit-identical to sampling from the row; NaN flagged per row"
regime    = "kLogitCands = 20; 8,192 inputs per workgroup, 2 launches for 248,077 logits"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity    = "flerp:gate/interface/logits-topk.toml"
bench  = "none"
status    = "parity"
evidence  = "gate/results/interface/logits-topk/result.json"
reason    = "parity: interface gate logits-topk on control-node (result.json, provider strixite: pass; the gate overall pass=True); builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (10 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
