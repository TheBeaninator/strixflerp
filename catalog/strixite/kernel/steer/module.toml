id      = "kernel.strixite.steer"
kind    = "kernel"
summary = "Adds scale * v to every listed row of the residual streams, FP32 add and one rounding to the activation dtype, with v one FP32 row of H * d values on the device"
why     = "It is the GPU half of activation steering (STEER-2, a pod patch in v0.7.0-pod): runtime.strixite.steer holds a conversation's vectors and the executor calls this after the chosen layers on prompt and generated tokens alike, so the cached state of a steered conversation is the steered state and its cache key is salted to keep it apart. Provides steer.add-rows in the strixite recipes."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/steer.hip", "kernels/steer.hpp"]
authors  = ["pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/steer.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "steer.add-rows/-/bf16"
api       = "strix::kernels::steer_add_rows"
numeric   = "fp32 add, one rounding to the activation dtype"
regime    = "x[r, k] += scale * v[k]"

[[provides]]
interface = "steer.add-rows/-/f32"
api       = "strix::kernels::steer_add_rows"
numeric   = "fp32 add, one rounding to the activation dtype"
regime    = "x[r, k] += scale * v[k]"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
