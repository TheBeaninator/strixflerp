id      = "kernel.strixite.norm"
kind    = "kernel"
summary = "RMSNorm kernels on FP32 math with casts at the reference's points: zero-centred x * rsqrt(mean(x^2) + eps) * (1 + w), its grouped form normalizing each d-wide slice separately, and the gated form w * norm(x) * gate(z) whose gate (silu or sigmoid) must be named at every call; also home of the Act activation-dtype enum"
why     = "The model has two RMSNorm flavours plus a grouped one for the hyper-connection and PLE norms over 4 streams of 2560, and the gated norm reads z in place from inside the in_proj rows instead of copying it. Making the gate type a required argument keeps a qwen4_exp call site from silently getting Qwen3.5's silu. The Act enum defined here is the dtype switch every strixite kernel takes, which is why so many modules require it. Provides norm.rmsnorm-zc and norm.rmsnorm-gated in the strixite recipes."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/norm.hip", "kernels/norm.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/norm.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "norm.rmsnorm-zc/-/bf16"
api       = "strix::kernels::rmsnorm_zc, strix::kernels::group_rmsnorm_zc"
numeric   = "fp32 math with fp32 weights; casts to the activation dtype at the reference's points, so bf16 output is within one bf16 rounding step of transformers"
regime    = "rows x d contiguous, in place allowed"

[[provides]]
interface = "norm.rmsnorm-zc/-/f32"
api       = "strix::kernels::rmsnorm_zc, strix::kernels::group_rmsnorm_zc"
numeric   = "fp32 math with fp32 weights; casts to the activation dtype at the reference's points, so bf16 output is within one bf16 rounding step of transformers"
regime    = "rows x d contiguous, in place allowed"

[[provides]]
interface = "norm.rmsnorm-gated/-/bf16"
api       = "strix::kernels::rmsnorm_gated"
numeric   = "out = cast(w * cast(x * rsqrt(mean(x^2) + eps)) * gate(z)), fp32 math"
regime    = "GDN output norm: rows = tokens x value heads, d = 128; gate SiLU or Sigmoid chosen per call"

[[provides]]
interface = "norm.rmsnorm-gated/-/f32"
api       = "strix::kernels::rmsnorm_gated"
numeric   = "out = cast(w * cast(x * rsqrt(mean(x^2) + eps)) * gate(z)), fp32 math"
regime    = "GDN output norm: rows = tokens x value heads, d = 128; gate SiLU or Sigmoid chosen per call"

[[requires]]
module = "kernel.strixite.device_info"

[[requires]]
module = "kernel.strixite.hip_common"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
