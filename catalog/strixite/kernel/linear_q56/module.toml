id      = "kernel.strixite.linear_q56"
kind    = "kernel"
summary = "Q5 and Q6 GEMV for decode: a 4-bit low plane plus a high-bit plane per row, one kernel template"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/linear_q56.hip", "kernels/linear_q5.hpp", "kernels/linear_q6.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/linear_q56.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "linear.decode/strixw-q5/bf16"
api       = "strix::kernels::linear_q5"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K, ~2048 codes a wave); K % 128 == 0"

[[provides]]
interface = "linear.decode/strixw-q5/f32"
api       = "strix::kernels::linear_q5"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K, ~2048 codes a wave); K % 128 == 0"

[[provides]]
interface = "linear.decode/strixw-q6/bf16"
api       = "strix::kernels::linear_q6"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K); K % 64 == 0"

[[provides]]
interface = "linear.decode/strixw-q6/f32"
api       = "strix::kernels::linear_q6"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K); K % 64 == 0"

[[requires]]
interface = "format.device-view/strixw-q5/-"

[[requires]]
interface = "format.device-view/strixw-q6/-"

[[requires]]
module = "kernel.strixite.device_info"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
