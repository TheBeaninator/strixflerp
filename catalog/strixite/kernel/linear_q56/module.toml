id      = "kernel.strixite.linear_q56"
kind    = "kernel"
summary = "Decode GEMV for Q5 and Q6 weights from one template: each row is a Q4 low plane (K/2 bytes) followed by a 1- or 2-bit high plane, read with linear_q4's 16-byte loads, per-group scale/min and min-fold, with the high bits OR-ed into each code"
why     = "It completes the strixw format ladder so a tensor class can be given 5 or 6 bits when 4 lose accuracy and 8 cost too many bytes, without writing a second GEMV loop. The fleet file has no Q5 or Q6 tensor, so it is off the served path (DESIGN.md); it still provides linear.decode for strixw-q5 and strixw-q6 in qwen38-flash-next.strixite so the format stays usable."
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/linear_q56.hip", "kernels/linear_q5.hpp", "kernels/linear_q6.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/linear_q56.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "linear.decode/strixw-q5/bf16"
api       = "strix::kernels::linear_q5"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K, ~2048 codes a wave); K % 128 == 0"

[[provides]]
interface = "linear.decode/strixw-q5/f32"
api       = "strix::kernels::linear_q5"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K, ~2048 codes a wave); K % 128 == 0"

[[provides]]
interface = "linear.decode/strixw-q6/bf16"
api       = "strix::kernels::linear_q6"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K); K % 64 == 0"

[[provides]]
interface = "linear.decode/strixw-q6/f32"
api       = "strix::kernels::linear_q6"
numeric   = "fp32 accumulate (s * sum(x*q) + m * sum(x) per chunk), one rounding on store; bf16 -> f32 stores unrounded"
regime    = "decode: 1-8 waves per output row (split-K); K % 64 == 0"

[[requires]]
interface = "format.device-view/strixw-q5/-"

[[requires]]
interface = "format.device-view/strixw-q6/-"

[[requires]]
module = "kernel.strixite.device_info"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity    = "flerp:gate/interface/strixw-decode.toml"
bench     = "flerp:gate/interface/strixw-decode.toml"
status    = "benched"
evidence  = "gate/results/interface/strixw-decode/result.json"
