id      = "kernel.strixite.moe_router"
kind    = "kernel"
summary = "MoE router in registers: per token the top-k of E logits (largest first, ties to the lower expert), weights exp(l - l_max) renormalized over the k in FP32, plus a shared-expert slot with coefficient sigmoid(gate logit), and a non-finite logit failing that token through ids -1, NaN coefficients and an error word"
why     = "The router runs on every layer of every token and must emit exactly the ids and FP32 coefficients the expert gather and combine kernels read; computing it in registers took a call from 11.0 to 6.95 us (how-it-got-fast.md section 6). The moe-router interface gate timed it at 28 us per decode token and 100 us for a 2,048-token chunk against gufo's RouterTopK at 37 and 344 us. Provides moe.router in the strixite recipes; router-gufo and three-engines bind gufo's kernel instead to measure token agreement."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/moe_router.hip", "kernels/moe_router.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/moe_router.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "moe.router/-/bf16"
api       = "strix::kernels::moe_router, moe_shared_add, moe_shared_add_inject, check_router_error"
numeric   = "all fp32, coefficients stored fp32 (never rounded to bf16); ties go to the lower expert index; a non-finite logit fails that token and is reported"
regime    = "k in 1..min(E, 32), E in 1..1024"

[[provides]]
interface = "moe.router/-/f32"
api       = "strix::kernels::moe_router, moe_shared_add, moe_shared_add_inject, check_router_error"
numeric   = "all fp32, coefficients stored fp32 (never rounded to bf16); ties go to the lower expert index; a non-finite logit fails that token and is reported"
regime    = "k in 1..min(E, 32), E in 1..1024"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity    = "flerp:gate/interface/moe-router.toml"
bench  = "none"
status    = "parity"
evidence  = "gate/results/interface/moe-router/result.json"
reason    = "parity: interface gate moe-router on control-node (result.json, provider strixite: pass; the gate overall pass=False); builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
