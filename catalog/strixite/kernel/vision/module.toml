id      = "kernel.strixite.vision"
kind    = "kernel"
summary = "The vision tower's non-GEMM kernels plus its linear: BF16-weight linear with the bias added on the FP32 accumulator (WMMA for BF16), LayerNorm, the tanh and erf GELUs, bilinear-resampled 48x48 position table, axial 2D RoPE, non-causal attention per image (one-pass WMMA with online softmax for BF16), patch merge and the scatter of image embeddings into the token rows"
why     = "strixite accepts images in chat requests (upstream docs/images.md), so the Qwen3.8 vision encoder from vision.strixw has to run on the GPU, and its ops (bias, LayerNorm, GELU, 2D positions) appear nowhere in the text trunk. The fused bias exists because a separate bias add double-rounded, measured 7% worse than the oracle's own BF16 deviation over the 27-layer tower; the WMMA attention has no O(n) shared memory, so a 2.5 MP image (9,800 patches) fits. Provides vision.tower-ops in qwen38-flash-next.strixite, called by executor.strixite.vision_tower."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/vision.hip", "kernels/vision.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/vision.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "vision.tower-ops/bf16/bf16"
api       = "strix::kernels::vision_linear_bias, vision_layernorm, vision_gelu, vision_attn, vision_rope_qk, vision_merge_regroup, vision_pos_add, vision_embedding_scatter, vision_bias_add"
numeric   = "bf16 weights, fp32 math with the bias added on the fp32 accumulator, one rounding where the output is stored"
regime    = "one image per forward; sequence capped at kMaxVisionSeq"

[[provides]]
interface = "vision.tower-ops/bf16/f32"
api       = "strix::kernels::vision_linear_bias, vision_layernorm, vision_gelu, vision_attn, vision_rope_qk, vision_merge_regroup, vision_pos_add, vision_embedding_scatter, vision_bias_add"
numeric   = "bf16 weights, fp32 math with the bias added on the fp32 accumulator, one rounding where the output is stored"
regime    = "one image per forward; sequence capped at kMaxVisionSeq"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[[requires]]
module = "kernel.strixite.wmma"

[[requires]]
module = "runtime.strixite.check"

