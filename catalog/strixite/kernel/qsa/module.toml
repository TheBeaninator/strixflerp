id      = "kernel.strixite.qsa"
kind    = "kernel"
summary = "QSA indexer for the full-attention layers: each completed 4-token block's key is RoPE(RMSNorm_zc(mean of its raw keys)) stored chunk-major, scores are sum over heads of relu(q_h . K_b) / sqrt(D) (scalar FMAs or WMMA), and a top-k picks min(512, #blocks) blocks per query by split, row, cooperative or sample-threshold filter selection"
why     = "It is what makes the 12 full-attention layers sparse: a query attends only its best 512 blocks, at most ~2k keys, so decode speed stays flat to 492k tokens (how-it-got-fast.md section 4). At depth the indexer itself grew to a quarter of prefill; moving scores to WMMA and the one-pass filter top-k cut the pick from 99 to 44 ms per layer at 471k, +6.6% on a 490k-token conversation (section 7). Provides attn.qsa-indexer in the strixite recipes; its block list feeds attention's gathered variant."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/qsa.hip", "kernels/qsa.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/qsa.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "attn.qsa-indexer/-/bf16"
api       = "strix::kernels::qsa_block_keys, qsa_scores, qsa_topk"
numeric   = "block-key mean in fp32 then cast to the activation dtype as the reference; scores fp32; top-k is a set with ties to the lower block index; the Wmma score path runs on the matrix units"
regime    = "4-token blocks; k = budget / 4 (512 on the target); H <= 8 heads, D % 8 == 0, D <= 256"

[[provides]]
interface = "attn.qsa-indexer/-/f32"
api       = "strix::kernels::qsa_block_keys, qsa_scores, qsa_topk"
numeric   = "block-key mean in fp32 then cast to the activation dtype as the reference; scores fp32; top-k is a set with ties to the lower block index; the Wmma score path runs on the matrix units"
regime    = "4-token blocks; k = budget / 4 (512 on the target); H <= 8 heads, D % 8 == 0, D <= 256"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[[requires]]
module = "kernel.strixite.rope"

[[requires]]
module = "kernel.strixite.rope_math"

[[requires]]
module = "kernel.strixite.wmma"

