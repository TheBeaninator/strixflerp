id      = "kernel.strixite.mtp_pick"
kind    = "kernel"
summary = "One-block reduction over the draft head's logits that writes the argmax (lowest index on ties), the runner-up value and a NaN flag, packed with the forward's router, expert, attention and embedding error words into one ~64-byte struct"
why     = "A trace of the MTP draft loop showed ~0.3 ms of each ~1.2 ms draft step idle around five device-to-host copies and a host scan of 256 KB of logits; one small copy replaces them. The runner-up value feeds the confidence gate that stops drafting when the top-2 margin is small (how-it-got-fast.md section 3). Provides draft.mtp-pick in the strixite recipes; called once per draft step by the qwen4exp executor."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/mtp_pick.hip", "kernels/mtp_pick.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/mtp_pick.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "draft.mtp-pick/-/-"
api       = "strix::kernels::mtp_pick"
numeric   = "exact selection on fp32 logits: lowest index on a tie, runner-up is the multiset second"
regime    = "one block per draft step"

[[requires]]
module = "kernel.strixite.embedding"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
