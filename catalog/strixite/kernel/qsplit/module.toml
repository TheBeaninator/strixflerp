id      = "kernel.strixite.qsplit"
kind    = "kernel"
summary = "Device header describing the expert weight row as K/2 low-plane bytes then K*HB/8 high-plane bytes, with QHigh32<HB> loading a 32-code chunk's high bits and shifting them into bit 4, compiled away entirely when HB = 0"
why     = "It lets one expert-kernel loop in linear_q4 (and the BF16 grouped paths of moe_grouped) serve both Q4 and Q5 experts, so adding Q5 support cost Q4 nothing (DESIGN.md). The fleet has no Q5 experts, so in practice it is the Q4 row description; required by module id, it provides linear.row-layout/strixw-q4."
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/qsplit.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "linear.row-layout/strixw-q4/-"
api       = "strix::kernels::qsplit_row_bytes and loaders"
numeric   = "raw codes, no arithmetic"
regime    = "included by .hip files only; Q5 rows need K % 128 == 0"

[[requires]]
module = "kernel.strixite.hip_common"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
