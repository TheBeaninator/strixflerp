id      = "kernel.strixite.linear"
kind    = "kernel"
summary = "Plain BF16-weight matmul y = x W^T with W kept in the checkpoint's [out, in] row-major bits, F32 or BF16 activations, FP32 accumulation and one rounding (or none when a BF16 input asks for F32 output)"
why     = "The header calls it deliberately simple and untuned: the correctness baseline for the quantized kernels and the path for tensors that stay BF16. In qwen4_exp that is the MoE router's [513, 2560] projection, whose logits are kept in FP32 even in a BF16 run. The dense-bf16 interface gate measured it at 5.56 us for one decode token against StrixFold's tf_ds_dense_gemv at 7.06 us; recipes dense-strixfold and three-engines swap it for that kernel through an adapter."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/linear.hip", "kernels/linear.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/linear.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "linear.dense/bf16/bf16"
api       = "strix::kernels::linear_bf16w"
numeric   = "fp32 accumulate, one rounding at the end; a bf16 -> f32 call stores the accumulator unrounded"
regime    = "untuned; any M"

[[provides]]
interface = "linear.dense/bf16/f32"
api       = "strix::kernels::linear_bf16w"
numeric   = "fp32 accumulate, one rounding at the end; a bf16 -> f32 call stores the accumulator unrounded"
regime    = "untuned; any M"

[[requires]]
module = "kernel.strixite.device_info"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
