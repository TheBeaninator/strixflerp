id      = "kernel.strixite.rope"
kind    = "kernel"
summary = "Partial rotate-half RoPE on the first rot_dim dims of each head, in place inside the merged qkv rows, with inv_freq and angles computed in transformers' exact FP32 order (no FMA), YaRN frequency blending and attention factor, and interleaved-mRoPE positions for image tokens"
why     = "Positions must match the checkpoint bit for bit, because a double-precision inv_freq differs in 15 of 32 values and the error grows with position (header). YaRN at factor 2 is what let the model reach 512k tokens at no speed or quality cost (how-it-got-fast.md section 4), and interleaved mRoPE gives image patches their (t, h, w) positions while the text path, with null pos3, keeps its old values exactly. Provides pos.rope in the strixite recipes and the host-side inv_freq tables the executors upload."

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["kernels/rope.hip", "kernels/rope.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/kernels/rope.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "pos.rope/-/bf16"
api       = "strix::kernels::rope, strix::kernels::rope_inv_freq, strix::kernels::rope_yarn"
numeric   = "transformers' arithmetic: angle = fp32(pos * inv_freq), products and sum rounded separately (no FMA); bf16 also rounds cos/sin and each step through bf16"
regime    = "theta 1e7, rot_dim 64 of head_dim 256 on the target models"

[[provides]]
interface = "pos.rope/-/f32"
api       = "strix::kernels::rope, strix::kernels::rope_inv_freq, strix::kernels::rope_yarn"
numeric   = "transformers' arithmetic: angle = fp32(pos * inv_freq), products and sum rounded separately (no FMA); bf16 also rounds cos/sin and each step through bf16"
regime    = "theta 1e7, rot_dim 64 of head_dim 256 on the target models"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "kernel.strixite.norm"

[[requires]]
module = "kernel.strixite.rope_math"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
