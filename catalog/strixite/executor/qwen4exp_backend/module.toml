id      = "executor.strixite.qwen4exp_backend"
kind    = "executor"
summary = "Qwen4ExpBackend: implements the serve engine's LmBackend on one Qwen4ExpSession (BF16 activations, WMMA prefill) with snapshot slots, a paged K/V budget, soft renew and MTP drafts, and fingerprints saved states by source fingerprint, a hash of the layout string, YaRN factor, precision and K/V format"
why     = "The serve loop and HTTP layer talk only to LmBackend so they can be tested without a GPU; this adapter is where the real model plugs in. Its fingerprint makes the prompt cache drop a saved state from another conversion, YaRN factor or K/V format instead of misreading it. strix_server links it, and flerp's strixite_abi wraps it to expose strixite through the flerp executor ABI"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["serve/qwen4exp_backend.cpp", "serve/qwen4exp_backend.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/serve/qwen4exp_backend.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "executor.backend/qwen4exp/-"
api       = "strix::Qwen4ExpBackend"
numeric   = "that of executor.strixite.qwen4exp"
regime    = "what the server binds the engine to"

[[requires]]
module = "executor.strixite.qwen4exp"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.engine"

[[requires]]
module = "runtime.strixite.log"

[[requires]]
module = "runtime.strixite.ngram_table"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
