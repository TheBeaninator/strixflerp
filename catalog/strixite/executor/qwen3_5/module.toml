id      = "executor.strixite.qwen3_5"
kind    = "executor"
summary = "Qwen3.5 text-model forward (embedding, 24 layers of GDN or full-attention mixer plus SwiGLU MLP, final norm, tied LM head) running the checkpoint's BF16 linears unquantized through the simple linear_bf16w kernel after load-time merges, with hyperparameters hard-coded from config.json"
why     = "Stage 1 of strixite: a plain BF16 forward that had to be right before any tuned 4-bit path was swapped in, so it is the correctness baseline the quantized engine grew from. No served binary links it; the strixite recipes keep it under [include] so the build keeps proving it compiles"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/qwen3_5.cpp", "runtime/qwen3_5.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/qwen3_5.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "executor.forward/qwen3.5/bf16"
api       = "strix::Qwen35Model, strix::Qwen35Session"
numeric   = "bf16 linears through the simple linear_bf16w kernel"
regime    = "not served; kept as the baseline forward"

[[requires]]
interface = "format.reader/safetensors/-"

[[requires]]
interface = "attn.softmax-gqa/-/bf16"

[[requires]]
interface = "embed.lookup/bf16/bf16"

[[requires]]
interface = "embed.lookup/strixw-q8/bf16"

[[requires]]
interface = "mixer.gdn/-/bf16"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
interface = "linear.dense/bf16/bf16"

[[requires]]
interface = "norm.rmsnorm-zc/-/bf16"

[[requires]]
interface = "norm.rmsnorm-gated/-/bf16"

[[requires]]
interface = "residual.add/-/bf16"

[[requires]]
interface = "pos.rope/-/bf16"

[[requires]]
interface = "act.swiglu/-/bf16"

[[requires]]
module = "runtime.strixite.device_buffer"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (2 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
