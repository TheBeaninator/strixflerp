id      = "executor.strixite.vision_tower"
kind    = "executor"
summary = "Device-resident 0.45B ViT plus patch merger loaded from vision.strixw as bit-exact BF16 rows, dimensions derived from tensor shapes and checked at load, running one image per forward (temporal axis 1) on kernel.strixite.vision with FP32 math and one rounding where an op stores"
why     = "Lets the server take image parts in chat requests (the origin's images.md gives about 0.2 s to encode a small image and 0.9 s for a full screenshot), producing embeddings at the text width 2560 that the qwen4exp executor splices into the prompt; vision can be switched off to skip the ~0.9 GB file. It provides executor.vision-tower/qwen4exp, used by executor.strixite.qwen4exp and the strix_vision tool"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/vision_tower.cpp", "runtime/vision_tower.hpp"]
authors  = ["shawnshekari", "pod"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/vision_tower.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "executor.vision-tower/qwen4exp/bf16"
api       = "strix::VisionTower"
numeric   = "bf16 tower weights bit-exact from the checkpoint; fp32 math, one rounding where an op stores"
regime    = "one image per forward (temporal axis 1)"

[[requires]]
interface = "format.container/strixw/-"

[[requires]]
interface = "format.device-loader/strixw/-"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
interface = "norm.rmsnorm-zc/-/bf16"

[[requires]]
interface = "norm.rmsnorm-gated/-/bf16"

[[requires]]
interface = "residual.add/-/bf16"

[[requires]]
interface = "vision.tower-ops/bf16/bf16"

[[requires]]
module = "runtime.strixite.bf16"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.device_buffer"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
