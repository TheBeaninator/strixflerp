id      = "format.strixite.q4_device"
kind    = "format"
summary = "Q4DeviceView, three raw device pointers (codes, BF16 scales, BF16 mins) plus N, K and group size with no tiling or padding, and Q4Device, an owning upload of a host Q4Weight into separate buffers"
why     = "Kernels need a non-owning handle that mirrors the host planes exactly, and G travels in it because every Q4 kernel picks its template instantiation from it; this provides format.device-view/strixw-q4 that linear_q4, moe_grouped and the WMMA kernels require. Views from strixw point into the loader's single allocation, while the owning upload serves weights derived after load, such as the MTP draft head's Q4 copy"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/q4_device.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.device-view/strixw-q4/-"
api       = "strix::Q4Device, strix::Q4DeviceView, Q4ChunkMajorDevice/View"
numeric   = "bytes as stored in the host format"
regime    = "header only; codes, scale and min as device pointers"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "runtime.strixite.device_buffer"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
