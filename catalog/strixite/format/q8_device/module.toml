id      = "format.strixite.q8_device"
kind    = "format"
summary = "Q8DeviceView and Q8Device: the device mirror of Q8's code, scale and min planes, shaped like Q4DeviceView, with views normally taken from StrixwDevice::q8 inside the loader's single allocation"
why     = "Provides format.device-view/strixw-q8, the input of linear_q8, the HC kernels and the Q8 embedding, which together carry the fleet layout's dense reads (attention projections, HC mixes, LM head). Its shape matches Q4's view, so runtime.strixite.qweight can wrap either behind one format-dispatching handle"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/q8_device.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.device-view/strixw-q8/-"
api       = "strix::Q8Device, strix::Q8DeviceView, Q8ChunkMajorDevice/View"
numeric   = "bytes as stored in the host format"
regime    = "header only; codes, scale and min as device pointers"

[[requires]]
module = "format.strixite.q8"

[[requires]]
module = "runtime.strixite.device_buffer"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
