id      = "format.strixite.convert_qwen4exp"
kind    = "format"
summary = "Offline converter library from Qwen3.8-Flash-Next HF safetensors to weights.strixw: applies the merge plan, quantizes each of 14 tensor classes to the format a per-class --layout string names (q4/q5/q6/q8 at G32, G64 or G128; embed BF16 or Q8), stacks the 512 routed experts and writes layout and source-fingerprint metadata"
why     = "Quantization and relayout happen once here so the engine converts nothing at load; it is where strixite's measured bit allocation lives (8 bits for the dense parts every token reads, 4 bits for the rarely touched experts; mean KL 0.028 and 226/242 top-1 for the published layout), and it refuses any format no kernel can run. The qwen38-flash-next strixite recipes bind format.convert/strixw to it and build the convert_qwen4exp tool on it. The fleet file came from it with expert down at G32, a +3.8 GB choice whose reason is not recorded"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/convert_qwen4exp.cpp", "formats/convert_qwen4exp.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/convert_qwen4exp.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.convert/strixw/-"
api       = "strix::convert_qwen4exp, strix::checkpoint_fingerprint"
numeric   = "per-class Q4/Q5/Q6/Q8 quantization by layout; HC norm weight folded before quantizing; router kept bf16"
regime    = "host, streaming, all cores"

[[requires]]
module = "format.strixite.merge_plan"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "format.strixite.q5"

[[requires]]
module = "format.strixite.q6"

[[requires]]
module = "format.strixite.q8"

[[requires]]
module = "format.strixite.safetensors"

[[requires]]
module = "format.strixite.strixw"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
