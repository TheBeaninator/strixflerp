id      = "format.strixite.safetensors_loader"
kind    = "format"
summary = "Bulk safetensors loader: concurrent pread workers over disjoint ranges into pinned host memory (buffered by default, O_DIRECT optional), then fdatasync plus POSIX_FADV_DONTNEED to evict the file from the page cache"
why     = "At target scale (about 115 GiB quantized on a 124 GiB machine) a second page-cache copy of the weights would crowd out everything else, so bytes go straight to pinned GPU-readable memory and the cache is dropped; buffered is the default because on the build machine's zstd btrfs O_DIRECT silently falls back to buffered anyway. It belongs to the safetensors-era load path: no binary links it now, and the strixite recipes keep it under [include] only so the build proves it compiles"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/weight_loader.cpp", "runtime/weight_loader.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/weight_loader.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.device-loader/safetensors/-"
api       = "strix::WeightLoader, strix::read_file_parallel"
numeric   = "bytes as stored"
regime    = "buffered or O_DIRECT; drops the file from the page cache after the read"

[[requires]]
module = "format.strixite.safetensors"

[[requires]]
module = "kernel.strixite.hip_common"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (2 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
