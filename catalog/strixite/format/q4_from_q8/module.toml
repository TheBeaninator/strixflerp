id      = "format.strixite.q4_from_q8"
kind    = "format"
summary = "Q8 to Q4 requantizer: dequantizes the Q8 rows exactly, then runs quantize_q4 at group G, threaded over contiguous row chunks with output byte-identical to a single call"
why     = "The MTP draft scores the LM head's first 65,536 rows on every draft call; those rows are Q8 in the served file (178 MB), and a Q4 G64 copy made once at load (94 MB) makes each draft cheaper, in the same spirit as the smaller draft vocabulary that took a draft from 3.9 to 1.7 ms. Starting from the served Q8 rather than BF16 gives the Q4 nearest to what the engine serves, and output cannot change because the full model verifies every drafted token"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/q4_from_q8.cpp", "formats/q4_from_q8.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q4_from_q8.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.requant/strixw-q4/-"
api       = "strix::quantize_q4_from_q8"
numeric   = "dequantize the Q8 rows exactly, then quantize as quantize_q4; byte-identical regardless of thread split"
regime    = "host, once at load"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "format.strixite.q8"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
