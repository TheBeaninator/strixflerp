id      = "format.strixite.safetensors"
kind    = "format"
summary = "Hand-rolled read-only safetensors reader: parses the 8-byte little-endian header length and the JSON header into name, dtype, shape and absolute byte offset per tensor, and mmaps the file so tensor data is never copied"
why     = "strixite reads Hugging Face checkpoints directly, without GGUF or a Python stack, so the converter, the merge plan and the Qwen3.5 baseline need their own parser, and mmap keeps header inspection cheap on checkpoints of hundreds of GB. It provides format.reader/safetensors in the qwen38-flash-next strixite recipes, chiefly feeding convert_qwen4exp; safetensors_loader reuses its parsed offsets for bulk reads"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/safetensors.cpp", "formats/safetensors.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/safetensors.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.reader/safetensors/-"
api       = "strix::SafetensorsFile"
numeric   = "bytes as stored"
regime    = "host; header and metadata inspection, converter input"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (8 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
