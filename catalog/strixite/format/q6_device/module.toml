id      = "format.strixite.q6_device"
kind    = "format"
summary = "Q6DeviceView and Q6Device: device residency for Q6 weights, each row 3K/4 bytes (low plane then 2-bit high plane) with BF16 scale and min planes, and a non-owning view carrying N, K and G"
why     = "Role inferred from the code: provides format.device-view/strixw-q6, the handle linear_q56 and linear_wmma take for Q6 dense layers and the type strixw_loader hands out for Q6 tensors. It is bound in every strixite qwen38-flash-next recipe so a Q6 layout would load, though no served tensor is Q6"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/q6_device.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = []
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.device-view/strixw-q6/-"
api       = "strix::Q6Device, strix::Q6DeviceView"
numeric   = "bytes as stored in the host format"
regime    = "header only; codes, scale and min as device pointers"

[[requires]]
module = "format.strixite.q6"

[[requires]]
module = "runtime.strixite.device_buffer"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (13 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
