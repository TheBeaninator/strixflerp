id      = "format.strixite.q8"
kind    = "format"
summary = "Q8 host format: one unsigned 8-bit code per weight with Q4's asymmetric BF16 scale and min per group (8.5 bits at G64), a quantizer bit-identical to the reference, and a chunk-major copy in 32-code chunks for the HC up-mix"
why     = "Every token reads the dense path, so strixite spends 8 bits there: an all-4-bit layout matched the full model at 194 of 242 positions against 224 with every dense part at 8 bits. In the fleet file it holds attention, GDN out, the HC mixes, the shared expert, PLE kv, the LM head and MTP fc. It has no expert gather, which is why the Q8 shared expert cannot ride in the Q4 expert stack"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/q8.cpp", "formats/q8.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q8.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.host/strixw-q8/-"
api       = "strix::Q8Weight, quantize_q8, dequantize_q8, append_rows_q8, to_chunk_major"
numeric   = "s = bf16((max - min) / 255), q = clamp(round_half_even((w - m) / s), 0, 255), all fp32"
regime    = "8.5 bits per weight at G = 64"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
