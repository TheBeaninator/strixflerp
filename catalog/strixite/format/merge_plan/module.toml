id      = "format.strixite.merge_plan"
kind    = "format"
summary = "Table of linear weights that read the same input (GDN qkv+z+b+a, attention q+k+v plus the QSA indexer projection, routed plus shared expert gate/up and down, router plus shared-expert gate), row-concatenated at quantization time and exact because quantization groups run along K and never straddle rows"
why     = "Small projections are launch-bound on gfx1151 (512x2560 reaches under half of read bandwidth where 12288x2560 gets about 89%), so fusing same-input weights into one tensor turns several thin launches into one wide launch with no numeric change. Only the converters use it (this origin's and flerp's p16 one); the fleet file skips the shared-expert-as-expert-512 merge because its shared expert is Q8 and the routed stack Q4"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/merge_plan.cpp", "formats/merge_plan.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/merge_plan.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.merge-plan/strixw/-"
api       = "strix::merge_plan, strix::resolve_merge, strix::quantize_merged"
numeric   = "row concatenation at quantization time is exact"
regime    = "host, converter and loaders"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "format.strixite.safetensors"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
