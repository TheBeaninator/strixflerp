id      = "format.strixite.strixw_loader"
kind    = "format"
summary = "strixw onto the device: one hipMalloc for the whole data region (GTT on gfx1151), 8 parallel preads into two 256 MiB pinned staging buffers whose reuse waits on an event for its last async copy, page cache dropped afterwards, then typed Q4/Q5/Q6/Q8/BF16 views looked up by name, encoding and shape"
why     = "Puts the 69.5 GiB fleet file into GPU-visible memory at NVMe speed with no conversion and no second copy in page cache; the event gate exists because reusing a pinned buffer for the next async copy without one corrupted data on gfx1151. It provides format.device-loader/strixw and also the four format.device-view interfaces, since every weight pointer a strixite kernel receives is a view into its single allocation"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["runtime/strixw_loader.cpp", "runtime/strixw_loader.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/runtime/strixw_loader.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.device-loader/strixw/-"
api       = "strix::StrixwDevice, strix::WeightPlacement"
numeric   = "bytes as stored"
regime    = "tensors keep file offsets and alignment; HostExperts placement is for test and bench tools only"

[[requires]]
interface = "format.device-view/strixw-q4/-"

[[requires]]
interface = "format.device-view/strixw-q5/-"

[[requires]]
interface = "format.device-view/strixw-q6/-"

[[requires]]
interface = "format.device-view/strixw-q8/-"

[[requires]]
module = "format.strixite.strixw"

[[requires]]
module = "kernel.strixite.hip_common"

[[requires]]
module = "runtime.strixite.check"

[[requires]]
module = "runtime.strixite.device_buffer"

[[requires]]
module = "runtime.strixite.qweight"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
