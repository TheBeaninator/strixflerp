id      = "format.strixite.q5"
kind    = "format"
summary = "Q5 host format: each row stores the Q4 low-nibble plane [K/2] followed by a 1-bit high plane [K/8], with Q4's BF16 scale and min per group; 5.25 bits per weight at G128, K a multiple of 128 so both planes stay 16-byte aligned"
why     = "A middle step for tensor classes that want more than 4 bits but not 8; sharing Q4's packing for the low plane lets the kernels (qsplit, linear_q4's Q5 expert gather) reuse the Q4 loop and add one bit. The converter accepts Q5 for routed experts, but the fleet file holds no Q5 tensor, and Q5 experts would prefill on slower BF16 scaled-code math because the F16 handoff refuses them"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/q5.cpp", "formats/q5.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q5.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.host/strixw-q5/-"
api       = "strix::Q5Weight, quantize_q5, dequantize_q5, append_rows_q5"
numeric   = "s = bf16((max - min) / 31), q = clamp(round_half_even((w - m) / s), 0, 31), all fp32"
regime    = "5.25 bits per weight at G = 128; K % 128 == 0"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status    = "builds"
evidence  = "gate/results/qwen38-flash-next.strixite-pf/built-modules.json"
reason    = "builds in recipe qwen38-flash-next.strixite-pf on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (18 files named in gate/results/qwen38-flash-next.strixite-pf/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-pf/build.txt; not run on a GPU from that build"
