id      = "format.strixite.q6"
kind    = "format"
summary = "Q6 host format: the Q4 low plane [K/2] plus a 2-bit high plane [K/4] per row with BF16 scale and min per group; 6.25 bits per weight at G128, K a multiple of 64"
why     = "Gives dense tensor classes a precision step between Q4 and Q8; the converter allows Q6 only for dense classes (no expert gather exists for it and the HC mixes refuse it), and kernel.strixite.linear_q56 runs it. Nothing in the fleet file is Q6, so it is a supported layout option the served file does not use"
design  = "DESIGN.md"

[provenance]
origin   = "strixite"
repo     = "https://github.com/shawnshekari/strixite"
commit   = "d19945e"
branch   = "tool-grammar-v070"
paths    = ["formats/q6.cpp", "formats/q6.hpp"]
authors  = ["shawnshekari"]
modified = false

[licence]
spdx = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/formats/q6.cpp"]
includes  = ["src"]
toolchain = "therock-10.1"

[[provides]]
interface = "format.host/strixw-q6/-"
api       = "strix::Q6Weight, quantize_q6, dequantize_q6, append_rows_q6"
numeric   = "s = bf16((max - min) / 63), q = clamp(round_half_even((w - m) / s), 0, 63), all fp32"
regime    = "6.25 bits per weight at G = 128; K % 64 == 0"

[[requires]]
module = "format.strixite.q4"

[[requires]]
module = "runtime.strixite.check"

[gate]
parity = "none"
bench  = "none"
status = "harvested"
