id        = "kernel.ciru_iu4.cuda_common"
kind      = "kernel"
summary   = "Header-only layer the CIRU kernel units include: ggml-cuda's shared device header common.cuh (CIRU changes two lines) and the 103 unchanged base headers of ggml-cuda, ggml/src and ggml/include that the CIRU files reach through #include (vendors/hip.h, the quantization block and conversion helpers, MMA / WMMA wrappers, the ggml backend headers)"
why       = "SPEC.md gives headers that several modules include a module of their own; these are base files (pwilkin/llama.cpp f5daaa3c) except common.cuh, taken only so that the CIRU families compile standalone; the rest of the base is not harvested"
notes     = "Interface tag: none. Files: common.cuh (CIRU, +2 -2 lines against the base) and 103 base files listed by the include closure that docs/harvest/harvest_ciru_iu4.py computes from the CIRU kernel files."

