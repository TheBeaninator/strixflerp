id        = "kernel.kestrel.prefill_moe"
kind      = "kernel"
summary   = "the HIP prompt-expert kernels ds4_iq.cu links: src/prefill/moe_fused_rdna4.cu (IQ prompt experts with int8 activation codes and FP32 scales per 32 values, adapted from Niko1221/Strata fb58e0d and PR #1570, MIT), the llama.cpp MMQ view moe_mmq.cu and glm-dsa's moe_mmq_strata.cu (compiled from the pinned llama.cpp checkout), ggml_cuda_host.cu (the host symbols of ggml-cuda they reference), their headers and the MMQ parity test"
why       = "ds4_iq.cu links these prompt-expert kernels on HIP (Kestrel's MMQ link fix is about exactly this), and moe_fused_rdna4.cu is an MIT adaptation of Strata's IQ prompt experts for AMD, a second route beside gufo's ds4_moe prefill"
notes     = "Interface tag: moe.experts-prefill/gguf-iq2+q2_k/f32 (the class of kernel.gufo.ds4_moe's prefill). moe_mmq.cu and moe_mmq_strata.cu include ggml-cuda's mmq.cuh / common.cuh from third_party/llama.cpp, which is not harvested. Nothing was compiled, run or timed on the pod."

[provenance]
origin    = "kestrel"
repo      = "https://github.com/itechmedic/kestrel"
commit    = "717c76975cd20d37b2e4162072d7745d6e1576ff"
branch    = "kestrel"
paths     = [
  "include/maya/prefill/failure.hpp",
  "include/maya/prefill/moe_fused_rdna4.hpp",
  "include/maya/prefill/moe_mmq.hpp",
  "include/maya/prefill/moe_mmq_strata.hpp",
  "src/prefill/ggml_cuda_host.cu",
  "src/prefill/moe_fused_rdna4.cu",
  "src/prefill/moe_mmq.cu",
  "src/prefill/moe_mmq_strata.cu",
  "tests/hip/prefill_mmq_parity.cpp",
]
authors   = ["itechmedic", "Project Maya contributors (mw00)"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "cuda"
sources   = [
  "src/src/prefill/moe_fused_rdna4.cu",
  "src/src/prefill/moe_mmq.cu",
  "src/src/prefill/moe_mmq_strata.cu",
  "src/src/prefill/ggml_cuda_host.cu",
]
includes  = ["src/include", "src/include/maya/prefill", "src/src/prefill", "src/tests/hip"]
arch      = "gfx1151"
toolchain = "rocm-7.2.4"

[[provides]]
interface = "moe.experts-prefill/gguf-iq2+q2_k/f32.kestrel"
api       = "maya::prefill moe_mmq / moe_fused_rdna4 entry points (include/maya/prefill/moe_mmq.hpp, moe_fused_rdna4.hpp)"
numeric   = "int8 activation codes with FP32 scales per 32 values (MMQ / Q8_1 style); IQ blocks decoded with ggml's codebooks"
regime    = "prompt chunks; MMQ from a minimum of rows per expert (mmq_min_rows)"

[[requires]]
module    = "kernel.kestrel.hip_compat"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "a translation unit of Maya's CMake build with MAYA_ENABLE_HIP (cmake/hip_backend.cmake): the .cu file is compiled as HIP through include/maya/hip_compat, for gfx1100 / gfx1201 / gfx1151 (validated) with the engine's include roots and ggml from third_party; it needs headers this harvest leaves in the origin, so it is not compiled here"
