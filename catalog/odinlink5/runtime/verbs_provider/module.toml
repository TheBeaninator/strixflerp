id        = "runtime.odinlink5.verbs_provider"
kind      = "runtime"
summary   = "a libibverbs provider over OdinLink: devices, protection domains, memory regions, completion queues, queue pairs and post / poll ops mapped onto the stream API, usable two ways, as an LD_PRELOAD interposer that wraps ibv_open_device for /dev/odl_tb5_* and passes real InfiniBand / RoCE through, or as an rdma-core provider plugin (libodl_tb5-rdmav34.so) so ibv_devinfo lists odl_tb5; with a mock and loopback / dmabuf tests and the technical manual"
why       = "verbs is the API MPI, NCCL's IB transport and ggml-rpc RDMA already speak; a provider makes the cable look like an RDMA NIC to them without code changes, the way strixflerp's RoCE rail is reached today (transport.verbs)"
notes     = "Interface tag: transport.verbs (an ibverbs device, like the catalogue's RoCE provider). Needs libibverbs headers to compile. Nothing was run: no Thunderbolt / USB4 link joins pod nodes, no driver was loaded (card d2a7b91dec)."

