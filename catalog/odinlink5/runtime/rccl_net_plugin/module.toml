id        = "runtime.odinlink5.rccl_net_plugin"
kind      = "runtime"
summary   = "the RCCL net plugin (librccl_net_odl_tb5.so, symlinked librccl-net.so for RCCL's probe): ncclNet_v7 over the stream API, NCCL_PTR_HOST only so RCCL stages GPU <-> host itself, one shared ref-counted device handle a process with each connection a stream multiplexed over the link, blocking stream transfers moved to background threads so isend / irecv / test keep RCCL's non-blocking contract; plus odl_tb5_net_v7.c, an alternative against NVIDIA's real v7 headers (rccl/official) that the build does not compile"
why       = "RCCL silently falls back to TCP sockets (~4x slower) when no net plugin loads, and it ignores LD_PRELOAD verbs interposers (docs/GPU.md); this plugin is how vllm-strix-halo's prefill collectives ride the cable, and the shape any RCCL-over-USB4 pod pair would load"
notes     = "Interface tag: none (collective.* providers in the catalogue are collectives, not RCCL transports). rccl/official/nccl/*.h are NVIDIA's plugin headers (Apache-2.0, SPDX in each); the plugin sources carry no SPDX line and fall under the README's MIT for userspace. odl_tb5_net_v7.c says it replaces odl_tb5_plugin.c, but rccl/CMakeLists.txt builds only odl_tb5_plugin.c; both are compiled by the gate. Nothing was run: no Thunderbolt / USB4 link joins pod nodes, no driver was loaded (card d2a7b91dec)."

