id        = "tool.odinlink5.daemon"
kind      = "tool"
summary   = "odl-tb5-daemon, a GLib background service: D-Bus API for peer status (com.odinlink.Tb5Daemon), cable plug / unplug monitoring, a file-sync engine with its own protocol and a catalogue, export of RCCL shared-memory stats, a FUSE mount of the peer filesystem and a link self-test, with its systemd and D-Bus unit files"
why       = "operational plumbing around a link (who is connected, how RCCL traffic is doing) that a pod pair would want surfaced; strixflerp would take the stats export, not the sync engine"
notes     = "Interface tag: none. Not compiled by the gate: needs GLib / gio, FUSE 3 and gdbus-codegen output that CMake generates. Nothing was run: no Thunderbolt / USB4 link joins pod nodes, no driver was loaded (card d2a7b91dec)."

