id        = "tool.libstrix.kernel_tests"
kind      = "tool"
summary   = "libstrix' per-kernel checks, all Python through torch.ops.strix: tests/ holds the pytest files that compare kernels with torch references (conftest.py, an architecture gate, a file a kernel or weight format, and the tests of the registry table and of bench/results.py), and bench/kernels/ holds a timing script a kernel (attention prefill, GDN chunk and conv, gated RMSNorm, MoE bf16 / WNA16 / FP8, FP8 and MXFP4 GEMM and GEMV, W8A16 decode, W8A8, QSA indexer / sparse / union, the dense_w8 row sweep and two NPU projection benches)"
why       = "the survey counted a bench script a kernel among the reasons libstrix is the cheapest origin to harvest; these scripts and the torch-reference tests define what correct and faster mean for each kernel in the origin's own terms, which the timing card against the strixite modules needs before it writes its own"
notes     = "Interface tag: none. Not run here: the pod has not built _C.so. bench/model, bench/container, bench/results.py, bench/run_guarded.sh and bench/upstream.sh (model-level and container checks) are not harvested."

