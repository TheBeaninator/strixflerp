id        = "kernel.libstrix.moe"
kind      = "kernel"
summary   = "libstrix' four grouped expert GEMMs over vLLM's moe_align_block_size layout, one block per (BM sorted ids of one expert, BN output columns), with the SiLU or GELU-tanh gate and the gate * up product fused into the first GEMM: bf16 weights, int4 with bf16 activations, int4 with int8 activations on the iu8 WMMA, and one-byte weights (int8, FP8, raw FP8)"
why       = "kernel.strixite.moe_grouped buckets routes itself and reads strixw Q4 / Q5 rows; these kernels do the grouped product on the sorted-id layout a vLLM host already has and on four other weight encodings, with two ideas to try against it: the deferred group scale that keeps int4 weights unrounded, and int8 activations on the iu8 WMMA (1.2-1.34x the W4A16 tile at 16k Flash-Next tokens, docs/kernels.md:84)"
notes     = "Interface tags by file: moe_gemm_bf16.hip moe.experts-prefill/bf16/bf16; moe_gemm_w4a16.hip moe.experts-prefill/ct-int4/bf16; moe_gemm_w4a8.hip moe.experts-prefill/ct-int4/i8-f32; moe_gemm_w8a16.hip moe.experts-prefill/ct-int8+fp8-e4m3/bf16 (catalog/libstrix/KERNELS.md has the table). Routing and the sorted-id layout (sorted_ids, expert_ids, num_post_padded) are the caller's, vLLM's moe_align_block_size. Expert weight rows should not sit a large power of two apart: 4 KiB-strided rows read 4x slower on gfx1151 by the origin's measurement (moe_gemm_bf16.hip header), so the plugin pads the row pitch. The class is moe.experts-prefill, the grouped form beside kernel.strixite.moe_grouped; vLLM calls these kernels for its expert GEMMs at decode as well. No timing was taken on the pod."

[provenance]
origin    = "libstrix"
repo      = "https://github.com/asf0/libstrix"
commit    = "4f1c06f55d520c734a66101e8c31fc5dd9dedeb3"
branch    = "main"
paths     = [
  "csrc/moe/moe_gemm_bf16.hip",
  "csrc/moe/moe_gemm_w4a16.hip",
  "csrc/moe/moe_gemm_w4a8.hip",
  "csrc/moe/moe_gemm_w8a16.hip",
]
authors   = ["asf0"]
modified  = false
upstream  = "the sorted-id layout and the weight formats are those of vLLM (Apache-2.0, vllm-project/vllm) and the asf0/strix-vllm fork (branch gfx1151) (moe_align_block_size, the Triton WNA16, int8 and FP8 expert paths)"

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/csrc/moe/moe_gemm_bf16.hip",
  "src/csrc/moe/moe_gemm_w4a16.hip",
  "src/csrc/moe/moe_gemm_w4a8.hip",
  "src/csrc/moe/moe_gemm_w8a16.hip",
]
includes  = ["src/csrc/moe"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "moe.experts-prefill/bf16/bf16.libstrix"
api       = "torch.ops.strix.moe_gemm_bf16 (csrc/moe/moe_gemm_bf16.hip; schemas in csrc/torch_ops.cpp)"
numeric   = "bf16 operands on the bf16 WMMA; the SiLU instantiation keeps the exact expression its published numbers were measured on (file header)"
regime    = "both expert GEMMs of vLLM's TritonExperts; no quantization, LoRA, bias or expert parallelism (docs/kernels.md:69)"

[[provides]]
interface = "moe.experts-prefill/ct-int4/bf16.libstrix"
api       = "torch.ops.strix.moe_gemm_w4a16 (csrc/moe/moe_gemm_w4a16.hip; schemas in csrc/torch_ops.cpp)"
numeric   = "bf16 activations; DEFER keeps the weights unrounded: acc += s[n] * (raw - 136 * rowsum(A)), the row sums from one extra WMMA against a ones fragment (file header)"
regime    = "uint4 with group 32 / 64 / 128, no zero-point (docs/kernels.md:70)"

[[provides]]
interface = "moe.experts-prefill/ct-int4/i8-f32.libstrix"
api       = "torch.ops.strix.moe_gemm_w4a8, torch.ops.strix.moe_act_quant_i8 (csrc/moe/moe_gemm_w4a8.hip; schemas in csrc/torch_ops.cpp)"
numeric   = "C[sid, n] = sum over groups of sa * sw * integer dot (file header); activations are quantized, so it changes numerics against the W4A16 kernel and is on for Qwen3.8-Flash-Next only by default (docs/kernels.md:10)"
regime    = "batches of 1,024 tokens or more; uint4 with group 128, K % 128 == 0 (docs/kernels.md:84)"

[[provides]]
interface = "moe.experts-prefill/ct-int8+fp8-e4m3/bf16.libstrix"
api       = "torch.ops.strix.moe_gemm_w8a16, torch.ops.strix.moe_gemm_fp8, torch.ops.strix.moe_gemm_fp8_raw (csrc/moe/moe_gemm_w8a16.hip; schemas in csrc/torch_ops.cpp)"
numeric   = "activations stay bf16 (fp16 for the raw forms), not quantized; in the raw forms the weights are exact and the fused activation is written as fp16, or as bf16 when silu(gate) * up leaves the fp16 range (file header)"
regime    = "int8: K % 64 == 0, N % 128 == 0, opt-in because it measured slower than Triton's int8 WMMA (docs/kernels.md:71); FP8: N % 128 == 0 (docs/kernels.md:72)"

[[requires]]
module    = "kernel.libstrix.common"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "a translation unit of python/strix/_C.so: built by the origin CMake (CMakeLists.txt globs every csrc/**/*.hip beside csrc/torch_ops.cpp; HIP standard 20, -O3 -ffp-contract=fast -munsafe-fp-atomics, gfx1151, linked against libtorch). The host half of each file takes torch::Tensor arguments, so no unit compiles without the PyTorch headers; not compiled by this harvest"
