# Code written in this repository: adapters between engines and whatever no origin provides (SPEC.md section 3).
name      = "flerp"
repo      = "in-tree"                                    # this repository; there is no upstream
commit    = "in-tree"                                    # versioned with the tree, not vendored from a commit

[licence]
spdx      = "MIT"
# The texts of the licences this origin's files name by SPDX line, canonical copies (in-tree origin: no harvest script;
# a copy of the same files as docs/harvest/data/licences/SOURCES.tsv lists)
canonical_files = ["LICENSES/MIT", "LICENSES/Apache-2.0.txt"]
canonical_source = "LICENSES/MIT: docs/harvest/data/licences/linux-LICENSES-preferred-MIT (the Linux kernel's LICENSES/preferred/MIT); LICENSES/Apache-2.0.txt: catalog/strixfold/LICENSES/Apache-2.0.txt (StrixFold fork f64b5ff), for the Apache-2.0 files runtime.flerp.vision_sidecar adapts from Strixfold pull request #6"
canonical_note = "LICENSES/MIT keeps the canonical template line '<year> <copyright holders>': no holder is named here"
note      = "Adapters include and link the launch headers of the modules they sit between; the assembled binary carries those modules' licences (flerp licence-report <recipe>)."

[toolchain]
host      = "the recipe's toolchain (toolchains.toml): adapters are compiled by the assembly's own rules"
device    = "therock-10.1"

[harvest]
mode      = "modules"
