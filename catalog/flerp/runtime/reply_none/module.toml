id        = "runtime.flerp.reply_none"
kind      = "runtime"
summary   = "include/flerp/reply.h with no reply parser behind it: every call returns FLERP_E_UNSUPPORTED, so the front end returns chat text whole"
why       = "Placeholder for models whose reply forms are not yet wrapped (StrixFold's DeepSeek recipe until FLERP-SF-REPLY): an explicit unsupported answer makes the front end return text unsplit and refuse tools, thinking budgets and structured output by name instead of guessing at a format"
notes     = "The front end then returns chat replies whole and refuses tools, thinking budgets and structured output by name (FLERP-SF-REPLY brings StrixFold's)."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/reply/reply_none.c"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c"
sources   = ["src/flerp/reply/reply_none.c"]
includes  = ["../../../../include"]
c_std     = 11

[[provides]]
interface = "text.reply/flerp-v1/-"
api       = "flerp_reply_open .. flerp_reply_nudge_fired (include/flerp/reply.h)"
numeric   = "n/a: splits nothing"
regime    = "none"

[gate]
parity    = "flerp:gate/flerp_serve.py"
bench     = "none"
