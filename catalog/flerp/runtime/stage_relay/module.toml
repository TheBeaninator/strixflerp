id        = "runtime.flerp.stage_relay"
kind      = "runtime"
summary   = "Framed point-to-point relay between the stages of a model split by blocks: FP32 hidden rows down a ring of ranks, the last rank's reply back to rank 0, control calls mirrored down the chain; every frame checked (magic, epoch, ordinal, op, rows, bytes, plan hash), the first failure poisons and closes both links, abort is idempotent; TCP (rank r listens on port + r) or an in-process loopback; plus the one rule (SubchunkParts) for how many sub-chunks a prompt call goes down the ring as"
why       = "Phase 5 split Ornith by layer stages because nothing then crosses the wire inside a layer and the logits stay the single-node executor's bit for bit; the stages need only FP32 hidden rows passed down a ring with StrixFold's collective contract (same call sequence, every frame checked, first failure poisons); measured bit-equal across stages, over TCP and across two machines on the rail, at 1.9-2.5 ms of relay per decode token"
notes     = "Written here for phase 5 (docs/PHASE5-FOURNODE-DESIGN.md section 3.3, stage P2). C++ and POSIX sockets only: no HIP, no code of the catalogue. The contract is runtime.strixfold.coll's (coll.zig:7-15): every rank issues the same call sequence, every frame is checked, the first failure poisons, abort is idempotent. First version: the data chain and the reply link are one ring; control frames (RESET, CLOSE) travel down the chain with the data, each rank forwarding before acting, in place of a separate control link from rank 0 to every rank. VERIFY is a valid op on the wire but nothing issues it yet; KEEP, KEEP_PREFIX and DROP are not written. Stage P3 added Recv(header_deadline) (a stage waiting between its caller's calls gives a long one; the payload keeps the config's deadline) and Interrupt() (async-signal-safe: shuts the links down so a blocked call fails; for a SIGTERM handler). ORNITH-SUBCHUNK (card 6abf28258c, gate/ornith-subchunk.toml) added SubchunkParts(rows, subchunks, min_rows): auto = clamp(rows / unit, 1, 16) with unit = min_rows (1,024 by default), or S parts, then a floor so no part is under min_rows rows, parts differing by at most one row. It lives here so the stage driver and the ABI pipeline cut prompts identically; it replaced a fixed count whose 256-row parts were weight-bandwidth bound on Ornith (report ornith-confirm2.md). ORNITH-PCACHE (card a3656fc5e9) added two RESET flags instead of new ops, so the wire format and every frame check stay as they were: kSnapSave (no reset; each stage keeps its KV and recurrent state at start_pos positions, the last stage's draft head also its prompt edge) and kSnapRestore (each stage resets, then puts that state back); executor.flerp.qwen35moe_abi's prefix reuse is their only caller. tests/cpp/stage_relay_selftest.cpp (run by tests/test_stage_relay.py) checks the relay and the cut without a GPU. ORNITH-CRUCIBLE item 4 (card fbe7f600ae): the RESET flag kSpecLookup (256) with kSpecRound asks the stages for prompt-lookup drafts first and at most (flags >> 16) & 0xff MTP drafts a round (draft_round.hpp); the wire format is otherwise unchanged."

