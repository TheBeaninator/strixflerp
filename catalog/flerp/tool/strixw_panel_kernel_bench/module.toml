id        = "tool.flerp.strixw_panel_kernel_bench"
kind      = "tool"
summary   = "Kernel gate of the strixw panel layout: real tensors of the fleet strixw read by byte range, laid out row-major and as panels in memory, every decode / prefill / expert path run through strixite's call names both ways; byte comparison and per-kernel times (hip events, caches flushed, origin and panel alternating)"
why       = "Panel kernels have to be judged on the fleet's real tensors, byte for byte and against the origin's kernel under the same conditions; reading only the named tensors' byte ranges and calling strixite's own names on row-major and panel views alternately gives that comparison (489 cases, 2.2 GB read a run) without loading the 74.6 GB model"
notes     = "Criteria and run settings: gate/strixw-panel-kernels.toml, runner gate/strixw_panel_kernels.py. Built inside recipes/qwen38-flash-next.strixite-p16.toml, so the names it calls are the adapters of kernel.flerp.linear_q4p / linear_q8p / wmma_q4p / moe_grouped_p (row-major view: strixite's kernel; panel-tagged view: the panel kernel)."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/strixw_panel_kernel_bench/panel_kernel_bench.cpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/flerp/strixw_panel_kernel_bench/panel_kernel_bench.cpp"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "tool.kernel-bench/strixw-panel/-"
api       = "main (strixflerp-panel-kernel-bench --weights W --out FILE --class name=tensor .. [--decode-m L] [--prefill-m L] [--reps R] [--active A])"
numeric   = "outputs compared byte for byte; times in ms from hip events"
regime    = "needs the GPU; reads only the named tensors' byte ranges and the index"

[[requires]]
interface = "linear.decode/strixw-q4/bf16"

[[requires]]
interface = "linear.decode/strixw-q8/bf16"

[[requires]]
interface = "linear.prefill/strixw-q4/bf16"

[[requires]]
interface = "linear.prefill/strixw-q8/bf16"

[[requires]]
interface = "moe.experts-decode/strixw-q4/bf16"

[[requires]]
interface = "moe.experts-prefill/strixw-q4/bf16"

[[requires]]
module    = "format.flerp.q4panel"

[[requires]]
module    = "format.flerp.panel_device"

[[requires]]
module    = "format.strixite.strixw"

[[requires]]
module    = "kernel.strixite.hip_common"

[[requires]]
module    = "kernel.strixite.norm"

[[requires]]
module    = "runtime.strixite.check"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen38-flash-next.strixite-p16 on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (1 files named in gate/results/qwen38-flash-next.strixite-p16/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-p16/build.txt; not run on a GPU from that build; earlier note: built only inside recipes/qwen38-flash-next.strixite-p16.toml; a measuring tool, read by gate/strixw_panel_kernels.py"
evidence  = "gate/results/qwen38-flash-next.strixite-p16/built-modules.json"
