id        = "tool.flerp.qwen35moe_generate"
kind      = "tool"
summary   = "A greedy token generator over executor.flerp.qwen35moe (HIP, or the CPU reference with --cpu) that prints token ids as JSON lines, with a traced mode (top logits a position, hidden states after named blocks, router choices), and the top of the CMake build graph for that one program"
why       = "The workhorse binary of the Ornith work before the ABI existed: the recipe gate's greedy ids, a trace mode for comparing logits, hidden states and router picks with llama.cpp, and the staged driver that proved stage splits bit-equal on one GPU and over the rail; ORNITH-O1O2's pinned row buffers (83 to about 76 ms an Ornith token) and token-only reply were first built here"
notes     = "generate.cpp is tool.flerp.gufo_qwen_generate's with --trace added. CMakeLists.txt is that module's build file statement for statement up to gufo's own directories, then swaps the adapted sources into gufo_qwen27b and adds the MoE kernel libraries; no_image.cpp is that module's. stage_driver.cpp (--staged, stage P2 of docs/PHASE5-FOURNODE-DESIGN.md) runs the model as N stages joined by runtime.flerp.stage_relay: in one process over one load (loopback) or one rank a process over TCP; it is the reference the ABI pipeline (executor.flerp.qwen35moe_abi) is checked against. ORNITH-O1O2 (gate/ornith-o1o2.toml): stage rows through fixed pinned host buffers (--rows pinned, the default; Crucible device_memory pinned_buffer.h), a token-only reply (--reply token: the last stage's executor already picks the id on the GPU, lowest id on a tie), and prompt sub-chunks sent back to back (StrixFold stagger.zig). ORNITH-SUBCHUNK (card 6abf28258c, gate/ornith-subchunk.toml): --prompt-subchunks auto|S cuts with runtime.flerp.stage_relay's SubchunkParts (auto = clamp(rows / 1,024, 1, 16)), --subchunk-min-rows N sets the floor (default 1,024), and --in-flight N (default 8; 0 = drain every call) leaves up to N prompt replies unread across chunk calls so the ring does not drain between them; --run-specs takes a fifth field F for a run's in-flight window and the staged events record each prompt call's parts and the most replies in flight. These are the generator half of gate/results/ornith-subchunk; the reason (256-row parts weight-bandwidth bound, a drain between 4K calls) is in executor.flerp.qwen35moe_abi's notes. ORNITH-BRIDGE (card 8db1be3486, gate/ornith-bridge.toml): with --reply full the staged event also carries logits_top, each hashed row's 8 largest logits (ties to the lower id) and its log-sum-exp, because window 11140653 recorded only tokens where the old prompt path and arm G split on Ornith, so the size of the margin there could not be read; with it the next window (gate/ornith-window3.toml [fidelity]) measures the 397B's top-2 gap at a split directly, which the gate/prefill-ornith.toml amendment of 2026-11-14 judges (a split passes when the old path's own gap is under 0.3 nats). PREFILL-KPROF (card 9506f4f116): --arms gains L = G with kernel.flerp.moe_kgrouped's live-tile items (flerp::kgrouped::SetLiveTiles), the arm gate/prefill_kprof.py judges against G. Prompt-path arms (--arms, PREFILL-ORNITH 8ef0a645e7 and MOE-COMBINE 2dc55e67f0): one load runs the prompt list once per arm so a lever is judged against its incumbent inside one process (gate/lever_gate.py): A per-token experts, B grouped, E grouped exact, F and X add the dense projections on the grouped Linear (F16 / exact), G and Y add the GQA WMMA attention, C is G plus the 16-byte MoE combine and one F16 conversion per shared projection input, L is G with live-tile items (PREFILL-KPROF), R is G with the tiled prompt router (flerp::moe::SetRouterTiled, ROUTER-GEMM). CMakeLists.txt also swaps in the adapted hip/arena.cpp, adds attn_wmma_gqa.hip to flerp_moe_kernels and compiles moe_combine.hip inside flerp_qfn_kernels with the qfn unit's options. ORNITH-CRUCIBLE (fbe7f600ae): stage_driver.cpp's --run-specs takes NpL / vNpL (prompt-lookup drafts first, at most L, else at most N MTP drafts) and sends it to the stages as relay::kSpecLookup; CMakeLists.txt adds draft_coarse.hip to flerp_moe_kernels for mtp_head's coarse scoring."

