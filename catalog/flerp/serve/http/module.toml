[[provides]]
interface = "serve.http/openai/-.executor-abi"
api       = "main: strixflerp-<recipe> [--host H] [--port N] ... executor.KEY=VALUE text.KEY=VALUE; flerp_host_main for a host that owns process start"
numeric   = "n/a"
regime    = "one conversation at a time; requests queue"

[[requires]]
interface = "executor.abi/flerp-v1/-"

[[requires]]
interface = "text.model/flerp-v1/-"

[[requires]]
interface = "sample.host/flerp-v1/-"

[[requires]]
interface = "text.reply/flerp-v1/-"

[[requires]]
module    = "runtime.flerp.decode_loop"

[[requires]]
module    = "serve.strixite.cpp_httplib"

[[requires]]
module    = "runtime.strixite.json"

[[requires]]
module    = "runtime.strixite.check"

[gate]
