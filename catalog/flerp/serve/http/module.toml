id        = "serve.flerp.http"
kind      = "serve"
summary   = "An OpenAI-compatible HTTP server in front of the executor ABI, for whichever executor a recipe binds: /v1/chat/completions and /v1/completions (JSON or SSE), /v1/models, /health, /tokenize; temperature, top_p, top_k, seed, max_tokens, stop; samples on the host where the executor hands back rows and lets the executor draw where it hands back tokens, by its capability flags"
why       = "One OpenAI-compatible server for every engine instead of one per origin: it reads each executor's capability flags to decide whether to sample from rows or take the executor's draws, so strixite, StrixFold and the staged Ornith executor are all served by the same code; on strixite it gives the native server's tokens, step records and text on the gated requests"
notes     = "One conversation at a time. A chat reply is split by the bound reply module (text.reply/flerp-v1/-) into reasoning_content, content and tool_calls, with strixite's reply policy (thinking budget stop, nudge, think-end guard, think close before a call) on the shared decode loop's hooks; a recipe binding runtime.flerp.reply_none returns the text whole and refuses tools and budgets. Drafts: --drafts N is the most drafts a verify of a seq holds, passed to flerp_seq_new as that count (SERVE-DRAFTS3, card 3f6d20b703; it was passed as a flag, so an executor that holds its drafts held one whatever N was); the decode loop runs the rounds. Not served, and refused by name: prompt cache, vision, steering, tool_choice other than auto / none. README.md, 'The front end'. Called by the Ornith engine (tools/ornith-engine/engine.py) as rank 0 of the stage recipe."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/serve/main.cpp", "flerp/serve/request.cpp", "flerp/serve/request.hpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/flerp/serve/main.cpp", "src/flerp/serve/request.cpp"]
