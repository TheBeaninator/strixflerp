id        = "executor.flerp.qwen35moe_abi"
kind      = "executor"
summary   = "executor.flerp.qwen35moe behind the executor ABI, at world 1 or cut by block range into N stages joined by runtime.flerp.stage_relay (rank 0 in the caller's process; ranks 1..N-1 in that process as views of one load, or one tool.flerp.qwen35moe_stage process each over TCP): one seq, greedy tokens or full logits rows, one row a forward; a prompt forward goes down the ring as up to 16 sub-chunks of at least 1,024 rows with up to 8 replies left unread across forwards, so the stages stay busy between the caller's chunks; MTP drafts held on the device by the last stage (FLERP_CAP_DRAFT_HELD, value-aware depth with draft_value=on); slot-resident prefix reuse (reuse_tail, reuse_grid): every stage keeps one device copy of its KV and recurrent state at the start of the last prompt forward, and a next prompt that begins with those ids restores it and prefills only the rest, in the chunks a cold prefill uses; no ABI snapshot calls"
why       = "Ornith-1.5 397B does not fit one node, and the phase 5 decision (docs/PHASE5-FOURNODE-DESIGN.md section 0) splits it by layers so that every kernel and the decode graph stay the single-node executor's and the logits stay its bits at any stage count; this module puts that split behind include/flerp/executor.h, so serve.flerp.http, runtime.flerp.decode_loop and the conformance driver drive four nodes as they drive one executor. Prefix reuse exists because an Ornith serving window is one slot and FreeFitty resends the whole thread every turn (system prompt, tools, history: 20-60K tokens), about 26 s of prefill on the 35B proxy at 19.5K tokens, almost all of it the same prefix as the turn before."
notes     = "Stage P3 of docs/PHASE5-FOURNODE-DESIGN.md (section 3.9). stages.cpp is stage P2's stage mechanics (Stage, ServeOne, View and the relay plan of tool.flerp.qwen35moe_generate's stage_driver.cpp) as a library: rank 0's Pipeline and the stage loop of the other ranks, which waits for its caller's next call with no deadline and ends with status 0 on CLOSE or SIGTERM (Relay::Interrupt from the handler). abi.cpp maps the ABI onto it; its header says which forward is a prompt chunk and which a decode step. flerp_open keys: weights, context, world, rank (0), peers (loopback | HOST[,HOST...]:PORT), placement (even | cuts), epoch, deadline_ms, setup_deadline_ms, graph, single_reader, pause_ms, data_file (the bytes from a same-size copy, e.g. loom-swarm's sparse rank file), swarm_helper, swarm_manifest, swarm_from, swarm_conns (the bytes streamed by loom-swarm straight into the device, nothing on disk), subchunks, subchunk_min_rows, in_flight, drafts, draft_value, reuse_tail, reuse_grid (rank 0), draft_head, draft_costs, mtp_data_file (the last stage process); every load goes through format.flerp.gguf_placed, by the single O_DIRECT reader unless single_reader=off. Drafting: ORNITH-O3 step two (gate/ornith-o3-spec.toml) put the MTP head on the last stage, which drafts after each reply and keeps the drafts on the device, so a verify names them by count and nothing extra crosses the ring. SERVE-DRAFTS3 (card 3f6d20b703, gate/serve-drafts3.toml) made the depth reachable from the serve path: the front end had opened its seq with drafts as a flag (1), so the last stage held one draft and a depth-3 hold failed with \"flerp_draft_hold: 3 drafts asked, the last stage holds 1\" (gate/results/ornith-config-check run 5). With draft_value=on the last stage runs Crucible's value-aware depth rule (draft_value.h, re-expressed in executor.flerp.qwen35moe draft_round.hpp, costs from draft_costs base_ms,row_ms,mtp_ms, default Ornith's 75.2,19.68,4.83) and may hold fewer than asked; flerp_draft_hold then holds what it has and flerp_verify returns 1 + held rows. Without draft_value a short hold is still FLERP_E_STATE. Evidence gate/results/serve-drafts3 (35B world 4 loopback: nodrafts, d1, d3 and v3 each give the same ids and text as nodrafts on 3 chats, and d3 / v3 run 3 drafts a verify). Prompt pipelining, ORNITH-SUBCHUNK (card 6abf28258c, gate/ornith-subchunk.toml): the Ornith window ORNITH-CONFIRM2 (report /data/pod/reports/2026-11/ornith-confirm2.md, \"Fixes, ranked\" 1-3) found two prefill losses on the ring: 256-row sub-chunks are weight-bandwidth bound (each streams nearly a whole stage's experts, +16.3 s at 32K), and the ring drained between the front end's 4,096-row calls (10.9 s at 32K). Pipeline::Call now cuts a prompt forward with relay::SubchunkParts (key subchunks: auto = clamp(rows / 1,024, 1, 16), or S; subchunk_min_rows floor, default 1,024) and, over TCP, returns from a forward that wants no row as soon as its sub-chunks are sent, reading the oldest reply only when in_flight (default 8; 0 = the old drain) are unread; a forward that wants its row, a decode step, a verify, a reset and a close read every unread reply first. The window is bounded because an unread reply holds one of the receiver's RDMA receive slots (16 posted, card 312ce8c262). It moves no bit because the prompt kernels are row-invariant across chunk cuts (PREFILL-G4 D1, PREFILL-LRC Z1). Evidence gate/results/ornith-subchunk (35B world 4 TCP: ids and every logits sha256 equal to the drain-per-call reference on 7 prompts of 21 to 32,768 tokens, parts [16,4] at 20K and [16,16] at 32K with 8 replies in flight; serve ids and text equal on a 23,437-token chat). Speed is for the next Ornith window to judge (one GPU cannot pipeline). The defaults apply to every caller, the Ornith engine's serve path included. The prefix reuse mechanism, why the snapshot sits at the last forward's start and on a 1,024-position grid, and what a restore puts back, are in DESIGN.md. ORNITH-PCACHE step 0 (card a3656fc5e9, gate/ornith-pcache.toml): evidence gate/results/ornith-pcache-g1024 (35B world 4 loopback, reuse_grid 1024: T2 warm 2.4 s vs cold 26.5 s, 10.9x; T3 0.7 s vs 26.3 s; warm ids equal cold ids; about 552 MiB a stage for the snapshot copy), with run A (grid 0, 3.7x) and v1 (snapshot inside the final chunk, ids drifted) kept as evidence. configs/ornith397.serve.toml sets reuse_tail 32 and reuse_grid 1024, and tools/ornith-engine/engine.py passes them to rank 0, so the Ornith serve path uses it. The frozen RAM-tier cache shared across slots (the rest of card a3656fc5e9) is not built."
design    = "DESIGN.md"

