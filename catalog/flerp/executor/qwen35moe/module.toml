  "flerp/qwen35moe/draft_round.hpp",
  "flerp/qwen35moe/moe_ffn.cpp",
  "flerp/qwen35moe/moe_ffn.hpp",
  "flerp/qwen35moe/mtp_head.cpp",
  "flerp/qwen35moe/mtp_head.hpp",
  "flerp/qwen35moe/stage.cpp",
  "flerp/qwen35moe/stage.hpp",
  "flerp/qwen35moe/src/models/qwen/forward.cpp",
  "flerp/qwen35moe/src/models/qwen/hip/arena.cpp",
  "flerp/qwen35moe/src/models/qwen/hip/batched_decode.cpp",
  "flerp/qwen35moe/src/models/qwen/hip/decode.cpp",
  "flerp/qwen35moe/src/models/qwen/hip/decode_step.cpp",
  "flerp/qwen35moe/src/models/qwen/hip/model_loader.cpp",
  "flerp/qwen35moe/src/models/qwen/hip/prefill_chunk.cpp",
  "flerp/qwen35moe/src/models/qwen/state.hpp",
  "flerp/qwen35moe/src/models/qwen/weights.cpp",
]
authors   = ["gufo contributors", "neuhaus", "pod"]
modified  = false
upstream  = "gufo https://github.com/neuhaus/gufo f070a17 (branch rdma, MIT): src/models/qwen/state.hpp, weights.cpp, forward.cpp, hip/model_loader.cpp, hip/decode_step.cpp, hip/batched_decode.cpp, hip/prefill_chunk.cpp, adapted here (catalog/gufo/executor/qwen holds them verbatim)"

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = [
  "src/flerp/qwen35moe/draft_round.cpp",
  "src/flerp/qwen35moe/moe_ffn.cpp",
  "src/flerp/qwen35moe/mtp_head.cpp",
  "src/flerp/qwen35moe/stage.cpp",
  "src/flerp/qwen35moe/src/models/qwen/forward.cpp",
  "src/flerp/qwen35moe/src/models/qwen/hip/arena.cpp",
  "src/flerp/qwen35moe/src/models/qwen/hip/batched_decode.cpp",
  "src/flerp/qwen35moe/src/models/qwen/hip/decode.cpp",
  "src/flerp/qwen35moe/src/models/qwen/hip/decode_step.cpp",
  "src/flerp/qwen35moe/src/models/qwen/hip/model_loader.cpp",
  "src/flerp/qwen35moe/src/models/qwen/hip/prefill_chunk.cpp",
  "src/flerp/qwen35moe/src/models/qwen/weights.cpp",
]
includes  = ["src/flerp/qwen35moe", "src"]
uses      = ["hip-runtime"]
defines   = ["ENGINE_ENABLE_HIP=1"]

[[provides]]
interface = "executor.model/qwen35moe/gguf"
api       = "gufo::hip::QwenGpuExecutor and gufo::models::QwenGenerator on a qwen35moe (or qwen35) GGUF; flerp::qwen35moe::LaunchMoeFfn, SetMoeTrace, SetMoeDump (flerp/qwen35moe/moe_ffn.hpp); SetLoadOptions, SetStageIo, BindStageIo, SetDecodeGraph, LastLoadReport (flerp/qwen35moe/stage.hpp); flerp::qwen35moe::MtpHead (flerp/qwen35moe/mtp_head.hpp)"
numeric   = "the origin's outside the feed forward. MoE block: fp32 router logits, softmax over all experts and top-k by gufo's RouterTopK (fast-math, lower index on a tie, weights p / max(sum of the selected p, 2^-14)), experts by gufo's K-quant row dot on fp32 activations, fp32 weighted sum plus sigmoid(gate) * shared expert; the same kernels for prompt chunks and decode steps"
regime    = "one node, the whole stack or a block range of it; expert_count <= 1024, expert_used <= 32, a quantized expert row whole blocks; prompt chunks read every selected expert once a token"

[[requires]]
module    = "executor.gufo.qwen"

[[requires]]
interface = "format.device-view/gguf-kquant/-.placed"

[[requires]]
interface = "moe.gate-logits/gguf-f32/f32"

[[requires]]
interface = "moe.experts-decode/gguf-kquant/f32.indexed"

[[requires]]
interface = "moe.experts-prefill/gguf-kquant/f16-f32.grouped"

[[requires]]
interface = "attn.prefill-causal/kv-f16/f32.gqa-wmma"

[[requires]]
interface = "draft.head-score/gguf-kquant/f32.coarse-exact"

[[requires]]
interface = "moe.router/-/f32.qfn"

[[requires]]
interface = "moe.combine/-/f32.qfn"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.ext_api"

[gate]
