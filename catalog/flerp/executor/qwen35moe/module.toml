id        = "executor.flerp.qwen35moe"
kind      = "executor"
summary   = "gufo's Qwen 3.5 executor with a mixture-of-experts feed forward for qwen35moe GGUF files (router, top-k experts, shared expert with a sigmoid gate), sizes read from the header; eight adapted files of executor.gufo.qwen laid over the origin's, plus the launch sequence; dense qwen35 files take the origin's path unchanged"
notes     = "Derived from executor.gufo.qwen (gufo f070a17, branch rdma, MIT): src/models/qwen/{state.hpp, weights.cpp, forward.cpp, hip/model_loader.cpp, hip/decode.cpp, hip/decode_step.cpp, hip/batched_decode.cpp, hip/prefill_chunk.cpp} are copies of the origin's files with the changes marked `flerp (executor.flerp.qwen35moe)`; they sit under flerp/qwen35moe/, an include root ahead of the gufo tree, and the recipe's build file swaps them into the target gufo_qwen27b. No origin file is edited. moe_ffn.{hpp,cpp} are written here. The math is llama.cpp's (src/models/qwen35moe.cpp:494-548, src/llama-graph.cpp:2002-2310 at 86a24a1). One node, one device: the whole file is one device region, as in the origin. The MTP block of the file (nextn_predict_layers) is not loaded by the executor; ORNITH-O3 (gate/ornith-o3-mtp.toml): mtp_head.{hpp,cpp}, written here, runs it as a draft head beside the executor (llama.cpp src/models/qwen35moe.cpp graph_mtp semantics, its own device copy of blk.N and KV, the target's head), used by the tool's --mtp-probe only. Phase 5 stage P1 (docs/PHASE5-FOURNODE-DESIGN.md): stage.{hpp,cpp} are written here; when asked (flerp::qwen35moe::SetLoadOptions, the tool's --placed) model_loader.cpp loads through format.flerp.gguf_placed instead of the origin's whole-file region - a placement plan, one allocation of its bytes, per-tensor regions - and the model runs a block range [block_begin, block_end) (state.hpp QwenModelWeights::BlockBegin/BlockEnd; decode_step.cpp and prefill_chunk.cpp loop over it, take a stage input in place of the embedding and write a stage output; a range without the head answers token 0). The default is still the origin's loader. batched_decode.cpp, the verification paths and forward.cpp (CPU) do not know the range. moe_ffn has a dump of whole blocks for gate/moe_block_check.py (MoeDump). Stage P2: hip/decode.cpp is adapted too (the origin's, with the block range and the stage buffers folded into the decode graph's key and a process-wide decode graph switch, SetDecodeGraph); stage buffers can be bound to one weights object (BindStageIo), so several stages - executors over views of one load with different ranges - run in one process."

