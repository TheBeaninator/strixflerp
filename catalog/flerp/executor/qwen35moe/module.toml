id        = "executor.flerp.qwen35moe"
kind      = "executor"
summary   = "gufo's Qwen 3.5 executor with a mixture-of-experts feed forward for qwen35moe GGUF files (router, top-k experts, shared expert with a sigmoid gate), sizes read from the header; eight adapted files of executor.gufo.qwen laid over the origin's, plus the launch sequence; dense qwen35 files take the origin's path unchanged"
why       = "No engine in the catalogue ran qwen35moe GGUFs on gfx1151: gufo's Qwen 3.5 executor has no expert code, and Ornith-1.5 397B (386.5 B of its 397 B parameters are routed experts) is the pod's target model, so this executor adds the MoE block and grew phase 5's block ranges and stage buffers, the placed loader, an MTP draft head and grouped prompt kernels; it is the engine behind every ornith397 champion (decode 13.3 to 24.4 tok/s, prefill 1,974 tok/s on the 35B proxy)"
notes     = "Derived from executor.gufo.qwen (gufo f070a17, branch rdma, MIT): src/models/qwen/{state.hpp, weights.cpp, forward.cpp, hip/model_loader.cpp, hip/decode.cpp, hip/decode_step.cpp, hip/batched_decode.cpp, hip/prefill_chunk.cpp} are copies of the origin's files with the changes marked `flerp (executor.flerp.qwen35moe)`; they sit under flerp/qwen35moe/, an include root ahead of the gufo tree, and the recipe's build file swaps them into the target gufo_qwen27b. No origin file is edited. moe_ffn.{hpp,cpp} are written here. The math is llama.cpp's (src/models/qwen35moe.cpp:494-548, src/llama-graph.cpp:2002-2310 at 86a24a1). One node, one device: the whole file is one device region, as in the origin. The MTP block of the file (nextn_predict_layers) is not loaded by the executor; ORNITH-O3 (gate/ornith-o3-mtp.toml): mtp_head.{hpp,cpp}, written here, runs it as a draft head beside the executor (llama.cpp src/models/qwen35moe.cpp graph_mtp semantics, its own device copy of blk.N and KV, the target's head), used by the tool's --mtp-probe only. Phase 5 stage P1 (docs/PHASE5-FOURNODE-DESIGN.md): stage.{hpp,cpp} are written here; when asked (flerp::qwen35moe::SetLoadOptions, the tool's --placed) model_loader.cpp loads through format.flerp.gguf_placed instead of the origin's whole-file region - a placement plan, one allocation of its bytes, per-tensor regions - and the model runs a block range [block_begin, block_end) (state.hpp QwenModelWeights::BlockBegin/BlockEnd; decode_step.cpp and prefill_chunk.cpp loop over it, take a stage input in place of the embedding and write a stage output; a range without the head answers token 0). The default is still the origin's loader. batched_decode.cpp, the verification paths and forward.cpp (CPU) do not know the range. moe_ffn has a dump of whole blocks for gate/moe_block_check.py (MoeDump). Stage P2: hip/decode.cpp is adapted too (the origin's, with the block range and the stage buffers folded into the decode graph's key and a process-wide decode graph switch, SetDecodeGraph); stage buffers can be bound to one weights object (BindStageIo), so several stages - executors over views of one load with different ranges - run in one process. draft_round.{hpp,cpp} (ORNITH-O3 step two, gate/ornith-o3-spec.toml) is the last stage's side of MTP speculative decoding: which drafts the head proposes at a frontier (config.max_draft, or Crucible draft_value.h's value-aware rule, or prompt-lookup drafts, ORNITH-CRUCIBLE item 4) and which rows of a verify round are kept; it runs no target forward itself. ORNITH-PCACHE (card a3656fc5e9): DraftRound::SaveEdge / RestoreEdge keep the head's prompt edge (the pending hidden row at the end of a prompt chunk and its position; the head's KV below it stays in place), because the head pairs each row with the next chunk's first id, so after a prefix restore the next chunk must find the edge the original prompt left, or its first draft pair would differ from a cold run's. PREFILL-KPROF (card 9506f4f116): with FLERP_KG_COUNTS=1 moe_ffn.cpp prints the routed rows per expert of every grouped block (one JSON line a block, after the stream is already synchronized), the distribution behind the live-tile port in kernel.flerp.moe_kgrouped. MOE-COMBINE (card 2dc55e67f0, gate/moe-combine.toml, verdict gate/results/moe-combine/verdict.json): why: the MoE combine of a 4,096-row 35B prompt chunk took 279 of 2,049 ms at ~48 GB/s, and the K bench put the cause in gufo's MoeEpilogueKernel itself (rule kernel_shape: one 4-byte load a thread over tokens x dim/256 blocks), not in the memory or the writer before it. moe_combine.hip (MoeCombineVec4Kernel) keeps that kernel's per-element expression (slots summed in order from a pinned zero, then plus sigmoid(gate) times the shared row) but gives each thread four adjacent outputs read with 16-byte loads, 189-203 GB/s on K, so its output words equal gufo's (C0 0 words differ, C2 108 steps 0 mismatches). It is in [provenance] paths and not in [build] sources because the recipe's CMake compiles it into flerp_qfn_kernels with kernels.hip.cpp's -O3 -ffast-math -fno-finite-math-only, which is what keeps the words equal. With it, SetDenseInputReuse windows convert the shared normed input of q/k/v and of qkv/gate/alpha/beta to F16 once (110 of 230 ToF16 launches). In the model: combine 279 -> 70 ms and ToF16 69 -> 39 ms a chunk, C/G 1.100 at 2K and 1.129 at 16K. Shapes: dim a multiple of 4, at most 16 slots, 16-byte aligned rows (35B 2,048 x 8, Ornith 4,096 x 10); anything else falls back to MoeEpilogue. Called by moe_ffn.cpp for prompt chunks only when SetMoeCombineFast(1) or FLERP_MOE_COMBINE_FAST=1 (generate arm C); default off, decode untouched. The tiled prompt router of ROUTER-GEMM (c6473d6063) lives in kernel.flerp.moe_kquant's GateLogits; this executor calls GateLogits unchanged. ORNITH-CRUCIBLE (card fbe7f600ae, gate/ornith-crucible.toml, results gate/results/ornith-crucible): mtp_head can score its head coarse-then-exact through kernel.flerp.draft_coarse (FLERP_MTP_COARSE=q2|q4, off by default; refuted in the 35B model, see that module). draft_round gains prompt-lookup drafts (DraftConfig.lookup, gufo speculative/prompt_lookup.hpp's recipe: the last 3 committed ids are looked up among the earlier ones, and the earlier occurrence with the longest matching run, at least 12 ids or 5 when it continues the last mostly-kept copy, supplies what followed it as drafts), tried before the MTP head because text that repeats the prompt, as edits do, can be drafted with no model work. Measured: ids identical to drafts-off (L1), lookup fired on 42.6 % of edit-prompt frontiers and kept 83.3 % of its drafts, but at world 2 the edit-prompt rate rose only 3 % against the 15 % bar (L3 FAIL) because every proposed draft costs a verified row. Off unless the stage driver's NpL spec asks for it."

