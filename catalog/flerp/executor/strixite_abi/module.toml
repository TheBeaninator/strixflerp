id        = "executor.flerp.strixite_abi"
kind      = "executor"
summary   = "strixite behind the executor ABI: a C++ shim over LmBackend that opens Qwen4ExpBackend with the served defaults; full rows, candidates or greedy tokens; MTP draft steps; batched verify with keep / keep_prefix / drop; snapshot slots and host-byte states"
why       = "strixite hands logits to the host while StrixFold draws on the device, and SPEC section 6 wants one C ABI both can sit behind so a single front end and test driver serve any engine; this shim is strixite's side, and its gate shows the shared decode loop through the ABI giving the native server's tokens and step records on every gated request, MTP on and off"
notes     = "docs/EXECUTOR-ABI.md has the call-by-call mapping and what does not map (parked and small states, steering, vision prefill, lookahead of PLE rows, renew)."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/executor/strixite_abi.cpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/flerp/executor/strixite_abi.cpp"]
includes  = ["../../../../include"]

[[provides]]
interface = "executor.abi/flerp-v1/-"
api       = "flerp_open .. flerp_stats_json (include/flerp/executor.h)"
numeric   = "the backend's own: rows, candidates and drafts are LmBackend's, greedy tokens are its top candidate (value descending, lower id first on a tie)"
regime    = "strixite's: seqs slots, 16 verify rows a forward, snapshots at any position"

[[requires]]
module    = "executor.strixite.qwen4exp_backend"

[[requires]]
module    = "executor.strixite.qwen4exp"

[[requires]]
module    = "runtime.strixite.engine"

[[requires]]
module    = "runtime.strixite.sampler"

[[requires]]
module    = "runtime.strixite.host_buffer"

[[requires]]
module    = "runtime.strixite.check"

[gate]
parity    = "flerp:gate/executor_abi.py"
bench     = "none"
status    = "parity"
evidence  = "gate/results/qwen38-flash-next.strixite-abi/at-20937dc/summary.json"
