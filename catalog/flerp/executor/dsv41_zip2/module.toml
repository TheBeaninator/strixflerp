id        = "executor.flerp.dsv41_zip2"
kind      = "executor"
summary   = "StrixFold's dsv41 executor with a prompt schedule of two-chunk units: chunk k and chunk k + 1 zipped layer by layer, so the routed experts run once per 2,048 rows instead of once per 1,024-row half and every gather still moves behind kernel work; two adapted files of executor.strixfold.dsv41 laid over the origin's; off unless TF_DS_PREFILL_ZIP2 is set"
why       = "Candidate 1 of docs/PREFILL-DSV41.md: DeepSeek-V4.1's TP2 prompt pass runs its routed experts once per 1,024-row half, and two halves cost 49.3 ms where one 2,048-row pass costs 35.6 ms; zipping two chunks layer by layer keeps every gather hidden behind the other chunk's kernels while halving the expert passes (pod card SPEED-ZIP2); built but never run on the worker pair, so its gain is still the estimate"
notes     = "Derived from executor.strixfold.dsv41 (StrixFold f64b5ff, the pod's fork, Apache-2.0): zig/src/families/dsv41/{model.zig, lanes.zig} are copies of the origin's files with the changes marked `flerp (executor.flerp.dsv41_zip2)`; they sit under flerp/dsv41_zip2/ and the recipe's [build.overlay] lays them over the origin's tree paths. No origin file is edited. Added: the setting TF_DS_PREFILL_ZIP2 (every rank alike, in the peers' handshake when set; unset or 0 the code paths, buffers, frames and handshake text are the origin's). 1: a prompt unit is two whole chunks when the first is before the replay cut, run by the origin's fillSplit with halves of 2,048 rows in two 2,048-row buffer sets (the origin: two of 1,024). 2: the second chunk may also be the prompt's last, partial one (at least max(PREFILL_SPLIT, 256) rows). Any other unit takes the origin's path with the origin's cut. Kept states stay on the 2,048-row grid: the first chunk's window rings and positional stores are copied layer by layer as it leaves them (Model.midSave, snapCopy's layout) and a keep at that chunk end takes that copy on both ranks (one more byte in the snap_save frame under zip2). Engram rows are read ahead a unit at a time. Docs: docs/PREFILL-DSV41.md section 9. Not run on the pair."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = [
  "flerp/dsv41_zip2/zig/src/families/dsv41/lanes.zig",
  "flerp/dsv41_zip2/zig/src/families/dsv41/model.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
modified  = false
upstream  = "strixfold https://github.com/Shoestring-dev/Strixfold f64b5ff (the pod's fork, Apache-2.0): zig/src/families/dsv41/model.zig, zig/src/families/dsv41/lanes.zig, adapted here (catalog/strixfold/executor/dsv41 holds them verbatim)"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:families/dsv41"

[[provides]]
interface = "executor.model/deepseek-v4.1-flash/exl3.zip2"
api       = "the origin's (lanes.zig lane Backend, native.zig, tf-dsv41-lanes); Model.unitRows, the setting TF_DS_PREFILL_ZIP2"
numeric   = "the origin's kernels on the same rows in other launch groupings: each prefill kernel is written row-invariant, and the origin measured split against whole with equal prompt logits; equal prompt-logits sha256 with the reference is this module's criterion and has not been measured"
regime    = "TP2 over two gfx1151 nodes; units of 4,096 rows need two 2,048-row buffer sets a rank (about 2.1 GiB more than the origin's two of 1,024, computed, not measured)"

[[requires]]
module    = "executor.strixfold.dsv41"

[gate]
parity    = "flerp:gate/prefill_dsv41_zip2.py"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe dsv41-flash.strixfold-tp2-zip2 on control-node, 2026-11-24, CPU only at nice 19: zig: builds as part of the recipe on control-node; Zig compiles what the built programs reach, not every declaration (precedent dsv41-flash.strixfold-tp2); log gate/results/dsv41-flash.strixfold-tp2-zip2/build.txt; not run on a GPU from that build; earlier note: built only inside the recipe dsv41-flash.strixfold-tp2-zip2 (control-node, zig 0.17.0, TheRock 10.2); never loaded: the pair measurement (gate/prefill_dsv41_zip2.py) has not run"
evidence  = "gate/results/dsv41-flash.strixfold-tp2-zip2/summary.json"
