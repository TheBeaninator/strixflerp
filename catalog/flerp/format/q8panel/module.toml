id        = "format.flerp.q8panel"
kind      = "format"
summary   = "Q8Panel16: strixw Q8 in panels of 16 rows, format.flerp.q4panel's layout at one code per byte (16-byte chunks of 16 codes), with the typed relayout and its inverse"
why       = "Q8 needs its own panel type because strixite's existing Q8ChunkMajor uses 32-byte chunks; keeping 16-byte chunks makes a lane load 16 B and a 16-row chunk 256 contiguous bytes at both widths, so one panel GEMV template and one WMMA tile loader serve Q4 and Q8 alike"
design    = "DESIGN.md"
notes     = "docs/STRIXW-LAYOUT-NEXT.md candidate A at 8 bits (Q8P16), stage 1. 16-byte chunks, not Q8ChunkMajor's 32-byte ones, so the lane load is 16 B at both widths. Order-only."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/q8panel/q8panel.cpp", "flerp/q8panel/q8panel.hpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "c++"
sources   = ["src/flerp/q8panel/q8panel.cpp"]
includes  = ["src"]

[[provides]]
interface = "format.host/strixw-q8p16/-"
api       = "flerp::Q8Panel16, q8_panel16_bytes, to_panel16, from_panel16 (flerp/q8panel/q8panel.hpp); geometry and byte relayout from format.flerp.q4panel"
numeric   = "exact: the same codes, scales and mins as the row-major Q8Weight"
regime    = "N % 16 == 0, K % 32 == 0, G in 32/64/128 dividing K; panel = 16K + 64K/G bytes"

[[requires]]
module    = "format.flerp.q4panel"

[[requires]]
module    = "format.strixite.q8"

[[requires]]
module    = "runtime.strixite.check"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "n/a"
reason    = "builds in recipe qwen38-flash-next.strixite-p16 on control-node, 2026-11-24, CPU only at nice 19: compiled or read by objects of the recipe build (3 files named in gate/results/qwen38-flash-next.strixite-p16/built-modules.json, from ninja -t deps); log gate/results/qwen38-flash-next.strixite-p16/build.txt; not run on a GPU from that build; earlier note: host code built by tool.flerp.convert_strixw_panel's build.sh; evidence as format.flerp.q4panel"
evidence  = "gate/results/qwen38-flash-next.strixite-p16/built-modules.json"
