id        = "format.flerp.gguf_placed"
kind      = "format"
summary   = "Placed loading of a GGUF file: a placement plan (which tensors a rank holds, a pure function of the header, world and mode, with a hash), one device allocation of the plan's bytes, and per-tensor device regions filled by byte-range reads that never touch the mapping's data pages"
why       = "gufo's loader makes one device allocation per mapped file and reads it through the page cache with eight workers; Ornith's 227.5 GiB GGUF cannot fit one 128 GB node, and the pod's I/O rule forbids whole-file mapped reads, so phase 5 needed a loader that gives each rank only its planned block range, reads only those bytes and can take them from a sparse rank file or straight from loom-swarm's stream; gated bit-equal to the recorded whole-file runs, with the plan reproduced by an independent script"
notes     = "Written here for phase 5 (docs/PHASE5-FOURNODE-DESIGN.md sections 3.1, 3.2; stage P1). Mode stage only: contiguous block ranges that minimise the largest rank by bytes, token_embd on rank 0, the head on the last rank, blocks past the stack unloaded; world 1 with a block range for single-GPU gates. The expert mode of the design (per-expert regions) is not written. The reads are gufo's WeightUpload::CopyMapped (kernel.gufo.core_headers declares it, runtime.gufo.hip_host implements it); the hash is gufo's SHA-256 (runtime.gufo.platform). gate/gguf_census.py computes the same plan and the same hash from the header with no code of this module; gate/moe_placed.py compares them. Byte sources of the single reader (placed_loader.hpp FillPolicy): the GGUF itself (O_DIRECT); data_path, a same-size copy at the same offsets (loom-swarm's sparse rank file), optionally freed behind the reads (punch_behind, for a tmpfs); swarm, loom-swarm's `stream` helper (its BLAKE3-verified 16 MiB pieces from the origin and peers over a pipe) straight into the device, nothing written to a disk (phase 5 P5)."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = [
  "flerp/gguf_placed/placed_loader.cpp",
  "flerp/gguf_placed/placed_loader.hpp",
  "flerp/gguf_placed/placement.cpp",
  "flerp/gguf_placed/placement.hpp",
]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/flerp/gguf_placed/placement.cpp", "src/flerp/gguf_placed/placed_loader.cpp"]
includes  = ["src"]
uses      = ["hip-runtime"]
defines   = ["ENGINE_ENABLE_HIP=1"]

[[provides]]
interface = "format.device-view/gguf-kquant/-.placed"
api       = "flerp::gguf_placed::StagePlan, BestCuts, Plan::Text, Plan::Sha256 (flerp/gguf_placed/placement.hpp); LoadRank, PlacedWeights, PlacedRegion, LoadReport (flerp/gguf_placed/placed_loader.hpp)"
numeric   = "exact: the tensors' GGUF bytes, each at its own offset of one device allocation (multiples of 64, in file order, 4096 bytes after the last)"
regime    = "load time; a single-file GGUF; mode stage at any world, or a block range at world 1; one hipMalloc of the plan's byte total"

[[requires]]
module    = "format.gufo.gguf_kquant"

[[requires]]
module    = "runtime.gufo.hip_host"

[[requires]]
module    = "kernel.gufo.core_headers"

[[requires]]
module    = "runtime.gufo.platform"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "built only inside a recipe, by CMake (recipes/qwen36-35b-a3b.flerp-moe.toml); its gate is gate/moe_placed.py and nothing here moves past harvested until that gate has passed and is recorded here"
