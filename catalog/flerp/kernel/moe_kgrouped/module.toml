id        = "kernel.flerp.moe_kgrouped"
kind      = "kernel"
summary   = "Grouped prefill GEMMs over GGUF Q4_K / Q6_K blocks read in place: counting-sort grouping with a device tile list, gate/up pair with a SwiGLU epilogue in registers, down into [token, slot] rows, and the same kernel as a dense Linear; each 64-K step decodes a 128-row weight tile into LDS as F16 once for BM 32/64/128 rows on v_wmma_f32_16x16x16_f16, and with live tiles on (FLERP_KG_LIVE=1) a wave issues the WMMAs of only its 16-row tiles that hold rows, through one compile-time body per live count, bit-identical to the full-tile kernel"
why       = "A qwen35moe prompt chunk routes each token to 8 of 256 experts, so an expert sees a few dozen rows of a 4,096-row chunk (median 42 on the 35B), and the per-token decode kernels would stream every expert's weights once per row; grouping rows by expert and decoding each weight tile to F16 once per tile of rows puts the experts and the dense projections on the matrix cores, and these kernels are the experts and dense projections of the prefill champion G (configs/ornith397.prefill-best.toml, FLERP_MOE_GROUPED=1, FLERP_DENSE_GROUPED=1)"
notes     = "docs/PREFILL-ORNITH.md. Written here for executor.flerp.qwen35moe prompt chunks (Ornith-1.5 397B, the 35B proxy). Recipes re-expressed, not copied: strixite moe_grouped / linear_wmma (F16 dequant-to-LDS tile, register prefetch), Crucible prefill_moe (gate/up pair, SwiGLU epilogue, counting-sort dispatch). No repack: the decode kernels and the placed weights are untouched. Live tiles, PREFILL-KPROF (card 9506f4f116, gate/prefill-kprof.toml amendment 2): the kernel profile of one 4,096-row 35B chunk (gate/results/prefill-kprof/p2) put routed experts at 527 ms of 2,049 ms with a tile fill of 0.64 at BM 128, because 45% of (block, expert) pairs hold under 32 rows and a wave's dead 16-row tiles still ran their WMMAs on zero rows. GroupedKernel<BM, WT, SWIGLU, LIVE> re-expresses Crucible's live-tile items (catalog/crucible/kernel/moe_prefill prefill_moe_pair.h): a wave runs tiles wm, wm + 2, .. below ceil(rows / 16) in both accumulation loops and the epilogue, the live count picked once per block, so every stored element keeps its fragments and K order. Result: logits sha256 and ids equal to G on 108 steps (8 prompts and 16K), routed experts 527 -> 408 ms (0.774x, run p3c), L/G 1.066 at 2K and 1.037 at 16K, 0 scratch in every LIVE instantiation on rocm-7.2.4 and therock-10.1. Off unless SetLiveTiles(1) or FLERP_KG_LIVE=1; the generator's arm L is the only caller on this branch, and no champion config sets it (the proposal was withdrawn for the combined arm PREFILL-LRC, card 5083008fe9)."

