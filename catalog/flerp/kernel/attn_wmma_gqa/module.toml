[build]
lang      = "hip-c++"
sources   = ["src/flerp/attn_wmma_gqa/attn_wmma_gqa.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "attn.prefill-causal/kv-f16/f32.gqa-wmma"
api       = "flerp::attn::LaunchGqaWmmaAttention, Supported (flerp/attn_wmma_gqa/attn_wmma_gqa.hpp)"
numeric   = "the origin's: Q x 1/16 and K, V in F16, FP32 accumulation, online softmax with F16 probabilities, exact causal tail"
regime    = "prompt chunks with the FP16 KV plane already written; head_dim 256"

