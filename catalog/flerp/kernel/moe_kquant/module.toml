id        = "kernel.flerp.moe_kquant"
kind      = "kernel"
summary   = "Mixture-of-experts kernels on GGUF expert stacks (last dimension the expert): router logits with the shared gate logit beside them, and the projections of the experts each token selected, ids read on the device; any number of tokens, every size an argument"
why       = "gufo's Qwen executor has no mixture-of-experts code at all, so running qwen35moe GGUFs (Qwen3.6-35B-A3B, Ornith-1.5 397B) needed router-logit and selected-expert kernels; they read llama.cpp's expert stacks in place with gufo's own row reader so decode keeps one summation order at any token count, and later rounds made them the fast decode path of ornith397.decode-best without changing a bit: the 16-byte wide reader (1.09-1.47x the GB/s, SHAPE-TRANSFERS R1) and the LDS-staged router logits (3.15x, DECODE-KERN3)"
notes     = "The weight dot product is gufo's QuantWarpBlockDot (kernel.gufo.qwen_ops, src/families/qwen/hip_common/quant_ops.hpp), the row reader of its decode GEMV: one wave a row, the same summation order at any number of tokens. F32, BF16 and F16 stacks have a plain wave dot written here. Q4_K and Q6_K stacks (both stacks of one type, stacks and x 16-byte aligned) take a wide reader written here (SHAPE-TRANSFERS R1 arm a): the same lanes, decode and summation order as QuantWarpBlockDot, so the same bits, with 16-byte loads of codes and activations (gate/xfer-r1-fold.toml, gate/results/xfer-r1-fold). No decision is taken on the host, so the launches can be captured in a HIP graph. ROUTER-GEMM (card c6473d6063, gate gate/router-gemm.toml, verdict gate/results/router-gemm/verdict.json): GateLogits used the decode GEMV for prompt chunks too, a block of 4 outputs x 1 token, so each token re-read the 2.1 MB FP32 router of a 35B block (8.4 MB on Ornith); that was 305 ms (14.9 %) of a 4,096-row 35B chunk at 0.6 TFLOPS. GateLogitsTiledKernel takes 16 tokens x 8 waves x 4 outputs a block: x staged through LDS 128 floats at a time with the next chunk's x and router slices prefetched into registers, every LDS value feeding 4 register accumulators. Lane L of an output still sums elements L, L+32, ... from 0.0 with the same multiply-add and the same wave reduction, so the logits are the GEMV's bit for bit (R1: 0 words differ at 4 shapes; R3: 108 steps, 0 mismatches); WMMA was not used because gfx1151 has no FP32 inputs for it and F16 rounding could change top-k picks. K: tiled/wide 0.138 at 35B dims (R2), 0.079 at Ornith dims; in the model 305 -> 46 ms a chunk, R/G 1.114 at 2K and 1.140 at 16K (R4); 161-162 VGPR, 8 KiB LDS, occupancy 9, 0 scratch (R5). Taken only for >= 64 tokens with hidden a multiple of 128 and 16-byte aligned x, and only when SetRouterTiled(1) or FLERP_ROUTER_TILED=1 (generate arm R; default off); decode and short prompts keep the GEMV. Compiled for any expert count (the shared gate is row n_experts); measured at hidden 2,048 / 256 experts and 4,096 / 512."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/moe_kquant/moe_kquant.hip", "flerp/moe_kquant/moe_kquant.hpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/flerp/moe_kquant/moe_kquant.hip"]
includes  = ["src"]
arch      = "gfx1151"
toolchain = "therock-10.1"
uses      = ["hip-runtime"]
defines   = ["ENGINE_ENABLE_HIP=1"]

[[provides]]
interface = "moe.gate-logits/gguf-f32/f32"
api       = "flerp::moe::GateLogits, SetRouterTiled (flerp/moe_kquant/moe_kquant.hpp)"
numeric   = "fp32: one wave a logit, each lane sums every 32nd product, then a lane reduction; when hidden is a multiple of 1,024 (up to 8,192) and the weights and x are 16-byte aligned the same order runs with 16-byte loads staged through LDS, bit-equal (DECODE-KERN3, gate/decode-kern3.toml)"
regime    = "any tokens (32768 a launch), any expert count and hidden size; one launch for the router rows and the shared expert's gate row"

[[provides]]
interface = "moe.experts-decode/gguf-kquant/f32.indexed"
api       = "flerp::moe::IndexedExperts, ExpertBytes, SupportsExpertType (flerp/moe_kquant/moe_kquant.hpp)"
numeric   = "gufo's K-quant row dot (QuantWarpBlockDot, fp32 activations, fp32 accumulate) per selected expert row (Q4_K and Q6_K through a wide-load reader of the same order, bit-equal); SwiGLU as silu(gate) * up in fp32 with expf; an id outside the stack reads the last expert"
regime    = "any tokens x slots (32768 rows a launch); Q8_0, Q8_K, Q3_K..Q6_K, IQ4_NL, IQ4_XS, IQ3_S, F32, BF16, F16 stacks; a quantized row must be whole blocks; reads each selected expert once a token, so prompt passes are memory-bound"

[[requires]]
module    = "kernel.gufo.qwen_ops"

[[requires]]
module    = "kernel.gufo.core_headers"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "built only inside a recipe, by CMake (recipes/qwen36-35b-a3b.flerp-moe.toml); that recipe built and ran on gfx1151 on 2026-11-11 and its gate did not pass (one criterion against llama.cpp, gate/results/qwen36-35b-a3b.flerp-moe/summary.md), so nothing here moves past harvested"
