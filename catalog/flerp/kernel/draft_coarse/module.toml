id        = "kernel.flerp.draft_coarse"
kind      = "kernel"
summary   = "Coarse-then-exact scoring of a GGUF Q6_K / Q4_K draft head: a 2- or 4-bit copy (64-value groups, fp16 scale and minimum) scores every token, the best 128-token blocks are recomputed from the GGUF rows with the exact head's row dot (same bits), the draft is chosen from them, and a margin test (tau = k err_rms ||x||) tells the caller when to run the exact head instead"
why       = "Ornith's MTP draft step is dominated by reading its 834 MB Q6_K head, so ORNITH-CRUCIBLE item 2 tried Crucible's coarse-then-exact head: scoring with a 318 MB 2-bit copy cut the head kernel from 4.17 to 1.70 ms with the kept rows bit-equal to the exact head, but on the 35B proxy the safety margin failed on 6,143 of 6,144 steps, every one fell back to the exact head and the draft step got slower, so it ships off by default"
notes     = "ORNITH-CRUCIBLE item 2 (gate/ornith-crucible.toml). Recipe of Crucible's low-bit draft head (catalog/crucible/runtime/speculation, engine/runtime/draft_quant.h: DraftQGemvKernel, DraftQRescoreKernel, DraftQChoiceKernel) re-expressed for GGUF heads read in place; written here, not copied. Used by executor.flerp.qwen35moe mtp_head (FLERP_MTP_COARSE), off by default. ORNITH-CRUCIBLE item 2 (card fbe7f600ae, gate/ornith-crucible.toml, results gate/results/ornith-crucible/summary.json): D1-D3 PASS (rescore_mismatch 0, wrong_ids 0, q2 head step 0.408x and q4 0.661x the exact head at Ornith dims), E1-E3 PASS in the 35B model (wrong_ids 0, rescore_mismatch 0, unsafe 0 over 6,144 checked steps, ids equal to exact), E4 FAIL (draft step q2 1.454x, q4 1.185x exact; fallbacks 6,143 and 2,296 of 6,144 because tau = 8 err_rms ||x|| is too wide, max_z 3.97); projections 6.53 ms q2 / 4.97 ms q4 against 4.83, refuted. The CoarseKernel<*,4> unroll spills (200-236 B scratch) only at hidden 8,192, outside the measured path. Compiled for hidden a multiple of 2,048 up to 8,192 and vocab up to 262,144. Called by executor.flerp.qwen35moe mtp_head only when FLERP_MTP_COARSE=q2|q4; off by default. A tighter tau would be a new card with its own criteria."

