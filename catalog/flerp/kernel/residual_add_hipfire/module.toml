id        = "kernel.flerp.residual_add_hipfire"
kind      = "kernel"
summary   = "Adapter: strixite's fp32 in-place residual_add launching hipfire's add_inplace_f32 from an embedded code object (hipfire ships no host launcher and counts elements in an int, so n < 2^31); BF16 calls go to strixite's renamed kernel"
why       = "The hipfire provider of swap 1: it shows that a bare code object from hipfire's kernel library, with no host code of its own, can be driven through another engine's launch API; byte-identical to strixite and gufo on all nine cases (cancellations, subnormals, NaN, a 21-million-element prefill block) and within 4 % of their speed, so it closes the question of whether hipfire's units are usable as parts"

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp_adapters/residual_add_hipfire.cpp"]
authors   = ["pod"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "c++"
sources   = ["src/flerp_adapters/residual_add_hipfire.cpp"]
includes  = []
uses      = ["hip-runtime"]

[adapter]
for       = "kernel.strixite.residual"
symbols   = ["residual_add"]

[[adapter.code_object]]
module    = "kernel.hipfire.tensor_ops"
unit      = "add_inplace"
symbol    = "flerp_co_hipfire_add_inplace"

[[provides]]
interface = "residual.add/-/f32"
api       = "strix::kernels::residual_add (fp32 calls launch the embedded add_inplace_f32)"
numeric   = "one IEEE fp32 add per element: bit-identical to kernel.strixite.residual"
regime    = "element-wise, n < 2^31; one launch, grid n / 256"

[[provides]]
interface = "residual.add/-/bf16"
api       = "strix::kernels::residual_add (bf16 calls go to strixite's kernel, renamed residual_add_flerp_origin)"
numeric   = "strixite's own kernel: fp32 add, one rounding to bf16"
regime    = "element-wise"

[[requires]]
module    = "kernel.strixite.residual"

[[requires]]
module    = "kernel.hipfire.tensor_ops"

[[requires]]
module    = "kernel.flerp.adapter_rt"

[gate]
parity    = "flerp:gate/interface/residual-add.toml"
bench     = "flerp:gate/interface/residual-add.toml"
status    = "benched"
evidence  = "gate/results/interface/residual-add/result.json"
