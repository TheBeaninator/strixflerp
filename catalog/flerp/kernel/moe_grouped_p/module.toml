id        = "kernel.flerp.moe_grouped_p"
kind      = "kernel"
summary   = "Adapter (Q4Panel16 experts): strixite's grouped expert prefill GEMMs, MoeMath::WmmaF16 Narrow / Wide / Wide256 with their SwiGLU, F16-h and combine forms, reading panel experts with whole-line loads (Narrow straight to registers), bit-equal to moe_grouped; row-major views and the routing stay strixite's"
notes     = "docs/STRIXW-LAYOUT-NEXT.md stage 4. Derived from kernel.strixite.moe_grouped (strixite 20937dc, AGPL-3.0-only): kernels/moe_grouped.hip's F16 kernels, combine reduce and launch copied under flerp/moe_grouped_p/, changes marked `kernel.flerp.moe_grouped_p`; the FP32 / WmmaBf16 kernels and the routing are not copied (strixite's run them). Weight tile of the Wide kernel: kernel.flerp.wmma_q4p's kernels/wmma_panel.hpp. Does not touch kernel.flerp.moe_grouped_pf (the prefill-combine work), which a recipe binds in its place for row-major experts. Gate: gate/strixw-panel-kernels.toml."

[provenance]
origin    = "flerp"
repo      = "in-tree"
commit    = "in-tree"
paths     = ["flerp/moe_grouped_p/kernels/moe_grouped_p.hip", "flerp/moe_grouped_p/kernels/moe_grouped_p.hpp"]
authors   = ["shawnshekari", "pod"]
modified  = false
upstream  = "strixite https://github.com/shawnshekari/strixite 20937dc (v0.7.0-pod): kernels/moe_grouped.hip, adapted here (catalog/strixite/kernel/moe_grouped holds it verbatim)"

[licence]
spdx      = "AGPL-3.0-only"

[build]
lang      = "hip-c++"
sources   = ["src/flerp/moe_grouped_p/kernels/moe_grouped_p.hip"]
includes  = ["src/flerp/moe_grouped_p"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[adapter]
for       = "kernel.strixite.moe_grouped"
symbols   = ["linear_q4_experts_gather_grouped", "linear_q4_experts_gather_grouped_swiglu", "linear_q4_experts_combine_grouped"]

[[provides]]
interface = "moe.experts-prefill/strixw-q4/bf16"
api       = "strix::kernels::linear_q4_experts_gather_grouped, _gather_grouped_swiglu, _combine_grouped (a panel-tagged view: the linear_q4p_* below; otherwise strixite's, renamed *_flerp_origin); moe_group_routes and the Q5 functions stay strixite's"
numeric   = "moe_grouped's bits for the WmmaF16 kinds: the same F16 weight and x tiles, the same WMMA sequence, BF16 partials and reduce; panels with F32 / WmmaBf16 are refused"
regime    = "prefill and MTP verify; panel experts: N per expert % 16 == 0, K % 64 == 0 (Wide256: % 32), wave32"

[[provides]]
interface = "moe.experts-prefill/strixw-q4p16/bf16"
api       = "strix::kernels::linear_q4p_experts_gather_grouped, _gather_grouped_swiglu, _combine_grouped (kernels/moe_grouped_p.hpp)"
numeric   = "as moe.experts-prefill/strixw-q4/bf16, WmmaF16 kinds only"
regime    = "Q4Panel16 views only"

[[requires]]
module    = "kernel.strixite.moe_grouped"

[[requires]]
module    = "kernel.flerp.wmma_q4p"

[[requires]]
module    = "format.flerp.panel_device"

[[requires]]
interface = "format.device-view/strixw-q4/-"

[[requires]]
module    = "kernel.strixite.device_info"

[[requires]]
module    = "kernel.strixite.hip_common"

[[requires]]
module    = "kernel.strixite.norm"

[[requires]]
module    = "kernel.strixite.wmma_gemm"

[[requires]]
module    = "kernel.flerp.adapter_rt"

[gate]
parity    = "flerp:gate/strixw-panel-kernels.toml"
bench     = "flerp:gate/strixw-panel-kernels.toml"
status    = "harvested"
compile   = "n/a"
reason    = "built inside recipes/qwen38-flash-next.strixite-p16.toml; kernel gate gate/strixw-panel-kernels.toml (results gate/results/strixw-panel-kernels)"
