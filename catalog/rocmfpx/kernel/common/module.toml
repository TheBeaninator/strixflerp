[build]
lang      = "hip-c++"
sources   = []
includes  = ["src/ggml/src/ggml-cuda", "src/ggml/src", "src/ggml/include", "src/ggml/rocmfpx", "src/ggml/rocmfp4"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "kernel-abi.rocmfpx-ggml-cuda/-/-"
api       = "ggml-cuda/common.cuh (ggml_backend_cuda_context, the CUDA-to-HIP vendor mapping), vecdotq.cuh (vec_dot_rocmfp4_q8_1, vec_dot_rocmfp4_fast_q8_1, vec_dot_rocmfpx_fp2 / fp3 / fp6 / fp8_q8_1, vec_dot_rocmfpx_q7_q8_1)"
numeric   = "n/a here"
regime    = "compiled inside every kernel.rocmfpx.* unit"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "header-only"
reason    = "header-only; compiled inside every other kernel.rocmfpx.* unit"
