id        = "kernel.lucebox.paged_attn"
kind      = "kernel"
summary   = "paged decode attention with the context split into partitions (one per 1024 tokens at most), and its RDNA WMMA variant"
why       = "Paged attention with an RDNA WMMA path; the catalogue has paged attention only in libstrix (torch layouts)"
notes     = "INTERFACES.md section: none (INTERFACES.md has no attention section). Interface tags: attn.softmax-gqa/kv-f16/f16.lucebox-paged. Units: server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn.cu. Licence: ggml-side files MIT (server/deps/llama.cpp/LICENSE, in kernel.lucebox.ggml_headers), server-side Apache-2.0 (LICENSE). The ggml units are ggml backend ops (ggml_backend_cuda_context, ggml_tensor) dispatched from ggml-cuda.cu, which is not harvested; a strixflerp recipe needs an adapter to call them. Nothing was run on a GPU or timed on the pod."

[provenance]
origin    = "lucebox"
repo      = "https://github.com/Luce-Org/lucebox"
commit    = "a70ab3ca25a945d97580043230dc33984aaf1fb2"
branch    = "main"
paths     = [
  "server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn-common.cuh",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn-rdna-wmma.cuh",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn.cu",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn.cuh",
]
authors   = ["Luce-Org", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = ["src/server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn.cu"]
includes  = ["src/server/deps/llama.cpp/ggml/src/ggml-cuda", "src/server/deps/llama.cpp/ggml/src"]
arch      = "gfx1151"
toolchain = "therock-10.2"
source_options = { "src/server/deps/llama.cpp/ggml/src/ggml-cuda/paged-attn.cu" = ["-DcublasSgemmStridedBatched=hipblasSgemmStridedBatched", "-DcudaStreamCaptureStatus=hipStreamCaptureStatus", "-DcudaStreamCaptureStatusNone=hipStreamCaptureStatusNone", "-DcudaStreamIsCapturing=hipStreamIsCapturing"] }

[[provides]]
interface = "attn.softmax-gqa/kv-f16/f16.lucebox-paged"
api       = "GGML op in paged-attn.cu"
numeric   = "half head-dim row and a float2 per output row a partition (file header)"
regime    = "decode on a paged KV cache; partitions bounded so a 2048-row chunk at 118K context fits (file header)"

[[requires]]
module    = "kernel.lucebox.ggml_headers"

[[requires]]
module    = "kernel.lucebox.rocmfp"

[[requires]]
module    = "kernel.lucebox.kvquant"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.lucebox.paged_attn.json"
