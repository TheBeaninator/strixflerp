id        = "kernel.lucebox.rocmfp"
kind      = "kernel"
summary   = "runtime decode of the ROCmFP2 and ROCmFP3 MIX weight types (per-expert codebook and mode from a per-tensor registry) for the MMVQ and MMID paths, with the ROCmFP4 HIP codebook and scale headers"
why       = "ROCmFP is Lucebox's own expert format (2- and 3-bit mixes) behind its MAX+ figures; no catalogue module reads it"
notes     = "INTERFACES.md section: 1. Decode GEMV and 4. MoE (weight format). Interface tags: format.decode/rocmfp2-mix+rocmfp3-mix/f16.lucebox. Units: server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp2_mix.cu, server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp3_mix.cu. Licence: ggml-side files MIT (server/deps/llama.cpp/LICENSE, in kernel.lucebox.ggml_headers), server-side Apache-2.0 (LICENSE). The ggml units are ggml backend ops (ggml_backend_cuda_context, ggml_tensor) dispatched from ggml-cuda.cu, which is not harvested; a strixflerp recipe needs an adapter to call them. Nothing was run on a GPU or timed on the pod."

[provenance]
origin    = "lucebox"
repo      = "https://github.com/Luce-Org/lucebox"
commit    = "a70ab3ca25a945d97580043230dc33984aaf1fb2"
branch    = "main"
paths     = [
  "server/deps/llama.cpp/ggml/rocmfp4/rocmfp4_hip_codebook.cuh",
  "server/deps/llama.cpp/ggml/rocmfp4/rocmfp4_hip_scale.cuh",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp2_mix.cu",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp2_mix.cuh",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp3_mix.cu",
  "server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp3_mix.cuh",
]
authors   = ["Luce-Org", "The ggml authors"]
modified  = false

[licence]
spdx      = "MIT"

[build]
lang      = "hip-c++"
sources   = [
  "src/server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp2_mix.cu",
  "src/server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp3_mix.cu",
]
includes  = [
  "src/server/deps/llama.cpp/ggml/rocmfp4",
  "src/server/deps/llama.cpp/ggml/src/ggml-cuda",
  "src/server/deps/llama.cpp/ggml/src",
]
arch      = "gfx1151"
toolchain = "therock-10.2"
source_options = { "src/server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp2_mix.cu" = ["-DcublasSgemmStridedBatched=hipblasSgemmStridedBatched", "-DcudaStreamCaptureStatus=hipStreamCaptureStatus", "-DcudaStreamCaptureStatusNone=hipStreamCaptureStatusNone", "-DcudaStreamIsCapturing=hipStreamIsCapturing"], "src/server/deps/llama.cpp/ggml/src/ggml-cuda/rocmfp3_mix.cu" = ["-DcublasSgemmStridedBatched=hipblasSgemmStridedBatched", "-DcudaStreamCaptureStatus=hipStreamCaptureStatus", "-DcudaStreamCaptureStatusNone=hipStreamCaptureStatusNone", "-DcudaStreamIsCapturing=hipStreamIsCapturing"] }

[[provides]]
interface = "format.decode/rocmfp2-mix+rocmfp3-mix/f16.lucebox"
api       = "to_fp16 converters and registry in rocmfp2_mix.cu, rocmfp3_mix.cu"
numeric   = "GGML_TYPE_Q2_1_ROCMFP2_MIX (106) and Q3_1_ROCMFP3_MIX (105) decoded with tables staged to device by the deepseek4 loader (file header)"
regime    = "DeepSeek V4 expert weights"

[[requires]]
module    = "kernel.lucebox.ggml_headers"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
compile   = "standalone"
evidence  = "gate/results/compile/kernel.lucebox.rocmfp.json"
