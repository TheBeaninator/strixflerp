# The pod's served StrixFold TP4 build: DeepSeek-V4.1-Flash on four gfx1151 nodes (TP4-SERVE1 and the serve-next work).
# A sub-origin of `strixfold`: only what 72c0f083 changes or adds against catalog/strixfold (f64b5ff) and the build
# needs is harvested; every other file of this tree is catalog/strixfold's or listed as unharvested here.
# docs/DSV41-TP4.md describes the recipe built from it.
name      = "strixfold_tp4"
parent    = "strixfold"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "72c0f083"
branch    = "serve-next-20261123c (TP4-SERVE1 003f679c + VGATHER, Edge-REAP, route records, per-request acts, logprobs, loop policy, expert mask), local to the pod fork"
base      = "88ea779"            # merge-base with the parent's commit f64b5ff: upstream Shoestring-dev
state     = "serving: deployed to F D C A as ~/tfp/deploy/72c0f083fca1 (tp4-serve1-image-v7.conf), stage /data/pod/plans/strixfold/deploy-stage/72c0f083fca1"
pod_tree  = "/data/pod/plans/strixfold/fork"
reference_checkout = "build/strixfold-72c0f083 (git archive of the pod fork at 72c0f083fca18f80fcf73b2358cf8235c3dd5363)"

[licence]
spdx      = "Apache-2.0"
# copied verbatim next to this file at their origin paths: the root texts and LICENSES/, which THIRD_PARTY_NOTICES.md cites
files     = ["LICENSE", "NOTICE", "THIRD_PARTY_NOTICES.md", "LICENSES/Apache-2.0.txt", "LICENSES/CUTLASS-BSD-3-Clause.txt", "LICENSES/MIT.txt", "LICENSES/MiaAI-Lab-MIT.txt", "LICENSES/Pillow-MIT-CMU.txt", "LICENSES/PyTorch-BSD-3-Clause.txt"]
source    = "control-node:/data/pod/plans/strixfold/fork at 72c0f083 (the export above, git archive of that commit)"
third_party = "as catalog/strixfold (THIRD_PARTY_NOTICES.md)"

[toolchain]
host      = "zig 0.17.0 (/home/pod/opt on control-node), as catalog/strixfold"
device    = "therock-10.2"
triton    = "the TP4 Triton kit gfx1151-v6f2c38-tp4 (pod card 4d4c5173d2), prebuilt"

