id        = "kernel.strixfold_tp4.dsv41_abi"
kind      = "kernel"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for kernel.strixfold.dsv41_abi: 1 file(s) of kernel.strixfold.dsv41_abi (abi.h), laid over the f64b5ff files"
why       = "kernel.strixfold.dsv41_abi is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over kernel.strixfold.dsv41_abi without touching it or the TP2 recipes"
notes     = "Overlay of kernel.strixfold.dsv41_abi (overlay.json has every file with both sha256 and its commits). Cards behind the changes: -. Latest commits: ab1a7db4 draft_temperature: single-line comments, no new lean_check findings (review); 0d2fc151 dsv41 HIP: draft_temperature, a sampled stream's drafts drawn with its own sampling noise"

[provenance]
