id        = "kernel.strixfold_tp4.route_rec"
kind      = "kernel"
summary   = "Per-request routing records on gfx1151: one thread per (layer, expert) adds a request's gate mass into its stream slot, read by rank 0 at stream release"
why       = "Routing records of a single request (ROUTE_RECORDS, pod card 28153e18f3) need the gate mass summed per stream on the device; off nothing launches"
notes     = "New in the TP4 serving tree (zig/kernels/hip/dsv41/route_rec.hip, not in f64b5ff); compiled into the serving kit by the origin's build graph (zig/build/hip_dsv41.zig, flags as catalog/strixfold ORIGIN.toml [compile]). Cards: 28153e18f3."

[provenance]
origin    = "strixfold_tp4"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "72c0f083"
branch    = "serve-next-20261123c (TP4-SERVE1 003f679c + VGATHER, Edge-REAP, route records, per-request acts, logprobs, loop policy, expert mask), local to the pod fork"
paths     = [
  "zig/kernels/hip/dsv41/route_rec.hip",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/zig/kernels/hip/dsv41/route_rec.hip"]
includes  = ["src/zig/kernels/hip/dsv41"]
arch      = "gfx1151"
toolchain = "therock-10.2"
options   = ["--offload-device-only", "--no-gpu-bundle-output", "-O3", "-std=c++20", "-fno-gpu-rdc", "-mno-wavefrontsize64", "-ffp-contract=off", "-fno-fast-math", "-fdenormal-fp-math=ieee", "-D__HIP_PLATFORM_AMD__"]

[[provides]]
interface = "moe.route-record/-/f32.hip"
api       = "tf_ds_route_rec"
numeric   = "exact: fp32 adds in a fixed order; replies do not depend on it"
regime    = "ROUTE_RECORDS=1 only, rank 0"

[[requires]]
module    = "kernel.strixfold_tp4.dsv41_abi"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp4/build.txt"
compile   = "n/a"
reason    = "compiled only inside the recipe dsv41-flash.strixfold-tp4 by the origin's build graph (its object is pinned there and came out as the deployed one); not in gate/compile"
