id        = "executor.strixfold_tp4.dsv41"
kind      = "executor"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for executor.strixfold.dsv41: 23 file(s) of executor.strixfold.dsv41 and 19 file(s) the TP4 tree adds beside them (cache_move.zig, check_main.zig, cpu.zig, dense.zig, derived_launches.json, disk.zig ...), laid over the f64b5ff files"
why       = "executor.strixfold.dsv41 is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over executor.strixfold.dsv41 without touching it or the TP2 recipes"
notes     = "Overlay of executor.strixfold.dsv41 (overlay.json has every file with both sha256 and its commits). Cards behind the changes: 602dfeb13b, b7eb57e048, a1baab5e2d, 848ca944f7, d9ef7a305e, 5bb471d3b9, 023c5d2ad9, 19121aad1c, d6a577e1a1, 1375468e92, 716f35d40a, 4d4c5173d2, 12c50c5d8d, e5cb84a995, 28153e18f3, e96f0f5fa0, 58862dad76, 73bab11681, 4f9ba05838, b9fafca926, 6f42c090eb, 345bacf673, ee6892da53, 3760ed527a, ef450588a1, 18b8d5d277, 01574d76b3, 034bf2c6cd, 96431609cf. Latest commits: e33be4f4 dsv41 sf-disk at world 4: the disk prompt cache and imported (parked) states on the four-node split (pod card 602dfeb13b); cd2d157e dsv41: an exported state's copies off the device and back on both ranks (cache_move, frames 18 and 19, protocol 6); 71986030 dsv41 rank caches at world 4: rank{g}of4 files built and checked on CPU (pod card b7eb57e048); 8ff01127 dsv41 TP4 rank files cut from the TP2 rank files: tf-dsv41-rank-reslice (pod card b7eb57e048)"

