id        = "serve.strixfold_tp4.http"
kind      = "serve"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for serve.strixfold.http: 24 file(s) of serve.strixfold.http and 15 file(s) the TP4 tree adds beside them (acts_fields.zig, acts_test.zig, anthropic.zig, auth.zig, cache_key.zig, cache_routes.zig ...), laid over the f64b5ff files"
why       = "serve.strixfold.http is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over serve.strixfold.http without touching it or the TP2 recipes"
notes     = "Overlay of serve.strixfold.http (overlay.json has every file with both sha256 and its commits). Cards behind the changes: 4f9ba05838, 28153e18f3, f34d18ab39, 023c5d2ad9, 51591f7ba8, 73bab11681, f64f606edd, 9757a35411. Latest commits: e4fce45a server: a request's acts field behind the admin key (403/401 before it is read), checked against the model (400), the dump bounds (400/507) and acts.rows injection from ACTS_ROWS_DIR; tensorfold.acts in the reply (pod card 4f9ba05838); c900812d server: route_tag and tensorfold.route_record on chat, completions, messages and responses while TF_DS_ROUTE_RECORDS=1 (pod card 28153e18f3); fbae6f74 server: restore the trailing newline of anthropic.zig and responses.zig (pod card f34d18ab39); 06819404 server: loop-stopped replies are visible on /v1/messages and /v1/responses (pod card f34d18ab39)"

