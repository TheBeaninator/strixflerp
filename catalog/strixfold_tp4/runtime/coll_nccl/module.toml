id        = "runtime.strixfold_tp4.coll_nccl"
kind      = "runtime"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for runtime.strixfold.coll_nccl: 1 file(s) of runtime.strixfold.coll_nccl (comm.zig), laid over the f64b5ff files"
why       = "runtime.strixfold.coll_nccl is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over runtime.strixfold.coll_nccl without touching it or the TP2 recipes"
notes     = "Overlay of runtime.strixfold.coll_nccl (overlay.json has every file with both sha256 and its commits). Cards behind the changes: 023c5d2ad9, e96f0f5fa0, 716f35d40a, 01574d76b3. Latest commits: 09a812eb dsv41 reap: world-2 RDMA exchange delegates to the host link (pod card 023c5d2ad9); 5cb6ff9e dsv41 2D: TF_DS_VGATHER assembles multi-row quarters with two strided copies (pod card e96f0f5fa0); 14202a0e dsv41 comm: TF_DS_COLL=tcp at world 3-4 when TF_COLL_KIND=rdma (rdma_proxy's star), so the TP4 RDMA arm loads (pod card 716f35d40a); 2e29fcd5 dsv41 HIP: four-rank collectives over RCCL (gpu.nccl on HIP, Comm.coll all_gather and exchange) (pod card 01574d76b3)"

[provenance]
origin    = "strixfold_tp4"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "72c0f083"
branch    = "serve-next-20261123c (TP4-SERVE1 003f679c + VGATHER, Edge-REAP, route records, per-request acts, logprobs, loop policy, expert mask), local to the pod fork"
paths     = [
  "zig/src/families/dsv41/comm.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
modified  = false
upstream  = "overlay on runtime.strixfold.coll_nccl (origin strixfold, f64b5ff): 1 of these paths are its files too, replaced whole; overlay.json"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:strixfold_tp4"

[[provides]]
interface = "collective.allgather-nccl/-/f32.tp4"
api       = "comm.zig Comm.coll"
numeric   = "bytes only; no header, no mismatch check"
regime    = "TP4 serving tree 72c0f083 (world 2 to 4); TP2 / TP4 on CUDA"

[[requires]]
module    = "runtime.strixfold.coll_nccl"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp4/build.txt"
compile   = "n/a"
reason    = "builds inside the recipe dsv41-flash.strixfold-tp4 (control-node, zig 0.17.0, TheRock 10.2) over its parent module; the kit came out as the deployed one; not run on a GPU from that build"
