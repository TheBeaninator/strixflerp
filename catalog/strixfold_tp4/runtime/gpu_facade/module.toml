paths     = [
  "zig/src/gpu/hip/kit.zig",
  "zig/src/gpu/hip/launch.zig",
  "zig/src/gpu/hip/rccl.zig",
  "zig/src/gpu/hip_facade.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
