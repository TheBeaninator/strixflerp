id        = "runtime.strixfold_tp4.gpu_facade"
kind      = "runtime"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for runtime.strixfold.gpu_facade: 3 file(s) of runtime.strixfold.gpu_facade and 1 file(s) the TP4 tree adds beside them (hip_facade.zig, kit.zig, launch.zig, rccl.zig), laid over the f64b5ff files"
why       = "runtime.strixfold.gpu_facade is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over runtime.strixfold.gpu_facade without touching it or the TP2 recipes"
notes     = "Overlay of runtime.strixfold.gpu_facade (overlay.json has every file with both sha256 and its commits). Cards behind the changes: 01574d76b3, 12c50c5d8d. Latest commits: f7c5d83a SPEED-FUSE-2 31e3ab5061: cherry-pick SFF-COUNTS (sff-counts-291bf8cdad c0a95612) so the fused launches are countable; 5051d5f9 dsv41 HIP: a text kit does not load vision.hsaco (review); 3d03a954 dsv41 HIP: the encoder stops between pictures when its request goes or the encoder stops; per-thread launch counts (review); adf536fb dsv41 HIP: the vision tower encodes on its own thread and stream, off the engine thread (review)"

