id        = "runtime.strixfold_tp4.core"
kind      = "runtime"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for runtime.strixfold.core: 1 file(s) of runtime.strixfold.core and 8 file(s) the TP4 tree adds beside them (prompt_disk.zig, prompt_disk_format.zig, prompt_disk_fs.zig, prompt_disk_index.zig, prompt_disk_namespace.zig, prompt_disk_namespace_test.zig ...), laid over the f64b5ff files"
why       = "runtime.strixfold.core is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over runtime.strixfold.core without touching it or the TP2 recipes"
notes     = "Overlay of runtime.strixfold.core (overlay.json has every file with both sha256 and its commits). Cards behind the changes: 602dfeb13b, 49bdf842f2, 848ca944f7. Latest commits: e33be4f4 dsv41 sf-disk at world 4: the disk prompt cache and imported (parked) states on the four-node split (pod card 602dfeb13b); 82199d2e dsv41 sf-disk: rank 0 evicts its own least recently used states to keep the free-space floor, as for the budget, with a counter and a line per eviction; a pair-size fill, evict and resume test (pod card 49bdf842f2); 7f95403c dsv41 sf-disk: a tier that cannot write above its free-space floor says so at open and at its first skipped save; a factory-size save and resume test (pod card 848ca944f7); 7f9aa866 prompt_disk: a sweep never follows a link and takes only an unlocked sf-disk namespace (review)"

