id        = "runtime.strixfold_tp4.coll_tcp"
kind      = "runtime"
summary   = "StrixFold 72c0f083 (the pod's TP4 serving build) for runtime.strixfold.coll_tcp: 3 file(s) of runtime.strixfold.coll_tcp (tcp_coll.zig, tcp_proxy.zig, tcp_wire.zig), laid over the f64b5ff files"
why       = "runtime.strixfold.coll_tcp is cut at f64b5ff, the TP2 pair's deployment; the pod serves DeepSeek-V4.1 at TP4 (four gfx1151 nodes) from 72c0f083, so the TP4 recipe lays these files over runtime.strixfold.coll_tcp without touching it or the TP2 recipes"
notes     = "Overlay of runtime.strixfold.coll_tcp (overlay.json has every file with both sha256 and its commits). Cards behind the changes: 023c5d2ad9, f782ee5476, 3760ed527a. Latest commits: 09a812eb dsv41 reap: world-2 RDMA exchange delegates to the host link (pod card 023c5d2ad9); 7bc5cbf4 dsv41 reap: collect routing stats on the serving path when REAP_STATS is on (pod card 023c5d2ad9); bfebed5c dsv41 TP4-RDMA-N: rdma_proxy at four ranks, one QP a peer, all-gather and exchange (pod card f782ee5476); 0def23ec dsv41 collectives: a thread a data link for tcp_host's striped exchanges, off by default (pod card 3760ed527a)"

[provenance]
origin    = "strixfold_tp4"
repo      = "https://github.com/Shoestring-dev/Strixfold"
commit    = "72c0f083"
branch    = "serve-next-20261123c (TP4-SERVE1 003f679c + VGATHER, Edge-REAP, route records, per-request acts, logprobs, loop policy, expert mask), local to the pod fork"
paths     = [
  "zig/src/families/dsv41/tcp_coll.zig",
  "zig/src/families/dsv41/tcp_proxy.zig",
  "zig/src/families/dsv41/tcp_wire.zig",
]
authors   = ["StrixFold contributors", "TensorFold contributors", "pod"]
modified  = false
upstream  = "overlay on runtime.strixfold.coll_tcp (origin strixfold, f64b5ff): 3 of these paths are its files too, replaced whole; overlay.json"

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "zig"
sources   = []
includes  = []
arch      = "gfx1151"
toolchain = "therock-10.2"
closure   = "zig:strixfold_tp4"

[[provides]]
interface = "collective.allgather-tcp/-/f32.tp4"
api       = "tcp_coll.zig (tcp_host), tcp_proxy.zig"
numeric   = "bytes only; site, layer, byte count and generation checked against the peer on every call"
regime    = "TP4 serving tree 72c0f083 (world 2 to 4); TP2; decode slices and prompt blocks"

[[requires]]
module    = "runtime.strixfold.coll_tcp"

[gate]
parity    = "none"
bench     = "none"
status    = "builds"
evidence  = "gate/results/dsv41-flash.strixfold-tp4/build.txt"
compile   = "n/a"
reason    = "builds inside the recipe dsv41-flash.strixfold-tp4 (control-node, zig 0.17.0, TheRock 10.2) over its parent module; the kit came out as the deployed one; not run on a GPU from that build"
