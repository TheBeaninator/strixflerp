api       = "native/hip.zig (open, families), native/cache_fit.zig, native/cuda_memory.zig (budget)"
numeric   = "n/a"
regime    = "TP4 serving tree 72c0f083 (world 2 to 4); one engine a process"

[[requires]]
module    = "runtime.strixfold.engine_host"

[gate]
