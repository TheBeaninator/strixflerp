# The one serving configuration of the TP2 DeepSeek-V4.1 port on the two Strix Halo boxes (handoff section 10): both
# rank scripts (serve-rank0.sh, serve-rank1.sh) and first_light.sh read this file, and only this file; serve_lib.sh
# resolves it into each rank's command and environment and writes the resolved form (resolved.json) with every run.
# A value here that the two ranks must share is written once and passed to both (upstream #25: rank 1's --streams,
# --pool and --round-rows equal rank 0's TF_DS_STREAMS, --context and TF_DS_ROUND_ROWS).
# Paths are on each box (the same layout on both, BUILD_AND_RUN.md); $HOME is the box's own.

# ---- the ranks (rank 0 = node0, the coordinator; rank 1 = node1)
WORLD=2
RANK0_HOST=node0                 # ssh name from node1 (first_light.sh runs on node1, the build box)
RANK1_HOST=node1
MASTER_IP=203.0.113.1              # rank 0's USB4 address: it listens there, rank 1 connects (TF_TP_MASTER)
TP_PORT=29620                    # the ranks' link port (TF_TP_PORT); the transport's own ports are its (w-link)
TRANSPORT=tcp                    # the collectives' wire: tcp (w-link's TCP, model.Options.open_coll; COLL_KIND below picks
                                 # host or proxy) | rdma (rdma_proxy.zig: the proxy's kernels and slab over RoCE v2 verbs
                                 # on the RDMA_DEV* devices; always kind rdma, capturable like proxy; COLL_PROXY_STRIPE_KIB
                                 # must be empty or 0: one QP per pair carries every gather that fits a slot. A larger
                                 # gather goes through tcp_host as under tcp: TP_STRIPE, COLL_STRIPE_MIB and
                                 # COLL_WIRE_THREADS below apply to it under either transport)
# rdma only (serve_lib.sh resolves them into TF_RDMA_DEVICES / TF_RDMA_IFNAME / TF_RDMA_GID_INDEX; a rank starts only
# if rdma_check.py passes on its box: port ACTIVE, the GID set, memlock enough for the slab, uverbs writable)
RDMA_DEV0=                       # rank 0's ibdev (rdma link), e.g. mlx5_0; both or neither of RDMA_DEV0/RDMA_DEV1
RDMA_DEV1=                       # rank 1's ibdev, e.g. mlx5_0
RDMA_IFNAME=                     # without RDMA_DEV*: the rail interface's name, the same on both boxes (the ibdev that
                                 # carries it); empty with no RDMA_DEV*: the box's only ibdev
RDMA_GID=3                       # TF_RDMA_GID_INDEX: the GID index of the link's RoCE v2 address (ports/1/gid_attrs/types)
# the transport's settings (tcp_coll.zig), the same on both ranks (its handshake compares them)
TP_DATA_PORT=                    # TF_TP_DATA_PORT: empty = the control port + 16
TP_STRIPE=203.0.113.1              # TF_TP_STRIPE: rank 0's address on the second cable; empty = one data link (prefill: a
                                 # 2048-row chunk's gathers 593 ms striped vs 810 on one cable, w-link, MTU 1500)
COLL_STRIPE_MIB=4                # TF_COLL_STRIPE_MIB: payloads from this size split over both links (with TP_STRIPE)
COLL_WIRE_THREADS=               # TF_COLL_WIRE_THREADS (this rank's own; empty: the engine's 1): 2 moves a striped payload's
                                 # second link on a helper thread, the first on the caller's (tcp_host's gathers, so prompt
                                 # reading; needs TP_STRIPE, which on one network card is rank 0's own address again: a
                                 # second connection). The helper spins while a prompt is read and sleeps 20 ms after
COLL_RTO_MIN_US=8000             # TF_COLL_RTO_MIN_US
COLL_PROGRESS_MS=2000            # TF_COLL_PROGRESS_MS: a call that sees no progress this long fails (Timeout)
COLL_GPU_WAIT_S=10               # TF_COLL_GPU_WAIT_S (1-600; empty: the engine's 10): a GPU wait inside a collective longer
                                 # than this fails the pair (tcp_host: this rank's block reaching pinned memory, the last
                                 # upload; tcp_proxy: the device's wait for a free slot and for the peer's block). A dead
                                 # peer does not wait for it (its closed sockets fail the next exchange at once) and a
                                 # silent one fails at COLL_PROGRESS_MS
COLL_GPU_WARN_S=2                # TF_COLL_GPU_WARN_S (0-600, 0 off; this rank's own): a GPU wait or proxy exchange longer
                                 # than this logs one line as it ends (rank, site, bytes, chunk, ms, how it ended)
COLL_STAGING=dma                 # TF_COLL_STAGING: blit | dma
COLL_KIND=proxy                  # TF_COLL_KIND (tcp): proxy (tcp_proxy: kernels and a proxy thread; capturable) | host (eager;
                                 # decode 26.1 / 25.6 tok/s code / prose vs 29.9 / 29.1 with proxy and GRAPHS=1);
                                 # TRANSPORT=rdma resolves it to rdma whatever is written here
COLL_PROXY_CPU=6                 # TF_COLL_PROXY_CPU (proxy, rdma): the proxy thread's core; nothing else may spin there,
                                 # so a proxy run keeps the ranks off it and its SMT sibling (ENGINE_CPUS)
COLL_PROXY_CPU2=7                # TF_COLL_PROXY_CPU2 (proxy only, with COLL_PROXY_STRIPE_KIB > 0): the second proxy thread's
                                 # core (the second cable's half of each split gather)
ENGINE_CPUS=0-5,8-21,24-31       # taskset -c for both ranks (empty: unpinned): off the proxy threads' cores 6 and 7 and
                                 # their SMT siblings 22 and 23
WRAP0=                           # a command rank 0 runs inside (its words, an absolute path first), e.g. a profiler:
WRAP1=                           # /opt/rocm/bin/rocprofv3 --kernel-trace --output-format csv -d /abs/dir --  (empty: none)
SPAWN_UNIT=0                     # 1: a rank and its GPU-lock holder start as transient user units (systemd-run --user),
                                 # not inside the caller's session: a box whose logind has KillUserProcesses=yes ends a
                                 # session's processes when first_light.sh's ssh returns, the rank with them (an empty
                                 # rank0.log); 0: nohup inside the session
COLL_SLOT_KIB=4352               # TF_COLL_SLOT_KIB (proxy, rdma): the largest gather a slot holds; a larger one goes through
                                 # tcp_host and cannot be captured, so GRAPHS=1 needs ROUND_ROWS*64640*4 B (the head) to fit
COLL_PROXY_STRIPE_KIB=16         # TF_COLL_PROXY_STRIPE_KIB (proxy only, with TP_STRIPE): a slot gather of at least this
                                 # many KiB is split, its second half moved over the second cable by a second proxy
                                 # thread (one thread moves ~1.6 GB/s each way whatever the cables); 0 = all on the first
                                 # cable, as before 2026-10-20. coll-check passes, p50, 0 -> 16: 1-row 2.16 -> 1.82 ms,
                                 # 6-row DSpark 7.1-7.3 -> 5.3, 16-row 17.0-22.1 -> 12.2-13.0 (64 KiB: 1-row 2.09)

# ---- the build both ranks run: one commit, deployed with deploy_rank0.sh --native (SHA-256 checked on arrival)
DEPLOY_DIR='$HOME/tfp/deploy/current'      # on each box: native-hip/bin/{tensorfold-native,tf-dsv41-lanes}, the kit
KIT_SUBDIR=native-hip/share/tensorfold/hip/gfx1151/dsv41   # the AMD kit inside the deployment (with the Triton kit, tri/README.md)

# ---- the model and its inputs (BUILD_AND_RUN.md sections 1 and 3)
BUNDLE='$HOME/models/tf-port/inputs-tp2-c178a012'
MODEL_DIR='$BUNDLE/model'                   # config.json, tokenizer.json and chat_template.jinja (c282975e): the
                                            # bundle's, under its manifest (the checkpoint dir has no template)
RANK_CACHE='$BUNDLE/rank$RANK/rank-cache'  # TF_DS_RANK_CACHE (each rank's own file)
DS_KIT='$DEPLOY_DIR/ds-kit'                 # TF_DS_KIT: engram.json and the RoPE tables (the deploy's: rows in
                                            # its rope.json; the bundles' own kit has 65,536)
ENGRAM_DIR='$HOME/models/tf-port/ds1017-1bae0e10'
TOKEN_MAP='$BUNDLE/dsv41_token_map.json'
BUNDLE_SHA256=243b984d1069b190e762b3f9eaf12c90b2a23dd1e8f33880019f60d61264e8e9   # inputs_manifest.json
EDIT=                            # TF_DS_EDIT (both ranks): a rank-1 edit of blocks' wo_b / shared w2 outputs on this
                                 # bundle's weights (tools/dsv41-hip/make_edit.py; the uncensored model at the EXL3
                                 # pack's speed: docs/UNCENSORED.md); empty: none
EDIT_SHA256=                     #  the edit file's sha256, which make_edit.py prints (required with EDIT)

# ---- the engine (first light: one stream, 8K, greedy, untuned)
CONTEXT=8192                     # a request's most positions (both ranks --context); <= the RoPE tables' rows - 49
#POOL=16384                      # the streams' shared pool (rank 0 TF_DS_POOL, rank 1 --pool); unset: CONTEXT. Above
                                 # CONTEXT, streams of up to CONTEXT positions each share it (~0.9 KB a position a rank)
STREAMS=1                        # TF_DS_STREAMS / rank 1 --streams
PARALLEL=1                       # the server's --parallel (<= STREAMS)
ROUND_ROWS=16                    # a round's rows at most (max verify rows): TF_DS_ROUND_ROWS / rank 1 --round-rows
CHUNK_ROWS=2048                  # prompt chunk rows: fixed in the engine (model.chunk_rows), recorded, not settable
DRAFTS=1                         # DSpark drafting (P3): 1 on, the published speeds, the same text as 0; 0 off
                                # (server --no-drafts, rank 1 --drafts 0)
DRAFT_BYPASS_AT=6                # TF_DS_DRAFT_BYPASS_AT (rank 0): from this many active streams a round verifies
                                # pending rows alone and runs no head pass (drafts-off rounds), drafting again
                                # below it; 0 off. Resolves to 0 unless DRAFTS=1, WORLD=2 and STREAMS >= it.
FILL_SLICE_MS=1000               # TF_FILL_SLICE_MS (rank 0): while other streams decode, a cold prompt reads at least
                                # this many ms (whole 2,048-row chunks) between their rounds: it slows them instead of
                                # stopping them; 0: every prompt pass reads whole before the next round
FINISH_LEFT=                     # TF_FINISH_LEFT (rank 0): after a whole prompt pass of 1 s or more, streams within
                                # this many tokens of their max_tokens decode before the next request's pass, 5 s at
                                # most (empty: the engine's 256). A request with max_tokens <= it is within it from its
                                # first token, so each stream decodes alone; 0: no stream is waited for, every queued
                                # pass reads first and their streams share the rounds
QUEUE_MAX=                       # TF_QUEUE_MAX (rank 0): chat, completion, Messages and Responses requests that may be
                                # in flight beyond STREAMS (waiting for a lane); the next is refused with 429 and a
                                # Retry-After before its body is read. Empty: the server's 64; off: no count cap
QUEUE_MIB=                       # TF_QUEUE_MIB (rank 0): MiB the requests in flight may hold together (their request
                                # arenas: body, parse, ids) when one more would wait; that one is then refused with 429.
                                # Empty: the server's 4096; off: no byte cap. One a lane can take is never refused
QUEUE_RETRY_S=                   # TF_QUEUE_RETRY_S (rank 0): the Retry-After of those 429s, in seconds; empty: 10
MODALITIES=text                  # text capability (D13): TF_DS_MODALITIES / rank 1 --modalities; text_image needs:
VISION_DIR=                      #  rank 0: the tower's weights, a sidecar (kit/make_vision_sidecar.py) with SHA256SUMS
VISION_BIAS_SHA256=              #  both: DS_KIT/vision/gate_bias_vl.safetensors's sha256 (kit/make_bias_vl.py)
MAX_IMAGES=                      #  rank 0: --vision-max-images N (from 1; earlier turns count); empty: the server's 32
IMAGE_TOKENS=                    #  both ranks: a request's image tokens at most, summed over its pictures (TF_DS_IMAGE_TOKENS
                                 #  on rank 0, --image-tokens on rank 1), the rows each rank reserves at its open, 10 KiB a
                                 #  token a rank (32768: 320 MiB); 1 .. 65536; empty: the engine's 4096 (four pictures of
                                 #  1,024 tokens). Past it a request is refused with a 400; MAX_IMAGES still counts parts
ENCODE_CACHE_MIB=                #  rank 0: TF_DS_ENCODE_CACHE_MIB, the picture cache: each encoded picture's rows (10 KiB a
                                 #  token) kept by its digest, so a later turn or request with the same picture skips the
                                 #  tower; least recently used out past it; 0 .. 65536, 0 off; empty: 512
GRAPHS=1                         # TF_DS_GRAPHS: the rounds' stretches as HIP graphs; needs COLL_KIND=proxy or
                                 # TRANSPORT=rdma (tcp_host is not capturable)
GRAPHS_EAGER=                    # TF_DS_GRAPHS_EAGER (both ranks): N = every Nth round runs eagerly, not from its graphs
                                 # (a check that the eager path leaves the graphs' state); empty: never
TP4_FILL=0                       # TP4-ATTN (e5cb84a995), TF_DS_TP4_FILL (every rank; weights loader): 1 = more K splits on a 2D
                                 # node's halved wq_b / wo_a / wo_b on 1-16-row windows (faster, NOT bit-exact vs TP2); exact = TP2's sum
                                 # order on glinear_mlp (register prefetch, bit-exact); exact_lds = the same plan and sum order on
                                 # glinear_mlp_lds (trellis tiles parked in LDS); 0: off
VGATHER=0                        # TP4-VGATHER (e96f0f5fa0), TF_DS_VGATHER (every rank; world-4 collective open): 1 = multi-row
                                 # equal-width quarters (gather_a, gather_m, Engram, and a prompt chunk) assembled with two
                                 # copy_rows16 instead of four copyRows. The all-gather, its site and its bytes stay the rank-order
                                 # gather issued with this off, so the gathered rows are the same bytes. One row stays on
                                 # COLL_SWAP12. A width that is not a multiple of 16 bytes, or 2R > 65535, stays on the four copies. 0: off
HC_CHAIN=                        # SPEED-FUSE-1 (b7269694f8), TF_HC_CHAIN (both ranks; Round.init): 1 = hc_pre2's whole
                                 # decode chain, the post alone included, as ONE HIP launch a site (_hc_chain, 12 at the
                                 # 80 mix sites' 3 round shapes) instead of mix_part + sinkhorn + finish + post. Same
                                 # bits; needs a kit that carries tri._hc_chain (the engine refuses at load without it).
                                 # Windows of up to 6 rows (tri_hc.chain_rows); a larger one runs the four launches.
                                 # Empty/0 = today's four launches.
FUSE2=                           # SPEED-FUSE-2 (31e3ab5061), TF_FUSE2 (both ranks; Round.init): 1 = a decode window's
                                 # router (up to 6 rows, tri_norm.fuse2_rows; a larger window runs the two launches) as ONE
                                 # launch a layer (_rowmm_route for _rowmm_parts + _route_parts).
                                 # Same bits; needs a kit that carries tri._rowmm_route (exl3/kdec/fuse2/aot_fuse2.py).
                                 # Empty/0 = today's two launches.
ROUND_MS=36.06,43.76,50.38,56.29,59.52,61.52,66.27,71.02,75.77,80.52,85.27,90.02,94.77,99.52,104.27,109.02
# TF_DS_ROUND_MS: amd-1 through 6 rows; rows 7-16 extend by 4.75 ms/row from measured multi-stream rounds.
# 2026-10-20 mb5 screen: C2 +6.7%, C4 +5.6%, identical completion hashes; full qualification required before promotion.
DRAFT_MS=0                       # TF_DS_DRAFT_MS: 0 = amd-1 rounds already include the drafter pass (empty: GB10s 3.5)
FIX_K=                           # TF_DS_FIX_K (rank 0, a cost measurement): every drafted stream verifies FIX_K drafts a
                                 # round; empty: the profile chooses
FROZEN_TIMING=                   # TF_LANES_FROZEN_TIMING (rank 0): 1 = draft widths from the cost tables only, never from
                                 # measured round times, so two runs of a request take the same widths (repeatability)
TRACE_ROUNDS=                    # TF_DS_TRACE_ROUNDS (rank 0): 1 = a line a verify window in rank0.log (position, rows,
                                 # ids, drawn tokens); 2 = also each row's two best tokens and logits (slower)
ARENA_GIB=0                      # TF_DS_ARENA_GIB: 0 = the arena grows as the buffers ask
PREFILL_SPLIT=256                # TF_DS_PREFILL_SPLIT (default 256; serve_lib clears it above CONTEXT 16384): empty/0 off; ROWS: a prompt chunk whose first half would hold
                                 # >= ROWS rows runs as two halves zipped layer by layer, each half's gathers moving
                                 # while the other half computes (model.zig fillSplit; both ranks alike)
PREFILL_SPLIT_LARGE=1            # keep the split above CONTEXT 16384: p-pre2 2026-10-20, CONTEXT 63,488, fd65f28: prompt reading +34% (11,594 tok 1,101 -> 1,476; 34,287 tok 1,110 -> 1,486), identical prompt-logits SHAs, +0.62-0.68 GiB per rank (MemAvailable floor 16.4 GiB); 0 = old behaviour
PREFILL_SPLIT_ZIP=               # TF_DS_PREFILL_SPLIT_ZIP: 0 runs a split chunk's halves one after the other (no
                                 # overlap; the same rows as the zip, to compare results)
PREFILL_ZIP2=                    # TF_DS_PREFILL_ZIP2 (both ranks alike: the handshake compares it): empty/0 off. 1: a
                                 # prompt runs in units of two whole 2,048-row chunks zipped layer by layer, so the
                                 # routed experts run once per chunk instead of once per half (model.zig unitRows); 2:
                                 # the prompt's last, partial chunk may ride as a unit's second. Needs PREFILL_SPLIT
                                 # and its zip (the engine refuses it otherwise). Each rank then holds two 2,048-row
                                 # chunk buffer sets in place of two of 1,024: raise PEAK_GIB with it. Kept states
                                 # stay on the 2,048-row grid
LOGITS_SHA=                      # TF_DS_LOGITS_SHA (rank 0) / --logits-sha (rank 1): 1 logs each prompt's logits'
                                 # SHA-256 (comparing two builds or settings)
HIP_DEVICE=0                     # TF_HIP_DEVICE
MEMORY_LIMIT_GB=110              # TENSORFOLD_HIP_MEMORY_LIMIT_GB (w-link's allocation gate)
MEMORY_RESERVE_GIB=              # TENSORFOLD_MEMORY_RESERVE_GIB: GiB kept free for the host when the weights' budget is
                                 # checked at load (empty: the engine's tenth of the memory, 12.4 GiB on 124 GiB; at
                                 # least 2). A box whose MemAvailable is within a GiB of the weights plus that tenth
                                 # (a 98.9 GiB rank at 131,072 positions on 111.3 GiB available) needs it lower
PEAK_GIB=101                     # a rank's peak memory (GTT + RSS) at CONTEXT 8192, 1 stream: q-qual's ledger saw
                                 # MemAvailable fall from 117 to 16.7 GiB during the load. A rank starts only with
                                 # MemAvailable >= PEAK_GIB + 8 and no other engine on the box (U25); raise it with
                                 # CONTEXT, STREAMS or ARENA_GIB
VERIFY_REPORT=1                  # 1: a rank starts only if this box's verify_inputs.sh report passed for BUNDLE_SHA256
                                 # (U16; the rank cache's file name is always checked against the manifest)
GPU_STRICT=0                     # TF_GPU_STRICT: 1 checks every launch against its kernel's metadata and refuses a
                                 # Triton launch without its own variant; 0 until the kit has _sparse_attn_merge_rot2
                                 # for every row count (a prompt of 31 rows runs a variant that assumes less)
GPU_COUNTS=0                     # TF_GPU_COUNTS: 1 counts every launch by kernel id without GPU_STRICT's checks. A
                                 # reply's telemetry then has "launches" (since its prefill, every stream's; a graph
                                 # replay launches nothing, so count with GRAPHS=0). Decode tok/s measured with
                                 # GPU_STRICT=1 or GPU_COUNTS=1 is not comparable to a run with both 0: the check or
                                 # the count runs before every launch
AUX=hip                          # TF_DS_AUX: w-tri's HIP kernels in place of Triton launches and the gates' hipBLAS
                                 # GEMMs: hip (all) | triton (none) | a list of attn,index,hc,gate,idxw,rope (both
                                 # ranks alike: the handshake compares it)
# the 2x Spark served config's engine settings (PLAN-research-actions.md R1, R7), each off until its evidence decides
REPLAY_FLOOR=0                   # TF_DS_REPLAY_FLOOR (both ranks; the handshake compares it): 1 = a <= 16-row last
                                 # chunk whose window reaches below the replay floor reads by the gather path, not the
                                 # slot's ring (off: it reads up to 15 keys of the request served before; A1)
PLACE_VICTIM=0                   # TF_DS_PLACE_VICTIM (rank 0's placement; SF-PLACE-VICTIM ee6892da53): 1 = a placement
                                 # that needs kept states' room takes it first from states a longer kept state on
                                 # their path supersedes, and a state it took whose rows lie clear of the extent it
                                 # placed keeps them (off: least recently used first, and every state taken is lost).
                                 # Placement only: which rows a stream uses and which kept states survive, not replies
HC_SIDE=0                        # TF_DS_HC_SIDE on rank 0, --side on rank 1 (rank-local): the decode rounds' mixes'
                                 # side work on a stream of its own (A2)
ENGRAM_AIO=0                     # TF_DS_ENGRAM_AIO on rank 0, --aio on rank 1 (rank-local): Engram reads by Linux AIO
                                 # on O_DIRECT, rounds and prompt chunks (A3)
L2_PREFETCH=0                    # EXPERIMENTAL, k-dec2's MALL prefetch: 1 = TF_DS_L2_PREFETCH on rank 0, --prefetch 1 on
                                 # rank 1 (rank-local): the decode rounds touch the next kernels' weights into the 32 MB
                                 # memory-side cache on a stream of their own (the kit's exl3.l2_prefetch; a kit without
                                 # it refuses at load). It also sets DEBUG_HIP_GRAPH_SEGMENT_SCHEDULING=1 on both ranks, a
                                 # HIP debug variable: without it graph replay runs the forked prefetch serially

# ---- the server (rank 0)
SERVE_HOST=127.0.0.1
SERVE_PORT=18080
SERVE_NAME=dsv41
TEMPERATURE=0                    # greedy
MAX_TOKENS=65536                 # --max-tokens: a request without max_tokens gets this, clamped to the context the pool
                                 # holds after its prompt (W - N; W = /v1/models max_model_len, 8,174 at CONTEXT 8192); an
                                 # explicit max_tokens over W - N is refused (400). Each stream reserves its prompt + max_tokens
                                 # of the pool, so with STREAMS > 1 a request without max_tokens holds the rest of it
TOP_K_MAX=0                      # TF_TOP_K_MAX: N > 0 = a sampled request's top_k omitted or <= 0 becomes 20 and one
                                 # above N becomes N (the sampler takes at most 56); 0 = off: the server refuses them, a
                                 # 400 naming top_k (A4, U49)
SEED_RANDOM=0                    # TF_SEED_RANDOM: 1 = a sampled request without a seed draws a fresh one (off: keyed
                                 # to the prompt); a request's own seed is kept either way (A4)
THINKING=0                       # 0: --no-thinking (first light answers directly); 1: --thinking
LOOP_POLICY=stop                 # --loop-policy (pod card f64f606edd): what an exact token cycle (period <= 64 tokens, repeated
                                 # over >= 256 tokens, found while thinking is open) does: stop = end the reply at
                                 # detection with finish_reason "loop" (no forced close, no answer), so the attempt
                                 # fails visibly; close = force the think close so the model answers (the old
                                 # LOOP_GUARD=1); count = detect and report only; off = no detection. Every policy but off
                                 # reports tensorfold.loop {policy, fired, period, at_token, in} on the reply and
                                 # tensorfold:loop_detections_total in /metrics; a loop in the answer is counted, never
                                 # acted on. LIMITS: source chosen; why: a 256-token exact cycle at period <= 64
                                 # essentially never recovers, and stop ends it at detection instead of burning the rest
                                 # of the context (up to 524K tokens) on one stream; changes-outcome no (a looped
                                 # attempt fails either way, stop only ends it sooner). Unset: LOOP_GUARD (1 = close)
DRAFT_TEMPERATURE=0              # --draft-temperature: a sampled request's drafts are drawn with the noise its own
                                 # sampler will use, at this multiple of its temperature, so more of them land (the
                                 # reply's tokens do not change); 0 or unset: every draft is the drafter's best token.
                                 # A request's "draft_temperature" wins
PROMPT_CACHE_GIB=0               # no kept prompt states for first light
# sf-disk: the kept prompt states on disk on both nodes, read back after a restart (needs PROMPT_CACHE_GIB > 0: the
# disk tier writes what the memory tier keeps). 0 or unset: off, and the ranks start exactly as without these keys.
PROMPT_DISK_GIB=0                # disk per node for kept states (the pair: 256); TF_DS_PROMPT_DISK_GIB on both ranks
PROMPT_DISK_DIR='$HOME/strixfold-cache/prefix'  # one directory per identity (deploy, bundle, kit, settings) below it
PROMPT_DISK_FLOOR_GIB=16         # no writes while the filesystem has less free
PROMPT_DISK_QUEUE_MIB=1024       # host memory for states waiting to be written (each rank; streamed in pieces)
PROMPT_DISK_MIN_TOKENS=8192      # shorter states stay in memory only
PROMPT_DISK_RATE_MIB=1024        # the writer's MiB/s at most (it runs in the idle I/O class)
# POST /cache/probe, /cache/export and /cache/import (docs/api.md): a file of two lines, the HMAC key (64 hex digits)
# an export is signed with and the bearer the routes take, mode 0600 on node0. Empty or unset: the routes are absent.
CACHE_TRANSFER_KEY=

# TP4-REAP-STATS (023c5d2ad9). Passive Edge-REAP routing statistics from normal traffic. Replies stay
# byte-identical. 0 (the default): the engine does not collect, the plan text is unchanged, GET /stats/reap
# is absent. 1: every rank collects. REAP_EVERY is the decode sample period (row 0 of every Nth round; the
# first round is sampled). REAP_PREFILL_ROWS is how many rows of a prompt chunk are sampled for the norm
# (evenly spaced, at most the chunk). REAP_BUCKETS is the cap on distinct domains; each domain has a text
# bucket and a vision bucket, and "default" takes one slot. A request past the cap is a 400. REAP_DIR empty:
# no snapshots. REAP_SNAPSHOT_MIN: minutes between snapshots (0: only at clean shutdown). Rank 0 writes
# <dir>/<domain>.<modality>.json. Exported reap_weighted_norm_sum = (sampled sum of g*||f||) / max(norm_count, 1)
# * token_count, so the script's reap_saliency = that sum / token_count is the sampled mean. With
# REAP_EVERY=1 and REAP_PREFILL_ROWS at least the chunk, the export matches the script's record_batch.
# The route is GET /stats/reap and needs CACHE_TRANSFER_KEY (401 without the bearer, 404 when stats are off
# or the key is unset). A request's reap_domain ([a-z0-9_.-]{1,32}, default "default"; body, else the
# x-reap-domain header) selects the domain. Modality is which gate bias the router used.
REAP_STATS=0
REAP_EVERY=8
REAP_PREFILL_ROWS=4
REAP_BUCKETS=16
REAP_DIR=
REAP_SNAPSHOT_MIN=10

# ROUTE-RECORDS (28153e18f3). Per-request routing records for joining routing with eval verdicts. Replies stay
# byte-identical (the record kernel only reads the router's pick/wts). 0 (the default): nothing is collected and
# no reply carries tensorfold.route_record. 1: rank 0 accumulates each request's gate mass and token count per
# (MoE layer, expert) over its committed prompt and decode rows (never the DSpark/MTP layers or drafter forwards),
# and at the request's end writes one JSON line (top ROUTE_RECORDS_TOPK experts a layer by gate mass, plus each
# layer's totals) to ROUTE_RECORDS_DIR/route-<UTC>-<seq>.jsonl from a writer thread. Files rotate at
# max(1 MiB, ROUTE_RECORDS_MAX_MB/16); the oldest route-*.jsonl are deleted while the total passes
# ROUTE_RECORDS_MAX_MB. ROUTE_RECORDS_DIR must be set when on (rank 0 refuses to start otherwise). Every reply
# carries tensorfold.route_record (the line's "id") and tensorfold.route_tag: the client's route_tag body field,
# else the x-route-tag header, [A-Za-z0-9_.:/=+-]{1,160} (a 400 otherwise, only while on). Independent of
# REAP_STATS (both on share REAP's staging). Only rank 0 gets the keys; the plan text is unchanged.
ROUTE_RECORDS=0
ROUTE_RECORDS_DIR=
ROUTE_RECORDS_TOPK=16
ROUTE_RECORDS_MAX_MB=2048

# SERVE-ACTS (4f9ba05838). Per-request research switches (docs/experiments/serve-acts.md): a request's "acts" field asks
# for hidden-state dumps at tap layers (an image prompt runs at replay 0), a text-only prompt's rows, pictures' rows
# replaced from ACTS_ROWS_DIR, or the first answer token's logits; honoured only with CACHE_TRANSFER_KEY's bearer.
# ACTS_DIR empty (the default): off, and a request carrying acts is refused (400). Set: rank 0 writes each request's
# files to ACTS_DIR/<acts id>/ from a writer thread (done.json last). Bounds, whole MiB (empty: the default): a request
# writes at most ACTS_REQUEST_MB (1024; a larger one is refused before it runs), the directory holds at most
# ACTS_TOTAL_MB (16384; past it requests are refused with 507 until it is cleared; nothing is deleted for you), and the
# rows copied for the writer hold at most ACTS_QUEUE_MB (512; a chunk that does not fit is dropped and counted, never
# waited for). A request with acts is never kept in or resumed from the prompt cache, kept states or sf-disk. Only
# rank 0 gets the keys; the plan text is unchanged.
ACTS_DIR=
ACTS_ROWS_DIR=
ACTS_REQUEST_MB=
ACTS_TOTAL_MB=
ACTS_QUEUE_MB=
# DUMP-NONDET (d1332cef3d): dump units of at most this many rows (a multiple of 128, 128..1024); empty: the whole
# unit (1024 with PREFILL_SPLIT=256). For testing whether a replay-0 dump's run-to-run difference depends on unit size.
ACTS_DUMP_ROWS=

# EXPERT-MASK (5bb471d3b9). Routed experts taken out of the router at load, for ablations without a pruned checkpoint.
# MASK_EXPERTS empty (the default): nothing is masked, the plan text is unchanged, the launch is the base's byte for
# byte. Set: a file on every rank's box (the same path and the same mask on each), 'layer:expert' or
# 'layer:e1,e2,...' lines, '#' comments (route_join.py --mask-out writes this). Every rank writes -inf into each
# masked expert's gate.bias (and gate.bias_vl) entry before the first launch, so a masked expert never enters
# top-k and the top-k weights renormalise over the unmasked experts (then routed_scaling_factor), as a checkpoint
# with those experts deleted would route. Target layers 0-39 only (never the DSpark/MTP blocks; the shared expert
# is not a routed expert); a layer may keep no fewer than top_k (6) experts. The handshake's plan text carries
# " mask=<16 hex>" (the canonical list's SHA-256), so ranks whose masks differ are refused at the link.
MASK_EXPERTS=

# ---- readiness, the probe request, shutdown
LOCK_WAIT_S=1800                 # node0's GPU lock: first_light.sh waits this long for it (node0 first)
LOCK_PAIR_S=60                   # then node1's within this, else node0's is released and the pair retried after 30 s
LOCK_TRIES=20                    # (all or nothing), at most this many times
READY_TIMEOUT_S=1800             # the weights load, the peers link and the server answers /health within this
PROBE_PROMPT='Answer in one sentence: what is the capital of France?'
PROBE_EXPECT='Paris'             # the probe's reply must contain this (case-insensitive)
PROBE_MAX_TOKENS=64
PROBE_TIMEOUT_S=600
STOP_TIMEOUT_S=120               # SIGTERM, then SIGKILL after this

# ---- the timed run (first_light.sh after ready, inside halo-quiet windows on both boxes: node0, then node1)
BENCH=1
BENCH_CASES=code,prose,prefill   # the requests (bench_stream.py), one after another, each streamed and greedy: code and
                                 # prose are the decode cases (fixed prompts of about 30 tokens), prefill the
                                 # BENCH_REPEAT prompt; each: TTFT, decode tok/s after the first token
BENCH_REPEAT=180                 # the prefill prompt: a sentence BENCH_REPEAT times, then a question (180: 1,818
                                 # tokens, one chunk)
BENCH_MAX_TOKENS=400             # each request's tokens
RUN_ROOT='$HOME/tfp/run/serve'   # each run's directory: logs, pids, resolved.json, the probe's reply
