id        = "tool.strixfold_tp4.dsv41_hip"
kind      = "tool"
summary   = "The rest of StrixFold 72c0f083's tools/dsv41-hip (242 files): the TP2 / TP4 launcher (serve_lib.sh, serve.conf, the rank and keeper scripts), the RDMA and inputs checks, the qualification, bench and kit-preparation scripts and their assets, verbatim"
why       = "The served deploy directory is the git archive of tools/dsv41-hip next to the native-hip build (restore-tfp.sh stage, deploy_rank0.sh), and the ranks start from it (DEPLOY_DIR/tools/dsv41-hip); a stage made from the catalogue (tools/flerp-stage.py) needs these files byte for byte to be the served one"
notes     = "Nothing here is compiled or imported by the build; the recipe dsv41-flash.strixfold-tp4 includes the module so the assembled tree holds the directory and [stage] copies it. Parent-owned files of tools/dsv41-hip (registry, numerics contract, tri generator inputs, zig_build.sh, rdma_check.py) stay in their modules or overlays. Cards behind the changes: 1375468e92, 01574d76b3, 3e7b8b7a47, 3760ed527a, 034bf2c6cd, f782ee5476, 716f35d40a, a1baab5e2d, d74915b5d6, b7eb57e048, 7aa8487768, 5bb471d3b9, 4f9ba05838, 28153e18f3, f64f606edd, 023c5d2ad9, e96f0f5fa0, e5cb84a995, d6a577e1a1, ee6892da53, 51591f7ba8, 1c020d2ac2, 18b8d5d277, 9757a35411, db9e4a4b4d, 6f42c090eb, 19121aad1c, 58862dad76."

