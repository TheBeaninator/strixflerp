id        = "kernel.radiance.halo_gemm_mxfp4"
kind      = "kernel"
summary   = "OCP-MXFP4 weight x fp8 activation GEMMs: the decode GEMV (M <= 8) and its wide form (9..64) whose output bits do not depend on the height, the K-split decode form up to 128 rows, the skinny m64, the gate_up form with the gated fp8 quantiser in its epilogue, and the tiled prefill GEMM"
why       = "MXFP4 is the 4-bit float form vendors publish for MoE experts; reading it directly halves the bytes of an 8-bit stream at decode without a requantisation step of our own"
notes     = "A 4-bit weight stream is half the bytes of Q8 at decode, where time is bytes over 226 GB/s. hipfire's mfp4 (linear.decode/hipfire-mfp4/f32) is the catalogue's other 4-bit float form."

[provenance]
origin    = "radiance"
repo      = "https://codeberg.org/StillDeadcode/radiance"
commit    = "38c182a2baa35e92bc1104460d7410b0daf2439a"
branch    = "main"
paths     = [
  "libhalo/halo_gemm_mxfp4a8_decode.hip",
  "libhalo/halo_gemm_mxfp4a8_gated.hip",
  "libhalo/halo_gemm_mxfp4a8_gemv.hip",
  "libhalo/halo_gemm_mxfp4a8_nt_m64.hip",
  "libhalo/halo_gemm_mxfp4a8_tiled.hip",
  "libhalo/halo_mxfp4.h",
]
authors   = ["ggz14", "slydlake", "Deadcode", "radiance contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = [
  "src/libhalo/halo_gemm_mxfp4a8_gemv.hip",
  "src/libhalo/halo_gemm_mxfp4a8_decode.hip",
  "src/libhalo/halo_gemm_mxfp4a8_nt_m64.hip",
  "src/libhalo/halo_gemm_mxfp4a8_gated.hip",
  "src/libhalo/halo_gemm_mxfp4a8_tiled.hip",
]
includes  = ["src/libhalo"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "linear.decode/radiance-mxfp4/e4m3-f32"
api       = "halo_gemm_mxfp4a8_gemv, _gemv_wide, _decode, _nt_m64, _gated_gemv"
numeric   = "e2m1 nibbles with an E8M0 scale per 32, fp32 accumulate; row-height invariant"
regime    = "decode and verify heights (1..64 rows), a weight stream bound by ~256 GB/s LPDDR5X"

[[provides]]
interface = "linear.prefill/radiance-mxfp4/e4m3-f32"
api       = "halo_gemm_mxfp4a8_tiled"
numeric   = "as decode"
regime    = "prefill row counts (tiled), compute-bound on the wave32 WMMA cores"

[[requires]]
module    = "kernel.radiance.halo_common"

[[requires]]
module    = "kernel.radiance.halo_gemm_fp8"

[[requires]]
module    = "kernel.radiance.halo_gdn"

[[requires]]
module    = "kernel.radiance.halo_gemm_int"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "a translation unit of libhalo.so: built by radiance CMake (rad_hipify, -ffp-contract=off) against abi/, not compiled by this harvest"
