id        = "kernel.radiance.halo_dflash"
kind      = "kernel"
summary   = "The DFlash2 block-diffusion drafter's kernels: the grouped dynamic depthwise convolution (fused) and the candidate selector (edge scores and the path walk, one workgroup a sequence)"
why       = "a block-diffusion drafter proposes a whole block in one pass, a different speculation shape from the MTP head, and needs its own convolution and path-selection kernels"

[provenance]
origin    = "radiance"
repo      = "https://codeberg.org/StillDeadcode/radiance"
commit    = "38c182a2baa35e92bc1104460d7410b0daf2439a"
branch    = "main"
paths     = [
  "libhalo/halo_dflash_conv_body.h",
  "libhalo/halo_dflash_conv_t2_g16_bf16.hip",
  "libhalo/halo_dflash_select_bf16.hip",
]
authors   = ["Deadcode", "radiance contributors"]
modified  = false

[licence]
spdx      = "Apache-2.0"

[build]
lang      = "hip-c++"
sources   = ["src/libhalo/halo_dflash_conv_t2_g16_bf16.hip", "src/libhalo/halo_dflash_select_bf16.hip"]
includes  = ["src/libhalo"]
arch      = "gfx1151"
toolchain = "therock-10.1"

[[provides]]
interface = "speculation.draft/dflash/bf16.radiance"
api       = "halo_dflash_conv_t2_g16_bf16, halo_dflash_select_bf16"
numeric   = "bf16, fp32 accumulate"
regime    = "a whole draft block in one backbone pass"

[[requires]]
module    = "kernel.radiance.halo_common"

[[requires]]
module    = "kernel.radiance.halo_chain"

[[requires]]
module    = "kernel.radiance.halo_gdn"

[gate]
parity    = "none"
bench     = "none"
status    = "harvested"
compile   = "n/a"
reason    = "a translation unit of libhalo.so: built by radiance CMake (rad_hipify, -ffp-contract=off) against abi/, not compiled by this harvest"
