sources   = [
  "src/libhalo/halo_ar_entry.hip",
  "src/libhalo/halo_ar_gather_2rank.hip",
  "src/libhalo/halo_ar_gather_Nrank.hip",
  "src/libhalo/halo_ar_oneshot_2rank_exact.hip",
  "src/libhalo/halo_ar_oneshot_2rank_wht6.hip",
  "src/libhalo/halo_ar_oneshot_Nrank_exact.hip",
