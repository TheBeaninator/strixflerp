id        = "kernel.radiance.halo_allreduce"
kind      = "kernel"
summary   = "Tensor-parallel collectives as device kernels: one-shot and two-shot (reduce-scatter + all-gather) all-reduce and all-gather at 2, 3, 4 and 8 ranks over peer-mapped memory, on an exact wire (bf16 / f16 / f32) or a lossy one (Walsh-Hadamard rotated 6-bit, three-tier int8), with the handshake, link-hold and shard rules; and the all-reduce fused with the residual add, RMS norm, block Hadamard and int8 quantiser that always follow it"
why       = "tensor parallelism spends its time in collectives, so radiance runs them as device kernels with a compressed wire and fuses the work that always follows a reduce"
notes     = "Written for cards that map each other's memory over PCIe; the pod's ranks are separate machines on a 100 GbE RoCE rail (runtime.strixfold.coll_rdma, kernel.strixfold.coll_proxy). What carries over: the compressed wire (the rail carries fp32 partials today) and the fused all-reduce + norm + quantise epilogue. docs/TP4.md in the origin lists every TP4 lever tried and what closed it."

