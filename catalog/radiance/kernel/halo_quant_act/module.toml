id        = "kernel.radiance.halo_quant_act"
kind      = "kernel"
summary   = "Junction kernels that write the quantised activation the next GEMM reads, so a quantised trunk adds no quantiser launch: per-row int8 and per-(row, 128) E4M3 quantisers alone, and fused behind their producers (residual add + RMS norm, RMS norm + block Hadamard, gated product + Hadamard, gelu(gate) * up, and producers that already hold the row in registers); ParoQuant's Givens rotation dense on the matrix cores or to f16; and the GPTQ Gram accumulation H += X^T X"
why       = "an integer GEMM needs integer activations, and a separate quantiser launch per junction would cost more than the GEMM saves, so the producer that already holds the row writes the codes"
notes     = "The fusion that paid in radiance is producer + quantiser (it removes a launch AND a pass over the row). SFX-PKG measured strixite's plain boundary fusion at 0.9 % of a step; this family is the reason to revisit it only together with int8 activations."

