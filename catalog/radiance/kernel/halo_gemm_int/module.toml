numeric   = "integer or f16 products, fp32 accumulate, a scale per (row, group of K); int8 activations are written by the producer (kernel.radiance.halo_quant_act)"
regime    = "decode and verify heights (1..64 rows), a weight stream bound by ~256 GB/s LPDDR5X"

