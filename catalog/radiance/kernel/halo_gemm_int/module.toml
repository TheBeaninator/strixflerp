id        = "kernel.radiance.halo_gemm_int"
kind      = "kernel"
summary   = "Integer-weight GEMMs: 2-, 4-, 5- and 8-bit weights against int8 activations (w2a8, w4a8, w8a8, the asymmetric w4a8i8 / w5a8i8) or f16 activations (w4a16, w5a16, w8a16), each as a skinny form up to 64 rows and a tiled prefill form with double-buffered LDS, and the 4-bit weight unpacked to row-major bf16 for prefill"
why       = "decode on Strix Halo is weight bytes over memory bandwidth, so integer weights at 2 to 8 bits with integer activations are how radiance buys speed and how it fits a 113 GiB model in a rank's memory"
notes     = "The W8A8 trunk is radiance's served form of Qwen3.8-Flash-Next (int8 trunk and lm_head, w4 experts: docs/MOE-W4.md, KL 0.0789 all / 0.0239 text vs bf16, floor 0.0399 / 0.0111). strixite serves Q8 weights with bf16 activations (linear_q8); int8 activations halve the activation bytes a verify GEMM re-reads at M = 2..16 (the PF-13 surface)."

