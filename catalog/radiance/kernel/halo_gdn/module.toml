id        = "kernel.radiance.halo_gdn"
kind      = "kernel"
summary   = "Gated delta net (the 36 linear-attention layers of Qwen3.8-Flash-Next): the depthwise causal convolution with the work fused around it per serving phase, the chunk preamble as one kernel (the (I + strict_lower(...))^-1 solve, chunk 64), the chunked scan on WMMA for prefill, the recurrent state update for decode (fp32 state), and the gated RMS norm alone or fused with the block Hadamard and int8 quantiser that feeds out_proj"
why       = "three of every four Flash-Next layers are gated delta nets, with a recurrence that is a per-token update at decode and a chunked triangular solve at prefill; each phase needs its own kernel to reach the part's limits"
notes     = "strixite: kernel.strixite.gdn (delta_rule one block per value head), rmsnorm_gated and gdn_front as separate launches (FOLD-2 8c7f1aab87 folds them); the GDN input projections are 3.94 ms of a 32.9 ms decode step (strixite-perf-ranking.md)."

