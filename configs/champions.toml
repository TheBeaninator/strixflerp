# Champion ledger (see docs/CHAMPIONS.md and flerp champion --help). Edited by `flerp champion propose`, not by hand.

[area.decode-single]
description = "Decode speed of one stream"
unit        = "tok/s"
direction   = "higher"
fidelity    = "identity"
floor_text  = "identity: the generated ids equal the drafts-off, per-token-path greedy ids byte for byte"

[area.throughput]
description = "Total decode speed over many concurrent streams"
unit        = "tok/s"
direction   = "higher"
fidelity    = "identity"
floor_text  = "identity per stream against the same stream run alone"

[area.prefill]
description    = "Prompt pass speed"
unit           = "tok/s"
direction      = "higher"
fidelity       = "kl"
fidelity_bound = 0.0176
floor_text     = "mean KL vs the FP32 reference <= 0.0176, today's per-token path's own distance (owner 2026-11-14; gate/prefill-ornith.toml amendment)"

[area.ttft]
description = "Time to first token, per prompt length"
unit        = "s"
direction   = "lower"
fidelity    = "identity"
floor_text  = "identity of the first token and the ids after it against the per-token path (grouped prefill falls under the prefill KL floor instead)"

