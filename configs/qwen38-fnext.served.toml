# Qwen3.8-Flash-Next as the fleet serves it today (strixite module set, strixw v4 row-major weights): the baseline every
# Flash-Next champion is measured against on the same box. Informational keys (recipe, weights) say what a launcher builds
# and loads; the strixite server takes no stage/env settings from here.
name        = "qwen38-fnext.served"
description = "Flash-Next served path: recipe qwen38-flash-next.strixite-pf (strixite's served modules; STRIXFLERP_PF_COMBINE off), fleet weights.strixw v4"
model       = "qwen3.8-flash-next"
areas       = ["prefill"]
includes    = []
recipe      = "qwen38-flash-next.strixite-pf"
weights     = "/data/models/strix-infer/converted/qwen38-fnext-tpn/weights.strixw"

